<!doctype html>
<html><head><meta charset="utf-8" /><title>v3.7 harness</title>
<style>
  html,body{margin:0;padding:0;background:#12141a}
  #wrap{display:inline-block;background:#fff;vertical-align:top}
  iframe{border:0;background:#fff;display:block}
</style>
</head><body>
<div id="wrap"><iframe id="f"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var w = Number(q.get("w") || 1280), h = Number(q.get("h") || 800);
  var src = q.get("src") || "preview-v37-tmp.html";
  var f = document.getElementById("f");
  f.width = String(w); f.height = String(h);
  f.src = src;

  var H = {};
  window.H = H;
  H.ready = false;
  H.timers = [];
  H.virtual = 0;
  H.patched = false;

  f.addEventListener("load", function () {
    try {
      var win = f.contentWindow;
      win.__errors = [];
      H.ready = true;
    } catch (e) {}
  });

  H.W = function () { return f.contentWindow; };
  H.D = function () { return f.contentDocument; };
  H.wait = function (ms) { return new Promise(function (r) { window.setTimeout(r, ms); }); };

  // 앱 타이머를 붙잡아 두고 원하는 순간에 하나씩 흘려보낸다
  H.patch = function () {
    var win = H.W();
    if (H.patched) return "already";
    H.patched = true;
    H.origSetTimeout = win.setTimeout;
    H.origClearTimeout = win.clearTimeout;
    var seq = 0;
    win.setTimeout = function (fn, ms) {
      var id = ++seq;
      H.timers.push({ id: id, fn: fn, due: H.virtual + (Number(ms) || 0), args: Array.prototype.slice.call(arguments, 2) });
      return id;
    };
    win.clearTimeout = function (id) {
      H.timers = H.timers.filter(function (t) { return t.id !== id; });
    };
    win.requestAnimationFrame = function (fn) { return win.setTimeout(fn, 16); };
    return "patched";
  };

  // 대기 중인 타이머를 시간 순서대로 실행 (예약된 새 타이머도 이어서 실행)
  H.runDue = function (limit) {
    var n = 0;
    var guard = 0;
    while (guard++ < 60) {
      var idx = -1, best = Infinity;
      for (var i = 0; i < H.timers.length; i++) {
        if (H.timers[i].due <= limit && H.timers[i].due < best) { best = H.timers[i].due; idx = i; }
      }
      if (idx < 0) break;
      var t = H.timers.splice(idx, 1)[0];
      H.virtual = Math.max(H.virtual, t.due);
      try { t.fn.apply(null, t.args || []); } catch (e) { H.lastErr = String(e); }
      n++;
    }
    return n;
  };

  // 애니메이션을 특정 시점(ms)에서 멈춘다
  H.freeze = function (ms) {
    var doc = H.D();
    var st = doc.getElementById("freeze");
    if (!st) {
      st = doc.createElement("style");
      st.id = "freeze";
      doc.head.appendChild(st);
    }
    st.textContent = ".nbf-shut *, .nbf-shut{animation-play-state:paused !important;}" +
      (ms === null ? "" : (".nbf-shut *, .nbf-shut{animation-delay:-" + ms + "ms !important;}"));
    return "frozen@" + ms;
  };
  H.unfreeze = function () {
    var doc = H.D();
    var st = doc.getElementById("freeze");
    if (st) st.remove();
    return "live";
  };

  H.call = function (name, a, b, c) {
    var win = H.W();
    if (typeof win[name] !== "function") return "no " + name;
    try { win[name](a, b, c); return "ok"; } catch (e) { return "err " + e; }
  };
  H.eval = function (src) {
    try { return JSON.stringify(H.W().eval(src)); } catch (e) { return "err " + e; }
  };
  H.info = function () {
    var win = H.W();
    var sp = H.D().querySelector(".nb-spread");
    var r = sp ? sp.getBoundingClientRect() : null;
    return JSON.stringify({
      errors: win.__errors || [],
      tab: win.state && win.state.activeTab,
      spread: sp ? { w: Math.round(r.width), h: Math.round(r.height), x: Math.round(r.x), y: Math.round(r.y), side: sp.dataset.side, cover: sp.dataset.cover, closing: sp.dataset.closing, cls: sp.className } : null
    });
  };
</script>
</body></html>
