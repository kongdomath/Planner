<!doctype html>
<html><head><meta charset="utf-8" /><title>v4.1 검증 하네스</title>
<style>
  html,body{margin:0;background:#0f1117;color:#dfe3ea;font:12px/1.5 ui-monospace,Menlo,monospace}
  #out{padding:8px 12px;white-space:pre-wrap;font-size:11px}
  iframe{border:1px solid #333;display:block;margin:6px 12px;background:#fff}
</style>
</head><body>
<pre id="out">running…</pre>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = Number(q.get("w") || 1024), h = Number(q.get("h") || 768);
var tab = q.get("tab") || "archive";
var f = document.getElementById("f");
f.width = String(w); f.height = String(h); f.src = "index.html?h=" + Date.now();
var out = document.getElementById("out");
var res = { viewport: w + "x" + h, tab: tab };

function box(el) {
  if (!el) return null;
  var b = el.getBoundingClientRect();
  return { x: Math.round(b.left), y: Math.round(b.top), w: Math.round(b.width), h: Math.round(b.height) };
}

f.onload = function () { setTimeout(run, 1200); };

function run() {
  var W = f.contentWindow, D = f.contentDocument, P = W.__planner;
  if (!P) { out.textContent = "no __planner"; return; }
  res.version = P.version;
  try {
    P.setTab(tab);
    P.render();
  } catch (e) { res.tabError = String(e); }
  setTimeout(function () {
    var st = P.getState();
    res.activeTab = st.activeTab;
    var btns = [].slice.call(D.querySelectorAll(".nb-cover-btn"));
    res.covers = btns.map(function (b) {
      var cs = W.getComputedStyle(b);
      var cover = b.querySelector(".nb-cover");
      var face = b.querySelector(".nb-cover-face");
      var title = b.querySelector(".nb-cover-face b");
      var foot = b.querySelector(".nb-cover-face-foot");
      return {
        active: b.classList.contains("is-active"),
        rect: box(b),
        opacity: cs.opacity,
        filter: cs.filter,
        transform: (cs.transform || "").slice(0, 90),
        chip: !!b.querySelector(".nb-cover-chip"),
        hasFace: !!face,
        titleFont: title ? W.getComputedStyle(title).fontFamily : null,
        titleSize: title ? W.getComputedStyle(title).fontSize : null,
        text: (title ? title.textContent : "") + " | " + (foot ? foot.textContent : ""),
        faceBox: box(face), footBox: box(foot)
      };
    });
    res.carouselMask = (function () {
      var el = D.querySelector(".nb-carousel");
      if (!el) return null;
      var cs = W.getComputedStyle(el);
      return (cs.maskImage || cs.webkitMaskImage || "none");
    })();
    res.errors = (W.__errors || []).slice(0, 5);
    out.textContent = JSON.stringify(res, null, 1);
  }, 700);
}
</script>
</body></html>
