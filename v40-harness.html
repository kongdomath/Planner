<!doctype html>
<html><head><meta charset="utf-8" /><title>v4.0 책 크기 검증</title>
<style>
  html,body{margin:0;background:#12141a;color:#dfe3ea;font:12px/1.5 ui-monospace,Menlo,monospace}
  #out{padding:10px 14px;white-space:pre-wrap}
  iframe{border:1px solid #333;display:block;margin:6px 14px;background:#fff}
</style>
</head><body>
<pre id="out">running…</pre>
<iframe id="f"></iframe>
<script>
var q = new URLSearchParams(location.search);
var w = Number(q.get("w") || 390), h = Number(q.get("h") || 844);
var src = q.get("src") || "index.html";
var f = document.getElementById("f");
f.width = String(w); f.height = String(h); f.src = src;
var out = document.getElementById("out");
var res = { viewport: w + "x" + h, src: src };
function log() { out.innerHTML = JSON.stringify(res, null, 1); }

function r(el) {
  if (!el) return null;
  var b = el.getBoundingClientRect();
  return { x: Math.round(b.left * 10) / 10, y: Math.round(b.top * 10) / 10, w: Math.round(b.width * 10) / 10, h: Math.round(b.height * 10) / 10 };
}
function q1(d, sel) { return d.querySelector(sel); }

f.onload = function () { setTimeout(run, 900); };

function run() {
  var W = f.contentWindow, D = f.contentDocument, P = W.__planner;
  if (!P) { out.innerHTML = "no __planner"; return; }
  res.version = P.version;
  var st = P.getState();
  var bs = Array.isArray(st.books) ? st.books : (st.books = []);
  if (!bs.some(function (b) { return b.id === "tb1"; })) bs.unshift({ id: "tb1", title: "차", subtitle: "차를 기록하다", category: "독서 · 문화", spine: "#3f6f6a", cover: "" });
  if (!bs.some(function (b) { return b.id === "tb2"; })) bs.push({ id: "tb2", title: "여행", subtitle: "여행 노트", category: "생활 · 루틴", spine: "#5b4a72", cover: "" });
  if (!bs.some(function (b) { return b.id === "tb3"; })) bs.push({ id: "tb3", title: "전시", subtitle: "전시 기록", category: "독서 · 문화", spine: "#8a5a3c", cover: "" });
  st.shelfSelectedBookId = "tb1";
  var openId = (bs.filter(function (b) { return b.id === "tb1"; })[0] || bs[0] || {}).id;

  function shot(name, extra) {
    var o = {};
    var stage = q1(D, ".nb-stage");
    o.stage = r(stage);
    o.bodyScrollH = D.documentElement.scrollHeight;
    o.innerH = W.innerHeight;
    if (extra) extra(o);
    res[name] = o;
  }

  var steps = [];
  var next = function (fn, ms) { steps.push([fn, ms || 500]); };
  var runner = function () {
    if (!steps.length) { res.errors = (P.errors && P.errors()) || []; res.ok = true; log(); return; }
    var s = steps.shift();
    try { s[0](); } catch (e) { res["err_" + steps.length] = String(e); }
    setTimeout(runner, s[1]);
  };

  next(function () {
    P.setTab("archive"); P.render();
    shot("archiveShelf", function (o) {
      var btn = q1(D, ".nb-cover-btn.is-active");
      o.book = r(btn); o.cover = r(btn && btn.querySelector(".nb-cover"));
      o.carousel = r(q1(D, ".nb-carousel"));
      o.actions = r(q1(D, ".nb-actions"));
      o.meta = r(q1(D, ".nb-book-meta"));
      o.overlapActions = (o.carousel && o.actions) ? Math.round((o.carousel.y + o.carousel.h - o.actions.y) * 10) / 10 : null;
      o.actionsPastStage = (o.stage && o.actions) ? Math.round((o.actions.y + o.actions.h - (o.stage.y + o.stage.h)) * 10) / 10 : null;
      o.cs = q1(D, ".nb-carousel") ? W.getComputedStyle(q1(D, ".nb-carousel")).getPropertyValue("--cs") : null;
      o.titleFont = q1(D, ".nb-cover-btn.is-active .nb-cover-title b") ? W.getComputedStyle(q1(D, ".nb-cover-btn.is-active .nb-cover-title b")).fontSize : null;
      o.neighbors = [].slice.call(D.querySelectorAll(".nb-cover-btn:not(.is-active)")).map(r);
    });
  }, 500);

  next(function () {
    P.setTab("year"); P.render();
    shot("yearShelf", function (o) {
      var btn = q1(D, ".nb-cover-btn.is-active");
      o.book = r(btn);
      o.carousel = r(q1(D, ".nb-carousel"));
      o.actions = r(q1(D, ".nb-actions"));
      o.overlapActions = (o.carousel && o.actions) ? Math.round((o.carousel.y + o.carousel.h - o.actions.y) * 10) / 10 : null;
      o.yearPlateFont = q1(D, ".nb-cover-btn.is-active .nb-year-plate b") ? W.getComputedStyle(q1(D, ".nb-cover-btn.is-active .nb-year-plate b")).fontSize : null;
    });
  }, 500);

  next(function () {
    P.setTab("goals"); P.render();
    shot("goalsCover", function (o) {
      o.spread = r(q1(D, "#goalSpread"));
      o.face = r(q1(D, "#goalSpread .nb-page--cover"));
      o.bookArea = r(q1(D, ".nb-book"));
    });
  }, 600);

  next(function () {
    P.goalBookStep(1);
    shot("goalsPage1", function (o) { o.spread = r(q1(D, "#goalSpread")); });
  }, 600);

  next(function () {
    P.setTab("archive"); P.render();
    P.openNotebook(openId);
  }, 900);

  next(function () {
    shot("archiveOpenCover", function (o) {
      o.spread = r(q1(D, "#nbSpread"));
      o.face = r(q1(D, "#nbSpread .nb-page--cover"));
    });
    P.setTab("year"); P.render();
    P.openYearBook(2026, 11);
  }, 900);

  next(function () {
    shot("yearOpenCover", function (o) {
      o.spread = r(q1(D, "#nbYearSpread"));
      o.face = r(q1(D, "#nbYearSpread .nb-page--cover"));
    });
    // 12월 끝에서 닫기 (A안) — 닫히는 표지 글자가 잘리지 않는지 샘플링
    var samples = [];
    var t0 = Date.now();
    var raf = W.requestAnimationFrame || function (fn) { return setTimeout(fn, 16); };
    var sample = function () {
      var card = q1(D, ".nbf-shut-closed");
      var face = q1(D, ".nbf-shut-card-face");
      var b = face && face.querySelector(".nb-coverface-plate b");
      if (card && b && W.getComputedStyle(card).visibility !== "hidden") {
        var fr = face.getBoundingClientRect(), br = b.getBoundingClientRect();
        samples.push({
          t: Date.now() - t0,
          card: r(card), b: r(b), text: b.textContent,
          clipL: Math.round((fr.left - br.left) * 10) / 10,
          clipR: Math.round((br.right - fr.right) * 10) / 10,
          sw: b.scrollWidth, cw: b.clientWidth
        });
      }
      if (Date.now() - t0 < 1500) raf(sample);
      else {
        res.closeTest = { count: samples.length, first: samples[0] || null, mid: samples[Math.floor(samples.length / 2)] || null, last: samples[samples.length - 1] || null };
        return;
      }
    };
    P.closeYearBook("back");
    raf(sample);
  }, 2200);
  // 마지막 step은 자체 rAF 샘플러를 돌린 뒤 위 타이머로 runner가 마무리한다

  runner();
}
</script>
</body></html>
