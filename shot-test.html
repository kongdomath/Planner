<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planner v3.6 화면 검증</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e131d; font: 12px/1.4 system-ui, -apple-system, sans-serif; color: #cfd6e6; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; position: sticky; top: 0; background: #0e131df2; z-index: 5; }
  .bar b { margin-right: 6px; }
  .bar button { font: inherit; padding: 5px 10px; border-radius: 7px; border: 1px solid #3b4763; background: #1b2331; color: #e7ecf7; cursor: pointer; }
  .bar button:hover { background: #27324a; }
  .bar button.on { background: #f6f7fb; color: #1d2432; border-color: #f6f7fb; }
  .frame-wrap { padding: 8px 10px 24px; }
  iframe { border: 0; display: block; background: #141a26; box-shadow: 0 0 0 1px #2a3448; }
</style>
</head>
<body>
  <div class="bar">
    <b>크기</b>
    <button data-w="390" data-h="844" onclick="pick(this)">모바일 390×844</button>
    <button data-w="1024" data-h="768" onclick="pick(this)">아이패드 1024×768</button>
    <button data-w="1280" data-h="800" onclick="pick(this)">데스크톱 1280×800</button>
    <span style="width:12px"></span>
    <b>화면</b>
    <button onclick="run('calendar')">Calendar</button>
    <button onclick="run('month')">달력</button>
    <button onclick="run('day')">일기</button>
    <button onclick="run('dayPhoto')">사진일기</button>
    <button onclick="run('goals')">Goals 앞표지</button>
    <button onclick="run('goalsPage')">Goals 페이지</button>
    <button onclick="run('goalsBack')">Goals 뒤표지</button>
    <button onclick="run('archive')">Archive 책장</button>
    <button onclick="run('archivePhoto')">사진 기록</button>
    <button onclick="run('archiveNone')">사진없는 기록</button>
    <button onclick="run('archiveEnd')">Archive 끝</button>
    <button onclick="run('newArchive')">새 기록 모달</button>
    <button onclick="run('goalModal')">목표 모달</button>
    <button onclick="run('search')">검색</button>
    <button onclick="run('settings')">설정</button>
  </div>
  <div class="frame-wrap"><iframe id="f" width="1280" height="800" src="./index.html?v=1795848288"></iframe></div>
  <script>
    const f = document.getElementById("f");
    function pick(btn) {
      document.querySelectorAll(".bar button[data-w]").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      f.width = btn.dataset.w;
      f.height = btn.dataset.h;
    }
    pick(document.querySelector('.bar button[data-w="1280"]'));
    function P() { return f.contentWindow.__planner; }
    function openBookOf(withPhotos) {
      const p = P();
      const st = p.getState();
      const rec = (st.archives || []).find(a => !!((a.images || []).length) === withPhotos);
      const book = rec ? (st.books || []).find(b => b.id === rec.bookId) : null;
      const target = book || (st.books || [])[0];
      if (!target) return;
      p.setTab("archive");
      p.openNotebook(target.id);
      const list = (st.archives || []).filter(a => a.bookId === target.id);
      const at = rec ? list.findIndex(a => a.id === rec.id) : 0;
      if (at > 0) { st.notebookPageIndex = at; p.render(); }
    }
    function run(name) {
      const p = P();
      if (!p) { alert("앱이 아직 준비되지 않았습니다"); return; }
      const st = p.getState();
      if (name === "calendar") { p.setTab("year"); p.closeYearDay && p.closeYearDay(); p.closeYearBook && p.closeYearBook(); p.render(); }
      if (name === "month") { p.setTab("year"); p.openYearBook(st.selectedDate ? Number(st.selectedDate.slice(0,4)) : 2026); p.render(); }
      if (name === "day") { p.setTab("year"); p.openYearDay(st.selectedDate || "2026-11-28"); p.render(); }
      if (name === "dayPhoto") {
        p.setTab("year");
        const day = Object.keys(st.logs || {}).find(d => ((st.logs[d].photos || []).length)) || st.selectedDate;
        p.openYearDay(day); p.render();
      }
      if (name === "goals") { p.setTab("goals"); st.goalBookPage = 0; p.render(); }
      if (name === "goalsPage") { p.setTab("goals"); st.goalBookPage = 1; p.render(); }
      if (name === "goalsBack") { p.setTab("goals"); st.goalBookPage = 999; p.render(); }
      if (name === "archive") { p.setTab("archive"); p.closeNotebookBook(); p.render(); }
      if (name === "archivePhoto") openBookOf(true);
      if (name === "archiveNone") openBookOf(false);
      if (name === "archiveEnd") {
        p.setTab("archive");
        const b = (st.books || [])[0];
        if (b) { p.openNotebook(b.id); const n = (st.archives || []).filter(a => a.bookId === b.id).length; st.notebookPageIndex = n; p.render(); }
      }
      if (name === "newArchive") { p.setTab("archive"); p.openNewArchiveModal(""); }
      if (name === "goalModal") { p.setTab("goals"); p.openGoalModal(""); }
      if (name === "search") { p.openSearch(); }
      if (name === "settings") { p.openSettings(); }
    }
    window.addEventListener("load", () => { setTimeout(() => run("month"), 700); });
  </script>
</body>
</html>
