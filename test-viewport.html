<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Planner viewport test</title>
<style>
  html, body { margin: 0; padding: 0; background: #10151f; font: 12px/1.4 system-ui, sans-serif; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 8px 10px; color: #cfd6e6; }
  .bar button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #46536e; background: #1e2536; color: #e7ecf7; cursor: pointer; }
  .bar button:hover { background: #2a3450; }
  .row { display: flex; gap: 16px; padding: 0 8px 8px; align-items: flex-start; }
  iframe { border: 0; display: block; background: #141a26; }
</style>
</head>
<body>
  <div class="bar">
    <b>mobile 390 스와이프</b>
    <button onclick="swipeMobile(-1)">◀ 이전 장</button>
    <button onclick="swipeMobile(1)">다음 장 ▶</button>
  </div>
  <div class="row">
    <iframe id="mobile" src="./index.html?v=35c" width="390" height="844" title="mobile 390x844"></iframe>
    <iframe id="desktop" src="./index.html?v=35c" width="1280" height="800" title="desktop 1280x800"></iframe>
  </div>
  <script>
    function swipeMobile(dir) {
      const frame = document.getElementById("mobile");
      const doc = frame.contentDocument;
      const el = doc.getElementById("goalSpread") || doc.getElementById("nbSpread") || doc.getElementById("nbYearSpread") || doc.getElementById("nbDaySpread");
      if (!el) return;
      const startX = dir > 0 ? 300 : 90;
      const endX = dir > 0 ? 90 : 300;
      const mkTouch = (x) => new Touch({ identifier: 1, target: el, clientX: x, clientY: 320, pageX: x, pageY: 320 });
      const fire = (type, x, withTouches) => {
        const t = mkTouch(x);
        el.dispatchEvent(new TouchEvent(type, {
          bubbles: true, cancelable: true, composed: true,
          touches: withTouches ? [t] : [],
          targetTouches: withTouches ? [t] : [],
          changedTouches: [t]
        }));
      };
      fire("touchstart", startX, true);
      fire("touchend", endX, false);
    }
  </script>
</body>
</html>
