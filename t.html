<!doctype html>
<html><head><meta charset="utf-8" /><title>v3.2 touch test</title>
<style>
  html,body{margin:0;background:#12141a;color:#dfe3ea;font:12px/1.55 ui-monospace,Menlo,monospace}
  #out{padding:10px 14px;white-space:pre-wrap}
  .pass{color:#6ee7a0}.fail{color:#ff8d8d}
  iframe{border:1px solid #333;display:block;margin:6px 14px}
</style>
</head><body>
<pre id="out">running…</pre>
<iframe id="f" width="390" height="844"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = Number(q.get("w") || 390), h = Number(q.get("h") || 844);
  var src = q.get("src") || "preview-v32-tmp.html";
  var f = document.getElementById("f");
  f.width = w; f.height = h;
  var lines = [];
  function log(txt, ok) {
    lines.push((ok === undefined ? "· " : (ok ? "PASS " : "FAIL ")) + txt);
    document.getElementById("out").innerHTML = lines.join("\n");
  }
  var wait = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function W() { return f.contentWindow; }
  function D() { return f.contentDocument; }

  // 손가락 탭: start → (몇 px 흔들림) → end
  function tap(el, jitter) {
    var r = el.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    var j = jitter === undefined ? 7 : jitter;
    var win = W();
    var pt = function (dx, dy) {
      return new win.Touch({
        identifier: 11, target: el,
        clientX: x + dx, clientY: y + dy, pageX: x + dx, pageY: y + dy,
        screenX: x + dx, screenY: y + dy,
        radiusX: 9, radiusY: 9, force: 1
      });
    };
    var send = function (type, t, active) {
      el.dispatchEvent(new win.TouchEvent(type, {
        touches: active ? [t] : [], targetTouches: active ? [t] : [], changedTouches: [t],
        bubbles: true, cancelable: true, composed: true
      }));
    };
    var a = pt(0, 0), b = pt(j, j * 0.6), c = pt(j + 1, j * 0.7);
    send("touchstart", a, true);
    send("touchmove", b, true);
    send("touchend", c, false);
    // 브라우저가 touchend 뒤에 보내는 클릭도 그대로 흉내 낸다
    el.click();
  }

  // 끌기: start → 40px 이동 → end
  function drag(carousel, dx) {
    var el = carousel.querySelector(".nb-cover-btn.is-active") || carousel;
    var r = el.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    var win = W();
    var pt = function (tx, ty) {
      return new win.Touch({ identifier: 12, target: carousel, clientX: tx, clientY: ty, pageX: tx, pageY: ty, screenX: tx, screenY: ty, radiusX: 9, radiusY: 9, force: 1 });
    };
    var send = function (type, t, active) {
      carousel.dispatchEvent(new win.TouchEvent(type, {
        touches: active ? [t] : [], targetTouches: active ? [t] : [], changedTouches: [t],
        bubbles: true, cancelable: true, composed: true
      }));
    };
    send("touchstart", pt(x, y), true);
    for (var i = 1; i <= 4; i++) send("touchmove", pt(x + (dx * i) / 4, y), true);
    send("touchend", pt(x + dx, y), false);
  }

  async function run() {
    await new Promise(function (r) { f.addEventListener("load", r, { once: true }); });
    f.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "v=" + Date.now();
    await new Promise(function (r) { f.addEventListener("load", r, { once: true }); });
    await wait(700);
    var P = W().__planner;
    log("app " + P.version + " loaded, window.__errors=" + W().__errors.length);

    // 1) Calendar 책장: 가운데 책을 손가락으로 탭
    P.setTab("year");
    P.closeYearBook();
    P.render();
    await wait(250);
    var active = D().querySelector('.nb-carousel[data-shelf="year"] .nb-cover-btn.is-active');
    var y0 = active && active.dataset.year;
    log("shelf active cover found: " + y0, !!active);
    tap(active, 8);
    await wait(500);
    var openedMonth = !!D().querySelector("#nbYearSpread");
    log("Calendar: 손가락 탭으로 책이 펼쳐짐 (month spread)", openedMonth);
    var data = D().querySelector(".nb-spread");
    log("Calendar: 열린 스프레드 id=" + (data && data.id));

    // 2) Calendar: 책 안에서 뒤로(달력) 다시 책장으로
    P.closeYearBook();
    P.render();
    await wait(200);

    // 3) Calendar 책장: 옆 책 탭 → 그 책으로 이동 (펼쳐지지 않음)
    P.setTab("year");
    P.render();
    await wait(200);
    var side = D().querySelectorAll('.nb-carousel[data-shelf="year"] .nb-cover-btn:not(.is-active)')[0];
    var sideYear = side && side.dataset.year;
    tap(side, 6);
    await wait(700);
    var newActive = D().querySelector('.nb-carousel[data-shelf="year"] .nb-cover-btn.is-active');
    log("Calendar: 옆 책 탭 → 가운데 책이 " + (newActive && newActive.dataset.year) + "로 이동", !!newActive && newActive.dataset.year === sideYear);
    log("Calendar: 옆 책 탭은 펼치지 않음", !D().querySelector("#nbYearSpread"));

    // 4) Archive 책장: 가운데 책 탭
    P.setTab("archive");
    P.closeNotebookBook();
    P.render();
    await wait(300);
    var a0 = D().querySelector('.nb-carousel[data-shelf="archive"] .nb-cover-btn.is-active');
    log("archive active cover found", !!a0);
    tap(a0, 9);
    await wait(600);
    log("Archive: 손가락 탭으로 노트가 펼쳐짐 (#nbSpread)", !!D().querySelector("#nbSpread"));

    // 5) 끌기 드래그는 여전히 책장을 넘기고, 책을 열지 않는다
    P.closeNotebookBook();
    P.render();
    await wait(300);
    var before = P.getState().shelfSelectedBookId;
    var car = D().querySelector('.nb-carousel[data-shelf="archive"]');
    drag(car, -90);
    await wait(800);
    var after = P.getState().shelfSelectedBookId;
    log("Archive: 옆으로 끌면 다음 책으로 넘어감 (" + before + " → " + after + ")", before !== after);
    log("Archive: 끌기는 책을 열지 않음", !D().querySelector("#nbSpread"));

    // 6) 달력 → 일기: 3D 책 넘김이 실제로 그려지는지
    P.setTab("year");
    P.openYearBook(2026, 10);
    P.render();
    await wait(300);
    var flipSeen = false;
    var sp = D().querySelector("#mainView") || D().body;
    var Obs = W().MutationObserver;
    var obs = new Obs(function (muts) {
      muts.forEach(function (m) {
        Array.prototype.forEach.call(m.addedNodes, function (n) {
          if (n.classList && (n.classList.contains("nb-flip") || n.classList.contains("nb-flip-leaf"))) flipSeen = true;
        });
      });
    });
    if (sp) obs.observe(sp, { childList: true, subtree: true });
    var cell = null;
    Array.prototype.forEach.call(D().querySelectorAll(".nb-day"), function (b) {
      var al = b.getAttribute("aria-label") || "";
      if (al.indexOf("11월 28일") >= 0) cell = b;
    });
    log("Calendar: 28일 칸 찾음", !!cell);
    cell.click();
    await wait(500);
    if (obs.disconnect) obs.disconnect();
    log("Calendar: 달력→일기 전환에 3D 책 넘김 종이가 실제로 그려짐", flipSeen);
    log("Calendar: 넘김 뒤 일기 페이지(#nbDaySpread)가 열림", !!D().querySelector("#nbDaySpread"));

    // 7) 일기 페이지에서 손가락 스와이프로 다음 날
    var before = P.getState().selectedDate;
    var sp2 = D().querySelector("#nbDaySpread");
    drag(sp2, -90);
    await wait(1200);
    var sp3 = D().querySelector("#nbDaySpread");
    log("일기: 첫 스와이프로 반대 면 뒤집힘 (data-side=" + (sp3 && sp3.dataset.side) + ")", !!sp3 && sp3.dataset.side === "right");
    drag(sp3, -90);
    await wait(1200);
    var after = P.getState().selectedDate;
    log("일기: 스와이프로 다음 날 이동 (" + before + " → " + after + ")", !!after && after !== before);

    log("window.__errors = " + W().__errors.length, W().__errors.length === 0);
    document.title = "done";
  }
  run().catch(function (e) { log("EXCEPTION " + e, false); document.title = "done"; });
</script>
</body></html>
