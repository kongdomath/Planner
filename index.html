  async function handleNewArchiveImages(event) {
    try {
      draftArchiveImages = await processMultipleFiles(event.target.files, draftArchiveImages, 5);
      event.target.value = "";
      const prev = document.getElementById("newArchiveImgPreview");
      if (prev) prev.innerHTML = renderThumbList(draftArchiveImages, "removeDraftArchiveImage");
    } catch {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
  }

  function removeDraftArchiveImage(idx) {
    draftArchiveImages.splice(idx, 1);
    const prev = document.getElementById("newArchiveImgPreview");
    if (prev) prev.innerHTML = renderThumbList(draftArchiveImages, "removeDraftArchiveImage");
  }

  function addArchiveItem() {
    const catSel = document.getElementById("archiveCatSel");
    const category = catSel ? catSel.value : (state.archiveCategories[0]?.name || "기타");
    const date = document.getElementById("archiveDateInp").value || state.selectedDate || TODAY_STR;
    const title = document.getElementById("archiveTitleInp").value.trim();
    const subtitle = document.getElementById("archiveSubInp").value.trim();
    const note = document.getElementById("archiveNoteInp").value.trim();
    if (!title) return;

    state.archives.unshift({
      id: uid(),
      category,
      date,
      title,
      subtitle,
      note,
      images: [...draftArchiveImages]
    });
    draftArchiveImages = [];
    showArchiveComposer = false;
    saveState();
    render();
  }

  function renderArchiveView() {
    let filtered = state.archives.filter(a => state.archiveCatFilter === "all" || a.category === state.archiveCatFilter);
    if (state.archiveSort === "date_desc") {
      filtered = [...filtered].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    } else if (state.archiveSort === "date_asc") {
      filtered = [...filtered].sort((a, b) => (a.date || "").localeCompare(b.date || ""));
    } else if (state.archiveSort === "oldest") {
      filtered = [...filtered].reverse();
    }

    const defaultCat = state.archiveCatFilter === "all"
      ? (state.archiveCategories[0]?.name || "")
      : state.archiveCatFilter;

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-archive">${ICONS.archive} 아카이브</h1>
          <span class="topbar-sub">총 ${filtered.length}개</span>
        </div>
        <div class="topbar-right">
          <select class="year-select" onchange="changeArchiveSort(this.value)" aria-label="아카이브 정렬">
            <option value="newest" ${state.archiveSort === "newest" ? "selected" : ""}>등록 최신순</option>
            <option value="oldest" ${state.archiveSort === "oldest" ? "selected" : ""}>등록 오래된순</option>
            <option value="date_desc" ${state.archiveSort === "date_desc" ? "selected" : ""}>기록 날짜 최신순</option>
            <option value="date_asc" ${state.archiveSort === "date_asc" ? "selected" : ""}>기록 날짜 오래된순</option>
          </select>
          <button class="btn btn-primary" onclick="toggleArchiveComposer()">
            ${showArchiveComposer ? "닫기" : "+ 새 아카이브 추가"}
          </button>
        </div>
      </div>

      <div class="filter-bar-wrap">
        <div class="filter-chips">
          <button class="chip-btn ${state.archiveCatFilter === "all" ? "active" : ""}" onclick="changeArchiveCatFilter('all')">
            전체 (${state.archives.length})
          </button>
          ${state.archiveCategories.map((cat, idx) => {
            const cnt = state.archives.filter(a => a.category === cat.name).length;
            const isAct = state.archiveCatFilter === cat.name;
            return `
              <span class="chip-wrap ${isAct ? "active" : ""}">
                <button class="chip-btn ${isAct ? "active" : ""}" onclick="changeArchiveCatFilter('${escapeAttr(cat.name)}')">
                  <span>${escapeHtml(cat.emoji)}</span> ${escapeHtml(cat.name)} (${cnt})
                </button>
                <button class="chip-action-btn" onclick="openEditArchiveCategory(${idx})" title="카테고리 수정">${ICONS.pencil}</button>
                <button class="chip-action-btn" onclick="deleteArchiveCategory(${idx})" title="카테고리 삭제">${ICONS.trash}</button>
              </span>
            `;
          }).join("")}
        </div>
        <div class="cat-add-inline">
          <input type="text" id="newArchiveCatEmojiInp" class="emoji-input" placeholder="이모지" maxlength="4" value="📌" />
          <input type="text" id="newArchiveCatNameInp" style="width:150px;" placeholder="새 카테고리명 입력" onkeydown="if(event.key==='Enter') addArchiveCategory()" />
          <button class="btn" onclick="addArchiveCategory()">카테고리 추가</button>
        </div>
      </div>

      ${showArchiveComposer ? `
        <div class="card composer-card">
          <div class="composer-header">
            <h3 style="color:var(--c-archive);">새 아카이브 등록</h3>
            <button class="btn btn-sm" onclick="toggleArchiveComposer()">취소</button>
          </div>
          <div class="form-row">
            <select id="archiveCatSel">
              ${state.archiveCategories.map(c => `<option value="${escapeAttr(c.name)}" ${defaultCat === c.name ? "selected" : ""}>${escapeHtml(c.emoji)} ${escapeHtml(c.name)}</option>`).join("")}
            </select>
            <input type="date" id="archiveDateInp" value="${state.selectedDate}" />
            <input type="text" id="archiveTitleInp" style="flex:1; min-width:180px;" placeholder="제목 (책 제목, 공부 주제, 여행지, 전시명, 차 이름 등)" />
            <input type="text" id="archiveSubInp" style="flex:1; min-width:150px;" placeholder="세부 정보 (저자, 장소, 다구 등 · 선택)" />
          </div>
          <div class="form-row">
            <textarea id="archiveNoteInp" style="width:100%; min-height:74px; resize:vertical;" placeholder="감상, 배운 내용, 시음 메모 등 글을 자유롭게 남겨보세요..."></textarea>
          </div>
          <div class="composer-footer">
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">
              <label class="btn" style="cursor:pointer;">
                사진 추가 (최대 5장)
                <input type="file" id="archiveImgInp" accept="image/*" multiple style="display:none" onchange="handleNewArchiveImages(event)" />
              </label>
              <div id="newArchiveImgPreview" class="img-preview-box">${renderThumbList(draftArchiveImages, "removeDraftArchiveImage")}</div>
            </div>
            <div class="composer-actions">
              <button class="btn" onclick="toggleArchiveComposer()">취소</button>
              <button class="btn btn-primary" onclick="addArchiveItem()">아카이브 저장</button>
            </div>
          </div>
        </div>
      ` : ""}

      ${filtered.length ? `
        <div class="media-grid">
          ${filtered.map(a => {
            const emoji = getArchiveCatEmoji(a.category);
            const imgs = normalizeImages(a);
            return `
              <article class="media-card">
                <div class="media-cover" onclick="openViewArchive('${a.id}')" title="자세히 보기">
                  ${imgs.length > 0
                    ? `<img src="${imgs[0]}" alt="${escapeAttr(a.title)}" />${imgs.length > 1 ? `<span class="photo-count-badge">+${imgs.length - 1}장</span>` : ""}`
                    : `<div class="cover-placeholder"><span class="big-emoji">${escapeHtml(emoji)}</span><span>${escapeHtml(a.category)}</span></div>`
                  }
                </div>
                <div class="media-body">
                  <div class="media-top">
                    <span class="pill" style="cursor:pointer;" onclick="selectDate('${a.date}', true)" title="해당 날짜 일기로 이동">${escapeHtml(emoji)} ${escapeHtml(a.category)} · ${a.date}</span>
                    <div>
                      <button class="icon-btn" onclick="openEditArchive('${a.id}')" title="수정">${ICONS.pencil}</button>
                      <button class="icon-btn danger" onclick="deleteItem('archives','${a.id}')" title="삭제">${ICONS.trash}</button>
                    </div>
                  </div>
                  <h3 class="media-title" style="cursor:pointer;" onclick="openViewArchive('${a.id}')">${escapeHtml(a.title)}</h3>
                  ${a.subtitle ? `<div class="media-sub">${escapeHtml(a.subtitle)}</div>` : ""}
                  ${a.note ? `<div class="media-note">${escapeHtml(a.note)}</div>` : ""}
                </div>
              </article>
            `;
          }).join("")}
        </div>
      ` : `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 아카이브 기록이 없습니다. 상단의 '+ 새 아카이브 추가' 버튼으로 첫 기록을 남겨보세요.</p>
        </div>
      `}
    `;
  }

  function openViewArchive(id) {
    const a = state.archives.find(x => x.id === id);
    if (!a) return;
    const emoji = getArchiveCatEmoji(a.category);
    const imgs = normalizeImages(a);
    openViewModal(
      `${emoji} ${a.category} · ${a.date}`,
      `
        ${imgs.length ? `<div class="modal-gallery">${imgs.map(src => `<img src="${src}" alt="${escapeAttr(a.title)}" />`).join("")}</div>` : ""}
        <h4 style="margin:0 0 4px; font-size:17px;">${escapeHtml(a.title)}</h4>
        ${a.subtitle ? `<div style="font-size:13px; color:var(--text-sub); margin-bottom:12px;">${escapeHtml(a.subtitle)}</div>` : ""}
        <div style="font-size:14px; line-height:1.7; white-space:pre-line;">${escapeHtml(a.note || "작성된 글이 없습니다.")}</div>
      `,
      () => openEditArchive(id)
    );
  }

  let modalArchiveImages = [];
  async function handleModalArchiveImages(event) {
    try {
      modalArchiveImages = await processMultipleFiles(event.target.files, modalArchiveImages, 5);
      event.target.value = "";
      const box = document.getElementById("mArchiveImgBox");
      if (box) box.innerHTML = renderThumbList(modalArchiveImages, "removeModalArchiveImage");
    } catch {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
  }

  function removeModalArchiveImage(idx) {
    modalArchiveImages.splice(idx, 1);
    const box = document.getElementById("mArchiveImgBox");
    if (box) box.innerHTML = renderThumbList(modalArchiveImages, "removeModalArchiveImage");
  }

  function openEditArchive(id) {
    const a = state.archives.find(x => x.id === id);
    if (!a) return;
    modalArchiveImages = [...normalizeImages(a)];
    openModal("아카이브 수정", `
      <div class="modal-field">
        <label>분류</label>
        <select id="mArchiveCat">
          ${state.archiveCategories.map(c => `<option value="${escapeAttr(c.name)}" ${a.category === c.name ? "selected" : ""}>${escapeHtml(c.emoji)} ${escapeHtml(c.name)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="mArchiveDate" value="${escapeAttr(a.date)}" />
      </div>
      <div class="modal-field">
        <label>제목</label>
        <input type="text" id="mArchiveTitle" value="${escapeAttr(a.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 정보 (저자, 장소, 다구 등)</label>
        <input type="text" id="mArchiveSub" value="${escapeAttr(a.subtitle || "")}" />
      </div>
      <div class="modal-field">
        <label>글 · 메모</label>
        <textarea id="mArchiveNote" style="min-height:110px;">${escapeHtml(a.note || "")}</textarea>
      </div>
      <div class="modal-field">
        <label>사진 (최대 5장)</label>
        <input type="file" accept="image/*" multiple onchange="handleModalArchiveImages(event)" />
        <div id="mArchiveImgBox" class="img-preview-box">
          ${renderThumbList(modalArchiveImages, "removeModalArchiveImage")}
        </div>
      </div>
    `, () => {
      a.category = document.getElementById("mArchiveCat").value;
      a.date = document.getElementById("mArchiveDate").value || a.date;
      a.title = document.getElementById("mArchiveTitle").value.trim() || a.title;
      a.subtitle = document.getElementById("mArchiveSub").value.trim();
      a.note = document.getElementById("mArchiveNote").value.trim();
      a.images = [...modalArchiveImages];
      delete a.image;
    });
  }

  function toggleAchieve(collection, id) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    item.doneDate = item.done ? (item.doneDate || state.selectedDate || TODAY_STR) : "";
    saveState();
    render();
  }

  function updateDoneDate(collection, id, newDate) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.doneDate = newDate;
    item.done = true;
    saveState();
    render();
  }

  function toggleTodo(id) {
    const item = state.todos.find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    saveState();
    render();
  }

  function deleteItem(collection, id) {
    state[collection] = state[collection].filter(x => x.id !== id);
    saveState();
    render();
  }

  function openModal(title, bodyHtml, onSave) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalActions").innerHTML = `
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modalSaveBtn">저장</button>
    `;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    document.getElementById("modalSaveBtn").onclick = () => {
      onSave();
      closeModal();
      saveState();
      render();
    };
  }

  function openViewModal(title, bodyHtml, onSwitchEdit) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalActions").innerHTML = `
      <button class="btn" id="modalSwitchEditBtn">수정하기</button>
      <button class="btn btn-primary" onclick="closeModal()">닫기</button>
    `;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    document.getElementById("modalSwitchEditBtn").onclick = () => {
      closeModal();
      onSwitchEdit();
    };
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("open");
  }

  function openEditBucket(id) {
    const b = state.buckets.find(x => x.id === id);
    if (!b) return;
    openModal("버킷리스트 수정", `
      <div class="modal-field">
        <label>분류</label>
        <select id="mBucketCat">
          ${state.bucketCategories.map(c => `<option value="${escapeAttr(c.name)}" ${b.category === c.name ? "selected" : ""}>${escapeHtml(c.emoji)} ${escapeHtml(c.name)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>버킷리스트 내용</label>
        <input type="text" id="mBucketTitle" value="${escapeAttr(b.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 메모</label>
        <input type="text" id="mBucketNote" value="${escapeAttr(b.note || "")}" />
      </div>
      <div class="modal-field">
        <label>달성 날짜 (달성 시)</label>
        <input type="date" id="mBucketDoneDate" value="${escapeAttr(b.doneDate || "")}" />
      </div>
    `, () => {
      b.category = document.getElementById("mBucketCat").value;
      b.title = document.getElementById("mBucketTitle").value.trim() || b.title;
      b.note = document.getElementById("mBucketNote").value.trim();
      b.doneDate = document.getElementById("mBucketDoneDate").value;
      if (b.doneDate) b.done = true;
    });
  }

  function openEditTodo(id) {
    const t = state.todos.find(x => x.id === id);
    if (!t) return;
    openModal("할일 수정", `
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="mTodoDate" value="${escapeAttr(t.date)}" />
      </div>
      <div class="modal-field">
        <label>할일 내용</label>
        <input type="text" id="mTodoTitle" value="${escapeAttr(t.title)}" />
      </div>
    `, () => {
      t.date = document.getElementById("mTodoDate").value || t.date;
      t.title = document.getElementById("mTodoTitle").value.trim() || t.title;
    });
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `archive_planner_backup_${TODAY_STR}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        state = { ...structuredClone(defaultState), ...parsed };
        if (state.activeTab === "todos") state.activeTab = "diary";
        state.topics = normalizeCategoryList(state.topics, "🎯");
        state.archiveCategories = normalizeCategoryList(state.archiveCategories, "🗂️");
        state.bucketCategories = normalizeCategoryList(state.bucketCategories, "⭐");
        state.goals = (state.goals || []).map(g => ({
          note: "",
          ...g,
          images: normalizeImages(g),
          year: normalizeYear(g.year),
          period: normalizePeriod(g.period)
        }));
        state.archives = (state.archives || []).map(a => ({
          ...a,
          images: normalizeImages(a)
        }));
        saveState();
        render();
        alert("백업 데이터를 복원했습니다.");
      } catch {
        alert("올바른 JSON 백업 파일이 아닙니다.");
      }
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  mountNavIcons();
  render();
</script>
</body>
</html>
