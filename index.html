<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아카이브 플래너" />
  <title>아카이브 & 플래너</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --surface-muted: #f3f1ec;
      --border: #e5e2da;
      --text: #1f2421;
      --text-sub: #6b7280;
      --sat: #3b6ea5;
      --sun: #c84b4b;
      --c-year: #334155;
      --c-diary: #2b4c7e;
      --c-goal: #2d6a4f;
      --c-plan: #25638a;
      --c-bucket: #b46528;
      --c-archive: #5b4b8a;
      --c-todo: #6441a5;
      --radius: 12px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 230px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      padding: 6px 10px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 12px;
      color: var(--text-sub);
      margin: 4px 0 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: var(--surface-muted); color: var(--text); }
    .nav-btn.active { background: var(--surface-muted); color: var(--text); font-weight: 700; }
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .main {
      flex: 1;
      padding: 24px 28px 88px;
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }
    .page-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .title-year { color: var(--c-year); }
    .title-diary { color: var(--c-diary); }
    .title-goal { color: var(--c-goal); }
    .title-plan { color: var(--c-plan); }
    .title-bucket { color: var(--c-bucket); }
    .title-archive { color: var(--c-archive); }

    .diary-date-badge {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    select, input[type="text"], input[type="date"], textarea {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      outline: none;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #94a3b8;
    }
    .search-input {
      min-width: 210px;
      font-size: 13px;
      padding: 7px 11px;
    }
    .year-select {
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      background: var(--surface);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-muted); }
    .btn-primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .btn-primary:hover { opacity: 0.9; background: var(--text); }
    .segmented {
      display: inline-flex;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 2px;
    }
    .segmented button {
      border: none;
      background: transparent;
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
    }
    .segmented button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 7px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 0;
    }
    .icon-btn:hover { background: var(--surface-muted); color: var(--text); border-color: var(--border); }
    .icon-btn.danger:hover { color: var(--sun); }

    /* 검색 결과 패널 */
    .search-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .search-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
      overflow-y: auto;
    }
    .search-result-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      background: var(--bg);
    }
    .search-result-item:hover { background: var(--surface-muted); }

    /* 연력 테이블 뷰 */
    .year-block { margin-bottom: 32px; }
    .year-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-year);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .matrix-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    table.year-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.year-table th {
      background: var(--surface-muted);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
    }
    table.year-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 5px 6px;
      vertical-align: top;
      height: 44px;
      cursor: pointer;
      transition: background 0.12s;
    }
    table.year-table td:hover:not(.empty-cell) { background: #f8fafc; }
    table.year-table td.empty-cell { background: #faf9f6; cursor: default; }
    table.year-table td.selected-day { outline: 2px solid var(--c-diary); outline-offset: -2px; background: #eef2ff; }
    table.year-table td.today-cell { background: #fefce8; }
    .cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .day-num { color: var(--text); }
    .day-num.sat { color: var(--sat); }
    .day-num.sun, .day-num.holiday { color: var(--sun); }
    .cell-badges { display: flex; gap: 3px; align-items: center; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; }
    .cell-line {
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cell-line.holiday-label {
      color: var(--sun);
      opacity: 0.85;
    }

    /* 달별 모아서 보기 */
    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      max-height: 420px;
    }
    .month-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .month-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--c-year);
    }
    .month-card-count {
      font-size: 11px;
      color: var(--text-sub);
    }
    .month-day-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 2px;
    }
    .month-day-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 7px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
    }
    .month-day-row:hover { background: var(--surface-muted); }
    .month-day-row.selected-day { background: #eef2ff; outline: 1px solid var(--c-diary); }
    .month-day-row.today-cell { background: #fefce8; }
    .m-day-label {
      width: 44px;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 12px;
    }
    .m-day-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .m-day-text.empty { color: #cbd5e1; }
    .m-day-text.holiday-label { color: var(--sun); opacity: 0.85; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    .list-item.done .item-title {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .chk {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--text);
      flex-shrink: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .item-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-sub);
    }
    .done-date-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }
    .done-date-inline input[type="date"] {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    textarea.diary-area {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      line-height: 1.7;
      padding: 14px;
    }

    /* 아카이브 탭 스타일 */
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }
    .chip-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip-btn:hover { background: var(--surface-muted); color: var(--text); }
    .chip-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .archive-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .archive-cover {
      width: 100%;
      height: 190px;
      background: var(--surface-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      color: var(--text-sub);
      cursor: pointer;
    }
    .archive-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .archive-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .archive-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .archive-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      line-height: 1.4;
    }
    .archive-sub {
      font-size: 12px;
      color: var(--text-sub);
    }
    .archive-note {
      font-size: 13px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .img-preview-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }
    .img-preview-box img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 4px;
      z-index: 40;
      justify-content: space-around;
    }
    .mobile-nav button {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .mobile-nav button.active { color: var(--text); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid var(--border);
    }
    .modal h3 { margin: 0 0 14px; font-size: 16px; }
    .modal-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
    .modal-field label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    @media (max-width: 1024px) {
      .months-grid, .archive-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 860px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .main { padding: 16px 14px 86px; }
      .grid-2 { grid-template-columns: 1fr; }
      .months-grid, .archive-grid { grid-template-columns: 1fr; }
      .search-input { min-width: 150px; flex: 1; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <h1>아카이브 & 플래너</h1>
      <p id="sidebarDateLabel"></p>
    </div>
    <button class="nav-btn active" data-tab="year"><span class="nav-icon" id="navIconYear"></span>1년 연력</button>
    <button class="nav-btn" data-tab="diary"><span class="nav-icon" id="navIconDiary"></span>하루 기록 · 일기</button>
    <button class="nav-btn" data-tab="goals"><span class="nav-icon" id="navIconGoals"></span>주제별 목표</button>
    <button class="nav-btn" data-tab="plans"><span class="nav-icon" id="navIconPlans"></span>연간 목표</button>
    <button class="nav-btn" data-tab="bucket"><span class="nav-icon" id="navIconBucket"></span>버킷리스트</button>
    <button class="nav-btn" data-tab="archive"><span class="nav-icon" id="navIconArchive"></span>아카이브</button>
    <div class="sidebar-footer">
      <button class="btn" onclick="clearSamples()">예시 지우기</button>
      <button class="btn" onclick="exportBackup()">데이터 백업 (JSON)</button>
      <label class="btn" style="cursor:pointer;">
        백업 복원
        <input type="file" accept=".json" style="display:none" onchange="importBackup(event)" />
      </label>
    </div>
  </aside>

  <main class="main" id="mainView"></main>
</div>

<nav class="mobile-nav" id="mobileNav">
  <button class="active" data-tab="year"><span class="nav-icon" id="mIconYear"></span>연력</button>
  <button data-tab="diary"><span class="nav-icon" id="mIconDiary"></span>일기</button>
  <button data-tab="goals"><span class="nav-icon" id="mIconGoals"></span>목표</button>
  <button data-tab="plans"><span class="nav-icon" id="mIconPlans"></span>연간목표</button>
  <button data-tab="bucket"><span class="nav-icon" id="mIconBucket"></span>버킷</button>
  <button data-tab="archive"><span class="nav-icon" id="mIconArchive"></span>아카이브</button>
</nav>

<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">항목 수정</h3>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modalSaveBtn">저장</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "personal_archive_planner_v4";
  const YEARS = [2026, 2027, 2028, 2029, 2030];
  const PERIODS = ["연간", "상반기", "하반기", "1분기", "2분기", "3분기", "4분기"];
  const ARCHIVE_CATS = ["독서", "공부", "여행", "전시", "차"];

  function getSystemTodayStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }

  const TODAY_STR = getSystemTodayStr();

  // 단색 픽토그램 SVG 모음

  const lunarFormatter = new Intl.DateTimeFormat("ko-KR-u-ca-chinese", {
    month: "numeric",
    day: "numeric"

  function getLunarMonthDay(dateObj) {
    try {
      const parts = lunarFormatter.formatToParts(dateObj);
      const mPart = parts.find(p => p.type === "month")?.value || "";
      const dPart = parts.find(p => p.type === "day")?.value || "";
      const isLeap = mPart.includes("윤");
      const month = parseInt(mPart.replace(/[^0-9]/g, ""), 10);
      const day = parseInt(dPart.replace(/[^0-9]/g, ""), 10);
      return { month, day, isLeap };
    } catch {
      return null;
    }
  }

  function buildHolidayMap(years) {
    const map = {};
    const addName = (ds, name) => {
      if (!map[ds]) map[ds] = name;
      else if (!map[ds].includes(name)) map[ds] += ` · ${name}`;
    };

    years.forEach(year => {
      const start = new Date(year - 1, 11, 25);
      const end = new Date(year + 1, 0, 5);
      for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
        const y = dt.getFullYear();
        const m = dt.getMonth() + 1;
        const d = dt.getDate();
        const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const md = `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        if (y === year && FIXED_SOLAR_HOLIDAYS[md]) {
          addName(ds, FIXED_SOLAR_HOLIDAYS[md]);
        }

        const lunar = getLunarMonthDay(dt);
        if (lunar && !lunar.isLeap) {
          if (lunar.month === 1 && lunar.day === 1) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "설날 연휴");
            if (y === year) addName(ds, "설날");
            if (next.getFullYear() === year) addName(nStr, "설날 연휴");
          }
          if (y === year && lunar.month === 4 && lunar.day === 8) {
            addName(ds, "부처님오신날");
          }
          if (lunar.month === 8 && lunar.day === 15) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "추석 연휴");
            if (y === year) addName(ds, "추석");
            if (next.getFullYear() === year) addName(nStr, "추석 연휴");
          }
        }
      }

      const subTargets = new Set(["설날 연휴", "설날", "추석 연휴", "추석", "삼일절", "어린이날", "부처님오신날", "광복절", "개천절", "한글날", "크리스마스"]);
      const yearDates = Object.keys(map).filter(k => k.startsWith(`${year}-`)).sort();
      yearDates.forEach(ds => {
        const [yy, mm, dd] = ds.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        const dow = dt.getDay();
        const names = map[ds].split(" · ");
        const isSeolOrChuseok = names.some(n => n.includes("설날") || n.includes("추석"));
        const isOtherSub = names.some(n => subTargets.has(n) && !n.includes("설날") && !n.includes("추석"));
        const hasOverlap = names.length > 1;

        if ((isSeolOrChuseok && (dow === 0 || hasOverlap)) || (isOtherSub && (dow === 0 || dow === 6 || hasOverlap))) {
          const cursor = new Date(dt);
          while (true) {
            cursor.setDate(cursor.getDate() + 1);
            const cStr = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}-${String(cursor.getDate()).padStart(2, "0")}`;
            const cDow = cursor.getDay();
            if (cDow !== 0 && cDow !== 6 && !map[cStr]) {
              if (cursor.getFullYear() === year) {
                map[cStr] = "대체공휴일";
              }
              break;
            }
          }
        }
      });
    });

    return map;
  }

  function compressImageFile(file, maxWidth = 720, quality = 0.78) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function findSearchResults(q) {
    const term = q.trim().toLowerCase();
    if (!term) return [];
    const results = [];

    Object.entries(state.logs || {}).forEach(([dateStr, log]) => {
      const one = log?.oneLine || "";
      const diary = log?.diary || "";
      if (one.toLowerCase().includes(term) || diary.toLowerCase().includes(term)) {
        const snippet = one.toLowerCase().includes(term) ? one : diary.replace(/\s+/g, " ").slice(0, 90);
        results.push({
          type: "기록 · 일기",
          title: one || `${dateStr} 일기`,
          sub: `${dateStr} · ${snippet}`,
          action: () => selectDate(dateStr, true)
        });
      }
    });

    (state.goals || []).forEach(g => {
      if (g.title.toLowerCase().includes(term) || (g.topic || "").toLowerCase().includes(term)) {
        results.push({
          type: "주제별 목표",
          title: g.title,
          sub: `${g.topic} · ${g.year}년 ${g.period || "연간"}`,
          action: () => {
            state.goalYearFilter = "all";
            state.goalPeriodFilter = "all";
            setTab("goals");
          }
        });
      }
    });

    (state.buckets || []).forEach(b => {
      if (b.title.toLowerCase().includes(term) || (b.note || "").toLowerCase().includes(term) || (b.category || "").toLowerCase().includes(term)) {
        results.push({
          type: "버킷리스트",
          title: b.title,
          sub: `${b.category}${b.note ? ` · ${b.note}` : ""}`,
          action: () => setTab("bucket")
        });
      }
    });

    (state.archives || []).forEach(a => {
      if (
        (a.title || "").toLowerCase().includes(term) ||
        (a.subtitle || "").toLowerCase().includes(term) ||
        (a.note || "").toLowerCase().includes(term) ||
        (a.category || "").toLowerCase().includes(term)
      ) {
        results.push({
          type: `아카이브 · ${a.category}`,
          title: a.title,
          sub: `${a.date}${a.subtitle ? ` · ${a.subtitle}` : ""}`,
          action: () => {
            state.archiveCatFilter = "all";
            setTab("archive");
          }
        });
      }
    });

    (state.todos || []).forEach(t => {
      if (t.title.toLowerCase().includes(term)) {
        results.push({
          type: "할일",
          title: t.title,
          sub: t.date,
          action: () => selectDate(t.date, true)
        });
      }
    });

    return results;
  }

      <section class="search-panel">
        <div class="search-panel-header">
          <strong style="font-size:14px;">"${escapeHtml(searchQuery.trim())}" 검색 결과 (${list.length}건)</strong>
          <button class="btn" onclick="clearSearch()">닫기</button>
        </div>
        ${list.length ? `
          <div class="search-result-list">
            ${list.map((item, i) => `
              <div class="search-result-item" onclick="runSearchAction(${i})">
                <div>
                  <span class="pill">${escapeHtml(item.type)}</span>
                  <strong style="font-size:13px; margin-left:4px;">${escapeHtml(item.title)}</strong>
                  <div class="item-meta">${escapeHtml(item.sub)}</div>
                </div>
              </div>
            `).join("")}
          </div>
        ` : `<p style="font-size:13px; color:var(--text-sub); margin:0;">일치하는 기록이 없습니다.</p>`}
      </section>
    `;
  }

  let currentSearchList = [];
  function runSearchAction(idx) {
    const item = currentSearchList[idx];
    if (item && typeof item.action === "function") item.action();
  }

  function updateNavUI() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
    });
    document.getElementById("sidebarDateLabel").textContent = `오늘: ${TODAY_STR} · 선택: ${state.selectedDate}`;
  }

  function render() {
    updateNavUI();
    currentSearchList = findSearchResults(searchQuery);
    const main = document.getElementById("mainView");
    let bodyHtml = "";
    if (state.activeTab === "year") bodyHtml = renderYearView();
    else if (state.activeTab === "diary") bodyHtml = renderDiaryView();
    else if (state.activeTab === "goals") bodyHtml = renderGoalsView();
    else if (state.activeTab === "plans") bodyHtml = renderAnnualGoalsView();
    else if (state.activeTab === "bucket") bodyHtml = renderBucketView();
    else if (state.activeTab === "archive") bodyHtml = renderArchiveView();
    else bodyHtml = renderYearView();

    main.innerHTML = renderSearchPanel() + bodyHtml;
  }

  function renderYearView() {
    const targetYears = state.yearFilter === "all" ? YEARS : [Number(state.yearFilter)];
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

    const blocks = targetYears.map(year => {
      if (state.yearViewMode === "months") {
        const monthCards = Array.from({ length: 12 }, (_, idx) => {
          const month = idx + 1;
          const maxDay = new Date(year, month, 0).getDate();
          let recordedCount = 0;
          let rowsHtml = "";

          for (let day = 1; day <= maxDay; day++) {
            const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            const dow = getDayOfWeek(dateStr);
            const hol = isHoliday(dateStr);
            const dayColor = hol || dow === 0 ? "var(--sun)" : dow === 6 ? "var(--sat)" : "var(--text)";
            const log = state.logs[dateStr] || {};
            const hasDiary = Boolean(log.diary && log.diary.trim());
            const hasAchieved =
              state.goals.some(g => g.done && g.doneDate === dateStr) ||
              state.buckets.some(b => b.done && b.doneDate === dateStr);
            const hasArchive = state.archives.some(a => a.date === dateStr);
            const hasTodo = state.todos.some(t => t.date === dateStr);
            if (log.oneLine || hasDiary || hasAchieved || hasArchive) recordedCount++;

            const isSelected = state.selectedDate === dateStr;
            const isToday = TODAY_STR === dateStr;
            const rowCls = ["month-day-row", isSelected ? "selected-day" : "", isToday ? "today-cell" : ""].filter(Boolean).join(" ");
            const displayTxt = log.oneLine || (hol ? HOLIDAYS[dateStr] : "");
            const txtCls = !log.oneLine && hol ? "m-day-text holiday-label" : displayTxt ? "m-day-text" : "m-day-text empty";

            rowsHtml += `
              <div class="${rowCls}" onclick="selectDate('${dateStr}', true)">
                <span class="m-day-label" style="color:${dayColor}">${day}일(${dayNames[dow]})</span>
                <span class="${txtCls}">${escapeHtml(displayTxt || "—")}</span>
                <span class="cell-badges">
                  ${hasDiary ? `<span class="badge-dot" style="background:var(--c-diary)"></span>` : ""}
                  ${hasAchieved ? `<span class="badge-dot" style="background:var(--c-goal)"></span>` : ""}
                  ${hasArchive ? `<span class="badge-dot" style="background:var(--c-archive)"></span>` : ""}
                  ${hasTodo ? `<span class="badge-dot" style="background:var(--c-todo)"></span>` : ""}
                </span>
              </div>
            `;
          }

          return `
            <div class="month-card">
              <div class="month-card-header">
                <span class="month-card-title">${month}월</span>
                <span class="month-card-count">기록 ${recordedCount}일</span>
              </div>
              <div class="month-day-list">${rowsHtml}</div>
            </div>
          `;
        }).join("");

        return `
          <section class="year-block">
            <h2 class="year-heading">${year}년 달별 모아보기</h2>
            <div class="months-grid">${monthCards}</div>
          </section>
        `;
      }

      let rows = "";
      for (let day = 1; day <= 31; day++) {
        let cells = "";
        for (let month = 1; month <= 12; month++) {
          const maxDay = new Date(year, month, 0).getDate();
          if (day > maxDay) {
            cells += `<td class="empty-cell"></td>`;
            continue;
          }
          const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const dow = getDayOfWeek(dateStr);
          const hol = isHoliday(dateStr);
          const dayCls = hol ? "holiday" : dow === 0 ? "sun" : dow === 6 ? "sat" : "";
          const log = state.logs[dateStr] || {};
          const hasDiary = Boolean(log.diary && log.diary.trim());
          const hasAchieved =
            state.goals.some(g => g.done && g.doneDate === dateStr) ||
            state.buckets.some(b => b.done && b.doneDate === dateStr);
          const hasArchive = state.archives.some(a => a.date === dateStr);
          const hasTodo = state.todos.some(t => t.date === dateStr);

          const isSelected = state.selectedDate === dateStr;
          const isToday = TODAY_STR === dateStr;
          const tdCls = [isSelected ? "selected-day" : "", isToday ? "today-cell" : ""].filter(Boolean).join(" ");
          const tip = HOLIDAYS[dateStr] ? `${dateStr} (${HOLIDAYS[dateStr]})` : dateStr;
          const showHolidayText = !log.oneLine && hol;

          cells += `
            <td class="${tdCls}" onclick="selectDate('${dateStr}', true)" title="${escapeAttr(tip)}">
              <div class="cell-top">
                <span class="day-num ${dayCls}">${day}</span>
                <span class="cell-badges">
                  ${hasDiary ? `<span class="badge-dot" style="background:var(--c-diary)" title="일기 있음"></span>` : ""}
                  ${hasAchieved ? `<span class="badge-dot" style="background:var(--c-goal)" title="목표/버킷 달성"></span>` : ""}
                  ${hasArchive ? `<span class="badge-dot" style="background:var(--c-archive)" title="아카이브 있음"></span>` : ""}
                  ${hasTodo ? `<span class="badge-dot" style="background:var(--c-todo)" title="할일 있음"></span>` : ""}
                </span>
              </div>
              <div class="cell-line ${showHolidayText ? "holiday-label" : ""}">${escapeHtml(log.oneLine || (hol ? HOLIDAYS[dateStr] : ""))}</div>
            </td>
          `;
        }
        rows += `<tr>${cells}</tr>`;
      }

      return `
        <section class="year-block">
          <h2 class="year-heading">${year}년 한눈에 보기</h2>
          <div class="matrix-wrap">
            <table class="year-table">
              <thead>
                <tr>${Array.from({ length: 12 }, (_, i) => `<th>${i + 1}월</th>`).join("")}</tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>
      `;
    }).join("");

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-year">${ICONS.year} 1년 연력</h1>
        </div>
        <div class="topbar-right">
          <input type="text" id="globalSearchInput" class="search-input" placeholder="기록·목표·아카이브 검색..." value="${escapeAttr(searchQuery)}" oninput="updateSearchQuery(this.value)" onkeydown="if(event.key==='Escape') clearSearch()" />
          <div class="segmented">
            <button class="${state.yearViewMode === "matrix" ? "active" : ""}" onclick="setYearViewMode('matrix')">연간 표</button>
            <button class="${state.yearViewMode === "months" ? "active" : ""}" onclick="setYearViewMode('months')">달별 모아보기</button>
          </div>
          <button class="btn" onclick="selectDate('${TODAY_STR}', true)">오늘 (${TODAY_STR})</button>
          ${yearSelectHtml(state.yearFilter, "changeYearFilter")}
        </div>
      </div>
      ${blocks}
    `;
  }

  function renderDiaryView() {
    const d = state.selectedDate;
    const dateColor = getDateColor(d);
    const log = state.logs[d] || { oneLine: "", diary: "" };

    const dayTodos = state.todos.filter(t => t.date === d);
    const doneGoals = state.goals.filter(g => g.done && g.doneDate === d);
    const doneBuckets = state.buckets.filter(b => b.done && b.doneDate === d);
    const dayArchives = state.archives.filter(a => a.date === d);

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-diary">${ICONS.diary} 하루 기록 · 일기</h1>
          <span class="diary-date-badge" style="color:${dateColor}">${formatDateKo(d)}</span>
        </div>
        <div class="topbar-right">
          <input type="date" value="${d}" onchange="if(this.value) selectDate(this.value, false)" />
          <button class="btn" onclick="selectDate('${TODAY_STR}', false)">오늘</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <label style="display:block; font-size:13px; font-weight:700; color:var(--c-diary); margin-bottom:6px;">연력 한 줄 요약</label>
          <input type="text" id="oneLineInput" style="width:100%; margin-bottom:16px;" placeholder="연력 칸에 표시될 오늘의 한 줄..." value="${escapeAttr(log.oneLine || "")}" oninput="saveDiaryDraft()" />

          <label style="display:block; font-size:13px; font-weight:700; color:var(--c-diary); margin-bottom:6px;">오늘의 긴 기록 · 일기</label>
          <textarea class="diary-area" id="diaryInput" placeholder="오늘 있었던 일, 생각, 감정을 자유롭게 길게 기록하세요..." oninput="saveDiaryDraft()">${escapeHtml(log.diary || "")}</textarea>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
            <span id="saveStatus" style="font-size:12px; color:var(--text-sub);">자동 저장됨</span>
            <button class="btn btn-primary" onclick="saveDiaryDraft(true)">저장</button>
          </div>
        </div>

        <div>
          <div class="card">
            <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-todo);">이 날의 할일</h3>
            <div class="form-row">
              <input type="text" id="dayTodoInput" style="flex:1;" placeholder="이 날짜에 할일 추가..." onkeydown="if(event.key==='Enter') addDayTodo()" />
              <button class="btn" onclick="addDayTodo()">추가</button>
            </div>
            <div class="item-list">
              ${dayTodos.length ? dayTodos.map(t => `
                <div class="list-item ${t.done ? "done" : ""}">
                  <div class="item-left">
                    <input type="checkbox" class="chk" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" />
                    <div class="item-title">${escapeHtml(t.title)}</div>
                  </div>
                  <div>
                    <button class="icon-btn" onclick="openEditTodo('${t.id}')" title="수정">${ICONS.pencil}</button>
                    <button class="icon-btn danger" onclick="deleteItem('todos','${t.id}')" title="삭제">${ICONS.trash}</button>
                  </div>
                </div>
              `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 할일이 없습니다.</p>`}
            </div>
          </div>

          ${(doneGoals.length + doneBuckets.length + dayArchives.length) > 0 ? `
            <div class="card">
              <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-goal);">이 날의 달성 · 아카이브</h3>
              <div class="item-list">
                ${doneGoals.map(g => `<div class="list-item"><span class="pill">목표 · ${escapeHtml(g.topic)}</span>${escapeHtml(g.title)}</div>`).join("")}
                ${doneBuckets.map(b => `<div class="list-item"><span class="pill">버킷 · ${escapeHtml(b.category)}</span>${escapeHtml(b.title)}</div>`).join("")}
                ${dayArchives.map(a => `<div class="list-item" style="cursor:pointer;" onclick="setTab('archive')"><span class="pill">아카이브 · ${escapeHtml(a.category)}</span>${escapeHtml(a.title)}</div>`).join("")}
              </div>
            </div>
          ` : ""}
        </div>
      </div>
    `;
  }

  function saveDiaryDraft(explicit = false) {
    const oneLine = document.getElementById("oneLineInput").value;
    const diary = document.getElementById("diaryInput").value;
    state.logs[state.selectedDate] = { oneLine, diary };
    saveState();
    const st = document.getElementById("saveStatus");
    if (st) st.textContent = explicit ? "저장되었습니다." : "자동 저장됨";
  }

  function addDayTodo() {
    const inp = document.getElementById("dayTodoInput");
    const title = inp.value.trim();
    if (!title) return;
    state.todos.unshift({ id: uid(), date: state.selectedDate, title, done: false });
    saveState();
    render();
  }

  function changeGoalYearFilter(val) {
    state.goalYearFilter = val;
    saveState();
    render();
  }

  function changeGoalPeriodFilter(val) {
    state.goalPeriodFilter = val;
    saveState();
    render();
  }

  function renderDoneDateControl(collection, id, doneDate) {
    return `
      <span class="done-date-inline">
        달성일:
        <input type="date" value="${escapeAttr(doneDate || TODAY_STR)}" onchange="updateDoneDate('${collection}','${id}',this.value)" />
      </span>
    `;
  }

  function renderGoalsView() {
    const filtered = state.goals.filter(g => {
      const yearOk = state.goalYearFilter === "all" || g.year === state.goalYearFilter;
      const periodOk = state.goalPeriodFilter === "all" || (g.period || "연간") === state.goalPeriodFilter;
      return yearOk && periodOk;
    });

    const defaultAddYear = state.goalYearFilter === "all" ? "2027" : state.goalYearFilter;
    const defaultAddPeriod = state.goalPeriodFilter === "all" ? "연간" : state.goalPeriodFilter;

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-goal">${ICONS.goals} 주제별 목표</h1>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml(state.goalYearFilter, "changeGoalYearFilter", "전체 기한 (연도)")}
          <select class="year-select" onchange="changeGoalPeriodFilter(this.value)" aria-label="세부 기간 필터">
            <option value="all" ${state.goalPeriodFilter === "all" ? "selected" : ""}>전체 기간</option>
            ${PERIODS.map(p => `<option value="${p}" ${state.goalPeriodFilter === p ? "selected" : ""}>${p}</option>`).join("")}
          </select>
        </div>
      </div>

      <div class="card">
        <div class="form-row">
          <select id="goalTopicSel">
            ${state.topics.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join("")}
          </select>
          <select id="goalYearSel">
            ${YEARS.map(y => `<option value="${y}" ${defaultAddYear === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
          </select>
          <select id="goalPeriodSel">
            ${PERIODS.map(p => `<option value="${p}" ${defaultAddPeriod === p ? "selected" : ""}>${p}</option>`).join("")}
          </select>
          <input type="text" id="goalTitleInp" style="flex:1; min-width:200px;" placeholder="새 목표 입력..." onkeydown="if(event.key==='Enter') addGoal()" />
          <button class="btn btn-primary" onclick="addGoal()">목표 추가</button>
        </div>
        <div class="form-row" style="margin-bottom:0;">
          <input type="text" id="newTopicInp" placeholder="새 주제 추가 (예: 자격증, 취미)" onkeydown="if(event.key==='Enter') addTopic()" />
          <button class="btn" onclick="addTopic()">주제 추가</button>
        </div>
      </div>

      ${state.topics.map((topic, idx) => {
        const items = filtered.filter(g => g.topic === topic);
        return `
          <div class="card">
            <div class="card-header-row">
              <h3 style="margin:0; font-size:15px; color:var(--c-goal);">${escapeHtml(topic)} (${items.filter(i => i.done).length}/${items.length})</h3>
              <div>
                <button class="icon-btn" onclick="openEditTopic(${idx})" title="주제 이름 수정">${ICONS.pencil}</button>
                <button class="icon-btn danger" onclick="deleteTopic(${idx})" title="주제 삭제">${ICONS.trash}</button>
              </div>
            </div>
            <div class="item-list">
              ${items.length ? items.map(g => `
                <div class="list-item ${g.done ? "done" : ""}">
                  <div class="item-left">
                    <input type="checkbox" class="chk" ${g.done ? "checked" : ""} onchange="toggleAchieve('goals','${g.id}')" />
                    <div>
                      <div class="item-title">${escapeHtml(g.title)}</div>
                      <div class="item-meta">
                        <span class="pill">${g.year}년</span>
                        <span class="pill">${escapeHtml(g.period || "연간")}</span>
                        ${g.done ? renderDoneDateControl("goals", g.id, g.doneDate) : ""}
                      </div>
                    </div>
                  </div>
                  <div>
                    <button class="icon-btn" onclick="openEditGoal('${g.id}')" title="수정">${ICONS.pencil}</button>
                    <button class="icon-btn danger" onclick="deleteItem('goals','${g.id}')" title="삭제">${ICONS.trash}</button>
                  </div>
                </div>
              `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">해당 조건의 목표가 없습니다.</p>`}
            </div>
          </div>
        `;
      }).join("")}
    `;
  }

  function addTopic() {
    const inp = document.getElementById("newTopicInp");
    const val = inp.value.trim();
    if (!val || state.topics.includes(val)) return;
    state.topics.push(val);
    saveState();
    render();
  }

  function openEditTopic(idx) {
    const oldName = state.topics[idx];
    if (!oldName) return;
    openModal("주제 이름 수정", `
      <div class="modal-field">
        <label>주제 이름 (기존 목표들의 주제명도 함께 변경됩니다)</label>
        <input type="text" id="mTopicName" value="${escapeAttr(oldName)}" />
      </div>
    `, () => {
      const newName = document.getElementById("mTopicName").value.trim();
      if (!newName || newName === oldName) return;
      if (state.topics.includes(newName)) {
        alert("이미 같은 이름의 주제가 있습니다.");
        return;
      }
      state.topics[idx] = newName;
      state.goals.forEach(g => {
        if (g.topic === oldName) g.topic = newName;
      });
    });
  }

  function deleteTopic(idx) {
    const target = state.topics[idx];
    if (!target) return;
    const count = state.goals.filter(g => g.topic === target).length;
    const msg = count > 0
      ? `'${target}' 주제를 삭제할까요? 이 주제에 속한 목표 ${count}개도 함께 삭제됩니다.`
      : `'${target}' 주제를 삭제할까요?`;
    if (!confirm(msg)) return;
    state.topics.splice(idx, 1);
    state.goals = state.goals.filter(g => g.topic !== target);
    saveState();
    render();
  }

  function addGoal() {
    const topic = document.getElementById("goalTopicSel").value;
    const year = document.getElementById("goalYearSel").value;
    const period = document.getElementById("goalPeriodSel").value;
    const title = document.getElementById("goalTitleInp").value.trim();
    if (!title) return;
    state.goals.unshift({ id: uid(), topic, year, period, title, done: false, doneDate: "" });
    saveState();
    render();
  }

  function changeAnnualGoalYearFilter(val) {
    state.annualGoalYearFilter = val;
    saveState();
    render();
  }

  function renderAnnualGoalsView() {
    const targetYear = state.annualGoalYearFilter;
    const filtered = state.goals.filter(g => targetYear === "all" || g.year === targetYear);

    const groupsHtml = PERIODS.map(period => {
      const items = filtered.filter(g => (g.period || "연간") === period);
      if (items.length === 0) return "";
      return `
        <div class="card">
          <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-plan);">${escapeHtml(period)} (${items.filter(i => i.done).length}/${items.length})</h3>
          <div class="item-list">
            ${items.map(g => `
              <div class="list-item ${g.done ? "done" : ""}">
                <div class="item-left">
                  <input type="checkbox" class="chk" ${g.done ? "checked" : ""} onchange="toggleAchieve('goals','${g.id}')" />
                  <div>
                    <div class="item-title">${escapeHtml(g.title)}</div>
                    <div class="item-meta">
                      ${targetYear === "all" ? `<span class="pill">${g.year}년</span>` : ""}
                      <span class="pill">${escapeHtml(g.topic)}</span>
                      ${g.done ? renderDoneDateControl("goals", g.id, g.doneDate) : ""}
                    </div>
                  </div>
                </div>
                <div>
                  <button class="icon-btn" onclick="openEditGoal('${g.id}')" title="수정">${ICONS.pencil}</button>
                  <button class="icon-btn danger" onclick="deleteItem('goals','${g.id}')" title="삭제">${ICONS.trash}</button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-plan">${ICONS.plans} 연간 목표</h1>
          <span style="font-size:13px; color:var(--text-sub);">주제별 목표를 기간별로 모아봅니다</span>
        </div>
        <div class="topbar-right">
          <button class="btn" onclick="setTab('goals')">주제별 목표에서 추가</button>
          ${yearSelectHtml(state.annualGoalYearFilter, "changeAnnualGoalYearFilter")}
        </div>
      </div>

      ${groupsHtml || `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">선택한 연도에 등록된 목표가 없습니다. 주제별 목표에서 목표를 추가해 보세요.</p>
        </div>
      `}
    `;
  }

  function renderBucketView() {
    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-bucket">${ICONS.bucket} 버킷리스트</h1>
        </div>
      </div>

      <div class="card">
        <div class="form-row">
          <input type="text" id="bucketCatInp" style="width:120px;" placeholder="분류 (여행 등)" value="경험" />
          <input type="text" id="bucketTitleInp" style="flex:1; min-width:180px;" placeholder="언젠가 꼭 해보고 싶은 버킷리스트..." onkeydown="if(event.key==='Enter') addBucket()" />
          <input type="text" id="bucketNoteInp" style="flex:1; min-width:150px;" placeholder="메모 (선택)" onkeydown="if(event.key==='Enter') addBucket()" />
          <button class="btn btn-primary" onclick="addBucket()">추가</button>
        </div>
      </div>

      <div class="card">
        <div class="item-list">
          ${state.buckets.length ? state.buckets.map(b => `
            <div class="list-item ${b.done ? "done" : ""}">
              <div class="item-left">
                <input type="checkbox" class="chk" ${b.done ? "checked" : ""} onchange="toggleAchieve('buckets','${b.id}')" />
                <div>
                  <div class="item-title">${escapeHtml(b.title)}</div>
                  <div class="item-meta">
                    <span class="pill">${escapeHtml(b.category)}</span>
                    ${b.note ? `<span>${escapeHtml(b.note)}</span>` : ""}
                    ${b.done ? renderDoneDateControl("buckets", b.id, b.doneDate) : ""}
                  </div>
                </div>
              </div>
              <div>
                <button class="icon-btn" onclick="openEditBucket('${b.id}')" title="수정">${ICONS.pencil}</button>
                <button class="icon-btn danger" onclick="deleteItem('buckets','${b.id}')" title="삭제">${ICONS.trash}</button>
              </div>
            </div>
          `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 버킷리스트가 없습니다.</p>`}
        </div>
      </div>
    `;
  }

  function addBucket() {
    const category = document.getElementById("bucketCatInp").value.trim() || "기타";
    const title = document.getElementById("bucketTitleInp").value.trim();
    const note = document.getElementById("bucketNoteInp").value.trim();
    if (!title) return;
    state.buckets.unshift({ id: uid(), category, title, note, done: false, doneDate: "" });
    saveState();
    render();
  }

  // 아카이브 탭 (독서 / 공부 / 여행 / 전시 / 차 + 사진 + 글)
  function changeArchiveCatFilter(cat) {
    state.archiveCatFilter = cat;
    saveState();
    render();
  }

  async function handleNewArchiveImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    try {
      draftArchiveImage = await compressImageFile(file);
      const prev = document.getElementById("newArchiveImgPreview");
      if (prev) {
        prev.innerHTML = `<img src="${draftArchiveImage}" alt="미리보기" /><button type="button" class="btn" onclick="clearDraftArchiveImage()">사진 제거</button>`;
      }
    } catch {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
  }

  function clearDraftArchiveImage() {
    draftArchiveImage = "";
    const inp = document.getElementById("archiveImgInp");
    if (inp) inp.value = "";
    const prev = document.getElementById("newArchiveImgPreview");
    if (prev) prev.innerHTML = "";
  }

  function addArchiveItem() {
    const category = document.getElementById("archiveCatSel").value;
    const date = document.getElementById("archiveDateInp").value || state.selectedDate || TODAY_STR;
    const title = document.getElementById("archiveTitleInp").value.trim();
    const subtitle = document.getElementById("archiveSubInp").value.trim();
    const note = document.getElementById("archiveNoteInp").value.trim();
    if (!title) return;

    state.archives.unshift({
      id: uid(),
      category,
      date,
      title,
      subtitle,
      note,
      image: draftArchiveImage
    });
    draftArchiveImage = "";
    saveState();
    render();
  }

  function renderArchiveView() {
    const filtered = state.archives.filter(a => state.archiveCatFilter === "all" || a.category === state.archiveCatFilter);
    const defaultCat = state.archiveCatFilter === "all" ? "독서" : state.archiveCatFilter;

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-archive">${ICONS.archive} 아카이브</h1>
          <span style="font-size:13px; color:var(--text-sub);">독서 · 공부 · 여행 · 전시 · 차 기록 보관소</span>
        </div>
      </div>

      <div class="filter-chips">
        <button class="chip-btn ${state.archiveCatFilter === "all" ? "active" : ""}" onclick="changeArchiveCatFilter('all')">
          전체 (${state.archives.length})
        </button>
        ${ARCHIVE_CATS.map(cat => {
          const cnt = state.archives.filter(a => a.category === cat).length;
          return `
            <button class="chip-btn ${state.archiveCatFilter === cat ? "active" : ""}" onclick="changeArchiveCatFilter('${cat}')">
              ${CAT_ICONS[cat] || ""} ${cat} (${cnt})
            </button>
          `;
        }).join("")}
      </div>

      <div class="card">
        <div class="form-row">
          <select id="archiveCatSel">
            ${ARCHIVE_CATS.map(c => `<option value="${c}" ${defaultCat === c ? "selected" : ""}>${c}</option>`).join("")}
          </select>
          <input type="date" id="archiveDateInp" value="${state.selectedDate}" />
          <input type="text" id="archiveTitleInp" style="flex:1; min-width:180px;" placeholder="제목 (책 제목, 공부 주제, 여행지, 전시명, 차 이름)" />
          <input type="text" id="archiveSubInp" style="flex:1; min-width:150px;" placeholder="세부 정보 (저자, 장소, 다구 등 · 선택)" />
        </div>
        <div class="form-row">
          <textarea id="archiveNoteInp" style="width:100%; min-height:74px; resize:vertical;" placeholder="감상, 배운 내용, 시음 메모 등 글을 자유롭게 남겨보세요..."></textarea>
        </div>
        <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <label class="btn" style="cursor:pointer;">
              사진 추가
              <input type="file" id="archiveImgInp" accept="image/*" style="display:none" onchange="handleNewArchiveImage(event)" />
            </label>
            <div id="newArchiveImgPreview" class="img-preview-box"></div>
          </div>
          <button class="btn btn-primary" onclick="addArchiveItem()">아카이브 저장</button>
        </div>
      </div>

      ${filtered.length ? `
        <div class="archive-grid">
          ${filtered.map(a => `
            <article class="archive-card">
              <div class="archive-cover" onclick="openViewArchive('${a.id}')" title="자세히 보기">
                ${a.image
                  ? `<img src="${a.image}" alt="${escapeAttr(a.title)}" />`
                  : `<div style="display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px;">${CAT_ICONS[a.category] || ICONS.image}<span>${escapeHtml(a.category)}</span></div>`
                }
              </div>
              <div class="archive-body">
                <div class="archive-top">
                  <span class="pill" style="display:inline-flex; align-items:center; gap:4px;">${CAT_ICONS[a.category] || ""} ${escapeHtml(a.category)} · ${a.date}</span>
                  <div>
                    <button class="icon-btn" onclick="openEditArchive('${a.id}')" title="수정">${ICONS.pencil}</button>
                    <button class="icon-btn danger" onclick="deleteItem('archives','${a.id}')" title="삭제">${ICONS.trash}</button>
                  </div>
                </div>
                <h3 class="archive-title" style="cursor:pointer;" onclick="openViewArchive('${a.id}')">${escapeHtml(a.title)}</h3>
                ${a.subtitle ? `<div class="archive-sub">${escapeHtml(a.subtitle)}</div>` : ""}
                ${a.note ? `<div class="archive-note">${escapeHtml(a.note)}</div>` : ""}
              </div>
            </article>
          `).join("")}
        </div>
      ` : `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 아카이브 기록이 없습니다.</p>
        </div>
      `}
    `;
  }

  function openViewArchive(id) {
    const a = state.archives.find(x => x.id === id);
    if (!a) return;
    openModal(`${a.category} · ${a.date}`, `
      ${a.image ? `<img src="${a.image}" alt="${escapeAttr(a.title)}" style="width:100%; max-height:300px; object-fit:contain; border-radius:8px; background:var(--surface-muted); margin-bottom:12px;" />` : ""}
      <h4 style="margin:0 0 4px; font-size:17px;">${escapeHtml(a.title)}</h4>
      ${a.subtitle ? `<div style="font-size:13px; color:var(--text-sub); margin-bottom:12px;">${escapeHtml(a.subtitle)}</div>` : ""}
      <div style="font-size:14px; line-height:1.7; white-space:pre-line;">${escapeHtml(a.note || "작성된 글이 없습니다.")}</div>
    `, () => {});
  }

  let modalArchiveImage = "";
  async function handleModalArchiveImage(event) {
    const file = event.target.files[0];
    if (!file) return;
    modalArchiveImage = await compressImageFile(file);
    const box = document.getElementById("mArchiveImgBox");
    if (box) {
      box.innerHTML = `<img src="${modalArchiveImage}" alt="미리보기" /><button type="button" class="btn" onclick="removeModalArchiveImage()">사진 삭제</button>`;
    }
  }

  function removeModalArchiveImage() {
    modalArchiveImage = "";
    const box = document.getElementById("mArchiveImgBox");
    if (box) box.innerHTML = `<span style="font-size:12px; color:var(--text-sub);">등록된 사진 없음</span>`;
  }

  function openEditArchive(id) {
    const a = state.archives.find(x => x.id === id);
    if (!a) return;
    modalArchiveImage = a.image || "";
    openModal("아카이브 수정", `
      <div class="modal-field">
        <label>분류</label>
        <select id="mArchiveCat">
          ${ARCHIVE_CATS.map(c => `<option value="${c}" ${a.category === c ? "selected" : ""}>${c}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="mArchiveDate" value="${escapeAttr(a.date)}" />
      </div>
      <div class="modal-field">
        <label>제목</label>
        <input type="text" id="mArchiveTitle" value="${escapeAttr(a.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 정보 (저자, 장소, 다구 등)</label>
        <input type="text" id="mArchiveSub" value="${escapeAttr(a.subtitle || "")}" />
      </div>
      <div class="modal-field">
        <label>글 · 메모</label>
        <textarea id="mArchiveNote" style="min-height:110px;">${escapeHtml(a.note || "")}</textarea>
      </div>
      <div class="modal-field">
        <label>사진</label>
        <input type="file" accept="image/*" onchange="handleModalArchiveImage(event)" />
        <div id="mArchiveImgBox" class="img-preview-box">
          ${modalArchiveImage
            ? `<img src="${modalArchiveImage}" alt="미리보기" /><button type="button" class="btn" onclick="removeModalArchiveImage()">사진 삭제</button>`
            : `<span style="font-size:12px; color:var(--text-sub);">등록된 사진 없음</span>`
          }
        </div>
      </div>
    `, () => {
      a.category = document.getElementById("mArchiveCat").value;
      a.date = document.getElementById("mArchiveDate").value || a.date;
      a.title = document.getElementById("mArchiveTitle").value.trim() || a.title;
      a.subtitle = document.getElementById("mArchiveSub").value.trim();
      a.note = document.getElementById("mArchiveNote").value.trim();
      a.image = modalArchiveImage;
    });
  }

  function toggleAchieve(collection, id) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    item.doneDate = item.done ? (item.doneDate || state.selectedDate || TODAY_STR) : "";
    saveState();
    render();
  }

  function updateDoneDate(collection, id, newDate) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.doneDate = newDate;
    item.done = true;
    saveState();
    render();
  }

  function toggleTodo(id) {
    const item = state.todos.find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    saveState();
    render();
  }

  function deleteItem(collection, id) {
    state[collection] = state[collection].filter(x => x.id !== id);
    saveState();
    render();
  }

  function openModal(title, bodyHtml, onSave) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    document.getElementById("modalSaveBtn").onclick = () => {
      onSave();
      closeModal();
      saveState();
      render();
    };
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("open");
  }

  function openEditBucket(id) {
    const b = state.buckets.find(x => x.id === id);
    if (!b) return;
    openModal("버킷리스트 수정", `
      <div class="modal-field">
        <label>분류</label>
        <input type="text" id="mBucketCat" value="${escapeAttr(b.category)}" />
      </div>
      <div class="modal-field">
        <label>버킷리스트 내용</label>
        <input type="text" id="mBucketTitle" value="${escapeAttr(b.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 메모</label>
        <input type="text" id="mBucketNote" value="${escapeAttr(b.note || "")}" />
      </div>
      <div class="modal-field">
        <label>달성 날짜 (달성 시)</label>
        <input type="date" id="mBucketDoneDate" value="${escapeAttr(b.doneDate || "")}" />
      </div>
    `, () => {
      b.category = document.getElementById("mBucketCat").value.trim() || "기타";
      b.title = document.getElementById("mBucketTitle").value.trim() || b.title;
      b.note = document.getElementById("mBucketNote").value.trim();
      b.doneDate = document.getElementById("mBucketDoneDate").value;
      if (b.doneDate) b.done = true;
    });
  }

  function openEditGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    openModal("목표 수정", `
      <div class="modal-field">
        <label>주제</label>
        <select id="mGoalTopic">
          ${state.topics.map(t => `<option value="${escapeAttr(t)}" ${g.topic === t ? "selected" : ""}>${escapeHtml(t)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>연도</label>
        <select id="mGoalYear">
          ${YEARS.map(y => `<option value="${y}" ${g.year === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>기간</label>
        <select id="mGoalPeriod">
          ${PERIODS.map(p => `<option value="${p}" ${(g.period || "연간") === p ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>목표 내용</label>
        <input type="text" id="mGoalTitle" value="${escapeAttr(g.title)}" />
      </div>
    `, () => {
      g.topic = document.getElementById("mGoalTopic").value;
      g.year = document.getElementById("mGoalYear").value;
      g.period = document.getElementById("mGoalPeriod").value;
      g.title = document.getElementById("mGoalTitle").value.trim() || g.title;
    });
  }

  function openEditTodo(id) {
    const t = state.todos.find(x => x.id === id);
    if (!t) return;
    openModal("할일 수정", `
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="mTodoDate" value="${escapeAttr(t.date)}" />
      </div>
      <div class="modal-field">
        <label>할일 내용</label>
        <input type="text" id="mTodoTitle" value="${escapeAttr(t.title)}" />
      </div>
    `, () => {
      t.date = document.getElementById("mTodoDate").value || t.date;
      t.title = document.getElementById("mTodoTitle").value.trim() || t.title;
    });
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `archive_planner_backup_${TODAY_STR}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        state = { ...structuredClone(defaultState), ...parsed };
        if (state.activeTab === "todos") state.activeTab = "diary";
        state.goals = (state.goals || []).map(g => ({ period: "연간", ...g }));
        state.archives = state.archives || [];
        saveState();
        render();
        alert("백업 데이터를 복원했습니다.");
      } catch {
        alert("올바른 JSON 백업 파일이 아닙니다.");
      }
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  mountNavIcons();
  render();
</script>
</body>
</html>
