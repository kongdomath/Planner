  }
  function normalizeCategoryList(list, fallbackIcon = "target") {
    if (!Array.isArray(list)) return [];
    return list.map(item => {
      if (typeof item === "string") return { name: item, icon: fallbackIcon };
      return { name: String(item.name || "").trim(), icon: resolveIconKey(item.icon || item.emoji, fallbackIcon) };
    }).filter(x => x.name);
  }
  function normalizeImages(item) {
    if (Array.isArray(item.images)) return item.images.filter(Boolean);
    if (item.image) return [item.image];
    return [];
  }
  function uid() { return "id_" + Math.random().toString(36).slice(2, 9); }

  function getTopicIconKey(name) {
    const found = state.topics.find(t => t.name === name);
    return found ? resolveIconKey(found.icon, "target") : "target";
  }
  function getArchiveCatIconKey(name) {
    const found = state.archiveCategories.find(c => c.name === name);
    return found ? resolveIconKey(found.icon, "folder") : "folder";
  }
  function getBucketCatIconKey(name) {
    const found = state.bucketCategories.find(c => c.name === name);
    return found ? resolveIconKey(found.icon, "star") : "star";
  }

  function toggleRowActions(event, key) {
    if (event) event.stopPropagation();
    const nextKey = activeActionTarget === key ? null : key;
    activeActionTarget = nextKey;
    document.querySelectorAll("[data-action-key]").forEach(el => {
      el.classList.toggle("visible", el.dataset.actionKey === nextKey);
    });
  }
  function toggleChipActions(event) {
    if (event) event.stopPropagation();
    const wrap = event?.currentTarget?.closest(".chip-wrap");
    const wasExpanded = wrap && wrap.classList.contains("expanded");
    document.querySelectorAll(".chip-wrap.expanded").forEach(el => el.classList.remove("expanded"));
    if (wrap && !wasExpanded) wrap.classList.add("expanded");
  }
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".reveal-actions") && !e.target.closest(".clickable-label")) {
      if (activeActionTarget !== null) {
        activeActionTarget = null;
        document.querySelectorAll("[data-action-key].visible").forEach(el => el.classList.remove("visible"));
      }
    }
    if (!e.target.closest(".chip-wrap")) {
      document.querySelectorAll(".chip-wrap.expanded").forEach(el => el.classList.remove("expanded"));
    }
  });

  function clearSamples() {
    if (!confirm("기본으로 들어 있는 예시 항목을 지우고 빈 상태로 시작할까요?")) return;
    state.logs = {}; state.goals = []; state.buckets = []; state.archives = []; state.todos = [];
    saveState(); render();
  }

  function getDayOfWeek(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d).getDay();
  }
  function isHoliday(dateStr) { return Boolean(HOLIDAYS[dateStr]); }
  function getDateColor(dateStr) {
    if (isHoliday(dateStr)) return "var(--sun)";
    const dow = getDayOfWeek(dateStr);
    if (dow === 0) return "var(--sun)";
    if (dow === 6) return "var(--sat)";
    return "var(--text)";
  }
  function shiftDate(dateStr, deltaDays) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d + deltaDays);
    return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
  }
  function formatDateKo(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = new Date(y, m - 1, d).getDay();
    const hName = HOLIDAYS[dateStr] ? ` · ${HOLIDAYS[dateStr]}` : "";
    return `${y}. ${String(m).padStart(2, "0")}. ${String(d).padStart(2, "0")} (${days[dow]})${hName}`;
  }

  function compressImageFile(file, maxWidth = 720, quality = 0.76) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  async function processMultipleFiles(fileList, existingArray, maxCount = 5) {
    const files = Array.from(fileList || []);
    const result = [...existingArray];
    for (const file of files) {
      if (result.length >= maxCount) {
        alert(`사진은 항목당 최대 ${maxCount}장까지 첨부할 수 있습니다.`);
        break;
      }
      result.push(await compressImageFile(file));
    }
    return result;
  }

  function yearSelectHtml(currentVal, onChangeFn, allLabel = `전체 연도 (${YEARS[0]}~${YEARS[YEARS.length - 1]})`) {
    const normCur = currentVal === "all" ? "all" : normalizeYear(currentVal);
    const opts = YEARS.map(y => `<option value="${y}" ${normCur === String(y) ? "selected" : ""}>${y}년</option>`).join("");
    return `<select class="year-select" onchange="${onChangeFn}(this.value)"><option value="all" ${normCur === "all" ? "selected" : ""}>${allLabel}</option>${opts}</select>`;
  }

  function setTab(tab) { state.activeTab = tab; activeActionTarget = null; saveState(); render(); }
  function selectDate(dateStr, goDiary = false) {
    state.selectedDate = dateStr;
    if (goDiary) state.activeTab = "diary";
    activeActionTarget = null;
    saveState(); render();
  }

  function updateSearchQuery(val) {
    searchQuery = val; render();
    const inp = document.getElementById("globalSearchInput");
    if (inp) { inp.focus(); const len = inp.value.length; inp.setSelectionRange(len, len); }
  }
  function clearSearch() { searchQuery = ""; render(); }

  function findSearchResults(q) {
    const term = q.trim().toLowerCase();
    if (!term) return [];
    const results = [];
    Object.entries(state.logs || {}).forEach(([dateStr, log]) => {
      const one = log?.oneLine || "", diary = log?.diary || "";
      if (one.toLowerCase().includes(term) || diary.toLowerCase().includes(term)) {
        results.push({ type: "일기", title: one || `${dateStr} 기록`, sub: dateStr, action: () => selectDate(dateStr, true) });
      }
    });
    (state.goals || []).forEach(g => {
      if ([g.title, g.topic, g.note, g.quote].some(v => (v || "").toLowerCase().includes(term))) {
        results.push({ type: "목표", title: g.title, sub: `${g.topic} · ${g.year}년 ${g.period}`, action: () => { state.goalTopicFilter = "all"; state.goalYearFilter = "all"; state.goalPeriodFilter = "all"; setTab("goals"); } });
      }
    });
    (state.buckets || []).forEach(b => {
      if ([b.title, b.note, b.category].some(v => (v || "").toLowerCase().includes(term))) {
        results.push({ type: "버킷리스트", title: b.title, sub: b.category, action: () => { state.bucketCatFilter = "all"; setTab("bucket"); } });
      }
    });
    (state.archives || []).forEach(a => {
      if ([a.title, a.subtitle, a.note, a.quote, a.category, a.location].some(v => (v || "").toLowerCase().includes(term))) {
        results.push({ type: `아카이브 · ${a.category}`, title: a.title, sub: a.date, action: () => { state.archiveCatFilter = "all"; setTab("archive"); } });
      }
    });
    return results;
  }

  let currentSearchList = [];
  function runSearchAction(idx) {
    if (currentSearchList[idx]?.action) currentSearchList[idx].action();
  }
  function renderSearchPanel() {
    if (!searchQuery.trim()) return "";
    const list = findSearchResults(searchQuery);
    return `
      <section class="search-panel">
        <div class="search-panel-header">
          <strong style="font-size:13.5px;">"${escapeHtml(searchQuery.trim())}" 검색 결과 (${list.length}건)</strong>
          <button class="btn btn-sm" onclick="clearSearch()">닫기</button>
        </div>
        ${list.length ? `
          <div class="search-result-list">
            ${list.map((item, i) => `
              <div class="search-result-item" onclick="runSearchAction(${i})">
                <span class="pill">${escapeHtml(item.type)}</span>
                <strong style="font-size:13px; margin-left:6px;">${escapeHtml(item.title)}</strong>
                <span style="font-size:12px; color:var(--text-sub); margin-left:8px;">${escapeHtml(item.sub)}</span>
              </div>
            `).join("")}
          </div>
        ` : `<p style="font-size:13px; color:var(--text-sub); margin:0;">일치하는 기록이 없습니다.</p>`}
      </section>
    `;
  }

  function updateNavUI() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
    });
    document.getElementById("sidebarDateLabel").textContent = `Today ${TODAY_STR}`;
  }

  function render() {
    updateNavUI();
    currentSearchList = findSearchResults(searchQuery);
    const main = document.getElementById("mainView");
    let bodyHtml = "";
    if (state.activeTab === "year") bodyHtml = renderYearView();
    else if (state.activeTab === "diary") bodyHtml = renderDiaryView();
    else if (state.activeTab === "goals") bodyHtml = renderGoalsView();
    else if (state.activeTab === "bucket") bodyHtml = renderBucketView();
    else if (state.activeTab === "archive") bodyHtml = renderArchiveView();
    else bodyHtml = renderYearView();
    main.innerHTML = renderSearchPanel() + bodyHtml;
  }

  function getDayMeta(dateStr) {
    const log = state.logs[dateStr] || {};
    const hasDiary = Boolean(log.diary && log.diary.trim());
    const hasAchieved =
      state.goals.some(g => g.done && g.doneDate === dateStr) ||
      state.buckets.some(b => b.done && b.doneDate === dateStr);
    const dayArchives = state.archives.filter(a => a.date === dateStr);
    const hasArchive = dayArchives.length > 0;
    const hasTodo = state.todos.some(t => t.date === dateStr);
    const coverPhoto = dayArchives.flatMap(a => normalizeImages(a))[0] || "";
    const hasAny = Boolean(log.oneLine || hasDiary || hasAchieved || hasArchive || hasTodo);
    return { log, hasDiary, hasAchieved, hasArchive, hasTodo, hasAny, coverPhoto };
  }

  /* =========================================================
     1. 1년 연력 뷰 (비주얼 무드보드 캘린더 + 매트릭스)
     ========================================================= */
  function changeYearFilter(val) { state.yearFilter = val; saveState(); render(); }
  function setYearViewMode(mode) { state.yearViewMode = mode; saveState(); render(); }
  function setMonthDisplayMode(mode) { state.monthDisplayMode = mode; saveState(); render(); }
  function jumpToMonthCard(year, month) {
    const el = document.getElementById(`month-card-${year}-${month}`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderYearView() {
    const targetYears = state.yearFilter === "all" ? YEARS : [Number(normalizeYear(state.yearFilter))];
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];

    const legendBar = `
      <div class="summary-strip">
        <div style="display:flex; flex-wrap:wrap; align-items:center; gap:14px; font-size:12px; color:var(--text-sub);">
          <span style="display:inline-flex; align-items:center; gap:5px;"><span class="badge-dot" style="background:var(--accent-navy)"></span>일기</span>
          <span style="display:inline-flex; align-items:center; gap:5px;"><span class="badge-dot" style="background:var(--accent)"></span>목표·버킷 달성</span>
          <span style="display:inline-flex; align-items:center; gap:5px;"><span class="badge-dot" style="background:var(--accent-warm)"></span>아카이브</span>
        </div>
        <span style="font-size:12px; color:var(--text-muted);">날짜 칸을 누르면 해당 날의 기록 페이지로 이동합니다</span>
      </div>
    `;

    const blocks = targetYears.map(year => {
      if (state.yearViewMode === "months") {
        const jumpButtons = Array.from({ length: 12 }, (_, i) =>
          `<button class="month-jump-btn" onclick="jumpToMonthCard(${year}, ${i + 1})">${i + 1}월</button>`
        ).join("");

        const monthCards = Array.from({ length: 12 }, (_, idx) => {
          const month = idx + 1;
          const maxDay = new Date(year, month, 0).getDate();
          const firstDow = new Date(year, month - 1, 1).getDay();
          let recordedDays = [];
          for (let day = 1; day <= maxDay; day++) {
            const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            const meta = getDayMeta(dateStr);
            if (meta.hasAny) recordedDays.push({ day, dateStr, ...meta });
          }

          let innerBody = "";
          if (state.monthDisplayMode === "recorded") {
            innerBody = recordedDays.length ? `
              <div class="month-highlights" style="border-top:none; margin-top:0; padding-top:0;">
                ${recordedDays.map(item => {
                  const dow = getDayOfWeek(item.dateStr);
                  const dCol = getDateColor(item.dateStr);
                  const summary = item.log.oneLine || (item.hasArchive ? "아카이브 기록" : item.hasAchieved ? "목표 달성" : "일기 작성됨");
                  return `
                    <div class="highlight-row" onclick="selectDate('${item.dateStr}', true)">
                      <strong style="width:46px; flex-shrink:0; color:${dCol};">${item.day}일(${dayNames[dow]})</strong>
                      <span style="flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(summary)}</span>
                    </div>
                  `;
                }).join("")}
              </div>
            ` : `<p style="font-size:12px; color:var(--text-muted); margin:8px 0;">아직 작성된 기록이 없습니다.</p>`;
          } else {
            let cellsHtml = "";
            for (let b = 0; b < firstDow; b++) cellsHtml += `<div></div>`;
            for (let day = 1; day <= maxDay; day++) {
              const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
              const dow = getDayOfWeek(dateStr);
              const hol = isHoliday(dateStr);
              const dCol = hol || dow === 0 ? "var(--sun)" : dow === 6 ? "var(--sat)" : "var(--text)";
              const meta = getDayMeta(dateStr);
              const cls = [
                "cal-day-cell",
                meta.hasAny ? "has-record" : "",
                meta.coverPhoto ? "has-photo" : "",
                state.selectedDate === dateStr ? "selected-day" : "",
                TODAY_STR === dateStr ? "today-cell" : ""
              ].filter(Boolean).join(" ");
              const bgStyle = meta.coverPhoto ? `style="background-image:url('${meta.coverPhoto}')"` : "";
              const miniTxt = meta.coverPhoto ? "" : (meta.log.oneLine || (hol ? HOLIDAYS[dateStr] : ""));

              cellsHtml += `
                <div class="${cls}" ${bgStyle} onclick="selectDate('${dateStr}', true)">
                  <span class="cal-day-num" style="color:${dCol}">${day}</span>
                  ${!meta.coverPhoto ? `
                    <span class="cell-badges">
                      ${meta.hasDiary ? `<span class="badge-dot" style="background:var(--accent-navy)"></span>` : ""}
                      ${meta.hasAchieved ? `<span class="badge-dot" style="background:var(--accent)"></span>` : ""}
                      ${meta.hasArchive ? `<span class="badge-dot" style="background:var(--accent-warm)"></span>` : ""}
                    </span>
                    <span class="cal-day-mini ${!meta.log.oneLine && hol ? "holiday-label" : ""}">${escapeHtml(miniTxt)}</span>
                  ` : ""}
                </div>
              `;
            }

            const highlightsHtml = recordedDays.slice(0, 3).map(item => {
              const dCol = getDateColor(item.dateStr);
              const summary = item.log.oneLine || (item.hasArchive ? "아카이브 기록" : item.hasAchieved ? "목표 달성" : "일기 작성");
              return `
                <div class="highlight-row" onclick="selectDate('${item.dateStr}', true)">
                  <strong style="color:${dCol}; flex-shrink:0;">${item.day}일</strong>
                  <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-sub);">${escapeHtml(summary)}</span>
                </div>
              `;
            }).join("");

            innerBody = `
              <div class="cal-weekdays">${dayNames.map(dn => `<span>${dn}</span>`).join("")}</div>
              <div class="cal-days-grid">${cellsHtml}</div>
              ${highlightsHtml ? `<div class="month-highlights">${highlightsHtml}</div>` : ""}
            `;
          }

          return `
            <div class="month-card" id="month-card-${year}-${month}">
              <div class="month-card-header">
                <span class="month-card-title">${month}월</span>
                <span class="month-card-count">${recordedDays.length} days</span>
              </div>
              ${innerBody}
            </div>
          `;
        }).join("");

        return `
          <section class="year-block">
            <div class="month-toolbar">
              <h2 class="year-heading" style="margin:0;">${year} Monthly Moodboard</h2>
              <div style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
                <div class="segmented">
                  <button class="${state.monthDisplayMode === "calendar" ? "active" : ""}" onclick="setMonthDisplayMode('calendar')">비주얼 달력</button>
                  <button class="${state.monthDisplayMode === "recorded" ? "active" : ""}" onclick="setMonthDisplayMode('recorded')">기록 있는 날만</button>
                </div>
                <div class="month-jump-bar">${jumpButtons}</div>
              </div>
            </div>
            <div class="months-grid">${monthCards}</div>
          </section>
        `;
      }

      let rows = "";
      for (let day = 1; day <= 31; day++) {
        let cells = `<td class="day-axis-cell">${day}</td>`;
        for (let month = 1; month <= 12; month++) {
          const maxDay = new Date(year, month, 0).getDate();
          if (day > maxDay) { cells += `<td class="empty-cell"></td>`; continue; }
          const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const dow = getDayOfWeek(dateStr);
          const hol = isHoliday(dateStr);
          const dayCls = hol ? "holiday" : dow === 0 ? "sun" : dow === 6 ? "sat" : "";
          const meta = getDayMeta(dateStr);
          const tdCls = [
            (dow === 0 || dow === 6) ? "weekend-bg" : "",
            state.selectedDate === dateStr ? "selected-day" : "",
            TODAY_STR === dateStr ? "today-cell" : ""
          ].filter(Boolean).join(" ");
          const showHolidayText = !meta.log.oneLine && hol;

          cells += `
            <td class="${tdCls}" onclick="selectDate('${dateStr}', true)">
              <div class="cell-top">
                <span class="day-num ${dayCls}">${dayNames[dow]}</span>
                <span class="cell-badges">
                  ${meta.hasDiary ? `<span class="badge-dot" style="background:var(--accent-navy)"></span>` : ""}
                  ${meta.hasAchieved ? `<span class="badge-dot" style="background:var(--accent)"></span>` : ""}
                  ${meta.hasArchive ? `<span class="badge-dot" style="background:var(--accent-warm)"></span>` : ""}
                </span>
              </div>
              <div class="cell-line ${showHolidayText ? "holiday-label" : ""}">${escapeHtml(meta.log.oneLine || (hol ? HOLIDAYS[dateStr] : ""))}</div>
            </td>
          `;
        }
        rows += `<tr>${cells}</tr>`;
      }

      return `
        <section class="year-block">
          <h2 class="year-heading">${year} Annual Matrix</h2>
          <div class="matrix-wrap">
            <table class="year-table">
              <thead>
                <tr>
                  <th class="day-axis-col">Day</th>
                  ${Array.from({ length: 12 }, (_, i) => `<th>${i + 1}월</th>`).join("")}
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>
      `;
    }).join("");

    return `
      <div class="topbar">
        <div class="topbar-left">
          <span class="page-eyebrow">Annual Overview</span>
          <div class="page-title-row">
            <h1 class="page-title">1년 연력</h1>
          </div>
        </div>
        <div class="topbar-right">
          <input type="text" id="globalSearchInput" class="search-input" placeholder="기록·목표·아카이브 검색..." value="${escapeAttr(searchQuery)}" oninput="updateSearchQuery(this.value)" onkeydown="if(event.key==='Escape') clearSearch()" />
          <div class="segmented">
            <button class="${state.yearViewMode === "matrix" ? "active" : ""}" onclick="setYearViewMode('matrix')">연간 표</button>
            <button class="${state.yearViewMode === "months" ? "active" : ""}" onclick="setYearViewMode('months')">달별 무드보드</button>
          </div>
          ${yearSelectHtml(state.yearFilter, "changeYearFilter")}
          <button class="btn btn-primary" onclick="selectDate('${TODAY_STR}', true)">오늘</button>
        </div>
      </div>
      ${legendBar}
      ${blocks}
    `;
  }

  /* =========================================================
     하루 기록 · 일기 뷰
     ========================================================= */
  function renderDiaryView() {
    const d = state.selectedDate;
    const prevDate = shiftDate(d, -1);
    const nextDate = shiftDate(d, 1);
    const dateColor = getDateColor(d);
    const log = state.logs[d] || { oneLine: "", diary: "" };
    const dayTodos = state.todos.filter(t => t.date === d);
    const doneGoals = state.goals.filter(g => g.done && g.doneDate === d);
    const doneBuckets = state.buckets.filter(b => b.done && b.doneDate === d);
    const dayArchives = state.archives.filter(a => a.date === d);

    return `
      <div class="topbar">
        <div class="topbar-left">
          <span class="page-eyebrow">Daily Log & Reflection</span>
          <div class="page-title-row">
            <h1 class="page-title">하루 기록 · 일기</h1>
            <span class="diary-date-badge" style="color:${dateColor}">${formatDateKo(d)}</span>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-nav-arrow" onclick="selectDate('${prevDate}', false)" title="이전 날">${ICONS.chevLeft}</button>
          <input type="date" value="${d}" onchange="if(this.value) selectDate(this.value, false)" />
          <button class="btn btn-nav-arrow" onclick="selectDate('${nextDate}', false)" title="다음 날">${ICONS.chevRight}</button>
          <button class="btn btn-primary" onclick="selectDate('${TODAY_STR}', false)">오늘</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <label style="display:block; font-size:12px; font-weight:700; color:var(--text-sub); margin-bottom:6px;">연력 한 줄 요약</label>
          <input type="text" id="oneLineInput" style="width:100%; margin-bottom:18px; font-family:var(--serif); font-size:15px;" placeholder="오늘을 대표하는 문장 한 줄..." value="${escapeAttr(log.oneLine || "")}" oninput="saveDiaryDraft()" />

          <label style="display:block; font-size:12px; font-weight:700; color:var(--text-sub); margin-bottom:6px;">오늘의 사유 · 일기</label>
          <textarea class="diary-area" id="diaryInput" placeholder="오늘 마주한 장면, 생각의 흐름을 여백 위에 차분히 남겨보세요..." oninput="saveDiaryDraft()">${escapeHtml(log.diary || "")}</textarea>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
            <span id="saveStatus" style="font-size:12px; color:var(--text-muted);">자동 저장됨</span>
            <button class="btn btn-primary" onclick="saveDiaryDraft(true)">저장</button>
          </div>
        </div>

        <div>
          <div class="card">
            <h3 style="font-family:var(--serif); margin:0 0 12px; font-size:16px;">이 날의 할일</h3>
            <div class="form-row">
              <input type="text" id="dayTodoInput" style="flex:1;" placeholder="할일 추가..." onkeydown="if(event.key==='Enter') addDayTodo()" />
              <button class="btn" onclick="addDayTodo()">추가</button>
            </div>
            <div class="item-list">
              ${dayTodos.length ? dayTodos.map(t => {
                const key = `todo_${t.id}`;
                return `
                  <div class="list-item ${t.done ? "done" : ""}">
                    <div class="item-left">
                      <input type="checkbox" class="chk" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" />
                      <div class="item-title clickable-label" onclick="toggleRowActions(event, '${key}')">${escapeHtml(t.title)}</div>
                    </div>
                    <div class="reveal-actions ${activeActionTarget === key ? "visible" : ""}" data-action-key="${key}">
                      <button class="icon-btn" onclick="openEditTodo('${t.id}')" title="수정">${ICONS.pencil}</button>
                      <button class="icon-btn danger" onclick="deleteItem('todos','${t.id}')" title="삭제">${ICONS.trash}</button>
                    </div>
                  </div>
                `;
              }).join("") : `<p style="font-size:13px; color:var(--text-muted); margin:0;">등록된 할일이 없습니다.</p>`}
            </div>
          </div>

          ${(doneGoals.length + doneBuckets.length + dayArchives.length) > 0 ? `
            <div class="card">
              <h3 style="font-family:var(--serif); margin:0 0 12px; font-size:16px;">이 날의 발자취</h3>
              <div class="item-list">
                ${doneGoals.map(g => `<div class="list-item" style="cursor:pointer;" onclick="openGoalTicket('${g.id}')"><span class="pill">${renderPictogram(getTopicIconKey(g.topic), 12)} 목표 달성</span>${escapeHtml(g.title)}</div>`).join("")}
                ${doneBuckets.map(b => `<div class="list-item"><span class="pill">${renderPictogram(getBucketCatIconKey(b.category), 12)} 버킷 달성</span>${escapeHtml(b.title)}</div>`).join("")}
                ${dayArchives.map(a => `<div class="list-item" style="cursor:pointer;" onclick="openArchiveTicket('${a.id}')"><span class="pill">${renderPictogram(getArchiveCatIconKey(a.category), 12)} ${escapeHtml(a.category)}</span>${escapeHtml(a.title)}</div>`).join("")}
              </div>
            </div>
          ` : ""}
        </div>
      </div>
    `;
  }

  function saveDiaryDraft(explicit = false) {
    state.logs[state.selectedDate] = {
      oneLine: document.getElementById("oneLineInput").value,
      diary: document.getElementById("diaryInput").value
    };
    saveState();
    const st = document.getElementById("saveStatus");
    if (st) st.textContent = explicit ? "저장되었습니다." : "자동 저장됨";
  }
  function addDayTodo() {
    const inp = document.getElementById("dayTodoInput");
    if (!inp.value.trim()) return;
    state.todos.unshift({ id: uid(), date: state.selectedDate, title: inp.value.trim(), done: false });
    saveState(); render();
  }

  /* =========================================================
     1. 통합 [목표] 탭 (연간목표 탭 통합 + 4단계 진행 스텝퍼 + 블록 입력)
     ========================================================= */
  function changeGoalTopicFilter(val) { state.goalTopicFilter = val; saveState(); render(); }
  function changeGoalYearFilter(val) { state.goalYearFilter = val === "all" ? "all" : normalizeYear(val); saveState(); render(); }
  function changeGoalPeriodFilter(val) { state.goalPeriodFilter = val; saveState(); render(); }
  function changeGoalSort(val) { state.goalSort = val; saveState(); render(); }

  function toggleGoalComposer() {
    showGoalComposer = !showGoalComposer;
    if (showGoalComposer) {
      draftGoalStage = 0;
      draftGoalBlocks = new Set(["note"]);
      draftGoalImages = [];
    }
    render();
  }
  function setDraftGoalStage(idx) {
    draftGoalStage = idx;
    render();
  }
  function toggleDraftGoalBlock(blockKey) {
    if (draftGoalBlocks.has(blockKey)) draftGoalBlocks.delete(blockKey);
    else draftGoalBlocks.add(blockKey);
    render();
  }

  function setGoalStageDirect(id, stageIdx) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    g.stage = stageIdx;
    if (stageIdx === 3) {
      g.done = true;
      g.doneDate = g.doneDate || state.selectedDate || TODAY_STR;
    } else {
      g.done = false;
      g.doneDate = "";
    }
    saveState();
    render();
  }

  async function handleNewGoalImages(event) {
    try {
      draftGoalImages = await processMultipleFiles(event.target.files, draftGoalImages, 5);
      event.target.value = "";
      render();
    } catch { alert("이미지 처리 중 오류가 발생했습니다."); }
  }
  function removeDraftGoalImage(idx) {
    draftGoalImages.splice(idx, 1);
    render();
  }

  function renderStageStepperHtml(currentStage, clickFnName, argPrefix = "") {
    return `
      <div class="stage-stepper">
        ${GOAL_STAGES.map((label, idx) => {
          const passed = idx < currentStage;
          const current = idx === currentStage;
          const cls = current ? "current" : passed ? "passed" : "";
          const onclick = argPrefix ? `${clickFnName}(${argPrefix}, ${idx})` : `${clickFnName}(${idx})`;
          return `
            <button type="button" class="stage-step-btn ${cls}" onclick="${onclick}">
              <span class="stage-dot"></span>
              <span class="stage-label">${label}</span>
            </button>
          `;
        }).join("")}
      </div>
    `;
  }

  function renderGoalsView() {
    let filtered = state.goals.filter(g => {
      const topicOk = state.goalTopicFilter === "all" || g.topic === state.goalTopicFilter;
      const yearOk = state.goalYearFilter === "all" || normalizeYear(g.year) === normalizeYear(state.goalYearFilter);
      const periodOk = state.goalPeriodFilter === "all" || normalizePeriod(g.period) === state.goalPeriodFilter;
      return topicOk && yearOk && periodOk;
    });

    if (state.goalSort === "undone") filtered = [...filtered].sort((a, b) => Number(a.done) - Number(b.done));
    else if (state.goalSort === "done") filtered = [...filtered].sort((a, b) => Number(b.done) - Number(a.done));
    else if (state.goalSort === "oldest") filtered = [...filtered].reverse();

    const totalCnt = filtered.length;
    const doneCnt = filtered.filter(g => g.done).length;
    const pct = totalCnt > 0 ? Math.round((doneCnt / totalCnt) * 100) : 0;

    const defaultAddTopic = state.goalTopicFilter === "all" ? (state.topics[0]?.name || "") : state.goalTopicFilter;
    const defaultAddYear = state.goalYearFilter === "all" ? "2026" : normalizeYear(state.goalYearFilter);
    const defaultAddPeriod = state.goalPeriodFilter === "all" ? "연간" : state.goalPeriodFilter;

    return `
      <div class="topbar">
        <div class="topbar-left">
          <span class="page-eyebrow">Integrated Goals & Milestones</span>
          <div class="page-title-row">
            <h1 class="page-title">목표</h1>
          </div>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml(state.goalYearFilter, "changeGoalYearFilter", "전체 연도")}
          <select class="year-select" onchange="changeGoalPeriodFilter(this.value)">
            <option value="all" ${state.goalPeriodFilter === "all" ? "selected" : ""}>전체 기간</option>
            ${PERIODS.map(p => `<option value="${p}" ${state.goalPeriodFilter === p ? "selected" : ""}>${p}</option>`).join("")}
          </select>
          <select class="year-select" onchange="changeGoalSort(this.value)">
            <option value="newest" ${state.goalSort === "newest" ? "selected" : ""}>최신순</option>
            <option value="oldest" ${state.goalSort === "oldest" ? "selected" : ""}>오래된순</option>
            <option value="undone" ${state.goalSort === "undone" ? "selected" : ""}>진행중 우선</option>
            <option value="done" ${state.goalSort === "done" ? "selected" : ""}>달성 완료 우선</option>
          </select>
          <button class="btn btn-primary" onclick="toggleGoalComposer()">
            ${showGoalComposer ? "닫기" : "+ 새 목표"}
          </button>
        </div>
      </div>

      <div class="summary-strip">
        <div class="summary-metrics">
          <span>필터 목표 <strong>${totalCnt}</strong></span>
          <span>달성 완료 <strong style="color:var(--accent);">${doneCnt}</strong></span>
          <span>달성률 <strong>${pct}%</strong></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;"></div>
        </div>
      </div>

      <div class="filter-bar-wrap">
        <div class="filter-chips">
          <button class="chip-btn ${state.goalTopicFilter === "all" ? "active" : ""}" onclick="changeGoalTopicFilter('all')">
            전체 (${state.goals.length})
          </button>
          ${state.topics.map((t, idx) => {
            const cnt = state.goals.filter(g => g.topic === t.name).length;
            const isAct = state.goalTopicFilter === t.name;
            return `
              <span class="chip-wrap ${isAct ? "active" : ""}">
                <button class="chip-btn ${isAct ? "active" : ""}" onclick="changeGoalTopicFilter('${escapeAttr(t.name)}'); toggleChipActions(event)">
                  ${renderPictogram(t.icon, 13)} ${escapeHtml(t.name)} (${cnt})
                </button>
                <span class="chip-actions">
                  <button class="chip-action-btn" onclick="openEditTopic(${idx})" title="주제 수정">${ICONS.pencil}</button>
                  <button class="chip-action-btn" onclick="deleteTopic(${idx})" title="주제 삭제">${ICONS.trash}</button>
                </span>
              </span>
            `;
          }).join("")}
        </div>
        <div class="cat-add-inline">
          <select id="newTopicIconSel" class="year-select">
            ${Object.entries(PICTOGRAMS).map(([k, info]) => `<option value="${k}">${info.label}</option>`).join("")}
          </select>
          <input type="text" id="newTopicInp" style="width:140px;" placeholder="새 주제명" onkeydown="if(event.key==='Enter') addTopic()" />
          <button class="btn" onclick="addTopic()">주제 추가</button>
        </div>
      </div>

      ${showGoalComposer ? `
        <div class="block-composer">
          <div class="composer-top-meta">
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              <select id="goalTopicSel">${state.topics.map(t => `<option value="${escapeAttr(t.name)}" ${defaultAddTopic === t.name ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}</select>
              <select id="goalYearSel">${YEARS.map(y => `<option value="${y}" ${defaultAddYear === String(y) ? "selected" : ""}>${y}년</option>`).join("")}</select>
              <select id="goalPeriodSel">${PERIODS.map(p => `<option value="${p}" ${defaultAddPeriod === p ? "selected" : ""}>${p}</option>`).join("")}</select>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-sm" onclick="toggleGoalComposer()">취소</button>
              <button class="btn btn-sm btn-primary" onclick="addGoal()">저장</button>
            </div>
          </div>

          <input type="text" id="goalTitleInp" class="composer-title-input" placeholder="이루고 싶은 목표의 이름을 적으세요..." />

          <div style="font-size:11.5px; font-weight:700; color:var(--text-muted); margin-bottom:2px;">현재 진행 단계</div>
          ${renderStageStepperHtml(draftGoalStage, "setDraftGoalStage")}

          <div class="active-blocks-stack">
            ${draftGoalBlocks.has("quote") ? `
              <div class="modular-block">
                <div class="modular-block-head">
                  <span class="modular-block-label">${ICONS.quote} 다짐 · 핵심 문장</span>
                  <button type="button" class="block-remove-btn" onclick="toggleDraftGoalBlock('quote')">×</button>
                </div>
                <input type="text" id="goalQuoteInp" class="quote-input" placeholder="나를 움직이게 하는 한 문장이나 기준..." />
              </div>
            ` : ""}
            ${draftGoalBlocks.has("note") ? `
              <div class="modular-block">
                <div class="modular-block-head">
                  <span class="modular-block-label">${ICONS.text} 실행 루틴 · 메모</span>
                  <button type="button" class="block-remove-btn" onclick="toggleDraftGoalBlock('note')">×</button>
                </div>
                <textarea id="goalNoteInp" style="min-height:68px;" placeholder="구체적인 실행 방법, 주간 루틴, 점검 기준을 자유롭게 적어보세요..."></textarea>
              </div>
            ` : ""}
            ${draftGoalBlocks.has("image") ? `
              <div class="modular-block">
                <div class="modular-block-head">
                  <span class="modular-block-label">${ICONS.camera} 무드 이미지 (최대 5장)</span>
                  <button type="button" class="block-remove-btn" onclick="toggleDraftGoalBlock('image')">×</button>
                </div>
                <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">
                  <label class="btn btn-sm" style="cursor:pointer;">
                    사진 선택
                    <input type="file" accept="image/*" multiple style="display:none" onchange="handleNewGoalImages(event)" />
                  </label>
                  <div class="img-preview-box">${renderThumbList(draftGoalImages, "removeDraftGoalImage")}</div>
                </div>
              </div>
            ` : ""}
          </div>

          <div class="block-palette">
            <span class="block-palette-title">블록 조립:</span>
            <button type="button" class="block-add-chip ${draftGoalBlocks.has("quote") ? "added" : ""}" onclick="toggleDraftGoalBlock('quote')">${ICONS.quote} 다짐 문장</button>
            <button type="button" class="block-add-chip ${draftGoalBlocks.has("note") ? "added" : ""}" onclick="toggleDraftGoalBlock('note')">${ICONS.text} 실행 메모</button>
            <button type="button" class="block-add-chip ${draftGoalBlocks.has("image") ? "added" : ""}" onclick="toggleDraftGoalBlock('image')">${ICONS.camera} 무드 이미지</button>
          </div>
        </div>
      ` : ""}

      ${filtered.length ? `
        <div class="goals-grid">
          ${filtered.map(g => {
            const iconKey = getTopicIconKey(g.topic);
            const curStage = g.done ? 3 : (typeof g.stage === "number" ? g.stage : 0);
            const imgs = normalizeImages(g);
            const key = `goal_${g.id}`;
            return `
              <article class="goal-card ${g.done ? "done" : ""}">
                <div class="goal-card-head">
                  <div style="display:flex; flex-wrap:wrap; gap:5px;">
                    <span class="pill">${renderPictogram(iconKey, 12)} ${escapeHtml(g.topic)}</span>
                    <span class="pill">${normalizeYear(g.year)} · ${escapeHtml(normalizePeriod(g.period))}</span>
                  </div>
                  <div class="reveal-actions ${activeActionTarget === key ? "visible" : ""}" data-action-key="${key}">
                    <button class="icon-btn" onclick="openEditGoal('${g.id}')" title="수정">${ICONS.pencil}</button>
                    <button class="icon-btn danger" onclick="deleteItem('goals','${g.id}')" title="삭제">${ICONS.trash}</button>
                  </div>
                </div>

                <h3 class="goal-card-title clickable-label" onclick="toggleRowActions(event, '${key}')">${escapeHtml(g.title)}</h3>

                ${renderStageStepperHtml(curStage, "setGoalStageDirect", `'${g.id}'`)}

                ${g.quote ? `<div class="goal-quote-box clickable-label" onclick="openGoalTicket('${g.id}')">“${escapeHtml(g.quote)}”</div>` : ""}
                ${g.note ? `<div class="goal-note-preview clickable-label" onclick="openGoalTicket('${g.id}')">${escapeHtml(g.note)}</div>` : ""}

                ${imgs.length > 0 ? `
                  <div style="display:flex; gap:6px; cursor:pointer;" onclick="openGoalTicket('${g.id}')">
                    ${imgs.slice(0, 3).map(src => `<img src="${src}" style="width:58px; height:58px; object-fit:cover; border-radius:8px; border:1px solid var(--border);" />`).join("")}
                  </div>
                ` : ""}

                <div class="goal-card-footer">
                  <span style="cursor:pointer; font-weight:600;" onclick="openGoalTicket('${g.id}')">아티팩트 카드 보기 →</span>
                  ${g.done ? renderDoneDateControl("goals", g.id, g.doneDate) : `<span>단계 점을 눌러 진행도 변경</span>`}
                </div>
              </article>
            `;
          }).join("")}
        </div>
      ` : `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">선택한 조건에 등록된 목표가 없습니다. 상단의 '+ 새 목표' 버튼으로 목표를 조립해 보세요.</p>
        </div>
      `}
    `;
  }

  function addGoal() {
    const title = document.getElementById("goalTitleInp")?.value.trim();
    if (!title) return;
    const topic = document.getElementById("goalTopicSel")?.value || (state.topics[0]?.name || "기타");
    const year = normalizeYear(document.getElementById("goalYearSel")?.value);
    const period = normalizePeriod(document.getElementById("goalPeriodSel")?.value);
    const quote = document.getElementById("goalQuoteInp")?.value.trim() || "";
    const note = document.getElementById("goalNoteInp")?.value.trim() || "";
    const isDone = draftGoalStage === 3;

    state.goals.unshift({
      id: uid(),
      topic,
      year,
      period,
      stage: draftGoalStage,
      title,
      quote,
      note,
      images: [...draftGoalImages],
      done: isDone,
      doneDate: isDone ? TODAY_STR : ""
    });
    showGoalComposer = false;
    draftGoalImages = [];
    saveState();
    render();
  }

  function openGoalTicket(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const imgs = normalizeImages(g);
    const stageName = GOAL_STAGES[g.done ? 3 : (g.stage || 0)];
    openViewModal(
      "목표 아티팩트 카드",
      `
        <div class="artifact-ticket">
          <div class="ticket-header">
            <span>GOAL ARTIFACT · ${escapeHtml(g.topic)}</span>
            <span>${normalizeYear(g.year)} ${escapeHtml(normalizePeriod(g.period))}</span>
          </div>
          <h4 class="ticket-title">${escapeHtml(g.title)}</h4>
          ${g.quote ? `<div style="font-family:var(--serif); font-size:15px; color:var(--text-sub); margin-top:6px;">“${escapeHtml(g.quote)}”</div>` : ""}
          <div class="ticket-grid">
            <div class="ticket-cell"><span>현재 상태</span><strong>${stageName}</strong></div>
            <div class="ticket-cell"><span>달성일</span><strong>${g.done && g.doneDate ? g.doneDate : "진행 중"}</strong></div>
          </div>
          ${imgs.length ? `<div class="modal-gallery" style="margin-top:12px;">${imgs.map(src => `<img src="${src}" />`).join("")}</div>` : ""}
          <div style="font-size:13.5px; line-height:1.75; white-space:pre-line; color:var(--text);">${escapeHtml(g.note || "작성된 실행 메모가 없습니다.")}</div>
        </div>
      `,
      () => openEditGoal(id)
    );
  }

  let modalGoalImages = [];
  async function handleModalGoalImages(event) {
    modalGoalImages = await processMultipleFiles(event.target.files, modalGoalImages, 5);
    event.target.value = "";
    const box = document.getElementById("mGoalImgBox");
    if (box) box.innerHTML = renderThumbList(modalGoalImages, "removeModalGoalImage");
  }
  function removeModalGoalImage(idx) {
    modalGoalImages.splice(idx, 1);
    const box = document.getElementById("mGoalImgBox");
    if (box) box.innerHTML = renderThumbList(modalGoalImages, "removeModalGoalImage");
  }

  function openEditGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    modalGoalImages = [...normalizeImages(g)];
    const curStage = g.done ? 3 : (g.stage || 0);
    openModal("목표 수정", `
      <div class="modal-field"><label>주제</label><select id="mGoalTopic">${state.topics.map(t => `<option value="${escapeAttr(t.name)}" ${g.topic === t.name ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}</select></div>
      <div class="modal-field"><label>연도</label><select id="mGoalYear">${YEARS.map(y => `<option value="${y}" ${normalizeYear(g.year) === String(y) ? "selected" : ""}>${y}년</option>`).join("")}</select></div>
      <div class="modal-field"><label>기간</label><select id="mGoalPeriod">${PERIODS.map(p => `<option value="${p}" ${normalizePeriod(g.period) === p ? "selected" : ""}>${p}</option>`).join("")}</select></div>
      <div class="modal-field"><label>진행 단계</label><select id="mGoalStage">${GOAL_STAGES.map((s, idx) => `<option value="${idx}" ${curStage === idx ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div class="modal-field"><label>목표 제목</label><input type="text" id="mGoalTitle" value="${escapeAttr(g.title)}" /></div>
      <div class="modal-field"><label>다짐 · 핵심 문장</label><input type="text" id="mGoalQuote" value="${escapeAttr(g.quote || "")}" /></div>
      <div class="modal-field"><label>실행 루틴 · 메모</label><textarea id="mGoalNote" style="min-height:90px;">${escapeHtml(g.note || "")}</textarea></div>
      <div class="modal-field">
        <label>사진 (최대 5장)</label>

      </div>

      g.topic = document.getElementById("mGoalTopic").value;
      g.year = normalizeYear(document.getElementById("mGoalYear").value);
      g.period = normalizePeriod(document.getElementById("mGoalPeriod").value);
      const st = Number(document.getElementById("mGoalStage").value);
      g.stage = st;
      g.done = st === 3;
      g.doneDate = g.done ? (g.doneDate || TODAY_STR) : "";

  function addTopic() {
    const icon = resolveIconKey(document.getElementById("newTopicIconSel")?.value, "target");
    const name = (document.getElementById("newTopicInp")?.value || "").trim();
    if (!name || state.topics.some(t => t.name === name)) return;
    state.topics.push({ name, icon });
    saveState(); render();
  }
  function openEditTopic(idx) {
    const target = state.topics[idx];
    if (!target) return;
    openModal("주제 수정", `
      <div class="modal-field"><label>픽토그램</label>${renderIconPickerHtml("mTopicIcon", target.icon)}</div>
      <div class="modal-field"><label>주제 이름</label><input type="text" id="mTopicName" value="${escapeAttr(target.name)}" /></div>
    `, () => {
      const newIcon = resolveIconKey(document.getElementById("mTopicIcon").value, target.icon);
      const newName = document.getElementById("mTopicName").value.trim();
      if (!newName) return;
      const oldName = target.name;
      state.topics[idx] = { name: newName, icon: newIcon };
      if (state.goalTopicFilter === oldName) state.goalTopicFilter = newName;
      state.goals.forEach(g => { if (g.topic === oldName) g.topic = newName; });
    });
  }
  function deleteTopic(idx) {
    const target = state.topics[idx];
    if (!target || !confirm(`'${target.name}' 주제를 삭제할까요?`)) return;
    state.topics.splice(idx, 1);
    if (state.goalTopicFilter === target.name) state.goalTopicFilter = "all";
    state.goals = state.goals.filter(g => g.topic !== target.name);
    saveState(); render();
  }

    const doneCnt = filtered.filter(b => b.done).length;

    return `
      <div class="topbar">
        <div class="topbar-left">

        </div>
        <div class="topbar-right">

          <span>달성률 <strong>${pct}%</strong></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%; background:var(--accent-warm);"></div>

                </span>
              </span>

        </div>
        <div class="cat-add-inline">

    const category = document.getElementById("bucketCatSel")?.value || (state.bucketCategories[0]?.name || "기타");
    const note = document.getElementById("bucketNoteInp")?.value.trim() || "";
    state.buckets.unshift({ id: uid(), category, title, note, done: false, doneDate: "" });
    showBucketComposer = false;
    saveState(); render();

    state.bucketCategories.push({ name, icon });

                  <h3 class="editorial-title clickable-label" onclick="toggleRowActions(event, '${key}')">${escapeHtml(a.title)}</h3>
                  ${(a.subtitle || a.location) ? `<div class="editorial-sub">${[a.subtitle, a.location].filter(Boolean).map(escapeHtml).join(" · ")}</div>` : ""}
                  ${a.quote ? `<div class="editorial-quote clickable-label" onclick="openArchiveTicket('${a.id}')">“${escapeHtml(a.quote)}”</div>` : ""}
                  ${a.note ? `<div class="editorial-note clickable-label" onclick="openArchiveTicket('${a.id}')">${escapeHtml(a.note)}</div>` : ""}
                </div>
              </article>
            `;
          }).join("")}
        </div>
      ` : `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">수집된 아카이브가 없습니다. 상단의 '+ 새 아카이브' 버튼으로 첫 번째 카드를 만들어 보세요.</p>
        </div>
      `}
    `;
  }

  function addArchiveItem() {
    const title = document.getElementById("archiveTitleInp")?.value.trim();
    if (!title) return;
    const category = document.getElementById("archiveCatSel")?.value || (state.archiveCategories[0]?.name || "기타");
    const date = document.getElementById("archiveDateInp")?.value || state.selectedDate || TODAY_STR;
    const subtitle = document.getElementById("archiveSubInp")?.value.trim() || "";
    const quote = document.getElementById("archiveQuoteInp")?.value.trim() || "";
    const note = document.getElementById("archiveNoteInp")?.value.trim() || "";
    const location = document.getElementById("archiveLocInp")?.value.trim() || "";
    const link = document.getElementById("archiveLinkInp")?.value.trim() || "";
    const rating = draftArchiveBlocks.has("rating") ? draftArchiveRating : 0;

    state.archives.unshift({
      id: uid(),
      category,
      date,
      title,
      subtitle,
      quote,
      rating,
      location,
      link,
      note,
      images: [...draftArchiveImages]
    });
    showArchiveComposer = false;
    draftArchiveImages = [];
    saveState(); render();
  }

  function openArchiveTicket(id) {
    const a = state.archives.find(x => x.id === id);
    if (!a) return;
    const imgs = normalizeImages(a);
    openViewModal(
      "아카이브 아티팩트",
      `
        <div class="artifact-ticket">
          <div class="ticket-header">
            <span>COLLECTION · ${escapeHtml(a.category)}</span>
            <span>${escapeHtml(a.date)}</span>
          </div>
          ${imgs.length ? `<div class="modal-gallery">${imgs.map(src => `<img src="${src}" />`).join("")}</div>` : ""}
          <h4 class="ticket-title">${escapeHtml(a.title)}</h4>
          ${a.subtitle ? `<div style="font-size:13px; color:var(--text-sub);">${escapeHtml(a.subtitle)}</div>` : ""}

          ${(a.rating || a.location || a.link) ? `
            <div class="ticket-grid">
              ${a.rating ? `<div class="ticket-cell"><span>여운 지수</span><strong>★ ${a.rating}.0 / 5.0</strong></div>` : ""}
              ${a.location ? `<div class="ticket-cell"><span>장소 · 공간</span><strong>${escapeHtml(a.location)}</strong></div>` : ""}
              ${a.link ? `<div class="ticket-cell" style="grid-column:1/-1;"><span>링크</span><a href="${escapeAttr(a.link)}" target="_blank" style="color:var(--text); font-size:12px; word-break:break-all;">${escapeHtml(a.link)}</a></div>` : ""}
            </div>
          ` : `<div style="height:12px;"></div>`}

          ${a.quote ? `<div class="editorial-quote" style="margin:12px 0;">“${escapeHtml(a.quote)}”</div>` : ""}
          <div style="font-size:13.5px; line-height:1.75; white-space:pre-line; color:var(--text);">${escapeHtml(a.note || "")}</div>
        </div>
      `,
      () => openEditArchive(id)
    );
  }

  let modalArchiveImages = [];
  async function handleModalArchiveImages(event) {
    modalArchiveImages = await processMultipleFiles(event.target.files, modalArchiveImages, 5);
    event.target.value = "";
    const box = document.getElementById("mArchiveImgBox");
    if (box) box.innerHTML = renderThumbList(modalArchiveImages, "removeModalArchiveImage");
  }
  function removeModalArchiveImage(idx) {
    modalArchiveImages.splice(idx, 1);
    const box = document.getElementById("mArchiveImgBox");
    if (box) box.innerHTML = renderThumbList(modalArchiveImages, "removeModalArchiveImage");
  }

  function openEditArchive(id) {
    const a = state.archives.find(x => x.id === id);
    if (!a) return;
    modalArchiveImages = [...normalizeImages(a)];
    openModal("아카이브 수정", `
      <div class="modal-field"><label>컬렉션</label><select id="mArchiveCat">${state.archiveCategories.map(c => `<option value="${escapeAttr(c.name)}" ${a.category === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}</select></div>
      <div class="modal-field"><label>날짜</label><input type="date" id="mArchiveDate" value="${escapeAttr(a.date)}" /></div>
      <div class="modal-field"><label>제목</label><input type="text" id="mArchiveTitle" value="${escapeAttr(a.title)}" /></div>
      <div class="modal-field"><label>부제 · 저자 · 다구</label><input type="text" id="mArchiveSub" value="${escapeAttr(a.subtitle || "")}" /></div>
      <div class="modal-field"><label>한 줄 인용 · 인상</label><input type="text" id="mArchiveQuote" value="${escapeAttr(a.quote || "")}" /></div>
      <div class="modal-field"><label>여운 지수 (0~5)</label><select id="mArchiveRating">${[0,1,2,3,4,5].map(n => `<option value="${n}" ${(a.rating || 0) === n ? "selected" : ""}>${n === 0 ? "표시 안 함" : `${n}점`}</option>`).join("")}</select></div>
      <div class="modal-field"><label>장소 · 공간</label><input type="text" id="mArchiveLoc" value="${escapeAttr(a.location || "")}" /></div>
      <div class="modal-field"><label>링크</label><input type="text" id="mArchiveLink" value="${escapeAttr(a.link || "")}" /></div>
      <div class="modal-field"><label>단상 · 감상 노트</label><textarea id="mArchiveNote" style="min-height:100px;">${escapeHtml(a.note || "")}</textarea></div>
      <div class="modal-field">
        <label>사진 (최대 5장)</label>
        <input type="file" accept="image/*" multiple onchange="handleModalArchiveImages(event)" />
        <div id="mArchiveImgBox" class="img-preview-box">${renderThumbList(modalArchiveImages, "removeModalArchiveImage")}</div>
      </div>
    `, () => {
      a.category = document.getElementById("mArchiveCat").value;
      a.date = document.getElementById("mArchiveDate").value || a.date;
      a.title = document.getElementById("mArchiveTitle").value.trim() || a.title;
      a.subtitle = document.getElementById("mArchiveSub").value.trim();
      a.quote = document.getElementById("mArchiveQuote").value.trim();
      a.rating = Number(document.getElementById("mArchiveRating").value);
      a.location = document.getElementById("mArchiveLoc").value.trim();
      a.link = document.getElementById("mArchiveLink").value.trim();
      a.note = document.getElementById("mArchiveNote").value.trim();
      a.images = [...modalArchiveImages];
    });
  }

  function addArchiveCategory() {
    const icon = resolveIconKey(document.getElementById("newArchiveCatIconSel")?.value, "folder");
    const name = (document.getElementById("newArchiveCatNameInp")?.value || "").trim();
    if (!name || state.archiveCategories.some(c => c.name === name)) return;
    state.archiveCategories.push({ name, icon });
    saveState(); render();
  }
  function openEditArchiveCategory(idx) {
    const target = state.archiveCategories[idx];
    if (!target) return;
    openModal("컬렉션 수정", `
      <div class="modal-field"><label>픽토그램</label>${renderIconPickerHtml("mArchCatIcon", target.icon)}</div>
      <div class="modal-field"><label>컬렉션 이름</label><input type="text" id="mArchCatName" value="${escapeAttr(target.name)}" /></div>
    `, () => {
      const newIcon = resolveIconKey(document.getElementById("mArchCatIcon").value, target.icon);
      const newName = document.getElementById("mArchCatName").value.trim();
      if (!newName) return;
      const oldName = target.name;
      state.archiveCategories[idx] = { name: newName, icon: newIcon };
      if (state.archiveCatFilter === oldName) state.archiveCatFilter = newName;
      state.archives.forEach(a => { if (a.category === oldName) a.category = newName; });
    });
  }
  function deleteArchiveCategory(idx) {
    const target = state.archiveCategories[idx];
    if (!target || !confirm(`'${target.name}' 컬렉션을 삭제할까요?`)) return;
    state.archiveCategories.splice(idx, 1);
    if (state.archiveCatFilter === target.name) state.archiveCatFilter = "all";
    state.archives = state.archives.filter(a => a.category !== target.name);
    saveState(); render();
  }

  /* 공통 유틸 */
  function renderDoneDateControl(collection, id, doneDate) {
    return `<span class="done-date-inline">달성일 <input type="date" value="${escapeAttr(doneDate || TODAY_STR)}" onchange="updateDoneDate('${collection}','${id}',this.value)" /></span>`;
  }
  function renderThumbList(images, removeFnName) {
    if (!images || images.length === 0) return `<span style="font-size:12px; color:var(--text-muted);">첨부된 사진 없음</span>`;
    return images.map((src, i) => `
      <span class="thumb-wrap">
        <img src="${src}" />
        <button type="button" class="thumb-del-btn" onclick="${removeFnName}(${i})">×</button>
      </span>
    `).join("");
  }
  function toggleAchieve(collection, id) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    item.doneDate = item.done ? (item.doneDate || state.selectedDate || TODAY_STR) : "";
    saveState(); render();
  }
  function updateDoneDate(collection, id, newDate) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.doneDate = newDate; item.done = true;
    saveState(); render();
  }
  function toggleTodo(id) {
    const item = state.todos.find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    saveState(); render();
  }
  function deleteItem(collection, id) {
    state[collection] = state[collection].filter(x => x.id !== id);
    activeActionTarget = null;
    saveState(); render();
  }
  function openModal(title, bodyHtml, onSave) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalActions").innerHTML = `<button class="btn" onclick="closeModal()">취소</button><button class="btn btn-primary" id="modalSaveBtn">저장</button>`;
    document.getElementById("editModal").classList.add("open");
    document.getElementById("modalSaveBtn").onclick = () => { onSave(); closeModal(); saveState(); render(); };
  }
  function openViewModal(title, bodyHtml, onSwitchEdit) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalActions").innerHTML = `<button class="btn" id="modalSwitchEditBtn">수정하기</button><button class="btn btn-primary" onclick="closeModal()">닫기</button>`;
    document.getElementById("editModal").classList.add("open");
    document.getElementById("modalSwitchEditBtn").onclick = () => { closeModal(); onSwitchEdit(); };
  }
  function closeModal() { document.getElementById("editModal").classList.remove("open"); }
  function openEditBucket(id) {
    const b = state.buckets.find(x => x.id === id);
    if (!b) return;
    openModal("버킷리스트 수정", `
      <div class="modal-field"><label>분류</label><select id="mBucketCat">${state.bucketCategories.map(c => `<option value="${escapeAttr(c.name)}" ${b.category === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}</select></div>
      <div class="modal-field"><label>내용</label><input type="text" id="mBucketTitle" value="${escapeAttr(b.title)}" /></div>
      <div class="modal-field"><label>메모</label><input type="text" id="mBucketNote" value="${escapeAttr(b.note || "")}" /></div>
      <div class="modal-field"><label>달성 날짜</label><input type="date" id="mBucketDoneDate" value="${escapeAttr(b.doneDate || "")}" /></div>
    `, () => {
      b.category = document.getElementById("mBucketCat").value;
      b.title = document.getElementById("mBucketTitle").value.trim() || b.title;
      b.note = document.getElementById("mBucketNote").value.trim();
      b.doneDate = document.getElementById("mBucketDoneDate").value;
      if (b.doneDate) b.done = true;
    });
  }
  function openEditTodo(id) {
    const t = state.todos.find(x => x.id === id);
    if (!t) return;
    openModal("할일 수정", `
      <div class="modal-field"><label>날짜</label><input type="date" id="mTodoDate" value="${escapeAttr(t.date)}" /></div>
      <div class="modal-field"><label>할일</label><input type="text" id="mTodoTitle" value="${escapeAttr(t.title)}" /></div>
    `, () => {
      t.date = document.getElementById("mTodoDate").value || t.date;
      t.title = document.getElementById("mTodoTitle").value.trim() || t.title;
    });
  }
  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `archive_planner_editorial_${TODAY_STR}.json`; a.click();
    URL.revokeObjectURL(url);
  }
  function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        state = { ...structuredClone(defaultState), ...parsed };
        if (state.activeTab === "plans" || state.activeTab === "todos") state.activeTab = "goals";
        state.topics = normalizeCategoryList(state.topics, "target");
        state.archiveCategories = normalizeCategoryList(state.archiveCategories, "folder");
        state.bucketCategories = normalizeCategoryList(state.bucketCategories, "star");
        saveState(); render();
        alert("백업 데이터를 복원했습니다.");
      } catch { alert("올바른 JSON 백업 파일이 아닙니다."); }
    };
    reader.readAsText(file);
  }
  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function escapeAttr(str) { return escapeHtml(str).replace(/'/g, "&#39;"); }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  mountNavIcons();
  render();
</script>
</body>
</html>
