  // 저장된 mode와 값을 함께 보고 지금 모양을 정한다 (예전 기록도 그대로 읽힌다)
  function dateModeOf(item) {
    if (!item) return "none";
    const from = String(item.dateFrom || item.date || "");
    const to = String(item.dateTo || "");
    if (!from && !to) return "none";
    if (from && to && to !== from) return "range";
    if (to && !from) return "to";
    const mode = item.dateMode;
    if (mode === "to") return to ? "to" : "none";
    if (mode === "from") return "from";
    return "day";
  }

  function itemDateFrom(item) {
    const mode = dateModeOf(item);
    if (mode === "none" || mode === "to") return "";
    return String(item.dateFrom || item.date || "");
  }

  function itemDateTo(item) {
    const mode = dateModeOf(item);
    if (mode === "range" || mode === "to") return String(item.dateTo || "");
    return "";
  }

  function dottedDate(dateStr) {
    return String(dateStr || "").replace(/-/g, ".");
  }

  function humanDateRange(from, to) {
    if (from && to && to !== from) {
      if (from.slice(0, 4) === to.slice(0, 4)) return `${dottedDate(from)} – ${to.slice(5).replace("-", ".")}`;
      return `${dottedDate(from)} – ${dottedDate(to)}`;
    }
    if (from) return `${dottedDate(from)} ~`;
    if (to) return `~ ${dottedDate(to)}`;
    return "";
  }

  // 날짜 도장 (아카이브 · 목표 공용)
  //  · 시작일만: `2026.11.28 ~`   · 종료일만: `~ 2026.12.19`
  //  · 둘 다 있고 다름: 두 줄 기간  · 하루: `2026.11.28`
  function stampHtml(from, to, opts = {}) {
    if (!from && !to) return "";
    const kind = opts.kind ? ` nb-stamp--${opts.kind}` : "";
    const label = opts.label ? `<span>${escapeHtml(opts.label)}</span>` : "";
    const open = opts.open === true;
    if (from && to && to !== from) {
      const second = from.slice(0, 4) === to.slice(0, 4) ? `– ${to.slice(5).replace("-", ".")}` : `– ${dottedDate(to)}`;
      return `<span class="nb-stamp nb-stamp--range${kind}"><b>${escapeHtml(dottedDate(from))}</b><span class="nb-stamp-date">${escapeHtml(second)}</span>${label}</span>`;
    }
    if (from && to) {
      return `<span class="nb-stamp${kind}"><b>${escapeHtml(dottedDate(from))}</b>${label}</span>`;
    }
    if (from) {
      return open
        ? `<span class="nb-stamp nb-stamp--open${kind}"><b>${escapeHtml(dottedDate(from))} ~</b>${label}</span>`
        : `<span class="nb-stamp${kind}"><b>${escapeHtml(dottedDate(from))}</b>${label}</span>`;
    }
    return `<span class="nb-stamp nb-stamp--open${kind}"><b>~ ${escapeHtml(dottedDate(to))}</b>${label}</span>`;
  }

  function archiveStampHtml(a) {
    const mode = dateModeOf(a);
    if (mode === "none") return "";
    const from = itemDateFrom(a);
    const to = itemDateTo(a);
    let label;
    if (mode === "range") label = "PERIOD";
    else if (mode === "from") label = "진행 중";
    else if (mode === "to") label = "예정";
    else label = /^\d{4}-\d{2}-\d{2}$/.test(from) ? `${KO_DOW[getDayOfWeek(from)]}요일` : "DATE";
    return stampHtml(from, to, { label, open: mode === "from" });
  }

  // ---------- 통합 목표·버킷 항목 ----------
  function unifiedGoalItems() {
    const out = [];
    (state.goals || []).forEach(g => out.push({ item: g, src: "goals" }));
    (state.buckets || []).forEach(b => out.push({ item: b, src: "buckets" }));
    return out;
  }

  function goalEntryTopic(entry) {
    const it = (entry && entry.item) || {};
    return canonicalTopicName(entry && entry.src === "buckets" ? it.category : it.topic);
  }

  function findGoalEntry(id) {
    return unifiedGoalItems().find(e => e.item.id === id) || null;
  }

  // 일기 면에서 목표·버킷 바로 삭제
  function deleteGoalItem(id) {
    const entry = findGoalEntry(id);
    if (!entry) return;
    deleteItem(entry.src, id);
  }

  function toggleGoalItem(id) {
    const entry = findGoalEntry(id);
    if (!entry) return;
    const it = entry.item;
    it.done = !it.done;
    if (it.done) {
      // 완료 체크: 날짜가 비어 있으면 오늘로 채우고, 있으면 그 날짜/기간을 DONE 도장으로 쓴다
      if (!itemDateFrom(it)) {
        const d = /^\d{4}-\d{2}-\d{2}$/.test(String(state.selectedDate || "")) ? state.selectedDate : TODAY_STR;
        it.dateMode = "day";
        it.dateFrom = d;
        it.dateTo = "";
      }
      it.doneDate = itemDateTo(it) || itemDateFrom(it) || TODAY_STR;
    } else {
      it.doneDate = "";
    }
    saveState();
    render();
  }

  // 예전 `달성일` 값을 `날짜` 하나로 합칩니다 (완료 + 날짜 없음 → 오늘)
  function syncGoalDoneDate(it) {
    if (!it) return;
    if (!it.done) { it.doneDate = ""; return; }
    if (!itemDateFrom(it) && it.doneDate) {
      it.dateMode = "day";
      it.dateFrom = String(it.doneDate);
      it.dateTo = "";
    }
    if (!itemDateFrom(it)) {
      it.dateMode = "day";
      it.dateFrom = TODAY_STR;
      it.dateTo = "";
    }
    it.doneDate = itemDateTo(it) || itemDateFrom(it) || TODAY_STR;
  }

  // 날짜 도장 하나로 PLAN / DONE 을 그립니다 (같은 날짜, 완료 여부만 다름)
  function goalDateStampHtml(item) {
    if (!item) return "";
    let from = itemDateFrom(item);
    const to = itemDateTo(item);
    if (!from && !to && item.doneDate) from = String(item.doneDate);
    if (!from && !to) return "";
    const done = Boolean(item.done);
    const label = done ? "DONE" : "PLAN";
    const title = done ? "달성한 날짜" : "예정일";
    const cls = done ? "gb-stamp" : "gb-stamp gb-stamp--plan";
    const mode = dateModeOf(item);
    if (from && to && to !== from) {
      const second = from.slice(0, 4) === to.slice(0, 4) ? `– ${to.slice(5).replace("-", ".")}` : `– ${dottedDate(to)}`;
      return `<span class="${cls} gb-stamp--range" title="${title}"><b>${escapeHtml(dottedDate(from))}</b><span>${escapeHtml(second)} · ${label}</span></span>`;
    }
    // 시작일만: 아직 끝나지 않은 기간
    if (from && mode === "from") {
      return `<span class="${cls} gb-stamp--range" title="${title}"><b>${escapeHtml(dottedDate(from))} ~</b><span>${label}</span></span>`;
    }
    // 종료일만: 시작일을 모르는 기간
    if (!from && to) {
      return `<span class="${cls} gb-stamp--range" title="${title}"><b>~ ${escapeHtml(dottedDate(to))}</b><span>${label}</span></span>`;
    }
    return `<span class="${cls}" title="${title}"><b>${escapeHtml(dottedDate(from))}</b><span>${label}</span></span>`;
  }

  // ---------- 날짜 입력 UI (미니컬 스타일 한 줄: 시작일 › 종료일, 시간 없음) ----------
  const DATE_ICON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`;
  const DATE_CLEAR_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>`;

  // v3.6: 시작일·종료일을 따로 넣는다. 아직 끝나지 않았으면 종료일을 비워 둔다 (자동으로 채우지 않음)
  function dateFieldsHtml(prefix, item) {
    const from = item ? itemDateFrom(item) : "";
    const to = item ? itemDateTo(item) : "";
    const empty = !from && !to;
    return `
      <div class="date-row ${empty ? "is-empty" : ""}" id="${prefix}DateRow">
        <span class="date-row-icon" onclick="showDatePicker('${prefix}DateFrom')" aria-hidden="true">${DATE_ICON}</span>
        <label class="date-pill">
          <span class="date-pill-text ${from ? "" : "is-empty"}" id="${prefix}FromText">${from ? escapeHtml(dottedDate(from)) : "시작일"}</span>
          <input type="date" id="${prefix}DateFrom" value="${escapeAttr(from)}" aria-label="시작일" onchange="onDateRowChange('${prefix}', 'from')" onclick="showDatePicker('${prefix}DateFrom')" />
        </label>
        <span class="date-row-sep" aria-hidden="true">&#8250;</span>
        <label class="date-pill">
          <span class="date-pill-text ${to ? "" : "is-empty"}" id="${prefix}ToText">${to ? escapeHtml(dottedDate(to)) : "종료일"}</span>
          <input type="date" id="${prefix}DateTo" value="${escapeAttr(to)}" aria-label="종료일" onchange="onDateRowChange('${prefix}', 'to')" onclick="showDatePicker('${prefix}DateTo')" />
        </label>
        <button type="button" class="date-clear" onclick="clearDateRow('${prefix}')" aria-label="날짜 지우기" title="날짜 지우기">${DATE_CLEAR_ICON}</button>
      </div>
    `;
  }

  // 설정된 날짜를 한 번에 지운다 (비어 있으면 버튼 자체가 보이지 않음)
  function clearDateRow(prefix) {
    const fromEl = document.getElementById(prefix + "DateFrom");
    const toEl = document.getElementById(prefix + "DateTo");
    if (fromEl) fromEl.value = "";
    if (toEl) toEl.value = "";
    syncDateRow(prefix);
  }

  // ---------- 목표 분기 선택 (연도 + 미지정/1~4분기) ----------
  const QUARTER_LABELS = ["미지정", "1분기", "2분기", "3분기", "4분기"];

  function quarterOfDate(dateStr) {
    const m = Number(String(dateStr || "").slice(5, 7));
    return m >= 1 && m <= 12 ? Math.floor((m - 1) / 3) + 1 : 0;
  }

  function goalQuarterHtml(item) {
    const qy = String((item && item.qYear) || "").slice(0, 4);
    const year = /^\d{4}$/.test(qy) ? qy : TODAY_STR.slice(0, 4);
    const quarter = Math.max(0, Math.min(4, Number(item && item.qQuarter) || 0));
    const years = (typeof getYearOptions === "function" ? getYearOptions() : YEARS).map(Number).filter(n => n > 1900);
    if (!years.includes(Number(year))) years.push(Number(year));
    years.sort((a, b) => a - b);
    return `
      <div class="qs-row" id="mGoalQuarterRow">
        <select id="mGoalQuarterYear" aria-label="목표 연도">
          ${years.map(y => `<option value="${y}" ${String(y) === year ? "selected" : ""}>${y}년</option>`).join("")}
        </select>
        <div class="qs-seg" role="group" aria-label="분기 선택">
          ${QUARTER_LABELS.map((label, i) => `<button type="button" class="qs-btn ${i === quarter ? "is-on" : ""}" data-q="${i}" onclick="pickGoalQuarter(${i})" aria-pressed="${i === quarter ? "true" : "false"}">${label}</button>`).join("")}
        </div>
      </div>
      <input type="hidden" id="mGoalQuarter" value="${quarter}" />
    `;
  }

  function pickGoalQuarter(q) {
    const n = Math.max(0, Math.min(4, Number(q) || 0));
    const hidden = document.getElementById("mGoalQuarter");
    if (hidden) hidden.value = String(n);
    document.querySelectorAll("#mGoalQuarterRow .qs-btn").forEach(btn => {
      const on = Number(btn.dataset.q) === n;
      btn.classList.toggle("is-on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  // 시작일을 고르면 해당 연도·분기를 자동으로 맞춘다
  function syncGoalQuarterFromDate() {
    if (!document.getElementById("mGoalQuarterRow")) return;
    const fromEl = document.getElementById("mGoalDateFrom");
    const dateStr = fromEl ? String(fromEl.value || "") : "";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
    const y = dateStr.slice(0, 4);
    const sel = document.getElementById("mGoalQuarterYear");
    if (sel) {
      if (![...sel.options].some(o => o.value === y)) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = `${y}년`;
        sel.appendChild(opt);
      }
      sel.value = y;
    }
    const q = quarterOfDate(dateStr);
    if (q) pickGoalQuarter(q);
  }

  function readGoalQuarter() {
    const yEl = document.getElementById("mGoalQuarterYear");
    const qEl = document.getElementById("mGoalQuarter");
    const year = yEl ? normalizeYear(yEl.value) : TODAY_STR.slice(0, 4);
    const q = qEl ? Math.max(0, Math.min(4, Number(qEl.value) || 0)) : 0;
    return { year, quarter: q >= 1 && q <= 4 ? q : 0 };
  }

  // 달력 아이콘을 눌러도 날짜 선택기가 열리게 (기본 달력 아이콘은 숨김)
  function showDatePicker(id) {
    const el = document.getElementById(id);
    if (!el || typeof el.showPicker !== "function") return;
    try { el.showPicker(); } catch (_) {}
  }

  function syncDateRow(prefix) {
    const fromEl = document.getElementById(prefix + "DateFrom");
    const toEl = document.getElementById(prefix + "DateTo");
    const fromText = document.getElementById(prefix + "FromText");
    const toText = document.getElementById(prefix + "ToText");
    const row = document.getElementById(prefix + "DateRow");
    const from = fromEl ? fromEl.value : "";
    const to = toEl ? toEl.value : "";
    if (fromText) {
      fromText.textContent = from ? dottedDate(from) : "시작일";
      fromText.classList.toggle("is-empty", !from);
    }
    if (toText) {
      toText.textContent = to ? dottedDate(to) : "종료일";
      toText.classList.toggle("is-empty", !to);
    }
    if (row) row.classList.toggle("is-empty", !from && !to);
  }

  // 시작일·종료일은 서로를 채우지 않는다 (한쪽만 넣어도 그대로 저장)
  function onDateRowChange(prefix, changed) {
    const fromEl = document.getElementById(prefix + "DateFrom");
    const toEl = document.getElementById(prefix + "DateTo");
    if (!fromEl || !toEl) return;
    syncDateRow(prefix);
    if (prefix === "mGoal") syncGoalQuarterFromDate();
    if (prefix === "mArchive" || prefix === "mNewArchive") updateArchiveTitleAuto();
  }

  function readDateFields(prefix) {
    const fromEl = document.getElementById(prefix + "DateFrom");
    const toEl = document.getElementById(prefix + "DateTo");
    let from = fromEl ? fromEl.value : "";
    let to = toEl ? toEl.value : "";
    if (!from && !to) return { dateMode: "none", dateFrom: "", dateTo: "" };
    if (from && to) {
      if (from === to) return { dateMode: "day", dateFrom: from, dateTo: "" };
      if (to < from) { const t = from; from = to; to = t; }
      return { dateMode: "range", dateFrom: from, dateTo: to };
    }
    if (from) return { dateMode: "from", dateFrom: from, dateTo: "" };
    return { dateMode: "to", dateFrom: "", dateTo: to };
  }

  // 인덱스 탭 라벨을 한 글자씩 세로로 세워 표시 (글꼴·브라우저에 상관없이 똑바로)
  function stackedLabel(text) {
    return String(text == null ? "" : text)
      .split("")
      .filter(ch => ch.trim())
      .map(ch => `<i>${escapeHtml(ch)}</i>`)
      .join("");
  }

  function normalizeTab(tab) {
    if (tab === "diary") return "year";
    // v2.9: 목표와 버킷리스트를 하나의 책자 탭(목표 · 버킷)으로 통합
    if (tab === "bucket") return "goals";
    if (!tab || tab === "todos" || tab === "plans") return "goals";
    if (!["year", "goals", "archive"].includes(tab)) return "year";
    return tab;
  }

  function normalizeYear(y) {
    const cleaned = String(y || "").replace(/[^0-9]/g, "");
    return cleaned || "2026";
  }

  function normalizePeriod(p) {
    const trimmed = String(p || "").trim();
    return PERIODS.includes(trimmed) ? trimmed : "연간";
  }

  function normalizeCategoryList(list, fallbackIcon = "target") {
    if (!Array.isArray(list)) return [];
    const seen = new Set();
    return list.map(item => {
      if (typeof item === "string") return { name: item, icon: fallbackIcon };
      const name = String(item && item.name ? item.name : "").trim();
      const rawIcon = (item && (item.icon || item.emoji)) || fallbackIcon;
      return { name, icon: resolveIconKey(rawIcon, fallbackIcon) };
    }).filter(x => {
      if (!x.name || seen.has(x.name)) return false;
      seen.add(x.name);
      return true;
    });
  }

  function normalizeImages(item) {
    if (item && Array.isArray(item.images)) return item.images.filter(Boolean);
    if (item && item.image) return [item.image];
    return [];
  }

  // ---------- 주제별 책(Books) 데이터 모델 ----------

  function normalizeSpineColor(val, fallback) {
    const s = String(val || "").trim();
    return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toLowerCase() : fallback;
  }

  function seedBooksFromCategories(cats) {
    const list = (Array.isArray(cats) ? cats : []).filter(c => c && String(c.name || "").trim());
    if (!list.length) {
      return [{ id: "bk_" + uid().slice(3), title: "나의 기록", category: "", subject: "", spine: BOOK_SPINE_PALETTE[0], cover: "", createdAt: TODAY_STR }];
    }
    return list.map((c, i) => ({
      id: "bk_" + uid().slice(3),
      title: String(c.name).trim(),
      category: String(c.name).trim(),
      subject: "",
      spine: BOOK_SPINE_PALETTE[i % BOOK_SPINE_PALETTE.length],
      cover: "",
      createdAt: TODAY_STR
    }));
  }

  // 책 목록 정리 · 이전 기록을 책에 매칭 · 미분류 책 보장
  function applyBookModel(s) {
    const seen = new Set();
    s.books = (Array.isArray(s.books) ? s.books : []).filter(b => {
      if (!b || !b.id || !String(b.title || "").trim()) return false;
      if (seen.has(b.id)) return false;
      seen.add(b.id);
      return true;
    }).map((b, i) => ({
      id: String(b.id),
      title: String(b.title).trim(),
      subtitle: typeof b.subtitle === "string" ? b.subtitle : String(b.subject || ""),
      category: String(b.category || "").trim(),
      subject: String(b.subject || "").trim(),
      spine: normalizeSpineColor(b.spine, BOOK_SPINE_PALETTE[i % BOOK_SPINE_PALETTE.length]),
      cover: typeof b.cover === "string" ? b.cover : "",
      auto: Boolean(b.auto),
      createdAt: b.createdAt || TODAY_STR
    }));

    if (!s.booksSeeded) {
      if (!s.books.length) s.books = seedBooksFromCategories(s.archiveCategories);
      s.booksSeeded = true;
    }

    const ids = new Set(s.books.map(b => b.id));
    (s.archives || []).forEach(a => {
      if (a.bookId && ids.has(a.bookId)) return;
      const byCat = s.books.find(b => b.category && b.category === a.category);
      a.bookId = byCat ? byCat.id : "";
    });

    const orphans = (s.archives || []).filter(a => !a.bookId);
    let inbox = s.books.find(b => b.id === "book_inbox");
    if (orphans.length) {
      if (!inbox) {
        inbox = { id: "book_inbox", title: "미분류 기록", category: "", subject: "", spine: "#5b6478", cover: "", auto: true, createdAt: TODAY_STR };
        s.books.push(inbox);
      }
      orphans.forEach(a => { a.bookId = inbox.id; });
    } else if (inbox && !s.archives.some(a => a.bookId === inbox.id)) {
      s.books = s.books.filter(b => b.id !== "book_inbox");
    }

    if (s.shelfSelectedBookId && !s.books.some(b => b.id === s.shelfSelectedBookId)) s.shelfSelectedBookId = "";
  }

  // v3.1: 목표 주제와 버킷 분류를 하나의 주제 목록으로 통합한다.
  // 주제 관리에 등록된 이 목록만 인덱스 탭과 페이지가 된다. 목록에 없는 기존 항목은 첫 주제로 모아 둔다.
  function mergeTopicUniverse(s) {
    const topics = [];
    const push = (rawName, iconHint, fallbackIcon) => {
      const name = canonicalTopicName(rawName);
      if (!name || topics.some(t => t.name === name)) return;
      topics.push({ name, icon: resolveIconKey(iconHint, fallbackIcon) });
    };
    (Array.isArray(s.topics) ? s.topics : []).forEach(t => push(t && t.name, t && t.icon, "target"));
    (Array.isArray(s.bucketCategories) ? s.bucketCategories : []).forEach(c => push(c && c.name, c && c.icon, "star"));
    if (!topics.length) topics.push({ name: "기타", icon: "target" });
    const names = topics.map(t => t.name);
    const settle = raw => {
      const c = canonicalTopicName(raw);
      return names.includes(c) ? c : names[0];
    };
    s.topics = topics;
    (s.goals || []).forEach(g => { g.topic = settle(g.topic); });
    (s.buckets || []).forEach(b => { b.category = settle(b.category); });
    s.bucketCategories = topics.map(t => ({ name: t.name, icon: t.icon }));
    s.goalBookTopic = canonicalTopicName(s.goalBookTopic) || "";
    if (!names.includes(s.goalBookTopic)) s.goalBookTopic = "";
    s.goalBookPage = Math.max(0, Number(s.goalBookPage) || 0);
  }

  function normalizeState(parsed) {
    const merged = { ...clone(defaultState), ...parsed };
    merged.activeTab = normalizeTab(merged.activeTab);
    merged.yearBooks = normalizeYearBooks(merged.yearBooks && merged.yearBooks.length ? merged.yearBooks : YEARS.map((y, i) => ({ year: y, spine: BOOK_SPINE_PALETTE[i % BOOK_SPINE_PALETTE.length], cover: "" })));
    if (!["auto", "matrix", "months"].includes(merged.yearViewMode)) merged.yearViewMode = "auto";
    merged.topics = normalizeCategoryList(merged.topics, "target");
    merged.archiveCategories = normalizeCategoryList(merged.archiveCategories, "folder");
    merged.bucketCategories = normalizeCategoryList(merged.bucketCategories, "star");
    mergeTopicUniverse(merged);
    merged.logs = (merged.logs && typeof merged.logs === "object" && !Array.isArray(merged.logs)) ? merged.logs : {};
    merged.goals = (Array.isArray(merged.goals) ? merged.goals : []).map(g => {
      const rawMode = ["none", "day", "range", "from", "to"].includes(g.dateMode) ? g.dateMode : (g.dateFrom ? "day" : "none");
      const doneDate = String(g.doneDate || "").trim();
      // 예전 `달성일`만 있던 기록은 그 날짜를 `날짜` 하나로 옮긴다 (달성일·날짜 통합)
      const migrated = !g.dateFrom && /^\d{4}-\d{2}-\d{2}$/.test(doneDate);
      return {
        note: "",
        ...g,
        images: normalizeImages(g),
        year: normalizeYear(g.year),
        period: normalizePeriod(g.period),
        qYear: String(g.qYear || "").slice(0, 4),
        qQuarter: [1, 2, 3, 4].includes(Number(g.qQuarter)) ? Number(g.qQuarter) : 0,
        dateMode: migrated ? "day" : rawMode,
        dateFrom: migrated ? doneDate : String(g.dateFrom || ""),
        dateTo: String(g.dateTo || "")
      };
    });
    merged.buckets = (Array.isArray(merged.buckets) ? merged.buckets : []).map(b => ({
      note: "",
      doneDate: "",
      ...b,
      qYear: String(b.qYear || "").slice(0, 4),
      qQuarter: [1, 2, 3, 4].includes(Number(b.qQuarter)) ? Number(b.qQuarter) : 0
    }));
    merged.archives = (Array.isArray(merged.archives) ? merged.archives : []).map(a => ({
      ...a,
      images: normalizeImages(a),
      dateMode: ["none", "day", "range", "from", "to"].includes(a.dateMode) ? a.dateMode : (a.date ? "day" : "none"),
      dateFrom: String(a.dateFrom || ""),
      dateTo: String(a.dateTo || "")
    }));
    merged.todos = (Array.isArray(merged.todos) ? merged.todos : []).map(t => ({
      done: false,
      ...t
    }));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(merged.selectedDate))) merged.selectedDate = TODAY_STR;
    if (merged.yearFilter !== "all" && !YEARS.includes(Number(normalizeYear(merged.yearFilter)))) {
      merged.yearFilter = defaultState.yearFilter;
    }
    if (!["year", "goals", "archive"].includes(merged.activeTab)) merged.activeTab = "year";
    if (typeof merged.goalBookTopic !== "string") merged.goalBookTopic = "";
    applyBookModel(merged);
    return merged;
  }

  // ---------- 이전 버전(archive_planner_index_v2_3) 데이터 이전 ----------
  function guessIconByName(name) {
    const n = String(name || "");
    const rules = [
      [/학업|공부|전공|시험|임용|교육|수학/, "book"],
      [/운동|건강|헬스|근력/, "dumbbell"],
      [/독서|책|문화|전시|예술|그림/, "palette"],
      [/자산|경제|재테크|투자|돈/, "chart"],
      [/생활|루틴|습관|일상/, "leaf"],
      [/여행|탐험|해외/, "compass"],
      [/음악|공연|LP/, "music"],
      [/차|미식|커피|음료/, "coffee"]
    ];
    for (const [re, key] of rules) {
      if (re.test(n)) return key;
    }
    return null;
  }

  function looksLikeLegacyIndex(obj) {
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
    if (obj.logs || obj.topics) return false;
    return (
      Array.isArray(obj.archives) ||
      (obj.diaries && typeof obj.diaries === "object") ||
      Array.isArray(obj.goalCategories) ||
      "selectedArchiveCat" in obj ||
      "calMode" in obj ||
      "calYear" in obj
    );
  }

  function isUntouchedLegacySample(obj) {
    const archives = Array.isArray(obj.archives) ? obj.archives : [];
    const goals = Array.isArray(obj.goals) ? obj.goals : [];
    const buckets = Array.isArray(obj.buckets) ? obj.buckets : [];
    const diaryDates = (obj.diaries && typeof obj.diaries === "object" && !Array.isArray(obj.diaries)) ? Object.keys(obj.diaries) : [];
    return (
      archives.every(a => LEGACY_SAMPLE.archives.includes(a && a.title)) &&
      goals.every(g => LEGACY_SAMPLE.goals.includes(g && g.title)) &&
      buckets.every(b => LEGACY_SAMPLE.buckets.includes(b && b.title)) &&
      diaryDates.every(d => LEGACY_SAMPLE.diaryDates.includes(d))
    );
  }

  function migrateLegacyIndex(parsed) {
    if (!looksLikeLegacyIndex(parsed)) return null;
    if (isUntouchedLegacySample(parsed)) return null;

    const base = clone(defaultState);
    const topics = [];
    (Array.isArray(parsed.goalCategories) ? parsed.goalCategories : []).forEach(raw => {
      const name = String(raw && raw.name ? raw.name : raw || "").trim();
      if (name && !topics.some(t => t.name === name)) {
        topics.push({ name, icon: resolveIconKey(raw && raw.icon, guessIconByName(name) || "target") });
      }
    });

    const archiveCategories = [];
    (Array.isArray(parsed.archiveCategories) ? parsed.archiveCategories : []).forEach(raw => {
      const name = String(raw && raw.name ? raw.name : raw || "").trim();
      if (name && !archiveCategories.some(c => c.name === name)) {
        archiveCategories.push({ name, icon: resolveIconKey(raw && raw.icon, guessIconByName(name) || "folder") });
      }
    });

    const logs = {};
    if (parsed.diaries && typeof parsed.diaries === "object" && !Array.isArray(parsed.diaries)) {
      Object.entries(parsed.diaries).forEach(([dateStr, value]) => {
        if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
        const oneLine = String(value.summary || value.oneLine || "").trim();
        const diary = String(value.body || value.diary || "").trim();
        if (oneLine || diary) logs[dateStr] = { oneLine, diary };
      });
    }

    const goals = (Array.isArray(parsed.goals) ? parsed.goals : []).map(g => {
      const title = String(g && g.title || "").trim();
      if (!title) return null;
      let topic = String(g.category || g.topic || "").trim();
      if (!topic) topic = topics[0] ? topics[0].name : "기타";
      if (!topics.some(t => t.name === topic)) {
        topics.push({ name: topic, icon: guessIconByName(topic) || "target" });
      }
      return {
        id: g.id || uid(),
        topic,
        year: normalizeYear(g.year),
        period: normalizePeriod(g.period),
        title,
        note: String(g.note || g.detail || "").trim(),
        images: [],
        done: Boolean(g.done),
        doneDate: String(g.doneDate || "").trim()
      };
    }).filter(Boolean);

    const bucketCategories = [];
    const buckets = (Array.isArray(parsed.buckets) ? parsed.buckets : []).map(b => {
      const title = String(b && b.title || "").trim();
      if (!title) return null;
      let category = String(b.category || "").trim() || "경험";
      if (!bucketCategories.some(c => c.name === category)) {
        bucketCategories.push({ name: category, icon: guessIconByName(category) || "star" });
      }
      return {
        id: b.id || uid(),
        category,
        title,
        note: String(b.note || b.detail || "").trim(),
        done: Boolean(b.done),
        doneDate: String(b.doneDate || "").trim()
      };
    }).filter(Boolean);

    const archives = (Array.isArray(parsed.archives) ? parsed.archives : []).map(a => {
      const title = String(a && a.title || "").trim();
      if (!title) return null;
      const category = String(a.category || "").trim() || (archiveCategories[0] ? archiveCategories[0].name : "기타");
      if (!archiveCategories.some(c => c.name === category)) {
        archiveCategories.push({ name: category, icon: guessIconByName(category) || "folder" });
      }
      return {
        id: a.id || uid(),
        category,
        date: String(a.date || TODAY_STR).trim(),
        title,
        subtitle: String(a.subtitle || "").trim(),
        note: String(a.note || "").trim(),
        images: a.coverUrl ? [a.coverUrl] : []
      };
    }).filter(Boolean);

    const calYear = Number(parsed.calYear);
    const yearFilter = YEARS.includes(calYear) ? String(calYear) : base.yearFilter;
    const selectedDate = /^\d{4}-\d{2}-\d{2}$/.test(String(parsed.diaryDate || "")) ? parsed.diaryDate : base.selectedDate;

    return {
      ...base,
      activeTab: normalizeTab(parsed.activeTab),
      yearFilter,
      selectedDate,
      logs,
      topics: topics.length ? topics : base.topics,
      archiveCategories: archiveCategories.length ? archiveCategories : base.archiveCategories,
      bucketCategories: bucketCategories.length ? bucketCategories : base.bucketCategories,
      goals,
      buckets,
      archives,
      todos: [],
      migratedFrom: LEGACY_INDEX_KEY
    };
  }

  function loadState() {
    let untouchedNewState = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          const normalized = normalizeState(parsed);
          // 예시 그대로인 새 상태는 이전 버전 데이터가 있으면 그쪽을 살린다
          if (!isUntouchedNewDefault(normalized)) return normalized;
          untouchedNewState = normalized;
        }
      }
    } catch (_) { /* 손상된 v8 데이터는 아래 후보에서 복구 */ }

    for (const key of LEGACY_PERSONAL_KEYS) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return normalizeState(parsed);
      } catch (_) { /* 다음 후보 */ }
    }

    try {
      const rawLegacy = localStorage.getItem(LEGACY_INDEX_KEY);
      if (rawLegacy) {
        const parsed = JSON.parse(rawLegacy);
        const migrated = migrateLegacyIndex(parsed);
        if (migrated) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated)); } catch (_) {}
          return migrated;
        }
      }
    } catch (_) { /* 이전 데이터가 깨졌으면 새 기본값으로 */ }

    return untouchedNewState || clone(defaultState);
  }

  function stableStringify(value) {
    if (Array.isArray(value)) return "[" + value.map(stableStringify).join(",") + "]";
    if (value && typeof value === "object") {
      return "{" + Object.keys(value).sort().map(k => JSON.stringify(k) + ":" + stableStringify(value[k])).join(",") + "}";
    }
    return JSON.stringify(value === undefined ? null : value);
  }

  function isUntouchedNewDefault(s) {
    const keys = ["logs", "goals", "buckets", "archives", "todos", "topics", "bucketCategories", "archiveCategories"];
    return keys.every(k => stableStringify(s[k]) === stableStringify(defaultState[k]));
  }

  function saveState(options) {
    const skipCloud = Boolean(options && options.skipCloud);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      lastSavedAt = new Date();
      if (!skipCloud && typeof scheduleCloudPush === "function") scheduleCloudPush();
      return true;
    } catch (e) {
      const msg = `${(e && e.name) || ""} ${(e && e.message) || ""}`;
      const isQuota = /quota|exceeded/i.test(msg) || (e && (e.code === 22 || e.code === 1014));
      if (isQuota) {
        if (!quotaWarned) {
          quotaWarned = true;
          alert("브라우저 저장 공간이 가득 찼습니다.\n\n· 설정 → ‘데이터 백업 (JSON)’으로 먼저 백업해 주세요.\n· 사진이 많은 항목의 사진을 줄이거나 오래된 사진을 삭제하면 공간이 확보됩니다.\n\n방금 입력한 내용은 저장되지 않았을 수 있습니다.");
        }
      } else {
        console.error(e);
      }
      return false;
    }
  }

  function getStorageUsage() {
    let bytes = 0;
    let keys = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key === null) continue;
        const value = localStorage.getItem(key) || "";
        bytes += (key.length + value.length) * 2; // UTF-16 기준 추정
        keys += 1;
      }
    } catch (_) {}
    return { bytes, keys };
  }

  function formatBytes(bytes) {
    if (!bytes || bytes < 1024) return `${bytes || 0} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
  }

  function getPhotoCount() {
    return [...(state.goals || []), ...(state.archives || [])].reduce((sum, item) => sum + normalizeImages(item).length, 0);
  }

  function timeStr(date) {
    const d = date instanceof Date ? date : new Date();
    return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  }

  function clearSamples() {
    if (!confirm("모든 기록(일기·목표·버킷리스트·아카이브·할일)을 지우고 빈 상태로 시작할까요?\n\n되돌릴 수 없으니 먼저 ‘데이터 백업 (JSON)’을 권장합니다.")) return;
    state.logs = {};
    state.goals = [];
    state.buckets = [];
    state.archives = [];
    state.todos = [];
    state.books = [];
    state.booksSeeded = true;
    state.shelfSelectedBookId = "";
    notebookBookId = "";
    notebookPageIndex = 0;
    saveState();
    render();
    refreshSettingsIfOpen();
  }

  function uid() {
    return "id_" + Math.random().toString(36).slice(2, 9);
  }

  function getTopicIconKey(topicName) {
    const found = state.topics.find(t => t.name === topicName);
    return found ? resolveIconKey(found.icon, "target") : "target";
  }

  function getArchiveCatIconKey(catName) {
    const found = state.archiveCategories.find(c => c.name === catName);
    return found ? resolveIconKey(found.icon, "folder") : "folder";
  }

  function getBucketCatIconKey(catName) {
    const found = state.bucketCategories.find(c => c.name === catName);
    return found ? resolveIconKey(found.icon, "star") : "star";
  }

  function getDayOfWeek(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d).getDay();
  }

  function isHoliday(dateStr) {
    return Boolean(HOLIDAYS[dateStr]);
  }

  function getDateColor(dateStr) {
    if (isHoliday(dateStr)) return "var(--sun)";
    const dow = getDayOfWeek(dateStr);
    if (dow === 0) return "var(--sun)";
    if (dow === 6) return "var(--sat)";
    return "var(--text)";
  }

  function shiftDate(dateStr, deltaDays) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d + deltaDays);
    const ny = dt.getFullYear();
    const nm = String(dt.getMonth() + 1).padStart(2, "0");
    const nd = String(dt.getDate()).padStart(2, "0");
    return `${ny}-${nm}-${nd}`;
  }

  function formatDateKo(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = new Date(y, m - 1, d).getDay();
    const hName = HOLIDAYS[dateStr] ? ` · ${HOLIDAYS[dateStr]}` : "";
    return `${y}년 ${m}월 ${d}일 (${days[dow]})${hName}`;
  }

  function compressImageFile(file, maxWidth = 720, quality = 0.76) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function processMultipleFiles(fileList, existingArray, maxCount = 5) {
    const files = Array.from(fileList || []);
    const result = [...existingArray];
    for (const file of files) {
      if (result.length >= maxCount) {
        alert(`사진은 항목당 최대 ${maxCount}장까지 첨부할 수 있습니다.`);
        break;
      }
      const dataUrl = await compressImageFile(file);
      result.push(dataUrl);
    }
    return result;
  }

  function yearSelectHtml(currentVal, onChangeFn, allLabel = `전체 연도 (${YEARS[0]}~${YEARS[YEARS.length - 1]})`) {
    const normCur = currentVal === "all" ? "all" : normalizeYear(currentVal);
    const opts = getYearOptions().map(y => `<option value="${y}" ${normCur === String(y) ? "selected" : ""}>${y}년</option>`).join("");
    return `
      <select class="year-select" onchange="${onChangeFn}(this.value)" aria-label="연도 선택">
        <option value="all" ${normCur === "all" ? "selected" : ""}>${allLabel}</option>
        ${opts}
      </select>
    `;
  }

  function changeYearFilter(val) {
    state.yearFilter = val;
    saveState();
    render();
  }

  function isMobileViewport() {
    try {
      return window.matchMedia("(max-width: 860px)").matches;
    } catch (_) {
      return window.innerWidth <= 860;
    }
  }

  function getYearViewMode() {
    if (state.yearViewMode === "matrix" || state.yearViewMode === "months") return state.yearViewMode;
    return isMobileViewport() ? "months" : "matrix";
  }

  function setYearViewMode(mode) {
    state.yearViewMode = mode;
    saveState();
    render();

  function jumpToMonthCard(year, month) {
    const el = document.getElementById(`month-card-${year}-${month}`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function setTab(tab) {
    flushDiaryDraft();
    const next = normalizeTab(tab);
    // Goals 책은 다른 탭에서 돌아오면 덮힌 책처럼 앞표지부터 (한 권의 책 구조)
    if (next === "goals" && normalizeTab(state.activeTab) !== "goals") {
      state.goalBookPage = 0;
      goalBookSide = "left";
    }
    state.activeTab = next;
    yearDayDate = "";
    // 방금 담은 기록이 있으면 그 책을 바로 펼쳐서 보여 준다
    if (next === "archive" && !notebookFocusId) notebookBookId = "";

  function selectDate(dateStr, openDay = false) {
    if (openDay) {
      openYearDay(dateStr);
      return;
    }
    flushDiaryDraft();

    saveState();
    render();
