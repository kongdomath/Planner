<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아카이브 플래너" />
  <title>아카이브 & 플래너</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --surface-muted: #f3f1ec;
      --border: #e5e2da;
      --text: #1f2421;
      --text-sub: #6b7280;
      --sat: #2563eb;
      --sun: #dc2626;
      --c-year: #334155;
      --c-diary: #3730a3;
      --c-goal: #166534;
      --c-plan: #0369a1;
      --c-bucket: #b45309;
      --c-todo: #6d28d9;
      --radius: 12px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 230px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand {
      padding: 6px 10px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 12px;
      color: var(--text-sub);
      margin: 4px 0 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: var(--surface-muted); color: var(--text); }
    .nav-btn.active { background: var(--surface-muted); color: var(--text); font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .main {
      flex: 1;
      padding: 24px 28px 88px;
      max-width: 1240px;
      margin: 0 auto;
      width: 100%;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .page-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    select, input[type="text"], input[type="date"], textarea {
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      outline: none;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #94a3b8;
    }
    .year-select {
      font-weight: 600;
      padding: 7px 12px;
      cursor: pointer;
      background: var(--surface);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-muted); }
    .btn-primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .btn-primary:hover { opacity: 0.9; background: var(--text); }
    .icon-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 7px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 0;
    }
    .icon-btn:hover { background: var(--surface-muted); color: var(--text); border-color: var(--border); }
    .icon-btn.danger:hover { color: var(--sun); }

    /* Year Matrix */
    .year-block { margin-bottom: 32px; }
    .year-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .matrix-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }
    table.year-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.year-table th {
      background: var(--surface-muted);
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      padding: 8px 4px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
    }
    table.year-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 5px 6px;
      vertical-align: top;
      height: 44px;
      cursor: pointer;
      transition: background 0.12s;
    }
    table.year-table td:hover:not(.empty-cell) { background: #f8fafc; }
    table.year-table td.empty-cell { background: #faf9f6; cursor: default; }
    table.year-table td.selected-day { outline: 2px solid var(--c-diary); outline-offset: -2px; background: #eef2ff; }
    table.year-table td.today-cell { background: #fefce8; }
    .cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .day-num { color: var(--text); }
    .day-num.sat { color: var(--sat); }
    .day-num.sun, .day-num.holiday { color: var(--sun); }
    .cell-badges { display: flex; gap: 3px; align-items: center; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; }
    .cell-line {
      font-size: 11px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Cards & Lists */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    .list-item.done .item-title {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .chk {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--text);
      flex-shrink: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .item-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
    }
    .pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-sub);
      margin-right: 5px;
    }
    textarea.diary-area {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      line-height: 1.7;
      padding: 14px;
    }

    /* Mobile bottom nav */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 4px;
      z-index: 40;
      justify-content: space-around;
    }
    .mobile-nav button {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .mobile-nav button.active { color: var(--text); }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      border: 1px solid var(--border);
    }
    .modal h3 { margin: 0 0 14px; font-size: 16px; }
    .modal-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
    .modal-field label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    @media (max-width: 860px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .main { padding: 16px 14px 86px; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>

      { id: "b2", year: "2027", category: "문화", title: "조용한 LP바와 재즈바에서 저녁 시간 보내기", note: "", done: false, doneDate: "" },
      { id: "b3", year: "언제든", category: "경험", title: "1년 동안 하루도 빠짐없이 연력 한 줄 채우기", note: "", done: false, doneDate: "" }
    ],
    todos: [
      { id: "t1", date: TODAY_STR, title: "오늘의 연력 한 줄과 일기 작성하기", done: false },
      { id: "t2", date: "2027-01-01", title: "2027년 주제별 목표 세부 항목 확정", done: false }
    ]
  };

  let state = loadState();

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("personal_archive_planner_v3");
      if (!raw) return structuredClone(defaultState);
      const parsed = JSON.parse(raw);
      return { ...structuredClone(defaultState), ...parsed };
    } catch {
      return structuredClone(defaultState);
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function uid() {
    return "id_" + Math.random().toString(36).slice(2, 9);
  }

  function getDayOfWeek(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d).getDay();
  }

  function isHoliday(dateStr) {
    return Boolean(HOLIDAYS[dateStr]);
  }

  function getDateColor(dateStr) {
    if (isHoliday(dateStr)) return "var(--sun)";
    const dow = getDayOfWeek(dateStr);
    if (dow === 0) return "var(--sun)";
    if (dow === 6) return "var(--sat)";
    return "var(--text)";
  }

  function formatDateKo(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = new Date(y, m - 1, d).getDay();
    const hName = HOLIDAYS[dateStr] ? ` · ${HOLIDAYS[dateStr]}` : "";
    return `${y}년 ${m}월 ${d}일 (${days[dow]})${hName}`;
  }

  function yearSelectHtml() {
    const opts = YEARS.map(y => `<option value="${y}" ${state.yearFilter === String(y) ? "selected" : ""}>${y}년</option>`).join("");
    return `
      <select class="year-select" onchange="changeYearFilter(this.value)" aria-label="연도 선택">
        ${opts}
        <option value="all" ${state.yearFilter === "all" ? "selected" : ""}>전체 연도 (${YEARS[0]}~${YEARS[YEARS.length - 1]})</option>
      </select>
    `;
  }

  function changeYearFilter(val) {
    state.yearFilter = val;
    saveState();
    render();
  }

  function setTab(tab) {
    state.activeTab = tab;
    saveState();
    render();
  }

  function selectDate(dateStr, goDiary = false) {
    state.selectedDate = dateStr;
    if (goDiary) state.activeTab = "diary";
    saveState();
    render();
  }

  function updateNavUI() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
    });
    document.getElementById("sidebarDateLabel").textContent = `선택일: ${state.selectedDate}`;
  }

  function render() {
    updateNavUI();
    const main = document.getElementById("mainView");
    if (state.activeTab === "year") main.innerHTML = renderYearView();
    else if (state.activeTab === "diary") main.innerHTML = renderDiaryView();
    else if (state.activeTab === "goals") main.innerHTML = renderGoalsView();
    else if (state.activeTab === "plans") main.innerHTML = renderPlansView();
    else if (state.activeTab === "bucket") main.innerHTML = renderBucketView();
    else if (state.activeTab === "todos") main.innerHTML = renderTodosView();
  }

  function renderYearView() {
    const targetYears = state.yearFilter === "all" ? YEARS : [Number(state.yearFilter)];
    const blocks = targetYears.map(year => {
      let rows = "";
      for (let day = 1; day <= 31; day++) {
        let cells = "";
        for (let month = 1; month <= 12; month++) {
          const maxDay = new Date(year, month, 0).getDate();
          if (day > maxDay) {
            cells += `<td class="empty-cell"></td>`;
            continue;
          }
          const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const dow = getDayOfWeek(dateStr);
          const hol = isHoliday(dateStr);
          const dayCls = hol ? "holiday" : dow === 0 ? "sun" : dow === 6 ? "sat" : "";
          const log = state.logs[dateStr] || {};
          const hasDiary = Boolean(log.diary && log.diary.trim());
          const hasAchieved =
            state.goals.some(g => g.done && g.doneDate === dateStr) ||
            state.plans.some(p => p.done && p.doneDate === dateStr) ||
            state.buckets.some(b => b.done && b.doneDate === dateStr);
          const hasTodo = state.todos.some(t => t.date === dateStr);

          const isSelected = state.selectedDate === dateStr;
          const isToday = TODAY_STR === dateStr;
          const tdCls = [isSelected ? "selected-day" : "", isToday ? "today-cell" : ""].filter(Boolean).join(" ");
          const tip = HOLIDAYS[dateStr] ? `${dateStr} (${HOLIDAYS[dateStr]})` : dateStr;

          cells += `
            <td class="${tdCls}" onclick="selectDate('${dateStr}', true)" title="${escapeAttr(tip)}">
              <div class="cell-top">
                <span class="day-num ${dayCls}">${day}</span>
                <span class="cell-badges">
                  ${hasDiary ? `<span class="badge-dot" style="background:var(--c-diary)" title="일기 있음"></span>` : ""}
                  ${hasAchieved ? `<span class="badge-dot" style="background:var(--c-goal)" title="목표/계획/버킷 달성"></span>` : ""}
                  ${hasTodo ? `<span class="badge-dot" style="background:var(--c-todo)" title="할일 있음"></span>` : ""}
                </span>
              </div>
              <div class="cell-line">${escapeHtml(log.oneLine || (hol ? HOLIDAYS[dateStr] : ""))}</div>
            </td>
          `;
        }
        rows += `<tr>${cells}</tr>`;
      }

      return `
        <section class="year-block">
          <h2 class="year-heading">${year}년 한눈에 보기</h2>
          <div class="matrix-wrap">
            <table class="year-table">
              <thead>
                <tr>${Array.from({ length: 12 }, (_, i) => `<th>${i + 1}월</th>`).join("")}</tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>
      `;
    }).join("");

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">1년 연력</h1>
        </div>
        <div class="topbar-right">
          <button class="btn" onclick="selectDate('${TODAY_STR}', true)">오늘 기록 (${TODAY_STR})</button>
          ${yearSelectHtml()}
        </div>
      </div>
      ${blocks}
    `;
  }

  function renderDiaryView() {
    const d = state.selectedDate;
    const titleColor = getDateColor(d);
    const log = state.logs[d] || { oneLine: "", diary: "" };

    const dayTodos = state.todos.filter(t => t.date === d);
    const doneGoals = state.goals.filter(g => g.done && g.doneDate === d);
    const donePlans = state.plans.filter(p => p.done && p.doneDate === d);
    const doneBuckets = state.buckets.filter(b => b.done && b.doneDate === d);

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" style="color:${titleColor}">${formatDateKo(d)}</h1>
        </div>
        <div class="topbar-right">
          <input type="date" value="${d}" onchange="if(this.value) selectDate(this.value, false)" />
          <button class="btn" onclick="selectDate('${TODAY_STR}', false)">오늘</button>
          <button class="btn" onclick="setTab('year')">연력으로</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <label style="display:block; font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px;">연력 한 줄 요약</label>
          <input type="text" id="oneLineInput" style="width:100%; margin-bottom:16px;" placeholder="연력 칸에 표시될 오늘의 한 줄..." value="${escapeAttr(log.oneLine || "")}" oninput="saveDiaryDraft()" />

          <label style="display:block; font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px;">오늘의 긴 기록 · 일기</label>
          <textarea class="diary-area" id="diaryInput" placeholder="오늘 있었던 일, 생각, 감정을 자유롭게 길게 기록하세요..." oninput="saveDiaryDraft()">${escapeHtml(log.diary || "")}</textarea>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
            <span id="saveStatus" style="font-size:12px; color:var(--text-sub);">자동 저장됨</span>
            <button class="btn btn-primary" onclick="saveDiaryDraft(true)">저장</button>
          </div>
        </div>

        <div>
          <div class="card">
            <h3 style="margin:0 0 10px; font-size:15px; color:var(--text);">이 날의 할일</h3>
            <div class="form-row">
              <input type="text" id="dayTodoInput" style="flex:1;" placeholder="이 날짜에 할일 추가..." onkeydown="if(event.key==='Enter') addDayTodo()" />
              <button class="btn" onclick="addDayTodo()">추가</button>
            </div>
            <div class="item-list">
              ${dayTodos.length ? dayTodos.map(t => `
                <div class="list-item ${t.done ? "done" : ""}">
                  <div class="item-left">
                    <input type="checkbox" class="chk" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" />
                    <div class="item-title">${escapeHtml(t.title)}</div>
                  </div>
                  <div>
                    <button class="icon-btn" onclick="openEditTodo('${t.id}')" title="수정">${pencilIcon}</button>
                    <button class="icon-btn danger" onclick="deleteItem('todos','${t.id}')" title="삭제">${trashIcon}</button>
                  </div>
                </div>
              `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 할일이 없습니다.</p>`}
            </div>
          </div>

          <div class="card">
            <h3 style="margin:0 0 10px; font-size:15px; color:var(--text);">이 날 달성한 목표 · 계획 · 버킷</h3>
            ${(doneGoals.length + donePlans.length + doneBuckets.length) === 0
              ? `<p style="font-size:13px; color:var(--text-sub); margin:0;">목표, 계획, 버킷리스트에서 완료 체크하면 달성 날짜(${d})와 자동으로 연결됩니다.</p>`
              : `<div class="item-list">
                  ${doneGoals.map(g => `<div class="list-item"><span class="pill">목표 · ${escapeHtml(g.topic)}</span>${escapeHtml(g.title)}</div>`).join("")}
                  ${donePlans.map(p => `<div class="list-item"><span class="pill">계획 · ${escapeHtml(p.quarter)}</span>${escapeHtml(p.title)}</div>`).join("")}
                  ${doneBuckets.map(b => `<div class="list-item"><span class="pill">버킷 · ${escapeHtml(b.category)}</span>${escapeHtml(b.title)}</div>`).join("")}
                </div>`
            }
          </div>
        </div>
      </div>
    `;
  }

  function saveDiaryDraft(explicit = false) {
    const oneLine = document.getElementById("oneLineInput").value;
    const diary = document.getElementById("diaryInput").value;
    state.logs[state.selectedDate] = { oneLine, diary };
    saveState();
    const st = document.getElementById("saveStatus");
    if (st) st.textContent = explicit ? "저장되었습니다." : "자동 저장됨";
  }

  function addDayTodo() {
    const inp = document.getElementById("dayTodoInput");
    const title = inp.value.trim();
    if (!title) return;
    state.todos.unshift({ id: uid(), date: state.selectedDate, title, done: false });
    saveState();
    render();
  }

  function getActiveYearValue() {
    return state.yearFilter === "all" ? "2027" : state.yearFilter;
  }

  function renderGoalsView() {
    const filtered = state.goals.filter(g => state.yearFilter === "all" || g.year === state.yearFilter);
    const curYear = getActiveYearValue();
    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">주제별 목표</h1>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml()}
        </div>
      </div>

      <div class="card">
        <div class="form-row">
          <select id="goalTopicSel">
            ${state.topics.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join("")}
          </select>
          <input type="text" id="goalTitleInp" style="flex:1; min-width:200px;" placeholder="${curYear}년 새 목표 입력..." onkeydown="if(event.key==='Enter') addGoal()" />
          <button class="btn btn-primary" onclick="addGoal()">목표 추가</button>
        </div>
        <div class="form-row" style="margin-bottom:0;">
          <input type="text" id="newTopicInp" placeholder="새 주제 추가 (예: 자격증, 취미)" />
          <button class="btn" onclick="addTopic()">주제 추가</button>
        </div>
      </div>

      ${state.topics.map(topic => {
        const items = filtered.filter(g => g.topic === topic);
        return `
          <div class="card">
            <h3 style="margin:0 0 10px; font-size:15px; color:var(--text);">${escapeHtml(topic)} (${items.filter(i => i.done).length}/${items.length})</h3>
            <div class="item-list">
              ${items.length ? items.map(g => `
                <div class="list-item ${g.done ? "done" : ""}">
                  <div class="item-left">
                    <input type="checkbox" class="chk" ${g.done ? "checked" : ""} onchange="toggleAchieve('goals','${g.id}')" />
                    <div>
                      <div class="item-title">${escapeHtml(g.title)}</div>
                      <div class="item-meta">
                        <span class="pill">${g.year}년</span>
                        ${g.done && g.doneDate ? `<span>달성일: ${g.doneDate}</span>` : ""}
                      </div>
                    </div>
                  </div>
                  <div>
                    <button class="icon-btn" onclick="openEditGoal('${g.id}')" title="수정">${pencilIcon}</button>
                    <button class="icon-btn danger" onclick="deleteItem('goals','${g.id}')" title="삭제">${trashIcon}</button>
                  </div>
                </div>
              `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 목표가 없습니다.</p>`}
            </div>
          </div>
        `;
      }).join("")}
    `;
  }

  function addTopic() {
    const inp = document.getElementById("newTopicInp");
    const val = inp.value.trim();
    if (!val || state.topics.includes(val)) return;
    state.topics.push(val);
    saveState();
    render();
  }

  function addGoal() {
    const topic = document.getElementById("goalTopicSel").value;
    const year = getActiveYearValue();
    const title = document.getElementById("goalTitleInp").value.trim();
    if (!title) return;
    state.goals.unshift({ id: uid(), topic, year, title, done: false, doneDate: "" });
    saveState();
    render();
  }

  function renderPlansView() {
    const filtered = state.plans.filter(p => state.yearFilter === "all" || p.year === state.yearFilter);
    const curYear = getActiveYearValue();
    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">연간 계획</h1>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml()}
        </div>
      </div>

      <div class="card">
        <div class="form-row">
          <select id="planQuarterSel">
            <option value="연간">연간</option>
            <option value="상반기">상반기</option>
            <option value="하반기">하반기</option>
            <option value="1분기">1분기</option>
            <option value="2분기">2분기</option>
            <option value="3분기">3분기</option>
            <option value="4분기">4분기</option>
          </select>
          <input type="text" id="planTitleInp" style="flex:1; min-width:180px;" placeholder="${curYear}년 계획 제목..." />
          <input type="text" id="planNoteInp" style="flex:1; min-width:160px;" placeholder="세부 실행 메모 (선택)" />
          <button class="btn btn-primary" onclick="addPlan()">계획 추가</button>
        </div>
      </div>

      <div class="card">
        <div class="item-list">
          ${filtered.length ? filtered.map(p => `
            <div class="list-item ${p.done ? "done" : ""}">
              <div class="item-left">
                <input type="checkbox" class="chk" ${p.done ? "checked" : ""} onchange="toggleAchieve('plans','${p.id}')" />
                <div>
                  <div class="item-title">${escapeHtml(p.title)}</div>
                  <div class="item-meta">
                    <span class="pill">${p.year}년</span>
                    <span class="pill">${escapeHtml(p.quarter)}</span>
                    ${p.note ? `<span>${escapeHtml(p.note)}</span>` : ""}
                    ${p.done && p.doneDate ? ` · 완료: ${p.doneDate}` : ""}
                  </div>
                </div>
              </div>
              <div>
                <button class="icon-btn" onclick="openEditPlan('${p.id}')" title="수정">${pencilIcon}</button>
                <button class="icon-btn danger" onclick="deleteItem('plans','${p.id}')" title="삭제">${trashIcon}</button>
              </div>
            </div>
          `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 연간 계획이 없습니다.</p>`}
        </div>
      </div>
    `;
  }

  function addPlan() {
    const year = getActiveYearValue();
    const quarter = document.getElementById("planQuarterSel").value;
    const title = document.getElementById("planTitleInp").value.trim();
    const note = document.getElementById("planNoteInp").value.trim();
    if (!title) return;
    state.plans.unshift({ id: uid(), year, quarter, title, note, done: false, doneDate: "" });
    saveState();
    render();
  }

  function renderBucketView() {
    const filtered = state.buckets.filter(b => state.yearFilter === "all" || b.year === state.yearFilter || b.year === "언제든");
    const curYear = getActiveYearValue();
    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">버킷리스트</h1>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml()}
        </div>
      </div>

      <div class="card">
        <div class="form-row">
          <input type="text" id="bucketCatInp" style="width:120px;" placeholder="분류 (여행 등)" value="경험" />
          <input type="text" id="bucketTitleInp" style="flex:1; min-width:180px;" placeholder="${curYear}년 꼭 해보고 싶은 버킷리스트..." />
          <input type="text" id="bucketNoteInp" style="flex:1; min-width:150px;" placeholder="메모 (선택)" />
          <button class="btn btn-primary" onclick="addBucket()">추가</button>
        </div>
      </div>

      <div class="card">
        <div class="item-list">
          ${filtered.length ? filtered.map(b => `
            <div class="list-item ${b.done ? "done" : ""}">
              <div class="item-left">
                <input type="checkbox" class="chk" ${b.done ? "checked" : ""} onchange="toggleAchieve('buckets','${b.id}')" />
                <div>
                  <div class="item-title">${escapeHtml(b.title)}</div>
                  <div class="item-meta">
                    <span class="pill">${escapeHtml(b.year)}</span>
                    <span class="pill">${escapeHtml(b.category)}</span>
                    ${b.note ? `<span>${escapeHtml(b.note)}</span>` : ""}
                    ${b.done && b.doneDate ? ` · 달성: ${b.doneDate}` : ""}
                  </div>
                </div>
              </div>
              <div>
                <button class="icon-btn" onclick="openEditBucket('${b.id}')" title="수정">${pencilIcon}</button>
                <button class="icon-btn danger" onclick="deleteItem('buckets','${b.id}')" title="삭제">${trashIcon}</button>
              </div>
            </div>
          `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 버킷리스트가 없습니다.</p>`}
        </div>
      </div>
    `;
  }

  function addBucket() {
    const year = getActiveYearValue();
    const category = document.getElementById("bucketCatInp").value.trim() || "기타";
    const title = document.getElementById("bucketTitleInp").value.trim();
    const note = document.getElementById("bucketNoteInp").value.trim();
    if (!title) return;
    state.buckets.unshift({ id: uid(), year, category, title, note, done: false, doneDate: "" });
    saveState();
    render();
  }

  function renderTodosView() {
    const filtered = state.todos.filter(t => state.yearFilter === "all" || t.date.startsWith(state.yearFilter));
    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title">할일</h1>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml()}
        </div>
      </div>

      <div class="card">
        <div class="form-row">
          <input type="date" id="todoDateInp" value="${state.selectedDate}" />
          <input type="text" id="todoTitleInp" style="flex:1; min-width:200px;" placeholder="할일 입력..." onkeydown="if(event.key==='Enter') addTodo()" />
          <button class="btn btn-primary" onclick="addTodo()">추가</button>
        </div>
      </div>

      <div class="card">
        <div class="item-list">
          ${filtered.length ? filtered.map(t => `
            <div class="list-item ${t.done ? "done" : ""}">
              <div class="item-left">
                <input type="checkbox" class="chk" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" />
                <div>
                  <div class="item-title">${escapeHtml(t.title)}</div>
                  <div class="item-meta">
                    <span class="pill" style="cursor:pointer;" onclick="selectDate('${t.date}', true)">${t.date}</span>
                  </div>
                </div>
              </div>
              <div>
                <button class="icon-btn" onclick="openEditTodo('${t.id}')" title="수정">${pencilIcon}</button>
                <button class="icon-btn danger" onclick="deleteItem('todos','${t.id}')" title="삭제">${trashIcon}</button>
              </div>
            </div>
          `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 할일이 없습니다.</p>`}
        </div>
      </div>
    `;
  }

  function addTodo() {
    const date = document.getElementById("todoDateInp").value || state.selectedDate;
    const title = document.getElementById("todoTitleInp").value.trim();
    if (!title) return;
    state.todos.unshift({ id: uid(), date, title, done: false });
    saveState();
    render();
  }

  function toggleAchieve(collection, id) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    item.doneDate = item.done ? state.selectedDate : "";
    saveState();
    render();
  }

  function toggleTodo(id) {
    const item = state.todos.find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    saveState();
    render();
  }

  function deleteItem(collection, id) {
    state[collection] = state[collection].filter(x => x.id !== id);
    saveState();
    render();
  }

  function openModal(title, bodyHtml, onSave) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    document.getElementById("modalSaveBtn").onclick = () => {
      onSave();
      closeModal();
      saveState();
      render();
    };
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("open");
  }

  function openEditBucket(id) {
    const b = state.buckets.find(x => x.id === id);
    if (!b) return;
    openModal("버킷리스트 수정", `
      <div class="modal-field">
        <label>목표 시기</label>
        <select id="mBucketYear">
          ${YEARS.map(y => `<option value="${y}" ${b.year === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
          <option value="언제든" ${b.year === "언제든" ? "selected" : ""}>언제든</option>
        </select>
      </div>
      <div class="modal-field">
        <label>분류</label>
        <input type="text" id="mBucketCat" value="${escapeAttr(b.category)}" />
      </div>
      <div class="modal-field">
        <label>버킷리스트 내용</label>
        <input type="text" id="mBucketTitle" value="${escapeAttr(b.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 메모</label>
        <input type="text" id="mBucketNote" value="${escapeAttr(b.note || "")}" />
      </div>
      <div class="modal-field">
        <label>달성 날짜 (달성 시)</label>
        <input type="date" id="mBucketDoneDate" value="${escapeAttr(b.doneDate || "")}" />
      </div>
    `, () => {
      b.year = document.getElementById("mBucketYear").value;
      b.category = document.getElementById("mBucketCat").value.trim() || "기타";
      b.title = document.getElementById("mBucketTitle").value.trim() || b.title;
      b.note = document.getElementById("mBucketNote").value.trim();
      b.doneDate = document.getElementById("mBucketDoneDate").value;
      if (b.doneDate) b.done = true;
    });
  }

  function openEditPlan(id) {
    const p = state.plans.find(x => x.id === id);
    if (!p) return;
    openModal("연간 계획 수정", `
      <div class="modal-field">
        <label>연도</label>
        <select id="mPlanYear">
          ${YEARS.map(y => `<option value="${y}" ${p.year === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>시기</label>
        <input type="text" id="mPlanQuarter" value="${escapeAttr(p.quarter)}" />
      </div>
      <div class="modal-field">
        <label>계획 제목</label>
        <input type="text" id="mPlanTitle" value="${escapeAttr(p.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 메모</label>
        <input type="text" id="mPlanNote" value="${escapeAttr(p.note || "")}" />
      </div>
    `, () => {
      p.year = document.getElementById("mPlanYear").value;
      p.quarter = document.getElementById("mPlanQuarter").value.trim() || "연간";
      p.title = document.getElementById("mPlanTitle").value.trim() || p.title;
      p.note = document.getElementById("mPlanNote").value.trim();
    });
  }

  function openEditGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    openModal("주제별 목표 수정", `
      <div class="modal-field">
        <label>주제</label>
        <select id="mGoalTopic">
          ${state.topics.map(t => `<option value="${escapeAttr(t)}" ${g.topic === t ? "selected" : ""}>${escapeHtml(t)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>연도</label>
        <select id="mGoalYear">
          ${YEARS.map(y => `<option value="${y}" ${g.year === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>목표 내용</label>
        <input type="text" id="mGoalTitle" value="${escapeAttr(g.title)}" />
      </div>
    `, () => {
      g.topic = document.getElementById("mGoalTopic").value;
      g.year = document.getElementById("mGoalYear").value;
      g.title = document.getElementById("mGoalTitle").value.trim() || g.title;
    });
  }

  function openEditTodo(id) {
    const t = state.todos.find(x => x.id === id);
    if (!t) return;
    openModal("할일 수정", `
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="mTodoDate" value="${escapeAttr(t.date)}" />
      </div>
      <div class="modal-field">
        <label>할일 내용</label>
        <input type="text" id="mTodoTitle" value="${escapeAttr(t.title)}" />
      </div>
    `, () => {
      t.date = document.getElementById("mTodoDate").value || t.date;
      t.title = document.getElementById("mTodoTitle").value.trim() || t.title;
    });
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `archive_planner_backup_${TODAY_STR}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(e.target.result);
        state = { ...structuredClone(defaultState), ...parsed };
        saveState();
        render();
        alert("백업 데이터를 복원했습니다.");
      } catch {
        alert("올바른 JSON 백업 파일이 아닙니다.");
      }
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  render();
</script>
</body>
</html>
