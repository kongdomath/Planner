    const pct = Math.min(100, Math.round((usage.bytes / limit) * 100));
    const photos = getPhotoCount();
    const totalItems = (state.logs ? Object.keys(state.logs).length : 0) + (state.goals ? state.goals.length : 0) +
      (state.buckets ? state.buckets.length : 0) + (state.archives ? state.archives.length : 0) +
      (state.todos ? state.todos.length : 0);
    const configured = isFirebaseConfigured();
    body.innerHTML = `
      <div class="settings-section">
        <h4>계정 · 동기화</h4>
        ${authUser ? `
          <div class="account-row">
            <span class="account-badge">${escapeHtml((authUser.email || authUser.name || "?").slice(0, 1).toUpperCase())}</span>
            <div class="account-text">
              <strong>${escapeHtml(authUser.email || authUser.name || "로그인됨")}</strong>
              <span>${configured ? (lastCloudAt ? `Firestore 동기화 · ${timeStr(lastCloudAt)}` : "Firestore 동기화 사용 중") : "로컬 모드"}</span>
            </div>
            <button class="btn btn-sm" onclick="signOutOfAccount()">로그아웃</button>
          </div>
          <div class="settings-actions" style="margin-top:8px;">
            <button class="btn btn-sm" onclick="syncAccountNow()">지금 동기화</button>
            ${cloudBytes ? `<span class="settings-hint" style="margin:0;align-self:center;">계정 기록 약 ${formatBytes(cloudBytes)}</span>` : ""}
          </div>
        ` : `
          <div class="account-row">
            <span class="account-badge">로</span>
            <div class="account-text">
              <strong>로컬 모드</strong>
              <span>${configured ? "로그인하면 기록이 계정에 동기화됩니다" : "기록은 이 브라우저에만 저장됩니다"}</span>
            </div>
            <button class="btn btn-sm" onclick="openAuthScreen()">로그인</button>
          </div>
        `}
      </div>
      <div class="settings-section">
        <h4>저장 공간</h4>
        <div class="storage-line"><strong>사용 중 약 ${formatBytes(usage.bytes)}</strong><span>/ 권장 한도 약 4~5MB</span></div>
        <div class="storage-track"><div class="storage-fill ${pct >= 80 ? "warn" : ""}" style="width:${pct}%;"></div></div>
        <p class="settings-hint">사진 ${photos}장 · 기록 ${totalItems}건. ${authUser ? "기록은 이 브라우저와 계정(Firestore)에 함께 저장됩니다. 둘 다 지우지 않도록 가끔 JSON으로 백업해 두세요." : "모든 기록은 이 브라우저(localStorage)에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라지니 가끔 JSON으로 백업해 두세요."}</p>
        ${lastSavedAt ? `<p class="settings-hint">마지막 저장: ${timeStr(lastSavedAt)}</p>` : ""}
        <p class="settings-hint">공간이 부족하면 저장이 되지 않을 수 있고, 그때는 사진을 줄이거나 백업 후 오래된 사진을 삭제해 주세요.</p>
      </div>
      <div class="settings-section">
        <h4>데이터 관리</h4>
        <div class="settings-actions">
          <button class="btn" onclick="exportBackup()">데이터 백업 (JSON)</button>
          <label class="btn" style="cursor:pointer;">백업 복원<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)" /></label>
          <button class="btn btn-danger-outline" onclick="clearSamples()">예시 지우기 · 전체 삭제</button>
        </div>
        <p class="settings-hint">‘예시 지우기’는 기본 예시뿐 아니라 모든 기록을 지웁니다. 되돌릴 수 없으니 먼저 백업을 권장합니다.</p>
      </div>
      <div class="settings-section">
        <h4>앱 정보</h4>
        <p class="settings-hint">Archive Planner v${APP_VERSION} · 저장 키 <code>${STORAGE_KEY}</code></p>
        ${state.migratedFrom ? `<p class="settings-hint">이전 버전(<code>${escapeHtml(state.migratedFrom)}</code>)의 기록을 안전하게 옮겨 왔습니다.</p>` : ""}
      </div>
      <p class="settings-version">Archive Planner <b>v${APP_VERSION}</b></p>
    `;
  }

  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `archive_planner_backup_${TODAY_STR}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (_) {
      alert("백업 파일을 만드는 중 오류가 발생했습니다.");
    }
  }

  function importBackup(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(String(e.target.result));
        const isLegacy = !parsed.logs && !parsed.topics && looksLikeLegacyIndex(parsed);
        state = isLegacy ? (migrateLegacyIndex(parsed) || clone(defaultState)) : normalizeState(parsed);
        saveState();
        render();
        refreshSettingsIfOpen();
        alert("백업 데이터를 복원했습니다.");
      } catch (_) {
        alert("올바른 JSON 백업 파일이 아닙니다.");
      }
      input.value = "";
    };
    reader.onerror = () => {
      alert("파일을 읽는 중 오류가 발생했습니다.");
      input.value = "";
    };
    reader.readAsText(file);
  }

  // ---------- 공통 모달 ----------
  function openModal(title, bodyHtml, onSave, opts = {}) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    const danger = opts && typeof opts.onDelete === "function"
      ? `<button class="btn btn-danger" id="modalDeleteBtn">${escapeHtml(opts.deleteLabel || "삭제")}</button>`
      : "";
    document.getElementById("modalActions").innerHTML = `
      ${danger}
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modalSaveBtn">저장</button>
    `;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    const delBtn = document.getElementById("modalDeleteBtn");
    if (delBtn) {
      delBtn.onclick = () => {
        const removed = opts.onDelete();
        if (removed === false) return;
        closeModal();
        saveState();
        render();
        refreshCategoryManager();
        refreshSettingsIfOpen();
      };
    }
    document.getElementById("modalSaveBtn").onclick = () => {
      const result = typeof onSave === "function" ? onSave() : true;
      if (result === false) return;
      closeModal();
      saveState();
      render();
      refreshCategoryManager();
      refreshSettingsIfOpen();
    };
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("open");
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  // onclick 등 인라인 JS 문자열 인자용 (따옴표 안전 처리)
  function jsArg(val) {
    return escapeAttr(JSON.stringify(String(val == null ? "" : val)));
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      if (document.getElementById("lightbox").classList.contains("open")) { closeLightbox(); return; }
      if (document.getElementById("editModal").classList.contains("open")) { closeModal(); return; }
      if (document.getElementById("catModal").classList.contains("open")) { closeCategoryManager(); return; }
      if (document.getElementById("settingsModal").classList.contains("open")) { closeSettings(); return; }
      if (searchOpen) { closeSearch(); return; }
      const authEl = document.getElementById("authScreen");
      if (authEl && authEl.classList.contains("open")) { closeAuthScreen(); return; }
    }
    if (document.getElementById("lightbox").classList.contains("open")) {
      if (event.key === "ArrowLeft") lightboxStep(-1);
      else if (event.key === "ArrowRight") lightboxStep(1);
    }

    // 노트북 · 연도 책 넘기기 (입력 중이거나 모달이 열려 있을 때는 결과)
    const tagName = (event.target && event.target.tagName) || "";
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tagName) || (event.target && event.target.isContentEditable);
    const modalOpen = ["editModal", "settingsModal", "catModal", "lightbox"].some(id => {
      const el = document.getElementById(id);
      return el && el.classList.contains("open");
    });
    if (!typing && !modalOpen) {
      if (state.activeTab === "year") {
        if (yearDayDate) {
          if (event.key === "ArrowLeft") { stepYearDay(-1); return; }
          if (event.key === "ArrowRight") { stepYearDay(1); return; }
        } else if (yearBookYear) {
          if (event.key === "ArrowLeft") { yearPageStep(-1); return; }
          if (event.key === "ArrowRight") { yearPageStep(1); return; }
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          yearShelfStep(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }
      } else if (state.activeTab === "archive") {
        if (notebookBookId) {
          if (event.key === "ArrowLeft") { notebookStep(-1); return; }
          if (event.key === "ArrowRight") { notebookStep(1); return; }
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          shelfStep(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }
      }
    }
  });

  const mobileMq = window.matchMedia ? window.matchMedia("(max-width: 860px)") : null;
  if (mobileMq) {
    const onMqChange = () => {
      goalLayoutCache = { sig: "", model: null };
      render();
    };
    if (mobileMq.addEventListener) mobileMq.addEventListener("change", onMqChange);
    else if (mobileMq.addListener) mobileMq.addListener(onMqChange);
  }

  // 화면 회전·창 크기가 바뀌면 책 높이가 달라지므로 목표 페이지 나눔을 다시 잰다
  let layoutResizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(layoutResizeTimer);
    layoutResizeTimer = setTimeout(() => {
      goalLayoutCache = { sig: "", model: null };
      if (state.activeTab === "goals") render();
    }, 280);
  });

  // 테스트/디버깅용 (화면에는 영향 없음)
  window.__planner = {
    version: APP_VERSION,
    getState: () => state,
    getYearViewMode,
    getStorageUsage,
    getPhotoCount,
    render,
    setTab,
    selectDate,
    toggleGoalFilters,
    toggleBucketFilters,
    openGoalModal,
    openBucketModal,
    renderGoalBookView,
    jumpGoalTopic,
    goalBookStep,
    setGoalBookSide,
    yearQuarterJump,
    goalBookTopics,
    openSearch,
    closeSearch,
    openSettings,
    closeSettings,
    openAuthScreen,
    closeAuthScreen,
    isFirebaseConfigured,
    showToast,
    pushCloudState,
    syncAccountNow,
    mergeStates,
    getCloudInfo: () => ({
      configured: isFirebaseConfigured(),
      uid: authUser ? authUser.uid : null,
      email: authUser ? authUser.email : "",
      authConfigState,
      lastCloudAt: lastCloudAt ? lastCloudAt.toISOString() : null,
      cloudBytes,
      syncing: cloudSyncing,
      baseline: authUser ? readCloudBaseline(authUser.uid) : 0
    }),
    openCategoryManager,
    closeCategoryManager,
    openLightbox,
    closeLightbox,
    openNotebook,
    closeNotebookBook,
    notebookStep,
    selectShelfBook,
    shelfStep,
    openBookModal,
    openNewArchiveModal,
    openEditArchive,
    openEditGoalItem,
    deleteGoalItem,
    toggleGoalItem,
    openEditGoal,
    openYearBook,
    openYearBookModal,
    setYearBook,
    getYearBooks,
    closeYearBook,
    openTodayYearBook,
    openYearPage,
    yearPageStep,
    openYearDay,
    closeYearDay,
    stepYearDay,
    dayNavStep,
    getDayView: () => ({
      date: yearDayDate,
      spread: yearDaySpread,
      side: yearMobileSide,
      slots: yearDayDate ? daySlotCount(yearDayDate) : 0,
      photos: yearDayDate ? normalizePhotos(state.logs[yearDayDate] || {}).length : 0
    }),
    setNotebookSide,
    flipNotebookPage,
    getNotebookState: () => ({
      bookId: notebookBookId,
      page: notebookPageIndex,
      yearBook: yearBookYear,
      yearPage: yearPageIndex,
      yearDay: yearDayDate,
      goalTopic: state.goalBookTopic,
      mobileSide: notebookMobileSide
    }),
    errors: () => window.__errors
  };

  // 화면을 닫거나 앱이 백그라운드로 가기 전에 남은 동기화를 밀어 보냅니다 (모바일 Safari 대비)
  // v3.6: 다시 화면으로 돌아오면 계정 기록을 한 번 당겨 와 합칩니다 (폰에서 적은 것이 패드에 바로 보이도록)
  let lastAdoptAt = 0;
  function anyOverlayOpen() {
    return ["editModal", "settingsModal", "catModal", "lightbox"].some(id => {
      const el = document.getElementById(id);
      return el && el.classList.contains("open");
    });
  }
  function pullCloudIfIdle(force) {
    if (!authUser || !isFirebaseConfigured() || cloudAdopting) return;
    if (document.visibilityState !== "visible") return;
    if (!force && anyOverlayOpen()) return;
    if (Date.now() - lastAdoptAt < 8000) return;
    lastAdoptAt = Date.now();
    adoptCloudState();
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      if (cloudTimer) {
        clearTimeout(cloudTimer);
        cloudTimer = null;
        pushCloudState();
      }
      return;
    }
    pullCloudIfIdle(false);
  });
  window.addEventListener("focus", () => pullCloudIfIdle(false));
  window.addEventListener("pagehide", () => {
    if (cloudTimer) {
      clearTimeout(cloudTimer);
      cloudTimer = null;
      pushCloudState();
    }
  });

  mountNavIcons();
  // 앱을 열면 Goals 책은 덮혀 있는 책처럼 앞표지부터 보여 준다
  if (state.activeTab === "goals") {
    state.goalBookPage = 0;
    goalBookSide = "left";
  }
  render();
  // 로그인 버튼을 누르는 순간 팝업이 바로 열리도록 SDK를 미리 받아 둡니다.
  preloadFirebase();
  bootstrapAuth();
</script>
