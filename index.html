  // ---------- v3.1: 기간별 페이지 모델 ----------
  // 항목의 기간을 "연/분기"로 읽는다. 날짜가 없으면 옛 연간·반기·분기 값을 이어받는다.
  function goalPeriodOf(entry) {
    const it = (entry && entry.item) || {};
    // 모달에서 고른 분기가 있으면 그 분기가 우선 (날짜 없이도 배치 가능)
    const qYear = Number(String(it.qYear || "").slice(0, 4));
    const qQuarter = Number(it.qQuarter) || 0;
    if (qYear > 1900 && qQuarter >= 1 && qQuarter <= 4) return { year: qYear, quarter: qQuarter };
    const from = itemDateFrom(it);
    if (from && /^\d{4}-\d{2}-\d{2}$/.test(from)) {
      const year = Number(from.slice(0, 4));
      const quarter = Math.floor((Number(from.slice(5, 7)) - 1) / 3) + 1;
      if (year > 1900 && quarter >= 1 && quarter <= 4) return { year, quarter };
      return null;
    }
    if (entry && entry.src === "goals") {
      const period = normalizePeriod(it.period);
      const year = Number(normalizeYear(it.year));
      if (!year) return null;
      if (period === "상반기") return { year, quarter: 1 };
      if (period === "하반기") return { year, quarter: 3 };
      if (["1분기", "2분기", "3분기", "4분기"].includes(period)) return { year, quarter: Number(period.slice(0, 1)) };
    }
    return null;
  }

  function goalPeriodLabel(period) {
    return period ? `${period.year} · ${period.quarter}분기` : "기간 미지정";
  }

  function goalTopicGroups(entries) {
    const map = new Map();
    entries.forEach(entry => {
      const period = goalPeriodOf(entry);
      const key = period ? `q${period.year}-${period.quarter}` : "none";
      if (!map.has(key)) map.set(key, { key, period, items: [] });
      map.get(key).items.push(entry);
    });
    return [...map.values()].sort((a, b) => {
      if (!a.period) return -1;
      if (!b.period) return 1;
      return (a.period.year - b.period.year) || (a.period.quarter - b.period.quarter);
    });
  }

  function goalTopicHeadHtml(topic) {
    const all = unifiedGoalItems().filter(e => goalEntryTopic(e) === topic.name);
    const doneCnt = all.filter(e => Boolean(e.item.done)).length;
    return `
      <div class="gb-head">
        <span class="gb-icon">${renderPictogram(topic.icon, 22)}</span>
        <div class="gb-head-text">
          <h2 class="gb-title">${escapeHtml(topic.name)}</h2>
          <div class="gb-sub">항목 ${all.length}개 · 이룸 ${doneCnt}개</div>
        </div>
      </div>`;
  }

  function goalPageHeadHtml(label, from, to, total, pageInGroup, groupPages) {
    // 한 장에 다 들어가면 `2개`, 여러 장으로 나뉜 기간만 `1/2쪽`
    let count = "";
    if (total) count = (!groupPages || groupPages <= 1) ? `${total}개` : `${pageInGroup || 1}/${groupPages}쪽`;
    return `<div class="gb-page-head"><span class="gb-page-period">${escapeHtml(label)}</span><span class="gb-page-count">${escapeHtml(count)}</span></div>`;
  }

  // 실제 책 높이·글자 폭에서 한 페이지에 들어가는 만큼만 담기 위해, 보이지 않는 같은 크기의 책에서 높이를 잰다.
  function measureGoalPages(topic, entries) {
    const host = document.getElementById("mainView");
    if (!host) return null;
    const cs = getComputedStyle(host);
    const width = Math.max(240, Math.round(host.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0)));
    const probe = document.createElement("div");
    probe.className = "nb-stage nb-stage--goalbook";
    probe.setAttribute("aria-hidden", "true");
    probe.style.cssText = `position:absolute;left:-20000px;top:0;width:${width}px;visibility:hidden;pointer-events:none;z-index:-1;`;
    probe.innerHTML = `
      <div class="nb-book nb-book--indexed">
        <div class="nb-spread">
          <section class="nb-page nb-page--left"><div class="nb-page-inner">
            ${goalTopicHeadHtml(topic)}
            ${goalPageHeadHtml("0000 · 0분기", 1, 9, 9, 1, 1)}
            <div class="gb-list">${entries.map(renderGoalBookRow).join("")}</div>
            ${paperPageNo(1)}
          </div></section>
        </div>
      </div>`;
    document.body.appendChild(probe);
    const page = probe.querySelector(".nb-page");
    const inner = probe.querySelector(".nb-page-inner");
    const head = probe.querySelector(".gb-head");
    const pageHead = probe.querySelector(".gb-page-head");
    const pageNo = probe.querySelector(".nb-page-no");
    const list = probe.querySelector(".gb-list");
    const pcs = page ? getComputedStyle(page) : null;
    const ics = inner ? getComputedStyle(inner) : null;
    const height = el => (el ? el.getBoundingClientRect().height : 0);
    const out = page ? {
      width,
      avail: Math.max(120, page.clientHeight - (parseFloat(pcs.paddingTop) || 0) - (parseFloat(pcs.paddingBottom) || 0)),
      headH: height(head),
      contH: height(pageHead),
      pageNoH: height(pageNo),
      gap: parseFloat((ics && (ics.rowGap || ics.gap)) || 0) || 14 * 0.5,
      ids: entries.map(e => (e.item && e.item.id) || ""),
      rowHeights: list ? [...list.children].map(height) : []
    } : null;
    probe.remove();
    if (out) out.gap = Math.max(8, out.gap);
    return out;
  }

  function paginateTopicPages(topic, entries, metrics) {
    if (!entries.length) {
      return [{ period: null, label: "기간 미지정", items: [], isFirst: true, groupFrom: 0, groupTo: 0, groupTotal: 0, empty: true }];
    }
    const groups = goalTopicGroups(entries);
    const heightById = new Map();
    if (metrics && metrics.ids) {
      metrics.ids.forEach((id, i) => { if (id) heightById.set(id, metrics.rowHeights[i] || 0); });
    }
    const rowH = entry => heightById.get((entry.item && entry.item.id) || "") || 62;
    const gap = metrics ? metrics.gap : 14;
    const avail = metrics ? metrics.avail : 520;
    const headH = metrics ? metrics.headH : 90;
    const contH = metrics ? metrics.contH : 30;
    const pageNoH = metrics ? metrics.pageNoH : 26;
    const capFirst = Math.max(96, avail - headH - contH - pageNoH - gap * 2 - 8);
    const capCont = Math.max(96, avail - contH - pageNoH - gap * 2 - 8);
    const pages = [];
    groups.forEach(group => {
      const groupStart = pages.length;
      let i = 0;
      let shown = 0;
      while (i < group.items.length) {
        const isFirst = pages.length === 0;
        const cap = isFirst ? capFirst : capCont;
        const chunk = [];
        let used = 0;
        while (i < group.items.length) {
          const h = rowH(group.items[i]);
          if (chunk.length && used + h > cap) break;
          chunk.push(group.items[i]);
          used += h;
          i += 1;
        }
        if (!chunk.length) { chunk.push(group.items[i]); i += 1; }
        pages.push({
          period: group.period,
          label: goalPeriodLabel(group.period),
          items: chunk,
          isFirst,
          groupFrom: shown + 1,
          groupTo: shown + chunk.length,
          groupTotal: group.items.length
        });
        shown += chunk.length;
      }
      const groupPages = pages.length - groupStart;
      pages.slice(groupStart).forEach((p, k) => { p.pageInGroup = k + 1; p.groupPages = groupPages; });
    });
    return pages;
  }

  let goalLayoutCache = { sig: "", model: null };

  // 주제 목록·항목이 그대로면 다시 재지 않고 계산 결과를 쓴다.
  function goalBookModel() {
    const topics = goalBookTopics();
    const entriesByTopic = topics.map(t => goalBookOrderEntries(unifiedGoalItems().filter(e => goalEntryTopic(e) === t.name)));
    const host = document.getElementById("mainView");
    const cs = host ? getComputedStyle(host) : null;
    const width = host && cs ? Math.round(host.clientWidth - (parseFloat(cs.paddingLeft) || 0) - (parseFloat(cs.paddingRight) || 0)) : 0;
    const sig = [width, window.innerWidth, window.innerHeight].join("|") + "§" + topics.map((t, i) => `${t.name}:${t.icon}:` + entriesByTopic[i].map(e => {
      const it = e.item || {};
      return [it.id, it.title, it.note, it.done ? 1 : 0, it.dateMode, it.dateFrom, it.dateTo, it.period, it.year, it.qYear, it.qQuarter].join("~");
    }).join(",")).join("§");
    if (goalLayoutCache.model && goalLayoutCache.sig === sig) return goalLayoutCache.model;
    const model = { topics: [], flat: [] };
    topics.forEach((topic, ti) => {
      const entries = entriesByTopic[ti];
      const metrics = entries.length ? measureGoalPages(topic, entries) : null;
      model.topics.push({ name: topic.name, icon: topic.icon, entries, pages: paginateTopicPages(topic, entries, metrics), pageStart: 0 });
    });
    // v3.5: 주제 사이에 빈 면을 두지 않고 이어서 채운다 (빈 장 없이 책이 이어지도록)
    model.topics.forEach((t, ti) => {
      t.pageStart = model.flat.length;
      t.pages.forEach(p => model.flat.push({ ...p, topicIndex: ti }));
    });
    if (!model.flat.length) model.flat.push({ filler: true, topicIndex: 0 });
    goalLayoutCache = { sig, model };
    return model;
  }

  // v3.5 책 구조 계산: 앞표지 1스프레드 + 내지 + (필요하면) 덮힌 뒤표지 1스프레드
  function goalBookSpreads(model) {
    const len = model.flat.length;
    const contentSpreads = Math.max(1, Math.ceil(len / 2));
    // 마지막 장이 왼쪽 면이면 그 오른면을 뒤표지로 쓰고, 꽉 차면 뒤에 덮힌 뒤표지를 둔다
    const backOnLast = len % 2 === 1;
    return { contentSpreads, backOnLast, total: 1 + contentSpreads + (backOnLast ? 0 : 1) };
  }

  // v3.5: Goals 책 앞표지·뒤표지 — 책장 색(파란색)과 같은 표지 질감
  const GOAL_COVER_SPINE = BOOK_SPINE_PALETTE[1];

  function goalCoverFaceHtml(kind) {
    const back = kind === "back";
    return `
      <section class="nb-page nb-page--cover ${back ? "nb-page--cover--back" : ""}" style="--spine:${normalizeSpineColor(GOAL_COVER_SPINE, "#2f3e5c")}" ${back ? `aria-hidden="true"` : `aria-label="Goals 앞표지"`}>
        <div class="nb-cover-inner">
          <span class="nb-cover-frame" aria-hidden="true"></span>
          <div class="nb-coverface-plate">
            <b>Goals</b>
            <i></i>
            <span>${back ? "뒤표지" : "Archive Planner"}</span>
          </div>
          <span class="nb-cover-foot">${back ? "Archive Planner" : "목표 · 기록"}</span>
        </div>
      </section>
    `;
  }

  // v3.6 표지 넘김: 닫힌 책(1페이지 너비)이 열리거나 덮인다.
  //  · 열 때: 펼친 책을 먼저 깔고, 닫힌 책 자리에서 표지가 책등을 축으로 젖혀지며 사라진다
  //  · 덮을 때: 표지가 젖혀진 자리에서 되돌아와 닫힌 책 자리에 앉고, 그 위에서 표지 화면으로 바뀐다
  //  한 번 넘기는 동안 다시 넘기지 않도록 coverTurnLock으로 잠근다 (자동으로 두 번 넘어가던 문제)
  let coverTurnLock = 0;
  function goalCoverTurn(step, kind, mutate) {
    const spread = document.getElementById("goalSpread");
    if (!spread || prefersReducedMotion()) { mutate(); render(); return; }
    if (spread.dataset.turning === "1") return;
    coverTurnLock = Date.now() + 820;
    const back = kind === "back";
    const opening = back ? step < 0 : step > 0;
    const cls = `nbf-cover--${opening ? "open" : "close"}-${back ? "right" : "left"}`;
    const makeCover = () => {
      const el = document.createElement("div");
      el.className = `nbf-cover nbf-cover--goal nbf-cover--narrow ${back ? "nbf-cover--back" : ""} ${cls}`;
      el.style.setProperty("--spine", normalizeSpineColor(GOAL_COVER_SPINE, "#2f3e5c"));
      el.innerHTML = `<div class="nbf-cover-plate"><b>Goals</b><i></i><span>${back ? "뒤표지" : "Archive Planner"}</span></div>`;
      return el;
    };
    // 새 표지 화면이 앉을 때 한 번만 살짝 흔들리게
    const settleCover = () => {
      const dest = document.getElementById("goalSpread");
      const face = dest && dest.querySelector(".nb-page--cover");
      if (!face) return;
      face.classList.add("nb-cover-enter");
      face.addEventListener("animationend", () => face.classList.remove("nb-cover-enter"), { once: true });
    };
    if (opening) {
      mutate();
      render();
      const dest = document.getElementById("goalSpread");
      if (!dest) return;
      dest.dataset.turning = "1";
      dest.classList.add("cover-opening");
      const cover = makeCover();
      dest.appendChild(cover);
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        cover.remove();
        dest.classList.remove("cover-opening");
        dest.dataset.turning = "";
        coverTurnLock = Math.min(coverTurnLock, Date.now() + 180);
      };
      cover.addEventListener("animationend", finish, { once: true });
      setTimeout(finish, 820);
    } else {
      spread.dataset.turning = "1";
      spread.classList.add("cover-closing");
      const cover = makeCover();
      spread.appendChild(cover);
      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        cover.remove();
        spread.classList.remove("cover-closing");
        spread.dataset.turning = "";
        mutate();
        render();
        settleCover();
        coverTurnLock = Math.min(coverTurnLock, Date.now() + 180);
      };
      cover.addEventListener("animationend", finish, { once: true });
      setTimeout(finish, 820);
    }
  }

  function renderGoalBookView() {
    const topics = goalBookTopics();
    if (!topics.length) {
      return `
        <div class="nb-stage nb-stage--shelf">
          <div class="nb-shelf-empty">
            <h3>아직 주제가 없습니다</h3>
          </div>
        </div>
      `;
    }
    const model = goalBookModel();
    const spreads = goalBookSpreads(model);
    const contentSpreads = spreads.contentSpreads;
    const backOnLast = spreads.backOnLast;
    // v3.5 책 구조: 0 = 앞표지, 1 ~ contentSpreads = 학업·전공 첫 장 ~ 경험·성취 끝 장, 그 뒤 덮힌 뒤표지
    const totalSpreads = spreads.total;
    let spreadIdx = Math.round(Number(state.goalBookPage) || 0);
    if (!Number.isFinite(spreadIdx) || spreadIdx < 0) spreadIdx = 0;
    spreadIdx = Math.min(totalSpreads - 1, spreadIdx);
    state.goalBookPage = spreadIdx;
    const onFrontCover = spreadIdx === 0;
    const onBackCover = !onFrontCover && spreadIdx > contentSpreads;
    const bodyIdx = spreadIdx - 1;
    const showBody = !onFrontCover && !onBackCover;
    const lastBodySpread = showBody && backOnLast && bodyIdx === contentSpreads - 1;
    const pageA = showBody ? (model.flat[bodyIdx * 2] || { filler: true, topicIndex: 0 }) : null;
    const rawB = showBody ? model.flat[bodyIdx * 2 + 1] : null;
    const pageB = showBody ? (rawB || { filler: true, topicIndex: (pageA && pageA.topicIndex) || 0 }) : null;
    const activeTopicIndex = showBody ? Math.max(0, Math.min(model.topics.length - 1,
      ((isMobileViewport() && goalBookSide === "right" && rawB) ? rawB : pageA).topicIndex || 0)) : 0;
    const activeTopic = model.topics[activeTopicIndex] || model.topics[0];
    // FAB·모달이 지금 페이지의 주제를 기본값으로 쓰도록 맞춰 둠
    state.goalBookTopic = activeTopic.name;
    state.goalTopicFilter = activeTopic.name;
    state.bucketCatFilter = activeTopic.name;

    const pageHtml = (page, pageNo, sideSel, asBackCover) => {
      // 마지막 장 다음 오른면은 빈 종이가 아니라 책 뒤표지
      if (asBackCover) return nbBackCoverHtml(sideSel, GOAL_COVER_SPINE, { title: "Goals", sub: "뒤표지" });
      if (!page || page.filler) {
        // 주제 사이 장 나눔용 빈 면은 종이 그대로 (뒤표지는 책 맨 끝 전용)
        return `
        <section class="nb-page nb-page--${sideSel} nb-page--blank">
          <div class="nb-page-inner"></div>
        </section>
      `;
      }
      const pageTopic = model.topics[page.topicIndex] || activeTopic;
      const head = page.isFirst ? goalTopicHeadHtml(pageTopic) : "";
      const listHtml = page.items.length
        ? `<div class="gb-list">${page.items.map(renderGoalBookRow).join("")}</div>`
        : `<div class="gb-empty">아직 항목이 없습니다.</div>`;
      return `
        <section class="nb-page nb-page--${sideSel}">
          <div class="nb-page-inner">
            ${head}
            ${goalPageHeadHtml(page.label, page.groupFrom, page.groupTo, page.groupTotal, page.pageInGroup, page.groupPages)}
            ${listHtml}
            ${paperPageNo(pageNo)}
          </div>
        </section>
      `;
    };

    const tabClass = model.topics.length > 11 ? "idx-tabs--denser" : (model.topics.length > 7 ? "idx-tabs--dense" : "");
    const tabButtons = model.topics.map((t, i) => {
      // 인덱스 탭 글씨는 내지 제목과 완전히 같은 이름 (약어로 줄이지 않음)
      const label = String(t.name || "").trim();
      const longCls = [...label].length >= 4 ? "idx-tab--long" : "";
      const color = TOPIC_TAB_COLORS[i % TOPIC_TAB_COLORS.length];
      const active = showBody && i === activeTopicIndex;
      return `
        <button class="idx-tab idx-tab--topic ${longCls} ${active ? "is-active" : ""}" style="--tab-color:${color}" role="tab" aria-label="${escapeAttr(t.name)} 주제" aria-selected="${active ? "true" : "false"}" onclick="jumpGoalTopic(${i})" title="${escapeAttr(t.name)}">
          <span>${stackedLabel(label)}</span>
        </button>
      `;
    }).join("");

    return `
      <div class="nb-stage nb-stage--goalbook">
        <div class="nb-reader-head">
          <span class="nb-reader-spacer" aria-hidden="true"></span>
          <div class="nb-reader-title">
            <b>Goals</b>
            <span>${isMobileViewport() ? `${spreadIdx + 1}/${totalSpreads}장` : `${onFrontCover ? "앞표지" : onBackCover ? "뒤표지" : escapeHtml(activeTopic.name)} · ${spreadIdx + 1}/${totalSpreads}장`}</span>
          </div>
          <button class="nb-head-btn" onclick="openBookTopicManager()" title="주제 관리" aria-label="주제 관리">${ICONS.sliders}<span class="nb-head-btn-label">주제 관리</span></button>
        </div>

        <div class="nb-book nb-book--indexed">
          <button class="nb-nav prev" onclick="goalBookStep(-1)" ${spreadIdx <= 0 ? "disabled" : ""} aria-label="이전 페이지">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="goalSpread" data-side="${onFrontCover ? "left" : goalBookSide}" ${onFrontCover ? `data-cover="front"` : onBackCover ? `data-cover="back"` : ""}>
            ${onFrontCover ? goalCoverFaceHtml("front")
              : onBackCover ? goalCoverFaceHtml("back")
              : `${pageHtml(pageA, bodyIdx * 2 + 1, "left")}${pageHtml(pageB, bodyIdx * 2 + 2, "right", lastBodySpread && !rawB)}`}
            <span class="nb-spine"></span>
            ${BOOK_COIL}
            <div class="idx-tabs idx-tabs--topic ${tabClass}" role="tablist" aria-label="주제 인덱스">${tabButtons}</div>
          </div>
          <button class="nb-nav next" onclick="goalBookStep(1)" ${spreadIdx >= totalSpreads - 1 ? "disabled" : ""} aria-label="다음 페이지">${ICONS.chevRight}</button>
        </div>
        <div class="nb-bottom-bar">
          <span class="nb-bar-left"></span>
          <button class="nb-add-btn" onclick="openGoalModal(${jsArg(activeTopic.name)})" title="이 주제에 항목 추가" aria-label="항목 추가">${NB_ICONS.plus}</button>
          <span class="nb-bar-right"></span>
        </div>
        <div class="nb-legend-slot" aria-hidden="true"></div>
      </div>
    `;
  }

  function jumpGoalTopic(target) {
    const model = goalBookModel();
    if (!model.topics.length) return;
    const next = Math.max(0, Math.min(model.topics.length - 1, Number(target) || 0));
    const topic = model.topics[next];
    // 0번은 앞표지이므로 주제 첫 장은 그다음 스프레드
    const dest = 1 + Math.floor((topic.pageStart || 0) / 2);
    const destSide = (topic.pageStart || 0) % 2 === 0 ? "left" : "right";
    const cur = Math.round(Number(state.goalBookPage) || 0);
    if (dest === cur && goalBookSide === destSide && state.goalBookTopic === topic.name) return;
    const apply = () => {
      state.goalBookPage = dest;
      state.goalBookTopic = topic.name;
      goalBookSide = destSide;
      saveState();
    };
    // 앞표지·뒤표지에서 인덱스를 누르면 표지가 열리며 해당 주제로 들어간다
    const spreads = goalBookSpreads(model);
    if (cur === 0) { goalCoverTurn(1, "front", apply); return; }
    if (cur > spreads.contentSpreads) { goalCoverTurn(-1, "back", apply); return; }
    turnToPage(dest > cur ? 1 : -1, apply);
  }

  function goalBookStep(delta) {
    const model = goalBookModel();
    const spreads = goalBookSpreads(model);
    const total = spreads.total;
    const cur = Math.max(0, Math.min(total - 1, Math.round(Number(state.goalBookPage) || 0)));
    const next = cur + delta;
    if (next < 0 || next >= total) return;
    const apply = () => {
      state.goalBookPage = next;
      goalBookSide = "left";
      saveState();
    };
    // 앞표지는 열리고 덮이며, 꽉 찬 뒤끝에만 덮힌 뒤표지 스프레드가 있다
    if (cur === 0 || next === 0) { goalCoverTurn(delta, "front", apply); return; }
    if (!spreads.backOnLast && (cur === total - 1 || next === total - 1)) { goalCoverTurn(delta, "back", apply); return; }
    turnToPage(delta, apply);
  }

  function setGoalBookSide(side) {
    goalBookSide = side === "right" ? "right" : "left";
    const spread = document.getElementById("goalSpread");
    if (spread) spread.dataset.side = goalBookSide;
  }

  // 검색 결과에서 목표 항목으로 바로 건너뛰기
  function focusGoalItem(id) {
    setTab("goals");
    const model = goalBookModel();
    for (let i = 0; i < model.flat.length; i += 1) {
      const page = model.flat[i];
      if (!page || page.filler || !page.items) continue;
      if (page.items.some(e => e.item.id === id)) {
        state.goalBookPage = 1 + Math.floor(i / 2);
        state.goalBookTopic = (model.topics[page.topicIndex] || {}).name || state.goalBookTopic;
        goalBookSide = i % 2 === 0 ? "left" : "right";
        saveState();
        render();
        return;
      }
    }
  }

  /* v3.1 페이지 모델은 위에서 렌더 · 네비게이션 함수로 이어짐 */

  function goalTopicOptions(selected) {
    const names = [];
    goalBookTopics().forEach(t => { if (!names.includes(t.name)) names.push(t.name); });
    if (selected && !names.includes(selected)) names.push(selected);
    return names.map(n => `<option value="${escapeAttr(n)}" ${n === selected ? "selected" : ""}>${escapeHtml(n)}</option>`).join("");
  }

  // 통합 항목 작성 (목표 · 버킷 구분 없이 한 가지 형식)
  // presetDate: 일기 오른면의 `+`처럼 그 날짜를 미리 채워 열 때
  function openGoalModal(topicOverride, presetDate) {
    const preset = canonicalTopicName(topicOverride || state.goalBookTopic || "");
    const all = goalBookTopics();
    const defaultTopic = preset || (all[0] ? all[0].name : "");
    const seedDate = /^\d{4}-\d{2}-\d{2}$/.test(String(presetDate || "")) ? String(presetDate) : "";
    const quarterSeed = seedDate
      ? { qYear: seedDate.slice(0, 4), qQuarter: quarterOfDate(seedDate) }
      : { qYear: TODAY_STR.slice(0, 4), qQuarter: 0 };
    openModal("새 항목", `
      <div class="modal-field">
        <label>주제</label>
        <select id="mGoalTopicSel">${goalTopicOptions(defaultTopic)}</select>
      </div>
      <div class="modal-field">
        <label>제목</label>
        <input type="text" id="mGoalTitle" placeholder="이루고 싶은 일, 해보고 싶은 것" />
      </div>
      <div class="modal-field">
        <label>분기</label>
        ${goalQuarterHtml(quarterSeed)}
      </div>
      <div class="modal-field">
        <label>날짜</label>
        ${dateFieldsHtml("mGoal", seedDate ? { dateMode: "day", dateFrom: seedDate } : { dateMode: "none" })}
      </div>
      <div class="modal-field">
        <label>메모</label>
        <textarea id="mGoalNote" style="min-height:90px;" placeholder="구체적인 계획, 다짐, 기준"></textarea>
      </div>
    `, () => {
      const titleEl = document.getElementById("mGoalTitle");
      const title = (titleEl && titleEl.value ? titleEl.value : "").trim();
      if (!title) {
        alert("제목을 입력해 주세요.");
        if (titleEl) titleEl.focus();
        return false;
      }
      const selEl = document.getElementById("mGoalTopicSel");
      const topic = ensureTopicExists((selEl && selEl.value) || defaultTopic);
      const dates = readDateFields("mGoal");
      const q = readGoalQuarter();
      state.goals.unshift({
        id: "g_" + uid().slice(3),
        topic,
        year: q.year,
        period: q.quarter ? `${q.quarter}분기` : "연간",
        qYear: q.year,
        qQuarter: q.quarter,
        title,
        note: (document.getElementById("mGoalNote").value || "").trim(),
        images: [],
        done: false,
        doneDate: "",
        dateMode: dates.dateMode,
        dateFrom: dates.dateFrom,
        dateTo: dates.dateTo
      });
      state.goalBookTopic = canonicalTopicName(topic);
      state.goalTopicFilter = canonicalTopicName(topic);
      return true;
    });
  }

  function openEditGoalItem(id) {
    const entry = findGoalEntry(id);
    if (!entry) return;
    const it = entry.item || {};
    const curTopic = goalEntryTopic(entry) || (goalBookTopics()[0] ? goalBookTopics()[0].name : "");
    // 예전 데이터(년·반기·분기만 있거나 날짜만 있음)도 모달에 그대로 보이게 맞춰 둔다
    const eff = goalPeriodOf(entry);
    const quarterSeed = {
      qYear: it.qYear || (eff ? String(eff.year) : ""),
      qQuarter: Number(it.qQuarter) || (eff ? eff.quarter : 0)
    };
    const deleteMsg = entry.src === "buckets" ? "이 버킷리스트를 삭제할까요?" : "이 목표를 삭제할까요?";
    openModal("항목 수정", `
      <div class="modal-field">
        <label>주제</label>
        <select id="mGoalTopicSel">${goalTopicOptions(curTopic)}</select>
      </div>
      <div class="modal-field">
        <label>제목</label>
        <input type="text" id="mGoalTitle" value="${escapeAttr(it.title || "")}" />
      </div>
      <div class="modal-field">
        <label>분기</label>
        ${goalQuarterHtml(quarterSeed)}
      </div>
      <div class="modal-field">
        <label>날짜</label>
        ${dateFieldsHtml("mGoal", it)}
      </div>
      <div class="modal-field">
        <label>메모</label>
        <textarea id="mGoalNote" style="min-height:100px;">${escapeHtml(it.note || "")}</textarea>
      </div>
    `, () => {
      const selEl = document.getElementById("mGoalTopicSel");
      const topic = (selEl && selEl.value) || curTopic;
      if (entry.src === "buckets") it.category = topic;
      else it.topic = topic;
      it.title = (document.getElementById("mGoalTitle").value || "").trim() || it.title;
      it.note = (document.getElementById("mGoalNote").value || "").trim();
      const dates = readDateFields("mGoal");
      it.dateMode = dates.dateMode;
      it.dateFrom = dates.dateFrom;
      it.dateTo = dates.dateTo;
      const q = readGoalQuarter();
      it.qYear = q.year;
      it.qQuarter = q.quarter;
      if (entry.src === "goals") {
        it.year = q.year;
        it.period = q.quarter ? `${q.quarter}분기` : "연간";
      }
      syncGoalDoneDate(it);
      return true;
    }, {
      deleteLabel: "삭제",
      onDelete: () => {
        if (!confirm(deleteMsg)) return false;
        state[entry.src] = state[entry.src].filter(x => x.id !== it.id);
        return true;
      }
    });
  }

  // v3.1: 주제 관리는 목표·버킷을 나누지 않은 하나의 목록
  function openBookTopicManager() {
    closeModal();
    openCategoryManager("goals");
  }

  // ---------- 아카이브 (주제별 책장 + 스프링 노트북 단일 뷰) ----------
  function renderArchiveView() {
    return renderArchiveNotebookView();
  }

  // ---------- 아카이브: 주제별 책장 + 스프링 노트북 ----------
  const NB_ICONS = {
    back: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
    edit: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
    plus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    dots: `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
    book: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>`,
    calendar: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    pen: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`
  };

  function getBooks() {
    return Array.isArray(state.books) ? state.books : [];
  }

  function getBookById(id) {
    const key = String(id || "");
    if (!key) return null;
    return getBooks().find(b => b.id === key) || null;
  }

  function bookArchives(bookId) {
    const list = [];
    (state.archives || []).forEach((a, i) => {
      if ((a.bookId || "") === bookId) list.push({ a, i });
    });
    list.sort((x, y) => {
      const d = String(x.a.date || "").localeCompare(String(y.a.date || ""));
      return d !== 0 ? d : x.i - y.i;
    });
    return list.map(x => x.a);
  }

  function clampShelfIndex() {
    const books = getBooks();
    if (!books.length) {
      notebookShelfIndex = 0;
      return;
    }
    if (state.shelfSelectedBookId) {
      const idx = books.findIndex(b => b.id === state.shelfSelectedBookId);
      if (idx >= 0) {
        notebookShelfIndex = idx;
        return;
      }
    }
    if (notebookShelfIndex > books.length - 1) notebookShelfIndex = books.length - 1;
    if (notebookShelfIndex < 0) notebookShelfIndex = 0;
    state.shelfSelectedBookId = books[notebookShelfIndex].id;
  }

  function renderArchiveNotebookView() {
    const book = notebookBookId ? getBookById(notebookBookId) : null;
    if (notebookBookId && !book) notebookBookId = "";
    return book ? renderNotebookReader(book) : renderNotebookShelf();
  }

  function renderShelfCover(book, isActive, vindex, index) {
    const recs = bookArchives(book.id);
    const coverImg = book.cover || "";
    const spine = normalizeSpineColor(book.spine, BOOK_SPINE_PALETTE[0]);
    const sub = String(book.subtitle || "").trim();
    return `
      <button class="nb-cover-btn ${isActive ? "is-active" : ""}" data-book-id="${escapeAttr(book.id)}" data-index="${Number(index) || 0}" data-vindex="${Number(vindex) || 0}" onclick="shelfCoverTap('archive', this)" aria-label="${escapeAttr(book.title)} 펼치기" title="${escapeAttr(book.title)} 펼치기">
        <span class="nb-cover" style="--spine:${spine}">
          ${coverImg
            ? `<img class="nb-cover-photo" src="${coverImg}" alt="" /><span class="nb-cover-plate">${escapeHtml(book.title)}</span>`
            : `<span class="nb-cover-label"><b>${escapeHtml(book.title)}</b>${(sub && sub !== book.title) ? `<span>${escapeHtml(sub)}</span>` : ""}</span>`}
          <span class="nb-cover-spine"></span>
          <span class="nb-cover-shine"></span>
          <span class="nb-cover-chip">${recs.length}p</span>
        </span>
      </button>
    `;
  }

  function renderShelfMeta(book) {
    const recs = bookArchives(book.id);
    const latest = recs.length ? recs[recs.length - 1] : null;
    const bits = [`${recs.length}페이지`];
    if (latest && latest.date) bits.push(`최근 ${latest.date}`);
    const sub = String(book.subtitle || "").trim();
    return `
      <div class="nb-book-meta">
        <h3>${escapeHtml(book.title)}</h3>
        ${sub ? `<div class="nb-book-sub">${escapeHtml(sub)}</div>` : ""}
        <div class="nb-book-info">${bits.map(escapeHtml).join(" · ")}</div>
      </div>
    `;
  }

  function renderShelfActions(book) {
    return `
      <button class="nb-action" onclick="openBookModal()"><span class="nb-action-icon">${NB_ICONS.plus}</span>책 추가</button>
      <button class="nb-action" onclick="openBookModal('${book.id}')"><span class="nb-action-icon">${NB_ICONS.edit}</span>책 편집</button>
    `;
  }

  function renderNotebookShelf() {
    const books = getBooks();
    const bar = "";
    if (!books.length) {
      return `
        <div class="nb-stage nb-stage--shelf">
          <div class="nb-shelf-empty">
            <h3>아직 책장이 비어 있습니다</h3>
            <button class="btn btn-primary" onclick="openBookModal()">+ 첫 책 만들기</button>
          </div>
        </div>
      `;
    }
    clampShelfIndex();
    const active = books[notebookShelfIndex];
    return `
      <div class="nb-stage nb-stage--shelf">
        <div id="nbShelfMeta">${renderShelfMeta(active)}</div>
        <div class="nb-carousel" data-shelf="archive" id="nbShelfCarousel">${shelfRing(books.length, notebookShelfIndex, shelfRadius()).map(slot => renderShelfCover(books[slot.index], slot.vindex === notebookShelfIndex, slot.vindex, slot.index)).join("")}</div>
        <div class="nb-actions" id="nbShelfActions">${renderShelfActions(active)}</div>
      </div>
    `;
  }

  function selectShelfBook(id) {
    const books = getBooks();
    const idx = books.findIndex(b => b.id === id);
    if (idx < 0) return;
    notebookShelfIndex = idx;
    state.shelfSelectedBookId = id;
    saveState();
    render();
  }

  function shelfStep(delta) {
    const books = getBooks();
    if (!books.length || !delta) return;
    clampShelfIndex();
    const from = notebookShelfIndex;
    shelfAnimate("archive", from, from + delta, () => {
      const n = books.length;
      notebookShelfIndex = ((from + delta) % n + n) % n;
      state.shelfSelectedBookId = books[notebookShelfIndex].id;
      saveState();
      render();
    });
  }

  function openNotebook(id) {
    const book = getBookById(id);
    if (!book) return;
    const idx = getBooks().findIndex(b => b.id === id);
    if (idx >= 0) notebookShelfIndex = idx;
    state.shelfSelectedBookId = id;
    notebookBookId = id;
    notebookPageIndex = 0;
    notebookMobileSide = "left";
    saveState();
    render();
  }

  function closeNotebookBook() {
    notebookBookId = "";
    notebookPageIndex = 0;
    notebookMobileSide = "left";
    render();
  }

  function notebookTotalPages(book) {
    return bookArchives(book.id).length + 1;
  }

  function notebookStep(delta) {
    const book = getBookById(notebookBookId);
    if (!book) return;
    const total = notebookTotalPages(book);
    const next = notebookPageIndex + delta;
    if (next < 0 || next >= total) {
      turnToPage(delta, () => { closeNotebookBook(); }, {
        boundary: true,
        spine: normalizeSpineColor(book.spine, BOOK_SPINE_PALETTE[0]),
        title: book.title || "",
        sub: String(book.subtitle || "").trim()
      });
      return;
    }
    if (next === notebookPageIndex) return;
    turnToPage(delta, () => {
      notebookPageIndex = next;
      notebookMobileSide = "left";
    });
  }

  function setNotebookSide(side) {
    notebookMobileSide = side === "right" ? "right" : "left";
    const spread = document.getElementById("nbSpread");
    if (spread) spread.dataset.side = notebookMobileSide;
    document.querySelectorAll(".nb-side-toggle button[data-side]").forEach(b => {
      b.classList.toggle("active", b.dataset.side === notebookMobileSide);
    });
  }

  function openNotebookPhoto(id, index) {
    const a = (state.archives || []).find(x => x.id === id);
    if (!a) return;
    openLightbox(normalizeImages(a), Number(index) || 0, a.title || "");
  }

  // 사진이 있는 기록의 왼면: 사진 판 + 날짜·부제목 도장
  function renderNotebookLeftPage(a, book, pageNo) {
    const imgs = normalizeImages(a);
    const detail = String(a.subtitle || "").trim();
    return `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner">
          ${photoBoardHtml(imgs, i => `openNotebookPhoto('${a.id}', ${i})`)}
          <div class="nb-stamps" onclick="openEditArchive('${a.id}')" title="눌러서 수정">
            ${archiveStampHtml(a)}
            ${detail ? `<span class="nb-stamp nb-stamp--detail"><span class="nb-stamp-label">부제목</span><b>${escapeHtml(detail)}</b></span>` : ""}
          </div>
          ${paperPageNo(pageNo)}
        </div>
      </section>
    `;
  }

  // 사진이 있는 기록의 오른면: 제목 + 감상
  function renderNotebookRightPage(a, pageNo) {
    return `
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner">
          <div class="nb-note nb-note--edit" onclick="openEditArchive('${a.id}')" title="눌러서 수정" role="button" tabindex="0" aria-label="${escapeAttr(a.title || "")} 수정">
            <h2 class="nb-note-title">${escapeHtml(a.title)}</h2>
            <div class="nb-note-rule"></div>
            <div class="nb-note-body">${a.note ? escapeHtml(a.note) : `<span class="nb-note-empty">아직 글이 없습니다. 이곳을 누르면 바로 적을 수 있어요.</span>`}</div>
          </div>
          ${paperPageNo(pageNo)}
        </div>
      </section>
    `;
  }

  // v3.6 사진이 없는 기록: 빈 사진 면 대신 한 면에 제목·부제목·도장·감상을 모은다
  function renderNotebookNotePage(a, pageNo) {
    const sub = String(a.subtitle || "").trim();
    const stamp = archiveStampHtml(a);
    return `
      <section class="nb-page nb-page--wide">
        <div class="nb-page-inner nb-note-single">
          <div class="nb-note nb-note--edit nb-note--wide" onclick="openEditArchive('${a.id}')" title="눌러서 수정" role="button" tabindex="0" aria-label="${escapeAttr(a.title || "")} 수정">
            <div class="nb-note-head">
              <h2 class="nb-note-title">${escapeHtml(a.title)}</h2>
              ${sub ? `<div class="nb-note-sub">${escapeHtml(sub)}</div>` : ""}
              ${stamp ? `<div class="nb-stamps nb-stamps--inline">${stamp}</div>` : ""}
            </div>
            <div class="nb-note-rule"></div>
            <div class="nb-note-body">${a.note ? escapeHtml(a.note) : `<span class="nb-note-empty">아직 글이 없습니다. 이곳을 누르면 바로 적을 수 있어요.</span>`}</div>
          </div>
          ${paperPageNo(pageNo)}
        </div>
      </section>
    `;
  }

  // 기록마다 실제로 차지하는 종이 면 수(사진 있으면 2면, 없으면 1면)를 세어 페이지 번호를 매긴다
  function notebookPageNumbers(recs) {
    const nums = [];
    let n = 1;
    (recs || []).forEach(r => {
      nums.push(n);
      n += normalizeImages(r).length ? 2 : 1;
    });
    return { nums, next: n };
  }

  function renderNotebookGuidePages(book, recs, pageNo) {
    const last = recs.length ? recs[recs.length - 1] : null;
    const spine = normalizeSpineColor(book.spine, BOOK_SPINE_PALETTE[0]);
    const lastLabel = last ? (last.title || dottedDate(itemDateFrom(last) || itemDateTo(last))) : "—";
    return `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner nb-guide-summary">
          <div class="nb-summary-title">${escapeHtml(book.title)}</div>
          <ul class="nb-summary-list">
            <li><span>기록</span><b>${recs.length}개</b></li>
            <li><span>최근 기록</span><b>${last ? escapeHtml(lastLabel) : "—"}</b></li>
            <li><span>연결</span><b>${escapeHtml(book.category || book.subject || "자유 주제")}</b></li>
          </ul>
          ${paperPageNo(pageNo)}
        </div>
      </section>
      ${nbBackCoverHtml("right", spine, { title: book.title, sub: "뒤표지" })}
    `;
  }

  function renderNotebookReader(book) {
    const recs = bookArchives(book.id);
    const total = recs.length + 1;
    if (notebookFocusId) {
      const fi = recs.findIndex(a => a.id === notebookFocusId);
      if (fi >= 0) notebookPageIndex = fi;
      notebookFocusId = "";
    }
    notebookPageIndex = Math.min(total - 1, Math.max(0, notebookPageIndex));
    const idx = notebookPageIndex;
    const onGuide = idx >= recs.length;
    const current = onGuide ? null : recs[idx];
    const bookSub = String(book.subtitle || "").trim();
    const subBits = [];
    const subLine = bookSub || (book.category && book.category !== book.title ? book.category : "");
    if (subLine) subBits.push(subLine);
    subBits.push(`${recs.length}페이지`);

    const numbers = notebookPageNumbers(recs);
    const hasPhotos = !onGuide && normalizeImages(current).length > 0;
    const spreadBody = onGuide
      ? renderNotebookGuidePages(book, recs, numbers.next)
      : hasPhotos
        ? `${renderNotebookLeftPage(current, book, numbers.nums[idx])}${renderNotebookRightPage(current, numbers.nums[idx] + 1)}`
        : renderNotebookNotePage(current, numbers.nums[idx]);

    return `
      <div class="nb-stage">
        <div class="nb-reader-head">
          <button class="nb-back" onclick="closeNotebookBook()">${ICONS.chevLeft}책장</button>
          <div class="nb-reader-title">
            <b>${escapeHtml(book.title)}</b>
            <span>${subBits.map(escapeHtml).join(" · ")}</span>
          </div>
          <span class="nb-reader-spacer" aria-hidden="true"></span>
        </div>
        <div class="nb-book">
          <button class="nb-nav prev" onclick="notebookStep(-1)" aria-label="이전 페이지">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="nbSpread" data-side="${notebookMobileSide}"${(!onGuide && !hasPhotos) ? ' data-single="1"' : ""}>
            ${spreadBody}
            <span class="nb-spine"></span>
            ${BOOK_COIL}
          </div>
          <button class="nb-nav next" onclick="notebookStep(1)" aria-label="다음 페이지">${ICONS.chevRight}</button>
        </div>
        <div class="nb-bottom-bar">
          <span class="nb-bar-left"></span>
          <button class="nb-add-btn" onclick="openNewArchiveModal('${book.id}')" title="새 기록 추가" aria-label="새 기록 추가">${NB_ICONS.plus}</button>
          <span class="nb-bar-right"></span>
        </div>
        <div class="nb-legend-slot" aria-hidden="true"></div>
      </div>
    `;
  }

  function bindNotebookGestures() {
    document.querySelectorAll(".nb-action").forEach(b => {
      if (b.getAttribute("aria-label")) return;
      const label = (b.textContent || "").replace(/\s+/g, " ").trim();
      if (label) b.setAttribute("aria-label", label);
    });
    const spreads = [
      document.getElementById("nbSpread"),
      document.getElementById("nbYearSpread"),
      document.getElementById("nbDaySpread"),
      document.getElementById("goalSpread")
    ].filter(Boolean);
    spreads.forEach(spread => {
      const isYear = spread.id === "nbYearSpread";
      const isGoal = spread.id === "goalSpread";
      const isDay = spread.id === "nbDaySpread";
      if (spread.dataset.gestureBound === "1") return;
      spread.dataset.gestureBound = "1";
      let sx = 0;
      let sy = 0;
      spread.addEventListener("touchstart", e => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        sx = t.clientX;
        sy = t.clientY;
      }, { passive: true });
      spread.addEventListener("touchend", e => {
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;
        if (Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.35) {
          spread.dataset.swipedAt = String(Date.now());
          const dir = dx < 0 ? 1 : -1;
          if (isYear) bookTurn(spread, dir, () => yearPageStep(1), () => yearPageStep(-1));
          else if (isGoal) {
            // 앞표지·뒤표지에서는 한 면 뒤집기가 아니라 표지 단위로 넘긴다
            if (spread.dataset.cover) goalBookStep(dir);
            else bookTurn(spread, dir, () => goalBookStep(1), () => goalBookStep(-1));
          }
          else if (isDay) dayNavStep(dir);
          else bookTurn(spread, dir, () => notebookStep(1), () => notebookStep(-1));
        }
      }, { passive: true });
      // 모바일 1면 보기: 페이지를 탭하면 왼쪽 면 ↔ 오른쪽 면 뒤집기
      spread.addEventListener("click", e => {
        const last = Number(spread.dataset.swipedAt || 0);
        if (last && Date.now() - last < 420) return;
        // 표지를 여닫는 중·직후의 따라오는 클릭은 무시한다 (한 번만 넘어가도록)
        if (Date.now() < coverTurnLock) return;
        // Goals 앞표지를 누르면 책이 열린다 (데스크톱·모바일 공통), 뒤표지는 넘길 곳이 없다
        if (isGoal && spread.dataset.cover === "front") {
          if (e.target.closest(".idx-tab, .nb-nav")) return;
          goalBookStep(1);
          return;
        }
        if (isGoal && spread.dataset.cover) return;
        if (isYear || isDay || !isMobileViewport()) return;
        if (e.target.closest("button, a, input, textarea, select, label, .gb-row, .gb-list, .nb-note, .nb-stamps, .nb-thumb, .nb-guide, .nb-photo-zoom, .nb-nav, .idx-tab, .gb-add, .gb-stamp")) return;
        const nextSide = spread.dataset.side === "right" ? "left" : "right";
        const spreadId = spread.id;
        turnToPage(nextSide === "right" ? 1 : -1, () => setMobileBookSide(spreadId, nextSide));
      });
    });
  }

  // 모바일 노트 뒤집기 (사진 면 ↔ 노트 면) + 부드러운 전환

  function deleteBook(id) {
    const book = getBookById(id);
    if (!book) return;
    const n = state.archives.filter(a => a.bookId === id).length;
    const msg = n
      ? `‘${book.title}’ 책을 삭제할까요?\n\n이 책의 기록 ${n}개는 지워지지 않고 ‘미분류 기록’ 책으로 옮겨집니다.`
      : `‘${book.title}’ 책을 삭제할까요?`;
    if (!confirm(msg)) return;
    state.books = state.books.filter(b => b.id !== id);
    state.archives.forEach(a => { if (a.bookId === id) a.bookId = ""; });
    applyBookModel(state);
    if (notebookBookId === id) {
      notebookBookId = "";
      notebookPageIndex = 0;
    }
    if (state.shelfSelectedBookId === id) {
      state.shelfSelectedBookId = state.books[0] ? state.books[0].id : "";
      notebookShelfIndex = 0;
    }
    closeModal();
    saveState();
    render();
  }

  function setYearBook(year, patch) {
    const y = Number(year);
    if (!y) return;
    const list = getYearBooks();
    const found = list.find(b => b.year === y);
    if (found) {
      Object.assign(found, patch);
    } else {
      list.push({
        year: y,
        title: patch.title || String(y),
        subtitle: typeof patch.subtitle === "string" ? patch.subtitle : "Yearly Note",
        spine: patch.spine || BOOK_SPINE_PALETTE[list.length % BOOK_SPINE_PALETTE.length],
        cover: patch.cover || ""
      });
      list.sort((a, b) => a.year - b.year);
    }
    refreshHolidays();
    saveState();
  }

    const caption = document.getElementById("lightboxCaption");
    if (caption) {
      caption.textContent = `${lightboxCaption}${lightboxImages.length > 1 ? ` (${lightboxIndex + 1}/${lightboxImages.length})` : ""}`;

      el.style.display = multi ? "flex" : "none";

  function showToast(message, kind = "info", ms = 3800) {
    const stack = document.getElementById("toastStack");
    if (!stack) return;
    const el = document.createElement("div");
    el.className = "toast" + (kind === "warn" ? " warn" : kind === "ok" ? " ok" : "");
    const text = document.createElement("span");
    text.className = "toast-text";
    text.textContent = String(message == null ? "" : message);
    const close = document.createElement("button");
    close.type = "button";
    close.className = "toast-close";
    close.setAttribute("aria-label", "알림 닫기");
    close.textContent = "✕";
    close.onclick = () => el.remove();
    el.append(text, close);
    stack.appendChild(el);
    while (stack.children.length > 3) stack.firstChild.remove();
    if (ms > 0) setTimeout(() => { if (el.parentNode) el.remove(); }, ms);
  }

  // 로그인 버튼을 누를 때는 이미 준비된 firebaseCtx로 바로 팝업을 엽니다.
  function preloadFirebase() {
    if (!isFirebaseConfigured()) return Promise.resolve(null);

    return getFirebase().catch(() => null);

  async function getFirebase() {
    if (!isFirebaseConfigured()) return null;
    if (firebaseCtx) return firebaseCtx;
    if (!firebaseInitPromise) {
      firebaseInitPromise = initFirebase().catch(err => {
        firebaseInitPromise = null;
        throw err;
      });
    }
    return firebaseInitPromise;
  }

  async function initFirebase() {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
    const [appMod, authMod, dbMod] = await Promise.all([
      import(`${base}firebase-app.js`),
      import(`${base}firebase-auth.js`),
      import(`${base}firebase-firestore.js`)
    ]);
    const app = appMod.getApps && appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    const db = dbMod.getFirestore(app);
    firebaseCtx = { app, auth, db, authMod, dbMod };

    // 모바일 Safari·PWA에서도 로그인이 유지되도록 로컬 지속성(browserLocalPersistence)을
    // 명시적으로 설정합니다. 이 await는 워밍업 단계에서 끝나므로 로그인 클릭 시점에는 영향이 없습니다.
    try { await authMod.setPersistence(auth, authMod.browserLocalPersistence); } catch (_) {}

    authMod.onAuthStateChanged(auth, user => {
      const wasSignedIn = Boolean(authUser);
      authResolved = true;
      authConfigState = "ok";
      authUser = user ? { uid: user.uid, email: user.email || "", name: user.displayName || "" } : null;
      if (authUser) {
        rememberLocalMode(false);
        const screen = document.getElementById("authScreen");
        if (screen && screen.classList.contains("open")) closeAuthScreen();
        adoptCloudState();
      } else {
        authMode = "signin";
        if (wasSignedIn) lastPushedSerialized = "";
      }
      refreshSettingsIfOpen();
    }, err => {
      authResolved = true;
      if (err && String(err.code || "").includes("configuration")) authConfigState = "not-configured";
      refreshSettingsIfOpen();
    });

    // Google 로그인 리디렉트로 돌아온 경우
    authMod.getRedirectResult(auth).then(result => {
      if (result && result.user) {
        clearRedirectFlag();
        showToast("Google 계정으로 로그인했습니다.", "ok");
      } else if (hadRedirectStarted()) {
        clearRedirectFlag();
        showToast("Google 로그인 연결을 마치지 못했습니다. 다시 시도해 주세요.", "warn", 6500);
      }
    }).catch(err => {
      const code = String((err && err.code) || "");
      if (hadRedirectStarted()) clearRedirectFlag();
      if (code && !code.includes("no-auth-event") && !code.includes("configuration-not-found")) showToast(authErrorText(err), "warn", 6000);
    });

    return firebaseCtx;
  }

    el.classList.add("open");
    el.setAttribute("aria-hidden", "false");
    // 로그인 화면이 뜬 순간 미리 받아 두어, Google 버튼을 누를 때 await 없이 팝업을 엽니다.
    preloadFirebase();
    setTimeout(() => {
      const email = document.getElementById("authEmail");
      if (email) { try { email.focus(); } catch (_) {} }
    }, 80);
  }

  function closeAuthScreen() {
    const el = document.getElementById("authScreen");
    if (!el) return;
    if (el.classList.contains("open") && !authUser) rememberAuthPromptSkip();
    el.classList.remove("open");
    el.setAttribute("aria-hidden", "true");
  }

  function setAuthError(msg) {
    const el = document.getElementById("authError");
    if (el) el.textContent = msg || "";
  }

  function authErrorText(err) {
    const code = String((err && err.code) || "");
    const raw = String((err && err.message) || "");
    if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found") || code.includes("invalid-login-credentials")) return "이메일 또는 비밀번호가 맞지 않습니다. 처음이라면 ‘회원가입’으로 계정을 만들어 주세요.";
    if (code.includes("email-already-in-use")) return "이미 가입된 이메일입니다. ‘로그인’으로 바꿔 주세요.";
    if (code.includes("weak-password")) return "비밀번호는 6자 이상이어야 합니다.";
    if (code.includes("invalid-email")) return "이메일 주소를 확인해 주세요.";
    if (code.includes("too-many-requests")) return "시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.";
    if (code.includes("popup-closed-by-user") || code.includes("cancelled-popup-request")) return "로그인 창이 닫혔습니다.";
    if (code.includes("popup-blocked")) return "브라우저가 로그인 창을 막았습니다. 다시 시도해 주세요.";
    if (code.includes("network-request-failed")) return "네트워크 연결을 확인해 주세요.";
    if (code.includes("operation-not-allowed")) return "이 로그인 방식이 Firebase 콘솔에서 아직 켜져 있지 않습니다. Authentication에서 이메일/비밀번호·Google 로그인을 켜 주세요.";
    if (code.includes("configuration-not-found")) return "Firebase Authentication이 아직 시작되지 않았습니다. Firebase 콘솔 → Authentication에서 ‘시작하기’를 눌러 주세요.";
    if (code.includes("unauthorized-domain")) return "이 사이트 주소가 Firebase 승인 도메인에 없습니다. Authentication → 설정 → 승인된 도메인에 kongdomath.github.io를 추가해 주세요.";
    if (code.includes("web-storage-unsupported")) return "브라우저가 쿠키·저장소를 막아 로그인할 수 없습니다. Safari 설정에서 ‘교차 사이트 추적 방지’를 풀거나 Chrome에서 시도해 주세요.";
    if (code.includes("internal-error")) return "Firebase에서 로그인을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    if (/unauthorized|api-key|referrer/i.test(raw)) return "Firebase 설정(API 키·승인 도메인)을 확인해 주세요.";
    return "로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }

  async function submitEmailAuth() {
    if (authBusy) return;
    if (!isFirebaseConfigured()) {
      setAuthError("Firebase 설정이 아직 연결되지 않았습니다. 아래 ‘로컬 모드’로 앱을 그대로 사용할 수 있어요.");
      return;
    }
    const emailEl = document.getElementById("authEmail");
    const pwEl = document.getElementById("authPassword");
    const email = (emailEl && emailEl.value || "").trim();
    const password = (pwEl && pwEl.value) || "";
    if (!/.+@.+\..+/.test(email)) { setAuthError("이메일 주소를 확인해 주세요."); return; }
    if (password.length < 6) { setAuthError("비밀번호는 6자 이상이어야 합니다."); return; }
    const signup = authMode === "signup";
    authBusy = true;
    setAuthError("");
    setAuthButtonsBusy(true, signup ? "가입 중…" : "로그인 중…");
    try {
      const fb = await getFirebase();
      if (!fb) { setAuthError("Firebase 설정이 아직 연결되지 않았습니다."); return; }
      if (signup) {
        const cred = await fb.authMod.createUserWithEmailAndPassword(fb.auth, email, password);
        try { await fb.authMod.updateProfile(cred.user, { displayName: email.split("@")[0] }); } catch (_) {}
      } else {
        await fb.authMod.signInWithEmailAndPassword(fb.auth, email, password);
      }
      closeAuthScreen();
    } catch (err) {
      if (String((err && err.code) || "").includes("configuration-not-found")) {
        authConfigState = "not-configured";
        renderAuthScreen();
      }
      setAuthError(authErrorText(err));
    } finally {
      authBusy = false;
      setAuthButtonsBusy(false);
    }
  }

  // Google 로그인: 아이폰 Safari에서도 팝업이 열리도록 클릭 즉시(await 없이) signInWithPopup을 호출합니다.
  // 팝업이 실제로 차단된 경우(auth/popup-blocked)나 이 환경에서 팝업이 지원되지 않을 때만 리다이렉트로 이어갑니다.
  function submitGoogleLogin() {
    if (authBusy) return;
    if (!isFirebaseConfigured()) {
      setAuthError("Firebase 설정이 아직 연결되지 않았습니다. 아래 ‘로컬 모드’로 앱을 그대로 사용할 수 있어요.");
      return;
    }
    if (isInAppBrowser()) {
      setAuthError("지금 앱 안의 브라우저에서는 Google 로그인이 막힙니다. Safari나 Chrome에서 열어 주세요. 이메일 로그인은 여기서도 됩니다.");
      return;
    }
    authBusy = true;
    setAuthError("");
    setAuthButtonsBusy(true, authMode === "signup" ? "가입 중…" : "로그인 중…");

    let watchdog = null;
    const done = () => {
      clearTimeout(watchdog);
      authBusy = false;
      setAuthButtonsBusy(false);
    };
    // 팝업이 비정상 종료되어 약속이 끝나지 않는 경우를 대비한 안전장치
    watchdog = setTimeout(() => { if (authBusy) done(); }, 90000);
    const fail = err => {
      if (String((err && err.code) || "").includes("configuration-not-found")) {
        authConfigState = "not-configured";
        renderAuthScreen();
      }
      setAuthError(authErrorText(err));
      done();
    };
    const showBusy = text => {
      const googleBtn = document.getElementById("authGoogleBtn");
      if (googleBtn) googleBtn.innerHTML = `<span class="auth-g">G</span>${text}`;
    };
    const runPopup = fb => {
      const provider = new fb.authMod.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      let pending;
      try {
        // await를 끼우지 않고 바로 호출해야 아이폰 Safari가 사용자 제스처를 유지해 팝업을 열어 줍니다.
        pending = fb.authMod.signInWithPopup(fb.auth, provider);
      } catch (err) {
        fail(err);
        return;
      }
      pending.then(() => {
        clearRedirectFlag();
        closeAuthScreen();
        done();
      }).catch(err => {
        const code = String((err && err.code) || "");
        if (code === "auth/cancelled-popup-request" || code === "auth/popup-closed-by-user") {
          done();
          return;
        }
        const blocked = code === "auth/popup-blocked"
          || code === "auth/operation-not-supported-in-this-environment"
          || code === "auth/popup-error";
        if (!blocked) {
          fail(err);
          return;
        }
        // 팝업이 막힌 환경에서만 리다이렉트로 이어갑니다.
        showBusy("Google 화면으로 이동 중…");
        markRedirectStarted();
        Promise.resolve()
          .then(() => (fb.authMod.setPersistence ? fb.authMod.setPersistence(fb.auth, fb.authMod.browserLocalPersistence) : null))
          .catch(() => {})
          .then(() => fb.authMod.signInWithRedirect(fb.auth, provider))
          .catch(fail);
      });
    };

    // 미리 받아 둔 SDK가 있으면 await 없이 곧바로 팝업 (제스처 유지)
    if (firebaseCtx) {
      runPopup(firebaseCtx);
      return;
    }
    preloadFirebase().then(fb => {
      if (!fb) {
        setAuthError("Firebase 설정이 아직 연결되지 않았습니다.");
        done();
        return;
      }
      runPopup(fb);
    }).catch(fail);
  }

  async function signOutOfAccount() {
    clearTimeout(cloudTimer);
    cloudTimer = null;
    try {
      if (firebaseCtx) await firebaseCtx.authMod.signOut(firebaseCtx.auth);
    } catch (_) {}
    authUser = null;
    authMode = "signin";
    lastPushedSerialized = "";
    refreshSettingsIfOpen();
    showToast("로그아웃했습니다. 기록은 이 기기에 그대로 남아 있습니다.", "info", 4000);
    openAuthScreen();
  }

  // ---------- Firestore 동기화 ----------
  // 기록 전체를 users/{uid}/planner/state 문서 하나에 담고,
  // 사진 때문에 650KB를 넘으면 같은 문서 아래 parts 하위 컬렉션에 나눠 저장합니다.
  // (Firestore 문서 하나의 한도는 약 1MB입니다.)
  function cloudStateRef(fb) {
    return fb.dbMod.doc(fb.db, "users", authUser.uid, "planner", "state");
  }
  function cloudPartsRef(fb) {
    return fb.dbMod.collection(fb.db, "users", authUser.uid, "planner", "state", "parts");
  }
  function jsonBytes(str) {
    try { return new TextEncoder().encode(str).length; } catch (_) { return String(str).length * 2; }
  }

  function readCloudBaseline(uid) {
    try {
      const raw = localStorage.getItem(CLOUD_BASELINE_KEY);
      if (!raw) return 0;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.uid !== uid) return 0;
      return Number(parsed.updatedAt) || 0;
    } catch (_) { return 0; }
  }
  function writeCloudBaseline(updatedAt) {
    if (!authUser) return;
    try { localStorage.setItem(CLOUD_BASELINE_KEY, JSON.stringify({ uid: authUser.uid, updatedAt: Number(updatedAt) || 0 })); } catch (_) {}
  }

  function cloudErrorText(err) {
    const code = String((err && err.code) || "");
    const raw = String((err && err.message) || err || "");
    if (code === "state-too-large") return "기록이 너무 커서(8MB 초과) 계정에 저장하지 못했습니다. 기록은 이 기기에 저장되어 있습니다. 설정에서 사진을 줄여 주세요.";
    if (code.includes("permission-denied")) return "Firestore 보안 규칙에 막혀 계정에 저장하지 못했습니다. Firebase 콘솔의 Firestore 규칙에서 로그인한 본인만 읽고 쓸 수 있게 허용해 주세요.";
    if (code.includes("failed-precondition") || /firestore.*(not|disabled|enable)|database.*(not|missing)/i.test(raw)) return "Firestore가 아직 준비되지 않았습니다. Firebase 콘솔에서 Firestore 데이터베이스를 만들어 주세요.";
    if (code.includes("unavailable") || code.includes("network") || /offline/i.test(raw)) return "동기화 서버에 연결하지 못했습니다. 네트워크를 확인해 주세요. 기록은 이 기기에 저장되어 있습니다.";
    if (code.includes("resource-exhausted") || /quota/i.test(raw)) return "Firebase 사용량 한도에 닿아 동기화하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    if (code.includes("unauthenticated")) return "로그인 세션이 만료되었습니다. 다시 로그인해 주세요.";
    if (code.includes("invalid-argument") || /maximum|too large/i.test(raw)) return "기록이 Firestore 문서 한도를 넘어 저장하지 못했습니다. 기록은 이 기기에 저장되어 있습니다.";
    return "계정에 저장하지 못했습니다. 기록은 이 기기에 저장되어 있습니다.";
  }

  function notifyCloudError(err) {
    const code = String((err && err.code) || (err && err.message) || "unknown");
    const now = Date.now();
    if (code === lastCloudErrorCode && now - lastCloudErrorAt < 60000) return;
    lastCloudErrorCode = code;
    lastCloudErrorAt = now;
    showToast(cloudErrorText(err), "warn", 7000);
    refreshSettingsIfOpen();
  }

  async function writeCloudState(fb, serialized) {
    const { dbMod } = fb;
    const bytes = jsonBytes(serialized);
    if (bytes > CLOUD_MAX_BYTES) {
      const err = new Error("state too large");
      err.code = "state-too-large";
      throw err;
    }
    const stateRef = cloudStateRef(fb);
    const partsRef = cloudPartsRef(fb);
    const stamp = Date.now();
    if (bytes <= CLOUD_SINGLE_DOC_BYTES) {
      await dbMod.setDoc(stateRef, { schema: 2, state: JSON.parse(serialized), bytes, updatedAt: stamp, appVersion: APP_VERSION });
      const old = await dbMod.getDocs(partsRef);
      if (!old.empty) await Promise.all(old.docs.map(d => dbMod.deleteDoc(d.ref)));
    } else {
      const parts = [];
      for (let i = 0; i < serialized.length; i += CLOUD_CHUNK_CHARS) parts.push(serialized.slice(i, i + CLOUD_CHUNK_CHARS));
      await Promise.all(parts.map((chunk, i) => dbMod.setDoc(dbMod.doc(partsRef, "p" + i), { i, data: chunk, updatedAt: stamp })));
      await dbMod.setDoc(stateRef, { schema: 2, parts: parts.length, bytes, updatedAt: stamp, appVersion: APP_VERSION });
      const old = await dbMod.getDocs(partsRef);
      const stale = old.docs.filter(d => {
        const n = Number(String(d.id).replace(/^p/, ""));
        return !(Number.isFinite(n) && n >= 0 && n < parts.length);
      });
      if (stale.length) await Promise.all(stale.map(d => dbMod.deleteDoc(d.ref)));
    }
    cloudBytes = bytes;
    lastCloudAt = new Date();
    writeCloudBaseline(stamp);
  }

  async function readCloudState(fb) {
    const { dbMod } = fb;
    const snap = await dbMod.getDoc(cloudStateRef(fb));
    if (!snap.exists()) return { state: null, updatedAt: 0, bytes: 0 };
    const data = snap.data() || {};
    if (data.state && typeof data.state === "object") {
      return { state: data.state, updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || 0 };
    }
    const partCount = Number(data.parts) || 0;
    if (partCount <= 0) return { state: null, updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || 0 };
    const shots = await dbMod.getDocs(cloudPartsRef(fb));
    const list = shots.docs.map(d => {
      const row = d.data() || {};
      const num = Number(row.i);
      return {
        i: Number.isFinite(num) ? num : Number(String(d.id).replace(/^p/, "")),
        data: String(row.data || "")
      };
    }).sort((a, b) => a.i - b.i);
    const json = list.map(x => x.data).join("");
    if (!json) return { state: null, updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || 0 };
    return { state: JSON.parse(json), updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || jsonBytes(json) };
  }

  // 저장은 1.5초 쉬었다가 한 번에 (글자를 칭 때마다 Firestore를 두드리지 않게)
  function scheduleCloudPush(delay = 1500) {
    if (!isFirebaseConfigured() || !authUser) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(() => { cloudTimer = null; pushCloudState(); }, delay);
  }

  async function pushCloudState() {
    if (!isFirebaseConfigured() || !authUser) return false;
    if (cloudSyncing) { cloudPending = true; return false; }
    clearTimeout(cloudTimer);
    cloudTimer = null;
    cloudSyncing = true;
    let ok = false;
    try {
      const fb = await getFirebase();
      if (!fb) return false;
      const serialized = JSON.stringify(state);
      if (serialized === lastPushedSerialized) {
        lastCloudAt = new Date();
        return true;
      }
      await writeCloudState(fb, serialized);
      lastPushedSerialized = serialized;
      lastCloudErrorCode = "";
      ok = true;
      refreshSettingsIfOpen();
    } catch (err) {
      notifyCloudError(err);
    } finally {
      cloudSyncing = false;
      if (cloudPending) { cloudPending = false; scheduleCloudPush(800); }
    }
    return ok;
  }

  // ---------- 기기 기록과 계정 기록 합치기 ----------
  function cleanUndefined(value) {
    if (Array.isArray(value)) return value.map(cleanUndefined);
    if (value && typeof value === "object") {
      const out = {};
      Object.keys(value).forEach(k => { if (value[k] !== undefined) out[k] = cleanUndefined(value[k]); });
      return out;
    }
    return value;
  }

  function isEmptyText(v) {
    return !String(v == null ? "" : v).trim();
  }

  function mergeImageLists(a, b) {
    const out = [];
    [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])].forEach(src => {
      if (!src) return;
      const exists = out.some(x => (typeof src === "string" ? x === src : JSON.stringify(x) === JSON.stringify(src)));
      if (!exists) out.push(src);
    });
    return out;
  }

  function mergeLogEntry(localLog, cloudLog) {
    const l = (localLog && typeof localLog === "object") ? localLog : {};
    const c = (cloudLog && typeof cloudLog === "object") ? cloudLog : {};
    const out = { ...c, ...l };
    ["oneLine", "diary", "memo", "text", "mood"].forEach(k => {
      if (k in c && isEmptyText(l[k]) && !isEmptyText(c[k])) out[k] = c[k];
    });
    const images = mergeImageLists(normalizeImages(l), normalizeImages(c));
    if (images.length) out.images = images;
    // 하루 페이지 사진(log.photos)도 양쪽 기록을 합친다
    const photos = mergeImageLists(Array.isArray(l.photos) ? l.photos : [], Array.isArray(c.photos) ? c.photos : []);
    if (photos.length) out.photos = photos;
    return cleanUndefined(out);
  }

  // 같은 id는 이 기기 내용을 기준으로 하고, 계정 쪽에만 있는 항목은 더합니다.
  function mergeItemLists(localList, cloudList) {
    const out = [];
    const index = new Map();
    (Array.isArray(localList) ? localList : []).forEach(item => {
      if (!item || !item.id || index.has(item.id)) return;
      index.set(item.id, out.length);
      out.push({ ...item });
    });
    let added = 0;
    (Array.isArray(cloudList) ? cloudList : []).forEach(item => {
      if (!item || !item.id) return;
      const at = index.get(item.id);
      if (at === undefined) {
        index.set(item.id, out.length);
        out.push({ ...item });
        added += 1;
        return;
      }
      const local = out[at];
      const merged = { ...item, ...local };
      Object.keys(item).forEach(k => {
        if (k === "images") return;
        // 제목·부제목은 빈 값도 사용자가 지운 결과로 본다 (구름 값으로 되살리지 않음)
        if (k === "title" || k === "subtitle" || k === "subject") return;
        const cur = merged[k];
        const emptyCur = cur === undefined || cur === null || cur === "" || (Array.isArray(cur) && !cur.length);
        if (emptyCur && item[k] !== undefined && item[k] !== null && item[k] !== "") merged[k] = item[k];
      });
      const images = mergeImageLists(normalizeImages(local), normalizeImages(item));
      if (images.length) merged.images = images;
      out[at] = merged;
    });
    return { list: out, added };
  }

  function mergeCategoryList(localList, cloudList, fallbackIcon) {
    const out = normalizeCategoryList(localList, fallbackIcon);
    const names = new Set(out.map(c => c.name));
    normalizeCategoryList(cloudList, fallbackIcon).forEach(c => {
      if (!names.has(c.name)) { names.add(c.name); out.push(c); }
    });
    return out;
  }

  // 연도 책은 id가 아니라 year로 구분합니다.
  function mergeYearBookList(localList, cloudList) {
    const out = normalizeYearBooks(localList);
    const years = new Set(out.map(b => Number(b.year)));
    normalizeYearBooks(cloudList).forEach(b => {
      if (years.has(Number(b.year))) return;
      years.add(Number(b.year));
      out.push(b);
    });
    return out.sort((a, b) => a.year - b.year);
  }

  function mergeStates(localState, cloudState) {
    const local = normalizeState(localState);
    const cloud = normalizeState(cloudState);
    const stats = { logsAdded: 0, itemsAdded: 0 };
    const merged = { ...local };

    const localLogs = local.logs || {};
    const cloudLogs = cloud.logs || {};
    const logs = {};
    const dates = new Set([...Object.keys(cloudLogs), ...Object.keys(localLogs)]);
    dates.forEach(date => {
      const l = localLogs[date];
      const c = cloudLogs[date];
      if (!l) {
        logs[date] = c;
        if (!DEFAULT_LOG_DATES.has(date)) stats.logsAdded += 1;
        return;
      }
      logs[date] = c ? mergeLogEntry(l, c) : l;
    });
    merged.logs = logs;

    ["goals", "buckets", "archives", "todos", "books"].forEach(key => {
      const res = mergeItemLists(local[key], cloud[key]);
      merged[key] = res.list;
      stats.itemsAdded += res.added;
    });
    merged.yearBooks = mergeYearBookList(local.yearBooks, cloud.yearBooks);
    merged.topics = mergeCategoryList(local.topics, cloud.topics, "target");
    merged.archiveCategories = mergeCategoryList(local.archiveCategories, cloud.archiveCategories, "folder");
    merged.bucketCategories = mergeCategoryList(local.bucketCategories, cloud.bucketCategories, "star");
    merged.booksSeeded = Boolean(local.booksSeeded || cloud.booksSeeded);
    return { state: cleanUndefined(normalizeState(merged)), stats };
  }

  async function adoptCloudState(manual = false) {
    if (cloudAdopting) return;
    cloudAdopting = true;
    try {
      await adoptCloudStateInner(manual);
    } finally {
      cloudAdopting = false;
    }
  }

  async function adoptCloudStateInner(manual = false) {
    if (!isFirebaseConfigured() || !authUser) return;
    let cloud;
    try {
      const fb = await getFirebase();
      if (!fb) return;
      cloud = await readCloudState(fb);
    } catch (err) {
      notifyCloudError(err);
      return;
    }
    const localUntouched = isUntouchedNewDefault(state);

    // 계정이 비어 있으면 이 기기 기록을 그대로 올립니다.
    if (!cloud.state) {
      lastPushedSerialized = "";
      const ok = await pushCloudState();
      if (ok && !localUntouched) showToast("이 기기의 기록을 계정에 처음 올렸습니다.", "ok", 4000);
      return;
    }

    // 이 기기가 예시 그대로면 계정 기록을 그대로 불러옵니다.
    if (localUntouched) {
      state = normalizeState(cloud.state);
      saveState({ skipCloud: true });
      lastPushedSerialized = JSON.stringify(state);
      cloudBytes = cloud.bytes || jsonBytes(lastPushedSerialized);
      lastCloudAt = new Date();
      writeCloudBaseline(cloud.updatedAt);
      render();
      refreshSettingsIfOpen();
      if (manual) showToast("계정에 저장된 기록을 불러왔습니다.", "ok", 4000);
      return;
    }

    const localCanon = stableStringify(state);
    const cloudCanon = stableStringify(cloud.state);

    // 이 기기가 마지막으로 맞춘 뒤 계정 쪽이 변하지 않았다면, 이 기기 기록이 기준입니다.
    // (기기에서 지운 항목이 계정 때문에 되살아나지 않게)
    const baseline = readCloudBaseline(authUser.uid);
    const cloudChanged = Number(cloud.updatedAt) > baseline;

    if (localCanon === cloudCanon) {
      lastPushedSerialized = JSON.stringify(state);
      lastCloudAt = new Date();
      cloudBytes = cloud.bytes || jsonBytes(localCanon);
      writeCloudBaseline(cloud.updatedAt);
      refreshSettingsIfOpen();
      if (manual) showToast("계정과 이미 같은 기록입니다.", "info", 2800);
      return;
    }

    if (!cloudChanged) {
      const ok = await pushCloudState();
      if (manual && ok) showToast("이 기기의 기록을 계정에 올렸습니다.", "ok", 3500);
      return;
    }

    // 양쪽 모두에 기록이 있고 계정 쪽이 새로 바뀌었을 때만 안전하게 합칩니다.
    const result = mergeStates(state, cloud.state);
    state = result.state;
    saveState({ skipCloud: true });
    const mergedCanon = stableStringify(state);

    if (mergedCanon === cloudCanon) {
      lastPushedSerialized = JSON.stringify(state);
      cloudBytes = cloud.bytes || jsonBytes(mergedCanon);
      lastCloudAt = new Date();
      writeCloudBaseline(cloud.updatedAt);
      render();
      refreshSettingsIfOpen();
      if (manual) showToast("계정 기록과 같아졌습니다.", "ok", 3000);
      return;
    }

    lastPushedSerialized = "";
    render();
    const ok = await pushCloudState();
    const bits = [];
    if (result.stats.logsAdded) bits.push(`일기 ${result.stats.logsAdded}일`);
    if (result.stats.itemsAdded) bits.push(`항목 ${result.stats.itemsAdded}개`);
    if (ok) {
      showToast(bits.length
        ? `이 기기 기록과 계정 기록을 합쳤습니다 (${bits.join(" · ")} 추가).`
        : "이 기기 기록과 계정 기록을 합쳐 저장했습니다.", "ok", 5000);
    }
  }

  async function syncAccountNow() {
    if (!authUser) { openAuthScreen(); return; }
    await adoptCloudState(true);
  }

  // Firebase Authentication이 아직 시작되지 않은 프로젝트인지 미리 확인합니다.
  async function probeAuthConfig() {
    if (!isFirebaseConfigured()) return "unknown";
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => { try { ctrl.abort(); } catch (_) {} }, 5000);
      const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${encodeURIComponent(FIREBASE_CONFIG.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier: "probe@example.com", continueUri: location.origin + location.pathname }),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      const data = await res.json().catch(() => null);
      const message = String((data && data.error && data.error.message) || "");
      if (message === "CONFIGURATION_NOT_FOUND") return "not-configured";
      return "ok";
    } catch (_) {
      return "unknown";
    }
  }

  async function bootstrapAuth() {
    if (!isFirebaseConfigured()) return;
    // Firebase Authentication이 준비되지 않은 프로젝트라면 SDK(수백 KB)를 내려받지 않고
    // 첫 화면에서 바로 안내합니다. 준비되어 있으면 그때 SDK를 불러와 로그인 상태를 확인합니다.
    authConfigState = await probeAuthConfig();
    if (authConfigState === "not-configured") {
      if (!hasChosenLocalMode() && !hasSkippedAuthPrompt()) {
        openAuthScreen();
        return;
      }
      if (!authStartupNoticeShown) {
        authStartupNoticeShown = true;
        showToast("Firebase 로그인 설정이 아직 완료되지 않았습니다. Firebase 콘솔 → Authentication에서 시작해 주세요.", "warn", 6500);
      }
      return;
    }
    let fb = null;
    try {
      fb = await getFirebase();
    } catch (err) {
      console.warn("[planner] Firebase 모듈을 불러오지 못했습니다", err);
      return;
    }
    if (!fb) return;
    try {
      if (fb.authMod.authStateReady) {
        await Promise.race([
          fb.authMod.authStateReady(fb.auth),
          new Promise(resolve => setTimeout(resolve, 5000))
        ]);
      }
    } catch (err) {
      if (err && String(err.code || "").includes("configuration")) authConfigState = "not-configured";
    }

    if (authUser) return;
    if (authConfigState === "not-configured") {
      if (!hasChosenLocalMode() && !hasSkippedAuthPrompt()) {
        openAuthScreen();
        return;
      }
      if (!authStartupNoticeShown) {
        authStartupNoticeShown = true;
        showToast("Firebase 로그인 설정이 아직 완료되지 않았습니다. Firebase 콘솔 → Authentication에서 시작해 주세요.", "warn", 6500);
      }
      return;
    }
    if (!hasChosenLocalMode() && !hasSkippedAuthPrompt()) openAuthScreen();
  }

  function renderSettingsBody() {
    const body = document.getElementById("settingsBody");
    if (!body) return;
    const usage = getStorageUsage();
