  // ---------- 공통 검색 ----------
  function openSearch() {
    searchOpen = true;
    render();
    const inp = document.getElementById("globalSearchInput");
    if (inp) {
      inp.focus({ preventScroll: true });
      const len = inp.value.length;
      try { inp.setSelectionRange(len, len); } catch (_) {}
    }
  }

  function closeSearch() {
    searchOpen = false;
    searchQuery = "";
    render();
  }

  function updateSearchQuery(val) {
    searchQuery = val;
    const host = document.getElementById("searchResultsHost");
    if (host) host.innerHTML = renderSearchResults();
  }

  function findSearchResults(q) {
    const term = String(q || "").trim().toLowerCase();
    if (!term) return [];
    const results = [];
    const hits = text => String(text || "").toLowerCase().includes(term);

    Object.entries(state.logs || {}).forEach(([dateStr, log]) => {
      const one = String(log && log.oneLine || "");
      const diary = String(log && log.diary || "");
      if (hits(one) || hits(diary)) {
        const snippet = hits(one) ? one : diary.replace(/\s+/g, " ").slice(0, 90);
        results.push({
          type: "기록 · 일기",
          title: one || `${dateStr} 일기`,
          sub: `${dottedDate(dateStr)} · ${snippet}`,
          action: () => selectDate(dateStr, true)
        });
      }
    });

    (state.goals || []).forEach(g => {
      if (hits(g.title) || hits(g.topic) || hits(g.note)) {
        results.push({
          type: "목표",
          title: String(g.title || ""),
          sub: `${g.topic || ""} · ${normalizeYear(g.year)}년 ${normalizePeriod(g.period)}`,
          action: () => focusGoalItem(g.id)
        });
      }
    });

    (state.buckets || []).forEach(b => {
      if (hits(b.title) || hits(b.note) || hits(b.category)) {
        results.push({
          type: "버킷리스트",
          title: String(b.title || ""),
          sub: `${b.category || ""}${b.note ? ` · ${b.note}` : ""}`,
          action: () => focusGoalItem(b.id)
        });
      }
    });

    (state.archives || []).forEach(a => {
      if (hits(a.title) || hits(a.subtitle) || hits(a.note) || hits(a.category)) {
        results.push({
          type: `아카이브 · ${a.category || ""}`,
          title: String(a.title || ""),
          sub: `${humanDateRange(itemDateFrom(a), itemDateTo(a))}${a.subtitle ? ` · ${a.subtitle}` : ""}`,
          action: () => {
            state.activeTab = "archive";
            yearDayDate = "";
            if (a.bookId) {
              notebookBookId = a.bookId;
              state.shelfSelectedBookId = a.bookId;
              const recs = bookArchives(a.bookId);
              notebookPageIndex = Math.max(0, recs.findIndex(r => r.id === a.id));
              notebookMobileSide = "left";
            } else {
              notebookBookId = "";
            }
            saveState();
            render();
          }
        });
      }
    });

    (state.todos || []).forEach(t => {
      if (hits(t.title)) {
        results.push({
          type: "할일",
          title: String(t.title || ""),
          sub: t.date || "",
          action: () => selectDate(t.date, true)
        });
      }
    });

    return results;
  }

  function renderSearchResults() {
    const term = searchQuery.trim();
    if (!term) {
      return "";
    }
    const list = findSearchResults(term);
    currentSearchList = list;
    if (!list.length) {
      return `<p class="search-empty">“${escapeHtml(term)}”와 일치하는 기록이 없습니다.</p>`;
    }
    return `
      <div class="search-count"><span>“${escapeHtml(term)}” 검색 결과</span><span>${list.length}건</span></div>
      <div class="search-result-list">
        ${list.map((item, i) => `
          <div class="search-result-item" onclick="runSearchAction(${i})">
            <div style="min-width:0;">
              <span class="pill">${escapeHtml(item.type)}</span>
              <strong style="font-size:13px; margin-left:4px;">${escapeHtml(item.title)}</strong>
              <div class="item-meta">${escapeHtml(item.sub)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderSearchArea() {
    if (!searchOpen) return "";
    return `
      <div class="search-drawer" role="search">
        <div class="search-drawer-bar">
          <span class="sd-icon">${ICONS.search}</span>
          <input type="text" id="globalSearchInput" class="sd-input" placeholder="검색" value="${escapeAttr(searchQuery)}" oninput="updateSearchQuery(this.value)" aria-label="전체 검색" />
          <button class="sd-close" onclick="closeSearch()" title="검색 닫기" aria-label="검색 닫기">${ICONS.close}</button>
        </div>
        <div id="searchResultsHost">${renderSearchResults()}</div>
      </div>
    `;
  }

  function runSearchAction(idx) {
    const item = currentSearchList[idx];
    if (!item || typeof item.action !== "function") return;
    searchOpen = false;
    searchQuery = "";
    item.action();
  }

  // 탭별 공통 헤더 정보
  const TAB_META = {
    year: { label: "Calendar", icon: "year", accent: "#93a6cb" },
    goals: { label: "Goals", icon: "goals", accent: "#9cc6ab" },
    bucket: { label: "Goals", icon: "goals", accent: "#9cc6ab" },
    archive: { label: "Archive", icon: "archive", accent: "#b4a6d6" }
  };

  function cloudStatusInfo() {
    if (!isFirebaseConfigured()) return { cls: "", label: "로컬 저장" };
    if (authBusy) return { cls: "is-syncing", label: "동기화 확인 중" };
    if (!authUser) return { cls: "", label: "로컬 저장 · 로그인하면 동기화" };
    if (lastCloudErrorCode) return { cls: "is-error", label: "동기화 오류 · 설정에서 확인" };
    if (cloudSyncing) return { cls: "is-syncing", label: "클라우드로 저장 중" };
    return { cls: "is-on", label: lastCloudAt ? `클라우드 동기화됨 · ${timeStr(lastCloudAt)}` : "클라우드 로그인됨" };
  }

  function refreshSyncDot() {
    const dot = document.getElementById("ahSyncDot");
    if (!dot) return;
    const info = cloudStatusInfo();
    dot.className = `ah-status ${info.cls}`.trim();
    dot.title = info.label;
    dot.setAttribute("aria-label", info.label);
  }

  function renderAppHeader() {
    const tab = normalizeTab(state.activeTab);
    const meta = TAB_META[tab] || TAB_META.year;
    const status = cloudStatusInfo();
    return `
      <div class="ah-inner" style="--ah-accent:${meta.accent}">
        <div class="ah-left">
          <span class="ah-brand">Archive Planner</span>
          <span class="ah-sep"></span>
          <span class="ah-tab">${ICONS[meta.icon]}${meta.label}</span>
        </div>
        <div class="ah-right">
          <button class="ah-btn ${searchOpen ? "on" : ""}" onclick="openSearch()" title="전체 검색" aria-label="전체 검색">${ICONS.search}</button>
          <button class="ah-btn ah-btn--gear" onclick="openSettings()" title="설정 · 데이터 관리" aria-label="설정">${ICONS.settings}<span class="ah-status ${status.cls}" id="ahSyncDot" role="img" aria-label="${escapeAttr(status.label)}" title="${escapeAttr(status.label)}"></span></button>
        </div>
      </div>
    `;
  }

  function updateNavUI() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
    });
    const label = document.getElementById("sidebarDateLabel");
    if (label) label.textContent = `오늘 ${TODAY_STR}`;
  }

  function render() {
    if (diaryPending) flushDiaryDraft();
    state.activeTab = normalizeTab(state.activeTab);
    updateNavUI();
    const hdr = document.getElementById("appHeader");
    if (hdr) hdr.innerHTML = renderAppHeader();
    const sHost = document.getElementById("searchPanelHost");
    if (sHost) sHost.innerHTML = renderSearchArea();
    const main = document.getElementById("mainView");
    let bodyHtml = "";
    if (state.activeTab === "year") bodyHtml = renderYearView();
    else if (state.activeTab === "goals") bodyHtml = renderGoalBookView();
    else if (state.activeTab === "archive") bodyHtml = renderArchiveView();
    else bodyHtml = renderYearView();

    main.innerHTML = bodyHtml;
    syncCarousels();
    scrollActiveIndexTab();
    applyPendingTurnAnimation();
    bindNotebookGestures();
    bindShelfCarousels();
  }

  // 주제가 많아 인덱스 탭이 책 높이를 넘으면 탭 영역만 스크롤되고, 지금 주제 탭이 보 이게 맞춘다
  function scrollActiveIndexTab() {
    const tabs = document.querySelector(".idx-tabs");
    if (!tabs || tabs.scrollHeight <= tabs.clientHeight + 1) return;
    const active = tabs.querySelector(".idx-tab.is-active");
    if (!active) return;
    const tr = tabs.getBoundingClientRect();
    const ar = active.getBoundingClientRect();
    if (ar.top < tr.top) tabs.scrollTop += ar.top - tr.top - 4;
    else if (ar.bottom > tr.bottom) tabs.scrollTop += ar.bottom - tr.bottom + 4;
  }

  function archiveOnDay(a, dateStr) {
    if (!a || !dateStr) return false;
    if (dateModeOf(a) === "none") return false;
    const from = itemDateFrom(a);
    const to = itemDateTo(a);
    if (from && to) return dateStr >= from && dateStr <= to;
    // 시작일만/종료일만 있는 기록은 그 하루에만 표시한다
    if (from) return dateStr === from;
    if (to) return dateStr === to;
    return false;
  }

  function getDayMeta(dateStr) {
    const log = state.logs[dateStr] || {};
    const hasDiary = Boolean(log.diary && log.diary.trim());
    const hasAchieved =
      state.goals.some(g => g.done && g.doneDate === dateStr) ||
      state.buckets.some(b => b.done && b.doneDate === dateStr);
    const hasArchive = (state.archives || []).some(a => archiveOnDay(a, dateStr));
    const hasTodo = state.todos.some(t => t.date === dateStr);
    const hasPhoto = normalizePhotos(log).length > 0;
    const hasAny = Boolean(log.oneLine || hasDiary || hasPhoto || log.mood || hasAchieved || hasArchive);
    return { log, hasDiary, hasAchieved, hasArchive, hasTodo, hasPhoto, hasAny };
  }

  // 1년 연력 뷰 (달별 모아보기는 '기록 있는 날만' 고정)
  // ---------- 1년 연력: 연도별 책장 + 12개월 스프링 노트 ----------
  let yearShelfIndex = 0;
  let yearBookYear = 0;   // 0이면 책장 화면
  let yearPageIndex = 0;  // 0 ~ 11 (1월 ~ 12월)
  let yearDayDate = "";   // 값이 있으면 그 날짜의 하루 페이지
  let yearMobileSide = "left";
  // v3.4: 하루 페이지는 [일기] → (사진) → Goals·Archive 로 여러 장이 될 수 있다 (스프레드 단위로 넘김)
  let yearDaySpread = 0;

  // 선택된 책이 항상 가운데, 양옆에 이전/다음 책이 대칭으로 보이는 링(window)
  function shelfRing(n, active, radius) {
    if (!n) return [];
    const span = radius * 2 + 1;
    const out = [];
    if (n <= span) {
      for (let b = 0; b < n; b++) {
        let rel = ((b - active) % n + n) % n;
        if (rel > n / 2) rel -= n;
        out.push({ index: b, vindex: active + rel });
      }
      return out.sort((a, b) => a.vindex - b.vindex);
    }
    for (let k = -radius; k <= radius; k++) {
      const vindex = active + k;
      out.push({ index: ((vindex % n) + n) % n, vindex });
    }
    return out;
  }

  function shelfRadius() {
    return 3;
  }

  // ---------- 책장 3D 캐러셀 ----------
  let carouselRaf = 0;

  function carouselMetrics(kind) {
    const el = document.querySelector(`[data-shelf="${kind}"]`);
    const cover = el ? el.querySelector(".nb-cover-btn") : null;
    const w = cover ? cover.offsetWidth : (isMobileViewport() ? 190 : 176);
    const gap = isMobileViewport() ? 8 : 12;
    return { el, step: Math.max(104, w * 0.8 + gap * 0.7) };
  }

  function applyCarouselTransforms(el, pos, step) {
    if (!el) return;
    el.querySelectorAll(".nb-cover-btn").forEach(btn => {
      const vi = Number(btn.dataset.vindex);
      if (!Number.isFinite(vi)) return;
      const rel = vi - pos;
      const abs = Math.abs(rel);
      const scale = Math.max(0.6, 1 - 0.15 * abs);
      const rot = Math.max(-48, Math.min(48, -rel * 30));
      const x = rel * step;
      const y = abs * 6;
      btn.style.transform = `translate(-50%, -50%) translateX(${x.toFixed(2)}px) translateY(${y.toFixed(2)}px) rotateY(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
      btn.style.opacity = String(abs > 3.15 ? 0 : Math.max(0.22, 1 - 0.22 * abs));
      btn.style.filter = abs < 0.04
        ? "none"
        : `brightness(${(1 - Math.min(0.4, abs * 0.14)).toFixed(3)}) saturate(${(1 - Math.min(0.26, abs * 0.08)).toFixed(3)})`;
      btn.style.zIndex = String(200 - Math.round(abs * 20));
      btn.classList.toggle("is-active", abs < 0.5);
    });
  }

  function syncCarousels() {
    const y = document.querySelector('[data-shelf="year"]');
    if (y) applyCarouselTransforms(y, yearShelfIndex, carouselMetrics("year").step);
    const a = document.querySelector('[data-shelf="archive"]');
    if (a) applyCarouselTransforms(a, notebookShelfIndex, carouselMetrics("archive").step);
  }

  function shelfAnimate(kind, from, to, after) {
    const { el, step } = carouselMetrics(kind);
    if (!el || prefersReducedMotion() || Math.abs(to - from) < 0.001) {
      if (after) after();
      return;
    }
    cancelAnimationFrame(carouselRaf);
    const dur = 430;
    const t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    const frame = now => {
      const t = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      applyCarouselTransforms(el, from + (to - from) * e, step);
      if (t < 1) carouselRaf = requestAnimationFrame(frame);
      else if (after) after();
    };
    carouselRaf = requestAnimationFrame(frame);
  }

  // 표지 탭: 가운데(선택된) 책은 바로 펼치고, 옆 책은 그 책으로 이동
  let shelfTapLock = 0;
  function shelfCoverTap(kind, btn) {
    if (!btn) return;
    if (Date.now() - shelfTapLock < 420) return;
    shelfTapLock = Date.now();
    const vi = Number(btn.dataset.vindex);
    const idx = Number(btn.dataset.index);
    const active = kind === "year" ? yearShelfIndex : notebookShelfIndex;
    if (Number.isFinite(vi) && Math.abs(vi - active) < 0.5) {
      if (kind === "year") openYearBook(Number(btn.dataset.year));
      else openNotebook(String(btn.dataset.bookId || ""));
      return;
    }
    if (!Number.isFinite(idx) || !Number.isFinite(vi)) return;
    shelfAnimate(kind, active, vi, () => {
      if (kind === "year") {
        yearShelfIndex = idx;
      } else {
        notebookShelfIndex = idx;
        const books = getBooks();
        if (books[idx]) state.shelfSelectedBookId = books[idx].id;
        saveState();
      }
      render();
    });
  }

  // 책장: 좌우로 끌면 손끝을 따라 책이 돌아가고, 놓으면 가까운 책으로 붙음
  // 손가락이 16px 안에서 흔들린 짧은 탭은 드래그가 아니라 '표지 누르기'로 본다 (iOS Safari)
  function bindShelfCarousels() {
    document.querySelectorAll(".nb-carousel").forEach(el => {
      if (el.dataset.bound === "1") return;
      el.dataset.bound = "1";
      const kind = el.dataset.shelf === "year" ? "year" : "archive";
      const countOf = () => (kind === "year" ? getYearBooks().length : getBooks().length);
      const activeOf = () => (kind === "year" ? yearShelfIndex : notebookShelfIndex);
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let lastX = 0;
      let lastY = 0;
      let base = 0;
      let pos = 0;
      let moved = 0;

      const TAP_SLOP = 16; // 손가락이 이만큼 안에서 흔들리면 탭
      const stepPx = () => carouselMetrics(kind).step;
      const paint = p => applyCarouselTransforms(el, p, stepPx());
      const clamp = p => {
        const a = activeOf();
        return Math.max(a - 0.94, Math.min(a + 0.94, p));
      };
      const begin = (x, y) => {
        if (!countOf()) return;
        cancelAnimationFrame(carouselRaf);
        dragging = true;
        moved = 0;
        startX = x;
        startY = Number.isFinite(y) ? y : 0;
        lastX = startX;
        lastY = startY;
        base = activeOf();
        pos = base;
      };
      const move = (x, y) => {
        if (!dragging) return;
        const yy = Number.isFinite(y) ? y : lastY;
        const dx = x - startX;
        const dy = yy - startY;
        lastX = x;
        lastY = yy;
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        moved = Math.max(moved, dist);
        if (dist <= 6) return; // 미세한 떨림만으로는 책을 움직이지 않는다
        if (dist > TAP_SLOP) el.classList.add("dragging");
        pos = clamp(base - dx / stepPx());
        paint(pos);
      };
      // 손가락을 뗀 곳(x, y)에서 표지를 찾아 탭이면 바로 연다
      const end = (x, y) => {
        if (!dragging) return;
        dragging = false;
        const wasDragging = el.classList.contains("dragging");
        el.classList.remove("dragging");
        if (!wasDragging && moved <= TAP_SLOP) {
          cancelAnimationFrame(carouselRaf);
          paint(base);
          const px = Number.isFinite(x) ? x : lastX;
          const py = Number.isFinite(y) ? y : lastY;
          const hit = (px || py) ? document.elementFromPoint(px, py) : null;
          const btn = hit && hit.closest ? hit.closest(".nb-cover-btn") : null;
          if (btn) {
            el.dataset.tapAt = String(Date.now());
            shelfCoverTap(kind, btn);
          }
          return;
        }
        el.dataset.draggedAt = String(Date.now());
        const dir = Math.round(pos - base);
        if (!dir) {
          shelfAnimate(kind, pos, base, () => paint(base));
          return;
        }
        const target = base + (dir > 0 ? 1 : -1);
        shelfAnimate(kind, pos, target, () => {
          const n = countOf();
          if (!n) { render(); return; }
          const next = ((target % n) + n) % n;
          if (kind === "year") {
            yearShelfIndex = next;
          } else {
            notebookShelfIndex = next;
            const books = getBooks();
            if (books[next]) state.shelfSelectedBookId = books[next].id;
            saveState();
          }
          render();
        });
      };

      el.addEventListener("touchstart", e => {
        const t = e.touches && e.touches[0];
        if (t) begin(t.clientX, t.clientY);
      }, { passive: true });
      el.addEventListener("touchmove", e => {
        const t = e.touches && e.touches[0];
        if (t) move(t.clientX, t.clientY);
      }, { passive: true });
      el.addEventListener("touchend", e => {
        const t = (e.changedTouches && e.changedTouches[0]) || null;
        end(t ? t.clientX : undefined, t ? t.clientY : undefined);
      }, { passive: true });
      el.addEventListener("touchcancel", () => {
        if (!dragging) return;
        dragging = false;
        el.classList.remove("dragging");
        paint(base);
      }, { passive: true });

      let mouseDown = false;
      el.addEventListener("pointerdown", e => {
        if (e.pointerType !== "mouse" || e.button !== 0) return;
        mouseDown = true;
        begin(e.clientX, e.clientY);
      });
      el.addEventListener("pointermove", e => {
        if (!mouseDown) return;
        move(e.clientX, e.clientY);
      });
      window.addEventListener("pointerup", e => {
        if (!mouseDown) return;
        mouseDown = false;
        end(e.clientX, e.clientY);
      });
      // 실제로 끌고 난 뒤 따라오는 클릭만 막는다 (탭은 그대로 통과)
      el.addEventListener("click", e => {
        const at = Number(el.dataset.draggedAt || 0);
        if (el.classList.contains("dragging") || (at && Date.now() - at < 400)) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    });
  }

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function normalizeYearBooks(list) {
    const seen = new Set();
    const out = [];
    (Array.isArray(list) ? list : []).forEach((b, i) => {
      const y = Number(b && b.year);
      if (!y || y < 1900 || y > 2100 || seen.has(y)) return;
      seen.add(y);
      const customTitle = String((b && b.title) || "").trim();
      out.push({
        year: y,
        title: customTitle || String(y),
        subtitle: typeof (b && b.subtitle) === "string" ? b.subtitle : "Yearly Note",
        spine: normalizeSpineColor(b && b.spine, BOOK_SPINE_PALETTE[i % BOOK_SPINE_PALETTE.length]),
        cover: String((b && b.cover) || "")
      });
    });
    return out.sort((a, b) => a.year - b.year);
  }

  function yearBookTitle(year) {
    const entry = getYearBook(year);
    return (entry && entry.title) ? entry.title : `${Number(year)}`;
  }

  function yearBookSubtitle(year) {
    const entry = getYearBook(year);
    return entry && typeof entry.subtitle === "string" ? entry.subtitle : "Yearly Note";
  }

  function getYearBooks() {
    if (!Array.isArray(state.yearBooks) || !state.yearBooks.length) {
      state.yearBooks = normalizeYearBooks(YEARS.map((y, i) => ({ year: y, spine: BOOK_SPINE_PALETTE[i % BOOK_SPINE_PALETTE.length], cover: "" })));
    }
    return state.yearBooks;
  }

  function getYearOptions() {
    const set = new Set(YEARS.map(Number));
    getYearBooks().forEach(b => set.add(Number(b.year)));
    return Array.from(set).sort((a, b) => a - b);
  }

  function refreshHolidays() {
    try {
      HOLIDAYS = buildHolidayMap(getYearOptions());
    } catch (_) {}
  }

  function getYearBook(year) {
    const y = Number(year);
    return getYearBooks().find(b => b.year === y) || null;
  }

  function ensureYearBook(year) {
    const y = Number(year);
    if (!y || y < 1900 || y > 2100) return null;
    const found = getYearBook(y);
    if (found) return found;
    const list = getYearBooks();
    const entry = { year: y, title: String(y), subtitle: "Yearly Note", spine: BOOK_SPINE_PALETTE[list.length % BOOK_SPINE_PALETTE.length], cover: "" };
    list.push(entry);
    list.sort((a, b) => a.year - b.year);
    refreshHolidays();
    return entry;
  }

  function yearSpineColor(year) {
    const found = getYearBook(year);
    if (found && found.spine) return found.spine;
    const idx = Math.max(0, getYearOptions().indexOf(Number(year)));
    return BOOK_SPINE_PALETTE[idx % BOOK_SPINE_PALETTE.length];
  }

  function countYearDays(year) {
    let days = 0;
    for (let m = 1; m <= 12; m++) {
      const maxDay = new Date(year, m, 0).getDate();
      for (let d = 1; d <= maxDay; d++) {
        if (getDayMeta(`${year}-${pad2(m)}-${pad2(d)}`).hasAny) days += 1;
      }
    }
    return days;
  }

  function daySummaryText(dateStr, meta) {
    const one = (meta && meta.log && meta.log.oneLine) ? String(meta.log.oneLine).trim() : "";
    if (one) return one;
    const arch = (state.archives || []).find(a => archiveOnDay(a, dateStr));
    if (arch && arch.title) return arch.title;
    if (meta && meta.hasAchieved) return "목표 · 버킷 달성";
    if (meta && meta.hasDiary) return "일기 기록";
    if (meta && meta.hasPhoto) return "사진 기록";
    return "기록";
  }

  // v3.6 달력 날짜 밑 표시: 8px 아이콘은 뭉개져 보여서 작은 색 점으로 바꿨다
  function dayDotsHtml(meta) {
    const marks = [];
    if (meta && (meta.hasDiary || (meta.log && meta.log.oneLine))) marks.push("diary");
    if (meta && meta.hasAchieved) marks.push("goals");
    if (meta && meta.hasArchive) marks.push("archive");
    return marks.map(k => `<span class="nb-dot" style="background:${TAB_MARK_COLORS[k] || "#6b7280"}"></span>`).join("");
  }


  function yearGoalStats(year) {
    const y = String(year || "").slice(0, 4);
    let total = 0;
    let done = 0;
    unifiedGoalItems().forEach(e => {
      const it = e.item || {};
      const planFrom = itemDateFrom(it);
      const inYear = (e.src === "goals" && normalizeYear(it.year) === y)
        || (planFrom && planFrom.slice(0, 4) === y)
        || (it.doneDate && String(it.doneDate).slice(0, 4) === y);
      if (!inYear) return;
      total += 1;
      if (it.done) done += 1;
    });
    return { total, done };
  }

  function yearSummaryText(year) {
    const days = countYearDays(Number(year));
    const stats = yearGoalStats(year);
    return stats.total
      ? `기록 ${days}일 · 달성 ${stats.done}/${stats.total}`
      : `기록 ${days}일`;
  }

  function renderYearCover(year, isActive, vindex, index) {
    const y = Number(year);
    const days = countYearDays(y);
    const isThisYear = String(y) === TODAY_STR.slice(0, 4);
    const entry = getYearBook(y) || {};
    const title = entry.title || String(y);
    const sub = typeof entry.subtitle === "string" ? entry.subtitle : "Yearly Note";
    return `
      <button class="nb-cover-btn ${isActive ? "is-active" : ""}" data-year="${y}" data-index="${Number(index) || 0}" data-vindex="${Number(vindex) || 0}" onclick="shelfCoverTap('year', this)" aria-label="${escapeAttr(title)} 펼치기" title="${escapeAttr(title)} 펼치기">
        <span class="nb-cover nb-cover--year" style="--spine:${yearSpineColor(y)}">
          ${isThisYear ? `<span class="nb-year-now">올해</span>` : ""}
          ${entry.cover
            ? `<img class="nb-cover-photo" src="${entry.cover}" alt="" /><span class="nb-cover-plate">${escapeHtml(title)}</span>`
            : `<span class="nb-year-plate"><b>${escapeHtml(title)}</b>${sub ? `<i></i><span>${escapeHtml(sub)}</span>` : ""}</span>`}
          <span class="nb-cover-spine"></span>
          <span class="nb-cover-shine"></span>
          <span class="nb-cover-chip">${days}일</span>
        </span>
      </button>
    `;
  }

  function renderYearShelfMeta(year) {
    const y = Number(year);
    const title = yearBookTitle(y);
    const sub = yearBookSubtitle(y);
    const monthNow = String(y) === TODAY_STR.slice(0, 4) ? Number(TODAY_STR.slice(5, 7)) : 0;
    return `
      <div class="nb-book-meta">
        <h3>${escapeHtml(title)}</h3>
        ${sub ? `<div class="nb-book-sub">${escapeHtml(sub)}</div>` : ""}
        <div class="nb-book-info">${escapeHtml(yearSummaryText(y))}${monthNow ? ` · 이번 달 ${monthNow}월` : ""}</div>
      </div>
    `;
  }

  function renderYearShelfActions(year) {
    const y = Number(year);
    return `
      <button class="nb-action" onclick="openYearBookModal()"><span class="nb-action-icon">${NB_ICONS.plus}</span>책 추가</button>
      <button class="nb-action" onclick="openYearBookModal(${y})"><span class="nb-action-icon">${NB_ICONS.edit}</span>책 편집</button>
    `;
  }

  // 오늘로 바로 가기: 올해 책의 이번 달 페이지(이번 달이 없으면 하루 페이지)
  function jumpToToday() {
    flushDiaryDraft();
    openYearBook(Number(TODAY_STR.slice(0, 4)), Number(TODAY_STR.slice(5, 7)) - 1);
  }

  function renderYearShelf() {
    const yearBooks = getYearBooks();
    yearShelfIndex = Math.min(Math.max(yearShelfIndex, 0), yearBooks.length - 1);
    const activeYear = yearBooks[yearShelfIndex] ? yearBooks[yearShelfIndex].year : YEARS[0];
    return `
      <div class="nb-stage nb-stage--shelf">
        <div id="nbYearShelfMeta">${renderYearShelfMeta(activeYear)}</div>
        <div class="nb-carousel" data-shelf="year" id="nbYearShelfCarousel">${shelfRing(yearBooks.length, yearShelfIndex, shelfRadius()).map(slot => renderYearCover(yearBooks[slot.index].year, slot.vindex === yearShelfIndex, slot.vindex, slot.index)).join("")}</div>
        <div class="nb-actions" id="nbYearShelfActions">${renderYearShelfActions(activeYear)}</div>
        <div class="nb-legend-slot" aria-hidden="true"></div>
      </div>
    `;
  }
  function selectYearShelf(year) {
    const yearBooks = getYearBooks();
    const idx = yearBooks.findIndex(b => b.year === Number(year));
    if (idx < 0) return;
    yearShelfIndex = idx;
    render();
  }

  function yearShelfStep(delta) {
    const yearBooks = getYearBooks();
    if (!yearBooks.length || !delta) return;
    const from = yearShelfIndex;
    shelfAnimate("year", from, from + delta, () => {
      yearShelfIndex = ((from + delta) % yearBooks.length + yearBooks.length) % yearBooks.length;
      render();
    });
  }

  function openYearBook(year, monthIndex) {
    const y = Number(year);
    if (!y) return;
    if (!getYearBook(y)) ensureYearBook(y);
    yearShelfIndex = Math.max(0, getYearBooks().findIndex(b => b.year === y));
    yearBookYear = y;
    const isThisYear = String(y) === TODAY_STR.slice(0, 4);
    const fallbackMonth = isThisYear ? Number(TODAY_STR.slice(5, 7)) - 1 : 0;
    yearPageIndex = Number.isInteger(monthIndex) ? Math.min(11, Math.max(0, monthIndex)) : fallbackMonth;
    yearDayDate = "";
    yearMobileSide = "left";
    render();
  }

  // 그 연도 노트 안에서 하루 페이지 열기 (달력 → 일기는 책장 3D로 넘어간다)
  function applyYearDayState(dateStr, opts = {}) {
    const ds = String(dateStr || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
    state.selectedDate = ds;
    state.activeTab = "year";
    ensureYearBook(Number(ds.slice(0, 4)));
    yearBookYear = Number(ds.slice(0, 4));
    yearPageIndex = Number(ds.slice(5, 7)) - 1;
    yearDayDate = ds;
    yearMobileSide = "left";
    yearDaySpread = 0;
    // 뒤로 넘어와 이 날의 마지막 장을 마주하도록 (책의 앞장 뒷면)
    if (opts && opts.land === "last") {
      const last = daySlotCount(ds) - 1;
      yearDaySpread = Math.floor(last / 2);
      yearMobileSide = last % 2 === 0 ? "left" : "right";
    }
    saveState();
  }

  function openYearDay(dateStr, opts = {}) {
    const ds = String(dateStr || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
    flushDiaryDraft();
    const animate = !opts || opts.animate !== false;
    const spread = document.querySelector(".nb-spread");
    if (!animate || !spread || prefersReducedMotion()) {
      applyYearDayState(ds);
      render();
      return;
    }
    const forward = yearDayDate ? ds >= yearDayDate : true;
    turnToPage(forward ? 1 : -1, () => applyYearDayState(ds));
  }

  function closeYearDay() {
    flushDiaryDraft();
    if (prefersReducedMotion() || !document.querySelector(".nb-spread")) {
      yearDayDate = "";
      render();
      return;
    }
    turnToPage(-1, () => { yearDayDate = ""; });
  }

  function stepYearDay(delta) {
    if (!yearDayDate || !delta) return;
    flushDiaryDraft();
    const next = shiftDate(yearDayDate, delta);
    turnToPage(delta, () => applyYearDayState(next, { land: delta < 0 ? "last" : "first" }));
  }

  function openTodayYearBook() {
    openYearDay(TODAY_STR);
  }

  function closeYearBook() {
    yearBookYear = 0;
    yearPageIndex = 0;
    yearDayDate = "";
    render();
  }

  function openYearPage(idx, side) {
    yearPageIndex = Math.min(11, Math.max(0, Number(idx) || 0));
    yearDayDate = "";
    if (side === "right" || side === "left") yearMobileSide = side;
    render();
  }

  function yearPageStep(delta) {
    const year = Number(yearBookYear);
    const next = yearPageIndex + delta;
    // 맨 앞·맨 뒤에서는 북커버를 보여 주며 책을 덮는다
    if (next < 0 || next > 11) {
      turnToPage(delta, () => { closeYearBook(); }, {
        boundary: true,
        spine: yearSpineColor(year),
        title: yearBookTitle(year),
        sub: yearBookSubtitle(year)
      });
      return;
    }
    if (next === yearPageIndex) return;
    turnToPage(delta, () => {
      yearPageIndex = next;
      yearMobileSide = "left";
    });
  }

  // 분기 인덱스: 1·4·7·10월 페이지로 부드럽게 이동
  function yearQuarterJump(quarter) {
    const target = Math.min(11, Math.max(0, (Number(quarter) || 0) * 3));
    if (target === yearPageIndex) return;
    turnToPage(target > yearPageIndex ? 1 : -1, () => {
      yearPageIndex = target;
      yearMobileSide = "left";
    });
  }

  function setYearMobileSide(side) {
    yearMobileSide = side === "right" ? "right" : "left";
    const spread = document.getElementById("nbYearSpread");
    if (spread) spread.dataset.side = yearMobileSide;
    document.querySelectorAll("#nbYearSpread ~ .nb-side-toggle button, .nb-side-toggle button[data-year-side]").forEach(b => {
      b.classList.toggle("active", b.dataset.yearSide === yearMobileSide);
    });
  }

  function collectMonthDays(year, month) {
    const maxDay = new Date(year, month, 0).getDate();
    const out = [];
    for (let d = 1; d <= maxDay; d++) {
      const ds = `${year}-${pad2(month)}-${pad2(d)}`;
      const meta = getDayMeta(ds);
      if (!meta.hasAny) continue;
      out.push({ dateStr: ds, day: d, dow: getDayOfWeek(ds), meta });
    }
    return out;
  }

  function renderMonthCalendar(year, month) {
    const firstDow = new Date(year, month - 1, 1).getDay();
    const maxDay = new Date(year, month, 0).getDate();
    const heads = ["일", "월", "화", "수", "목", "금", "토"];
    let cells = "";
    for (let i = 0; i < firstDow; i++) cells += `<span class="nb-day nb-day--empty" aria-hidden="true"></span>`;
    for (let d = 1; d <= maxDay; d++) {
      const ds = `${year}-${pad2(month)}-${pad2(d)}`;
      const dow = getDayOfWeek(ds);
      const hol = isHoliday(ds);
      const meta = getDayMeta(ds);
      const cls = [
        "nb-day",
        dow === 0 ? "is-sun" : dow === 6 ? "is-sat" : "",
        hol ? "is-holiday" : "",
        ds === TODAY_STR ? "is-today" : "",
        meta.hasAny ? "has-rec" : ""
      ].filter(Boolean).join(" ");
      cells += `
        <button class="${cls}" onclick="openYearDay('${ds}')" title="${escapeAttr(formatDateKo(ds))}" aria-label="${escapeAttr(formatDateKo(ds))}">
          <span class="nb-day-num">${d}</span>
          <span class="nb-day-marks">${dayDotsHtml(meta)}</span>
        </button>
      `;
    }
    return `
      <div class="nb-cal">
        <div class="nb-cal-head">
          ${heads.map((h, i) => `<span class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${h}</span>`).join("")}
        </div>
        <div class="nb-cal-grid">${cells}</div>
      </div>
    `;
  }

  function renderMonthRow(item) {
    const dowNames = ["일", "월", "화", "수", "목", "금", "토"];
    return `
      <button class="nb-month-row" onclick="openYearDay('${item.dateStr}')" title="이 날의 하루 기록 열기">
        <b>${item.day}일(${dowNames[item.dow]})</b>
        <span class="txt">${escapeHtml(daySummaryText(item.dateStr, item.meta))}</span>
        <span class="marks">${dayDotsHtml(item.meta)}</span>
      </button>
    `;
  }

  function renderYearReader(year) {
    const month = Math.min(11, Math.max(0, yearPageIndex)) + 1;
    const monthRecords = collectMonthDays(year, month);
    const monthIdx = month - 1;

    const leftPage = `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner">
          <div class="nb-month-head">
            <div>
              <div class="nb-month-name">${month}월</div>
            </div>
            <span class="nb-month-badge">기록 ${monthRecords.length}일</span>
          </div>
          ${renderMonthCalendar(year, month)}
          ${paperPageNo(monthIdx * 2 + 1)}
        </div>
      </section>
    `;

    const rightPage = `
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner">
          <div class="nb-month-list-head">
            <b>${month}월의 기록</b>
            <span>${monthRecords.length}일</span>
          </div>
          ${monthRecords.length ? `
            <div class="nb-month-list">${monthRecords.map(renderMonthRow).join("")}</div>
          ` : `
            <div class="nb-month-empty">
              <p>이 달에는 아직 기록이 없습니다.</p>
            </div>
          `}
          ${paperPageNo(monthIdx * 2 + 2)}
        </div>
      </section>
    `;

    const quarter = Math.floor(monthIdx / 3);
    const yTitle = yearBookTitle(year);
    const ySub = yearBookSubtitle(year);
    const stats = yearGoalStats(year);
    const isThisYear = String(year) === TODAY_STR.slice(0, 4);
    return `
      <div class="nb-stage">
        <div class="nb-reader-head">
          <button class="nb-back" onclick="closeYearBook()">${ICONS.chevLeft}책장</button>
          <div class="nb-reader-title">
            <b>${escapeHtml(yTitle)}</b>
            <span>${ySub ? `${escapeHtml(ySub)} · ` : ""}${month}월 · 기록 ${monthRecords.length}일${stats.total ? ` · 달성 ${stats.done}/${stats.total}` : ""}</span>
          </div>
        </div>
        <div class="nb-book nb-book--indexed">
          <button class="nb-nav prev" onclick="yearPageStep(-1)" aria-label="이전 달">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="nbYearSpread" data-side="${yearMobileSide}">
            ${leftPage}
            ${rightPage}
            <span class="nb-spine"></span>
            ${BOOK_COIL}
            <div class="idx-tabs idx-tabs--quarter" role="tablist" aria-label="분기 인덱스">
              ${[0, 1, 2, 3].map(q => `
                <button class="idx-tab idx-tab--q${q + 1} ${quarter === q ? "is-active" : ""}" role="tab" aria-label="${q + 1}분기 (${q * 3 + 1}월)" aria-selected="${quarter === q ? "true" : "false"}" onclick="yearQuarterJump(${q})" title="${q + 1}분기 (${q * 3 + 1}월)">
                  <span>${stackedLabel(`${q + 1}분기`)}</span>
                </button>
              `).join("")}
            </div>
          </div>
          <button class="nb-nav next" onclick="yearPageStep(1)" aria-label="다음 달">${ICONS.chevRight}</button>
        </div>
        <div class="nb-bottom-bar">
          <span class="nb-bar-left"></span>
          <button class="nb-add-btn" onclick="openYearDay('${TODAY_STR}')" title="오늘 기록 추가" aria-label="오늘 기록 추가">${NB_ICONS.plus}</button>
          <span class="nb-bar-right"></span>
        </div>
        <div class="nb-legend-slot" aria-hidden="true"></div>
      </div>
    `;
  }

  function renderYearView() {
    const year = Number(yearBookYear);
    if (yearDayDate) return renderYearDay(yearDayDate);
    if (year >= 1900) return renderYearReader(year);
    return renderYearShelf();
  }

  // 연력 · 일기: 스프링 노트 안의 하루 페이지
  //  · 왼쪽 면 = 날짜 · 기분 · 오늘의 한 줄 · 긴 일기 · 사진 / 오른쪽 면 = Goals · Archive
  // 왼쪽(매우 안 좋음) → 오른쪽(매우 좋음) 순서. 다섯 표정은 한눈에 구분되게.
  const DAY_MOODS = [
    { key: "tired", label: "매우 안 좋음", face: `<circle cx="12" cy="12" r="9"/><path d="M8.4 8.6l2.4 2.4M10.8 8.6L8.4 11"/><path d="M15.6 8.6l2.4 2.4M18 8.6l-2.4 2.4"/><path d="M8.2 16.6a4.6 4.6 0 0 1 7.6 0"/><path d="M17.1 13.1c.7 1 .7 1.8 0 2.2-.7.4-1.5-.2-1.5-1.1 0-.7.7-1.2 1.5-2.1z"/>` },
    { key: "down", label: "안 좋음", face: `<circle cx="12" cy="12" r="9"/><path d="M8.2 10.4h2.8"/><path d="M13 10.4h2.8"/><path d="M8.8 16.1a4 4 0 0 1 6.4 0"/>` },
    { key: "soso", label: "보통", face: `<circle cx="12" cy="12" r="9"/><circle cx="9.2" cy="9.8" r=".95" fill="currentColor" stroke="none"/><circle cx="14.8" cy="9.8" r=".95" fill="currentColor" stroke="none"/><path d="M8.8 15h6.4"/>` },
    { key: "good", label: "좋음", face: `<circle cx="12" cy="12" r="9"/><circle cx="9.2" cy="9.8" r=".95" fill="currentColor" stroke="none"/><circle cx="14.8" cy="9.8" r=".95" fill="currentColor" stroke="none"/><path d="M8.6 14.2a4 4 0 0 0 6.8 0"/>` },
    { key: "great", label: "매우 좋음", face: `<circle cx="12" cy="12" r="9"/><path d="M7.6 9.6l1.7-1.8 1.7 1.8"/><path d="M13 9.6l1.7-1.8 1.7 1.8"/><path d="M7.4 13.2a5.2 5.2 0 0 0 9.2 0"/>` }
  ];

  const DAY_CAMERA = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`;
  const DAY_CHECK = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;

  function moodFaceSvg(key) {
    const md = DAY_MOODS.find(x => x.key === key) || DAY_MOODS[2];
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${md.face}</svg>`;
  }

  function normalizePhotos(log) {
    if (!log) return [];
    if (Array.isArray(log.photos)) return log.photos.filter(Boolean);
    if (Array.isArray(log.images)) return log.images.filter(Boolean);
    return [];
  }

  function dayOfYear(dateStr) {
    const parts = String(dateStr || "").split("-");
    const t = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    const start = new Date(t.getFullYear(), 0, 1);
    return Math.floor((t - start) / 86400000) + 1;
  }

  // 첨부된 사진을 대표 1장 캐러셀 없이 노트에 전부 붙인다 (1장 크게 · 2장 나란히 · 3~4장 격자 · 5장+ 3열)
  function photoBoardHtml(images, handlerFor, opts = {}) {
    const list = (Array.isArray(images) ? images : []).filter(Boolean).slice(0, 6);
    if (!list.length) return "";
    const rots = [-1.5, 1.2, 1.4, -1.3, 1.6, -1.1];
    const removable = opts.removeFn || "";
    return `
      <div class="nb-photos nb-photos--n${list.length}">
        ${list.map((src, i) => `
          <div class="nb-pola" style="--rot:${rots[i % rots.length]}deg">
            <span class="nb-pola-tape" aria-hidden="true"></span>
            <button class="nb-pola-btn" onclick="${handlerFor(i)}" aria-label="사진 ${i + 1} 크게 보기" title="사진 크게 보기">
              <img src="${src}" alt="" />
            </button>
            ${removable ? `<button class="nb-pola-del" onclick="${removable}(${i})" aria-label="사진 ${i + 1} 떼기" title="사진 떼기">${ICONS.close}</button>` : ""}
          </div>
        `).join("")}
      </div>
    `;
  }

  // 그날 달성했거나 기간이 겹치는 목표·버킷
  function dayGoalEntries(dateStr) {
    const out = [];
    (state.goals || []).forEach(g => {
      const doneOn = Boolean(g.done && g.doneDate === dateStr);
      const mode = dateModeOf(g);
      const from = itemDateFrom(g);
      const to = itemDateTo(g);
      let inRange = false;
      if (mode === "range") inRange = Boolean(from && to) && dateStr >= from && dateStr <= to;
      else if (mode === "day") inRange = Boolean(from) && dateStr === from;
      else if (mode === "from") inRange = Boolean(from) && dateStr === from;
      else if (mode === "to") inRange = Boolean(to) && dateStr === to;
      if (doneOn || inRange) out.push({ item: g, done: Boolean(g.done), doneOn, from: inRange ? from : "", to: inRange ? to : "" });
    });
    (state.buckets || []).forEach(b => {
      if (b.done && b.doneDate === dateStr) out.push({ item: b, done: true, doneOn: true, from: "", to: "" });
    });
    return out;
  }

  function renderDayGoalItem(entry) {
    const it = entry.item || {};
    const isBucket = Boolean(it.category && it.topic === undefined);
    const topic = isBucket ? it.category : it.topic;
    const iconKey = isBucket ? getBucketCatIconKey(topic) : getTopicIconKey(topic);
    const meta = [];
    if (topic) meta.push(`<span class="nb-day-pill">${renderPictogram(iconKey, 11)} ${escapeHtml(topic)}</span>`);
    if (entry.doneOn) meta.push(`<span class="nb-day-tag nb-day-tag--done">DONE</span>`);
    else if (entry.from || entry.to) meta.push(`<span class="nb-day-tag">${escapeHtml(humanDateRange(entry.from, entry.to))}</span>`);
    return `
      <div class="nb-day-item">
        <button class="nb-day-check-btn ${entry.done ? "is-done" : ""}" onclick="toggleGoalItem('${it.id}')" title="${entry.done ? "달성 취소" : "달성 표시"}" aria-label="${entry.done ? "달성 취소" : "달성 표시"}" aria-pressed="${entry.done ? "true" : "false"}">${entry.done ? DAY_CHECK : ""}</button>
        <button class="nb-day-item-main" onclick="openEditGoalItem('${it.id}')" title="눌러서 수정">
          <span class="nb-day-item-title ${entry.done ? "is-done" : ""}">${escapeHtml(it.title || "")}</span>
          ${meta.length ? `<span class="nb-day-item-meta">${meta.join("")}</span>` : ""}
        </button>
        <button class="nb-day-item-del" onclick="deleteGoalItem('${it.id}')" title="삭제" aria-label="항목 삭제">${ICONS.trash}</button>
      </div>
    `;
  }

  function renderDayArchiveItem(a) {
    const from = itemDateFrom(a);
    const to = itemDateTo(a);
    const cat = a.category || "";
    const hasPhotos = normalizeImages(a).length;
    return `
      <div class="nb-day-item">
        <button class="nb-day-check-btn is-archive" onclick="openEditArchive('${a.id}')" title="눌러서 수정" aria-label="${escapeAttr(a.title || "")} 수정">${renderPictogram(getArchiveCatIconKey(cat), 11)}</button>
        <button class="nb-day-item-main" onclick="openEditArchive('${a.id}')" title="눌러서 수정">
          <span class="nb-day-item-title">${escapeHtml(a.title || "")}</span>
          <span class="nb-day-item-meta">
            ${cat ? `<span class="nb-day-pill">${escapeHtml(cat)}</span>` : ""}
            ${(from || to) ? `<span class="nb-day-tag">${escapeHtml(humanDateRange(from, to))}</span>` : ""}
            ${hasPhotos ? `<span class="nb-day-tag">사진 ${hasPhotos}</span>` : ""}
          </span>
        </button>
        <button class="nb-day-item-del" onclick="deleteItem('archives', '${a.id}')" title="삭제" aria-label="기록 삭제">${ICONS.trash}</button>
      </div>
    `;
  }

  // ---------- 하루 책자(일기) 페이지 구성 ----------
  // 순서: ① 일기 글 → ② (사진이 있으면) 사진 모음 → ③ Goals · Archive
  // 하루 책자는 항상 짝수 면(스프레드)으로 끝나고, 남는 마지막 면은 책 뒤표지가 된다.
  const DAY_PHOTO_MAX = 5;

  function dayPageCount(dateStr) {
    const log = state.logs[dateStr] || {};
    return normalizePhotos(log).length ? 3 : 2;
  }

  function daySlotCount(dateStr) {
    const n = dayPageCount(dateStr);
    return n + (n % 2);
  }

  // 하루 안에서 지금 눈에 보이는 면 번호 (0부터)
  function dayVisibleSlot(dateStr) {
    const slots = daySlotCount(dateStr);
    const spreads = Math.max(1, Math.ceil(slots / 2));
    const spread = Math.min(Math.max(0, yearDaySpread), spreads - 1);
    const side = isMobileViewport() && yearMobileSide === "right" ? 1 : 0;
    return Math.min(slots - 1, spread * 2 + side);
  }

  // 그 해 책에서 이 날 첫 장의 페이지 번호 (사진이 있는 날은 한 장 더 붙으므로 누적)
  function dayPageNumbers(dateStr) {
    const y = Number(String(dateStr).slice(0, 4));
    const m = Number(String(dateStr).slice(5, 7));
    const d = Number(String(dateStr).slice(8, 10));
    if (!y || !m || !d) return 1;
    let n = 0;
    const last = new Date(y, m - 1, d);
    const cursor = new Date(y, 0, 1);
    while (cursor < last) {
      n += dayPageCount(`${y}-${pad2(cursor.getMonth() + 1)}-${pad2(cursor.getDate())}`);
      cursor.setDate(cursor.getDate() + 1);
    }
    return n + 1;
  }

  // 일기 사진 전용 페이지: 최대 5장을 격자에 고르게 붙인다 (3장이면 큰 1장 + 2장)
  function dayPhotoBoardHtml(images) {
    const list = (Array.isArray(images) ? images : []).filter(Boolean).slice(0, DAY_PHOTO_MAX);
    if (!list.length) return "";
    const rots = [-1.7, 1.3, 1.6, -1.4, 1.8];
    return `
      <div class="nb-dayphotos nb-dayphotos--n${list.length}">
        ${list.map((src, i) => `
          <div class="nb-pola" style="--rot:${rots[i % rots.length]}deg">
            <span class="nb-pola-tape" aria-hidden="true"></span>
            <button class="nb-pola-btn" onclick="openDayPhoto(${i})" aria-label="사진 ${i + 1} 크게 보기" title="사진 크게 보기">
              <img src="${src}" alt="" />
            </button>
            <button class="nb-pola-del" onclick="removeDayPhoto(${i})" aria-label="사진 ${i + 1} 떼기" title="사진 떼기">${ICONS.close}</button>
          </div>
        `).join("")}
      </div>
    `;
  }

  // 마지막 면: 빈 속지 대신 책 뒤표지 (책등 색·질감 통일)
  function nbBackCoverHtml(side, spine, opts = {}) {
    const color = normalizeSpineColor(spine, BOOK_SPINE_PALETTE[0]);
    const sideCls = side === "left" ? "nb-page--left" : "nb-page--right";
    return `
      <section class="nb-page ${sideCls} nb-page--backcover" style="--spine:${color}">
        <div class="nb-page-inner nb-backcover-inner">
          ${opts.title ? `<span class="nb-backcover-label">${escapeHtml(opts.title)}</span>` : ""}
          <span class="nb-backcover-mark" aria-hidden="true"></span>
          <span class="nb-backcover-sub">${escapeHtml(opts.sub || "뒤표지")}</span>
        </div>
      </section>
    `;
  }

  function renderYearDay(dateStr) {
    const d = dateStr;
    const dowNames = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = getDayOfWeek(d);
    const y = d.slice(0, 4);
    const m = Number(d.slice(5, 7));
    const day = Number(d.slice(8, 10));
    const log = state.logs[d] || {};
    const isToday = d === TODAY_STR;
    const mood = String(log.mood || "");
    const photos = normalizePhotos(log);
    const goals = dayGoalEntries(d);
    const archives = (state.archives || []).filter(a => archiveOnDay(a, d));
    const pageBase = dayPageNumbers(d);

    const diaryInner = `
      <div class="nb-page-inner nb-day-inner">
        <header class="nb-day-head">
          <div class="nb-day-date">
            <b>${dottedDate(d)}</b><em>(${dowNames[dow]})</em>
          </div>
          <div class="nb-day-moods" role="group" aria-label="오늘의 기분">
            ${DAY_MOODS.map(md => `
              <button class="nb-mood ${mood === md.key ? "is-on" : ""}" data-mood="${md.key}" onclick="setDayMood('${md.key}')" title="${md.label}" aria-label="${md.label}" aria-pressed="${mood === md.key ? "true" : "false"}">${moodFaceSvg(md.key)}</button>
            `).join("")}
          </div>
        </header>

        <div class="nb-day-field">
          <span class="nb-day-label">오늘의 한 줄</span>
          <input type="text" id="oneLineInput" class="paper-input-line nb-day-one" value="${escapeAttr(log.oneLine || "")}" oninput="onDiaryInput()" aria-label="오늘의 한 줄" />
        </div>

        <div class="nb-day-field nb-day-field--grow">
          <div class="nb-day-field-head">
            <span class="nb-day-label">일기</span>
            <label class="nb-day-photo-btn" title="사진 붙이기 (최대 ${DAY_PHOTO_MAX}장)">
              <span class="nb-day-photo-ic">${DAY_CAMERA}</span><span>사진 (${photos.length}/${DAY_PHOTO_MAX})</span>
              <input type="file" accept="image/*" multiple onchange="handleDayPhotos(event)" aria-label="일기 사진 붙이기" />
            </label>
          </div>
          <textarea class="diary-area nb-day-diary" id="diaryInput" oninput="onDiaryInput()" aria-label="일기">${escapeHtml(log.diary || "")}</textarea>
        </div>
        ${paperPageNo(pageBase)}
      </div>
    `;

    const photoInner = photos.length ? `
      <div class="nb-page-inner">
        <header class="nb-day-photos-head">
          <div>
            <span class="nb-day-label">일기 사진</span>
            <b>${dottedDate(d)}</b>
          </div>
          <div class="nb-day-photos-tools">
            <span class="nb-day-photos-count">${photos.length} / ${DAY_PHOTO_MAX}</span>
            ${photos.length < DAY_PHOTO_MAX ? `
              <label class="nb-day-photo-btn" title="사진 추가">
                <span class="nb-day-photo-ic">${DAY_CAMERA}</span><span>사진 추가</span>
                <input type="file" accept="image/*" multiple onchange="handleDayPhotos(event)" aria-label="사진 추가" />
              </label>
            ` : ""}
          </div>
        </header>
        ${dayPhotoBoardHtml(photos)}
        ${paperPageNo(pageBase + 1)}
      </div>
    ` : "";

    const goalsInner = `
      <div class="nb-page-inner">
        <div class="nb-day-block">
          <div class="nb-day-block-head">
            <b>Goals</b><span class="nb-day-block-count">${goals.length}</span>
            <button class="nb-day-add" onclick="openGoalModal('', '${d}')" title="이 날 목표 추가" aria-label="이 날 목표 추가">${NB_ICONS.plus}</button>
          </div>
          ${goals.length ? `<div class="nb-day-list">${goals.map(renderDayGoalItem).join("")}</div>` : `<p class="nb-day-empty">—</p>`}
        </div>
        <div class="nb-day-block">
          <div class="nb-day-block-head">
            <b>Archive</b><span class="nb-day-block-count">${archives.length}</span>
            <button class="nb-day-add" onclick="openNewArchiveModal('', '${d}')" title="이 날 기록 추가" aria-label="이 날 기록 추가">${NB_ICONS.plus}</button>
          </div>
          ${archives.length ? `<div class="nb-day-list">${archives.map(renderDayArchiveItem).join("")}</div>` : `<p class="nb-day-empty">—</p>`}
        </div>
        ${paperPageNo(pageBase + (photos.length ? 2 : 1))}
      </div>
    `;

    // 면 순서: 일기 → (사진) → Goals·Archive. 홀수로 끝나면 마지막 면은 뒤표지
    const slotList = [{ html: diaryInner, cls: "nb-day-page" }];
    if (photos.length) slotList.push({ html: photoInner, cls: "nb-day-photo-page" });
    slotList.push({ html: goalsInner, cls: "nb-day-side" });
    if (slotList.length % 2) slotList.push(null); // 뒤표지 자리
    const sections = slotList.map((slot, i) => {
      const side = i % 2 === 0 ? "left" : "right";
      if (!slot) return nbBackCoverHtml(side, yearSpineColor(y), { title: yearBookTitle(y), sub: "뒤표지" });
      return `<section class="nb-page nb-page--${side} ${slot.cls}">${slot.html}</section>`;
    });

    const spreadCount = Math.max(1, Math.ceil(sections.length / 2));
    yearDaySpread = Math.min(Math.max(0, yearDaySpread), spreadCount - 1);
    const leftHtml = sections[yearDaySpread * 2] || "";
    const rightHtml = sections[yearDaySpread * 2 + 1] || "";
    const shownSide = isMobileViewport() && yearMobileSide === "right" && sections[yearDaySpread * 2 + 1] ? "right" : "left";

    return `
      <div class="nb-stage">
        <div class="nb-reader-head">
          <button class="nb-back" onclick="closeYearDay()">${ICONS.chevLeft}달력</button>
          <div class="nb-reader-title">
            <b>${y}년 ${m}월 ${day}일</b>
            <span>${dowNames[dow]}요일${isToday ? " · 오늘" : ""}</span>
          </div>
          <button class="nb-head-btn ${isToday ? "is-now" : ""}" onclick="openYearDay('${TODAY_STR}')" title="오늘로" aria-label="오늘로">${NB_ICONS.calendar}<span class="nb-head-btn-label">오늘</span></button>
        </div>
        <div class="nb-book">
          <button class="nb-nav prev" onclick="dayNavStep(-1)" aria-label="이전 장">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="nbDaySpread" data-side="${shownSide}">
            ${leftHtml}
            ${rightHtml}
            <span class="nb-spine"></span>
            ${BOOK_COIL}
          </div>
          <button class="nb-nav next" onclick="dayNavStep(1)" aria-label="다음 장">${ICONS.chevRight}</button>
        </div>
        <div class="nb-bottom-bar">
          <span class="nb-bar-left"></span>
          <button class="nb-add-btn" onclick="openNewArchiveModal('', '${d}')" title="이 날 기록 추가" aria-label="이 날 기록 추가">${NB_ICONS.plus}</button>
          <span class="nb-bar-right"></span>
        </div>
        <div class="nb-legend-slot" aria-hidden="true"></div>
      </div>
    `;
  }

  // 하루 책자 안에서 한 장씩 넘기고, 마지막 장을 지나면 앞/뒤 날짜로 간다
  function dayNavStep(dir) {
    const ds = yearDayDate;
    if (!ds || !dir) return;
    flushDiaryDraft();
    if (isMobileViewport()) {
      const target = dayVisibleSlot(ds) + dir;
      if (target >= 0 && target < daySlotCount(ds)) {
        turnToPage(dir, () => {
          yearDaySpread = Math.floor(target / 2);
          yearMobileSide = target % 2 === 0 ? "left" : "right";
        });
        return;
      }
    } else {
      const next = yearDaySpread + dir;
      if (next >= 0 && next < Math.max(1, Math.ceil(daySlotCount(ds) / 2))) {
        turnToPage(dir, () => { yearDaySpread = next; });
        return;
      }
    }
    stepYearDay(dir);
  }

  function setDayMood(key) {
    const d = state.selectedDate;
    if (!d) return;
    const log = state.logs[d] || (state.logs[d] = { oneLine: "", diary: "" });
    log.mood = log.mood === key ? "" : key;
    saveState();
    document.querySelectorAll(".nb-mood").forEach(b => {
      const on = b.dataset.mood === log.mood;
      b.classList.toggle("is-on", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function openDayPhoto(index) {
    const d = state.selectedDate;
    const log = state.logs[d] || {};
    openLightbox(normalizePhotos(log), Number(index) || 0, dottedDate(d));
  }

  async function handleDayPhotos(event) {
    const d = yearDayDate || state.selectedDate;
    const files = event && event.target ? event.target.files : null;
    if (d && files && files.length) {
      const log = state.logs[d] || (state.logs[d] = { oneLine: "", diary: "" });
      if (normalizePhotos(log).length >= DAY_PHOTO_MAX) {
        alert(`사진은 최대 ${DAY_PHOTO_MAX}장까지 붙일 수 있어요.`);
      } else {
        try {
          log.photos = await processMultipleFiles(files, normalizePhotos(log), DAY_PHOTO_MAX);
          saveState();
        } catch (_) {
          alert("이미지를 불러오는 중 오류가 발생했습니다.");
        }
      }
    }
    if (event && event.target) event.target.value = "";
    // 사진을 새로 붙였으면 저장 직후 사진 전용 장으로 넘어가 방금 붙인 사진이 바로 보이게 한다
    const hasPhotos = normalizePhotos(state.logs[d] || {}).length > 0;
    if (hasPhotos && isMobileViewport() && yearDayDate && d === yearDayDate && dayVisibleSlot(d) === 0) {
      turnToPage(1, () => { yearDaySpread = 0; yearMobileSide = "right"; });
      return;
    }
    render();
  }

  function removeDayPhoto(index) {
    const d = yearDayDate || state.selectedDate;
    const log = state.logs[d];
    if (!log) return;
    const list = normalizePhotos(log);
    if (index < 0 || index >= list.length) return;
    list.splice(index, 1);
    log.photos = list;
    // 사진을 모두 떼면 사진 전용 장이 사라지므로 일기 장으로 돌아간다
    if (!list.length && isMobileViewport()) {
      yearDaySpread = 0;
      yearMobileSide = "left";
    }
    saveState();
    render();
  }

  function onDiaryInput() {
    diaryPending = true;
    const st = document.getElementById("saveStatus");
    if (st) {
      st.textContent = "저장 중…";
      st.classList.add("saving");
    }
    clearTimeout(diaryTimer);
    diaryTimer = setTimeout(() => {
      diaryPending = false;
      saveDiaryDraft();
    }, 450);
  }

  function flushDiaryDraft() {
    if (!diaryPending) return;
    clearTimeout(diaryTimer);
    diaryPending = false;
    saveDiaryDraft();
  }

  function saveDiaryDraft() {
    const oneEl = document.getElementById("oneLineInput");
    const diaryEl = document.getElementById("diaryInput");
    if (!oneEl && !diaryEl) return;
    const prev = state.logs[state.selectedDate] || {};
    state.logs[state.selectedDate] = {
      ...prev,
      oneLine: oneEl ? oneEl.value : (prev.oneLine || ""),
      diary: diaryEl ? diaryEl.value : (prev.diary || "")
    };
    saveState();
    const st = document.getElementById("saveStatus");
    if (st) {
      st.classList.remove("saving");
      st.textContent = "저장됨 · " + timeStr(lastSavedAt);
    }
  }

  function addDayTodo() {
    const inp = document.getElementById("dayTodoInput");
    if (!inp) return;
    const title = inp.value.trim();
    if (!title) return;
    state.todos.unshift({ id: uid(), date: state.selectedDate, title, done: false });
    saveState();
    render();
  }

  // ---------- 카테고리 관리 ----------
  const CAT_KINDS = {
    goals: { label: "목표", filterKey: "goalTopicFilter", itemKey: "topic", iconFallback: "target", addIconDefault: "target" },
    bucket: { label: "버킷리스트", filterKey: "bucketCatFilter", itemKey: "category", iconFallback: "star", addIconDefault: "star" },
    archive: { label: "아카이브", filterKey: "archiveCatFilter", itemKey: "category", iconFallback: "folder", addIconDefault: "folder" }
  };

  function categoryListOf(kind) {
    if (kind === "goals") return state.topics;
    if (kind === "bucket") return state.bucketCategories;
    return state.archiveCategories;
  }

  function collectionOf(kind) {
    if (kind === "goals") return state.goals;
    if (kind === "bucket") return state.buckets;
    return state.archives;
  }

  function openCategoryManager(kind) {
    if (!CAT_KINDS[kind]) return;
    catManagerKind = kind;
    renderCategoryManager();
    document.getElementById("catModal").classList.add("open");
  }

  function closeCategoryManager() {
    catManagerKind = null;
    document.getElementById("catModal").classList.remove("open");
  }

  function refreshCategoryManager() {
    if (!catManagerKind) return;
    if (document.getElementById("catModal").classList.contains("open")) renderCategoryManager();
  }

  function renderCategoryManager() {
    const kind = catManagerKind;
    if (!kind) return;
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const items = collectionOf(kind);
    document.getElementById("catModalTitle").textContent = kind === "goals" ? "주제 관리" : `${cfg.label} 카테고리 관리`;
    document.getElementById("catModalBody").innerHTML = `
      <p class="settings-hint" style="margin:0 0 10px;">이름이나 아이콘을 바꾸면 기존 항목에도 함께 반영됩니다.</p>
      <div class="cat-manage-list">
        ${list.length ? list.map((cat, idx) => {
          const count = items.filter(it => it[cfg.itemKey] === cat.name).length;
          return `
            <div class="cat-manage-row">
              <span class="cat-manage-name">${renderPictogram(cat.icon, 14)} ${escapeHtml(cat.name)} <span class="cat-manage-count">${count}</span></span>
              <span class="cat-manage-actions">
                <button class="btn btn-sm" onclick="openCategoryEdit('${kind}', ${idx})">수정</button>
                <button class="btn btn-sm btn-danger-outline" onclick="deleteCategory('${kind}', ${idx})">삭제</button>
              </span>
            </div>
          `;
        }).join("") : `<p class="settings-hint" style="margin:0;">아직 카테고리가 없습니다. 아래에서 추가하세요.</p>`}
      </div>
      <div class="cat-add-card">
        <h4>새 카테고리 추가</h4>
        ${renderIconPickerHtml("catAddIcon", cfg.addIconDefault)}
        <div class="cat-add-row">
          <input type="text" id="catAddName" placeholder="카테고리 이름" onkeydown="if (event.key === 'Enter') addCategoryFromManager()" />
          <button class="btn btn-primary" onclick="addCategoryFromManager()">추가</button>
        </div>
      </div>
    `;
  }

  function openCategoryEdit(kind, idx) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const target = list[idx];
    if (!target) return;
    openModal(`${cfg.label} 카테고리 수정`, `
      <div class="modal-field">
        <label>픽토그램 선택</label>
        ${renderIconPickerHtml("mCatIcon", target.icon)}
      </div>
      <div class="modal-field">
        <label>카테고리 이름 (기존 항목의 분류명도 함께 변경됩니다)</label>
        <input type="text" id="mCatName" value="${escapeAttr(target.name)}" />
      </div>
    `, () => {
      const newIcon = resolveIconKey(document.getElementById("mCatIcon").value, target.icon);
      const newName = document.getElementById("mCatName").value.trim();
      if (!newName) {
        alert("카테고리 이름을 입력해 주세요.");
        return false;
      }
      if (newName !== target.name && list.some(c => c.name === newName)) {
        alert("이미 같은 이름의 카테고리가 있습니다.");
        return false;
      }
      const oldName = target.name;
      list[idx] = { name: newName, icon: newIcon };
      if (state[cfg.filterKey] === oldName) state[cfg.filterKey] = newName;
      collectionOf(kind).forEach(item => {
        if (item[cfg.itemKey] === oldName) item[cfg.itemKey] = newName;
      });
      // v3.1: 주제는 목표·버킷을 함께 쓰는 하나의 목록
      if (kind === "goals") {
        (state.buckets || []).forEach(b => { if (canonicalTopicName(b.category) === canonicalTopicName(oldName)) b.category = newName; });
        (state.goals || []).forEach(g => { if (canonicalTopicName(g.topic) === canonicalTopicName(oldName)) g.topic = newName; });
        state.bucketCategories = state.topics.map(t => ({ name: t.name, icon: t.icon }));
        if (state.goalBookTopic === oldName) state.goalBookTopic = newName;
      }
      if (kind === "archive") {
        state.books.forEach(b => { if (b.category === oldName) b.category = newName; });
      }
      return true;
    });
  }

  function deleteCategory(kind, idx) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const target = list[idx];
    if (!target) return;
    const count = kind === "goals"
      ? state.goals.filter(g => canonicalTopicName(g.topic) === canonicalTopicName(target.name)).length
        + state.buckets.filter(b => canonicalTopicName(b.category) === canonicalTopicName(target.name)).length
      : collectionOf(kind).filter(it => it[cfg.itemKey] === target.name).length;
    const msg = count > 0
      ? `‘${target.name}’ 카테고리를 삭제할까요? 이 카테고리에 속한 항목 ${count}개도 함께 삭제됩니다.`
      : `‘${target.name}’ 카테고리를 삭제할까요?`;
    if (!confirm(msg)) return;
    list.splice(idx, 1);
    if (state[cfg.filterKey] === target.name) state[cfg.filterKey] = "all";
    if (kind === "goals") state.goals = state.goals.filter(g => canonicalTopicName(g.topic) !== canonicalTopicName(target.name));
    else if (kind === "bucket") state.buckets = state.buckets.filter(b => b.category !== target.name);
    else state.archives = state.archives.filter(a => a.category !== target.name);
    // v3.1: 주제를 지우면 같은 주제의 버킷 항목도 함께 정리
    if (kind === "goals") {
      state.buckets = state.buckets.filter(b => canonicalTopicName(b.category) !== canonicalTopicName(target.name));
      state.bucketCategories = state.topics.map(t => ({ name: t.name, icon: t.icon }));
      if (state.goalBookTopic === target.name) state.goalBookTopic = (state.topics[0] || {}).name || "";
    }
    if (kind === "archive") {
      state.books.forEach(b => { if (b.category === target.name) b.category = ""; });
    }
    goalLayoutCache = { sig: "", model: null };
    saveState();
    render();
    refreshCategoryManager();
  }

  function addCategoryFromManager() {
    const kind = catManagerKind;
    if (!kind) return;
    const cfg = CAT_KINDS[kind];
    const iconEl = document.getElementById("catAddIcon");
    const nameEl = document.getElementById("catAddName");
    const icon = resolveIconKey(iconEl ? iconEl.value : cfg.addIconDefault, cfg.iconFallback);
    const name = (nameEl ? nameEl.value : "").trim();
    if (!name) {
      if (nameEl) nameEl.focus();
      return;
    }
    const list = categoryListOf(kind);
    if (list.some(c => c.name === name)) {
      alert("이미 같은 이름의 카테고리가 있습니다.");
      return;
    }
    list.push({ name, icon });
    if (kind === "goals") state.bucketCategories = state.topics.map(t => ({ name: t.name, icon: t.icon }));
    goalLayoutCache = { sig: "", model: null };
    saveState();
    render();
    renderCategoryManager();
    const next = document.getElementById("catAddName");
    if (next) next.focus();
  }

  function ensureCategory(kind, name, icon) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const clean = String(name || "").trim() || "기타";
    const found = list.find(c => c.name === clean);
    if (!found) list.push({ name: clean, icon: resolveIconKey(icon || cfg.addIconDefault, cfg.iconFallback) });
    return clean;
  }

  function ensureTopicExists(name, icon = "target") {
    return ensureCategory("goals", name, icon);

  // ---------- 목표 · 버킷 책자 (v2.9 통합 노트) ----------
  // 기존 목표 주제와 버킷 분류를 같은 이름 기준으로 한 페이지에 묶습니다.

  // v3.1: 주제 관리는 하나의 목록(state.topics)만 쓴다. 인덱스 탭과 페이지도 이 목록에만 생긴다.
  function goalBookTopics() {
    const out = [];
    const seen = new Set();
    (state.topics || []).forEach(t => {
      const name = canonicalTopicName(t && t.name);
      if (!name || seen.has(name)) return;
      seen.add(name);
      out.push({ name, icon: resolveIconKey(t && t.icon, "target") });
    });
    return out;
  }

  function goalBookTopicIndex(topics) {
    const list = Array.isArray(topics) && topics.length ? topics : goalBookTopics();
    const saved = canonicalTopicName(state.goalBookTopic);
    let idx = list.findIndex(t => t.name === saved);
    if (idx < 0) {
      const filter = state.goalTopicFilter && state.goalTopicFilter !== "all" ? canonicalTopicName(state.goalTopicFilter) : "";
      idx = list.findIndex(t => t.name === filter);
    }
    return idx < 0 ? 0 : idx;
  }

  const goalBookOrder = list => list
    .map((item, i) => ({ item, i }))
    .sort((a, b) => (Number(a.item.done) - Number(b.item.done)) || (a.i - b.i))
    .map(entry => entry.item);

  function goalBookOrderEntries(list) {
    return list
      .map((entry, i) => ({ entry, i }))
      .sort((a, b) => (Number(a.entry.item.done) - Number(b.entry.item.done)) || (a.i - b.i))
      .map(row => row.entry);
  }
