<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>index</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-muted: #f1f3f6;
    --text: #14161a;
    --text-secondary: #5c6370;
    --text-muted: #8b92a0;
    --border: #e4e7ec;
    --accent: #14161a;
    --accent-text: #ffffff;
    --danger: #d92d20;
    --danger-bg: #fef3f2;
    --dot-diary: #2563eb;
    --dot-goal: #16a34a;
    --dot-archive: #9333ea;
    --dot-todo: #ea580c;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --radius-pill: 999px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-fab: 0 8px 24px rgba(20, 22, 26, 0.22);
    --nav-h: 64px;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: calc(var(--nav-h) + 88px + env(safe-area-inset-bottom, 0px));
  }

  button, input, select, textarea {
    font-family: inherit;
    color: inherit;
  }

  button {
    cursor: pointer;
    border: none;
    background: none;
  }

  .app-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 16px 24px;
  }

  .top-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .top-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .top-sub {
    font-size: 12px;
    color: var(--text-muted);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }

  /* 카테고리 필터 칩: 수정·휴지통 상시 버튼 제거 */
  .chip-row {
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
    margin-bottom: 10px;
  }

  .chip-row::-webkit-scrollbar {
    display: none;
  }

  .chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: var(--radius-pill);
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all 0.15s ease;
  }

  .chip.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 600;
  }

  .chip-count {
    opacity: 0.72;
    font-size: 12px;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  .btn-outline:hover {
    background: var(--surface-muted);
    color: var(--text);
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    background: var(--accent);
    color: var(--accent-text);
    font-size: 13px;
    font-weight: 600;
  }

  .btn-danger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 13px;
    font-weight: 600;
  }

  .select-sm, .input-sm, .textarea-field {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    font-size: 14px;
    padding: 8px 11px;
    width: 100%;
  }

  .select-sm {
    width: auto;
    padding: 7px 10px;
    font-size: 13px;
  }

  /* 접이식 카테고리 관리 박스 */
  .cat-manager {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 14px;
  }

  .cat-add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .cat-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .cat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface-muted);
    font-size: 13px;
  }

  .cat-item-actions {
    display: flex;
    gap: 8px;
  }

  .link-btn {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    padding: 4px 6px;
  }

  .link-btn.danger {
    color: var(--danger);
  }

  /* 아카이브 카드 */
  .archive-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 12px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }

  .archive-card:hover {
    border-color: #cbd2dc;
  }

  .archive-cover {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    display: block;
    background: var(--surface-muted);
  }

  .archive-body {
    padding: 14px 16px;
  }

  .archive-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .badge {
    background: var(--surface-muted);
    color: var(--text-secondary);
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    font-weight: 600;
    font-size: 11px;
  }

  .archive-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px;
  }

  .archive-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 8px;
  }

  .archive-note {
    font-size: 13px;
    color: var(--text);
    margin: 0;
    white-space: pre-line;
  }

  /* 일기 탭 (날짜 중복 제거) */
  .diary-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .date-nav {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .date-btn {
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }

  .date-picker-input {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface);
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
  }

  .field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .field-group {
    margin-bottom: 14px;
  }

  .diary-textarea {
    min-height: 240px;
    resize: vertical;
    line-height: 1.65;
  }

  /* 목표 & 버킷 리스트 */
  .list-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 13px 15px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    cursor: pointer;
  }

  .list-item-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 3px;
  }

  .list-item-desc {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0;
  }

  .check-pill {
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    background: var(--surface-muted);
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .check-pill.done {
    background: #dcfce7;
    color: #166534;
  }

  /* 1년 연력 탭 */
  .cal-controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 12px;
  }

  .cal-top-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .cal-top-row .input-sm {
    flex: 1 1 180px;
  }

  .seg-group {
    display: inline-flex;
    background: var(--surface-muted);
    padding: 3px;
    border-radius: var(--radius-sm);
  }

  .seg-btn {
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .seg-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
  }

  .month-jump-bar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }

  .month-jump-bar::-webkit-scrollbar {
    display: none;
  }

  .month-pill {
    flex: 0 0 auto;
    padding: 5px 10px;
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 600;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }

  .month-pill.has-entry {
    border-color: #b7c4d6;
    color: var(--text);
  }

  .month-pill.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .legend-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-secondary);
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    margin-bottom: 12px;
  }

  .legend-dots {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .dot-item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  .month-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    margin-bottom: 10px;
  }

  .month-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .month-card-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
  }

  .day-entry-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface-muted);
    margin-bottom: 6px;
    cursor: pointer;
  }

  .day-entry-row:last-child {
    margin-bottom: 0;
  }

  .year-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }

  .mini-cal-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    text-align: center;
    font-size: 11px;
  }

  .mini-day {
    padding: 5px 0;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
  }

  .mini-day.has-entry {
    background: #eef2ff;
    font-weight: 700;
  }

  .mini-day.today {
    outline: 1.5px solid var(--accent);
  }

  /* 우측 하단 플로팅 추가 버튼 (FAB) */
  .fab-btn {
    position: fixed;
    right: 20px;
    bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    box-shadow: var(--shadow-fab);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 400;
    z-index: 30;
  }

  .fab-btn:active {
    transform: scale(0.96);
  }

  /* 하단 탭 내비게이션 */
  .bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    z-index: 25;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .nav-item.active {
    color: var(--text);
    font-weight: 700;
  }

  .nav-icon {
    font-size: 17px;
    line-height: 1;
  }

  /* 모달 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.45);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-sheet {
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
  }

  @media (min-width: 640px) {
    .modal-backdrop {
      align-items: center;
    }
    .modal-sheet {
      border-radius: 18px;
      padding-bottom: 20px;
    }
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
  }

  .modal-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 16px;
  }

  .empty-state {
    text-align: center;
    padding: 36px 16px;
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="app-container" id="app"></div>

  <button type="button" class="fab-btn" id="fabBtn" aria-label="새 항목 추가" style="display:none;">+</button>

  <nav class="bottom-nav" aria-label="주요 탭">
    <button type="button" class="nav-item" data-tab="calendar">
      <span class="nav-icon">🗓</span>
      <span>연력</span>
    </button>
    <button type="button" class="nav-item" data-tab="diary">
      <span class="nav-icon">📝</span>
      <span>일기</span>
    </button>
    <button type="button" class="nav-item" data-tab="goals">
      <span class="nav-icon">🎯</span>
      <span>목표</span>
    </button>
    <button type="button" class="nav-item" data-tab="bucket">
      <span class="nav-icon">⭐</span>
      <span>버킷</span>
    </button>
    <button type="button" class="nav-item active" data-tab="archive">
      <span class="nav-icon">🗂</span>
      <span>아카이브</span>
    </button>
  </nav>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>

<script>
const STORAGE_KEY = "archive_planner_index_v2_3";

function todayStr() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function formatDotDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${y}. ${Number(m)}. ${Number(d)}.`;
}

const defaultState = {
  activeTab: "archive",
  archiveCategories: ["독서", "공부", "여행", "전시", "차"],
  goalCategories: ["학업", "운동", "재테크", "습관"],
  selectedArchiveCat: "전체",
  selectedGoalCat: "전체",
  archiveSort: "newest",
  showCatManager: false,
  diaryDate: "2026-09-20",
  calYear: 2026,
  calMode: "monthly", // "monthly" | "yearly"
  calSelectedMonth: null,
  calShowEmptyMonths: false,
  calSearch: "",
  archives: [
    {
      id: "arc-1",
      category: "독서",
      date: "2026-09-20",
      title: "면도날",
      subtitle: "서머싯 몸 · 세계문학전집 214",
      note: "나만의 삶의 기준과 가치관을 돌아보게 만든 책. 남들의 기준이 아니라 스스로 납득하는 길을 선택하는 태도를 기록했다.",
      coverUrl: ""
    },
    {
      id: "arc-2",
      category: "차",
      date: "2026-11-22",
      title: "2018 생차 시음 기록",
      subtitle: "개완 · 숙우",
      note: "잔향과 회감이 깔끔하게 이어졌던 오후 차 자리."
    }
  ],
  diaries: {
    "2026-09-20": {
      summary: "면도날 독서 및 가치관 정리",
      body: ""
    },
    "2026-11-22": {
      summary: "보이차 시음 및 다구 정리",
      body: "개완과 숙우를 물로만 깔끔하게 헹구고 하루를 마무리했다."
    }
  },
  goals: [
    {
      id: "goal-1",
      category: "학업",
      title: "미적분학·미분기하 개념 복습",
      detail: "주간 핵심 정리 및 연습문제 풀이",
      done: false
    },
    {
      id: "goal-2",
      category: "운동",
      title: "주 2~3회 상체·코어 루틴 유지",
      detail: "사이드 레터럴 레이즈, 리버스 펙덱, 레그레이즈",
      done: true
    }
  ],
  buckets: [
    {
      id: "bkt-1",
      title: "국내·해외 혼자 여행 떠나기",
      detail: "전역 후 일정 맞춰 차근차근 계획 세우기",
      done: false
    },
    {
      id: "bkt-2",
      title: "재즈 바·LP 바 방문하기",
      detail: "조용히 음악 감상할 수 있는 공간 찾기",
      done: false
    }
  ]
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return structuredClone(defaultState);
    const parsed = JSON.parse(raw);
    return {
      ...structuredClone(defaultState),
      ...parsed,
      diaries: { ...defaultState.diaries, ...(parsed.diaries || {}) }
    };
  } catch {
    return structuredClone(defaultState);
  }
}

let state = loadState();

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHtml(str = "") {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function switchTab(tab) {
  state.activeTab = tab;
  state.showCatManager = false;
  saveState();
  render();
}

function renderNav() {
  document.querySelectorAll(".nav-item").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
  });

  const fab = document.getElementById("fabBtn");
  if (state.activeTab === "archive" || state.activeTab === "goals" || state.activeTab === "bucket") {
    fab.style.display = "inline-flex";
    const labels = {
      archive: "새 아카이브 추가",
      goals: "새 목표 추가",

        state.archives.forEach((a) => {
          if (a.category === oldName) a.category = clean;

        if (state.selectedArchiveCat === oldName) state.selectedArchiveCat = clean;
        saveState();

          if (a.category === target) a.category = fallback;
        });
        if (state.selectedArchiveCat === target) state.selectedArchiveCat = "전체";
        saveState();
        render();
      });
    });
  }

  container.querySelectorAll("[data-open-archive]").forEach((card) => {
    card.addEventListener("click", () => openArchiveModal(card.dataset.openArchive));
  });
}

/* ---------------- 일기 탭 ---------------- */
function shiftDate(iso, deltaDays) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d + deltaDays);
  const ny = dt.getFullYear();
  const nm = String(dt.getMonth() + 1).padStart(2, "0");
  const nd = String(dt.getDate()).padStart(2, "0");
  return `${ny}-${nm}-${nd}`;
}

/* ---------------- 1년 연력 탭 ---------------- */
function collectEntriesByYear(year) {
  const map = {}; // dateStr -> { diarySummary, archives: [] }
  const add = (dateStr) => {
    if (!dateStr || !dateStr.startsWith(`${year}-`)) return;
    if (!map[dateStr]) map[dateStr] = { diarySummary: "", archives: [] };
    return map[dateStr];
  };

  Object.entries(state.diaries).forEach(([dStr, val]) => {
    if (dStr.startsWith(`${year}-`) && ((val.summary && val.summary.trim()) || (val.body && val.body.trim()))) {
      const slot = add(dStr);
      slot.diarySummary = val.summary || val.body.slice(0, 40);
    }
  });

  state.archives.forEach((a) => {
    if (a.date && a.date.startsWith(`${year}-`)) {
      const slot = add(a.date);
      slot.archives.push(a);
    }
  });

  return map;
}

function renderCalendarTab(container) {
  const year = state.calYear;
  const entryMap = collectEntriesByYear(year);
  const q = state.calSearch.trim().toLowerCase();

  const monthNames = Array.from({ length: 12 }, (_, i) => `${i + 1}월`);
  const monthJumpHtml = monthNames
    .map((mLabel, idx) => {
      const mNum = idx + 1;
      const prefix = `${year}-${String(mNum).padStart(2, "0")}-`;
      const hasAny = Object.keys(entryMap).some((d) => d.startsWith(prefix));
      const isSelected = state.calSelectedMonth === mNum;
      return `
        <button
          type="button"
          class="month-pill ${hasAny ? "has-entry" : ""} ${isSelected ? "active" : ""}"
          data-jump-month="${mNum}"
        >${mLabel}</button>
      `;
    })
    .join("");

  let bodyHtml = "";

  if (state.calMode === "monthly") {
    const monthCards = [];
    for (let m = 1; m <= 12; m++) {
      if (state.calSelectedMonth && state.calSelectedMonth !== m) continue;
      const prefix = `${year}-${String(m).padStart(2, "0")}-`;
      const dates = Object.keys(entryMap)
        .filter((d) => d.startsWith(prefix))
        .sort()
        .filter((d) => {
          if (!q) return true;
          const slot = entryMap[d];
          const text = `${d} ${slot.diarySummary} ${slot.archives.map((x) => x.title + " " + x.note).join(" ")}`.toLowerCase();
          return text.includes(q);
        });

      if (dates.length === 0 && !state.calShowEmptyMonths && !state.calSelectedMonth) {
        continue;
      }

      const rowsHtml = dates.length
        ? dates
            .map((d) => {
              const slot = entryMap[d];
              const labels = [];
              if (slot.diarySummary) labels.push(`일기: ${slot.diarySummary}`);
              slot.archives.forEach((a) => labels.push(`아카이브(${a.category}): ${a.title}`));
              return `
                <div class="day-entry-row" data-jump-diary="${d}">
                  <div>
                    <strong>${escapeHtml(formatDotDate(d))}</strong>
                    <div class="list-item-desc">${escapeHtml(labels.join(" · "))}</div>
                  </div>
                </div>
              `;
            })
            .join("")
        : `<div class="list-item-desc">기록이 없습니다.</div>`;

      monthCards.push(`
        <section class="month-card">
          <div class="month-card-head">
            <h2 class="month-card-title">${m}월</h2>
            <span class="top-sub">기록 ${dates.length}일</span>
          </div>
          ${rowsHtml}
        </section>
      `);
    }

    bodyHtml = monthCards.length
      ? monthCards.join("")
      : `<div class="empty-state">표시할 기록이 없습니다. '빈 달 보기'를 켜거나 다른 월을 선택해 보세요.</div>`;
  } else {
    // 연간 표(12개월 그리드)
    const today = todayStr();
    const gridCards = [];
    for (let m = 1; m <= 12; m++) {
      if (state.calSelectedMonth && state.calSelectedMonth !== m) continue;
      const firstDay = new Date(year, m - 1, 1).getDay();
      const lastDate = new Date(year, m, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push(`<span></span>`);
      for (let day = 1; day <= lastDate; day++) {
        const dStr = `${year}-${String(m).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const has = Boolean(entryMap[dStr]);
        const isToday = dStr === today;
        cells.push(`
          <button
            type="button"
            class="mini-day ${has ? "has-entry" : ""} ${isToday ? "today" : ""}"
            data-jump-diary="${dStr}"
            title="${dStr}"
          >${day}</button>
        `);
      }
      gridCards.push(`
        <div class="month-card" style="margin-bottom:0;">
          <div class="month-card-head" style="margin-bottom:6px;">
            <strong>${m}월</strong>
          </div>
          <div class="mini-cal-days">${cells.join("")}</div>
        </div>
      `);
    }
    bodyHtml = `<div class="year-grid">${gridCards.join("")}</div>`;
  }

  container.innerHTML = `
    <div class="top-header">
      <h1 class="top-title">1년 연력</h1>
      <button type="button" class="btn-outline" id="calTodayBtn">오늘 (${todayStr()})</button>
    </div>

    <div class="cal-controls">
      <div class="cal-top-row">
        <input
          type="text"
          class="input-sm"
          id="calSearchInput"
          placeholder="기록·아카이브 검색..."
          value="${escapeHtml(state.calSearch)}"
        />
        <div class="seg-group">
          <button type="button" class="seg-btn ${state.calMode === "yearly" ? "active" : ""}" data-cal-mode="yearly">연간 표</button>
          <button type="button" class="seg-btn ${state.calMode === "monthly" ? "active" : ""}" data-cal-mode="monthly">달별 모아보기</button>
        </div>
        <select class="select-sm" id="calYearSelect" aria-label="연도 선택">
          ${[2025, 2026, 2027]
            .map((y) => `<option value="${y}" ${year === y ? "selected" : ""}>${y}년</option>`)
            .join("")}
        </select>
      </div>

      <div class="month-jump-bar">
        <button type="button" class="month-pill ${state.calSelectedMonth === null ? "active" : ""}" data-jump-month="">전체</button>
        ${monthJumpHtml}
      </div>
    </div>

    <div class="legend-bar">
      <div class="legend-dots">
        <span class="dot-item"><i class="dot" style="background:var(--dot-diary)"></i>일기</span>
        <span class="dot-item"><i class="dot" style="background:var(--dot-archive)"></i>아카이브</span>
      </div>
      ${
        state.calMode === "monthly" && !state.calSelectedMonth
          ? `<button type="button" class="link-btn" id="toggleEmptyMonthsBtn">${state.calShowEmptyMonths ? "기록 있는 달만 보기" : "빈 달 보기"}</button>`
          : `<span class="top-sub">날짜 탭 시 일기로 이동</span>`
      }
    </div>

    ${bodyHtml}
  `;

  document.getElementById("calTodayBtn").addEventListener("click", () => {
    state.diaryDate = todayStr();
    state.activeTab = "diary";
    saveState();
    render();
  });

  document.getElementById("calSearchInput").addEventListener("input", (e) => {
    state.calSearch = e.target.value;
    saveState();
    render();
  });

  document.getElementById("calYearSelect").addEventListener("change", (e) => {
    state.calYear = Number(e.target.value);
    state.calSelectedMonth = null;
    saveState();
    render();
  });

  container.querySelectorAll("[data-cal-mode]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.calMode = btn.dataset.calMode;
      saveState();
      render();
    });
  });

  container.querySelectorAll("[data-jump-month]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const val = btn.dataset.jumpMonth;
      state.calSelectedMonth = val ? Number(val) : null;
      saveState();
      render();
    });
  });

  const emptyBtn = document.getElementById("toggleEmptyMonthsBtn");
  if (emptyBtn) {
    emptyBtn.addEventListener("click", () => {
      state.calShowEmptyMonths = !state.calShowEmptyMonths;
      saveState();
      render();
    });
  }

  container.querySelectorAll("[data-jump-diary]").forEach((el) => {
    el.addEventListener("click", () => {
      state.diaryDate = el.dataset.jumpDiary;
      state.activeTab = "diary";
      saveState();
      render();
    });
  });
}

/* ---------------- 모달 (추가 / 수정 / 삭제) ---------------- */
const backdrop = document.getElementById("modalBackdrop");
const sheet = document.getElementById("modalSheet");

function closeModal() {
  backdrop.classList.remove("open");
  sheet.innerHTML = "";
}

backdrop.addEventListener("click", (e) => {
  if (e.target === backdrop) closeModal();
});

function openArchiveModal(id = null) {
  const existing = id ? state.archives.find((a) => a.id === id) : null;
  const item = existing || {
    id: `arc-${Date.now()}`,
    category: state.archiveCategories[0] || "독서",
    date: todayStr(),
    title: "",
    subtitle: "",
    note: "",
    coverUrl: ""
  };

  sheet.innerHTML = `
    <div class="modal-head">
      <h2 class="modal-title">${existing ? "아카이브 수정" : "새 아카이브 추가"}</h2>
      <button type="button" class="link-btn" id="closeModalBtn">닫기</button>
    </div>
    <div class="field-group">
      <label class="field-label">카테고리</label>
      <select class="input-sm" id="mArchCat">
        ${state.archiveCategories.map((c) => `<option value="${escapeHtml(c)}" ${item.category === c ? "selected" : ""}>${escapeHtml(c)}</option>`).join("")}
      </select>
    </div>
    <div class="field-group">
      <label class="field-label">날짜</label>
      <input type="date" class="input-sm" id="mArchDate" value="${escapeHtml(item.date)}" />
    </div>
    <div class="field-group">
      <label class="field-label">제목</label>
      <input type="text" class="input-sm" id="mArchTitle" value="${escapeHtml(item.title)}" placeholder="제목 입력" />
    </div>
    <div class="field-group">
      <label class="field-label">부제 / 출처</label>
      <input type="text" class="input-sm" id="mArchSub" value="${escapeHtml(item.subtitle)}" placeholder="저자, 장소, 다구 등" />
    </div>
    <div class="field-group">
      <label class="field-label">메모</label>
      <textarea class="textarea-field" id="mArchNote" rows="4" placeholder="기록할 내용">${escapeHtml(item.note)}</textarea>
    </div>
    <div class="modal-actions">
      ${existing ? `<button type="button" class="btn-danger" id="mArchDelete">삭제</button>` : `<span></span>`}
      <button type="button" class="btn-primary" id="mArchSave">저장</button>
    </div>
  `;

  backdrop.classList.add("open");
  document.getElementById("closeModalBtn").addEventListener("click", closeModal);

  document.getElementById("mArchSave").addEventListener("click", () => {
    const title = document.getElementById("mArchTitle").value.trim();
    if (!title) {
      alert("제목을 입력해 주세요.");
      return;
    }
    const updated = {
      ...item,
      category: document.getElementById("mArchCat").value,
      date: document.getElementById("mArchDate").value || todayStr(),
      title,
      subtitle: document.getElementById("mArchSub").value.trim(),
      note: document.getElementById("mArchNote").value
    };
    if (existing) {
      state.archives = state.archives.map((a) => (a.id === id ? updated : a));
    } else {
      state.archives.unshift(updated);
    }
    saveState();
    closeModal();
    render();
  });

  if (existing) {
    document.getElementById("mArchDelete").addEventListener("click", () => {
      if (!confirm("이 아카이브를 삭제할까요?")) return;
      state.archives = state.archives.filter((a) => a.id !== id);
      saveState();
      closeModal();
      render();
    });
  }
}

document.getElementById("fabBtn").addEventListener("click", () => {
  if (state.activeTab === "archive") openArchiveModal(null);
  else if (state.activeTab === "goals") openGoalModal(null);
  else if (state.activeTab === "bucket") openBucketModal(null);
});

document.querySelectorAll(".nav-item").forEach((btn) => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

function render() {
  renderNav();
  const main = document.getElementById("app");
  if (state.activeTab === "archive") renderArchiveTab(main);
  else if (state.activeTab === "diary") renderDiaryTab(main);
  else if (state.activeTab === "goals") renderGoalsTab(main);
  else if (state.activeTab === "bucket") renderBucketTab(main);
  else if (state.activeTab === "calendar") renderCalendarTab(main);
}

render();
