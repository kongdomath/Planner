<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아카이브 플래너" />
  <meta name="theme-color" content="#faf9f6" />
  <title>아카이브 &amp; 플래너</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --surface-muted: #f3f1ec;
      --border: #e5e2da;
      --text: #1f2421;
      --text-sub: #6b7280;
      --sat: #3b6ea5;
      --sun: #c84b4b;
      --c-year: #334155;
      --c-diary: #2b4c7e;
      --c-goal: #2d6a4f;
      --c-bucket: #b46528;
      --c-archive: #5b4b8a;
      --c-todo: #6441a5;
      --radius: 12px;

      /* v2.6 공통 스테이지 · 종이 시스템 */
      --stage-top: #353c56;
      --stage-mid: #2d334b;
      --stage-bottom: #262b40;
      --stage-ink: #e8ebf4;
      --stage-ink-sub: rgba(232,235,244,.62);
      --stage-line: rgba(255,255,255,.15);
      --stage-chip: rgba(255,255,255,.08);
      --paper: #fcfbf6;
      --paper-ink: #2b2f37;
      --paper-sub: #7d818b;
      --paper-line: rgba(120,126,140,.26);
      --header-h: 58px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app-shell {
      display: flex;
      min-height: 100vh;
    }    .sidebar {
      width: 232px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .brand {
      padding: 6px 10px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 12px;
      color: var(--text-sub);
      margin: 4px 0 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: var(--surface-muted); color: var(--text); }
    .nav-btn.active { background: var(--surface-muted); color: var(--text); font-weight: 700; }
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-hint {
      font-size: 11px;
      color: var(--text-sub);
      padding: 0 2px;
      line-height: 1.5;
    }
    .app-body {
      flex: 1;
      min-width: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 28px 18px;
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
      min-width: 0;
    }
    /* v2.9: 딥 슬레이트 스테이지가 화면 하단까지 꽉 차도록 */
    .main > .nb-stage {
      flex: 1 1 auto;
    }

    /* ===== 공통 앱 헤더 (v2.6) ===== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 34;
      background: rgba(250,249,246,.94);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
    }
    .ah-inner {
      max-width: 1320px;
      margin: 0 auto;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ah-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .ah-brand {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-sub);
      white-space: nowrap;
    }
    .ah-sep {
      width: 1px;
      height: 15px;
      background: var(--border);
      flex-shrink: 0;
    }
    .ah-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      white-space: nowrap;
      min-width: 0;
    }
    .ah-tab svg { color: var(--ah-accent, var(--text)); }
    .ah-right {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .ah-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background .14s, color .14s, border-color .14s;
    }
    .ah-btn:hover { background: var(--surface-muted); color: var(--text); }
    .ah-btn.on {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }

    /* ===== 공통 검색 드로어 ===== */
    .search-host {
      position: sticky;
      top: var(--header-h);
      z-index: 33;
      padding: 0 28px;
    }
    .search-host:empty { display: none; }
    .search-drawer {
      max-width: 1320px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 0;
      border-radius: 0 0 14px 14px;
      box-shadow: 0 18px 30px -18px rgba(28,32,48,.35);
      padding: 12px 14px 14px;
    }
    .search-drawer-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 6px 0 11px;
      height: 42px;
    }
    .sd-icon { display: inline-flex; color: var(--text-sub); flex-shrink: 0; }
    .sd-input {
      flex: 1;
      min-width: 0;
      border: 0 !important;
      background: transparent !important;
      height: 40px;
      font-size: 14px;
      padding: 0 !important;
    }
    .sd-close {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 0;
      background: transparent;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sd-close:hover { background: var(--surface-muted); color: var(--text); }
    .search-empty {
      margin: 10px 2px 0;
      font-size: 12.5px;
      color: var(--text-sub);
    }
    .search-count {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin: 12px 2px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 48vh;
      overflow-y: auto;
    }
    .search-result-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      background: var(--bg);
    }
    .search-result-item:hover { background: var(--surface-muted); }

    .page-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .title-year { color: var(--c-year); }
    .title-diary { color: var(--c-diary); }
    .title-goal { color: var(--c-goal); }
    .title-bucket { color: var(--c-bucket); }
    .title-archive { color: var(--c-archive); }

    .diary-date-badge {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    select, input[type="text"], input[type="date"], textarea {
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 11px;
      height: 36px;
      outline: none;
    }
    textarea {
      height: auto;
      padding: 10px 12px;
      font-size: 14px;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #94a3b8;
    }
    .search-input {
      min-width: 210px;
      font-size: 13px;
      height: 36px;
    }
    .year-select {
      font-weight: 600;
      font-size: 13px;
      height: 36px;
      padding: 0 12px;
      cursor: pointer;
      background: var(--surface);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-muted); }
    .btn-primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .btn-primary:hover { opacity: 0.9; background: var(--text); }
    .btn-sm {
      height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }
    .btn-nav-arrow {
      width: 36px;
      padding: 0;
    }
    .btn-danger-outline {
      color: var(--sun);
      border-color: #f0c9c9;
      background: #fff;
    }
    .btn-danger-outline:hover { background: #fef2f2; }
    .segmented {
      display: inline-flex;
      align-items: center;
      height: 36px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .segmented button {
      border: none;
      background: transparent;
      height: 30px;
      padding: 0 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
    }
    .segmented button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 7px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 0;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: var(--surface-muted); color: var(--text); }
    .icon-btn.danger:hover { color: var(--sun); border-color: #fecaca; background: #fef2f2; }
    .icon-btn-lg {
      width: 36px;
      height: 36px;
      border-radius: 9px;
    }

    .tap-edit-target {
      cursor: pointer;
      transition: opacity 0.14s, color 0.14s;
    }
    .tap-edit-target:hover {
      opacity: 0.78;
    }

    /* 통계 요약 바 */
    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .summary-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }
    .progress-track {
      width: 140px;
      height: 8px;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: var(--c-goal);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .legend-dots {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* 연력 뷰 */
    .year-block { margin-bottom: 32px; }
    .year-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-year);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .matrix-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      max-height: 76vh;
      overflow-y: auto;
    }
    table.year-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.year-table th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--surface-muted);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
    }
    table.year-table th.day-axis-col,
    table.year-table td.day-axis-cell {
      position: sticky;
      left: 0;
      z-index: 3;
      width: 44px;
      background: var(--surface-muted);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: default;
      vertical-align: middle;
    }
    table.year-table th.day-axis-col {
      z-index: 5;
    }
    table.year-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 6px 7px;
      vertical-align: top;
      height: 54px;
      cursor: pointer;
      transition: background 0.12s;
    }
    table.year-table td:hover:not(.empty-cell):not(.day-axis-cell) { background: #f4f6fb; }
    table.year-table td.empty-cell { background: #faf9f6; cursor: default; }
    table.year-table td.weekend-bg { background: #fcfbf9; }
    table.year-table td.selected-day { outline: 2px solid var(--c-diary); outline-offset: -2px; background: #eef2ff; }
    table.year-table td.today-cell { background: #fefce8; }
    .cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .day-num { color: var(--text-sub); }
    .day-num.sat { color: var(--sat); }
    .day-num.sun, .day-num.holiday { color: var(--sun); }
    .cell-badges { display: flex; gap: 3px; align-items: center; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cell-line {
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }
    .cell-line.holiday-label {
      color: var(--sun);
      font-weight: 600;
      opacity: 0.9;
    }

    /* 달별 모아보기 (기록 있는 날만) */
    .month-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .month-jump-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .month-jump-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .month-jump-btn:hover { background: var(--surface-muted); color: var(--text); }
    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .month-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .month-card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-year);
    }
    .month-card-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--surface-muted);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .month-highlights {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .highlight-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      padding: 5px 7px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .highlight-row:hover { background: var(--surface-muted); }
    .highlight-row > span { min-width: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    .list-item.done .item-title {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .chk {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--text);
      flex-shrink: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .item-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-sub);
    }
    .pill svg, .chip-btn svg {
      flex-shrink: 0;
    }
    .done-date-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }
    .done-date-inline input[type="date"] {
      font-size: 11px;
      height: 26px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    textarea.diary-area {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      line-height: 1.7;
      padding: 14px;
    }
    .diary-save-line {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
    }
    .save-status {
      font-size: 12px;
      color: var(--text-sub);
    }
    .save-status.saving { color: var(--c-diary); }

    /* 필터 칩 */
    .filter-bar-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .chip-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 999px;
      height: 32px;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .chip-btn:hover { background: var(--surface-muted); color: var(--text); }

    .chip-manage-btn {

    .composer-card {

      background: #fdfcfa;
    }
    .composer-header {

      align-items: center;

      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }
    .composer-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      gap: 10px;
      padding-top: 10px;

    }

      display: flex;
      align-items: center;

    /* 픽토그램 선택 피커 */

      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .icon-pick-btn {
      height: 36px;

    }

      background: var(--text);

    }

    .media-grid {

    }
    .media-card {
      background: var(--surface);
      border: 1px solid var(--border);

      flex-direction: column;

    }
    .media-cover {

      height: 185px;
      background: var(--surface-muted);

      align-items: center;
      justify-content: center;

      border-bottom: 1px solid var(--border);
      color: var(--text-sub);
      cursor: pointer;

    }
    .media-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;

    }
    .photo-count-badge {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .cover-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
    }
    .cover-placeholder .big-pictogram {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
    }
    .media-body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .media-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 28px;
    }
    .media-title-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }
    .media-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      line-height: 1.4;
      word-break: break-word;
    }
    .media-sub {
      font-size: 12px;
      color: var(--text-sub);
    }
    .media-note {
      font-size: 13px;
      color: var(--text);

      white-space: pre-line;

    .img-preview-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .thumb-wrap {

    }

      width: 54px;
      height: 54px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .thumb-del-btn {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: var(--text);
      color: #fff;
      font-size: 11px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 4px;
      z-index: 40;
      justify-content: space-around;
    }
    .mobile-nav button {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);

      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .mobile-nav button.active { color: var(--text); }

    /* ===== 로그인 화면 ===== */
    .auth-screen {
      position: fixed; inset: 0; z-index: 90;
      display: none;
      align-items: center; justify-content: center;
      padding: 20px;
      overflow-y: auto;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(128,138,182,.42) 0%, rgba(128,138,182,0) 60%),
        linear-gradient(168deg, #383f5b 0%, #2d334b 55%, #232838 100%);
    }
    .auth-screen::before {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 26px 26px; opacity: .5; pointer-events: none;
    }
    .auth-screen.open { display: flex; }
    .auth-card {
      position: relative;
      width: 100%; max-width: 400px;
      background: var(--paper);
      border-radius: 18px;
      padding: 26px 24px 22px;
      box-shadow: 0 30px 60px -20px rgba(6,9,18,.75);
      color: var(--paper-ink);
    }
    .auth-mark {
      display: flex; align-items: center; gap: 8px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      color: #9aa0a9;
    }
    .auth-mark svg { color: #5b6478; }
    .auth-card h2 { margin: 12px 0 4px; font-size: 22px; letter-spacing: -0.02em; color: #23272e; }
    .auth-sub { margin: 0 0 18px; font-size: 12.5px; line-height: 1.6; color: #7d818b; }
    .auth-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .auth-field label { font-size: 11.5px; font-weight: 700; color: #7d818b; }
    .auth-field input {
      height: 42px; border-radius: 10px; border: 1px solid #e4dfd1; background: #fff;
      font-size: 14px; padding: 0 12px; color: var(--paper-ink);
    }
    .auth-field input:focus { border-color: #8f95a0; box-shadow: 0 0 0 3px rgba(47,53,66,.12); outline: none; }
    .auth-error { min-height: 17px; margin: 2px 0 8px; font-size: 11.5px; line-height: 1.5; color: #b4453f; }
    .auth-primary {
      width: 100%; height: 44px; border-radius: 11px; border: 0; cursor: pointer;
      background: #2f3542; color: #fff; font-size: 14px; font-weight: 700; font-family: inherit;
    }
    .auth-primary:hover { background: #232732; }
    .auth-or { display: flex; align-items: center; gap: 10px; margin: 14px 0; font-size: 11px; color: #a9a6a0; }
    .auth-or::before, .auth-or::after { content: ""; flex: 1; height: 1px; background: #e4dfd1; }
    .auth-google {
      width: 100%; height: 44px; border-radius: 11px; border: 1px solid #e4dfd1; cursor: pointer;
      background: #fff; color: #33383f; font-size: 13.5px; font-weight: 600; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 9px;
    }
    .auth-google:hover { background: #f7f4ec; }
    .auth-g {
      width: 20px; height: 20px; border-radius: 50%; background: #fff;
      border: 1px solid #e4dfd1; color: #4285f4; font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .auth-local {
      display: block; width: 100%; margin-top: 14px; padding: 0; background: none; border: 0;
      color: #5b6478; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .auth-local:hover { color: #33383f; }
    .auth-note { margin: 10px 0 0; font-size: 11px; line-height: 1.6; color: #9aa0a9; text-align: center; }
    .auth-switch {
      display: block; width: 100%; margin-top: 10px; padding: 0; background: none; border: 0;
      color: #4a5568; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center;
    }
    .auth-switch:hover { color: #1f2530; text-decoration: underline; text-underline-offset: 3px; }
    .auth-notice {
      margin: 0 0 14px; padding: 9px 11px; border-radius: 9px;
      background: #fdf4e5; border: 1px solid #efdcc0; color: #7c5a2c;
      font-size: 11.5px; line-height: 1.6;
    }
    .auth-primary:disabled, .auth-google:disabled { opacity: .55; cursor: default; }
    /* ===== 화면 알림(토스트) ===== */
    .toast-stack {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: stretch;
      width: min(92vw, 440px); pointer-events: none;
    }
    .toast {
      pointer-events: auto; display: flex; align-items: flex-start; gap: 10px;
      background: #232838; color: #f6f4ef; border-radius: 12px; padding: 11px 13px;
      font-size: 12.5px; line-height: 1.55;
      box-shadow: 0 16px 34px -16px rgba(6,9,18,.65);
      animation: toastIn .18s ease-out;
    }
    .toast.warn { background: #7a3f38; }
    .toast.ok { background: #2f5247; }
    .toast-text { flex: 1; min-width: 0; word-break: keep-all; }
    .toast-close {
      flex-shrink: 0; width: 20px; height: 20px; margin-top: -1px; padding: 0;
      background: none; border: 0; color: inherit; opacity: .65; font-size: 11px;
      cursor: pointer; font-family: inherit;
    }
    .toast-close:hover { opacity: 1; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .account-row { display: flex; align-items: center; gap: 10px; }
    .account-badge {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: #334155; color: #fff; font-size: 14px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .account-row .account-text { min-width: 0; flex: 1; display: flex; flex-direction: column; }
    .account-row .account-text strong { font-size: 13px; word-break: break-all; }
    .account-row .account-text span { font-size: 11.5px; color: var(--text-sub); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid var(--border);
    }
    .modal h3 { margin: 0 0 14px; font-size: 16px; }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }
    .modal-head h3 { margin: 0; }
    .modal-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
    .modal-field label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* 설정 모달 */
    #settingsModal { z-index: 58; }
    #catModal { z-index: 58; }
    .settings-section { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
    .settings-section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    .settings-section h4 { margin: 0 0 8px; font-size: 13.5px; }
    .settings-hint { font-size: 12px; color: var(--text-sub); line-height: 1.65; margin: 8px 0 0; }
    .settings-hint code { font-size: 11px; background: var(--surface-muted); padding: 1px 5px; border-radius: 5px; }
    .storage-line { display: flex; align-items: baseline; gap: 6px; font-size: 13px; margin-bottom: 6px; }
    .storage-line span { font-size: 12px; color: var(--text-sub); }
    .storage-track {
      height: 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .storage-fill { height: 100%; background: var(--c-diary); border-radius: 999px; }
    .storage-fill.warn { background: var(--sun); }
    .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* 카테고리 관리 모달 */
    .cat-manage-list { display: flex; flex-direction: column; gap: 6px; }
    .cat-manage-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg);
    }
    .cat-manage-name {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;
      min-width: 0;
    }
    .cat-manage-count {
      font-size: 11px;
      color: var(--text-sub);
      background: var(--surface-muted);
      border-radius: 999px;
      padding: 1px 7px;
      font-weight: 600;
    }
    .cat-manage-actions { display: inline-flex; gap: 6px; flex-shrink: 0; }
    .cat-add-card {
      margin-top: 14px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .cat-add-card h4 { margin: 0 0 10px; font-size: 13px; }
    .cat-add-row { display: flex; gap: 8px; margin-top: 10px; }
    .cat-add-row input[type="text"] { flex: 1; min-width: 0; }

    /* 라이트박스 */
    .lightbox-backdrop {
      background: rgba(8, 11, 18, 0.88);
      z-index: 80;
      padding: 0;
    }
    .lightbox {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 100%;
      padding: 56px 8px;
    }
    .lightbox img {
      max-width: 92vw;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 10px;
      background: #14181f;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      cursor: zoom-out;
    }
    .lightbox-close {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .lightbox-close:hover { background: rgba(255, 255, 255, 0.26); }
    .lightbox-caption {
      color: rgba(255, 255, 255, 0.86);
      font-size: 13px;
      text-align: center;
      max-width: 90vw;
      word-break: break-word;
    }
    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .lightbox-nav:hover { background: rgba(255, 255, 255, 0.26); }
    .lightbox-nav.prev { left: 10px; }
    .lightbox-nav.next { right: 10px; }

    /* 목표: 텍스트 중심 카드 (사진 UI 없음) */
    .goal-list { display: flex; flex-direction: column; gap: 10px; }
    .goal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px 15px;
    }
    .goal-card.done { background: var(--surface-muted); }
    .goal-card.done .media-title { color: var(--text-sub); text-decoration: line-through; }
    .goal-card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 9px; }
    .goal-card-top .icon-btn { margin-left: auto; }
    .goal-card .media-note { margin-top: 7px; }

    .stage-bar-side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .stage-tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 12px;
    }

      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;

    .stage-chips .chip-manage-btn { margin-left: auto; }

    .nb-stage select,

    .nb-stage select:focus,
    .nb-stage input:focus { border-color: rgba(255,255,255,.5); }
    .nb-stage .btn {
      background: rgba(255,255,255,.08);

      color: var(--stage-ink);

      font-size: 12.5px;
      border-radius: 9px;
    }
    .nb-stage .btn:hover { background: rgba(255,255,255,.18); }
    .nb-stage .btn-primary { background: #f6f7fb; border-color: #f6f7fb; color: #2b3145; }
    .nb-stage .btn-primary:hover { background: #fff; }
    .nb-stage .btn-sm { height: 28px; font-size: 11.5px; }

    .nb-stage .segmented button.active { background: #f6f7fb; color: #2b3145; box-shadow: none; }

    /* 달성률 요약 */
    .stage-summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      padding: 11px 14px;
      border: 1px solid var(--stage-line);
      border-radius: 12px;
      background: rgba(255,255,255,.055);
      margin-bottom: 12px;
    }
    .stage-summary .summary-metrics { gap: 12px; }
    .stage-summary .summary-metrics span { color: rgba(232,235,244,.66); font-size: 12px; }
    .stage-summary .summary-metrics strong { color: #fff; font-size: 12.5px; }
    .stage-summary .progress-track {
      flex: 1 1 130px;
      max-width: 240px;
      margin-left: auto;
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.14);
    }
    .stage-summary .progress-fill { background: #a9cbb8; }

    /* 스테이지 상단: 달성률 + 필터 버튼 */
    .stage-rate { display: inline-flex; align-items: baseline; gap: 5px; color: rgba(232,235,244,.55); font-size: 11px; }
    .stage-rate b { font-size: 16px; font-weight: 700; color: #f2f4fa; letter-spacing: -0.01em; }
    .stage-icon-btn {
      width: 32px; height: 32px; border-radius: 9px; padding: 0;
      border: 1px solid var(--stage-line); background: var(--stage-chip);
      color: rgba(232,235,244,.8); display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, color .15s;
    }
    .stage-icon-btn:hover { background: rgba(255,255,255,.18); color: #fff; }
    .stage-icon-btn.on { background: #f6f7fb; border-color: #f6f7fb; color: #2b3145; }
    .stage-meter { height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); margin: -6px 0 14px; overflow: hidden; }
    .stage-meter i { display: block; height: 100%; border-radius: 3px; background: #a9cbb8; transition: width .25s ease; }

    /* 접이식 필터 패널 */
    .filter-panel {
      background: rgba(255,255,255,.05);
      border: 1px solid var(--stage-line);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .filter-selects { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .filter-panel .stage-chips { margin-bottom: 0; }

    /* 한 장의 노트(체크리스트) 시트 */
    .sheet { padding: 4px 18px; }
    .sheet-row {
      display: flex; align-items: flex-start; gap: 11px;
      padding: 14px 0; border-bottom: 1px dashed rgba(120,126,140,.3);
    }
    .sheet-row:last-child { border-bottom: 0; }
    .sheet-row .chk { margin-top: 3px; }
    .sheet-main { flex: 1; min-width: 0; }
    .sheet-title { font-size: 14.5px; font-weight: 600; color: #2f343d; word-break: break-word; line-height: 1.5; }
    .sheet-row.done .sheet-title { color: #9aa0a9; text-decoration: line-through; }
    .sheet-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; font-size: 11.5px; color: var(--paper-sub); }
    .sheet-meta .pill { background: rgba(120,126,140,.13); color: #5b6478; }
    .sheet-dim { color: var(--paper-sub); }
    .sheet-note {
      margin-top: 6px; font-size: 12.5px; line-height: 1.6; color: #3f444e;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      white-space: pre-line;
    }

    /* 우측 하단 FAB */
    .fab {
      position: fixed; right: 26px; bottom: 26px; z-index: 45;
      width: 58px; height: 58px; border-radius: 50%;
      border: 0; background: #2f3542; color: #fff;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 16px 28px -12px rgba(12,16,28,.65), inset 0 1px 0 rgba(255,255,255,.12);
      transition: transform .15s ease, background .15s ease;
    }
    .fab:hover { background: #252a36; transform: translateY(-2px); }
    .fab svg { width: 22px; height: 22px; }
    .modal-row { display: flex; gap: 10px; }
    .modal-row .modal-field { flex: 1; min-width: 0; }

    /* 일기: 날짜 컨트롤 */
    .diary-controls {
      display: grid;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .stage-nav {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--stage-line);
      background: var(--stage-chip);
      color: rgba(232,235,244,.86);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .stage-nav:hover { background: rgba(255,255,255,.17); color: #fff; }
    .stage-nav.prev { justify-self: start; }
    .stage-nav.next { justify-self: end; }
    .diary-date { text-align: center; min-width: 0; }
    .diary-date b {
      display: block;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f4f6fb;
      line-height: 1.25;
    }
    .diary-date span { display: block; margin-top: 2px; font-size: 11px; letter-spacing: .05em; color: var(--stage-ink-sub); }
    .diary-date em { color: #e8b4b4; font-style: normal; }
    .diary-subcontrols {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }
    .diary-subcontrols .stage-date { width: 148px; }
    .stage-hint { font-size: 11px; color: rgba(232,235,244,.45); }

    .day-controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      max-width: 760px;
      margin: 0 auto 16px;
    }
    .stage-chip {
      height: 30px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--stage-line);
      background: var(--stage-chip);
      color: rgba(232,235,244,.85);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .stage-chip:hover { background: rgba(255,255,255,.17); color: #fff; }
    .stage-chip.is-today { background: #f6f7fb; border-color: #f6f7fb; color: #2b3145; }
    .diary-figure { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
    .diary-figure .pill { background: rgba(120,126,140,.13); color: #5b6478; }
    .diary-figure .item-title { font-size: 13px; font-weight: 600; color: #2f343d; }

    .day-stack {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .day-side-grid { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .diary-stage-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .day-stack .paper, .day-side-grid .paper { margin-bottom: 0; }

    /* ===== 종이 카드 ===== */
    .paper {
      position: relative;
      background: var(--paper);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
      color: var(--paper-ink);
      box-shadow: 0 14px 26px -16px rgba(6,9,18,.7), inset 0 1px 0 rgba(255,255,255,.7);
    }
    .paper:last-child { margin-bottom: 0; }
    .paper--dot {
      background-image: radial-gradient(rgba(122,128,142,.13) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: 10px 12px;
    }
    .paper-label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #9aa0a9;
    }
    .paper-label svg { flex-shrink: 0; }
    .paper-title { margin: 0 0 4px; font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: #2b2f37; }
    .paper-sub { font-size: 11.5px; color: var(--paper-sub); }
    .paper-rule { height: 1px; margin: 14px 0; background: linear-gradient(90deg, var(--paper-line), rgba(120,126,140,0)); }
    .paper-empty { margin: 0; font-size: 12.5px; color: var(--paper-sub); line-height: 1.7; }
    .nb-stage .paper input[type="text"],
    .nb-stage .paper input[type="date"],
    .nb-stage .paper select,
    .nb-stage .paper textarea {
      background: #fff;
      border-color: #e4dfd1;
      color: var(--paper-ink);
    }
    .nb-stage .paper input:focus, .nb-stage .paper textarea:focus, .nb-stage .paper select:focus { border-color: #b9b3a2; }
    .paper-input-line {
      width: 100%;
      height: 36px !important;
      border: 0 !important;
      border-bottom: 1px solid var(--paper-line) !important;
      border-radius: 0 !important;
      background: transparent !important;
      padding: 0 2px !important;
      font-size: 15.5px !important;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .paper-input-line:focus { border-color: #8f9299 !important; }
    textarea.diary-area {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      border: 0 !important;
      border-radius: 0 !important;
      background: transparent !important;
      padding: 0 2px !important;
      font-size: 14.5px;
      line-height: 1.95;
      color: #33383f;
    }
    .diary-note .diary-save-line { margin-top: 8px; }
    .nb-stage .save-status { color: #9aa0a9; }
    .paper .item-list { gap: 0; }
    .paper .list-item {
      background: transparent;
      border: 0;
      border-bottom: 1px dashed rgba(120,126,140,.28);
      border-radius: 0;
      padding: 10px 0;
    }
    .paper .list-item:last-child { border-bottom: 0; padding-bottom: 2px; }
    .paper .list-item.done .item-title { color: #9aa0a9; }
    .paper .item-title { color: #2f343d; }
    .paper .item-meta { color: var(--paper-sub); }
    .paper .pill { background: rgba(120,126,140,.13); color: #5b6478; }
    .paper .btn { background: #fff; border-color: #e4dfd1; color: #3b404a; }
    .paper .btn:hover { background: #f5f2e9; }
    .paper .btn-primary { background: #33383f; border-color: #33383f; color: #fff; }
    .nb-page .btn, .paper .icon-btn {
      background: #fff;
      border-color: #e4dfd1;
      color: #5b6478;
    }
    .nb-page .btn:hover, .paper .icon-btn:hover { background: #f5f2e9; color: #33383f; }
    .paper .icon-btn { border-color: transparent; background: transparent; color: #a9a6a0; }
    .paper .icon-btn.danger:hover { background: rgba(200,75,75,.1); color: var(--sun); }
    .paper .btn-primary:hover { background: #22262c; }
    .paper .chk { accent-color: #4a5162; }

    /* 목표 카드 (종이) */
    .goal-list { display: flex; flex-direction: column; gap: 12px; }
    .goal-card {
      background: var(--paper);
      border: 0;
      border-radius: 12px;
      padding: 15px 17px 16px;
      color: var(--paper-ink);
      box-shadow: 0 14px 26px -16px rgba(6,9,18,.7), inset 0 1px 0 rgba(255,255,255,.7);
    }
    .goal-card.done { background: #f3f0e6; }
    .goal-card.done .media-title { color: #9aa0a9; }
    .goal-card .media-title { color: #2b2f37; }
    .goal-card .media-note { color: #3f444e; }
    .goal-card .item-meta { color: var(--paper-sub); }
    .goal-card .pill { background: rgba(120,126,140,.13); color: #5b6478; }
    .goal-card .icon-btn { background: transparent; border-color: transparent; color: #9aa0a9; }
    .goal-card .icon-btn:hover { background: rgba(200,75,75,.1); color: var(--sun); }

    /* 버킷 체크리스트 (종이 한 장) */
    .bucket-sheet { padding: 8px 20px; }
    .bucket-sheet .paper-row {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 13px 0;
      border-bottom: 1px dashed rgba(120,126,140,.3);
    }
    .bucket-sheet .paper-row:last-child { border-bottom: 0; }
    .bucket-sheet .bucket-main { flex: 1; min-width: 0; cursor: pointer; }
    .bucket-sheet .bucket-title { font-size: 14px; font-weight: 600; color: #2f343d; word-break: break-word; }
    .bucket-sheet .paper-row.done .bucket-title { color: #9aa0a9; text-decoration: line-through; }
    .bucket-sheet .bucket-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; font-size: 11.5px; color: var(--paper-sub); }
    .bucket-sheet .pill { background: rgba(120,126,140,.13); color: #5b6478; }

    /* 아카이브 카드 (종이) */
    .media-card {
      background: var(--paper);
      border: 0;
      border-radius: 12px;
      box-shadow: 0 14px 26px -16px rgba(6,9,18,.7), inset 0 1px 0 rgba(255,255,255,.7);
      color: var(--paper-ink);
    }
    .media-cover { height: 172px; background: #ecebe2; border-bottom: 1px solid rgba(120,126,140,.2); }
    .media-body { padding: 13px 15px 15px; }
    .media-title { color: #2b2f37; }
    .media-sub { color: var(--paper-sub); }
    .media-note { color: #3f444e; }
    .media-card .pill { background: rgba(120,126,140,.13); color: #5b6478; }
    .media-card .icon-btn { background: transparent; border-color: transparent; color: #9aa0a9; }
    .media-card .icon-btn:hover { background: rgba(200,75,75,.1); color: var(--sun); }
    .cover-placeholder { color: #7d818b; }
    .cover-placeholder .big-pictogram { background: rgba(255,255,255,.85); border-color: rgba(120,126,140,.22); color: #7d818b; }

    /* 스테이지 안의 작성 폼·빈 상태 */
    .nb-stage .card {
      background: var(--paper);
      border-color: rgba(120,126,140,.3);
      border-radius: 12px;
      color: var(--paper-ink);
      margin-bottom: 14px;
      box-shadow: 0 14px 26px -16px rgba(6,9,18,.7);
    }
    .nb-stage .composer-card { background: #f7f4ea; border: 1px dashed rgba(120,126,140,.42); box-shadow: none; }
    .composer-card .composer-header { border-bottom-color: rgba(120,126,140,.26); }
    .stage-empty {
      border: 1px dashed rgba(255,255,255,.2);
      background: rgba(255,255,255,.04);
      border-radius: 12px;
      padding: 30px 18px;
      text-align: center;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--stage-ink-sub);
    }
    .stage-empty strong { display: block; margin-bottom: 4px; color: #eef0f7; font-size: 13.5px; }

    /* ===== 주제별 책장 + 스프링 노트북 뷰 ===== */
    .nb-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: 20px;
      padding: 20px 22px 24px;
      color: #e8ebf4;
      background:
        radial-gradient(120% 90% at 50% -10%, rgba(128,138,182,.38) 0%, rgba(128,138,182,0) 62%),
        linear-gradient(168deg, #383f5b 0%, #2d334b 54%, #262b40 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 16px 34px rgba(28,32,48,.22);
      overflow: hidden;
    }
    .nb-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 26px 26px;
      opacity: .5;
      pointer-events: none;
    }
    .nb-stage > * { position: relative; z-index: 1; }
    .nb-stage-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .nb-stage-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .nb-stage-sub { font-size: 11.5px; color: rgba(232,235,244,.6); margin-top: 3px; line-height: 1.5; }
    .nb-stage-count {
      flex-shrink: 0;
      font-size: 11.5px; font-weight: 600; color: rgba(232,235,244,.86);
      border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08);
      border-radius: 999px; padding: 4px 10px; white-space: nowrap;
    }

    /* 책장 */
    .nb-shelf { position: relative; display: flex; align-items: center; gap: 4px; padding: 0; }
    .nb-shelf-track {
      display: grid;
      grid-template-columns: repeat(5, 176px);
      justify-content: center;
      align-items: end;
      gap: 14px;
      width: 100%; min-width: 0; overflow: hidden;
      padding: 26px 0 24px;
      touch-action: pan-y;
      cursor: grab;
      user-select: none; -webkit-user-select: none;
    }
    .nb-slot-empty { display: block; }
    .nb-shelf-track.dragging { cursor: grabbing; }
    .nb-shelf-rail {
      position: absolute; left: 4%; right: 4%; bottom: 12px; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.16) 18%, rgba(255,255,255,.16) 82%, rgba(255,255,255,0));
      pointer-events: none;
    }
    .nb-cover-btn {
      flex: 0 0 auto; background: none; border: 0; padding: 0; cursor: pointer;
      transition: transform .26s ease, filter .26s ease;
      transform: translateY(8px) scale(.86);
      filter: brightness(.68) saturate(.85);
      transform-origin: bottom center;
    }
    .nb-cover-btn.is-active { transform: translateY(-6px) scale(1); filter: none; }
    .nb-cover-btn:hover { filter: brightness(1) saturate(1); }
    .nb-cover {
      position: relative; display: block;
      width: 176px; height: 246px;
      border-radius: 3px 8px 8px 3px;
      background: linear-gradient(160deg, rgba(255,255,255,.26), rgba(0,0,0,.22)), var(--spine, #2f3e5c);
      box-shadow: 0 12px 22px rgba(10,13,22,.42), 0 1px 0 rgba(255,255,255,.22) inset;
      overflow: hidden;
    }
    .nb-cover-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .nb-cover-label {
      position: absolute; left: 26px; right: 16px; top: 30px;
      background: rgba(252,251,247,.95); border-radius: 3px;
      padding: 12px 11px 13px; box-shadow: 0 2px 6px rgba(0,0,0,.16);
      text-align: left;
    }
    .nb-cover-label b {
      font-size: 15px; line-height: 1.35; letter-spacing: -0.02em; font-weight: 700;
      color: #23262d; word-break: keep-all;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
    .nb-cover-label span { display: block; margin-top: 7px; font-size: 10.5px; letter-spacing: .04em; color: #767a84; }
    .nb-cover-plate {
      position: absolute; left: 24px; right: 12px; bottom: 12px;
      background: rgba(18,21,30,.62); color: #fff; border-radius: 3px;
      padding: 6px 8px; font-size: 11.5px; font-weight: 600; line-height: 1.3;
      text-align: left; word-break: keep-all;
    }
    .nb-cover-spine {
      position: absolute; left: 0; top: 0; bottom: 0; width: 13px;
      background: linear-gradient(90deg, rgba(0,0,0,.32), rgba(255,255,255,.12) 55%, rgba(0,0,0,.18)), var(--spine, #2f3e5c);
      box-shadow: inset -1px 0 0 rgba(0,0,0,.22);
    }
    .nb-cover-shine {
      position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(104deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,0) 34%, rgba(0,0,0,.16) 100%);
    }
    .nb-cover-chip {
      position: absolute; right: 9px; top: 9px; font-size: 10px; font-weight: 700;
      color: rgba(255,255,255,.92); background: rgba(18,21,30,.45);
      border-radius: 999px; padding: 2px 6px; letter-spacing: .02em;
    }
    .nb-shelf-empty { text-align: center; padding: 46px 16px 40px; }
    .nb-shelf-empty h3 { margin: 0 0 6px; font-size: 16px; }
    .nb-shelf-empty p { margin: 0 0 16px; font-size: 12.5px; color: rgba(232,235,244,.66); line-height: 1.6; }

    .nb-stage--shelf { padding: 22px 16px 20px; justify-content: center; }
    .nb-book-meta { text-align: center; padding: 0 0 2px; }
    .nb-book-meta h3 {
      margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .nb-book-info { margin-top: 5px; font-size: 12.5px; color: rgba(232,235,244,.62); }
    .nb-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 20px; margin-top: 18px; }
    .nb-action {
      display: flex; flex-direction: column; align-items: center; gap: 7px;
      background: none; border: 0; padding: 0; cursor: pointer;
      color: rgba(232,235,244,.88); font-size: 11px; font-weight: 600; letter-spacing: -0.01em;
      font-family: inherit;
    }
    .nb-action-icon {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.16);
      transition: background .16s ease, transform .16s ease;
    }
    .nb-action:hover .nb-action-icon { background: rgba(255,255,255,.2); transform: translateY(-1px); }
    .nb-action.primary .nb-action-icon { background: #f6f7fb; border-color: #f6f7fb; color: #2b3145; }
    .nb-action.primary:hover .nb-action-icon { background: #ffffff; }

    /* 펼친 노트 */
    .nb-reader-head {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .nb-back {
      justify-self: start;
      display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px 0 8px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
      color: #e8ebf4; font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .nb-back:hover { background: rgba(255,255,255,.17); }
    .nb-reader-head .nb-stage-count { justify-self: end; }
    .nb-reader-title { text-align: center; min-width: 0; justify-self: center; }
    .nb-reader-title b { display: block; font-size: 16px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb-reader-title span { display: block; margin-top: 2px; font-size: 11px; color: rgba(232,235,244,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb-book { position: relative; display: flex; align-items: center; justify-content: center; padding: 16px 46px 4px; }

    .nb-page--right {

      background: linear-gradient(90deg, rgba(24,28,40,.18), rgba(24,28,40,.02) 30%, rgba(255,255,255,.32) 50%, rgba(24,28,40,.02) 70%, rgba(24,28,40,.18));
    }
    .nb-rings {
      position: absolute; left: 50%; top: 12px; bottom: 12px; width: 34px; z-index: 4;
      transform: translateX(-50%); pointer-events: none;
      background-image: repeating-linear-gradient(to bottom,
        rgba(255,255,255,0) 0 9px,
        rgba(249,250,252,.98) 9px 14px,
        rgba(150,156,170,.95) 14px 18px,
        rgba(255,255,255,0) 18px 30px);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 5%, #000 95%, transparent);

    .nb-page-inner { display: flex; flex-direction: column; gap: 14px; min-height: 100%; }

      padding-top: 14px;
      text-align: center;
      font-size: 10px;

    .nb-photo-frame {

    .nb-photo-tape {

    }

      box-shadow: 0 2px 6px rgba(20,24,32,.12);
    }
    .nb-photo-zoom:hover { background: #fff; color: #23262d; }
    .nb-photo-frame { cursor: default; }
    .nb-thumbs { display: flex; gap: 7px; flex-wrap: wrap; }

      width: 40px; height: 40px; border-radius: 4px; overflow: hidden; padding: 0;
      border: 1px solid rgba(120,126,140,.28); background: #fff; cursor: pointer;
    }

    .nb-visual {

      background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,250,240,.55));

    .nb-visual-icon { color: #5b6478; opacity: .9; }
    .nb-visual-date { font-family: Georgia, "Times New Roman", serif; font-size: 36px; letter-spacing: .02em; color: #3a4152; }
    .nb-visual-sub { font-size: 11.5px; color: #8a8e98; letter-spacing: .04em; }
    .nb-visual-rule { width: 40px; height: 1px; background: rgba(120,126,140,.38); margin: 4px 0; }
    .nb-visual-cat { font-size: 10.5px; font-weight: 600; letter-spacing: .18em; color: #7d818b; text-transform: uppercase; }
    .nb-stamps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; }
    .nb-stamp {
      display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
      border: 1.5px solid rgba(43,76,126,.5); border-radius: 4px;
      padding: 5px 9px; color: #2b4c7e; transform: rotate(-2deg);
      font-family: Georgia, "Times New Roman", serif;
    }
    .nb-stamp b { font-size: 12.5px; letter-spacing: .05em; font-weight: 700; }
    .nb-stamp span { font-size: 8.5px; letter-spacing: .14em; }
    .nb-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; color: #4a5162;
      background: rgba(120,126,140,.12); border-radius: 999px; padding: 4px 9px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nb-badge svg { flex-shrink: 0; }
    .nb-badge--ghost { background: transparent; border: 1px dashed rgba(120,126,140,.42); color: #6b707a; }
    .nb-note-title { margin: 0 0 6px; font-size: 23px; line-height: 1.4; font-weight: 700; letter-spacing: -0.02em; color: #23262d; word-break: keep-all; }
    .nb-note-sub { font-size: 12px; color: #82868f; letter-spacing: .01em; }
    .nb-note-rule { height: 1px; margin: 14px 0 16px; background: linear-gradient(90deg, rgba(120,126,140,.42), rgba(120,126,140,0)); }
    .nb-note-body { font-size: 14.5px; line-height: 2.05; color: #3b404a; white-space: pre-wrap; word-break: break-word; letter-spacing: -0.004em; }
    .nb-note-empty { color: #a0a4ad; font-size: 12.5px; }
    .nb-guide { align-items: center; justify-content: center; text-align: center; gap: 12px; }
    .nb-guide-plus {
      width: 58px; height: 58px; border-radius: 50%; cursor: pointer;
      border: 1.5px dashed rgba(90,98,116,.45); background: rgba(255,255,255,.5);
      color: #3a4152; display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .nb-guide-plus:hover { background: #fff; }
    .nb-guide-title { font-size: 15.5px; font-weight: 700; color: #2b2f37; letter-spacing: -0.01em; }
    .nb-guide-sub { margin: 0; font-size: 12px; line-height: 1.75; color: #7d818b; max-width: 260px; }
    .nb-summary-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #2b2f37; }
    .nb-summary-list { list-style: none; margin: 4px 0 6px; padding: 0; display: flex; flex-direction: column; gap: 9px; }
    .nb-summary-list li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12px; color: #7d818b; border-bottom: 1px dashed rgba(120,126,140,.28); padding-bottom: 8px; }
    .nb-summary-list b { font-size: 12.5px; color: #33383f; font-weight: 700; }
    .nb-side-toggle { display: none; }

    /* ===== v2.9 책자 인덱스 탭 · 페이지 넘김 ===== */
    .nb-reader-spacer { display: block; }
    .nb-head-btn {
      justify-self: end;
      display: inline-flex; align-items: center; gap: 5px;
      height: 30px; padding: 0 11px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
      color: #e8ebf4; font-size: 11.5px; font-weight: 600; font-family: inherit; cursor: pointer;
      white-space: nowrap;
    }
    .nb-head-btn:hover { background: rgba(255,255,255,.17); }
    .nb-book--indexed { padding-right: 66px; }
    .idx-tabs {
      position: absolute; top: 50%; right: 2px; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
      z-index: 7; max-height: calc(100% - 26px);
    }
    .idx-tab {
      --tab-color: #5b7fb4;
      display: flex; align-items: center; justify-content: center;
      width: 30px; min-height: 46px; padding: 9px 0;
      border: 0; border-radius: 0 8px 8px 0;
      background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,0) 55%), var(--tab-color);
      color: rgba(255,255,255,.94); font-family: inherit;
      font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
      writing-mode: vertical-rl; text-orientation: upright;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      box-shadow: 1px 2px 6px rgba(10,14,24,.34), inset 0 1px 0 rgba(255,255,255,.26);
      transition: width .2s ease, transform .2s ease, filter .2s ease;
    }
    .idx-tab span { writing-mode: vertical-rl; text-orientation: upright; }
    .idx-tab:hover { transform: translateX(-2px); filter: brightness(1.08); }
    .idx-tab.is-active {
      width: 37px; transform: translateX(-5px);
      filter: brightness(1.14) saturate(1.08);
      box-shadow: 1px 4px 12px rgba(10,14,24,.46), inset 0 1px 0 rgba(255,255,255,.34);
    }
    .idx-tab--q1 { --tab-color: #3f6599; }
    .idx-tab--q2 { --tab-color: #7d8aa3; }
    .idx-tab--q3 { --tab-color: #a86a76; }
    .idx-tab--q4 { --tab-color: #6d8a6b; }

    @keyframes pageOutNext {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to   { opacity: 0; transform: translateX(-46px) scale(.988); }
    }
    @keyframes pageOutPrev {
      from { opacity: 1; transform: translateX(0) scale(1); }
      to   { opacity: 0; transform: translateX(46px) scale(.988); }
    }
    @keyframes pageInNext {
      from { opacity: 0; transform: translateX(58px) scale(.988); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes pageInPrev {
      from { opacity: 0; transform: translateX(-58px) scale(.988); }
      to   { opacity: 1; transform: translateX(0) scale(1); }
    }
    .page-out-next { animation: pageOutNext .14s ease-in forwards; pointer-events: none; }
    .page-out-prev { animation: pageOutPrev .14s ease-in forwards; pointer-events: none; }
    .page-in-next { animation: pageInNext .32s cubic-bezier(.22,.75,.28,1) both; }
    .page-in-prev { animation: pageInPrev .32s cubic-bezier(.22,.75,.28,1) both; }

    @keyframes shelfInNext {
      from { opacity: 0; transform: translateX(86px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes shelfInPrev {
      from { opacity: 0; transform: translateX(-86px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .shelf-in-next { animation: shelfInNext .34s cubic-bezier(.22,.75,.28,1) both; }
    .shelf-in-prev { animation: shelfInPrev .34s cubic-bezier(.22,.75,.28,1) both; }

    /* ===== 목표 · 버킷 책자 ===== */
    .gb-head { display: flex; align-items: flex-start; gap: 10px; }

      margin: 2px 0 0; font-family: Georgia, "Times New Roman", serif;

    .gb-list { display: flex; flex-direction: column; }

    .nb-month-empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 10px; text-align: center; }
    .nb-month-empty p { margin: 0; font-size: 12.5px; color: #8d929b; }

    @keyframes nbFlipFromRight {
      from { opacity: .25; transform: perspective(1200px) rotateY(-16deg) translateX(26px); }

      to   { opacity: 1; transform: none; }
    }
    @keyframes nbFlipFromLeft {

      .paper { padding: 15px 16px; margin-bottom: 12px; }

      .fab { right: 16px; bottom: calc(78px + env(safe-area-inset-bottom)); width: 56px; height: 56px; }

      .composer-actions { margin-left: auto; }

    }

</head>

  function resolveIconKey(val, fallback = "target") {
    if (!val) return fallback;
    if (PICTOGRAMS[val]) return val;
    if (EMOJI_TO_ICON_KEY[val]) return EMOJI_TO_ICON_KEY[val];
    return fallback;
  }

  function renderPictogram(iconKey, size = 14) {
    const key = resolveIconKey(iconKey, "target");
    const item = PICTOGRAMS[key] || PICTOGRAMS.target;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${item.paths}</svg>`;

            ${renderPictogram(k, 16)}

        `).join("")}

  const FIXED_SOLAR_HOLIDAYS = {
    "01-01": "신정",
    "03-01": "삼일절",
    "05-05": "어린이날",
    "06-06": "현충일",

  const lunarFormatter = new Intl.DateTimeFormat("ko-KR-u-ca-chinese", {
    month: "numeric",
    day: "numeric"
  });

  function getLunarMonthDay(dateObj) {
    try {
      const parts = lunarFormatter.formatToParts(dateObj);
      const monthPart = parts.find(p => p.type === "month");
      const dayPart = parts.find(p => p.type === "day");
      const mPart = (monthPart && monthPart.value) || "";
      const dPart = (dayPart && dayPart.value) || "";
      const isLeap = mPart.includes("윤");
      const month = parseInt(mPart.replace(/[^0-9]/g, ""), 10);
      const day = parseInt(dPart.replace(/[^0-9]/g, ""), 10);
      return { month, day, isLeap };
    } catch (_) {
      return null;
    }
  }

  function buildHolidayMap(years) {
    const map = {};
    const addName = (ds, name) => {
      if (!map[ds]) map[ds] = name;
      else if (!map[ds].includes(name)) map[ds] += ` · ${name}`;
    };

    years.forEach(year => {
      const start = new Date(year - 1, 11, 25);
      const end = new Date(year + 1, 0, 5);
      for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
        const y = dt.getFullYear();
        const m = dt.getMonth() + 1;
        const d = dt.getDate();
        const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const md = `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        if (y === year && FIXED_SOLAR_HOLIDAYS[md]) {
          addName(ds, FIXED_SOLAR_HOLIDAYS[md]);
        }

        const lunar = getLunarMonthDay(dt);
        if (lunar && !lunar.isLeap) {
          if (lunar.month === 1 && lunar.day === 1) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "설날 연휴");
            if (y === year) addName(ds, "설날");
            if (next.getFullYear() === year) addName(nStr, "설날 연휴");
          }
          if (y === year && lunar.month === 4 && lunar.day === 8) {
            addName(ds, "부처님오신날");
          }
          if (lunar.month === 8 && lunar.day === 15) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "추석 연휴");
            if (y === year) addName(ds, "추석");
            if (next.getFullYear() === year) addName(nStr, "추석 연휴");
          }
        }
      }

      const subTargets = new Set(["설날 연휴", "설날", "추석 연휴", "추석", "삼일절", "어린이날", "부처님오신날", "광복절", "개천절", "한글날", "크리스마스"]);
      const yearDates = Object.keys(map).filter(k => k.startsWith(`${year}-`)).sort();
      yearDates.forEach(ds => {
        const [yy, mm, dd] = ds.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        const dow = dt.getDay();
        const names = map[ds].split(" · ");
        const isSeolOrChuseok = names.some(n => n.includes("설날") || n.includes("추석"));
        const isOtherSub = names.some(n => subTargets.has(n) && !n.includes("설날") && !n.includes("추석"));
        const hasOverlap = names.length > 1;

        if ((isSeolOrChuseok && (dow === 0 || hasOverlap)) || (isOtherSub && (dow === 0 || dow === 6 || hasOverlap))) {
          const cursor = new Date(dt);
          while (true) {
            cursor.setDate(cursor.getDate() + 1);
            const cStr = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}-${String(cursor.getDate()).padStart(2, "0")}`;
            const cDow = cursor.getDay();
            if (cDow !== 0 && cDow !== 6 && !map[cStr]) {
              if (cursor.getFullYear() === year) {
                map[cStr] = "대체공휴일";
              }
              break;
            }
          }
        }
      });
    });

    return map;
  }

  function turnToPage(dir, mutate) {
    const step = dir > 0 ? 1 : -1;
    const spread = document.querySelector(".nb-spread");
    if (!spread || prefersReducedMotion()) {
      mutate();
      render();
      return;
    }
    if (spread.dataset.turning === "1") return;
    spread.dataset.turning = "1";
    spread.classList.add(step > 0 ? "page-out-next" : "page-out-prev");
    clearTimeout(turnTimer);
    turnTimer = setTimeout(() => {
      mutate();
      pendingTurnDir = step;
      render();
    }, 140);
  }

  function applyPendingTurnAnimation() {
    if (pendingShelfDir) {
      const sdir = pendingShelfDir;
      pendingShelfDir = 0;
      const track = document.getElementById("nbShelfTrack") || document.getElementById("nbYearShelfTrack");
      if (track) {
        track.classList.add(sdir > 0 ? "shelf-in-next" : "shelf-in-prev");
        setTimeout(() => track.classList.remove("shelf-in-next", "shelf-in-prev"), 460);
      }
    }
    if (!pendingTurnDir) return;
    const tdir = pendingTurnDir;
    pendingTurnDir = 0;
    const spread = document.querySelector(".nb-spread");
    const target = spread || document.querySelector(".day-stack");
    if (!target) return;
    target.classList.add(tdir > 0 ? "page-in-next" : "page-in-prev");
    setTimeout(() => target.classList.remove("page-in-next", "page-in-prev"), 460);
  }

  function shelfTurnTo(dir, mutate, originX) {
    const step = dir > 0 ? 1 : -1;
    const track = document.getElementById("nbShelfTrack") || document.getElementById("nbYearShelfTrack");
    if (!track || prefersReducedMotion()) {
      mutate();
      render();
      return;
    }
    if (track.dataset.turning === "1") return;
    track.dataset.turning = "1";
    const base = Number(originX) || 0;
    const shift = -step * Math.max(72, Math.abs(base) + 34);
    track.style.transition = "transform .17s cubic-bezier(.42,0,.58,1), opacity .17s ease";
    track.style.transform = `translateX(${base + shift}px)`;
    track.style.opacity = ".28";
    clearTimeout(turnTimer);
    turnTimer = setTimeout(() => {
      mutate();
      pendingShelfDir = step;
      render();
    }, 165);
  }

  function normalizeCategoryList(list, fallbackIcon = "target") {
    if (!Array.isArray(list)) return [];
    const seen = new Set();
    return list.map(item => {
      if (typeof item === "string") return { name: item, icon: fallbackIcon };
      const name = String(item && item.name ? item.name : "").trim();
      const rawIcon = (item && (item.icon || item.emoji)) || fallbackIcon;
      return { name, icon: resolveIconKey(rawIcon, fallbackIcon) };

      if (!x.name || seen.has(x.name)) return false;
