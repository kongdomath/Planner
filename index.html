<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아카이브 & 플래너" />
  <title>아카이브 & 플래너 · Editorial Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f7f4;
      --surface: #ffffff;
      --surface-warm: #f3f1ec;
      --surface-subtle: #efede7;
      --border: #e6e3dc;
      --border-strong: #d5d1c8;
      --text: #1c1c1e;
      --text-sub: #6e6d68;
      --text-muted: #9c9a94;
      --accent: #2c3e35;       /* 딥 세이지 차콜 */
      --accent-soft: #eef2ef;
      --accent-warm: #8c6239;  /* 테라코타 브라운 */
      --accent-navy: #243447;  /* 에디토리얼 네이비 */
      --sat: #3b6ea5;
      --sun: #b84a4a;
      --serif: "Cormorant Garamond", "Noto Serif KR", Georgia, serif;
      --sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* 레이아웃 셸 */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 28px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .brand {
      padding: 0 10px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .brand-eyebrow {
      font-family: var(--serif);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      display: block;
      margin-bottom: 2px;
    }
    .brand h1 {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .brand p {
      font-size: 11.5px;
      color: var(--text-sub);
      margin: 6px 0 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      text-align: left;
      transition: all 0.16s ease;
    }
    .nav-btn:hover { background: var(--surface-warm); color: var(--text); }
    .nav-btn.active {
      background: var(--text);
      color: #fff;
      font-weight: 600;
    }
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .main {
      flex: 1;
      padding: 32px 36px 96px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      min-width: 0;
    }

    /* 상단 헤더 (Editorial Topbar) */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 22px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .page-eyebrow {
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .page-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .page-title {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
    }

    /* 입력 & 버튼 기본 스타일 */
    select, input[type="text"], input[type="date"], textarea {
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 0 12px;
      height: 36px;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea {
      height: auto;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.65;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--text);
    }
    .search-input {
      min-width: 210px;
      background: var(--surface);
    }
    .year-select {
      font-weight: 600;
      cursor: pointer;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--surface-warm); border-color: var(--border-strong); }
    .btn-primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .btn-primary:hover { opacity: 0.88; background: var(--text); }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
    .btn-nav-arrow { width: 36px; padding: 0; }

    .segmented {
      display: inline-flex;
      align-items: center;
      height: 36px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 3px;
    }
    .segmented button {
      border: none;
      background: transparent;
      height: 28px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .segmented button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 7px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 0;
    }
    .icon-btn:hover { background: var(--surface-warm); color: var(--text); }
    .icon-btn.danger:hover { color: var(--sun); border-color: #fecaca; background: #fef2f2; }

    .reveal-actions {
      display: none;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .reveal-actions.visible { display: inline-flex; }
    .clickable-label { cursor: pointer; user-select: none; }
    .clickable-label:hover { opacity: 0.78; }

    /* 에디토리얼 카드 & 요약 바 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 18px;
    }
    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-bottom: 18px;
    }
    .summary-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .summary-metrics strong {
      color: var(--text);
      font-family: var(--serif);
      font-size: 16px;
      margin-left: 3px;
    }
    .progress-track {
      width: 160px;
      height: 6px;
      background: var(--surface-subtle);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      transition: width 0.28s ease;
    }

    /* 필터 칩 바 */
    .filter-bar-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .chip-wrap {
      display: inline-flex;
      align-items: center;
      height: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: all 0.15s;
    }
    .chip-wrap.expanded { padding-right: 4px; }
    .chip-wrap.active { background: var(--text); border-color: var(--text); }
    .chip-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 999px;
      height: 32px;
      padding: 0 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip-wrap .chip-btn { border: none; background: transparent; }
    .chip-wrap.expanded .chip-btn { padding-right: 6px; }
    .chip-btn:hover { background: var(--surface-warm); color: var(--text); }
    .chip-wrap .chip-btn:hover { background: transparent; }
    .chip-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
    .chip-wrap.active .chip-btn { background: transparent; color: #fff; }
    .chip-actions { display: none; align-items: center; gap: 2px; }
    .chip-wrap.expanded .chip-actions { display: inline-flex; }
    .chip-action-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .chip-wrap.active .chip-action-btn { color: rgba(255,255,255,0.85); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-warm);
      color: var(--text-sub);
    }

    /* =========================================================
       2. 모듈형 블록 에디터 (repov / 기부니북 레퍼런스 응용)
       ========================================================= */
    .block-composer {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 22px 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(28, 28, 30, 0.04);
    }
    .composer-top-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .composer-title-input {
      width: 100%;
      border: none !important;
      background: transparent !important;
      font-family: var(--serif);
      font-size: 22px !important;
      font-weight: 700;
      height: auto !important;
      padding: 4px 0 !important;
      margin-bottom: 14px;
      color: var(--text);
    }
    .composer-title-input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 스테이지 스텝퍼 (IMG_7965 레퍼런스: 시작 -> 궤도 진입 -> 반환점 -> 달성) */
    .stage-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 10px 6px 6px;
      margin: 8px 0 16px;
    }
    .stage-stepper::before {
      content: "";
      position: absolute;
      top: 17px;
      left: 24px;
      right: 24px;
      height: 1.5px;
      background: var(--border);
      z-index: 0;
    }
    .stage-step-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 0;
    }
    .stage-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border-strong);
      transition: all 0.16s ease;
    }
    .stage-step-btn.passed .stage-dot {
      background: var(--accent);
      border-color: var(--accent);
    }
    .stage-step-btn.current .stage-dot {
      width: 18px;
      height: 18px;
      margin-top: -2px;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .stage-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .stage-step-btn.passed .stage-label,
    .stage-step-btn.current .stage-label {
      color: var(--text);
    }

    /* 조립식 블록 컨테이너 & 플로팅 블록 칩 */
    .active-blocks-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .modular-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 14px;
      animation: blockAppear 0.16s ease-out;
    }
    @keyframes blockAppear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modular-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .modular-block-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .block-remove-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }
    .block-remove-btn:hover { color: var(--sun); }
    .modular-block input[type="text"],
    .modular-block textarea {
      background: var(--surface);
      width: 100%;
    }
    .quote-input {
      font-family: var(--serif);
      font-size: 15px !important;
      font-style: italic;
    }

    /* 별점/만족도 도트 선택기 */
    .rating-dots {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .rating-dot-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-family: var(--serif);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.14s;
    }
    .rating-dot-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* 하단 블록 추가 칩 팔레트 (IMG_7967 우측 알약 버튼 영감) */
    .block-palette {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }
    .block-palette-title {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .block-add-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 29px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s;
    }
    .block-add-chip:hover {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .block-add-chip.added {
      background: var(--surface-subtle);
      color: var(--text-muted);
      border-color: var(--border);
    }

    /* =========================================================
       3. 통합 목표 카드 & 아티팩트 뷰 (IMG_7965 + IMG_7968 응용)
       ========================================================= */
    .goals-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .goal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.16s, transform 0.16s;
    }
    .goal-card:hover { border-color: var(--border-strong); }
    .goal-card.done { background: #fbfaf7; }
    .goal-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .goal-card-title {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 700;
      margin: 0;
      line-height: 1.35;
      color: var(--text);
    }
    .goal-card.done .goal-card-title {
      color: var(--text-sub);
    }
    .goal-quote-box {
      font-family: var(--serif);
      font-size: 14.5px;
      color: var(--text);
      background: var(--bg);
      border-left: 2px solid var(--accent);
      padding: 8px 12px;
      border-radius: 0 8px 8px 0;
    }
    .goal-note-preview {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.6;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .goal-card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--text-sub);
    }

    /* =========================================================
       4. 에디토리얼 아카이브 컬렉션 & 아티팩트 티켓 (IMG_7968, 7969, 7954)
       ========================================================= */
    .archive-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .editorial-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .editorial-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(28, 28, 30, 0.05);
    }
    .editorial-cover {
      width: 100%;
      height: 220px;
      background: var(--surface-warm);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border);
    }
    .editorial-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 사진이 없을 때 감도 높은 타이포그래피 북/매거진 커버 자동 조판 */
    .typo-cover {
      width: 100%;
      height: 100%;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(160deg, #f5f3ed 0%, #eae6dc 100%);
      color: var(--text);
    }
    .typo-cover-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--serif);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-sub);
    }
    .typo-cover-title {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 700;
      line-height: 1.3;
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .typo-cover-foot {
      font-size: 11.5px;
      color: var(--text-sub);
      border-top: 1px solid rgba(28, 28, 30, 0.12);
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
    }
    .photo-count-badge {
      position: absolute;
      right: 12px;
      bottom: 12px;
      background: rgba(28, 28, 30, 0.72);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }
    .editorial-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .editorial-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 26px;
    }
    .editorial-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      line-height: 1.35;
    }
    .editorial-sub {
      font-size: 12px;
      color: var(--text-sub);
    }
    .editorial-quote {
      font-family: var(--serif);
      font-size: 13.5px;
      color: var(--text);
      padding: 6px 10px;
      background: var(--bg);
      border-left: 2px solid var(--accent-warm);
      border-radius: 0 6px 6px 0;
    }
    .editorial-note {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.6;
      white-space: pre-line;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* 아티팩트 티켓 모달 (IMG_7968 repov 티켓 영감) */
    .artifact-ticket {
      background: #f5f2eb;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      padding: 24px 22px;
      position: relative;
      margin-bottom: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    }
    .artifact-ticket::before,
    .artifact-ticket::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      transform: translateY(-50%);
    }
    .artifact-ticket::before { left: -10px; }
    .artifact-ticket::after { right: -10px; }
    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--serif);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-sub);
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-strong);
      margin-bottom: 16px;
    }
    .ticket-title {
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px;
      line-height: 1.3;
    }
    .ticket-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px 0;
      margin: 14px 0;
      border-top: 1px solid var(--border-strong);
      border-bottom: 1px solid var(--border-strong);
      font-size: 12.5px;
    }
    .ticket-cell span {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .ticket-cell strong {
      font-family: var(--serif);
      font-size: 15px;
    }

    /* =========================================================
       1년 연력 & 비주얼 캘린더 (IMG_7971, IMG_7970 응용)
       ========================================================= */
    .year-block { margin-bottom: 32px; }
    .year-heading {
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .matrix-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      max-height: 75vh;
      overflow-y: auto;
    }
    table.year-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.year-table th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--surface-warm);
      font-family: var(--serif);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
    }
    table.year-table th.day-axis-col,
    table.year-table td.day-axis-cell {
      position: sticky;
      left: 0;
      z-index: 3;
      width: 44px;
      background: var(--surface-warm);
      text-align: center;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: default;
      vertical-align: middle;
    }
    table.year-table th.day-axis-col { z-index: 5; }
    table.year-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 6px 7px;
      vertical-align: top;
      height: 54px;
      cursor: pointer;
      transition: background 0.12s;
    }
    table.year-table td:hover:not(.empty-cell):not(.day-axis-cell) { background: var(--surface-warm); }
    table.year-table td.empty-cell { background: var(--bg); cursor: default; }
    table.year-table td.weekend-bg { background: #fcfbf9; }
    table.year-table td.selected-day { outline: 2px solid var(--text); outline-offset: -2px; background: var(--surface-warm); }
    table.year-table td.today-cell { background: #fdf8eb; }
    .cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .day-num { color: var(--text-sub); }
    .day-num.sat { color: var(--sat); }
    .day-num.sun, .day-num.holiday { color: var(--sun); }
    .cell-badges { display: flex; gap: 3px; align-items: center; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cell-line {
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }
    .cell-line.holiday-label { color: var(--sun); font-weight: 600; opacity: 0.88; }

    /* 비주얼 월간 무드보드 캘린더 (IMG_7970 사진 썸네일 + 도트 캘린더) */
    .month-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .month-jump-bar { display: flex; flex-wrap: wrap; gap: 4px; }
    .month-jump-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .month-jump-btn:hover { background: var(--surface-warm); color: var(--text); }
    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    .month-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .month-card-title {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
    }
    .month-card-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--surface-warm);
      padding: 2px 9px;
      border-radius: 999px;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .cal-weekdays span:first-child { color: var(--sun); }
    .cal-weekdays span:last-child { color: var(--sat); }
    .cal-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }
    .cal-day-cell {
      aspect-ratio: 1 / 1.12;
      border-radius: 8px;
      padding: 4px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
      transition: transform 0.12s;
    }
    .cal-day-cell:hover { transform: scale(1.04); border-color: var(--border-strong); }
    .cal-day-cell.has-record { background: var(--bg); border-color: var(--border); }
    .cal-day-cell.has-photo {
      background-size: cover;
      background-position: center;
      border-color: transparent;
    }
    .cal-day-cell.has-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.38), rgba(0,0,0,0.12));
    }
    .cal-day-cell.has-photo .cal-day-num {
      color: #fff !important;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .cal-day-cell.selected-day { outline: 2px solid var(--text); outline-offset: -1px; }
    .cal-day-cell.today-cell { background: #fdf8eb; border-color: #d4b46a; }
    .cal-day-num {
      font-size: 11.5px;
      font-weight: 700;
      line-height: 1.2;
    }
    .cal-day-mini {
      font-size: 9px;
      color: var(--text-sub);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
      position: relative;
      z-index: 1;
    }
    .cal-day-mini.holiday-label { color: var(--sun); }
    .month-highlights {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .highlight-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .highlight-row:hover { background: var(--surface-warm); }

    /* 하루 기록 · 일기 뷰 */
    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }
    .diary-date-badge {
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700;
    }
    textarea.diary-area {
      width: 100%;
      min-height: 300px;
      resize: vertical;
      line-height: 1.8;
      padding: 16px;
      background: var(--bg);
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
    }
    .list-item.done .item-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .chk {
      width: 17px;
      height: 17px;
      margin-top: 3px;
      cursor: pointer;
      accent-color: var(--text);
      flex-shrink: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .item-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 5px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .done-date-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }
    .done-date-inline input[type="date"] {
      font-size: 11px;
      height: 26px;
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* 썸네일 & 픽토그램 피커 */
    .img-preview-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .thumb-wrap { position: relative; display: inline-flex; }
    .thumb-wrap img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .thumb-del-btn {
      position: absolute;
      top: -5px;
      right: -5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: none;
      background: var(--text);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .cat-add-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .icon-picker-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .icon-pick-btn {
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-pick-btn.selected {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* 검색 패널 */
    .search-panel {
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 22px;
    }
    .search-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }
    .search-result-item {
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      background: var(--bg);
    }
    .search-result-item:hover { background: var(--surface-warm); }

    /* 모달 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 28, 30, 0.42);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 18px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid var(--border);
    }
    .modal h3 {
      font-family: var(--serif);
      margin: 0 0 16px;
      font-size: 19px;
    }
    .modal-field { margin-bottom: 13px; display: flex; flex-direction: column; gap: 5px; }
    .modal-field label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .modal-gallery {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .modal-gallery img {
      width: 100%;
      max-height: 340px;
      object-fit: contain;
      border-radius: 10px;
      background: var(--surface-warm);
    }

    /* 모바일 하단 내비게이션 (5개 핵심 탭) */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      padding: 7px 6px;
      z-index: 40;
      justify-content: space-around;
    }
    .mobile-nav button {
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 5px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .mobile-nav button.active { color: var(--text); }

    @media (max-width: 1060px) {
      .months-grid, .archive-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 860px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .main { padding: 20px 16px 90px; }
      .grid-2, .goals-grid, .months-grid, .archive-grid { grid-template-columns: 1fr; }
      .search-input { min-width: 150px; flex: 1; }
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-eyebrow">Personal Journal & Archive</span>
      <h1>Archive & Planner</h1>
      <p id="sidebarDateLabel"></p>
    </div>
    <button class="nav-btn active" data-tab="year"><span class="nav-icon" id="navIconYear"></span>1년 연력</button>
    <button class="nav-btn" data-tab="diary"><span class="nav-icon" id="navIconDiary"></span>하루 기록 · 일기</button>
    <button class="nav-btn" data-tab="goals"><span class="nav-icon" id="navIconGoals"></span>목표</button>
    <button class="nav-btn" data-tab="bucket"><span class="nav-icon" id="navIconBucket"></span>버킷리스트</button>
    <button class="nav-btn" data-tab="archive"><span class="nav-icon" id="navIconArchive"></span>아카이브</button>
    <div class="sidebar-footer">
      <button class="btn" onclick="clearSamples()">예시 지우기</button>
      <button class="btn" onclick="exportBackup()">데이터 백업 (JSON)</button>
      <label class="btn" style="cursor:pointer;">
        백업 복원
        <input type="file" accept=".json" style="display:none" onchange="importBackup(event)" />
      </label>
    </div>
  </aside>

  <main class="main" id="mainView"></main>
</div>

<nav class="mobile-nav" id="mobileNav">
  <button class="active" data-tab="year"><span class="nav-icon" id="mIconYear"></span>연력</button>
  <button data-tab="diary"><span class="nav-icon" id="mIconDiary"></span>일기</button>
  <button data-tab="goals"><span class="nav-icon" id="mIconGoals"></span>목표</button>
  <button data-tab="bucket"><span class="nav-icon" id="mIconBucket"></span>버킷</button>
  <button data-tab="archive"><span class="nav-icon" id="mIconArchive"></span>아카이브</button>
</nav>

<div class="modal-backdrop" id="editModal" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <h3 id="modalTitle">항목</h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions">
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modalSaveBtn">저장</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "personal_archive_planner_v8";
  const YEARS = [2026, 2027, 2028, 2029, 2030];
  const PERIODS = ["연간", "상반기", "하반기", "1분기", "2분기", "3분기", "4분기"];
  const GOAL_STAGES = ["시작", "궤도 진입", "반환점", "달성"];

  function getSystemTodayStr() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  const TODAY_STR = getSystemTodayStr();

  const ICONS = {
    year: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    diary: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="14" y2="11"/></svg>`,
    goals: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>`,

  const FIXED_SOLAR_HOLIDAYS = {

      const mPart = parts.find(p => p.type === "month")?.value || "";

      return {
        month: parseInt(mPart.replace(/[^0-9]/g, ""), 10),

    const map = {};

    };
    years.forEach(year => {
      const start = new Date(year - 1, 11, 25);
      const end = new Date(year + 1, 0, 5);
      for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
        const y = dt.getFullYear(), m = dt.getMonth() + 1, d = dt.getDate();
        const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const md = `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        if (y === year && FIXED_SOLAR_HOLIDAYS[md]) addName(ds, FIXED_SOLAR_HOLIDAYS[md]);
