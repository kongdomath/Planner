        <div class="topbar-left">
          <h1 class="page-title title-archive">${ICONS.archive} 아카이브</h1>
          <span class="topbar-sub">총 ${filtered.length}개 · 항목을 탭하면 바로 수정</span>
        </div>
        <div class="topbar-right">
          <select class="year-select" onchange="changeArchiveSort(this.value)" aria-label="아카이브 정렬">
            <option value="newest" ${state.archiveSort === "newest" ? "selected" : ""}>등록 최신순</option>
            <option value="oldest" ${state.archiveSort === "oldest" ? "selected" : ""}>등록 오래된순</option>
            <option value="date_desc" ${state.archiveSort === "date_desc" ? "selected" : ""}>기록 날짜 최신순</option>
            <option value="date_asc" ${state.archiveSort === "date_asc" ? "selected" : ""}>기록 날짜 오래된순</option>
          </select>
          <button class="btn btn-primary" onclick="toggleArchiveComposer()">
            ${showArchiveComposer ? "닫기" : "+ 새 아카이브 추가"}
          </button>
        </div>
        ${renderGlobalTools()}
      </div>

      <div class="filter-bar-wrap">
        <div class="filter-chips">
          <button class="chip-btn ${state.archiveCatFilter === "all" ? "active" : ""}" onclick="changeArchiveCatFilter('all')">
            전체 <span class="chip-count">${state.archives.length}</span>
          </button>
          ${state.archiveCategories.map(cat => {
            const cnt = state.archives.filter(a => a.category === cat.name).length;
            const isAct = state.archiveCatFilter === cat.name;
            return `
              <button class="chip-btn ${isAct ? "active" : ""}" onclick="changeArchiveCatFilter(${jsArg(cat.name)})">
                ${renderPictogram(cat.icon, 13)} ${escapeHtml(cat.name)} <span class="chip-count">${cnt}</span>
              </button>
            `;
          }).join("")}
        </div>
        <button class="btn btn-sm chip-manage-btn" onclick="openCategoryManager('archive')">${ICONS.sliders} 카테고리 관리</button>
      </div>

      ${showArchiveComposer ? `
        <div class="card composer-card">
          <div class="composer-header">
            <h3 style="color:var(--c-archive);">새 아카이브 등록</h3>
          </div>
          <div class="form-row">
            <select id="archiveCatSel" aria-label="아카이브 분류">
              ${state.archiveCategories.map(c => `<option value="${escapeAttr(c.name)}" ${defaultCat === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
            </select>
            <input type="date" id="archiveDateInp" value="${state.selectedDate}" aria-label="기록 날짜" />
            <input type="text" id="archiveTitleInp" style="flex:1; min-width:170px;" placeholder="제목 (책 제목, 공부 주제, 여행지, 전시명, 차 이름 등)" />
            <input type="text" id="archiveSubInp" style="flex:1; min-width:140px;" placeholder="세부 정보 (저자, 장소, 다구 등 · 선택)" />
          </div>
          <div class="form-row">
            <textarea id="archiveNoteInp" style="width:100%; min-height:74px; resize:vertical;" placeholder="감상, 배운 내용, 시음 메모 등 글을 자유롭게 남겨보세요..."></textarea>
          </div>
          <div class="composer-footer">
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">
              <label class="btn" style="cursor:pointer;">
                사진 추가 (최대 5장)
                <input type="file" id="archiveImgInp" accept="image/*" multiple style="display:none" onchange="handleNewArchiveImages(event)" />
              </label>
              <div id="newArchiveImgPreview" class="img-preview-box">${renderThumbList(draftArchiveImages, "removeDraftArchiveImage")}</div>
            </div>
            <div class="composer-actions">
              <button class="btn btn-primary" onclick="addArchiveItem()">아카이브 저장</button>
            </div>
          </div>
        </div>
      ` : ""}

      ${filtered.length ? `
        <div class="media-grid">
          ${filtered.map(a => {
            const iconKey = getArchiveCatIconKey(a.category);
            const imgs = normalizeImages(a);
            return `
              <article class="media-card">
                <div class="media-cover" onclick="openCardCover('archive', '${a.id}')" title="${imgs.length ? "사진 크게 보기" : "탭하여 수정"}">
                  ${imgs.length > 0
                    ? `<img src="${imgs[0]}" alt="${escapeAttr(a.title)}" />${imgs.length > 1 ? `<span class="photo-count-badge">+${imgs.length - 1}장</span>` : ""}`
                    : `<div class="cover-placeholder"><div class="big-pictogram">${renderPictogram(iconKey, 22)}</div><span>${escapeHtml(a.category)}</span></div>`
                  }
                </div>
                <div class="media-body">
                  <div class="media-top">
                    <button class="pill" onclick="event.stopPropagation(); selectDate('${a.date}', true)" style="cursor:pointer; border:none; font-family:inherit;" title="해당 날짜 일기로 이동">${renderPictogram(iconKey, 12)} ${escapeHtml(a.category)} · ${a.date}</button>
                    <button class="icon-btn danger" onclick="event.stopPropagation(); deleteItem('archives', '${a.id}')" title="삭제" aria-label="아카이브 삭제">${ICONS.trash}</button>
                  </div>
                  <div class="tap-edit-target" onclick="openEditArchive('${a.id}')" title="탭하여 수정">
                    <h3 class="media-title">${escapeHtml(a.title)}</h3>
                    ${a.subtitle ? `<div class="media-sub">${escapeHtml(a.subtitle)}</div>` : ""}
                    ${a.note ? `<div class="media-note" style="margin-top:6px;">${escapeHtml(a.note)}</div>` : ""}
                  </div>
                </div>
              </article>
            `;
          }).join("")}
        </div>
      ` : `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 아카이브 기록이 없습니다. 상단의 ‘+ 새 아카이브 추가’ 버튼으로 첫 기록을 남겨보세요.</p>
        </div>
      `}
    `;
  }

  let modalArchiveImages = [];
  async function handleModalArchiveImages(event) {
    try {
      modalArchiveImages = await processMultipleFiles(event.target.files, modalArchiveImages, 5);
      event.target.value = "";
      const box = document.getElementById("mArchiveImgBox");
      if (box) box.innerHTML = renderThumbList(modalArchiveImages, "removeModalArchiveImage");
    } catch (_) {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
  }

  function removeModalArchiveImage(idx) {
    modalArchiveImages.splice(idx, 1);
    const box = document.getElementById("mArchiveImgBox");
    if (box) box.innerHTML = renderThumbList(modalArchiveImages, "removeModalArchiveImage");
  }

  function openEditArchive(id) {
    const a = state.archives.find(x => x.id === id);
    if (!a) return;
    modalArchiveImages = [...normalizeImages(a)];
    openModal("아카이브 수정", `
      <div class="modal-field">
        <label>분류</label>
        <select id="mArchiveCat">
          ${state.archiveCategories.map(c => `<option value="${escapeAttr(c.name)}" ${a.category === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="mArchiveDate" value="${escapeAttr(a.date)}" />
      </div>
      <div class="modal-field">
        <label>제목</label>
        <input type="text" id="mArchiveTitle" value="${escapeAttr(a.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 정보 (저자, 장소, 다구 등)</label>
        <input type="text" id="mArchiveSub" value="${escapeAttr(a.subtitle || "")}" />
      </div>
      <div class="modal-field">
        <label>글 · 메모</label>
        <textarea id="mArchiveNote" style="min-height:110px;">${escapeHtml(a.note || "")}</textarea>
      </div>
      <div class="modal-field">
        <label>사진 (최대 5장)</label>
        <input type="file" accept="image/*" multiple onchange="handleModalArchiveImages(event)" />
        <div id="mArchiveImgBox" class="img-preview-box">
          ${renderThumbList(modalArchiveImages, "removeModalArchiveImage")}
        </div>
      </div>
    `, () => {
      const catSel = document.getElementById("mArchiveCat");
      if (catSel && catSel.value) a.category = catSel.value;
      a.date = document.getElementById("mArchiveDate").value || a.date;
      a.title = document.getElementById("mArchiveTitle").value.trim() || a.title;
      a.subtitle = document.getElementById("mArchiveSub").value.trim();
      a.note = document.getElementById("mArchiveNote").value.trim();
      a.images = [...modalArchiveImages];
      delete a.image;
      return true;
    });
  }

  function openEditBucket(id) {
    const b = state.buckets.find(x => x.id === id);
    if (!b) return;
    openModal("버킷리스트 수정", `
      <div class="modal-field">
        <label>분류</label>
        <select id="mBucketCat">
          ${state.bucketCategories.map(c => `<option value="${escapeAttr(c.name)}" ${b.category === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>버킷리스트 내용</label>
        <input type="text" id="mBucketTitle" value="${escapeAttr(b.title)}" />
      </div>
      <div class="modal-field">
        <label>세부 메모</label>
        <input type="text" id="mBucketNote" value="${escapeAttr(b.note || "")}" />
      </div>
      <div class="modal-field">
        <label>달성 날짜 (달성 시)</label>
        <input type="date" id="mBucketDoneDate" value="${escapeAttr(b.doneDate || "")}" />
      </div>
    `, () => {
      const catSel = document.getElementById("mBucketCat");
      if (catSel && catSel.value) b.category = catSel.value;
      b.title = document.getElementById("mBucketTitle").value.trim() || b.title;
      b.note = document.getElementById("mBucketNote").value.trim();
      b.doneDate = document.getElementById("mBucketDoneDate").value;
      if (b.doneDate) b.done = true;
      return true;
    });
  }

  function openEditTodo(id) {
    const t = state.todos.find(x => x.id === id);
    if (!t) return;
    openModal("할일 수정", `
      <div class="modal-field">
        <label>날짜</label>
        <input type="date" id="mTodoDate" value="${escapeAttr(t.date)}" />
      </div>
      <div class="modal-field">
        <label>할일 내용</label>
        <input type="text" id="mTodoTitle" value="${escapeAttr(t.title)}" />
      </div>
    `, () => {
      t.date = document.getElementById("mTodoDate").value || t.date;
      t.title = document.getElementById("mTodoTitle").value.trim() || t.title;
      return true;
    });
  }

  function toggleAchieve(collection, id) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    item.doneDate = item.done ? (item.doneDate || state.selectedDate || TODAY_STR) : "";
    saveState();
    render();
  }

  function updateDoneDate(collection, id, newDate) {
    const item = state[collection].find(x => x.id === id);
    if (!item) return;
    item.doneDate = newDate;
    item.done = true;
    saveState();
    render();
  }

  function toggleTodo(id) {
    const item = state.todos.find(x => x.id === id);
    if (!item) return;
    item.done = !item.done;
    saveState();
    render();
  }

  function deleteItem(collection, id) {
    const messages = {
      goals: "이 목표를 삭제할까요?",
      buckets: "이 버킷리스트를 삭제할까요?",
      archives: "이 아카이브 기록을 삭제할까요?"
    };
    if (messages[collection] && !confirm(messages[collection])) return;
    state[collection] = state[collection].filter(x => x.id !== id);
    saveState();
    render();
    refreshCategoryManager();
  }

  // ---------- 사진 크게 보기 (라이트박스) ----------
  function openCardCover(kind, id) {
    const list = kind === "goal" ? state.goals : state.archives;
    const item = list.find(x => x.id === id);
    if (!item) return;
    const images = normalizeImages(item);
    if (images.length) {
      openLightbox(images, 0, item.title || "");
    } else if (kind === "goal") {
      openEditGoal(id);
    } else {
      openEditArchive(id);
    }
  }

  function openLightbox(images, index = 0, caption = "") {
    if (!Array.isArray(images) || images.length === 0) return;
    lightboxImages = [...images];
    lightboxIndex = Math.max(0, Math.min(index, images.length - 1));
    lightboxCaption = caption || "";
    updateLightbox();
    document.getElementById("lightbox").classList.add("open");
  }

  function updateLightbox() {
    const img = document.getElementById("lightboxImg");
    if (!img) return;
    img.src = lightboxImages[lightboxIndex] || "";
    img.alt = lightboxCaption || "사진";
    const caption = document.getElementById("lightboxCaption");
    if (caption) {
      caption.textContent = `${lightboxCaption}${lightboxImages.length > 1 ? ` (${lightboxIndex + 1}/${lightboxImages.length})` : ""}`;
    }
    const multi = lightboxImages.length > 1;
    document.querySelectorAll(".lightbox-nav").forEach(el => {
      el.style.display = multi ? "flex" : "none";
    });
  }

  function lightboxStep(delta) {
    if (!lightboxImages.length) return;
    lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length;
    updateLightbox();
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
    const img = document.getElementById("lightboxImg");
    if (img) img.src = "";
    lightboxImages = [];
  }

  // ---------- 설정 (데이터 관리) ----------
  function openSettings() {
    renderSettingsBody();
    document.getElementById("settingsModal").classList.add("open");
  }

  function closeSettings() {
    document.getElementById("settingsModal").classList.remove("open");
  }

  function refreshSettingsIfOpen() {
    const modal = document.getElementById("settingsModal");
    if (modal && modal.classList.contains("open")) renderSettingsBody();
  }

  function renderSettingsBody() {
    const body = document.getElementById("settingsBody");
    if (!body) return;
    const usage = getStorageUsage();
    const limit = 5 * 1024 * 1024;
    const pct = Math.min(100, Math.round((usage.bytes / limit) * 100));
    const photos = getPhotoCount();
    const totalItems = (state.logs ? Object.keys(state.logs).length : 0) + (state.goals ? state.goals.length : 0) +
      (state.buckets ? state.buckets.length : 0) + (state.archives ? state.archives.length : 0) +
      (state.todos ? state.todos.length : 0);
    body.innerHTML = `
      <div class="settings-section">
        <h4>저장 공간</h4>
        <div class="storage-line"><strong>사용 중 약 ${formatBytes(usage.bytes)}</strong><span>/ 권장 한도 약 4~5MB</span></div>
        <div class="storage-track"><div class="storage-fill ${pct >= 80 ? "warn" : ""}" style="width:${pct}%;"></div></div>
        <p class="settings-hint">사진 ${photos}장 · 기록 ${totalItems}건. 모든 기록은 이 브라우저(localStorage)에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라지니 가끔 JSON으로 백업해 두세요.</p>
        ${lastSavedAt ? `<p class="settings-hint">마지막 저장: ${timeStr(lastSavedAt)}</p>` : ""}
        <p class="settings-hint">공간이 부족하면 저장이 되지 않을 수 있고, 그때는 사진을 줄이거나 백업 후 오래된 사진을 삭제해 주세요.</p>
      </div>
      <div class="settings-section">
        <h4>데이터 관리</h4>
        <div class="settings-actions">
          <button class="btn" onclick="exportBackup()">데이터 백업 (JSON)</button>
          <label class="btn" style="cursor:pointer;">백업 복원<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)" /></label>
          <button class="btn btn-danger-outline" onclick="clearSamples()">예시 지우기 · 전체 삭제</button>
        </div>
        <p class="settings-hint">‘예시 지우기’는 기본 예시뿐 아니라 모든 기록을 지웁니다. 되돌릴 수 없으니 먼저 백업을 권장합니다.</p>
      </div>
      <div class="settings-section">
        <h4>앱 정보</h4>
        <p class="settings-hint">아카이브 &amp; 플래너 v${APP_VERSION} · 저장 키 <code>${STORAGE_KEY}</code></p>
        ${state.migratedFrom ? `<p class="settings-hint">이전 버전(<code>${escapeHtml(state.migratedFrom)}</code>)의 기록을 안전하게 옮겨 왔습니다.</p>` : ""}
      </div>
    `;
  }

  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `archive_planner_backup_${TODAY_STR}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (_) {
      alert("백업 파일을 만드는 중 오류가 발생했습니다.");
    }
  }

  function importBackup(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(String(e.target.result));
        const isLegacy = !parsed.logs && !parsed.topics && looksLikeLegacyIndex(parsed);
        state = isLegacy ? (migrateLegacyIndex(parsed) || clone(defaultState)) : normalizeState(parsed);
        saveState();
        render();
        refreshSettingsIfOpen();
        alert("백업 데이터를 복원했습니다.");
      } catch (_) {
        alert("올바른 JSON 백업 파일이 아닙니다.");
      }
      input.value = "";
    };
    reader.onerror = () => {
      alert("파일을 읽는 중 오류가 발생했습니다.");
      input.value = "";
    };
    reader.readAsText(file);
  }

  // ---------- 공통 모달 ----------
  function openModal(title, bodyHtml, onSave) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalActions").innerHTML = `
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modalSaveBtn">저장</button>
    `;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    document.getElementById("modalSaveBtn").onclick = () => {
      const result = typeof onSave === "function" ? onSave() : true;
      if (result === false) return;
      closeModal();
      saveState();
      render();
      refreshCategoryManager();
      refreshSettingsIfOpen();
    };
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("open");
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  // onclick 등 인라인 JS 문자열 인자용 (따옴표 안전 처리)
  function jsArg(val) {
    return escapeAttr(JSON.stringify(String(val == null ? "" : val)));
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      if (document.getElementById("lightbox").classList.contains("open")) { closeLightbox(); return; }
      if (document.getElementById("editModal").classList.contains("open")) { closeModal(); return; }
      if (document.getElementById("catModal").classList.contains("open")) { closeCategoryManager(); return; }
      if (document.getElementById("settingsModal").classList.contains("open")) { closeSettings(); return; }
      if (searchOpen) { closeSearch(); return; }
    }
    if (document.getElementById("lightbox").classList.contains("open")) {
      if (event.key === "ArrowLeft") lightboxStep(-1);
      else if (event.key === "ArrowRight") lightboxStep(1);
    }
  });

  const mobileMq = window.matchMedia ? window.matchMedia("(max-width: 860px)") : null;
  if (mobileMq) {
    const onMqChange = () => {
      if (state.yearViewMode === "auto") render();
    };
    if (mobileMq.addEventListener) mobileMq.addEventListener("change", onMqChange);
    else if (mobileMq.addListener) mobileMq.addListener(onMqChange);
  }

  // 테스트/디버깅용 (화면에는 영향 없음)
  window.__planner = {
    version: APP_VERSION,
    getState: () => state,
    getYearViewMode,
    getStorageUsage,
    getPhotoCount,
    render,
    openSearch,
    closeSearch,
    openSettings,
    closeSettings,
    openCategoryManager,
    closeCategoryManager,
    openLightbox,
    closeLightbox,
    errors: () => window.__errors
  };

  mountNavIcons();
  render();
</script>
</body>
</html>
