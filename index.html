<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아카이브 플래너" />
  <title>아카이브 & 플래너 v2</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --surface-muted: #f3f1ec;
      --border: #e5e2da;
      --text: #1f2421;
      --text-sub: #6b7280;
      --sat: #3b6ea5;
      --sun: #c84b4b;
      --c-year: #334155;
      --c-diary: #2b4c7e;
      --c-goal: #2d6a4f;
      --c-plan: #25638a;
      --c-bucket: #b46528;
      --c-archive: #5b4b8a;
      --c-todo: #6441a5;
      --radius: 12px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 232px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .brand {
      padding: 6px 10px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 12px;
      color: var(--text-sub);
      margin: 4px 0 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: var(--surface-muted); color: var(--text); }
    .nav-btn.active { background: var(--surface-muted); color: var(--text); font-weight: 700; }
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .main {
      flex: 1;
      padding: 24px 28px 92px;
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
      min-width: 0;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 40px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 36px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
      min-height: 36px;
    }
    .topbar-sub {
      font-size: 13px;
      color: var(--text-sub);
    }
    .page-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .title-year { color: var(--c-year); }
    .title-diary { color: var(--c-diary); }
    .title-goal { color: var(--c-goal); }
    .title-plan { color: var(--c-plan); }
    .title-bucket { color: var(--c-bucket); }
    .title-archive { color: var(--c-archive); }

    .diary-date-badge {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    select, input[type="text"], input[type="date"], textarea {
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 11px;
      height: 36px;
      outline: none;
    }
    textarea {
      height: auto;
      padding: 10px 12px;
      font-size: 14px;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #94a3b8;
    }
    .search-input {
      min-width: 210px;
      font-size: 13px;
      height: 36px;
    }
    .year-select {
      font-weight: 600;
      font-size: 13px;
      height: 36px;
      padding: 0 12px;
      cursor: pointer;
      background: var(--surface);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-muted); }
    .btn-primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .btn-primary:hover { opacity: 0.9; background: var(--text); }
    .btn-sm {
      height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }
    .segmented {
      display: inline-flex;
      align-items: center;
      height: 36px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .segmented button {
      border: none;
      background: transparent;
      height: 30px;
      padding: 0 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
    }
    .segmented button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 7px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 0;
    }
    .icon-btn:hover { background: var(--surface-muted); color: var(--text); border-color: var(--border); }
    .icon-btn.danger:hover { color: var(--sun); }

    /* 통계 요약 바 */
    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .summary-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }
    .progress-track {
      width: 140px;
      height: 8px;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: var(--c-goal);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .legend-dots {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* 검색 결과 패널 */
    .search-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .search-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
      overflow-y: auto;
    }
    .search-result-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      background: var(--bg);
    }
    .search-result-item:hover { background: var(--surface-muted); }

    /* 연력 뷰 (가독성 대폭 개선: 일자 고정 열 + 넉넉한 칸 높이 + hover 팝업 미리보기) */
    .year-block { margin-bottom: 32px; }
    .year-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-year);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .matrix-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      max-height: 76vh;
      overflow-y: auto;
    }
    table.year-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.year-table th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--surface-muted);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
    }
    table.year-table th.day-axis-col,
    table.year-table td.day-axis-cell {
      position: sticky;
      left: 0;
      z-index: 3;
      width: 44px;
      background: var(--surface-muted);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: default;
      vertical-align: middle;
    }
    table.year-table th.day-axis-col {
      z-index: 5;
    }
    table.year-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 6px 7px;
      vertical-align: top;
      height: 54px;
      cursor: pointer;
      transition: background 0.12s;
    }
    table.year-table td:hover:not(.empty-cell):not(.day-axis-cell) { background: #f4f6fb; }
    table.year-table td.empty-cell { background: #faf9f6; cursor: default; }
    table.year-table td.weekend-bg { background: #fcfbf9; }
    table.year-table td.selected-day { outline: 2px solid var(--c-diary); outline-offset: -2px; background: #eef2ff; }
    table.year-table td.today-cell { background: #fefce8; }
    .cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .day-num { color: var(--text-sub); }
    .day-num.sat { color: var(--sat); }
    .day-num.sun, .day-num.holiday { color: var(--sun); }
    .cell-badges { display: flex; gap: 3px; align-items: center; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cell-line {
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }
    .cell-line.holiday-label {
      color: var(--sun);
      font-weight: 600;
      opacity: 0.9;
    }

    /* 달별 모아보기 (달력 그리드형 + 기록 모아보기 토글로 스크롤 지옥 해결) */
    .month-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .month-jump-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .month-jump-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .month-jump-btn:hover { background: var(--surface-muted); color: var(--text); }
    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .month-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .month-card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-year);
    }
    .month-card-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--surface-muted);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    .cal-weekdays span:first-child { color: var(--sun); }
    .cal-weekdays span:last-child { color: var(--sat); }
    .cal-days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-day-cell {
      min-height: 46px;
      border-radius: 7px;
      padding: 4px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.12s;
    }
    .cal-day-cell:hover { background: var(--surface-muted); }
    .cal-day-cell.has-record { background: #f8fafc; border-color: #e2e8f0; }
    .cal-day-cell.selected-day { background: #eef2ff; border-color: var(--c-diary); }
    .cal-day-cell.today-cell { background: #fefce8; border-color: #eab308; }
    .cal-day-num {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }
    .cal-day-mini {
      font-size: 9.5px;
      color: var(--text-sub);
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }
    .cal-day-mini.holiday-label { color: var(--sun); }
    .month-highlights {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .highlight-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
    }
    .highlight-row:hover { background: var(--surface-muted); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    .list-item.done .item-title {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .chk {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--text);
      flex-shrink: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .item-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 3px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-sub);
    }
    .done-date-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }
    .done-date-inline input[type="date"] {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    textarea.diary-area {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      line-height: 1.7;
      padding: 14px;
    }

    /* 필터 칩 & 카드 그리드 (아카이브 + 주제별 목표 + 버킷리스트 공통) */
    .filter-bar-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .chip-wrap {
      display: inline-flex;
      align-items: center;
      height: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding-right: 4px;
    }
    .chip-wrap.active {
      background: var(--text);
      border-color: var(--text);
    }
    .chip-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 999px;
      height: 32px;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .composer-card {
      border-color: #cbd5e1;
      background: #fdfcfa;
    }
    .composer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .composer-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }
    .composer-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      margin-top: 4px;
      border-top: 1px dashed var(--border);
    }
    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .chip-wrap .chip-btn {
      border: none;
      background: transparent;
      padding-right: 8px;
    }
    .chip-btn:hover { background: var(--surface-muted); color: var(--text); }
    .chip-wrap .chip-btn:hover { background: transparent; }
    .chip-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .chip-wrap.active .chip-btn {
      background: transparent;
      color: #fff;
    }
    .chip-action-btn {
      border: none;
      background: transparent;
      color: var(--text-sub);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .chip-wrap.active .chip-action-btn { color: rgba(255,255,255,0.75); }
    .chip-action-btn:hover { background: rgba(128,128,128,0.18); }

    .cat-add-inline {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .emoji-input {
      width: 64px;
      text-align: center;
      font-size: 14px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .media-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: opacity 0.15s;
    }
    .media-card.done {
      background: #fcfbf9;
    }
    .media-card.done .media-title {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .media-cover {
      width: 100%;
      height: 185px;
      background: var(--surface-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      color: var(--text-sub);

  const FIXED_SOLAR_HOLIDAYS = {
    "01-01": "신정",
    "03-01": "삼일절",
    "05-05": "어린이날",
    "06-06": "현충일",
    "08-15": "광복절",
    "10-03": "개천절",
    "10-09": "한글날",
    "12-25": "크리스마스"
  };

  const lunarFormatter = new Intl.DateTimeFormat("ko-KR-u-ca-chinese", {
    month: "numeric",
    day: "numeric"
  });

  function getLunarMonthDay(dateObj) {
    try {
      const parts = lunarFormatter.formatToParts(dateObj);
      const mPart = parts.find(p => p.type === "month")?.value || "";
      const dPart = parts.find(p => p.type === "day")?.value || "";
      const isLeap = mPart.includes("윤");
      const month = parseInt(mPart.replace(/[^0-9]/g, ""), 10);
      const day = parseInt(dPart.replace(/[^0-9]/g, ""), 10);
      return { month, day, isLeap };
    } catch {
      return null;
    }
  }

  function buildHolidayMap(years) {
    const map = {};
    const addName = (ds, name) => {
      if (!map[ds]) map[ds] = name;
      else if (!map[ds].includes(name)) map[ds] += ` · ${name}`;
    };

    years.forEach(year => {
      const start = new Date(year - 1, 11, 25);
      const end = new Date(year + 1, 0, 5);
      for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
        const y = dt.getFullYear();
        const m = dt.getMonth() + 1;
        const d = dt.getDate();
        const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const md = `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        if (y === year && FIXED_SOLAR_HOLIDAYS[md]) {
          addName(ds, FIXED_SOLAR_HOLIDAYS[md]);
        }

        const lunar = getLunarMonthDay(dt);
        if (lunar && !lunar.isLeap) {
          if (lunar.month === 1 && lunar.day === 1) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "설날 연휴");
            if (y === year) addName(ds, "설날");
            if (next.getFullYear() === year) addName(nStr, "설날 연휴");
          }
          if (y === year && lunar.month === 4 && lunar.day === 8) {
            addName(ds, "부처님오신날");
          }
          if (lunar.month === 8 && lunar.day === 15) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "추석 연휴");
            if (y === year) addName(ds, "추석");
            if (next.getFullYear() === year) addName(nStr, "추석 연휴");
          }
        }
      }

      const subTargets = new Set(["설날 연휴", "설날", "추석 연휴", "추석", "삼일절", "어린이날", "부처님오신날", "광복절", "개천절", "한글날", "크리스마스"]);
      const yearDates = Object.keys(map).filter(k => k.startsWith(`${year}-`)).sort();
      yearDates.forEach(ds => {
        const [yy, mm, dd] = ds.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        const dow = dt.getDay();
        const names = map[ds].split(" · ");
        const isSeolOrChuseok = names.some(n => n.includes("설날") || n.includes("추석"));
        const isOtherSub = names.some(n => subTargets.has(n) && !n.includes("설날") && !n.includes("추석"));
        const hasOverlap = names.length > 1;

        if ((isSeolOrChuseok && (dow === 0 || hasOverlap)) || (isOtherSub && (dow === 0 || dow === 6 || hasOverlap))) {
          const cursor = new Date(dt);
          while (true) {
            cursor.setDate(cursor.getDate() + 1);
            const cStr = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}-${String(cursor.getDate()).padStart(2, "0")}`;
            const cDow = cursor.getDay();
            if (cDow !== 0 && cDow !== 6 && !map[cStr]) {
              if (cursor.getFullYear() === year) {
                map[cStr] = "대체공휴일";
              }
              break;
            }
          }
        }
      });
    });

    return map;
  }

  let state = loadState();
  let searchQuery = "";
  let showGoalComposer = false;
  let showBucketComposer = false;

  let draftGoalImages = [];

  function normalizeYear(y) {
    const cleaned = String(y || "").replace(/[^0-9]/g, "");
    return cleaned || "2026";
  }

  function normalizePeriod(p) {
    const trimmed = String(p || "").trim();
    return PERIODS.includes(trimmed) ? trimmed : "연간";
  }

  function normalizeCategoryList(list, fallbackEmoji = "📌") {
    if (!Array.isArray(list)) return [];
    return list.map(item => {
      if (typeof item === "string") return { name: item, emoji: fallbackEmoji };
      return { name: String(item.name || "").trim(), emoji: String(item.emoji || fallbackEmoji).trim() || fallbackEmoji };
    }).filter(x => x.name);
  }

  function normalizeImages(item) {
    if (Array.isArray(item.images)) return item.images.filter(Boolean);
    if (item.image) return [item.image];
    return [];
  }

  function loadState() {
    try {
      const raw =
        localStorage.getItem(STORAGE_KEY) ||
        localStorage.getItem("personal_archive_planner_v5") ||
        localStorage.getItem("personal_archive_planner_v4");
      if (!raw) return structuredClone(defaultState);
      const parsed = JSON.parse(raw);
      const merged = { ...structuredClone(defaultState), ...parsed };
      if (merged.activeTab === "todos") merged.activeTab = "diary";
      merged.topics = normalizeCategoryList(merged.topics, "🎯");
      merged.archiveCategories = normalizeCategoryList(merged.archiveCategories, "🗂️");
      merged.bucketCategories = normalizeCategoryList(merged.bucketCategories, "⭐");
      merged.goals = (merged.goals || []).map(g => ({
        note: "",
        ...g,
        images: normalizeImages(g),
        year: normalizeYear(g.year),
        period: normalizePeriod(g.period)
      }));
      merged.archives = (merged.archives || []).map(a => ({
        ...a,
        images: normalizeImages(a)
      }));
      return merged;
    } catch {
      return structuredClone(defaultState);
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      alert("브라우저 저장 공간이 가득 찼습니다. JSON 백업을 내려받은 뒤 일부 사진 용량을 줄여 주세요.");
    }
  }

  function clearSamples() {
    if (!confirm("기본으로 들어 있는 예시 항목을 지우고 빈 상태로 시작할까요?")) return;
    state.logs = {};

    state.archives = [];

    return "id_" + Math.random().toString(36).slice(2, 9);

  function getTopicEmoji(topicName) {
    const found = state.topics.find(t => t.name === topicName);
    return found ? found.emoji : "🎯";
  }

  function getArchiveCatEmoji(catName) {
    const found = state.archiveCategories.find(c => c.name === catName);
    return found ? found.emoji : "🗂️";
  }

  function getBucketCatEmoji(catName) {
    const found = state.bucketCategories.find(c => c.name === catName);

  function getDayOfWeek(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d).getDay();
  }

  function isHoliday(dateStr) {
    return Boolean(HOLIDAYS[dateStr]);
  }

  function getDateColor(dateStr) {
    if (isHoliday(dateStr)) return "var(--sun)";
    const dow = getDayOfWeek(dateStr);
    if (dow === 0) return "var(--sun)";
    if (dow === 6) return "var(--sat)";
    return "var(--text)";
  }

  function shiftDate(dateStr, deltaDays) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d + deltaDays);
    const ny = dt.getFullYear();
    const nm = String(dt.getMonth() + 1).padStart(2, "0");
    const nd = String(dt.getDate()).padStart(2, "0");
    return `${ny}-${nm}-${nd}`;
  }

  function formatDateKo(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = new Date(y, m - 1, d).getDay();
    const hName = HOLIDAYS[dateStr] ? ` · ${HOLIDAYS[dateStr]}` : "";
    return `${y}년 ${m}월 ${d}일 (${days[dow]})${hName}`;
  }

  function compressImageFile(file, maxWidth = 720, quality = 0.76) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function processMultipleFiles(fileList, existingArray, maxCount = 5) {
    const files = Array.from(fileList || []);
    const result = [...existingArray];
    for (const file of files) {
      if (result.length >= maxCount) {
        alert(`사진은 항목당 최대 ${maxCount}장까지 첨부할 수 있습니다.`);
        break;
      }
      const dataUrl = await compressImageFile(file);
      result.push(dataUrl);
    }
    return result;
  }

  function yearSelectHtml(currentVal, onChangeFn, allLabel = `전체 연도 (${YEARS[0]}~${YEARS[YEARS.length - 1]})`) {
    const normCur = currentVal === "all" ? "all" : normalizeYear(currentVal);
    const opts = YEARS.map(y => `<option value="${y}" ${normCur === String(y) ? "selected" : ""}>${y}년</option>`).join("");
    return `
      <select class="year-select" onchange="${onChangeFn}(this.value)" aria-label="연도 선택">
        <option value="all" ${normCur === "all" ? "selected" : ""}>${allLabel}</option>
        ${opts}
      </select>
    `;
  }

  function clearSearch() {
    searchQuery = "";

  function findSearchResults(q) {
    const term = q.trim().toLowerCase();
    if (!term) return [];
    const results = [];

    Object.entries(state.logs || {}).forEach(([dateStr, log]) => {
      const one = log?.oneLine || "";
      const diary = log?.diary || "";
      if (one.toLowerCase().includes(term) || diary.toLowerCase().includes(term)) {
        const snippet = one.toLowerCase().includes(term) ? one : diary.replace(/\s+/g, " ").slice(0, 90);
        results.push({
          type: "기록 · 일기",
          title: one || `${dateStr} 일기`,
          sub: `${dateStr} · ${snippet}`,
          action: () => selectDate(dateStr, true)
        });
      }
    });

    (state.goals || []).forEach(g => {
      if (
        g.title.toLowerCase().includes(term) ||
        (g.topic || "").toLowerCase().includes(term) ||
        (g.note || "").toLowerCase().includes(term)
      ) {
        results.push({
          type: "주제별 목표",
          title: g.title,
          sub: `${g.topic} · ${normalizeYear(g.year)}년 ${normalizePeriod(g.period)}`,
          action: () => {
            state.goalTopicFilter = "all";
            state.goalYearFilter = "all";
            state.goalPeriodFilter = "all";
            setTab("goals");
          }
        });
      }
    });

    (state.buckets || []).forEach(b => {
      if (b.title.toLowerCase().includes(term) || (b.note || "").toLowerCase().includes(term) || (b.category || "").toLowerCase().includes(term)) {
        results.push({
          type: "버킷리스트",
          title: b.title,
          sub: `${b.category}${b.note ? ` · ${b.note}` : ""}`,
          action: () => {
            state.bucketCatFilter = "all";
            setTab("bucket");
          }
        });
      }
    });

    (state.archives || []).forEach(a => {
      if (
        (a.title || "").toLowerCase().includes(term) ||
        (a.subtitle || "").toLowerCase().includes(term) ||
        (a.note || "").toLowerCase().includes(term) ||
        (a.category || "").toLowerCase().includes(term)
      ) {
        results.push({
          type: `아카이브 · ${a.category}`,
          title: a.title,
          sub: `${a.date}${a.subtitle ? ` · ${a.subtitle}` : ""}`,
          action: () => {
            state.archiveCatFilter = "all";
            setTab("archive");
          }
        });
      }
    });

    (state.todos || []).forEach(t => {
      if (t.title.toLowerCase().includes(term)) {
        results.push({
          type: "할일",
          title: t.title,
          sub: t.date,
          action: () => selectDate(t.date, true)
        });
      }
    });

    return results;
  }

  function getDayMeta(dateStr) {
    const log = state.logs[dateStr] || {};
    const hasDiary = Boolean(log.diary && log.diary.trim());
    const hasAchieved =
      state.goals.some(g => g.done && g.doneDate === dateStr) ||
      state.buckets.some(b => b.done && b.doneDate === dateStr);
    const hasArchive = state.archives.some(a => a.date === dateStr);
    const hasTodo = state.todos.some(t => t.date === dateStr);
    const hasAny = Boolean(log.oneLine || hasDiary || hasAchieved || hasArchive || hasTodo);
    return { log, hasDiary, hasAchieved, hasArchive, hasTodo, hasAny };
  }

${meta.log.oneLine}` : ""}`;

                <span class="cell-badges">
                  ${meta.hasDiary ? `<span class="badge-dot" style="background:var(--c-diary)" title="일기 있음"></span>` : ""}
                  ${meta.hasAchieved ? `<span class="badge-dot" style="background:var(--c-goal)" title="목표/버킷 달성"></span>` : ""}
                  ${meta.hasArchive ? `<span class="badge-dot" style="background:var(--c-archive)" title="아카이브 있음"></span>` : ""}
                  ${meta.hasTodo ? `<span class="badge-dot" style="background:var(--c-todo)" title="할일 있음"></span>` : ""}
                </span>
              </div>
              <div class="cell-line ${showHolidayText ? "holiday-label" : ""}">${escapeHtml(meta.log.oneLine || (hol ? HOLIDAYS[dateStr] : ""))}</div>
            </td>
          `;
        }
        rows += `<tr>${cells}</tr>`;
      }

      return `
        <section class="year-block">
          <h2 class="year-heading">${year}년 한눈에 보기</h2>
          <div class="matrix-wrap">
            <table class="year-table">
              <thead>
                <tr>
                  <th class="day-axis-col">일</th>
                  ${Array.from({ length: 12 }, (_, i) => `<th>${i + 1}월</th>`).join("")}
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>
      `;
    }).join("");

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-year">${ICONS.year} 1년 연력</h1>
        </div>
        <div class="topbar-right">
          <input type="text" id="globalSearchInput" class="search-input" placeholder="기록·목표·아카이브 검색..." value="${escapeAttr(searchQuery)}" oninput="updateSearchQuery(this.value)" onkeydown="if(event.key==='Escape') clearSearch()" />
          <div class="segmented">
            <button class="${state.yearViewMode === "matrix" ? "active" : ""}" onclick="setYearViewMode('matrix')">연간 표</button>
            <button class="${state.yearViewMode === "months" ? "active" : ""}" onclick="setYearViewMode('months')">달별 모아보기</button>
          </div>
          ${yearSelectHtml(state.yearFilter, "changeYearFilter")}
          <button class="btn btn-primary" onclick="selectDate('${TODAY_STR}', true)">오늘 (${TODAY_STR})</button>
        </div>
      </div>
      ${legendBar}
      ${blocks}
    `;
  }

  // 하루 기록 · 일기 뷰 (이전 날 / 다음 날 이동 버튼 + 백업/복원 접근성 포함)
  function renderDiaryView() {
    const d = state.selectedDate;
    const prevDate = shiftDate(d, -1);
    const nextDate = shiftDate(d, 1);
    const dateColor = getDateColor(d);
    const log = state.logs[d] || { oneLine: "", diary: "" };

    const dayTodos = state.todos.filter(t => t.date === d);
    const doneGoals = state.goals.filter(g => g.done && g.doneDate === d);
    const doneBuckets = state.buckets.filter(b => b.done && b.doneDate === d);
    const dayArchives = state.archives.filter(a => a.date === d);

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-diary">${ICONS.diary} 하루 기록 · 일기</h1>
          <span class="diary-date-badge" style="color:${dateColor}">${formatDateKo(d)}</span>
        </div>
        <div class="topbar-right">
          <button class="btn" onclick="selectDate('${prevDate}', false)" title="이전 날">◀ 전날</button>
          <input type="date" value="${d}" onchange="if(this.value) selectDate(this.value, false)" />
          <button class="btn" onclick="selectDate('${nextDate}', false)" title="다음 날">다음 날 ▶</button>
          <button class="btn btn-primary" onclick="selectDate('${TODAY_STR}', false)">오늘</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="card">
          <label style="display:block; font-size:13px; font-weight:700; color:var(--c-diary); margin-bottom:6px;">연력 한 줄 요약</label>
          <input type="text" id="oneLineInput" style="width:100%; margin-bottom:16px;" placeholder="연력 칸에 표시될 오늘의 한 줄..." value="${escapeAttr(log.oneLine || "")}" oninput="saveDiaryDraft()" />

          <label style="display:block; font-size:13px; font-weight:700; color:var(--c-diary); margin-bottom:6px;">오늘의 긴 기록 · 일기</label>
          <textarea class="diary-area" id="diaryInput" placeholder="오늘 있었던 일, 생각, 감정을 자유롭게 길게 기록하세요..." oninput="saveDiaryDraft()">${escapeHtml(log.diary || "")}</textarea>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
            <span id="saveStatus" style="font-size:12px; color:var(--text-sub);">자동 저장됨</span>
            <button class="btn btn-primary" onclick="saveDiaryDraft(true)">저장</button>
          </div>
        </div>

        <div>
          <div class="card">
            <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-todo);">이 날의 할일</h3>
            <div class="form-row">
              <input type="text" id="dayTodoInput" style="flex:1;" placeholder="이 날짜에 할일 추가..." onkeydown="if(event.key==='Enter') addDayTodo()" />
              <button class="btn" onclick="addDayTodo()">추가</button>
            </div>
            <div class="item-list">
              ${dayTodos.length ? dayTodos.map(t => `
                <div class="list-item ${t.done ? "done" : ""}">
                  <div class="item-left">
                    <input type="checkbox" class="chk" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" />
                    <div class="item-title">${escapeHtml(t.title)}</div>
                  </div>
                  <div>
                    <button class="icon-btn" onclick="openEditTodo('${t.id}')" title="수정">${ICONS.pencil}</button>
                    <button class="icon-btn danger" onclick="deleteItem('todos','${t.id}')" title="삭제">${ICONS.trash}</button>
                  </div>
                </div>
              `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 할일이 없습니다.</p>`}
            </div>
          </div>

          ${(doneGoals.length + doneBuckets.length + dayArchives.length) > 0 ? `
            <div class="card">
              <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-goal);">이 날의 달성 · 아카이브</h3>
              <div class="item-list">
                ${doneGoals.map(g => `<div class="list-item" style="cursor:pointer;" onclick="openViewGoal('${g.id}')"><span class="pill">${getTopicEmoji(g.topic)} 목표 · ${escapeHtml(g.topic)}</span>${escapeHtml(g.title)}</div>`).join("")}
                ${doneBuckets.map(b => `<div class="list-item"><span class="pill">${getBucketCatEmoji(b.category)} 버킷 · ${escapeHtml(b.category)}</span>${escapeHtml(b.title)}</div>`).join("")}
                ${dayArchives.map(a => `<div class="list-item" style="cursor:pointer;" onclick="openViewArchive('${a.id}')"><span class="pill">${getArchiveCatEmoji(a.category)} 아카이브 · ${escapeHtml(a.category)}</span>${escapeHtml(a.title)}</div>`).join("")}
              </div>
            </div>
          ` : ""}
        </div>
      </div>
    `;
  }

  function saveDiaryDraft(explicit = false) {
    const oneLine = document.getElementById("oneLineInput").value;
    const diary = document.getElementById("diaryInput").value;
    state.logs[state.selectedDate] = { oneLine, diary };
    saveState();
    const st = document.getElementById("saveStatus");
    if (st) st.textContent = explicit ? "저장되었습니다." : "자동 저장됨";
  }

  function addDayTodo() {
    const inp = document.getElementById("dayTodoInput");
    const title = inp.value.trim();
    if (!title) return;
    state.todos.unshift({ id: uid(), date: state.selectedDate, title, done: false });
    saveState();
    render();
  }

  function changeGoalTopicFilter(val) {
    state.goalTopicFilter = val;
    saveState();
    render();
  }

  function changeGoalYearFilter(val) {
    state.goalYearFilter = val;
    saveState();
    render();
  }

  function changeGoalPeriodFilter(val) {
    state.goalPeriodFilter = val;
    saveState();
    render();
  }

  function changeGoalSort(val) {
    state.goalSort = val;
    saveState();
    render();
  }

  function toggleGoalComposer() {
    showGoalComposer = !showGoalComposer;
    render();
  }

  function renderDoneDateControl(collection, id, doneDate) {
    return `
      <span class="done-date-inline">
        달성일:
        <input type="date" value="${escapeAttr(doneDate || TODAY_STR)}" onchange="updateDoneDate('${collection}','${id}',this.value)" />
      </span>
    `;
  }

  function renderThumbList(images, removeFnName) {
    if (!images || images.length === 0) return `<span style="font-size:12px; color:var(--text-sub);">등록된 사진 없음</span>`;
    return images.map((src, i) => `
      <span class="thumb-wrap">
        <img src="${src}" alt="미리보기 ${i + 1}" />
        <button type="button" class="thumb-del-btn" onclick="${removeFnName}(${i})" title="삭제">×</button>
      </span>
    `).join("");
  }

  async function handleNewGoalImages(event) {
    try {
      draftGoalImages = await processMultipleFiles(event.target.files, draftGoalImages, 5);
      event.target.value = "";
      const prev = document.getElementById("newGoalImgPreview");
      if (prev) prev.innerHTML = renderThumbList(draftGoalImages, "removeDraftGoalImage");
    } catch {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
  }

  function removeDraftGoalImage(idx) {
    draftGoalImages.splice(idx, 1);
    const prev = document.getElementById("newGoalImgPreview");
    if (prev) prev.innerHTML = renderThumbList(draftGoalImages, "removeDraftGoalImage");
  }

  // 주제별 목표 뷰 (달성률 바 + 접이식 작성 폼 + 정렬 + 다중 사진 + 카드형 배치)
  function renderGoalsView() {
    let filtered = state.goals.filter(g => {
      const topicOk = state.goalTopicFilter === "all" || g.topic === state.goalTopicFilter;
      const yearOk = state.goalYearFilter === "all" || normalizeYear(g.year) === normalizeYear(state.goalYearFilter);
      const periodOk = state.goalPeriodFilter === "all" || normalizePeriod(g.period) === state.goalPeriodFilter;
      return topicOk && yearOk && periodOk;
    });

    if (state.goalSort === "undone") {
      filtered = [...filtered].sort((a, b) => Number(a.done) - Number(b.done));
    } else if (state.goalSort === "done") {
      filtered = [...filtered].sort((a, b) => Number(b.done) - Number(a.done));
    } else if (state.goalSort === "oldest") {
      filtered = [...filtered].reverse();
    }

    const totalCnt = filtered.length;
    const doneCnt = filtered.filter(g => g.done).length;
    const pct = totalCnt > 0 ? Math.round((doneCnt / totalCnt) * 100) : 0;

    const defaultAddTopic = state.goalTopicFilter === "all"
      ? (state.topics[0]?.name || "")
      : state.goalTopicFilter;
    const defaultAddYear = state.goalYearFilter === "all" ? "2026" : normalizeYear(state.goalYearFilter);
    const defaultAddPeriod = state.goalPeriodFilter === "all" ? "연간" : state.goalPeriodFilter;

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-goal">${ICONS.goals} 주제별 목표</h1>
          <span class="topbar-sub">총 ${totalCnt}개</span>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml(state.goalYearFilter, "changeGoalYearFilter", "전체 기한 (연도)")}
          <select class="year-select" onchange="changeGoalPeriodFilter(this.value)" aria-label="세부 기간 필터">
            <option value="all" ${state.goalPeriodFilter === "all" ? "selected" : ""}>전체 기간</option>
            ${PERIODS.map(p => `<option value="${p}" ${state.goalPeriodFilter === p ? "selected" : ""}>${p}</option>`).join("")}
          </select>
          <select class="year-select" onchange="changeGoalSort(this.value)" aria-label="정렬">
            <option value="newest" ${state.goalSort === "newest" ? "selected" : ""}>최신순</option>
            <option value="oldest" ${state.goalSort === "oldest" ? "selected" : ""}>오래된순</option>
            <option value="undone" ${state.goalSort === "undone" ? "selected" : ""}>미달성 우선</option>
            <option value="done" ${state.goalSort === "done" ? "selected" : ""}>달성 완료 우선</option>
          </select>
          <button class="btn btn-primary" onclick="toggleGoalComposer()">
            ${showGoalComposer ? "닫기" : "+ 새 목표 추가"}
          </button>
        </div>
      </div>

      <div class="summary-strip">
        <div class="summary-metrics">
          <span>현재 필터 목표 <strong>${totalCnt}개</strong></span>
          <span>달성 완료 <strong style="color:var(--c-goal);">${doneCnt}개</strong></span>
          <span>달성률 <strong>${pct}%</strong></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;"></div>
        </div>
      </div>

      <div class="filter-bar-wrap">
        <div class="filter-chips">
          <button class="chip-btn ${state.goalTopicFilter === "all" ? "active" : ""}" onclick="changeGoalTopicFilter('all')">
            전체 (${state.goals.length})
          </button>
          ${state.topics.map((t, idx) => {
            const cnt = state.goals.filter(g => g.topic === t.name).length;
            const isAct = state.goalTopicFilter === t.name;
            return `
              <span class="chip-wrap ${isAct ? "active" : ""}">
                <button class="chip-btn ${isAct ? "active" : ""}" onclick="changeGoalTopicFilter('${escapeAttr(t.name)}')">
                  <span>${escapeHtml(t.emoji)}</span> ${escapeHtml(t.name)} (${cnt})
                </button>
                <button class="chip-action-btn" onclick="openEditTopic(${idx})" title="주제 수정">${ICONS.pencil}</button>
                <button class="chip-action-btn" onclick="deleteTopic(${idx})" title="주제 삭제">${ICONS.trash}</button>
              </span>
            `;
          }).join("")}
        </div>
        <div class="cat-add-inline">
          <input type="text" id="newTopicEmojiInp" class="emoji-input" placeholder="이모지" maxlength="4" value="🎯" />
          <input type="text" id="newTopicInp" style="width:150px;" placeholder="새 주제명 입력" onkeydown="if(event.key==='Enter') addTopic()" />
          <button class="btn" onclick="addTopic()">주제 추가</button>
        </div>
      </div>

      ${showGoalComposer ? `
        <div class="card composer-card">
          <div class="composer-header">
            <h3 style="color:var(--c-goal);">새 목표 등록</h3>
            <button class="btn btn-sm" onclick="toggleGoalComposer()">취소</button>
          </div>
          <div class="form-row">
            <select id="goalTopicSel">
              ${state.topics.map(t => `<option value="${escapeAttr(t.name)}" ${defaultAddTopic === t.name ? "selected" : ""}>${escapeHtml(t.emoji)} ${escapeHtml(t.name)}</option>`).join("")}
            </select>
            <select id="goalYearSel">
              ${YEARS.map(y => `<option value="${y}" ${defaultAddYear === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
            </select>
            <select id="goalPeriodSel">
              ${PERIODS.map(p => `<option value="${p}" ${defaultAddPeriod === p ? "selected" : ""}>${p}</option>`).join("")}
            </select>
            <input type="text" id="goalTitleInp" style="flex:1; min-width:200px;" placeholder="목표 제목 입력..." onkeydown="if(event.key==='Enter') addGoal()" />
          </div>
          <div class="form-row">
            <textarea id="goalNoteInp" style="width:100%; min-height:70px; resize:vertical;" placeholder="목표의 구체적인 실행 계획, 다짐, 기준 등 본문 내용을 작성하세요..."></textarea>
          </div>
          <div class="composer-footer">
            <div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px;">
              <label class="btn" style="cursor:pointer;">
                사진 추가 (최대 5장)
                <input type="file" id="goalImgInp" accept="image/*" multiple style="display:none" onchange="handleNewGoalImages(event)" />
              </label>
              <div id="newGoalImgPreview" class="img-preview-box">${renderThumbList(draftGoalImages, "removeDraftGoalImage")}</div>
            </div>
            <div class="composer-actions">
              <button class="btn" onclick="toggleGoalComposer()">취소</button>
              <button class="btn btn-primary" onclick="addGoal()">목표 저장</button>
            </div>
          </div>
        </div>
      ` : ""}

      ${filtered.length ? `
        <div class="media-grid">
          ${filtered.map(g => {
            const emoji = getTopicEmoji(g.topic);
            const yr = normalizeYear(g.year);
            const pr = normalizePeriod(g.period);
            const imgs = normalizeImages(g);
            return `
              <article class="media-card ${g.done ? "done" : ""}">
                <div class="media-cover" onclick="openViewGoal('${g.id}')" title="자세히 보기">
                  ${imgs.length > 0
                    ? `<img src="${imgs[0]}" alt="${escapeAttr(g.title)}" />${imgs.length > 1 ? `<span class="photo-count-badge">+${imgs.length - 1}장</span>` : ""}`
                    : `<div class="cover-placeholder"><span class="big-emoji">${escapeHtml(emoji)}</span><span>${escapeHtml(g.topic)}</span></div>`
                  }
                </div>
                <div class="media-body">
                  <div class="media-top">
                    <div style="display:flex; flex-wrap:wrap; gap:4px;">
                      <span class="pill">${escapeHtml(emoji)} ${escapeHtml(g.topic)}</span>
                      <span class="pill">${yr}년 · ${escapeHtml(pr)}</span>
                    </div>
                    <div style="flex-shrink:0;">
                      <button class="icon-btn" onclick="openEditGoal('${g.id}')" title="수정">${ICONS.pencil}</button>
                      <button class="icon-btn danger" onclick="deleteItem('goals','${g.id}')" title="삭제">${ICONS.trash}</button>
                    </div>
                  </div>
                  <div class="media-title-row">
                    <input type="checkbox" class="chk" ${g.done ? "checked" : ""} onchange="toggleAchieve('goals','${g.id}')" />
                    <h3 class="media-title" style="cursor:pointer;" onclick="openViewGoal('${g.id}')">${escapeHtml(g.title)}</h3>
                  </div>
                  ${g.note ? `<div class="media-note">${escapeHtml(g.note)}</div>` : ""}
                  ${g.done ? `<div class="item-meta">${renderDoneDateControl("goals", g.id, g.doneDate)}</div>` : ""}
                </div>
              </article>
            `;
          }).join("")}
        </div>
      ` : `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">해당 조건에 맞는 목표가 없습니다. 상단의 '+ 새 목표 추가' 버튼으로 목표를 등록해 보세요.</p>
        </div>
      `}
    `;
  }

  function addTopic() {
    const emojiInp = document.getElementById("newTopicEmojiInp");
    const nameInp = document.getElementById("newTopicInp");
    const emoji = (emojiInp.value || "").trim() || "🎯";
    const name = (nameInp.value || "").trim();
    if (!name) return;
    if (state.topics.some(t => t.name === name)) {
      alert("이미 같은 이름의 주제가 있습니다.");
      return;
    }
    state.topics.push({ name, emoji });
    saveState();
    render();
  }

  function openEditTopic(idx) {
    const target = state.topics[idx];
    if (!target) return;
    openModal("주제 수정", `
      <div class="modal-field">
        <label>이모지</label>
        <input type="text" id="mTopicEmoji" class="emoji-input" maxlength="4" value="${escapeAttr(target.emoji)}" />
      </div>
      <div class="modal-field">
        <label>주제 이름 (기존 목표들의 주제명도 함께 변경됩니다)</label>
        <input type="text" id="mTopicName" value="${escapeAttr(target.name)}" />
      </div>
    `, () => {
      const newEmoji = document.getElementById("mTopicEmoji").value.trim() || target.emoji;
      const newName = document.getElementById("mTopicName").value.trim();
      if (!newName) return;
      if (newName !== target.name && state.topics.some(t => t.name === newName)) {
        alert("이미 같은 이름의 주제가 있습니다.");
        return;
      }
      const oldName = target.name;
      state.topics[idx] = { name: newName, emoji: newEmoji };
      if (state.goalTopicFilter === oldName) state.goalTopicFilter = newName;
      state.goals.forEach(g => {
        if (g.topic === oldName) g.topic = newName;
      });
    });
  }

  function deleteTopic(idx) {
    const target = state.topics[idx];
    if (!target) return;
    const count = state.goals.filter(g => g.topic === target.name).length;
    const msg = count > 0
      ? `'${target.emoji} ${target.name}' 주제를 삭제할까요? 이 주제에 속한 목표 ${count}개도 함께 삭제됩니다.`
      : `'${target.emoji} ${target.name}' 주제를 삭제할까요?`;
    if (!confirm(msg)) return;
    state.topics.splice(idx, 1);
    if (state.goalTopicFilter === target.name) state.goalTopicFilter = "all";
    state.goals = state.goals.filter(g => g.topic !== target.name);
    saveState();
    render();
  }

  function addGoal() {
    const topicSel = document.getElementById("goalTopicSel");
    const topic = topicSel ? topicSel.value : (state.topics[0]?.name || "기타");
    const year = normalizeYear(document.getElementById("goalYearSel").value);
    const period = normalizePeriod(document.getElementById("goalPeriodSel").value);
    const title = document.getElementById("goalTitleInp").value.trim();
    const note = document.getElementById("goalNoteInp").value.trim();
    if (!title) return;
    state.goals.unshift({
      id: uid(),
      topic,
      year,
      period,
      title,
      note,
      images: [...draftGoalImages],
      done: false,
      doneDate: ""
    });
    draftGoalImages = [];
    showGoalComposer = false;
    saveState();
    render();
  }

  function openViewGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    const emoji = getTopicEmoji(g.topic);
    const imgs = normalizeImages(g);
    openViewModal(
      `${emoji} ${g.topic} · ${normalizeYear(g.year)}년 ${normalizePeriod(g.period)}`,
      `
        ${imgs.length ? `<div class="modal-gallery">${imgs.map(src => `<img src="${src}" alt="${escapeAttr(g.title)}" />`).join("")}</div>` : ""}
        <h4 style="margin:0 0 8px; font-size:17px;">${escapeHtml(g.title)}</h4>
        <div style="font-size:14px; line-height:1.7; white-space:pre-line;">${escapeHtml(g.note || "작성된 본문 내용이 없습니다.")}</div>
      `,
      () => openEditGoal(id)
    );
  }

  let modalGoalImages = [];
  async function handleModalGoalImages(event) {
    try {
      modalGoalImages = await processMultipleFiles(event.target.files, modalGoalImages, 5);
      event.target.value = "";
      const box = document.getElementById("mGoalImgBox");
      if (box) box.innerHTML = renderThumbList(modalGoalImages, "removeModalGoalImage");
    } catch {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
  }

  function removeModalGoalImage(idx) {
    modalGoalImages.splice(idx, 1);
    const box = document.getElementById("mGoalImgBox");
    if (box) box.innerHTML = renderThumbList(modalGoalImages, "removeModalGoalImage");
  }

  function openEditGoal(id) {
    const g = state.goals.find(x => x.id === id);
    if (!g) return;
    modalGoalImages = [...normalizeImages(g)];
    const curYear = normalizeYear(g.year);
    const curPeriod = normalizePeriod(g.period);
    openModal("목표 수정", `
      <div class="modal-field">
        <label>주제</label>
        <select id="mGoalTopic">
          ${state.topics.map(t => `<option value="${escapeAttr(t.name)}" ${g.topic === t.name ? "selected" : ""}>${escapeHtml(t.emoji)} ${escapeHtml(t.name)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>연도</label>
        <select id="mGoalYear">
          ${YEARS.map(y => `<option value="${y}" ${curYear === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>기간</label>
        <select id="mGoalPeriod">
          ${PERIODS.map(p => `<option value="${p}" ${curPeriod === p ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>목표 제목</label>
        <input type="text" id="mGoalTitle" value="${escapeAttr(g.title)}" />
      </div>
      <div class="modal-field">
        <label>본문 내용 · 실행 메모</label>
        <textarea id="mGoalNote" style="min-height:100px;">${escapeHtml(g.note || "")}</textarea>
      </div>
      <div class="modal-field">
        <label>대표 이미지 (최대 5장)</label>
        <input type="file" accept="image/*" multiple onchange="handleModalGoalImages(event)" />
        <div id="mGoalImgBox" class="img-preview-box">
          ${renderThumbList(modalGoalImages, "removeModalGoalImage")}
        </div>
      </div>
    `, () => {
      g.topic = document.getElementById("mGoalTopic").value;
      g.year = normalizeYear(document.getElementById("mGoalYear").value);
      g.period = normalizePeriod(document.getElementById("mGoalPeriod").value);
      g.title = document.getElementById("mGoalTitle").value.trim() || g.title;
      g.note = document.getElementById("mGoalNote").value.trim();
      g.images = [...modalGoalImages];
      delete g.image;
    });
  }

  // 연간 목표 뷰
  function changeAnnualGoalYearFilter(val) {
    state.annualGoalYearFilter = val === "all" ? "all" : normalizeYear(val);
    saveState();
    render();
  }

  function renderAnnualGoalsView() {
    const targetYear = state.annualGoalYearFilter === "all" ? "all" : normalizeYear(state.annualGoalYearFilter);
    const filtered = state.goals.filter(g => targetYear === "all" || normalizeYear(g.year) === targetYear);
    const totalCnt = filtered.length;
    const doneCnt = filtered.filter(g => g.done).length;
    const pct = totalCnt > 0 ? Math.round((doneCnt / totalCnt) * 100) : 0;

    const groupsHtml = PERIODS.map(period => {
      const items = filtered.filter(g => normalizePeriod(g.period) === period);
      if (items.length === 0) return "";
      return `
        <div class="card">
          <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-plan);">${escapeHtml(period)} (${items.filter(i => i.done).length}/${items.length})</h3>
          <div class="item-list">
            ${items.map(g => `
              <div class="list-item ${g.done ? "done" : ""}">
                <div class="item-left">
                  <input type="checkbox" class="chk" ${g.done ? "checked" : ""} onchange="toggleAchieve('goals','${g.id}')" />
                  <div>
                    <div class="item-title" style="cursor:pointer;" onclick="openViewGoal('${g.id}')">${escapeHtml(g.title)}</div>
                    ${g.note ? `<div style="font-size:12px; color:var(--text-sub); margin-top:2px;">${escapeHtml(g.note)}</div>` : ""}
                    <div class="item-meta">
                      ${targetYear === "all" ? `<span class="pill">${normalizeYear(g.year)}년</span>` : ""}
                      <span class="pill">${escapeHtml(getTopicEmoji(g.topic))} ${escapeHtml(g.topic)}</span>
                      ${g.done ? renderDoneDateControl("goals", g.id, g.doneDate) : ""}
                    </div>
                  </div>
                </div>
                <div>
                  <button class="icon-btn" onclick="openEditGoal('${g.id}')" title="수정">${ICONS.pencil}</button>
                  <button class="icon-btn danger" onclick="deleteItem('goals','${g.id}')" title="삭제">${ICONS.trash}</button>
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-plan">${ICONS.plans} 연간 목표</h1>
          <span class="topbar-sub">주제별 목표를 기간별로 모아봅니다</span>
        </div>
        <div class="topbar-right">
          ${yearSelectHtml(targetYear, "changeAnnualGoalYearFilter")}
          <button class="btn btn-primary" onclick="showGoalComposer=true; setTab('goals')">+ 새 목표 추가</button>
        </div>
      </div>

      <div class="summary-strip">
        <div class="summary-metrics">
          <span>${targetYear === "all" ? "전체 연도" : `${targetYear}년`} 목표 <strong>${totalCnt}개</strong></span>
          <span>달성 완료 <strong style="color:var(--c-goal);">${doneCnt}개</strong></span>
          <span>달성률 <strong>${pct}%</strong></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;"></div>
        </div>
      </div>

      ${groupsHtml || `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">선택한 연도에 등록된 목표가 없습니다. 주제별 목표에서 목표를 추가해 보세요.</p>
        </div>
      `}
    `;
  }

  // 버킷리스트 뷰 (이모지 + 카테고리 추가/수정/삭제 통일)
  function changeBucketCatFilter(cat) {
    state.bucketCatFilter = cat;
    saveState();
    render();
  }

  function addBucketCategory() {
    const emojiInp = document.getElementById("newBucketCatEmojiInp");
    const nameInp = document.getElementById("newBucketCatNameInp");
    const emoji = (emojiInp.value || "").trim() || "⭐";
    const name = (nameInp.value || "").trim();
    if (!name) return;
    if (state.bucketCategories.some(c => c.name === name)) {
      alert("이미 같은 이름의 카테고리가 있습니다.");
      return;
    }
    state.bucketCategories.push({ name, emoji });
    saveState();
    render();
  }

  function openEditBucketCategory(idx) {
    const target = state.bucketCategories[idx];
    if (!target) return;
    openModal("버킷리스트 카테고리 수정", `
      <div class="modal-field">
        <label>이모지</label>
        <input type="text" id="mBucketCatEmoji" class="emoji-input" maxlength="4" value="${escapeAttr(target.emoji)}" />
      </div>
      <div class="modal-field">
        <label>카테고리 이름</label>
        <input type="text" id="mBucketCatName" value="${escapeAttr(target.name)}" />
      </div>
    `, () => {
      const newEmoji = document.getElementById("mBucketCatEmoji").value.trim() || target.emoji;
      const newName = document.getElementById("mBucketCatName").value.trim();
      if (!newName) return;
      if (newName !== target.name && state.bucketCategories.some(c => c.name === newName)) {
        alert("이미 같은 이름의 카테고리가 있습니다.");
        return;
      }
      const oldName = target.name;
      state.bucketCategories[idx] = { name: newName, emoji: newEmoji };
      if (state.bucketCatFilter === oldName) state.bucketCatFilter = newName;
      state.buckets.forEach(b => {
        if (b.category === oldName) b.category = newName;
      });
    });
  }

  function deleteBucketCategory(idx) {
    const target = state.bucketCategories[idx];
    if (!target) return;
    const count = state.buckets.filter(b => b.category === target.name).length;
    const msg = count > 0
      ? `'${target.emoji} ${target.name}' 카테고리를 삭제할까요? 이 카테고리에 속한 항목 ${count}개도 함께 삭제됩니다.`
      : `'${target.emoji} ${target.name}' 카테고리를 삭제할까요?`;
    if (!confirm(msg)) return;
    state.bucketCategories.splice(idx, 1);
    if (state.bucketCatFilter === target.name) state.bucketCatFilter = "all";
    state.buckets = state.buckets.filter(b => b.category !== target.name);
    saveState();
    render();
  }

  function changeBucketSort(val) {
    state.bucketSort = val;
    saveState();
    render();
  }

  function toggleBucketComposer() {
    showBucketComposer = !showBucketComposer;
    render();
  }

  function renderBucketView() {
    let filtered = state.buckets.filter(b => state.bucketCatFilter === "all" || b.category === state.bucketCatFilter);
    if (state.bucketSort === "undone") {
      filtered = [...filtered].sort((a, b) => Number(a.done) - Number(b.done));
    } else if (state.bucketSort === "done") {
      filtered = [...filtered].sort((a, b) => Number(b.done) - Number(a.done));
    } else if (state.bucketSort === "oldest") {
      filtered = [...filtered].reverse();
    }

    const totalCnt = filtered.length;
    const doneCnt = filtered.filter(b => b.done).length;
    const pct = totalCnt > 0 ? Math.round((doneCnt / totalCnt) * 100) : 0;

    const defaultCat = state.bucketCatFilter === "all"
      ? (state.bucketCategories[0]?.name || "기타")
      : state.bucketCatFilter;

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-bucket">${ICONS.bucket} 버킷리스트</h1>
          <span class="topbar-sub">총 ${totalCnt}개</span>
        </div>
        <div class="topbar-right">
          <select class="year-select" onchange="changeBucketSort(this.value)" aria-label="정렬">
            <option value="newest" ${state.bucketSort === "newest" ? "selected" : ""}>최신순</option>
            <option value="oldest" ${state.bucketSort === "oldest" ? "selected" : ""}>오래된순</option>
            <option value="undone" ${state.bucketSort === "undone" ? "selected" : ""}>미달성 우선</option>
            <option value="done" ${state.bucketSort === "done" ? "selected" : ""}>달성 완료 우선</option>
          </select>
          <button class="btn btn-primary" onclick="toggleBucketComposer()">
            ${showBucketComposer ? "닫기" : "+ 새 버킷 추가"}
          </button>
        </div>
      </div>

      <div class="summary-strip">
        <div class="summary-metrics">
          <span>현재 목록 <strong>${totalCnt}개</strong></span>
          <span>달성 완료 <strong style="color:var(--c-bucket);">${doneCnt}개</strong></span>
          <span>달성률 <strong>${pct}%</strong></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%; background:var(--c-bucket);"></div>
        </div>
      </div>

      <div class="filter-bar-wrap">
        <div class="filter-chips">
          <button class="chip-btn ${state.bucketCatFilter === "all" ? "active" : ""}" onclick="changeBucketCatFilter('all')">
            전체 (${state.buckets.length})
          </button>
          ${state.bucketCategories.map((cat, idx) => {
            const cnt = state.buckets.filter(b => b.category === cat.name).length;
            const isAct = state.bucketCatFilter === cat.name;
            return `
              <span class="chip-wrap ${isAct ? "active" : ""}">
                <button class="chip-btn ${isAct ? "active" : ""}" onclick="changeBucketCatFilter('${escapeAttr(cat.name)}')">
                  <span>${escapeHtml(cat.emoji)}</span> ${escapeHtml(cat.name)} (${cnt})
                </button>
                <button class="chip-action-btn" onclick="openEditBucketCategory(${idx})" title="카테고리 수정">${ICONS.pencil}</button>
                <button class="chip-action-btn" onclick="deleteBucketCategory(${idx})" title="카테고리 삭제">${ICONS.trash}</button>
              </span>
            `;
          }).join("")}
        </div>
        <div class="cat-add-inline">
          <input type="text" id="newBucketCatEmojiInp" class="emoji-input" placeholder="이모지" maxlength="4" value="⭐" />
          <input type="text" id="newBucketCatNameInp" style="width:150px;" placeholder="새 카테고리명 입력" onkeydown="if(event.key==='Enter') addBucketCategory()" />
          <button class="btn" onclick="addBucketCategory()">카테고리 추가</button>
        </div>
      </div>

      ${showBucketComposer ? `
        <div class="card composer-card">
          <div class="composer-header">
            <h3 style="color:var(--c-bucket);">새 버킷리스트 등록</h3>
            <button class="btn btn-sm" onclick="toggleBucketComposer()">취소</button>
          </div>
          <div class="form-row">
            <select id="bucketCatSel">
              ${state.bucketCategories.map(c => `<option value="${escapeAttr(c.name)}" ${defaultCat === c.name ? "selected" : ""}>${escapeHtml(c.emoji)} ${escapeHtml(c.name)}</option>`).join("")}
            </select>
            <input type="text" id="bucketTitleInp" style="flex:1; min-width:200px;" placeholder="언젠가 꼭 해보고 싶은 버킷리스트..." onkeydown="if(event.key==='Enter') addBucket()" />
            <input type="text" id="bucketNoteInp" style="flex:1; min-width:160px;" placeholder="세부 메모 (선택)" onkeydown="if(event.key==='Enter') addBucket()" />
          </div>
          <div class="composer-footer">
            <span style="font-size:12px; color:var(--text-sub);">Enter 키로 바로 저장할 수 있습니다</span>
            <div class="composer-actions">
              <button class="btn" onclick="toggleBucketComposer()">취소</button>
              <button class="btn btn-primary" onclick="addBucket()">버킷 저장</button>
            </div>
          </div>
        </div>
      ` : ""}

      <div class="card">
        <div class="item-list">
          ${filtered.length ? filtered.map(b => `
            <div class="list-item ${b.done ? "done" : ""}">
              <div class="item-left">
                <input type="checkbox" class="chk" ${b.done ? "checked" : ""} onchange="toggleAchieve('buckets','${b.id}')" />
                <div>
                  <div class="item-title">${escapeHtml(b.title)}</div>
                  <div class="item-meta">
                    <span class="pill">${escapeHtml(getBucketCatEmoji(b.category))} ${escapeHtml(b.category)}</span>
                    ${b.note ? `<span>${escapeHtml(b.note)}</span>` : ""}
                    ${b.done ? renderDoneDateControl("buckets", b.id, b.doneDate) : ""}
                  </div>
                </div>
              </div>
              <div>
                <button class="icon-btn" onclick="openEditBucket('${b.id}')" title="수정">${ICONS.pencil}</button>
                <button class="icon-btn danger" onclick="deleteItem('buckets','${b.id}')" title="삭제">${ICONS.trash}</button>
              </div>
            </div>
          `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 버킷리스트가 없습니다. 상단의 '+ 새 버킷 추가' 버튼으로 등록해 보세요.</p>`}
        </div>
      </div>
    `;
  }

  function addBucket() {
    const sel = document.getElementById("bucketCatSel");
    const category = sel ? sel.value : (state.bucketCategories[0]?.name || "기타");
    const title = document.getElementById("bucketTitleInp").value.trim();
    const note = document.getElementById("bucketNoteInp").value.trim();
    if (!title) return;
    state.buckets.unshift({ id: uid(), category, title, note, done: false, doneDate: "" });
    showBucketComposer = false;
    saveState();
    render();
  }

  function changeArchiveCatFilter(cat) {
    state.archiveCatFilter = cat;
    saveState();
    render();
  }

  function changeArchiveSort(val) {
    state.archiveSort = val;
    saveState();
    render();
  }

  function toggleArchiveComposer() {
    showArchiveComposer = !showArchiveComposer;
    render();
  }

    const nameInp = document.getElementById("newArchiveCatNameInp");

      <div class="modal-field">
        <label>이모지</label>
        <input type="text" id="mArchCatEmoji" class="emoji-input" maxlength="4" value="${escapeAttr(target.emoji)}" />
      </div>
      <div class="modal-field">
        <label>카테고리 이름 (기존 기록의 카테고리명도 함께 변경됩니다)</label>

      const newName = document.getElementById("mArchCatName").value.trim();

  function deleteArchiveCategory(idx) {

    if (!target) return;
    const count = state.archives.filter(a => a.category === target.name).length;
    const msg = count > 0
      ? `'${target.emoji} ${target.name}' 카테고리를 삭제할까요? 이 카테고리에 속한 기록 ${count}개도 함께 삭제됩니다.`
