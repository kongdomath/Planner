    .nb-action:hover .nb-action-icon { background: rgba(255,255,255,.2); transform: translateY(-1px); }
    .nb-action.primary .nb-action-icon { background: #f6f7fb; border-color: #f6f7fb; color: #2b3145; }
    .nb-action.primary:hover .nb-action-icon { background: #ffffff; }

    /* ===== v3.1 3탭 공통: 읽기 상단바·하단 컨트롤 고정 높이 (책 위치 통일) ===== */
    .nb-reader-head { min-height: 44px; margin-bottom: 4px; overflow: visible; }
    .nb-bottom-bar {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      gap: 10px; height: 64px; margin-top: 12px;
    }
    .nb-bar-left { justify-self: start; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .nb-bar-right { justify-self: end; display: flex; align-items: center; gap: 8px; min-width: 0; }
    .nb-add-btn {
      width: 46px; height: 46px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #f6f7fb; background: #f6f7fb; color: #2b3145;
      box-shadow: 0 10px 22px -10px rgba(6,9,18,.7);
      cursor: pointer; padding: 0; font-family: inherit;
      transition: transform .16s ease, background .16s ease;
    }
    .nb-add-btn svg { width: 20px; height: 20px; }
    .nb-add-btn:hover { background: #fff; transform: translateY(-1px); }
    .nb-bar-btn {
      height: 30px; padding: 0 12px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
      color: #e8ebf4; font-size: 11.5px; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
    }
    .nb-bar-btn:hover { background: rgba(255,255,255,.17); }
    .nb-legend-slot { height: 30px; display: flex; align-items: center; justify-content: center; }
    .nb-legend-slot .nb-legend { margin-top: 0; padding-top: 0; border-top: 0; }

    /* 펼친 노트 */
    .nb-reader-head {
      display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .nb-back {
      justify-self: start;
      display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 11px 0 8px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
      color: #e8ebf4; font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .nb-back:hover { background: rgba(255,255,255,.17); }
    .nb-reader-head .nb-stage-count { justify-self: end; }
    .nb-reader-title { text-align: center; min-width: 0; justify-self: center; }
    .nb-reader-title b { display: block; font-size: 15.5px; line-height: 19px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb-reader-title span { display: block; margin-top: 1px; font-size: 10.5px; line-height: 13px; color: rgba(232,235,244,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb-book {
      position: relative; display: flex; flex: 1 1 auto;
      align-items: center; justify-content: center;
      padding: 12px 44px 2px;
      perspective: 2600px;
      perspective-origin: 50% 46%;
    }
    .nb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%; z-index: 6;
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.12);
      color: #f2f4fa; display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
    }
    .nb-nav:hover { background: rgba(255,255,255,.24); }
    .nb-nav[disabled] { opacity: .25; cursor: default; }
    .nb-nav.prev { left: 2px; }
    .nb-nav.next { right: 2px; }
    .nb-spread {
      position: relative;
      display: grid; grid-template-columns: 1fr 1fr;
      width: 100%; max-width: 1180px;
      height: var(--book-h, 660px);
      /* 속지·넘김 종이가 같은 모서리를 쓰도록 한 곳에서 정의 (책등 쪽은 직각, 바깥쪽만 둥글게) */
      --nb-r-left: 14px 0 0 14px;
      --nb-r-right: 0 14px 14px 0;
      border-radius: 6px;
      transform-style: preserve-3d;
      box-shadow: 0 26px 46px -18px rgba(6,9,18,.62), 0 4px 10px rgba(6,9,18,.3);
    }
    .nb-spread[data-turning="1"] { pointer-events: none; }
    .nb-spread[data-turning="1"] .idx-tabs { opacity: .18; transition: opacity .2s ease; }
    .nb-page {
      position: relative; z-index: 1;
      height: 100%; min-height: 0; max-height: none; overflow-y: auto;
      padding: 34px 36px 34px;
      background-color: #fcfbf6;
      color: #2b2f37;
      backface-visibility: hidden;
      -webkit-overflow-scrolling: touch;
    }
    .nb-page--left {
      padding-right: 48px;
      border-radius: var(--nb-r-left, 14px 0 0 14px);
      background-image: linear-gradient(90deg, rgba(120,110,86,.10), rgba(120,110,86,0) 26%);
      box-shadow: inset -24px 0 28px -28px rgba(30,34,44,.55);
      transform-origin: right center;
    }
    .nb-page--right {
      padding-left: 48px;
      border-radius: var(--nb-r-right, 0 14px 14px 0);
      background-image: radial-gradient(rgba(122,128,142,.17) 1px, transparent 1px);
      background-size: 19px 19px;
      background-position: 12px 14px;
      box-shadow: inset 24px 0 28px -28px rgba(30,34,44,.55);
      transform-origin: left center;
    }
    .nb-page::-webkit-scrollbar { width: 6px; }
    .nb-page::-webkit-scrollbar-thumb { background: rgba(120,126,140,.35); border-radius: 3px; }
    /* 넘기는 종이의 명암: 넘어가는 동안 어두워졌다가 새 장이 밝아짐 */
    .nb-page::after {
      content: ""; position: absolute; inset: 0; z-index: 4;
      pointer-events: none; opacity: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(44,36,24,.62), rgba(44,36,24,.2) 46%, rgba(255,255,255,0) 82%);
    }
    .nb-page--right::after {
      background: linear-gradient(90deg, rgba(44,36,24,.62), rgba(44,36,24,.2) 46%, rgba(255,255,255,0) 82%);
    }
    .nb-page--left::after {
      background: linear-gradient(270deg, rgba(44,36,24,.62), rgba(44,36,24,.2) 46%, rgba(255,255,255,0) 82%);
    }
    .nb-page.leaf-out-next::after { animation: leafShadeIn .24s ease-in both; }
    .nb-page.leaf-out-prev::after { animation: leafShadeIn .24s ease-in both; }
    .nb-page.leaf-in-next::after { animation: leafShadeOut .32s ease-out both; }
    .nb-page.leaf-in-prev::after { animation: leafShadeOut .32s ease-out both; }
    .nb-spine {
      position: absolute; left: 50%; top: -4px; bottom: -4px; width: 54px; z-index: 3;
      transform: translateX(-50%); pointer-events: none;
      /* 양장본 중앙 제본: 양쪽 종이가 책등 속으로 깊게 접혀 들어가는 그늘 */
      background: linear-gradient(90deg,
        rgba(30,34,46,0) 0%,
        rgba(30,34,46,.11) 20%,
        rgba(30,34,46,.26) 36%,
        rgba(24,28,40,.40) 46%,
        rgba(16,20,30,.50) 50%,
        rgba(24,28,40,.40) 54%,
        rgba(30,34,46,.26) 64%,
        rgba(30,34,46,.11) 80%,
        rgba(30,34,46,0) 100%);
    }
    .nb-spine::after {
      content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.16) 10%, rgba(255,255,255,.16) 90%, rgba(255,255,255,.06));
    }
    /* v3.5 양장본: 스프링·펀치홀 없이 가운데 제본 그늘로 묶는다 */
    .nb-page-inner { display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
    .nb-page-no {
      display: block;
      margin-top: auto;
      padding-top: 14px;
      text-align: center;
      font-size: 10px;
      letter-spacing: .16em;
      color: #b3b7bf;
      font-family: Georgia, "Times New Roman", serif;
      user-select: none; -webkit-user-select: none;
    }
    .nb-photo-frame {
      position: relative; background: #fff; border-radius: 2px;
      padding: 9px 9px 30px;
      box-shadow: 0 10px 20px rgba(30,34,44,.18), 0 1px 0 rgba(0,0,0,.04);
      transform: rotate(-1.2deg);
      cursor: zoom-in;
    }
    .nb-photo-frame img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #eceade; border-radius: 1px; }
    .nb-photo-tape {
      position: absolute; top: -9px; left: 50%; width: 78px; height: 20px;
      transform: translateX(-50%) rotate(-1.6deg);
      background: rgba(208,190,146,.55);
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .nb-photo-count {
      position: absolute; right: 14px; bottom: 8px;
      font-size: 10px; font-weight: 600; color: #8a8d95; letter-spacing: .02em;
    }
    .nb-photo-zoom {
      position: absolute; right: 14px; top: 14px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid rgba(120,126,140,.26); background: rgba(252,251,247,.94);
      color: #4a5162; cursor: zoom-in;
      box-shadow: 0 2px 6px rgba(20,24,32,.12);
    }
    .nb-photo-zoom:hover { background: #fff; color: #23262d; }
    .nb-photo-frame { cursor: default; }
    .nb-thumbs { display: flex; gap: 7px; flex-wrap: wrap; }
    .nb-thumb {
      width: 40px; height: 40px; border-radius: 4px; overflow: hidden; padding: 0;
      border: 1px solid rgba(120,126,140,.28); background: #fff; cursor: pointer;
    }
    .nb-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .nb-visual {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; flex: 1; min-height: 236px;
      border: 1px solid rgba(120,126,140,.22); border-radius: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,250,240,.55));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 1px 2px rgba(30,34,44,.04);
      padding: 22px 16px;
    }
    .nb-visual-icon { color: #5b6478; opacity: .9; }
    .nb-visual-date { font-family: Georgia, "Times New Roman", serif; font-size: 36px; letter-spacing: .02em; color: #3a4152; }
    .nb-visual-sub { font-size: 11.5px; color: #8a8e98; letter-spacing: .04em; }
    .nb-visual-rule { width: 40px; height: 1px; background: rgba(120,126,140,.38); margin: 4px 0; }
    .nb-visual-cat { font-size: 10.5px; font-weight: 600; letter-spacing: .18em; color: #7d818b; text-transform: uppercase; }
    .nb-stamps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: auto; cursor: pointer; }
    .nb-stamps:hover .nb-stamp { background: rgba(43,76,126,.09); }
    .nb-stamp {
      display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
      border: 1.5px solid rgba(43,76,126,.5); border-radius: 4px;
      padding: 5px 9px; color: #2b4c7e; transform: rotate(-2deg);
      font-family: Georgia, "Times New Roman", serif;
      background: rgba(43,76,126,.045);
      box-shadow: inset 0 0 0 2px rgba(252,251,246,.92), inset 0 0 0 3px rgba(43,76,126,.2);
    }
    .nb-stamp b { font-size: 12.5px; letter-spacing: .05em; font-weight: 700; white-space: nowrap; }
    .nb-stamp span { font-size: 8.5px; letter-spacing: .14em; white-space: nowrap; }
    .nb-stamp--range b { font-size: 10.5px; letter-spacing: .05em; }
    /* 기간 도장: 두 줄(시작일·종료일)의 크기·굵기·자간을 완전히 동일하게 */
    .nb-stamp--range .nb-stamp-date { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; }
    .nb-stamp--done { border-color: rgba(45,106,79,.55); color: #2d6a4f; background: rgba(45,106,79,.05); box-shadow: inset 0 0 0 2px rgba(252,251,246,.92), inset 0 0 0 3px rgba(45,106,79,.2); }
    .nb-stamp--plan { border-color: rgba(120,126,140,.45); color: #6b707a; background: rgba(120,126,140,.05); box-shadow: inset 0 0 0 2px rgba(252,251,246,.92), inset 0 0 0 3px rgba(120,126,140,.14); }
    /* ===== v3.4 아카이브 세부정보 도장 (파란 날짜 도장 옆, 따뜻한 테라코타) ===== */
    .nb-stamp--detail {
      border-color: rgba(168,86,53,.55); color: #8f4526;
      background: rgba(168,86,53,.055);
      transform: rotate(1.6deg);
      box-shadow: inset 0 0 0 2px rgba(252,251,246,.94), inset 0 0 0 3px rgba(168,86,53,.18);
      max-width: 64%; align-items: flex-start; text-align: left; gap: 1px;
      padding: 5px 9px 5px;
    }
    .nb-stamp--detail .nb-stamp-label { font-size: 8px; letter-spacing: .16em; font-weight: 700; opacity: .8; }
    .nb-stamp--detail b {
      font-size: 11.5px; font-weight: 700; letter-spacing: 0; line-height: 1.4;
      white-space: normal; word-break: keep-all;
    }
    /* 세부정보 블록: 파선 대신 종이 노트에 어울리는 틴트 카드 */
    .nb-meta {
      position: relative; margin: 0 0 4px;
      padding: 11px 14px 11px 16px;
      border-radius: 3px 10px 10px 3px;
      background: linear-gradient(180deg, rgba(243,236,220,.92), rgba(238,230,211,.72));
      box-shadow: inset 0 0 0 1px rgba(196,182,152,.42), 0 1px 2px rgba(60,52,36,.05);
    }
    .nb-meta::before {
      content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px;
      border-radius: 3px; background: linear-gradient(180deg, #c3ad82, #a98f63);
    }
    .nb-meta-label {
      display: block; font-size: 8.5px; font-weight: 700; letter-spacing: .2em;
      color: #9a835f; text-transform: uppercase; margin-bottom: 3px;
    }
    .nb-meta-text { margin: 0; font-size: 12.5px; line-height: 1.6; color: #4d463a; word-break: keep-all; }
    .nb-meta--empty .nb-meta-text { color: #a9a294; font-style: italic; }
    .nb-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; color: #4a5162;
      background: rgba(120,126,140,.12); border-radius: 999px; padding: 4px 9px;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nb-badge svg { flex-shrink: 0; }
    .nb-badge--ghost { background: transparent; border: 1px dashed rgba(120,126,140,.42); color: #6b707a; }
    .nb-note-title { margin: 0 0 6px; font-size: 23px; line-height: 1.4; font-weight: 700; letter-spacing: -0.02em; color: #23262d; word-break: keep-all; }
    .nb-note-sub { font-size: 12px; color: #82868f; letter-spacing: .01em; }
    .nb-note-rule { height: 1px; margin: 14px 0 16px; background: linear-gradient(90deg, rgba(120,126,140,.42), rgba(120,126,140,0)); }
    .nb-note-body { font-size: 14.5px; line-height: 2.05; color: #3b404a; white-space: pre-wrap; word-break: keep-all; overflow-wrap: break-word; letter-spacing: -0.004em; }
    /* 글 면: 별도 수정 버튼 없이 내용을 누르면 바로 수정 (빈 곳 탭은 면 뒤집기 그대로) */
    .nb-note--edit { cursor: pointer; border-radius: 6px; margin: -6px; padding: 6px; transition: background .14s ease; }
    .nb-note--edit:hover { background: rgba(120,126,140,.05); }
    .nb-note--edit:hover .nb-note-title { color: #14181f; }
    .nb-note-empty { color: #a0a4ad; font-size: 12.5px; }
    /* v3.6 사진 없는 기록: 넓은 한 면에 제목·부제목·도장·감상을 함께 */
    .nb-page--wide {
      grid-column: 1 / -1;
      padding: 40px 64px 34px;
      border-radius: 8px;
      background-image: radial-gradient(rgba(122,128,142,.15) 1px, transparent 1px);
      background-size: 19px 19px;
      background-position: 14px 16px;
      box-shadow: inset 0 0 90px -70px rgba(30,34,44,.5);
    }
    .nb-note-single { gap: 0; }
    .nb-note--wide { margin: 0; padding: 0; }
    .nb-note--wide .nb-note-body, .nb-note--wide .nb-note-head { max-width: 64ch; }
    .nb-note-head { display: flex; flex-direction: column; gap: 7px; }
    .nb-note-head .nb-note-title { margin: 0; }
    .nb-stamps--inline { margin-top: 6px; }
    /* v3.6 책 안쪽의 + 버튼은 없앴다 — 마지막 면은 책 요약과 뒤표지 */
    .nb-guide-summary { gap: 10px; justify-content: center; }
    .nb-summary-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: #2b2f37; }
    .nb-summary-list { list-style: none; margin: 4px 0 6px; padding: 0; display: flex; flex-direction: column; gap: 9px; }
    .nb-summary-list li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12px; color: #7d818b; border-bottom: 1px dashed rgba(120,126,140,.28); padding-bottom: 8px; }
    .nb-summary-list b { font-size: 12.5px; color: #33383f; font-weight: 700; }
    .nb-side-toggle { display: none; }

    /* ===== v2.9 책자 인덱스 탭 · 페이지 넘김 ===== */
    .nb-reader-spacer { display: block; }
    .nb-head-btn {
      justify-self: end;
      display: inline-flex; align-items: center; gap: 5px;
      height: 30px; padding: 0 11px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08);
      color: #e8ebf4; font-size: 11.5px; font-weight: 600; font-family: inherit; cursor: pointer;
      white-space: nowrap;
    }
    .nb-head-btn:hover { background: rgba(255,255,255,.17); }
    .nb-head-btn.is-now { background: #f6f7fb; border-color: #f6f7fb; color: #2b3145; }
    .nb-book--indexed { padding-right: 52px; }
    .idx-tabs {
      position: absolute; top: 50%; right: -30px; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
      z-index: 7; max-height: calc(100% - 20px);
      /* v3.1: 주제·분기가 많아져도 책 높이를 뚫지 않도록 탭 영역 안에서만 스크롤 */
      overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
      padding: 2px 0 2px 6px; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .idx-tabs::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .idx-tab { flex: 0 0 auto; }
    .idx-tabs--dense { gap: 3px; }
    .idx-tabs--dense .idx-tab { min-height: 40px; font-size: 9.5px; padding: 4px 0; }
    .idx-tabs--dense .idx-tab.is-active { min-height: 44px; }
    .idx-tabs--denser { gap: 2px; }
    .idx-tabs--denser .idx-tab { min-height: 30px; font-size: 9px; padding: 2px 0; }
    .idx-tabs--denser .idx-tab.is-active { min-height: 34px; }
    .idx-tab {
      --tab-color: #5b7fb4;
      display: flex; align-items: center; justify-content: center;
      width: 30px; min-height: 56px; padding: 6px 0;
      border: 0; border-radius: 0 8px 8px 0;
      background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,0) 55%), var(--tab-color);
      color: rgba(255,255,255,.94); font-family: inherit;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0; line-height: 1.2;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      box-shadow: 1px 2px 6px rgba(10,14,24,.34), inset 0 1px 0 rgba(255,255,255,.26);
      transition: width .2s ease, transform .2s ease, filter .2s ease;
    }
    .idx-tab span { display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .idx-tab i { font-style: normal; line-height: 1.02; }
    /* 주제 이름이 4~6자여도 인덱스 탭 안에 다 들어가게 (내지 제목과 같은 글자) */
    .idx-tab--long { font-size: 9px; width: 32px; }
    .idx-tabs--dense .idx-tab--long { font-size: 8.5px; }
    .idx-tabs--denser .idx-tab--long { font-size: 8px; }
    .idx-tab--long i { line-height: 1.12; }
    .idx-tab:hover { transform: translateX(-2px); filter: brightness(1.08); }
    .idx-tab.is-active {
      width: 35px; transform: translateX(-5px);
      filter: brightness(1.14) saturate(1.08);
      box-shadow: 1px 4px 12px rgba(10,14,24,.46), inset 0 1px 0 rgba(255,255,255,.34);
    }
    .idx-tab--q1 { --tab-color: #33608f; }
    .idx-tab--q2 { --tab-color: #6d7c95; }
    .idx-tab--q3 { --tab-color: #9d5d6a; }
    .idx-tab--q4 { --tab-color: #5c7d5a; }

    /* ===== v3.0 책장 넘김: 책등을 축으로 종이가 3D로 회전 ===== */
    @keyframes leafOutNext {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(-96deg); }
    }
    @keyframes leafOutPrev {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(96deg); }
    }
    @keyframes leafInNext {
      from { transform: rotateY(96deg); }
      to   { transform: rotateY(0deg); }
    }
    @keyframes leafInPrev {
      from { transform: rotateY(-96deg); }
      to   { transform: rotateY(0deg); }
    }
    @keyframes leafShadeIn {
      from { opacity: 0; }
      to   { opacity: .92; }
    }
    @keyframes leafShadeOut {
      from { opacity: .92; }
      to   { opacity: 0; }
    }
    .leaf-out-next { animation: leafOutNext .24s cubic-bezier(.55,.06,.85,.4) both; }
    .leaf-out-prev { animation: leafOutPrev .24s cubic-bezier(.55,.06,.85,.4) both; }
    .leaf-in-next { animation: leafInNext .34s cubic-bezier(.2,.72,.3,1) both; }
    .leaf-in-prev { animation: leafInPrev .34s cubic-bezier(.2,.72,.3,1) both; }

    @keyframes shelfInNext {
      from { opacity: 0; transform: translateX(86px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes shelfInPrev {
      from { opacity: 0; transform: translateX(-86px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .shelf-in-next { animation: shelfInNext .34s cubic-bezier(.22,.75,.28,1) both; }
    .shelf-in-prev { animation: shelfInPrev .34s cubic-bezier(.22,.75,.28,1) both; }

    /* ===== v3.1 실제 책 넘김: 아래에 다음 페이지(underlay) + 앞/뒷면이 있는 종이(leaf) ===== */
    .nb-flip {
      position: absolute; top: 0; bottom: 0; z-index: 9;
      perspective: 3200px; perspective-origin: 50% 50%;
      pointer-events: none;
    }
    .nb-flip--right { left: 50%; width: 50%; }
    .nb-flip--left { left: 0; width: 50%; }
    .nb-flip--full { left: 0; width: 100%; }
    .nb-flip-leaf {
      position: absolute; inset: 0;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      will-change: transform;
    }
    /* v3.5 양장본: 스프링·펀치홀이 없어 회전축을 책등 선에 딱 맞춘다 */
    .nb-flip--right .nb-flip-leaf { transform-origin: 0px center; }
    .nb-flip--left .nb-flip-leaf { transform-origin: 100% center; }
    .nb-flip--full .nb-flip-leaf { transform-origin: 0% 50%; }
    .nb-flip-face {
      position: absolute; inset: 0; height: 100%;
      -webkit-backface-visibility: hidden; backface-visibility: hidden;
      transform-origin: 50% 50%;
      overflow: hidden;
    }
    /* v3.4: 모바일 단면에서 '지금 보이지 않는 면'을 숨기는 규칙이 넘어가는 종이까지 숨겨
       넘김이 사라지던 문제 수정 — 넘김 종이의 앞·뒷면은 항상 보이게 */
    .nb-spread .nb-flip .nb-flip-face { display: block !important; }
    /* 넘어가는 종이 앞·뒷면도 속지와 똑같은 둥근 모서리 (책등 쪽 직각 · 바깥쪽 둥글게) */
    .nb-flip-face.nb-page--left { border-radius: var(--nb-r-left, 14px 0 0 14px); }
    .nb-flip-face.nb-page--right { border-radius: var(--nb-r-right, 0 14px 14px 0); }
    .nb-flip-front { transform: rotateY(0deg) translateZ(.4px); }
    .nb-flip-back { transform: rotateY(180deg) translateZ(.4px); }
    /* 종이 뒷면 결: 앞장이 넘어갈 때 책등 쪽에 지는 그늘 */
    .nb-flip-back::before {
      content: ""; position: absolute; inset: 0; z-index: 6; pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(26,22,14,.22), rgba(26,22,14,.05) 26%, rgba(26,22,14,0) 58%);
    }
    .nb-flip-face.nb-flip-blank { background: #f7f4ea; }
    .nb-flip-face.nb-flip-blank::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background-image: linear-gradient(90deg, rgba(120,110,86,.10), rgba(120,110,86,0) 26%);
    }
    @keyframes nbfFlipNext { from { transform: rotateY(0deg); } to { transform: rotateY(-180deg); } }
    @keyframes nbfFlipPrev { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }
    /* v3.4: 모바일 단면에서 뒤로 넘길 때 — 왼쪽에 접혀 있던 장이 되돌아 들어온다 */
    @keyframes nbfFlipBack { from { transform: rotateY(-180deg); } to { transform: rotateY(0deg); } }
    .nb-flip-leaf.is-next { animation: nbfFlipNext .66s cubic-bezier(.45,.05,.25,1) both; }
    .nb-flip-leaf.is-prev { animation: nbfFlipPrev .66s cubic-bezier(.45,.05,.25,1) both; }
    .nb-flip-leaf.is-back { animation: nbfFlipBack .6s cubic-bezier(.4,.06,.3,1) both; }
    /* v3.4: 종이가 90°를 지나는 순간 앞·뒷면을 확실히 바꿔
       반대면 내용이 종이를 비쳐 보이지 않게 한다 (backface-visibility 대체) */
    @keyframes nbfFaceOut { 0%, 37.9% { visibility: visible; } 38%, 100% { visibility: hidden; } }
    @keyframes nbfFaceIn { 0%, 37.9% { visibility: hidden; } 38%, 100% { visibility: visible; } }
    @keyframes nbfFaceOutBack { 0%, 37.9% { visibility: hidden; } 38%, 100% { visibility: visible; } }
    @keyframes nbfFaceInBack { 0%, 37.9% { visibility: visible; } 38%, 100% { visibility: hidden; } }
    .nb-flip-leaf.is-next .nb-flip-front, .nb-flip-leaf.is-prev .nb-flip-front { animation: nbfFaceOut .66s linear both; }
    .nb-flip-leaf.is-next .nb-flip-back, .nb-flip-leaf.is-prev .nb-flip-back { animation: nbfFaceIn .66s linear both; }
    .nb-flip-leaf.is-back .nb-flip-front { animation: nbfFaceOutBack .6s linear both; }
    .nb-flip-leaf.is-back .nb-flip-back { animation: nbfFaceInBack .6s linear both; }
    /* 모바일 단면: 책 밖(왼쪽)으로 넘어가며 얇게 남는 부분이 어색하지 않도록 살짝 사라진다 */
    @keyframes nbfLeafFadeOut { 0%, 52% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes nbfLeafFadeIn { 0% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 1; } }
    .nb-flip--full .nb-flip-leaf.is-next { animation-name: nbfFlipNext, nbfLeafFadeOut; }
    .nb-flip--full .nb-flip-leaf.is-back { animation-name: nbfFlipBack, nbfLeafFadeIn; }

    /* ===== v3.4 마지막 면: 빈 속지 대신 책 뒤표지 ===== */
    .nb-page--backcover {
      background-color: #2f3e5c;
      background-image:
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.24)),
        var(--spine, #2f3e5c);
      color: rgba(255,255,255,.92);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), inset 0 0 90px rgba(0,0,0,.34);
      overflow: hidden;
    }
    .nb-page--backcover::after { display: none; }
    .nb-page--backcover .nb-backcover-inner {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; text-align: center;
      border: 1px solid rgba(255,255,255,.16); border-radius: 3px;
      padding: 24px 20px;
    }
    .nb-backcover-mark {
      width: 40px; height: 1px; background: rgba(255,255,255,.38); border-radius: 1px;
    }
    .nb-backcover-label {
      font-family: Georgia, "Times New Roman", serif; font-size: 13px; letter-spacing: .05em;
      color: rgba(255,255,255,.8); word-break: keep-all; line-height: 1.6;
    }
    .nb-backcover-sub { font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.5); }
    /* ===== v3.5 목표 책: 앞표지·뒤표지 (한 권의 책 구조) ===== */
    .nb-page--cover {
      grid-column: 1 / -1;
      padding: 0; overflow: hidden;
      border-radius: 8px;
      cursor: pointer;
      background:
        linear-gradient(155deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 24%, rgba(0,0,0,.08) 52%, rgba(0,0,0,.30) 100%),
        var(--spine, #2f3e5c);
      color: rgba(255,255,255,.94);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 0 120px rgba(0,0,0,.32), 0 18px 38px -18px rgba(4,7,14,.72);
    }
    .nb-page--cover::after { display: none; }
    .nb-page--cover .nb-cover-inner {
      position: relative; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 34px 30px;
    }
    .nb-page--cover .nb-cover-inner::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 26px;
      background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.14) 62%, rgba(255,255,255,.10));
    }
    .nb-page--cover .nb-cover-frame {
      position: absolute; inset: 16px; border: 1px solid rgba(255,255,255,.17);
      border-radius: 3px; pointer-events: none;
    }
    .nb-coverface-plate { position: relative; z-index: 2; text-align: center; padding: 0 12px; }
    .nb-coverface-plate b {
      display: block; font-family: Georgia, "Times New Roman", serif;
      font-size: 42px; letter-spacing: .04em; line-height: 1.2;
    }
    .nb-coverface-plate i { display: block; width: 54px; height: 1px; margin: 16px auto; background: rgba(255,255,255,.42); }
    .nb-coverface-plate span {
      display: block; font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase;
      color: rgba(255,255,255,.66);
    }
    .nb-page--cover .nb-cover-foot {
      position: absolute; left: 0; right: 0; bottom: 32px; text-align: center;
      font-size: 9.5px; letter-spacing: .26em; text-transform: uppercase; color: rgba(255,255,255,.42);
    }
    .nb-page--cover--back { cursor: default; }
    /* 앞표지·뒤표지는 덮힌 책이라 가운데 제본 그늘·종이 단면이 없다 */
    .nb-spread[data-cover] .nb-spine { display: none; }
    /* v3.6 닫힌 책: 펼친 두 면을 가로로 늘리지 않고 1페이지(세로형 하드커버) 너비로 중앙에 닫힌다 */
    .nb-spread[data-cover] {
      grid-template-columns: 1fr;
      width: min(50%, 600px);
      max-width: 600px;
    }
    .nb-spread[data-cover] .nb-page--cover { border-radius: 10px 4px 4px 10px; }
    .nb-spread[data-cover="back"] .nb-page--cover { border-radius: 4px 10px 10px 4px; }
    /* 뒤표지(닫힌 책)에는 주제 탭을 세우지 않는다 */
    .nb-spread[data-cover="back"] .idx-tabs { display: none; }
    /* 닫힌 책이 덮이거나 열릴 때 표지만 살짝 흔들려 앉는다 */
    @keyframes nbCoverEnter {
      from { opacity: .62; transform: rotateY(-9deg) translateX(-8px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes nbCoverEnterBack {
      from { opacity: .62; transform: rotateY(9deg) translateX(8px); }
      to { opacity: 1; transform: none; }
    }
    .nb-page--cover.nb-cover-enter { animation: nbCoverEnter .42s cubic-bezier(.22,.72,.28,1) both; }
    .nb-page--cover--back.nb-cover-enter { animation: nbCoverEnterBack .42s cubic-bezier(.22,.72,.28,1) both; }
    /* 표지를 여닫는 동안 종이 면이 함께 밝아지고 어두워진다 */
    @keyframes nbCoverPagesOut { 0%, 38% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes nbCoverPagesIn { 0% { opacity: .08; } 100% { opacity: 1; } }
    .nb-spread.cover-closing > .nb-page { animation: nbCoverPagesOut .74s ease-in both; }
    .nb-spread.cover-opening > .nb-page { animation: nbCoverPagesIn .62s ease-out both; }
    /* 닫힌 책 너비의 표지 한 장(여닫는 애니메이션용) — 책등 쪽을 축으로 돈다 */
    .nbf-cover--narrow {
      left: 50%; right: auto;
      width: min(50%, 600px);
      margin-left: calc(-1 * min(25%, 300px));
      top: 0; bottom: 0;
      border-radius: 10px 4px 4px 10px;
      transform-origin: left center;
    }
    .nbf-cover--narrow.nbf-cover--back { border-radius: 4px 10px 10px 4px; transform-origin: right center; }
    @keyframes nbfNarrowOpenLeft { from { transform: rotateY(0deg); opacity: 1; } 62% { opacity: 1; } to { transform: rotateY(-104deg); opacity: 0; } }
    @keyframes nbfNarrowCloseLeft { from { transform: rotateY(-104deg); opacity: 0; } 34% { opacity: 1; } to { transform: rotateY(0deg); opacity: 1; } }
    @keyframes nbfNarrowOpenRight { from { transform: rotateY(0deg); opacity: 1; } 62% { opacity: 1; } to { transform: rotateY(104deg); opacity: 0; } }
    @keyframes nbfNarrowCloseRight { from { transform: rotateY(104deg); opacity: 0; } 34% { opacity: 1; } to { transform: rotateY(0deg); opacity: 1; } }
    .nbf-cover--narrow.nbf-cover--open-left { animation: nbfNarrowOpenLeft .74s cubic-bezier(.42,.02,.58,1) both; }
    .nbf-cover--narrow.nbf-cover--close-left { animation: nbfNarrowCloseLeft .74s cubic-bezier(.42,.02,.58,1) both; }
    .nbf-cover--narrow.nbf-cover--open-right { animation: nbfNarrowOpenRight .74s cubic-bezier(.42,.02,.58,1) both; }
    .nbf-cover--narrow.nbf-cover--close-right { animation: nbfNarrowCloseRight .74s cubic-bezier(.42,.02,.58,1) both; }
    /* v3.6 사진 없는 아카이브 기록: 빈 사진 면 없이 한 면에 제목·도장·감상을 모아 쓴다 */
    .nb-page--wide { grid-column: 1 / -1; }
    .nb-spread[data-single] { grid-template-columns: 1fr; }
    .nb-spread[data-single] .nb-spine { display: none; }
    .nb-spread[data-single] .nb-page--wide { border-radius: 8px; box-shadow: inset 0 0 80px -60px rgba(30,34,44,.5); }
    .nb-page--cover--back .nb-coverface-plate b { font-size: 27px; }
    .nb-page--cover--back .nb-coverface-plate i { width: 40px; margin: 12px auto; }
    .nb-page--cover--back .nb-coverface-plate span { letter-spacing: .24em; color: rgba(255,255,255,.5); }
    /* 장 나눔용 빈 면: 뒤표지가 아니라 종이 그대로 */
    .nb-page--blank { background-color: #fcfbf6; }
    .nb-page--blank .nb-page-inner { min-height: 100%; }
    /* 표지를 열고 닫는 회전 (왼쪽 책등 / 오른쪽 책등) */
    @keyframes nbfCoverOpenLeft { from { transform: rotateY(0deg); } to { transform: rotateY(-158deg); } }
    @keyframes nbfCoverCloseLeft { from { transform: rotateY(-158deg); } to { transform: rotateY(0deg); } }
    @keyframes nbfCoverOpenRight { from { transform: rotateY(0deg); } to { transform: rotateY(158deg); } }
    @keyframes nbfCoverCloseRight { from { transform: rotateY(158deg); } to { transform: rotateY(0deg); } }
    .nbf-cover--open-left { transform-origin: left center; animation: nbfCoverOpenLeft .62s cubic-bezier(.42,.02,.58,1) both; }
    .nbf-cover--close-left { transform-origin: left center; animation: nbfCoverCloseLeft .62s cubic-bezier(.42,.02,.58,1) both; }
    .nbf-cover--open-right { transform-origin: right center; animation: nbfCoverOpenRight .62s cubic-bezier(.42,.02,.58,1) both; }
    .nbf-cover--close-right { transform-origin: right center; animation: nbfCoverCloseRight .62s cubic-bezier(.42,.02,.58,1) both; }
    /* 표지가 열리고 닫힐 때 정지 화면의 표지 글자 크기와 맞춘다 */
    .nbf-cover--goal .nbf-cover-plate b { font-size: 40px; }
    /* 경계(맨 앞·맨 뒤)에서 책을 닫을 때 드러나는 북커버 */
    .nbf-cover {
      position: absolute; inset: 0; z-index: 13; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      background:
        linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.22)),
        var(--spine, #2f3e5c);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), inset 0 0 70px rgba(0,0,0,.30), 0 22px 44px -18px rgba(6,9,18,.62);
      color: rgba(255,255,255,.94);
      transform-origin: left center;
      animation: nbfCoverClose .5s cubic-bezier(.5,.04,.7,1) both;
    }
    .nbf-cover::before {
      content: ""; position: absolute; left: -2px; top: 0; bottom: 0; width: 22px;
      background: linear-gradient(90deg, rgba(0,0,0,.5), rgba(0,0,0,.12) 70%, rgba(255,255,255,.10));
      border-radius: 8px 0 0 8px;
    }
    .nbf-cover::after {
      content: ""; position: absolute; inset: 14px;
      border: 1px solid rgba(255,255,255,.18); border-radius: 3px; pointer-events: none;
    }
    .nbf-cover-plate { position: relative; z-index: 2; text-align: center; padding: 26px 34px; max-width: 78%; }
    .nbf-cover-plate b { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 32px; letter-spacing: .02em; line-height: 1.2; }
    .nbf-cover-plate i { display: block; width: 46px; height: 1px; margin: 12px auto; background: rgba(255,255,255,.4); }
    .nbf-cover-plate span { display: block; font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; opacity: .72; }
    @keyframes nbfCoverClose {
      from { transform: rotateY(-152deg); opacity: .96; }
      60%  { opacity: 1; }
      to   { transform: rotateY(0deg); opacity: 1; }
    }

    /* ===== v3.1 목표 책자: 기간별 페이지 ===== */
    .gb-page-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      padding-bottom: 7px; border-bottom: 1px solid rgba(120,126,140,.3);
    }
    .gb-page-period {
      font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #5b6478;
      text-transform: uppercase; white-space: nowrap;
    }
    .gb-page-count { font-size: 10px; font-weight: 600; color: #a0a5ae; letter-spacing: .04em; white-space: nowrap; }
    .gb-filler { display: flex; align-items: center; justify-content: center; flex: 1; color: #c3c7ce; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }

    /* ===== 목표 · 버킷 책자 ===== */
    .gb-head { display: flex; align-items: flex-start; gap: 10px; }
    .gb-icon {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(120,126,140,.13); color: #5b6478;
    }
    .gb-head-text { min-width: 0; }
    .gb-kicker { font-size: 9px; font-weight: 700; letter-spacing: .22em; color: #a0a5ae; }
    .gb-title {
      margin: 2px 0 0; font-family: Georgia, "Times New Roman", serif;
      font-size: 25px; line-height: 1.18; letter-spacing: .01em; color: #2b3141; word-break: keep-all;
    }
    .gb-sub { margin-top: 4px; font-size: 11px; color: #8d929b; }
    .gb-section-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding-bottom: 8px; border-bottom: 1px solid rgba(120,126,140,.3);
    }
    .gb-section-head b { font-size: 11.5px; letter-spacing: .16em; color: #5b6478; text-transform: uppercase; }
    .gb-add {
      display: inline-flex; align-items: center; gap: 4px;
      height: 26px; padding: 0 10px; border-radius: 999px;
      border: 1px dashed rgba(90,98,116,.46); background: transparent;
      color: #4a5162; font-size: 11px; font-weight: 600; font-family: inherit;
      cursor: pointer; white-space: nowrap;
    }
    .gb-add svg { width: 12px; height: 12px; }
    .gb-add:hover { background: rgba(120,126,140,.13); border-style: solid; }
    .gb-list { display: flex; flex-direction: column; }
    .gb-row {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 10px 0; border-bottom: 1px dashed rgba(120,126,140,.26);
    }
    .gb-row:last-child { border-bottom: 0; padding-bottom: 2px; }
    .gb-row .chk { margin-top: 3px; accent-color: #4a5162; }
    .gb-row-main { flex: 1; min-width: 0; cursor: pointer; }
    .gb-row-title { font-size: 13.5px; font-weight: 600; color: #2f343d; line-height: 1.45; word-break: keep-all; }
    .gb-row.done .gb-row-title { color: #9aa0a9; text-decoration: line-through; text-decoration-color: rgba(154,160,169,.55); }
    .gb-row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; }
    .gb-tag {
      font-size: 10.5px; font-weight: 600; color: #6b707a;
      background: rgba(120,126,140,.13); border-radius: 999px; padding: 2px 8px;
    }
    .gb-row-note { font-size: 11.5px; color: #82868f; line-height: 1.65; margin-top: 5px; word-break: keep-all; }
    .gb-row .icon-btn { opacity: .45; }
    .gb-row:hover .icon-btn { opacity: 1; }
    /* 목표 날짜 · 달성 도장 (아카이브 도장과 같은 결) */
    .gb-stamp {
      position: relative; display: inline-flex; flex-direction: column; align-items: center; gap: 0;
      padding: 3px 7px; border-radius: 3px; cursor: pointer;
      border: 1.25px solid rgba(45,106,79,.55); color: #2d6a4f;
      background: rgba(45,106,79,.05);
      transform: rotate(-1.6deg);
      font-family: Georgia, "Times New Roman", serif;
      box-shadow: inset 0 0 0 1.5px rgba(252,251,246,.9), inset 0 0 0 2.2px rgba(45,106,79,.16);
      flex-shrink: 0;
    }
    .gb-stamp b { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; white-space: nowrap; line-height: 1.25; }
    .gb-stamp span { font-size: 8.5px; font-weight: 600; letter-spacing: .14em; line-height: 1.2; }
    /* 기간 도장: 시작일·종료일 두 줄을 같은 글씨 크기·굵기·자간으로 */
    .gb-stamp--range b,
    .gb-stamp--range span { font-size: 10.5px; font-weight: 700; letter-spacing: .045em; line-height: 1.3; }
    .gb-stamp--plan {
      border-color: rgba(120,126,140,.45); color: #6b707a; background: rgba(120,126,140,.05);
      transform: rotate(1.2deg);
      box-shadow: inset 0 0 0 1.5px rgba(252,251,246,.9), inset 0 0 0 2.2px rgba(120,126,140,.14);
    }
    .gb-stamp-input {
      position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; margin: 0;
      border: 0; opacity: 0; cursor: pointer; -webkit-appearance: none; appearance: none;
    }
    .gb-date-note { font-size: 10.5px; color: #8d929b; letter-spacing: .01em; }
    .gb-count { font-size: 10.5px; font-weight: 600; color: #9aa0a9; letter-spacing: .04em; }

    /* 모달 날짜 입력: 미니컬 스타일 한 줄 (달력 아이콘 하나 + 시작일 › 종료일) */
    .date-row {
      display: flex; align-items: center; gap: 4px;
      border: 1px solid var(--border); border-radius: 10px; background: #fff;
      padding: 0 8px 0 9px; height: 44px;
    }
    .date-row-icon { display: inline-flex; color: var(--text-sub); flex-shrink: 0; }
    .date-pill {
      position: relative; flex: 1 1 0; min-width: 0;
      display: flex; align-items: center; justify-content: center;
      height: 34px; border-radius: 8px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .date-pill:hover { background: rgba(120,126,140,.08); }
    .date-pill-text {
      font-size: 14px; font-weight: 700; letter-spacing: -0.01em; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
    }
    .date-row.is-empty .date-pill-text,
    .date-pill-text.is-empty { color: #a9adb6; font-weight: 500; }
    /* 실제 date 입력은 글자·테두리·아이콘 없이 투명하게 덮어 두기만 한다 (브라우저 기본 달력 아이콘 숨김) */
    .date-pill input[type="date"],
    .date-pill input[type="date"]:focus {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0 !important; color: transparent !important;
      -webkit-text-fill-color: transparent !important;
      background: transparent !important;
      border: 0 !important; padding: 0 !important; margin: 0;
      font-size: 16px; line-height: 1;
      -webkit-appearance: none !important; appearance: none !important;
      cursor: pointer;
    }
    .date-pill input[type="date"]::-webkit-calendar-picker-indicator,
    .date-pill input[type="date"]::-webkit-inner-spin-button,
    .date-pill input[type="date"]::-webkit-clear-button,
    .date-pill input[type="date"]::-webkit-datetime-edit,
    .date-pill input[type="date"]::-webkit-datetime-edit-fields-wrapper {
      opacity: 0 !important; display: none !important;
      -webkit-appearance: none !important; appearance: none !important;
      width: 0; height: 0; margin: 0; padding: 0;
    }
    .date-row-sep { color: #b3b8c1; font-size: 16px; flex-shrink: 0; line-height: 1; }
    /* 날짜가 들어 있을 때만 보이는 작은 지우기 */
    .date-clear {
      flex-shrink: 0; width: 20px; height: 20px; margin-left: 2px; padding: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; background: rgba(120,126,140,.13); color: #8d929b; cursor: pointer;
    }
    .date-clear:hover { background: rgba(200,75,75,.14); color: var(--sun); }
    .date-clear svg { width: 10px; height: 10px; }
    .date-row.is-empty .date-clear { display: none; }
    /* 분기 선택: 연도 + 미지정/1~4분기 */
    .qs-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .qs-row select {
      height: 36px; padding: 0 8px; border: 1px solid var(--border); border-radius: 9px;
      background: #fff; color: var(--text); font: inherit; font-size: 13px; font-weight: 600;
    }
    .qs-seg {
      display: flex; flex: 1 1 210px; min-width: 0;
      border: 1px solid var(--border); border-radius: 9px; background: #fff; overflow: hidden;
    }
    .qs-btn {
      flex: 1 1 0; min-width: 0; height: 36px; padding: 0 2px;
      border: 0; border-left: 1px solid var(--border); background: transparent;
      color: var(--text-sub); font: inherit; font-size: 11.5px; font-weight: 600;
      cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent;
    }
    .qs-btn:first-child { border-left: 0; }
    .qs-btn.is-on { background: var(--text); color: #fff; }
    .date-mode-seg { width: 100%; }
    .date-mode-seg button { flex: 1; }
    .date-inputs {
      display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap;
    }

    .date-inputs .date-tilde { color: var(--text-sub); font-size: 12px; }

    .date-inputs[data-mode="day"] .date-tilde { display: none; }
    .date-inputs .date-clear { flex: 0 0 auto; }
    .gb-empty { margin: 14px 0 0; font-size: 12px; line-height: 1.85; color: #9aa0a9; }
    .gb-row input[type="date"] {
      height: 24px; font-size: 10.5px; padding: 0 5px;
      border: 1px solid #e4dfd1; border-radius: 6px; background: #fff; color: #5b6478;
    }
    .gb-fab {
      position: fixed; right: 26px; bottom: 26px; z-index: 45;
      display: flex; flex-direction: column; align-items: flex-end; gap: 9px;
    }
    .gb-fab .fab { position: static; }
    .gb-fab-menu {
      display: flex; flex-direction: column; gap: 6px;
      opacity: 0; pointer-events: none; transform: translateY(6px);
      transition: opacity .16s ease, transform .16s ease;
    }
    .gb-fab.is-open .gb-fab-menu { opacity: 1; pointer-events: auto; transform: none; }
    .gb-fab-item {
      border: 0; border-radius: 999px; padding: 9px 15px;
      background: #f6f7fb; color: #23262d; font-size: 12px; font-weight: 700; font-family: inherit;
      cursor: pointer; box-shadow: 0 8px 18px -8px rgba(10,14,24,.6);
    }
    .gb-fab-item:hover { background: #fff; }
    .gb-manage-note { margin: 0 0 12px; font-size: 12px; line-height: 1.7; color: #6b707a; }
    .gb-manage-list { display: flex; flex-direction: column; gap: 10px; }
    .gb-manage-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    }
    .gb-manage-row b { display: block; font-size: 12.5px; color: #2f343d; }
    .gb-manage-row span { display: block; margin-top: 3px; font-size: 11px; color: var(--text-sub); line-height: 1.5; }

    /* 책 설정 모달 */
    .spine-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .spine-swatch { width: 30px; height: 30px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
    .spine-swatch.selected { border-color: #1f2421; box-shadow: inset 0 0 0 2px #fff; }
    .book-cover-preview { display: flex; align-items: center; gap: 14px; }
    .book-cover-preview .nb-cover { width: 92px; height: 128px; box-shadow: 0 8px 16px rgba(10,13,22,.22); }
    .book-cover-preview .nb-cover-label { left: 18px; right: 10px; top: 18px; padding: 7px 7px 8px; }
    .book-cover-preview .nb-cover-label b { font-size: 11px; }
    .book-cover-preview .nb-year-plate { left: 14px; right: 8px; }
    .book-cover-preview .nb-year-plate b { font-size: 20px; letter-spacing: .04em; }
    .book-cover-preview .nb-year-plate i { width: 18px; margin: 5px auto; }
    .book-cover-preview .nb-year-plate span { font-size: 6px; letter-spacing: .2em; }
    .book-cover-preview .nb-cover-label span { font-size: 8px; margin-top: 4px; }
    .modal-danger-row { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }

    /* 연도별 책 */
    .nb-cover--year { background: linear-gradient(155deg, rgba(255,255,255,.16), rgba(0,0,0,.34)), var(--spine, #33415c); }
    .nb-year-plate { position: absolute; left: 22px; right: 14px; top: 50%; transform: translateY(-50%); text-align: center; color: #f7f2e6; }
    .nb-year-plate b { display: block; font-family: Georgia, "Times New Roman", serif; font-size: 34px; letter-spacing: .06em; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb-year-plate i { display: block; width: 26px; height: 1px; margin: 9px auto; background: rgba(247,242,230,.42); }
    .nb-year-plate span { display: block; font-size: 8.5px; letter-spacing: .26em; opacity: .62; }
    .nb-year-now {
      position: absolute; left: 20px; top: 12px; font-size: 9px; font-weight: 700; letter-spacing: .08em;
      color: #2b3145; background: #f7f2e6; border-radius: 999px; padding: 2px 7px;
    }
    .nb-cover--year .nb-cover-chip { top: auto; bottom: 9px; right: 9px; }
    .nb-legend {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.1);
      font-size: 11px; color: rgba(232,235,244,.72);
    }
    .nb-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .nb-legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .nb-legend-hint { color: rgba(232,235,244,.48); }

    /* 월 페이지 (달력 + 기록 목록) */
    .nb-month-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .nb-month-name { font-family: Georgia, "Times New Roman", serif; font-size: 34px; line-height: 1.1; letter-spacing: .01em; color: #2b3141; }
    .nb-month-year { margin-top: 4px; font-size: 10.5px; letter-spacing: .12em; color: #9297a1; }
    .nb-month-badge {
      flex-shrink: 0; font-size: 10.5px; font-weight: 600; color: #5b6478;
      background: rgba(120,126,140,.12); border-radius: 999px; padding: 4px 9px;
    }
    /* v3.6 달력이 면 높이를 채우도록 (아래가 비어 보이던 것) */
    .nb-cal { margin-top: 14px; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .nb-cal-head, .nb-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
    .nb-cal-grid { flex: 1 1 auto; grid-auto-rows: minmax(36px, 1fr); }
    .nb-cal-head span { text-align: center; font-size: 9px; font-weight: 700; color: #a0a5ae; letter-spacing: .06em; padding-bottom: 5px; }
    .nb-cal-head .sun { color: #c05a60; }
    .nb-cal-head .sat { color: #4e6f9a; }
    .nb-day {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      min-height: 44px; padding: 6px 0 5px; border-radius: 6px;
      border: 1px solid transparent; background: transparent; cursor: pointer;
      font-family: inherit; color: inherit;
    }
    .nb-day:hover { background: rgba(120,126,140,.11); }
    .nb-day--empty { pointer-events: none; }
    .nb-day-num { font-size: 13px; color: #3b404a; font-variant-numeric: tabular-nums; }
    .nb-day.is-sun .nb-day-num, .nb-day.is-holiday .nb-day-num { color: #c05a60; }
    .nb-day.is-sat .nb-day-num { color: #4e6f9a; }
    .nb-day.is-today { background: transparent; border-color: transparent; }
    .nb-day.is-today .nb-day-num {
      color: #fff; font-weight: 700;
      background: #2f3a52; border-radius: 6px; padding: 1px 7px;
      box-shadow: 0 1px 3px rgba(20,26,38,.35);
    }
    .nb-day-dots { display: flex; gap: 2px; height: 4px; }
    .nb-day-dots i { width: 4px; height: 4px; border-radius: 50%; display: block; }
    .nb-day-marks { display: flex; align-items: center; justify-content: center; gap: 3px; height: 9px; }
    .nb-dot { width: 5px; height: 5px; border-radius: 50%; display: block; opacity: .82; }
    .nb-mark { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    .nb-mark svg { display: block; }
    .nb-month-row .marks { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
    .nb-legend--marks { gap: 6px 12px; }
    .nb-legend--marks span { gap: 4px; font-size: 10.5px; letter-spacing: .04em; }
    .nb-month-foot { margin-top: auto; padding-top: 12px; font-size: 10.5px; color: #9aa0a9; }
    .nb-month-list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(120,126,140,.28); }
    .nb-month-list-head b { font-size: 13.5px; letter-spacing: -0.01em; color: #33383f; }
    .nb-month-list-head span { font-size: 11px; color: #8d929b; }
    .nb-month-list { display: flex; flex-direction: column; margin-top: 2px; }
    .nb-month-row {
      display: flex; align-items: center; gap: 10px; padding: 9px 2px;
      border: 0; border-bottom: 1px dashed rgba(120,126,140,.22);
      background: none; cursor: pointer; text-align: left; font-family: inherit;
    }
    .nb-month-row:hover { background: rgba(120,126,140,.07); }
    .nb-month-row b { width: 54px; flex-shrink: 0; font-size: 11.5px; color: #4a505c; }
    .nb-month-row .txt { flex: 1; min-width: 0; font-size: 12.5px; color: #3f444e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb-month-row .dots { display: flex; gap: 3px; flex-shrink: 0; }
    .nb-month-row .dots i { width: 5px; height: 5px; border-radius: 50%; display: block; }
    .nb-month-empty { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 10px; text-align: center; }
    .nb-month-empty p { margin: 0; font-size: 12.5px; color: #8d929b; }

    @keyframes nbFlipFromRight {
      from { opacity: .25; transform: perspective(1200px) rotateY(-16deg) translateX(26px); }
      60%  { opacity: .9; }
      to   { opacity: 1; transform: none; }
    }
    @keyframes nbFlipFromLeft {
      from { opacity: .25; transform: perspective(1200px) rotateY(16deg) translateX(-26px); }
      60%  { opacity: .9; }
      to   { opacity: 1; transform: none; }
    }

    @media (max-width: 860px) {
      .nb-stage { padding: 14px 8px 16px; border-radius: 16px; --book-h: clamp(400px, calc(100dvh - 310px), 780px); }
      .nb-stage--shelf { padding: 18px 4px 16px; }
      .nb-stage-head { gap: 8px; }
      .nb-stage-title { font-size: 14px; }
      .nb-stage-sub { font-size: 11px; }
      .nb-carousel { height: 290px; }
      .nb-carousel {
        -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 13%, #000 87%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0, #000 13%, #000 87%, transparent 100%);
      }
      .nb-cover-btn { transform: translateY(4px) scale(.94); }
      .nb-cover { width: 190px; height: 264px; }
      .nb-cover-label { left: 30px; right: 16px; top: 30px; padding: 13px 11px 14px; }
      .nb-cover-label b { font-size: 16px; }
      .nb-book-meta h3 { font-size: 20px; }
      .nb-actions { gap: 14px; margin-top: 14px; }
      .nb-bottom-bar { height: 62px; margin-top: 10px; gap: 8px; }
      .nb-add-btn { width: 44px; height: 44px; }
      .nb-reader-head { min-height: 44px; }
      .nb-action { font-size: 10px; }
      .nb-action-icon { width: 40px; height: 40px; }
      .nb-reader-head { grid-template-columns: 1fr auto 1fr; gap: 6px; }
      .nb-reader-head .nb-stage-count { display: inline-flex; font-size: 10.5px; padding: 3px 8px; }
      .nb-book { padding: 8px 0 0 10px; perspective: 1800px; }
      .nb-book--indexed { padding: 8px 26px 0 10px; }
      .nb-spread { grid-template-columns: 1fr; max-width: 100%; height: var(--book-h); perspective: none; }
      .idx-tabs { right: -22px; gap: 4px; max-height: calc(100% - 16px); }
      .idx-tabs--dense .idx-tab { min-height: 34px; }
      .idx-tabs--denser .idx-tab { min-height: 26px; font-size: 8.5px; }
      .idx-tab { width: 24px; min-height: 46px; padding: 5px 0; font-size: 9.5px; border-radius: 0 6px 6px 0; }
      .idx-tab.is-active { width: 28px; transform: translateX(-3px); }
      .gb-title { font-size: 21px; }
      .gb-fab { right: 16px; bottom: calc(78px + env(safe-area-inset-bottom)); }
      .nb-head-btn { height: 28px; padding: 0 9px; font-size: 10.5px; }
      .nb-head-btn-label { display: none; }
      .nb-spine { display: none; }
      .nb-spread[data-cover] { width: 100%; max-width: 100%; }
      .nb-spread[data-cover] .nb-page--cover { border-radius: 0 14px 14px 0; }
      .nbf-cover--narrow { left: 0; width: 100%; margin-left: 0; transform-origin: left center; }
      .nb-spread[data-single] { grid-template-columns: 1fr; }
      .nb-page { border-radius: var(--nb-r-left, 0 14px 14px 0) !important; height: 100%; padding: 26px 26px 28px 30px; box-shadow: inset 20px 0 20px -18px rgba(30,34,44,.5); }
      .nb-page--cover { padding: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.10), inset 0 0 120px rgba(0,0,0,.32); }
      /* 모바일 양장본: 왼쪽 책등 제본선 · 안쪽 그늘 */
      .nb-page::before {
        content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 1px; pointer-events: none;
        background: linear-gradient(180deg, rgba(120,116,102,0), rgba(120,116,102,.34) 10%, rgba(120,116,102,.34) 90%, rgba(120,116,102,0));
      }
      .nb-page--cover::before { display: none; }
      .nb-page--left, .nb-page--right { transform-origin: left center; }
      /* 모바일 단면: 스프링(책등) 쪽은 직각, 바깥쪽만 둥글게 — 넘김 종이도 동일 */
      .nb-spread { --nb-r-left: 0 14px 14px 0; --nb-r-right: 0 14px 14px 0; }
      .nb-page--left::after, .nb-page--right::after { background: linear-gradient(90deg, rgba(44,36,24,.55), rgba(44,36,24,.16) 52%, rgba(255,255,255,0) 88%); }
      .nb-page-no { font-size: 9.5px; padding-top: 10px; }
      .nb-spread[data-side="left"] .nb-page--right { display: none; }
      .nb-spread[data-side="right"] .nb-page--left { display: none; }
      @keyframes leafInNextMobile {
        from { transform: rotateY(96deg); }
        to   { transform: rotateY(0deg); }
      }
      @keyframes leafInPrevMobile {
        from { transform: rotateY(-96deg); }
        to   { transform: rotateY(0deg); }
      }
      .leaf-in-next { animation-name: leafInNextMobile; }
      .leaf-in-prev { animation-name: leafInPrevMobile; }
      .nb-side-toggle { display: none; }
      .nb-side-toggle button {
        height: 30px; padding: 0 13px; border-radius: 999px; cursor: pointer;
        border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08);
        color: rgba(232,235,244,.82); font-size: 11.5px; font-weight: 600; font-family: inherit;
      }
      .nb-side-toggle button.active { background: #f6f7fb; border-color: #f6f7fb; color: #2b3145; }
      .nb-nav { display: none; }
      .nb-jumpbar { display: none; }
      .nb-month-name { font-size: 28px; }
      .nb-day { min-height: 38px; }
      .nb-day-num { font-size: 12px; }
      .nb-legend { gap: 6px 10px; font-size: 10px; margin-top: 14px; }
      .nb-legend-hint { display: none; }
      .nb-day-date b { font-size: 21px; }
      .nb-day-date em { font-size: 11.5px; }
      .nb-day-head { gap: 3px 8px; }
      .nb-day-moods { flex: 1 1 100%; margin: 1px 0 0 -3px; }
      .nb-day-inner { gap: 10px; }
      .nb-mood { width: 26px; height: 26px; }
      .nb-mood svg { width: 19px; height: 19px; }
      .nb-photos { gap: 9px; }
      .nb-pola-del { opacity: 1; }
      .nb-day-item-title { font-size: 12.5px; }
    }

    /* 화면이 높은 기기(아이패드 세로)에서는 책장 커버도 크게 */
    @media (min-height: 900px) {
      .nb-carousel { height: 372px; }
      .nb-cover { width: 214px; height: 300px; }
      .nb-cover-label { left: 32px; right: 18px; top: 34px; padding: 13px 12px 14px; }
      .nb-cover-label b { font-size: 16.5px; }
      .nb-cover-chip { font-size: 10.5px; }
      .nb-book-meta h3 { font-size: 26px; }
      .nb-cover--year .nb-year-plate b { font-size: 38px; }
    }
    @media (min-width: 700px) and (max-width: 860px) {
      .idx-tab { width: 30px; min-height: 60px; font-size: 10.5px; }
      .idx-tab.is-active { width: 34px; }
      .nb-month-name { font-size: 34px; }
      .nb-day-num { font-size: 13.5px; }
    }

    @media (max-width: 1100px) and (min-width: 861px) {
      .main { padding: 16px 16px 16px; }
      .nb-stage { padding: 14px 12px 14px; }
      .nb-book { padding: 10px 30px 0; }
      .nb-book--indexed { padding-right: 52px; }
      .nb-nav { width: 32px; height: 32px; }
    }
    @media (max-height: 860px) and (min-width: 861px) {
      .nb-reader-head { margin-bottom: 0; }
      .nb-actions { margin-top: 10px; gap: 16px; }
      .nb-action-icon { width: 38px; height: 38px; }
      .nb-legend { margin-top: 9px; padding-top: 8px; }
    }

    @media (max-width: 1060px) {
      .months-grid, .media-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 860px) {
      .sidebar { display: none; }
      .mobile-nav {
        display: flex;
        padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
      }
      .main { padding: 12px 10px calc(62px + env(safe-area-inset-bottom)); }
      .grid-2 { grid-template-columns: minmax(0, 1fr); }
      .months-grid, .media-grid { grid-template-columns: minmax(0, 1fr); }

      /* 공통 헤더 */
      .app-header { padding: 0 14px; }
      .ah-brand, .ah-sep { display: none; }
      .ah-tab { font-size: 15px; gap: 6px; }
      .ah-tab svg { width: 15px; height: 15px; }
      .ah-btn { width: 34px; height: 34px; border-radius: 9px; }
      .search-host { padding: 0 12px; }
      .search-drawer { padding: 10px 10px 12px; }
      .search-result-list { max-height: 46vh; }

      /* 스테이지 안의 컨트롤 */
      .stage-bar { gap: 8px; margin-bottom: 12px; }
      .stage-bar-side .segmented button { padding: 0 9px; font-size: 11px; }
      .stage-tools > select { flex: 1 1 calc(50% - 4px); min-width: 0; }
      .stage-tools > .btn { height: 34px; }
      .stage-tools > .btn-primary { flex: 1 1 100%; }
      .stage-tools > .segmented { flex: 1 1 100%; }
      .stage-tools > .segmented button { flex: 1; }
      .stage-chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        width: 100%;
        padding-bottom: 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        margin-bottom: 10px;
      }
      .stage-chips::-webkit-scrollbar { display: none; }
      .stage-chips .chip-manage-btn { margin-left: 0; }
      .stage-summary { padding: 10px 12px; gap: 8px; margin-bottom: 10px; }
      .stage-summary .summary-metrics { gap: 10px; }
      .stage-summary .progress-track { flex: 1 1 100%; max-width: none; height: 6px; }

      /* 일기 */
      .diary-controls { grid-template-columns: auto 1fr auto; gap: 6px; }
      .stage-nav { padding: 0 10px; font-size: 11px; height: 30px; }
      .stage-nav { gap: 4px; }
      .stage-nav span.label { font-size: 10.5px; }
      .diary-date b { font-size: 18px; }
      .diary-date span { font-size: 10.5px; }
      .diary-subcontrols { gap: 6px; margin-bottom: 12px; }
      .diary-subcontrols .stage-date { width: 132px; }
      .diary-stage-grid, .day-stack { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .day-side-grid { gap: 12px; }
      .diary-controls { max-width: none; }
      .day-controls { max-width: none; }
      textarea.diary-area { min-height: 200px; }

      .paper { padding: 15px 16px; margin-bottom: 12px; }
      .sheet { padding: 2px 14px; }
      .fab { right: 16px; bottom: calc(78px + env(safe-area-inset-bottom)); width: 56px; height: 56px; }
      .goal-list { gap: 10px; }
      .goal-card { padding: 13px 14px 14px; }
      .bucket-sheet { padding: 4px 16px; }

      .page-title { font-size: 18px; }
      .filter-chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        width: 100%;
        padding-bottom: 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .filter-chips::-webkit-scrollbar { display: none; }

      .modal { padding: 16px; }
      .icon-picker-grid { grid-template-columns: repeat(6, 1fr); }
      .composer-actions { margin-left: auto; }
      .lightbox-nav { width: 38px; height: 38px; }
    }
  </style>
</head>
<body>
<div class="auth-screen" id="authScreen" role="dialog" aria-modal="true" aria-hidden="true"></div>
<div class="toast-stack" id="toastStack" role="status" aria-live="polite"></div>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <h1>Archive Planner</h1>
      <p id="sidebarDateLabel"></p>
    </div>
    <button class="nav-btn active" data-tab="year"><span class="nav-icon" id="navIconYear"></span>Calendar</button>
    <button class="nav-btn" data-tab="goals"><span class="nav-icon" id="navIconGoals"></span>Goals</button>
    <button class="nav-btn" data-tab="archive"><span class="nav-icon" id="navIconArchive"></span>Archive</button>

  function getLunarMonthDay(dateObj) {
    try {
      const parts = lunarFormatter.formatToParts(dateObj);
      const monthPart = parts.find(p => p.type === "month");
      const dayPart = parts.find(p => p.type === "day");
      const mPart = (monthPart && monthPart.value) || "";
      const dPart = (dayPart && dayPart.value) || "";
      const isLeap = mPart.includes("윤");
      const month = parseInt(mPart.replace(/[^0-9]/g, ""), 10);
      const day = parseInt(dPart.replace(/[^0-9]/g, ""), 10);
      return { month, day, isLeap };
    } catch (_) {
      return null;
    }
  }

  function buildHolidayMap(years) {
    const map = {};
    const addName = (ds, name) => {
      if (!map[ds]) map[ds] = name;
      else if (!map[ds].includes(name)) map[ds] += ` · ${name}`;
    };

    years.forEach(year => {
      const start = new Date(year - 1, 11, 25);
      const end = new Date(year + 1, 0, 5);
      for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
        const y = dt.getFullYear();
        const m = dt.getMonth() + 1;
        const d = dt.getDate();
        const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const md = `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        if (y === year && FIXED_SOLAR_HOLIDAYS[md]) {
          addName(ds, FIXED_SOLAR_HOLIDAYS[md]);
        }

        const lunar = getLunarMonthDay(dt);
        if (lunar && !lunar.isLeap) {
          if (lunar.month === 1 && lunar.day === 1) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "설날 연휴");
            if (y === year) addName(ds, "설날");
            if (next.getFullYear() === year) addName(nStr, "설날 연휴");
          }
          if (y === year && lunar.month === 4 && lunar.day === 8) {
            addName(ds, "부처님오신날");
          }
          if (lunar.month === 8 && lunar.day === 15) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "추석 연휴");
            if (y === year) addName(ds, "추석");
            if (next.getFullYear() === year) addName(nStr, "추석 연휴");
          }
        }
      }

      const subTargets = new Set(["설날 연휴", "설날", "추석 연휴", "추석", "삼일절", "어린이날", "부처님오신날", "광복절", "개천절", "한글날", "크리스마스"]);
      const yearDates = Object.keys(map).filter(k => k.startsWith(`${year}-`)).sort();
      yearDates.forEach(ds => {
        const [yy, mm, dd] = ds.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        const dow = dt.getDay();
        const names = map[ds].split(" · ");
        const isSeolOrChuseok = names.some(n => n.includes("설날") || n.includes("추석"));
        const isOtherSub = names.some(n => subTargets.has(n) && !n.includes("설날") && !n.includes("추석"));
        const hasOverlap = names.length > 1;

        if ((isSeolOrChuseok && (dow === 0 || hasOverlap)) || (isOtherSub && (dow === 0 || dow === 6 || hasOverlap))) {
          const cursor = new Date(dt);
          while (true) {
            cursor.setDate(cursor.getDate() + 1);
            const cStr = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}-${String(cursor.getDate()).padStart(2, "0")}`;
            const cDow = cursor.getDay();

                map[cStr] = "대체공휴일";
              }
              break;
            }
          }
        }
      });
    });

  // 책장·페이지가 뚝 끊기지 않고 이어져 보이도록: 나가는 장 → 새 내용 → 들어오는 장
  // v3.0: 밀어내는 슬라이드가 아니라 책등을 축으로 종이가 3D로 회전하는 책장 넘김
  // 책 넘김 (v3.1): 목적지 페이지를 먼저 그려 아래에 깔고, 그 위에서 종이 한 장이 앞면·뒷면을 그대로 보이며 3D로 넘어간다.
  //  · 아래 레이어 = 다음/이전 페이지 (넘어가는 동안 드러나 보임)
  //  · 넘어가는 종이 = 앞면(지금 페이지) + 뒷면(다음 스프레드의 반대편 페이지)
  function nbPageHtml(spread, sel) {
    const el = spread ? spread.querySelector(sel) : null;
    return el ? el.innerHTML : "";
  }

  function nbSetPageHtml(spread, sel, html) {
    const el = spread ? spread.querySelector(sel) : null;
    if (el) el.innerHTML = html;
  }

  function nbFlipFace(html, cls) {
    const el = document.createElement("div");
    el.className = `nb-flip-face ${cls}`;
    el.innerHTML = html;
    return el;
  }

  function nbBlankFace(cls) {
    const el = document.createElement("div");
    el.className = `nb-flip-face nb-flip-blank ${cls}`;
    return el;
  }

  // 맨 앞/맨 뒤 경계: 책을 덮으며 닫힌 책(1페이지 너비)이 드러난 뒤 책장으로 돌아간다
  function closeBookWithCover(spread, dir, opts, done) {
    if (!spread) { done(); return; }
    spread.dataset.turning = "1";
    spread.classList.add("cover-closing");
    const cover = document.createElement("div");
    cover.className = `nbf-cover nbf-cover--narrow ${dir > 0 ? "nbf-cover--close-right" : "nbf-cover--close-left"}`;
    cover.style.setProperty("--spine", opts.spine || "#2f3e5c");
    cover.innerHTML = `<div class="nbf-cover-plate"><b>${escapeHtml(opts.title || "")}</b>${opts.sub ? `<i></i><span>${escapeHtml(opts.sub)}</span>` : ""}</div>`;
    spread.appendChild(cover);
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      cover.remove();
      spread.classList.remove("cover-closing");
      spread.dataset.turning = "";
      done();
    };
    cover.addEventListener("animationend", finish, { once: true });
    setTimeout(finish, 820);
  }

  function turnToPage(dir, mutate, opts = {}) {
    const step = dir > 0 ? 1 : -1;
    const spread = document.querySelector(".nb-spread");
    if (!spread || prefersReducedMotion()) {
      mutate();
      render();
      return;
    }
    if (spread.dataset.turning === "1") return;
    if (opts.boundary) {
      closeBookWithCover(spread, step, opts, () => { mutate(); render(); });
      return;
    }

    const mobile = isMobileViewport();
    const oldSide = spread.dataset.side === "right" ? "right" : "left";
    const oldLeft = nbPageHtml(spread, ".nb-page--left");
    const oldRight = nbPageHtml(spread, ".nb-page--right");
    const oldShown = oldSide === "right" ? oldRight : oldLeft;

    mutate();
    render();

    const destSpread = document.querySelector(".nb-spread");
    if (!destSpread) return;
    const destSide = destSpread.dataset.side === "right" ? "right" : "left";
    const destLeft = nbPageHtml(destSpread, ".nb-page--left");
    const destRight = nbPageHtml(destSpread, ".nb-page--right");
    const destShown = destSide === "right" ? destRight : destLeft;
    const sideCls = s => (s === "right" ? "nb-page--right" : "nb-page--left");

    const host = document.createElement("div");
    const leaf = document.createElement("div");
    leaf.className = "nb-flip-leaf";

    if (mobile) {
      host.className = "nb-flip nb-flip--full";
      if (step > 0) {
        // 지금 페이지가 책등(왼쪽) 축으로 넘어가고, 아래에 다음 페이지가 드러난다
        leaf.appendChild(nbFlipFace(oldShown, `nb-flip-front nb-page ${sideCls(oldSide)}`));
        leaf.appendChild(nbBlankFace("nb-flip-back"));
        leaf.classList.add("is-next");
      } else {
        // 지금 페이지를 아래에 깔고, 앞 장이 앞면을 보이며 되돌아 들어온다
        nbSetPageHtml(destSpread, "." + sideCls(destSide), oldShown);
        leaf.appendChild(nbFlipFace(destShown, `nb-flip-front nb-page ${sideCls(destSide)}`));
        leaf.appendChild(nbBlankFace("nb-flip-back"));
        leaf.classList.add("is-back");
      }
    } else {
      host.className = step > 0 ? "nb-flip nb-flip--right" : "nb-flip nb-flip--left";
      if (step > 0) {
        // 왼쪽엔 지금 왼쪽 장이 남아 있고, 오른쪽 장이 넘어가면서 뒷면(다음 왼쪽 장)이 내려앉는다
        nbSetPageHtml(destSpread, ".nb-page--left", oldLeft);
        leaf.appendChild(nbFlipFace(oldRight, "nb-flip-front nb-page nb-page--right"));
        leaf.appendChild(nbFlipFace(destLeft, "nb-flip-back nb-page nb-page--left"));
        leaf.classList.add("is-next");
      } else {
        // 오른쪽엔 지금 오른쪽 장이 남아 있고, 왼쪽 장이 오른쪽으로 넘어간다
        nbSetPageHtml(destSpread, ".nb-page--right", oldRight);
        leaf.appendChild(nbFlipFace(oldLeft, "nb-flip-front nb-page nb-page--left"));
        leaf.appendChild(nbFlipFace(destRight, "nb-flip-back nb-page nb-page--right"));
        leaf.classList.add("is-prev");
      }
    }

    host.appendChild(leaf);
    destSpread.dataset.turning = "1";
    destSpread.appendChild(host);

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      nbSetPageHtml(destSpread, ".nb-page--left", destLeft);
      nbSetPageHtml(destSpread, ".nb-page--right", destRight);
      host.remove();
      destSpread.dataset.turning = "";
    };
    leaf.addEventListener("animationend", finish, { once: true });
    setTimeout(finish, 900);
  }

  const KO_DOW = ["일", "월", "화", "수", "목", "금", "토"];

  // 달력처럼 쓰는 기본 제목: 2026.11.28.(토)
  function diaryDateTitle(dateStr) {
    const d = String(dateStr || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return "";
    return `${dottedDate(d)}.(${KO_DOW[getDayOfWeek(d)]})`;
