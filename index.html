<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="아카이브 플래너" />
  <meta name="theme-color" content="#faf9f6" />
  <title>index</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --surface-muted: #f3f1ec;
      --border: #e5e2da;
      --text: #1f2421;
      --text-sub: #6b7280;
      --sat: #3b6ea5;
      --sun: #c84b4b;
      --c-year: #334155;
      --c-diary: #2b4c7e;
      --c-goal: #2d6a4f;
      --c-bucket: #b46528;
      --c-archive: #5b4b8a;
      --c-todo: #6441a5;
      --radius: 12px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .app-shell {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 232px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: sticky;
      top: 0;
      height: 100vh;
      flex-shrink: 0;
    }
    .brand {
      padding: 6px 10px 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .brand p {
      font-size: 12px;
      color: var(--text-sub);
      margin: 4px 0 0;
    }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .nav-btn:hover { background: var(--surface-muted); color: var(--text); }
    .nav-btn.active { background: var(--surface-muted); color: var(--text); font-weight: 700; }
    .nav-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-hint {
      font-size: 11px;
      color: var(--text-sub);
      padding: 0 2px;
      line-height: 1.5;
    }
    .main {
      flex: 1;
      padding: 24px 28px 92px;
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
      min-width: 0;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 12px;
      min-height: 40px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      min-height: 36px;
      min-width: 0;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-left: auto;
      min-height: 36px;
    }
    .topbar-sub {
      font-size: 13px;
      color: var(--text-sub);
    }
    .page-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .title-year { color: var(--c-year); }
    .title-diary { color: var(--c-diary); }
    .title-goal { color: var(--c-goal); }
    .title-bucket { color: var(--c-bucket); }
    .title-archive { color: var(--c-archive); }

    /* 공통 상단 유틸리티 (검색 · 설정) */
    .global-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
    }
    .global-tools.search-open { margin-left: 0; }
    .search-open-inner {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .search-open-inner .search-input { min-width: 220px; }

    .diary-date-badge {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    select, input[type="text"], input[type="date"], textarea {
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 11px;
      height: 36px;
      outline: none;
    }
    textarea {
      height: auto;
      padding: 10px 12px;
      font-size: 14px;
    }
    select:focus, input:focus, textarea:focus {
      border-color: #94a3b8;
    }
    .search-input {
      min-width: 210px;
      font-size: 13px;
      height: 36px;
    }
    .year-select {
      font-weight: 600;
      font-size: 13px;
      height: 36px;
      padding: 0 12px;
      cursor: pointer;
      background: var(--surface);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:hover { background: var(--surface-muted); }
    .btn-primary {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .btn-primary:hover { opacity: 0.9; background: var(--text); }
    .btn-sm {
      height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }
    .btn-nav-arrow {
      width: 36px;
      padding: 0;
    }
    .btn-danger-outline {
      color: var(--sun);
      border-color: #f0c9c9;
      background: #fff;
    }
    .btn-danger-outline:hover { background: #fef2f2; }
    .segmented {
      display: inline-flex;
      align-items: center;
      height: 36px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2px;
    }
    .segmented button {
      border: none;
      background: transparent;
      height: 30px;
      padding: 0 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      white-space: nowrap;
      cursor: pointer;
    }
    .segmented button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 7px;
      color: var(--text-sub);
      cursor: pointer;
      padding: 0;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: var(--surface-muted); color: var(--text); }
    .icon-btn.danger:hover { color: var(--sun); border-color: #fecaca; background: #fef2f2; }
    .icon-btn-lg {
      width: 36px;
      height: 36px;
      border-radius: 9px;
    }

    .tap-edit-target {
      cursor: pointer;
      transition: opacity 0.14s, color 0.14s;
    }
    .tap-edit-target:hover {
      opacity: 0.78;
    }

    /* 통계 요약 바 */
    .summary-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .summary-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      font-size: 13px;
    }
    .progress-track {
      width: 140px;
      height: 8px;
      background: var(--surface-muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: var(--c-goal);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .legend-dots {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-sub);
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* 검색 결과 패널 */
    .search-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 20px;
    }
    .search-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
      overflow-y: auto;
    }
    .search-result-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      background: var(--bg);
    }
    .search-result-item:hover { background: var(--surface-muted); }

    /* 연력 뷰 */
    .year-block { margin-bottom: 32px; }
    .year-heading {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-year);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .matrix-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      max-height: 76vh;
      overflow-y: auto;
    }
    table.year-table {
      width: 100%;
      min-width: 1120px;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.year-table th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--surface-muted);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      padding: 10px 6px;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      text-align: center;
    }
    table.year-table th.day-axis-col,
    table.year-table td.day-axis-cell {
      position: sticky;
      left: 0;
      z-index: 3;
      width: 44px;
      background: var(--surface-muted);
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      cursor: default;
      vertical-align: middle;
    }
    table.year-table th.day-axis-col {
      z-index: 5;
    }
    table.year-table td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 6px 7px;
      vertical-align: top;
      height: 54px;
      cursor: pointer;
      transition: background 0.12s;
    }
    table.year-table td:hover:not(.empty-cell):not(.day-axis-cell) { background: #f4f6fb; }
    table.year-table td.empty-cell { background: #faf9f6; cursor: default; }
    table.year-table td.weekend-bg { background: #fcfbf9; }
    table.year-table td.selected-day { outline: 2px solid var(--c-diary); outline-offset: -2px; background: #eef2ff; }
    table.year-table td.today-cell { background: #fefce8; }
    .cell-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .day-num { color: var(--text-sub); }
    .day-num.sat { color: var(--sat); }
    .day-num.sun, .day-num.holiday { color: var(--sun); }
    .cell-badges { display: flex; gap: 3px; align-items: center; }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .cell-line {
      font-size: 11.5px;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }
    .cell-line.holiday-label {
      color: var(--sun);
      font-weight: 600;
      opacity: 0.9;
    }

    /* 달별 모아보기 (기록 있는 날만) */
    .month-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .month-jump-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .month-jump-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .month-jump-btn:hover { background: var(--surface-muted); color: var(--text); }
    .months-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .month-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .month-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .month-card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--c-year);
    }
    .month-card-count {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      background: var(--surface-muted);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .month-highlights {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .highlight-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      padding: 5px 7px;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .highlight-row:hover { background: var(--surface-muted); }
    .highlight-row > span { min-width: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .list-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    .list-item.done .item-title {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .item-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .chk {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--text);
      flex-shrink: 0;
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      word-break: break-word;
    }
    .item-meta {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-sub);
    }
    .pill svg, .chip-btn svg {
      flex-shrink: 0;
    }
    .done-date-inline {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--text-sub);
    }
    .done-date-inline input[type="date"] {
      font-size: 11px;
      height: 26px;
      padding: 2px 6px;
      border-radius: 6px;
    }
    textarea.diary-area {
      width: 100%;
      min-height: 280px;
      resize: vertical;
      line-height: 1.7;
      padding: 14px;
    }
    .diary-save-line {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
    }
    .save-status {
      font-size: 12px;
      color: var(--text-sub);
    }
    .save-status.saving { color: var(--c-diary); }

    /* 필터 칩 */
    .filter-bar-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }
    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }
    .chip-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 999px;
      height: 32px;
      padding: 0 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .chip-btn:hover { background: var(--surface-muted); color: var(--text); }
    .chip-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .chip-btn.active .chip-count { color: rgba(255,255,255,0.75); }
    .chip-count {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }
    .chip-manage-btn {
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .composer-card {
      border-color: #cbd5e1;
      background: #fdfcfa;
    }
    .composer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .composer-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }
    .composer-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      margin-top: 4px;
      border-top: 1px dashed var(--border);
    }
    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    /* 픽토그램 선택 피커 */
    .icon-picker-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }
    .icon-pick-btn {
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-sub);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s;
    }
    .icon-pick-btn:hover {
      background: var(--surface-muted);
      color: var(--text);
    }
    .icon-pick-btn.selected {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .media-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: opacity 0.15s;
      min-width: 0;
    }
    .media-card.done {
      background: #fcfbf9;
    }
    .media-card.done .media-title {
      text-decoration: line-through;
      color: var(--text-sub);
    }
    .media-cover {
      width: 100%;
      height: 185px;
      background: var(--surface-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      color: var(--text-sub);
      cursor: pointer;
      position: relative;
    }
    .media-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-count-badge {
      position: absolute;
      right: 10px;
      bottom: 10px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
    }

      right: 0;

      padding: 6px 4px;
      z-index: 40;
      justify-content: space-around;

      align-items: center;

      justify-content: center;

    .modal {

      padding: 20px;
      border: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }

    .modal-field label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    /* 설정 모달 */

    .storage-track {
      height: 8px;
      background: var(--surface-muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .storage-fill { height: 100%; background: var(--c-diary); border-radius: 999px; }

    .settings-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* 카테고리 관리 모달 */

      align-items: center;
      justify-content: space-between;

      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 600;

      padding: 0;

      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;

      height: 100%;

      right: 14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.16);

      line-height: 1;

      align-items: center;
      justify-content: center;

    .lightbox-nav {

      top: 50%;
      transform: translateY(-50%);

      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;

    .lightbox-nav.prev { left: 10px; }
    .lightbox-nav.next { right: 10px; }

    @media (max-width: 1060px) {

    }
    @media (max-width: 860px) {
      .sidebar { display: none; }

        padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));

      .main { padding: 14px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
      .grid-2 { grid-template-columns: minmax(0, 1fr); }
      .months-grid, .media-grid { grid-template-columns: minmax(0, 1fr); }

      /* 상단 바: 1줄 제목 + 유틸리티, 2줄 필터 그리드 */
      .topbar { align-items: flex-start; gap: 8px 10px; }
      .topbar-left { flex: 1 1 auto; }
      .global-tools { order: 1; flex: 0 0 auto; margin-left: auto; }

        margin-left: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .topbar-right > select {
        flex: 1 1 calc(50% - 3px);
        width: auto;
        min-width: 0;
        height: 34px;
      }
      .topbar-right > input[type="date"] {
        flex: 1 1 110px;
        width: auto;
        min-width: 0;
        height: 34px;
      }
      .topbar-right > .segmented { flex: 1 1 100%; }
      .topbar-right > .segmented button { flex: 1; }
      .topbar-right > .btn-primary { flex: 1 1 100%; }
      .topbar-right > .btn-nav-arrow { flex: 0 0 34px; width: 34px; height: 34px; }
      .topbar-right > .btn { height: 34px; }
      .page-title { font-size: 18px; }
      .diary-date-badge { font-size: 14px; }
      .topbar-sub { font-size: 12px; }

      .filter-chips {
        flex-wrap: nowrap;
        overflow-x: auto;
        width: 100%;
        padding-bottom: 2px;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .filter-chips::-webkit-scrollbar { display: none; }
      .chip-manage-btn { margin-left: auto; }

      .search-panel { padding: 12px 14px; }
      .modal { padding: 16px; }
      .icon-picker-grid { grid-template-columns: repeat(6, 1fr); }
      .composer-actions { margin-left: auto; }
      .lightbox-nav { width: 38px; height: 38px; }
    }
  </style>
</head>

  function resolveIconKey(val, fallback = "target") {
    if (!val) return fallback;
    if (PICTOGRAMS[val]) return val;
    if (EMOJI_TO_ICON_KEY[val]) return EMOJI_TO_ICON_KEY[val];

  function renderPictogram(iconKey, size = 14) {
    const key = resolveIconKey(iconKey, "target");
    const item = PICTOGRAMS[key] || PICTOGRAMS.target;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${item.paths}</svg>`;

  function renderIconPickerHtml(inputId, selectedKey) {
    const cur = resolveIconKey(selectedKey, "target");

        ${Object.entries(PICTOGRAMS).map(([k, info]) => `
          <button type="button" class="icon-pick-btn ${k === cur ? "selected" : ""}" title="${info.label}" aria-label="${info.label}" onclick="selectPickerIcon('${inputId}', '${k}', this)">
            ${renderPictogram(k, 16)}

        `).join("")}
      </div>

  }

  const FIXED_SOLAR_HOLIDAYS = {
    "01-01": "신정",

  const lunarFormatter = new Intl.DateTimeFormat("ko-KR-u-ca-chinese", {
    month: "numeric",
    day: "numeric"
  });

  function getLunarMonthDay(dateObj) {
    try {
      const parts = lunarFormatter.formatToParts(dateObj);
      const monthPart = parts.find(p => p.type === "month");
      const dayPart = parts.find(p => p.type === "day");
      const mPart = (monthPart && monthPart.value) || "";
      const dPart = (dayPart && dayPart.value) || "";
      const isLeap = mPart.includes("윤");
      const month = parseInt(mPart.replace(/[^0-9]/g, ""), 10);
      const day = parseInt(dPart.replace(/[^0-9]/g, ""), 10);
      return { month, day, isLeap };
    } catch (_) {
      return null;
    }
  }

  function buildHolidayMap(years) {
    const map = {};
    const addName = (ds, name) => {
      if (!map[ds]) map[ds] = name;
      else if (!map[ds].includes(name)) map[ds] += ` · ${name}`;
    };

    years.forEach(year => {
      const start = new Date(year - 1, 11, 25);
      const end = new Date(year + 1, 0, 5);
      for (let dt = new Date(start); dt <= end; dt.setDate(dt.getDate() + 1)) {
        const y = dt.getFullYear();
        const m = dt.getMonth() + 1;
        const d = dt.getDate();
        const ds = `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const md = `${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

        if (y === year && FIXED_SOLAR_HOLIDAYS[md]) {
          addName(ds, FIXED_SOLAR_HOLIDAYS[md]);
        }

        const lunar = getLunarMonthDay(dt);
        if (lunar && !lunar.isLeap) {
          if (lunar.month === 1 && lunar.day === 1) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "설날 연휴");
            if (y === year) addName(ds, "설날");
            if (next.getFullYear() === year) addName(nStr, "설날 연휴");
          }
          if (y === year && lunar.month === 4 && lunar.day === 8) {
            addName(ds, "부처님오신날");
          }
          if (lunar.month === 8 && lunar.day === 15) {
            const prev = new Date(dt); prev.setDate(prev.getDate() - 1);
            const next = new Date(dt); next.setDate(next.getDate() + 1);
            const pStr = `${prev.getFullYear()}-${String(prev.getMonth() + 1).padStart(2, "0")}-${String(prev.getDate()).padStart(2, "0")}`;
            const nStr = `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, "0")}-${String(next.getDate()).padStart(2, "0")}`;
            if (prev.getFullYear() === year) addName(pStr, "추석 연휴");
            if (y === year) addName(ds, "추석");
            if (next.getFullYear() === year) addName(nStr, "추석 연휴");
          }
        }
      }

      const subTargets = new Set(["설날 연휴", "설날", "추석 연휴", "추석", "삼일절", "어린이날", "부처님오신날", "광복절", "개천절", "한글날", "크리스마스"]);
      const yearDates = Object.keys(map).filter(k => k.startsWith(`${year}-`)).sort();
      yearDates.forEach(ds => {
        const [yy, mm, dd] = ds.split("-").map(Number);
        const dt = new Date(yy, mm - 1, dd);
        const dow = dt.getDay();
        const names = map[ds].split(" · ");
        const isSeolOrChuseok = names.some(n => n.includes("설날") || n.includes("추석"));
        const isOtherSub = names.some(n => subTargets.has(n) && !n.includes("설날") && !n.includes("추석"));
        const hasOverlap = names.length > 1;

        if ((isSeolOrChuseok && (dow === 0 || hasOverlap)) || (isOtherSub && (dow === 0 || dow === 6 || hasOverlap))) {
          const cursor = new Date(dt);
          while (true) {
            cursor.setDate(cursor.getDate() + 1);
            const cStr = `${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}-${String(cursor.getDate()).padStart(2, "0")}`;
            const cDow = cursor.getDay();
            if (cDow !== 0 && cDow !== 6 && !map[cStr]) {
              if (cursor.getFullYear() === year) {
                map[cStr] = "대체공휴일";
              }
              break;
            }
          }
        }
      });
    });

    return map;
  }

  function normalizeCategoryList(list, fallbackIcon = "target") {
    if (!Array.isArray(list)) return [];
    const seen = new Set();
    return list.map(item => {
      if (typeof item === "string") return { name: item, icon: fallbackIcon };
      const name = String(item && item.name ? item.name : "").trim();
      const rawIcon = (item && (item.icon || item.emoji)) || fallbackIcon;
      return { name, icon: resolveIconKey(rawIcon, fallbackIcon) };
    }).filter(x => {
      if (!x.name || seen.has(x.name)) return false;
      seen.add(x.name);
      return true;
    });
  }

      merged.yearFilter = defaultState.yearFilter;
    }
    if (!["year", "diary", "goals", "bucket", "archive"].includes(merged.activeTab)) merged.activeTab = "year";
    return merged;
  }

  // ---------- 이전 버전(archive_planner_index_v2_3) 데이터 이전 ----------
  function guessIconByName(name) {
    const n = String(name || "");
    const rules = [
      [/학업|공부|전공|시험|임용|교육|수학/, "book"],
      [/운동|건강|헬스|근력/, "dumbbell"],
      [/독서|책|문화|전시|예술|그림/, "palette"],
      [/자산|경제|재테크|투자|돈/, "chart"],
      [/생활|루틴|습관|일상/, "leaf"],
      [/여행|탐험|해외/, "compass"],
      [/음악|공연|LP/, "music"],
      [/차|미식|커피|음료/, "coffee"]
    ];
    for (const [re, key] of rules) {
      if (re.test(n)) return key;
    }
    return null;
  }

  function looksLikeLegacyIndex(obj) {
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
    if (obj.logs || obj.topics) return false;
    return (
      Array.isArray(obj.archives) ||
      (obj.diaries && typeof obj.diaries === "object") ||
      Array.isArray(obj.goalCategories) ||
      "selectedArchiveCat" in obj ||
      "calMode" in obj ||
      "calYear" in obj
    );
  }

  function isUntouchedLegacySample(obj) {
    const archives = Array.isArray(obj.archives) ? obj.archives : [];
    const goals = Array.isArray(obj.goals) ? obj.goals : [];
    const buckets = Array.isArray(obj.buckets) ? obj.buckets : [];
    const diaryDates = (obj.diaries && typeof obj.diaries === "object" && !Array.isArray(obj.diaries)) ? Object.keys(obj.diaries) : [];
    return (
      archives.every(a => LEGACY_SAMPLE.archives.includes(a && a.title)) &&
      goals.every(g => LEGACY_SAMPLE.goals.includes(g && g.title)) &&
      buckets.every(b => LEGACY_SAMPLE.buckets.includes(b && b.title)) &&
      diaryDates.every(d => LEGACY_SAMPLE.diaryDates.includes(d))
    );
  }

  function migrateLegacyIndex(parsed) {
    if (!looksLikeLegacyIndex(parsed)) return null;
    if (isUntouchedLegacySample(parsed)) return null;

    const base = clone(defaultState);
    const topics = [];
    (Array.isArray(parsed.goalCategories) ? parsed.goalCategories : []).forEach(raw => {
      const name = String(raw && raw.name ? raw.name : raw || "").trim();
      if (name && !topics.some(t => t.name === name)) {
        topics.push({ name, icon: resolveIconKey(raw && raw.icon, guessIconByName(name) || "target") });
      }
    });

    const archiveCategories = [];
    (Array.isArray(parsed.archiveCategories) ? parsed.archiveCategories : []).forEach(raw => {
      const name = String(raw && raw.name ? raw.name : raw || "").trim();
      if (name && !archiveCategories.some(c => c.name === name)) {
        archiveCategories.push({ name, icon: resolveIconKey(raw && raw.icon, guessIconByName(name) || "folder") });
      }
    });

    const logs = {};
    if (parsed.diaries && typeof parsed.diaries === "object" && !Array.isArray(parsed.diaries)) {
      Object.entries(parsed.diaries).forEach(([dateStr, value]) => {
        if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
        const oneLine = String(value.summary || value.oneLine || "").trim();
        const diary = String(value.body || value.diary || "").trim();
        if (oneLine || diary) logs[dateStr] = { oneLine, diary };
      });
    }

    const goals = (Array.isArray(parsed.goals) ? parsed.goals : []).map(g => {
      const title = String(g && g.title || "").trim();
      if (!title) return null;
      let topic = String(g.category || g.topic || "").trim();
      if (!topic) topic = topics[0] ? topics[0].name : "기타";
      if (!topics.some(t => t.name === topic)) {
        topics.push({ name: topic, icon: guessIconByName(topic) || "target" });
      }
      return {
        id: g.id || uid(),
        topic,
        year: normalizeYear(g.year),
        period: normalizePeriod(g.period),
        title,
        note: String(g.note || g.detail || "").trim(),
        images: [],
        done: Boolean(g.done),
        doneDate: String(g.doneDate || "").trim()
      };
    }).filter(Boolean);

    const bucketCategories = [];
    const buckets = (Array.isArray(parsed.buckets) ? parsed.buckets : []).map(b => {
      const title = String(b && b.title || "").trim();
      if (!title) return null;
      let category = String(b.category || "").trim() || "경험";
      if (!bucketCategories.some(c => c.name === category)) {
        bucketCategories.push({ name: category, icon: guessIconByName(category) || "star" });
      }
      return {
        id: b.id || uid(),
        category,
        title,
        note: String(b.note || b.detail || "").trim(),
        done: Boolean(b.done),
        doneDate: String(b.doneDate || "").trim()
      };
    }).filter(Boolean);

    const archives = (Array.isArray(parsed.archives) ? parsed.archives : []).map(a => {
      const title = String(a && a.title || "").trim();
      if (!title) return null;
      const category = String(a.category || "").trim() || (archiveCategories[0] ? archiveCategories[0].name : "기타");
      if (!archiveCategories.some(c => c.name === category)) {
        archiveCategories.push({ name: category, icon: guessIconByName(category) || "folder" });
      }
      return {
        id: a.id || uid(),
        category,
        date: String(a.date || TODAY_STR).trim(),
        title,
        subtitle: String(a.subtitle || "").trim(),
        note: String(a.note || "").trim(),
        images: a.coverUrl ? [a.coverUrl] : []
      };
    }).filter(Boolean);

    const calYear = Number(parsed.calYear);
    const yearFilter = YEARS.includes(calYear) ? String(calYear) : base.yearFilter;
    const selectedDate = /^\d{4}-\d{2}-\d{2}$/.test(String(parsed.diaryDate || "")) ? parsed.diaryDate : base.selectedDate;

    return {
      ...base,
      activeTab: normalizeTab(parsed.activeTab),
      yearFilter,
      selectedDate,
      logs,
      topics: topics.length ? topics : base.topics,
      archiveCategories: archiveCategories.length ? archiveCategories : base.archiveCategories,
      bucketCategories: bucketCategories.length ? bucketCategories : base.bucketCategories,
      goals,
      buckets,
      archives,
      todos: [],
      migratedFrom: LEGACY_INDEX_KEY
    };
  }

  function loadState() {
    let untouchedNewState = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          const normalized = normalizeState(parsed);
          // 예시 그대로인 새 상태는 이전 버전 데이터가 있으면 그쪽을 살린다
          if (!isUntouchedNewDefault(normalized)) return normalized;
          untouchedNewState = normalized;
        }
      }
    } catch (_) { /* 손상된 v8 데이터는 아래 후보에서 복구 */ }

    for (const key of LEGACY_PERSONAL_KEYS) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return normalizeState(parsed);
      } catch (_) { /* 다음 후보 */ }
    }

    try {
      const rawLegacy = localStorage.getItem(LEGACY_INDEX_KEY);
      if (rawLegacy) {
        const parsed = JSON.parse(rawLegacy);
        const migrated = migrateLegacyIndex(parsed);
        if (migrated) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated)); } catch (_) {}
          return migrated;
        }
      }
    } catch (_) { /* 이전 데이터가 깨졌으면 새 기본값으로 */ }

    return untouchedNewState || clone(defaultState);
  }

  function stableStringify(value) {
    if (Array.isArray(value)) return "[" + value.map(stableStringify).join(",") + "]";
    if (value && typeof value === "object") {
      return "{" + Object.keys(value).sort().map(k => JSON.stringify(k) + ":" + stableStringify(value[k])).join(",") + "}";
    }
    return JSON.stringify(value === undefined ? null : value);
  }

  function isUntouchedNewDefault(s) {
    const keys = ["logs", "goals", "buckets", "archives", "todos", "topics", "bucketCategories", "archiveCategories"];
    return keys.every(k => stableStringify(s[k]) === stableStringify(defaultState[k]));
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      lastSavedAt = new Date();
      return true;
    } catch (e) {
      const msg = `${(e && e.name) || ""} ${(e && e.message) || ""}`;
      const isQuota = /quota|exceeded/i.test(msg) || (e && (e.code === 22 || e.code === 1014));
      if (isQuota) {
        if (!quotaWarned) {
          quotaWarned = true;
          alert("브라우저 저장 공간이 가득 찼습니다.\n\n· 설정 → ‘데이터 백업 (JSON)’으로 먼저 백업해 주세요.\n· 사진이 많은 항목의 사진을 줄이거나 오래된 사진을 삭제하면 공간이 확보됩니다.\n\n방금 입력한 내용은 저장되지 않았을 수 있습니다.");
        }
      } else {
        console.error(e);
      }
      return false;
    }
  }

  function getStorageUsage() {
    let bytes = 0;
    let keys = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key === null) continue;
        const value = localStorage.getItem(key) || "";
        bytes += (key.length + value.length) * 2; // UTF-16 기준 추정
        keys += 1;
      }
    } catch (_) {}
    return { bytes, keys };
  }

  function formatBytes(bytes) {
    if (!bytes || bytes < 1024) return `${bytes || 0} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
  }

  function getPhotoCount() {
    return [...(state.goals || []), ...(state.archives || [])].reduce((sum, item) => sum + normalizeImages(item).length, 0);
  }

  function timeStr(date) {
    const d = date instanceof Date ? date : new Date();
    return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  }

  function clearSamples() {
    if (!confirm("모든 기록(일기·목표·버킷리스트·아카이브·할일)을 지우고 빈 상태로 시작할까요?\n\n되돌릴 수 없으니 먼저 ‘데이터 백업 (JSON)’을 권장합니다.")) return;
    state.logs = {};
    state.goals = [];
    state.buckets = [];
    state.archives = [];
    state.todos = [];
    saveState();
    render();
    refreshSettingsIfOpen();
  }

  function uid() {
    return "id_" + Math.random().toString(36).slice(2, 9);
  }

  function getTopicIconKey(topicName) {
    const found = state.topics.find(t => t.name === topicName);
    return found ? resolveIconKey(found.icon, "target") : "target";
  }

  function getArchiveCatIconKey(catName) {
    const found = state.archiveCategories.find(c => c.name === catName);
    return found ? resolveIconKey(found.icon, "folder") : "folder";
  }

  function getBucketCatIconKey(catName) {
    const found = state.bucketCategories.find(c => c.name === catName);
    return found ? resolveIconKey(found.icon, "star") : "star";
  }

  function getDayOfWeek(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d).getDay();
  }

  function isHoliday(dateStr) {
    return Boolean(HOLIDAYS[dateStr]);
  }

  function getDateColor(dateStr) {
    if (isHoliday(dateStr)) return "var(--sun)";
    const dow = getDayOfWeek(dateStr);
    if (dow === 0) return "var(--sun)";
    if (dow === 6) return "var(--sat)";
    return "var(--text)";
  }

  function shiftDate(dateStr, deltaDays) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d + deltaDays);
    const ny = dt.getFullYear();
    const nm = String(dt.getMonth() + 1).padStart(2, "0");
    const nd = String(dt.getDate()).padStart(2, "0");
    return `${ny}-${nm}-${nd}`;
  }

  function formatDateKo(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = new Date(y, m - 1, d).getDay();
    const hName = HOLIDAYS[dateStr] ? ` · ${HOLIDAYS[dateStr]}` : "";
    return `${y}년 ${m}월 ${d}일 (${days[dow]})${hName}`;
  }

  function compressImageFile(file, maxWidth = 720, quality = 0.76) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function processMultipleFiles(fileList, existingArray, maxCount = 5) {
    const files = Array.from(fileList || []);
    const result = [...existingArray];
    for (const file of files) {
      if (result.length >= maxCount) {
        alert(`사진은 항목당 최대 ${maxCount}장까지 첨부할 수 있습니다.`);
        break;
      }
      const dataUrl = await compressImageFile(file);
      result.push(dataUrl);
    }
    return result;
  }

  function yearSelectHtml(currentVal, onChangeFn, allLabel = `전체 연도 (${YEARS[0]}~${YEARS[YEARS.length - 1]})`) {

    return `
      <select class="year-select" onchange="${onChangeFn}(this.value)" aria-label="연도 선택">
        <option value="all" ${normCur === "all" ? "selected" : ""}>${allLabel}</option>
        ${opts}
      </select>
    `;
  }

  }

  function getYearViewMode() {
    if (state.yearViewMode === "matrix" || state.yearViewMode === "months") return state.yearViewMode;

  // ---------- 공통 검색 ----------
  function openSearch() {
    searchOpen = true;
    render();
    const inp = document.getElementById("globalSearchInput");
    if (inp) {
      inp.focus();
      const len = inp.value.length;
      try { inp.setSelectionRange(len, len); } catch (_) {}
    }

  function closeSearch() {
    searchOpen = false;
    searchQuery = "";
    render();
  }

  function updateSearchQuery(val) {
    searchQuery = val;
    const host = document.getElementById("searchPanelHost");
    if (host) host.innerHTML = renderSearchPanel();
  }

  function findSearchResults(q) {
    const term = String(q || "").trim().toLowerCase();
    if (!term) return [];
    const results = [];
    const hits = text => String(text || "").toLowerCase().includes(term);

    Object.entries(state.logs || {}).forEach(([dateStr, log]) => {
      const one = String(log && log.oneLine || "");
      const diary = String(log && log.diary || "");
      if (hits(one) || hits(diary)) {
        const snippet = hits(one) ? one : diary.replace(/\s+/g, " ").slice(0, 90);
        results.push({
          type: "기록 · 일기",
          title: one || `${dateStr} 일기`,
          sub: `${dateStr} · ${snippet}`,
          action: () => selectDate(dateStr, true)
        });
      }
    });

    (state.goals || []).forEach(g => {
      if (hits(g.title) || hits(g.topic) || hits(g.note)) {
        results.push({
          type: "목표",
          title: String(g.title || ""),
          sub: `${g.topic || ""} · ${normalizeYear(g.year)}년 ${normalizePeriod(g.period)}`,
          action: () => {
            state.goalTopicFilter = "all";
            state.goalYearFilter = "all";
            state.goalPeriodFilter = "all";
            setTab("goals");
          }
        });
      }
    });

    (state.buckets || []).forEach(b => {
      if (hits(b.title) || hits(b.note) || hits(b.category)) {
        results.push({
          type: "버킷리스트",
          title: String(b.title || ""),
          sub: `${b.category || ""}${b.note ? ` · ${b.note}` : ""}`,
          action: () => {
            state.bucketCatFilter = "all";
            setTab("bucket");
          }
        });
      }
    });

    (state.archives || []).forEach(a => {
      if (hits(a.title) || hits(a.subtitle) || hits(a.note) || hits(a.category)) {
        results.push({
          type: `아카이브 · ${a.category || ""}`,
          title: String(a.title || ""),
          sub: `${a.date || ""}${a.subtitle ? ` · ${a.subtitle}` : ""}`,
          action: () => {
            state.archiveCatFilter = "all";
            setTab("archive");
          }
        });
      }
    });

    (state.todos || []).forEach(t => {
      if (hits(t.title)) {
        results.push({
          type: "할일",
          title: String(t.title || ""),
          sub: t.date || "",
          action: () => selectDate(t.date, true)
        });
      }
    });

    return results;
  }

  function renderSearchPanel() {
    const term = searchQuery.trim();
    if (!term) return "";
    const list = findSearchResults(term);
    currentSearchList = list;
    return `
      <section class="search-panel">
        <div class="search-panel-header">
          <strong style="font-size:14px;">“${escapeHtml(term)}” 검색 결과 (${list.length}건)</strong>
          <button class="btn btn-sm" onclick="closeSearch()">닫기</button>
        </div>
        ${list.length ? `
          <div class="search-result-list">
            ${list.map((item, i) => `
              <div class="search-result-item" onclick="runSearchAction(${i})">
                <div style="min-width:0;">
                  <span class="pill">${escapeHtml(item.type)}</span>
                  <strong style="font-size:13px; margin-left:4px;">${escapeHtml(item.title)}</strong>
                  <div class="item-meta">${escapeHtml(item.sub)}</div>

        ` : `<p style="font-size:13px; color:var(--text-sub); margin:0;">일치하는 기록이 없습니다.</p>`}

  function runSearchAction(idx) {

  function updateNavUI() {

  function render() {

    updateNavUI();

    let bodyHtml = "";
    if (state.activeTab === "year") bodyHtml = renderYearView();
    else if (state.activeTab === "diary") bodyHtml = renderDiaryView();

    else bodyHtml = renderYearView();

  function getDayMeta(dateStr) {
    const log = state.logs[dateStr] || {};
    const hasDiary = Boolean(log.diary && log.diary.trim());
    const hasAchieved =
      state.goals.some(g => g.done && g.doneDate === dateStr) ||
      state.buckets.some(b => b.done && b.doneDate === dateStr);
    const hasArchive = state.archives.some(a => a.date === dateStr);
    const hasTodo = state.todos.some(t => t.date === dateStr);
    const hasAny = Boolean(log.oneLine || hasDiary || hasAchieved || hasArchive || hasTodo);
    return { log, hasDiary, hasAchieved, hasArchive, hasTodo, hasAny };
  }

  // 1년 연력 뷰 (달별 모아보기는 '기록 있는 날만' 고정)
  function renderYearView() {
    const targetYears = state.yearFilter === "all" ? YEARS : [Number(normalizeYear(state.yearFilter))];
    const dayNames = ["일", "월", "화", "수", "목", "금", "토"];
    const mode = getYearViewMode();

    const legendBar = `
      <div class="summary-strip">
        <div class="legend-dots">
          <span class="legend-item"><span class="badge-dot" style="background:var(--c-diary)"></span>일기</span>
          <span class="legend-item"><span class="badge-dot" style="background:var(--c-goal)"></span>목표·버킷 달성</span>
          <span class="legend-item"><span class="badge-dot" style="background:var(--c-archive)"></span>아카이브</span>
          <span class="legend-item"><span class="badge-dot" style="background:var(--c-todo)"></span>할일</span>
        </div>
        <span style="font-size:12px; color:var(--text-sub);">날짜를 누르면 해당 날짜의 기록·일기로 이동합니다</span>
      </div>
    `;

    const blocks = targetYears.map(year => {
      if (mode === "months") {
        const jumpButtons = Array.from({ length: 12 }, (_, i) =>
          `<button class="month-jump-btn" onclick="jumpToMonthCard(${year}, ${i + 1})">${i + 1}월</button>`
        ).join("");

        const monthCards = Array.from({ length: 12 }, (_, idx) => {
          const month = idx + 1;
          const maxDay = new Date(year, month, 0).getDate();
          const recordedDays = [];

          for (let day = 1; day <= maxDay; day++) {
            const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
            const meta = getDayMeta(dateStr);
            if (meta.hasAny) recordedDays.push({ day, dateStr, ...meta });
          }

          const innerBody = recordedDays.length ? `
            <div class="month-highlights">
              ${recordedDays.map(item => {
                const dow = getDayOfWeek(item.dateStr);
                const dCol = getDateColor(item.dateStr);
                const summary = item.log.oneLine || (item.hasArchive ? "아카이브 기록" : item.hasAchieved ? "목표·버킷 달성" : item.hasDiary ? "일기 작성됨" : "할일 등록됨");
                return `
                  <div class="highlight-row" onclick="selectDate('${item.dateStr}', true)">
                    <strong style="width:52px; flex-shrink:0; color:${dCol};">${item.day}일(${dayNames[dow]})</strong>
                    <span style="flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(summary)}</span>
                    <span class="cell-badges">
                      ${item.hasDiary ? `<span class="badge-dot" style="background:var(--c-diary)"></span>` : ""}
                      ${item.hasAchieved ? `<span class="badge-dot" style="background:var(--c-goal)"></span>` : ""}
                      ${item.hasArchive ? `<span class="badge-dot" style="background:var(--c-archive)"></span>` : ""}
                      ${item.hasTodo ? `<span class="badge-dot" style="background:var(--c-todo)"></span>` : ""}
                    </span>
                  </div>
                `;
              }).join("")}
            </div>
          ` : `<p style="font-size:12px; color:var(--text-sub); margin:6px 0;">기록 있는 날이 없습니다.</p>`;

          return `
            <div class="month-card" id="month-card-${year}-${month}">
              <div class="month-card-header">
                <span class="month-card-title">${month}월</span>
                <span class="month-card-count">기록 ${recordedDays.length}일</span>
              </div>
              ${innerBody}
            </div>
          `;
        }).join("");

        return `
          <section class="year-block">
            <div class="month-toolbar">
              <h2 class="year-heading" style="margin:0;">${year}년 달별 모아보기 · 기록 있는 날</h2>
              <div class="month-jump-bar">${jumpButtons}</div>
            </div>
            <div class="months-grid">${monthCards}</div>
          </section>
        `;
      }

      let rows = "";
      for (let day = 1; day <= 31; day++) {
        let cells = `<td class="day-axis-cell">${day}일</td>`;
        for (let month = 1; month <= 12; month++) {
          const maxDay = new Date(year, month, 0).getDate();
          if (day > maxDay) {
            cells += `<td class="empty-cell"></td>`;
            continue;
          }
          const dateStr = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const dow = getDayOfWeek(dateStr);
          const hol = isHoliday(dateStr);
          const dayCls = hol ? "holiday" : dow === 0 ? "sun" : dow === 6 ? "sat" : "";
          const meta = getDayMeta(dateStr);

          const isSelected = state.selectedDate === dateStr;
          const isToday = TODAY_STR === dateStr;
          const isWeekend = dow === 0 || dow === 6;
          const tdCls = [
            isWeekend ? "weekend-bg" : "",
            isSelected ? "selected-day" : "",
            isToday ? "today-cell" : ""
          ].filter(Boolean).join(" ");
          const tip = `${dateStr} (${dayNames[dow]})${HOLIDAYS[dateStr] ? ` · ${HOLIDAYS[dateStr]}` : ""}${meta.log.oneLine ? `\n${meta.log.oneLine}` : ""}`;
          const showHolidayText = !meta.log.oneLine && hol;

          cells += `
            <td class="${tdCls}" onclick="selectDate('${dateStr}', true)" title="${escapeAttr(tip)}">
              <div class="cell-top">
                <span class="day-num ${dayCls}">${dayNames[dow]}</span>
                <span class="cell-badges">
                  ${meta.hasDiary ? `<span class="badge-dot" style="background:var(--c-diary)" title="일기 있음"></span>` : ""}
                  ${meta.hasAchieved ? `<span class="badge-dot" style="background:var(--c-goal)" title="목표/버킷 달성"></span>` : ""}
                  ${meta.hasArchive ? `<span class="badge-dot" style="background:var(--c-archive)" title="아카이브 있음"></span>` : ""}
                  ${meta.hasTodo ? `<span class="badge-dot" style="background:var(--c-todo)" title="할일 있음"></span>` : ""}
                </span>
              </div>
              <div class="cell-line ${showHolidayText ? "holiday-label" : ""}">${escapeHtml(meta.log.oneLine || (hol ? HOLIDAYS[dateStr] : ""))}</div>
            </td>
          `;
        }
        rows += `<tr>${cells}</tr>`;
      }

      return `
        <section class="year-block">
          <h2 class="year-heading">${year}년 한눈에 보기</h2>
          <div class="matrix-wrap">
            <table class="year-table">
              <thead>
                <tr>
                  <th class="day-axis-col">일</th>
                  ${Array.from({ length: 12 }, (_, i) => `<th>${i + 1}월</th>`).join("")}
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </section>
      `;
    }).join("");

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-year">${ICONS.year} 1년 연력</h1>
        </div>
        <div class="topbar-right">
          <div class="segmented">
            <button class="${mode === "matrix" ? "active" : ""}" onclick="setYearViewMode('matrix')">연간 표</button>
            <button class="${mode === "months" ? "active" : ""}" onclick="setYearViewMode('months')">달별 모아보기</button>
          </div>
          ${yearSelectHtml(state.yearFilter, "changeYearFilter")}
          <button class="btn btn-primary" onclick="selectDate('${TODAY_STR}', true)">오늘 (${TODAY_STR})</button>
        </div>
        ${renderGlobalTools()}
      </div>
      ${legendBar}
      ${blocks}
    `;
  }

  // 하루 기록 · 일기 뷰 (할일 항목을 탭하면 바로 수정 모달 열림)
  function renderDiaryView() {
    const d = state.selectedDate;
    const prevDate = shiftDate(d, -1);
    const nextDate = shiftDate(d, 1);
    const dateColor = getDateColor(d);
    const log = state.logs[d] || { oneLine: "", diary: "" };

    const dayTodos = state.todos.filter(t => t.date === d);
    const doneGoals = state.goals.filter(g => g.done && g.doneDate === d);
    const doneBuckets = state.buckets.filter(b => b.done && b.doneDate === d);
    const dayArchives = state.archives.filter(a => a.date === d);

    return `
      <div class="topbar">
        <div class="topbar-left">
          <h1 class="page-title title-diary">${ICONS.diary} 하루 기록 · 일기</h1>
          <span class="diary-date-badge" style="color:${dateColor}">${formatDateKo(d)}</span>
        </div>
        <div class="topbar-right">
          <button class="btn btn-nav-arrow" onclick="selectDate('${prevDate}', false)" title="이전 날" aria-label="이전 날">${ICONS.chevLeft}</button>
          <input type="date" value="${d}" onchange="if (this.value) selectDate(this.value, false)" aria-label="날짜 선택" />
          <button class="btn btn-nav-arrow" onclick="selectDate('${nextDate}', false)" title="다음 날" aria-label="다음 날">${ICONS.chevRight}</button>
          <button class="btn btn-primary" onclick="selectDate('${TODAY_STR}', false)">오늘</button>
        </div>
        ${renderGlobalTools()}
      </div>

      <div class="grid-2">
        <div class="card">
          <label style="display:block; font-size:13px; font-weight:700; color:var(--c-diary); margin-bottom:6px;">연력 한 줄 요약</label>
          <input type="text" id="oneLineInput" style="width:100%; margin-bottom:16px;" placeholder="연력 칸에 표시될 오늘의 한 줄..." value="${escapeAttr(log.oneLine || "")}" oninput="onDiaryInput()" />

          <label style="display:block; font-size:13px; font-weight:700; color:var(--c-diary); margin-bottom:6px;">오늘의 긴 기록 · 일기</label>
          <textarea class="diary-area" id="diaryInput" placeholder="오늘 있었던 일, 생각, 감정을 자유롭게 길게 기록하세요..." oninput="onDiaryInput()">${escapeHtml(log.diary || "")}</textarea>
          <div class="diary-save-line">
            <span id="saveStatus" class="save-status">입력하면 자동으로 저장됩니다</span>
          </div>
        </div>

        <div>
          <div class="card">
            <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-todo);">이 날의 할일</h3>
            <div class="form-row">
              <input type="text" id="dayTodoInput" style="flex:1; min-width:0;" placeholder="이 날짜에 할일 추가..." onkeydown="if (event.key === 'Enter') addDayTodo()" />
              <button class="btn" onclick="addDayTodo()">추가</button>
            </div>
            <div class="item-list">
              ${dayTodos.length ? dayTodos.map(t => `
                <div class="list-item ${t.done ? "done" : ""}">
                  <div class="item-left">
                    <input type="checkbox" class="chk" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" />
                    <div class="item-title tap-edit-target" onclick="openEditTodo('${t.id}')" title="탭하여 수정">${escapeHtml(t.title)}</div>
                  </div>
                  <button class="icon-btn danger" onclick="deleteItem('todos', '${t.id}')" title="삭제" aria-label="할일 삭제">${ICONS.trash}</button>
                </div>
              `).join("") : `<p style="font-size:13px; color:var(--text-sub); margin:0;">등록된 할일이 없습니다.</p>`}
            </div>
          </div>

          ${(doneGoals.length + doneBuckets.length + dayArchives.length) > 0 ? `
            <div class="card">
              <h3 style="margin:0 0 10px; font-size:15px; color:var(--c-goal);">이 날의 달성 · 아카이브</h3>
              <div class="item-list">
                ${doneGoals.map(g => `<div class="list-item tap-edit-target" onclick="openEditGoal('${g.id}')" title="탭하여 수정"><span class="pill">${renderPictogram(getTopicIconKey(g.topic), 12)} 목표 · ${escapeHtml(g.topic)}</span>${escapeHtml(g.title)}</div>`).join("")}
                ${doneBuckets.map(b => `<div class="list-item tap-edit-target" onclick="openEditBucket('${b.id}')" title="탭하여 수정"><span class="pill">${renderPictogram(getBucketCatIconKey(b.category), 12)} 버킷 · ${escapeHtml(b.category)}</span>${escapeHtml(b.title)}</div>`).join("")}
                ${dayArchives.map(a => `<div class="list-item tap-edit-target" onclick="openEditArchive('${a.id}')" title="탭하여 수정"><span class="pill">${renderPictogram(getArchiveCatIconKey(a.category), 12)} 아카이브 · ${escapeHtml(a.category)}</span>${escapeHtml(a.title)}</div>`).join("")}
              </div>
            </div>
          ` : ""}
        </div>
      </div>
    `;
  }

  function onDiaryInput() {
    diaryPending = true;
    const st = document.getElementById("saveStatus");
    if (st) {
      st.textContent = "저장 중…";
      st.classList.add("saving");
    }
    clearTimeout(diaryTimer);
    diaryTimer = setTimeout(() => {
      diaryPending = false;
      saveDiaryDraft();
    }, 450);
  }

  function flushDiaryDraft() {
    if (!diaryPending) return;
    clearTimeout(diaryTimer);
    diaryPending = false;
    saveDiaryDraft();
  }

  function saveDiaryDraft() {
    const oneEl = document.getElementById("oneLineInput");
    const diaryEl = document.getElementById("diaryInput");
    if (!oneEl || !diaryEl) return;
    state.logs[state.selectedDate] = { oneLine: oneEl.value, diary: diaryEl.value };
    const ok = saveState();
    const st = document.getElementById("saveStatus");
    if (st) {
      st.classList.remove("saving");
      st.textContent = ok
        ? `자동 저장됨 · ${timeStr(lastSavedAt)}`
        : "저장 실패 · 설정에서 백업을 확인해 주세요";
    }
  }

  function addDayTodo() {
    const inp = document.getElementById("dayTodoInput");
    if (!inp) return;
    const title = inp.value.trim();
    if (!title) return;
    state.todos.unshift({ id: uid(), date: state.selectedDate, title, done: false });
    saveState();
    render();
  }

  // ---------- 카테고리 관리 ----------
  const CAT_KINDS = {
    goals: { label: "목표", filterKey: "goalTopicFilter", itemKey: "topic", iconFallback: "target", addIconDefault: "target" },
    bucket: { label: "버킷리스트", filterKey: "bucketCatFilter", itemKey: "category", iconFallback: "star", addIconDefault: "star" },
    archive: { label: "아카이브", filterKey: "archiveCatFilter", itemKey: "category", iconFallback: "folder", addIconDefault: "folder" }
  };

  function categoryListOf(kind) {
    if (kind === "goals") return state.topics;
    if (kind === "bucket") return state.bucketCategories;
    return state.archiveCategories;
  }

  function collectionOf(kind) {
    if (kind === "goals") return state.goals;
    if (kind === "bucket") return state.buckets;
    return state.archives;
  }

  function openCategoryManager(kind) {
    if (!CAT_KINDS[kind]) return;
    catManagerKind = kind;
    renderCategoryManager();
    document.getElementById("catModal").classList.add("open");
  }

  function closeCategoryManager() {
    catManagerKind = null;
    document.getElementById("catModal").classList.remove("open");
  }

  function refreshCategoryManager() {
    if (!catManagerKind) return;
    if (document.getElementById("catModal").classList.contains("open")) renderCategoryManager();
  }

  function renderCategoryManager() {
    const kind = catManagerKind;
    if (!kind) return;
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const items = collectionOf(kind);
    document.getElementById("catModalTitle").textContent = `${cfg.label} 카테고리 관리`;
    document.getElementById("catModalBody").innerHTML = `
      <p class="settings-hint" style="margin:0 0 10px;">이름이나 아이콘을 바꾸면 기존 항목에도 함께 반영됩니다.</p>
      <div class="cat-manage-list">
        ${list.length ? list.map((cat, idx) => {
          const count = items.filter(it => it[cfg.itemKey] === cat.name).length;
          return `
            <div class="cat-manage-row">
              <span class="cat-manage-name">${renderPictogram(cat.icon, 14)} ${escapeHtml(cat.name)} <span class="cat-manage-count">${count}</span></span>
              <span class="cat-manage-actions">
                <button class="btn btn-sm" onclick="openCategoryEdit('${kind}', ${idx})">수정</button>
                <button class="btn btn-sm btn-danger-outline" onclick="deleteCategory('${kind}', ${idx})">삭제</button>
              </span>
            </div>
          `;
        }).join("") : `<p class="settings-hint" style="margin:0;">아직 카테고리가 없습니다. 아래에서 추가하세요.</p>`}
      </div>
      <div class="cat-add-card">
        <h4>새 카테고리 추가</h4>
        ${renderIconPickerHtml("catAddIcon", cfg.addIconDefault)}
        <div class="cat-add-row">
          <input type="text" id="catAddName" placeholder="카테고리 이름" onkeydown="if (event.key === 'Enter') addCategoryFromManager()" />
          <button class="btn btn-primary" onclick="addCategoryFromManager()">추가</button>
        </div>
      </div>
    `;
  }

  function openCategoryEdit(kind, idx) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const target = list[idx];
    if (!target) return;
    openModal(`${cfg.label} 카테고리 수정`, `
      <div class="modal-field">
        <label>픽토그램 선택</label>
        ${renderIconPickerHtml("mCatIcon", target.icon)}
      </div>
      <div class="modal-field">
        <label>카테고리 이름 (기존 항목의 분류명도 함께 변경됩니다)</label>
        <input type="text" id="mCatName" value="${escapeAttr(target.name)}" />
      </div>
    `, () => {
      const newIcon = resolveIconKey(document.getElementById("mCatIcon").value, target.icon);
      const newName = document.getElementById("mCatName").value.trim();
      if (!newName) {
        alert("카테고리 이름을 입력해 주세요.");
        return false;
      }
      if (newName !== target.name && list.some(c => c.name === newName)) {
        alert("이미 같은 이름의 카테고리가 있습니다.");
        return false;
      }
      const oldName = target.name;
      list[idx] = { name: newName, icon: newIcon };
      if (state[cfg.filterKey] === oldName) state[cfg.filterKey] = newName;
      collectionOf(kind).forEach(item => {
        if (item[cfg.itemKey] === oldName) item[cfg.itemKey] = newName;
      });
      return true;
    });
  }

  function deleteCategory(kind, idx) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const target = list[idx];
    if (!target) return;
    const count = collectionOf(kind).filter(it => it[cfg.itemKey] === target.name).length;
    const msg = count > 0
      ? `‘${target.name}’ 카테고리를 삭제할까요? 이 카테고리에 속한 항목 ${count}개도 함께 삭제됩니다.`
      : `‘${target.name}’ 카테고리를 삭제할까요?`;
    if (!confirm(msg)) return;
    list.splice(idx, 1);
    if (state[cfg.filterKey] === target.name) state[cfg.filterKey] = "all";
    if (kind === "goals") state.goals = state.goals.filter(g => g.topic !== target.name);
    else if (kind === "bucket") state.buckets = state.buckets.filter(b => b.category !== target.name);
    else state.archives = state.archives.filter(a => a.category !== target.name);
    saveState();
    render();
    refreshCategoryManager();
  }

  function addCategoryFromManager() {
    const kind = catManagerKind;
    if (!kind) return;
    const cfg = CAT_KINDS[kind];
    const iconEl = document.getElementById("catAddIcon");
    const nameEl = document.getElementById("catAddName");
    const icon = resolveIconKey(iconEl ? iconEl.value : cfg.addIconDefault, cfg.iconFallback);
    const name = (nameEl ? nameEl.value : "").trim();
    if (!name) {
      if (nameEl) nameEl.focus();
      return;
    }
    const list = categoryListOf(kind);
    if (list.some(c => c.name === name)) {
      alert("이미 같은 이름의 카테고리가 있습니다.");
      return;
    }
    list.push({ name, icon });
    saveState();
    render();
    renderCategoryManager();
    const next = document.getElementById("catAddName");
    if (next) next.focus();
  }

  function ensureCategory(kind, name, icon) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const clean = String(name || "").trim() || "기타";
    const found = list.find(c => c.name === clean);
    if (!found) list.push({ name: clean, icon: resolveIconKey(icon || cfg.addIconDefault, cfg.iconFallback) });
    return clean;
  }

  function ensureTopicExists(name, icon = "target") {
    return ensureCategory("goals", name, icon);
  }

  // ---------- 목표 ----------
  function changeGoalTopicFilter(val) {
    state.goalTopicFilter = val;
    saveState();
    render();
  }

  function changeGoalYearFilter(val) {
    state.goalYearFilter = val === "all" ? "all" : normalizeYear(val);
    saveState();
    render();
  }

  function changeGoalPeriodFilter(val) {
    state.goalPeriodFilter = val;
    saveState();
    render();
  }

  function changeGoalSort(val) {
    state.goalSort = val;
    saveState();
    render();
  }

  function toggleGoalComposer() {
    showGoalComposer = !showGoalComposer;
    render();
  }

  function renderDoneDateControl(collection, id, doneDate) {
    return `
      <span class="done-date-inline" onclick="event.stopPropagation()">
        달성일:
        <input type="date" value="${escapeAttr(doneDate || TODAY_STR)}" onchange="updateDoneDate('${collection}', '${id}', this.value)" />
      </span>
    `;
  }

  function renderThumbList(images, removeFnName) {
    if (!images || images.length === 0) return `<span style="font-size:12px; color:var(--text-sub);">등록된 사진 없음</span>`;
    return images.map((src, i) => `
      <span class="thumb-wrap">
        <img src="${src}" alt="미리보기 ${i + 1}" />
        <button type="button" class="thumb-del-btn" onclick="${removeFnName}(${i})" title="삭제" aria-label="사진 삭제">&times;</button>
      </span>
    `).join("");
  }

  async function handleNewGoalImages(event) {
    try {
      draftGoalImages = await processMultipleFiles(event.target.files, draftGoalImages, 5);
      event.target.value = "";

      const periodOk = state.goalPeriodFilter === "all" || normalizePeriod(g.period) === state.goalPeriodFilter;
      return topicOk && yearOk && periodOk;

      filtered = [...filtered].sort((a, b) => Number(a.done) - Number(b.done));

      filtered = [...filtered].sort((a, b) => Number(b.done) - Number(a.done));
    } else if (state.goalSort === "oldest") {
      filtered = [...filtered].reverse();
    }

    const totalCnt = filtered.length;
    const doneCnt = filtered.filter(g => g.done).length;
    const pct = totalCnt > 0 ? Math.round((doneCnt / totalCnt) * 100) : 0;

      ? (state.topics[0] ? state.topics[0].name : "")
      : state.goalTopicFilter;

    const defaultAddPeriod = state.goalPeriodFilter === "all" ? "연간" : state.goalPeriodFilter;

            <option value="newest" ${state.goalSort === "newest" ? "selected" : ""}>최신순</option>

          <span>달성률 <strong>${pct}%</strong></span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%;"></div>

            const isAct = state.goalTopicFilter === t.name;
            return `
              <button class="chip-btn ${isAct ? "active" : ""}" onclick="changeGoalTopicFilter(${jsArg(t.name)})">

            <select id="goalTopicSel" aria-label="목표 카테고리">

            <select id="goalYearSel" aria-label="목표 연도">
              ${YEARS.map(y => `<option value="${y}" ${defaultAddYear === String(y) ? "selected" : ""}>${y}년</option>`).join("")}

            <select id="goalPeriodSel" aria-label="목표 기간">

          </div>

      ${filtered.length ? `

            return `
              <article class="media-card ${g.done ? "done" : ""}">
                <div class="media-cover" onclick="openCardCover('goal', '${g.id}')" title="${imgs.length ? "사진 크게 보기" : "탭하여 수정"}">
                  ${imgs.length > 0
                    ? `<img src="${imgs[0]}" alt="${escapeAttr(g.title)}" />${imgs.length > 1 ? `<span class="photo-count-badge">+${imgs.length - 1}장</span>` : ""}`
                    : `<div class="cover-placeholder"><div class="big-pictogram">${renderPictogram(iconKey, 22)}</div><span>${escapeHtml(g.topic)}</span></div>`

                </div>
                <div class="media-body">
                  <div class="media-top">

                  <div class="media-title-row">

                  ${g.done ? `<div class="item-meta">${renderDoneDateControl("goals", g.id, g.doneDate)}</div>` : ""}
                </div>
              </article>
            `;
          }).join("")}
        </div>
      ` : `
        <div class="card">
          <p style="font-size:13px; color:var(--text-sub); margin:0;">해당 조건에 맞는 목표가 없습니다. 상단의 ‘+ 새 목표 추가’ 버튼으로 목표를 등록해 보세요.</p>
        </div>
      `}
    `;

  function addGoal() {
    const topicSel = document.getElementById("goalTopicSel");
    let topic = topicSel && topicSel.value ? topicSel.value : ensureTopicExists("기타", "target");
    if (!topic) topic = "기타";
    const year = normalizeYear(document.getElementById("goalYearSel").value);
    const period = normalizePeriod(document.getElementById("goalPeriodSel").value);
    const titleEl = document.getElementById("goalTitleInp");
    const title = titleEl.value.trim();
    if (!title) {
      titleEl.focus();
      return;
    }
    state.goals.unshift({
      id: uid(),
      topic,
      year,
      period,
      title,
      note: document.getElementById("goalNoteInp").value.trim(),
      images: [...draftGoalImages],
      done: false,
      doneDate: ""
    });
    draftGoalImages = [];
    showGoalComposer = false;
    saveState();
    render();
  }

  let modalGoalImages = [];

    try {

    const g = state.goals.find(x => x.id === id);

    modalGoalImages = [...normalizeImages(g)];
    const curYear = normalizeYear(g.year);
    const curPeriod = normalizePeriod(g.period);
    openModal("목표 수정", `
      <div class="modal-field">
        <label>카테고리</label>
        <select id="mGoalTopic">
          ${state.topics.map(t => `<option value="${escapeAttr(t.name)}" ${g.topic === t.name ? "selected" : ""}>${escapeHtml(t.name)}</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>연도</label>
        <select id="mGoalYear">
          ${YEARS.map(y => `<option value="${y}" ${curYear === String(y) ? "selected" : ""}>${y}년</option>`).join("")}
        </select>
      </div>
      <div class="modal-field">
        <label>기간</label>
        <select id="mGoalPeriod">

        <textarea id="mGoalNote" style="min-height:100px;">${escapeHtml(g.note || "")}</textarea>
      </div>
      <div class="modal-field">

        <input type="file" accept="image/*" multiple onchange="handleModalGoalImages(event)" />
        <div id="mGoalImgBox" class="img-preview-box">
          ${renderThumbList(modalGoalImages, "removeModalGoalImage")}
        </div>
      </div>
    `, () => {
      const topicSel = document.getElementById("mGoalTopic");
      if (topicSel && topicSel.value) g.topic = topicSel.value;
      g.year = normalizeYear(document.getElementById("mGoalYear").value);
      g.period = normalizePeriod(document.getElementById("mGoalPeriod").value);
      g.title = document.getElementById("mGoalTitle").value.trim() || g.title;
      g.note = document.getElementById("mGoalNote").value.trim();
      g.images = [...modalGoalImages];
      delete g.image;
      return true;
    });
