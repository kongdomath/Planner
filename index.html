  function renderArchiveView() {
    return renderArchiveNotebookView();
  }

  // ---------- 아카이브: 주제별 책장 + 스프링 노트북 ----------
  const NB_ICONS = {
    back: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
    edit: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
    plus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    dots: `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
    book: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>`,
    calendar: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    pen: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`
  };

  function getBooks() {
    return Array.isArray(state.books) ? state.books : [];
  }

  function getBookById(id) {
    const key = String(id || "");
    if (!key) return null;
    return getBooks().find(b => b.id === key) || null;
  }

  function bookArchives(bookId) {
    const list = [];
    (state.archives || []).forEach((a, i) => {
      if ((a.bookId || "") === bookId) list.push({ a, i });
    });
    list.sort((x, y) => {
      const d = String(x.a.date || "").localeCompare(String(y.a.date || ""));
      return d !== 0 ? d : x.i - y.i;
    });
    return list.map(x => x.a);
  }

  function clampShelfIndex() {
    const books = getBooks();
    if (!books.length) {
      notebookShelfIndex = 0;
      return;
    }
    if (state.shelfSelectedBookId) {
      const idx = books.findIndex(b => b.id === state.shelfSelectedBookId);
      if (idx >= 0) {
        notebookShelfIndex = idx;
        return;
      }
    }
    if (notebookShelfIndex > books.length - 1) notebookShelfIndex = books.length - 1;
    if (notebookShelfIndex < 0) notebookShelfIndex = 0;
    state.shelfSelectedBookId = books[notebookShelfIndex].id;
  }

  function renderArchiveNotebookView() {
    const book = notebookBookId ? getBookById(notebookBookId) : null;
    if (notebookBookId && !book) notebookBookId = "";
    return book ? renderNotebookReader(book) : renderNotebookShelf();
  }

  function renderShelfCover(book, isActive, offset) {
    const recs = bookArchives(book.id);
    const coverImg = book.cover || "";
    const spine = normalizeSpineColor(book.spine, BOOK_SPINE_PALETTE[0]);
    return `
      <button class="nb-cover-btn ${isActive ? "is-active" : ""}" data-book-id="${escapeAttr(book.id)}" data-offset="${Number(offset) || 0}" onclick="openNotebook('${book.id}')" aria-label="${escapeAttr(book.title)} 펼치기" title="${escapeAttr(book.title)} 펼치기">
        <span class="nb-cover" style="--spine:${spine}">
          ${coverImg
            ? `<img class="nb-cover-photo" src="${coverImg}" alt="" /><span class="nb-cover-plate">${escapeHtml(book.title)}</span>`
            : `<span class="nb-cover-label"><b>${escapeHtml(book.title)}</b>${(() => {
                const sub = book.subject && book.subject !== book.title ? book.subject
                  : (book.category && book.category !== book.title ? book.category : "");
                return sub ? `<span>${escapeHtml(sub)}</span>` : "";
              })()}</span>`}
          <span class="nb-cover-spine"></span>
          <span class="nb-cover-shine"></span>
          <span class="nb-cover-chip">${recs.length}p</span>
        </span>
      </button>
    `;
  }

  function renderShelfMeta(book) {
    const recs = bookArchives(book.id);
    const latest = recs.length ? recs[recs.length - 1] : null;
    const bits = [`${recs.length}페이지`];
    if (book.category && book.category !== book.title) bits.push(book.category);
    else if (book.subject && book.subject !== book.title) bits.push(book.subject);
    if (latest && latest.date) bits.push(`최근 ${latest.date}`);
    return `
      <div class="nb-book-meta">
        <h3>${escapeHtml(book.title)}</h3>
        <div class="nb-book-info">${bits.map(escapeHtml).join(" · ")}</div>
      </div>
    `;
  }

  function renderShelfActions(book) {
    return `
      <button class="nb-action primary" onclick="openNotebook('${book.id}')"><span class="nb-action-icon">${NB_ICONS.book}</span>이 책 펼치기</button>
      <button class="nb-action" onclick="openBookModal()"><span class="nb-action-icon">${NB_ICONS.plus}</span>책 추가</button>
      <button class="nb-action" onclick="openBookModal('${book.id}')"><span class="nb-action-icon">${NB_ICONS.edit}</span>편집</button>
    `;
  }

  function renderNotebookShelf() {
    const books = getBooks();
    const bar = "";
    if (!books.length) {
      return `
        <div class="nb-stage nb-stage--shelf">
          <div class="nb-shelf-empty">
            <h3>아직 책장이 비어 있습니다</h3>
            <p>주제별로 책을 만들고 기록을 페이지처럼 모아 보세요.<br />독서 기록, 여행 노트, 공부 노트 무엇이든 좋습니다.</p>
            <button class="btn btn-primary" onclick="openBookModal()">+ 첫 책 만들기</button>
          </div>
        </div>
      `;
    }
    clampShelfIndex();
    const active = books[notebookShelfIndex];
    return `
      <div class="nb-stage nb-stage--shelf">
        <div id="nbShelfMeta">${renderShelfMeta(active)}</div>
        <div class="nb-shelf">
          <div class="nb-shelf-track" id="nbShelfTrack">${shelfSlots(books.length, notebookShelfIndex, shelfRadius()).map(slot => slot ? renderShelfCover(books[slot.index], slot.offset === 0, slot.offset) : `<span class="nb-slot-empty" aria-hidden="true"></span>`).join("")}</div>
          <div class="nb-shelf-rail"></div>
        </div>
        <div class="nb-actions" id="nbShelfActions">${renderShelfActions(active)}</div>
      </div>
    `;
  }

  function selectShelfBook(id) {
    const books = getBooks();
    const idx = books.findIndex(b => b.id === id);
    if (idx < 0) return;
    notebookShelfIndex = idx;
    state.shelfSelectedBookId = id;
    saveState();
    render();
  }

  function shelfStep(delta) {
    const books = getBooks();
    if (!books.length) return;
    clampShelfIndex();
    const next = (notebookShelfIndex + delta + books.length) % books.length;
    selectShelfBook(books[next].id);
  }

  function openNotebook(id) {
    const book = getBookById(id);
    if (!book) return;
    const idx = getBooks().findIndex(b => b.id === id);
    if (idx >= 0) notebookShelfIndex = idx;
    state.shelfSelectedBookId = id;
    notebookBookId = id;
    notebookPageIndex = 0;
    notebookMobileSide = "left";
    saveState();
    render();
  }

  function closeNotebookBook() {
    notebookBookId = "";
    notebookPageIndex = 0;
    notebookMobileSide = "left";
    render();
  }

  function notebookTotalPages(book) {
    return bookArchives(book.id).length + 1;
  }

  function notebookStep(delta) {
    const book = getBookById(notebookBookId);
    if (!book) return;
    const total = notebookTotalPages(book);
    notebookPageIndex = Math.min(total - 1, Math.max(0, notebookPageIndex + delta));
    notebookMobileSide = "left";
    render();
  }

  function setNotebookSide(side) {
    notebookMobileSide = side === "right" ? "right" : "left";
    const spread = document.getElementById("nbSpread");
    if (spread) spread.dataset.side = notebookMobileSide;
    document.querySelectorAll(".nb-side-toggle button[data-side]").forEach(b => {
      b.classList.toggle("active", b.dataset.side === notebookMobileSide);
    });
  }

  function openNotebookPhoto(id, index) {
    const a = (state.archives || []).find(x => x.id === id);
    if (!a) return;
    openLightbox(normalizeImages(a), Number(index) || 0, a.title || "");
  }

  function renderNotebookLeftPage(a, book) {
    const imgs = normalizeImages(a);
    const iconKey = getArchiveCatIconKey(a.category);
    const parts = String(a.date || "").split("-");
    const y = parts[0] || "";
    const m = parts[1] || "";
    const d = parts[2] || "";
    const dowNames = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = /^\d{4}-\d{2}-\d{2}$/.test(String(a.date || "")) ? dowNames[getDayOfWeek(a.date)] : "";

    const visual = imgs.length
      ? `
        <div class="nb-photo-frame">
          <span class="nb-photo-tape"></span>
          <img src="${imgs[0]}" alt="${escapeAttr(a.title)}" />
          <button class="nb-photo-zoom" onclick="event.stopPropagation(); openNotebookPhoto('${a.id}', 0)" title="사진 크게 보기" aria-label="사진 크게 보기">${ICONS.search}</button>
          ${imgs.length > 1 ? `<span class="nb-photo-count">사진 ${imgs.length}장 · 아래에서 골라 보기</span>` : ""}
        </div>
        ${imgs.length > 1 ? `
          <div class="nb-thumbs">
            ${imgs.map((src, i) => `<button class="nb-thumb" onclick="openNotebookPhoto('${a.id}', ${i})" aria-label="사진 ${i + 1} 크게 보기"><img src="${src}" alt="" /></button>`).join("")}
          </div>
        ` : ""}
      `
      : `
        <div class="nb-visual">
          <span class="nb-visual-icon">${renderPictogram(iconKey, 24)}</span>
          <div class="nb-visual-date">${Number(m) || ""}월 ${Number(d) || ""}일</div>
          <div class="nb-visual-sub">${y}${dow ? ` · ${dow}요일` : ""}</div>
          <span class="nb-visual-rule"></span>
          <div class="nb-visual-cat">${escapeHtml(a.category || (book && book.title) || "기록")}</div>
        </div>
      `;

    return `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner">
          ${visual}
          <div class="nb-stamps">
            <span class="nb-stamp"><b>${String(a.date || "").replace(/-/g, ".")}</b><span>${dow || "DATE"}</span></span>
            ${a.subtitle ? `<span class="nb-badge nb-badge--ghost">${escapeHtml(a.subtitle)}</span>` : ""}
          </div>
        </div>
      </section>
    `;
  }

  function renderNotebookRightPage(a) {
    return `
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner">
          <div class="nb-note">
            <h2 class="nb-note-title">${escapeHtml(a.title)}</h2>
            ${a.subtitle ? `<div class="nb-note-sub">${escapeHtml(a.subtitle)}</div>` : ""}
            <div class="nb-note-rule"></div>
            <div class="nb-note-body">${a.note ? escapeHtml(a.note) : `<span class="nb-note-empty">아직 글이 없습니다. 아래 ‘이 페이지 수정’으로 감상을 남겨 보세요.</span>`}</div>
          </div>
        </div>
        <span class="nb-page-no">${escapeHtml(a.category || "")}</span>
      </section>
    `;
  }

  function renderNotebookGuidePages(book, recs) {
    const last = recs.length ? recs[recs.length - 1] : null;
    const firstLabel = recs.length ? "눌러서 새 기록 남기기" : "눌러서 첫 기록 남기기";
    return `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner nb-guide" onclick="openNewArchiveModal('${book.id}')" style="cursor:pointer;">
          <button class="nb-guide-plus" onclick="event.stopPropagation(); openNewArchiveModal('${book.id}')" aria-label="${firstLabel}">${NB_ICONS.plus}</button>
          <div class="nb-guide-title">${firstLabel}</div>
          <p class="nb-guide-sub">${recs.length ? "이 책의 마지막 페이지입니다. 오늘의 기록으로 책을 이어가 보세요." : "아직 페이지가 없습니다. 첫 기록을 남겨 이 책을 시작해 보세요."}</p>
        </div>
      </section>
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner nb-guide-summary">
          <div class="nb-summary-title">${escapeHtml(book.title)}</div>
          <ul class="nb-summary-list">
            <li><span>기록</span><b>${recs.length}개</b></li>
            <li><span>최근 기록</span><b>${last ? escapeHtml(last.date || "") : "—"}</b></li>
            <li><span>연결</span><b>${escapeHtml(book.category || book.subject || "자유 주제")}</b></li>
          </ul>
          <button class="btn btn-primary" onclick="openNewArchiveModal('${book.id}')">+ 새 기록 추가</button>
        </div>
        <span class="nb-page-no">${recs.length + 1}</span>
      </section>
    `;
  }

  function renderNotebookReader(book) {
    const recs = bookArchives(book.id);
    const total = recs.length + 1;
    if (notebookFocusId) {
      const fi = recs.findIndex(a => a.id === notebookFocusId);
      if (fi >= 0) notebookPageIndex = fi;
      notebookFocusId = "";
    }
    notebookPageIndex = Math.min(total - 1, Math.max(0, notebookPageIndex));
    const idx = notebookPageIndex;
    const onGuide = idx >= recs.length;
    const current = onGuide ? null : recs[idx];
    const subBits = [];
    if (book.category && book.category !== book.title) subBits.push(book.category);
    else if (book.subject && book.subject !== book.title) subBits.push(book.subject);
    subBits.push(`${recs.length}페이지`);

    const spreadBody = onGuide
      ? renderNotebookGuidePages(book, recs)
      : `${renderNotebookLeftPage(current, book)}${renderNotebookRightPage(current)}`;

    return `
      <div class="nb-stage">
        <div class="nb-reader-head">
          <button class="nb-back" onclick="closeNotebookBook()">${ICONS.chevLeft}책장</button>
          <div class="nb-reader-title">
            <b>${escapeHtml(book.title)}</b>
            <span>${subBits.map(escapeHtml).join(" · ")}</span>
          </div>
          <span class="nb-stage-count">${onGuide ? "마지막 페이지" : `${idx + 1} / ${recs.length}`}</span>
        </div>
        <div class="nb-book">
          <button class="nb-nav prev" onclick="notebookStep(-1)" ${idx <= 0 ? "disabled" : ""} aria-label="이전 페이지">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="nbSpread" data-side="${notebookMobileSide}">
            <span class="nb-edge nb-edge--left"></span>
            <span class="nb-edge nb-edge--right"></span>
            ${spreadBody}
            <span class="nb-spine"></span>
            <span class="nb-rings"></span>
          </div>
          <button class="nb-nav next" onclick="notebookStep(1)" ${idx >= total - 1 ? "disabled" : ""} aria-label="다음 페이지">${ICONS.chevRight}</button>
        </div>
        <div class="nb-side-toggle">
          <button data-side="left" class="${notebookMobileSide === "left" ? "active" : ""}" onclick="setNotebookSide('left')">사진 페이지</button>
          <button data-side="right" class="${notebookMobileSide === "right" ? "active" : ""}" onclick="setNotebookSide('right')">노트 페이지</button>
        </div>
        <div class="nb-actions">
          ${onGuide ? "" : `<button class="nb-action" onclick="openEditArchive('${current.id}')"><span class="nb-action-icon">${NB_ICONS.edit}</span>이 페이지 수정</button>`}
          <button class="nb-action primary" onclick="openNewArchiveModal('${book.id}')"><span class="nb-action-icon">${NB_ICONS.plus}</span>새 기록 추가</button>
          <button class="nb-action" onclick="openBookModal('${book.id}')"><span class="nb-action-icon">${NB_ICONS.dots}</span>책 설정</button>
        </div>
      </div>
    `;
  }

  function bindNotebookGestures() {
    document.querySelectorAll(".nb-action").forEach(b => {
      if (b.getAttribute("aria-label")) return;
      const label = (b.textContent || "").replace(/\s+/g, " ").trim();
      if (label) b.setAttribute("aria-label", label);
    });
    const spreads = [document.getElementById("nbSpread"), document.getElementById("nbYearSpread")].filter(Boolean);
    spreads.forEach(spread => {
      const isYear = spread.id === "nbYearSpread";
      if (spread.dataset.gestureBound === "1") return;
      spread.dataset.gestureBound = "1";
      let sx = 0;
      let sy = 0;
      spread.addEventListener("touchstart", e => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        sx = t.clientX;
        sy = t.clientY;
      }, { passive: true });
      spread.addEventListener("touchend", e => {
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;
        if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          spread.dataset.swipedAt = String(Date.now());
          if (isYear) yearPageStep(dx < 0 ? 1 : -1);
          else notebookStep(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
      // 모바일 1면 보기: 페이지를 탭하면 사진 면 ↔ 노트 면 뒤집기
      spread.addEventListener("click", e => {
        if (isYear || !isMobileViewport()) return;
        const last = Number(spread.dataset.swipedAt || 0);
        if (last && Date.now() - last < 420) return;
        if (e.target.closest("button, a, input, textarea, select, label, .nb-thumb, .nb-guide, .nb-photo-zoom, .nb-nav, .nb-side-toggle")) return;
        flipNotebookPage(spread.dataset.side === "right" ? "left" : "right", spread);
      });
    });

    // 책장: 좌우로 밀어 책 넘기기
    const shelfs = [
      { el: document.getElementById("nbYearShelfTrack"), step: yearShelfStep },
      { el: document.getElementById("nbShelfTrack"), step: shelfStep }
    ];
    shelfs.forEach(({ el, step }) => {
      if (!el || el.dataset.swipeBound === "1") return;
      el.dataset.swipeBound = "1";
      let sx = 0;
      let sy = 0;
      el.addEventListener("touchstart", e => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        sx = t.clientX;
        sy = t.clientY;
      }, { passive: true });
      el.addEventListener("touchend", e => {
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.25) step(dx < 0 ? 1 : -1);
      }, { passive: true });

      // 데스크톱: 마우스로 끌어 책 넘기기 (끌지 않고 누르면 일반 클릭 유지)
      let down = false;
      let startX = 0;
      let moved = 0;
      const endDrag = e => {
        if (!down) return;
        down = false;
        window.removeEventListener("pointerup", endDrag);
        window.removeEventListener("pointercancel", endDrag);
        const dx = (e && typeof e.clientX === "number" ? e.clientX : startX) - startX;
        if (moved > 40 && Math.abs(dx) > 20) {
          el.dataset.draggedAt = String(Date.now());
          step(dx < 0 ? 1 : -1);
        }
      };
      el.addEventListener("pointerdown", e => {
        if (e.pointerType !== "mouse" || e.button !== 0) return;
        down = true;
        moved = 0;
        startX = e.clientX;
        window.addEventListener("pointerup", endDrag);
        window.addEventListener("pointercancel", endDrag);
      });
      el.addEventListener("pointermove", e => {
        if (!down) return;
        moved = Math.max(moved, Math.abs(e.clientX - startX));
      });
      el.addEventListener("click", e => {
        const at = Number(el.dataset.draggedAt || 0);
        if (at && Date.now() - at < 320) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    });
  }

  // 모바일 노트 뒤집기 (사진 면 ↔ 노트 면) + 부드러운 전환
  function flipNotebookPage(side, spreadEl) {
    const spread = spreadEl || document.getElementById("nbSpread");
    if (!spread) return;
    const next = side === "right" ? "right" : "left";
    if (spread.dataset.side === next) return;
    spread.classList.remove("flip-left", "flip-right");
    void spread.offsetWidth;
    spread.classList.add(next === "right" ? "flip-left" : "flip-right");
    setNotebookSide(next);
    clearTimeout(spread._flipTimer);
    spread._flipTimer = setTimeout(() => spread.classList.remove("flip-left", "flip-right"), 320);
  }

  // ---------- 책 만들기 / 편집 ----------
  function spineSwatchHtml(selected) {
    return BOOK_SPINE_PALETTE.map(c => `
      <button type="button" class="spine-swatch ${c === selected ? "selected" : ""}" style="background:${c}" data-color="${c}" onclick="pickBookSpine('${c}')" aria-label="책등 색 ${c}"></button>
    `).join("");
  }

  function coverPreviewHtml(cover, spine, title) {
    const color = normalizeSpineColor(spine, BOOK_SPINE_PALETTE[0]);
    return `
      <span class="nb-cover" style="--spine:${color}">
        ${cover
          ? `<img class="nb-cover-photo" src="${cover}" alt="" />`
          : `<span class="nb-cover-label"><b>${escapeHtml(title || "새 책")}</b><span>표지</span></span>`}
        <span class="nb-cover-spine"></span>
        <span class="nb-cover-shine"></span>
      </span>
    `;
  }

  function refreshBookCoverPreview() {
    const box = document.getElementById("mBookCoverPrev");
    if (!box) return;
    const spineEl = document.getElementById("mBookSpine");
    const titleEl = document.getElementById("mBookTitle");
    box.innerHTML = coverPreviewHtml(draftBookCover, spineEl ? spineEl.value : draftBookSpine, titleEl ? titleEl.value : "새 책");
  }

  function pickBookSpine(color) {
    draftBookSpine = normalizeSpineColor(color, BOOK_SPINE_PALETTE[0]);
    const inp = document.getElementById("mBookSpine");
    if (inp) inp.value = draftBookSpine;
    document.querySelectorAll("#mBookSpineWrap .spine-swatch").forEach(b => {
      b.classList.toggle("selected", b.dataset.color === draftBookSpine);
    });
    refreshBookCoverPreview();
  }

  async function handleBookCoverPick(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      draftBookCover = await compressImageFile(file, 900, 0.8);
      refreshBookCoverPreview();
    } catch (_) {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
    event.target.value = "";
  }

  function clearBookCover() {
    draftBookCover = "";
    refreshBookCoverPreview();
  }

  function defaultBookIdForCat(cat) {
    const found = getBooks().find(b => b.category && b.category === cat);
    return found ? found.id : "";
  }

  function bookOptionsHtml(selectedId) {
    const sel = String(selectedId || "");
    const books = getBooks();
    if (!books.length) return `<option value="">책을 먼저 만들어 주세요</option>`;
    return books.map(b => `<option value="${escapeAttr(b.id)}" ${b.id === sel ? "selected" : ""}>${escapeHtml(b.title)}</option>`).join("");
  }

  function syncBookSelect(selectId, catName) {
    const sel = document.getElementById(selectId);
    if (!sel) return;
    const book = getBooks().find(b => b.category && b.category === catName);
    if (book) sel.value = book.id;
  }

  function ensureInboxBook() {
    let inbox = getBookById("book_inbox");
    if (!inbox) {
      inbox = { id: "book_inbox", title: "미분류 기록", category: "", subject: "", spine: "#5b6478", cover: "", auto: true, createdAt: TODAY_STR };
      state.books.push(inbox);
    }
    return inbox;
  }

  function resolveArchiveBookId(explicitId, category) {
    if (explicitId && getBookById(explicitId)) return explicitId;
    const byCat = getBooks().find(b => b.category && b.category === category);
    if (byCat) return byCat.id;
    return ensureInboxBook().id;
  }

  function openBookModal(id) {
    const book = id ? getBookById(id) : null;
    if (id && !book) return;
    draftBookCover = book ? (book.cover || "") : "";
    draftBookSpine = book ? normalizeSpineColor(book.spine, BOOK_SPINE_PALETTE[0])
      : BOOK_SPINE_PALETTE[getBooks().length % BOOK_SPINE_PALETTE.length];
    const catOptions = (state.archiveCategories || []).map(c => `
      <option value="${escapeAttr(c.name)}" ${book && book.category === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>
    `).join("");
    openModal(book ? "책 설정" : "새 책 만들기", `
      <div class="modal-field">
        <label>책 제목</label>
        <input type="text" id="mBookTitle" value="${escapeAttr(book ? book.title : "")}" placeholder="예) 독서 기록, 2026 교토 여행" oninput="refreshBookCoverPreview()" />
      </div>
      <div class="modal-field">
        <label>연결 카테고리 (선택)</label>
        <select id="mBookCat">
          <option value="">자유 주제 (카테고리 연결 없음)</option>
          ${catOptions}
        </select>
        <p class="settings-hint" style="margin:0;">연결하면 같은 분류의 아카이브 기록이 이 책으로 모입니다.</p>
      </div>
      <div class="modal-field">
        <label>자유 주제 문구 (선택)</label>
        <input type="text" id="mBookSubject" value="${escapeAttr(book ? (book.subject || "") : "")}" placeholder="예) 2024 Kyoto" />
      </div>
      <div class="modal-field" id="mBookSpineWrap">
        <label>책등 컬러</label>
        <div class="spine-swatches">${spineSwatchHtml(draftBookSpine)}</div>
        <input type="hidden" id="mBookSpine" value="${escapeAttr(draftBookSpine)}" />
      </div>
      <div class="modal-field">
        <label>표지 이미지 (선택)</label>
        <div class="book-cover-preview" id="mBookCoverPrev">${coverPreviewHtml(draftBookCover, draftBookSpine, book ? book.title : "새 책")}</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
          <label class="btn btn-sm" style="cursor:pointer;">표지 사진 올리기<input type="file" accept="image/*" style="display:none" onchange="handleBookCoverPick(event)" /></label>
          <button class="btn btn-sm" onclick="clearBookCover()">표지 자동으로</button>
        </div>
        <p class="settings-hint" style="margin:0;">올리지 않으면 최근 기록 사진, 그것도 없으면 책등 컬러 표지가 쓰입니다.</p>
      </div>
      ${book ? `<div class="modal-danger-row"><button class="btn btn-sm btn-danger-outline" onclick="deleteBook('${book.id}')">이 책 삭제</button></div>` : ""}
    `, () => {
      const titleEl = document.getElementById("mBookTitle");
      const title = (titleEl && titleEl.value ? titleEl.value : "").trim();
      if (!title) {
        alert("책 제목을 입력해 주세요.");
        if (titleEl) titleEl.focus();
        return false;
      }
      const category = document.getElementById("mBookCat").value;
      const subject = (document.getElementById("mBookSubject").value || "").trim();
      const spine = normalizeSpineColor(document.getElementById("mBookSpine").value, BOOK_SPINE_PALETTE[0]);
      if (book) {
        book.title = title;
        book.category = category;
        book.subject = subject;
        book.spine = spine;
        book.cover = draftBookCover;
      } else {
        const newBook = { id: "bk_" + uid().slice(3), title, category, subject, spine, cover: draftBookCover, createdAt: TODAY_STR };
        state.books.push(newBook);
        if (category) {
          state.archives.forEach(a => {
            if (a.category !== category) return;
            const cur = getBookById(a.bookId);
            if (!a.bookId || !cur || cur.id === "book_inbox") a.bookId = newBook.id;
          });
        }
        state.shelfSelectedBookId = newBook.id;
        notebookShelfIndex = state.books.length - 1;
      }
      return true;
    });
  }

  function deleteBook(id) {
    const book = getBookById(id);
    if (!book) return;
    const n = state.archives.filter(a => a.bookId === id).length;
    const msg = n
      ? `‘${book.title}’ 책을 삭제할까요?\n\n이 책의 기록 ${n}개는 지워지지 않고 ‘미분류 기록’ 책으로 옮겨집니다.`
      : `‘${book.title}’ 책을 삭제할까요?`;
    if (!confirm(msg)) return;
    state.books = state.books.filter(b => b.id !== id);
    state.archives.forEach(a => { if (a.bookId === id) a.bookId = ""; });
    applyBookModel(state);
    if (notebookBookId === id) {
      notebookBookId = "";
      notebookPageIndex = 0;
    }
    if (state.shelfSelectedBookId === id) {
      state.shelfSelectedBookId = state.books[0] ? state.books[0].id : "";
      notebookShelfIndex = 0;
    }
    closeModal();
    saveState();
    render();
  }

  // ---------- 새 아카이브 기록 (노트북에서 바로 쓰기) ----------
  // ---------- 연도 책 추가 / 편집 ----------
  let draftYearSpine = "";
  let draftYearCover = "";

  function yearCoverPreviewHtml(year, spine, cover) {
    const color = normalizeSpineColor(spine, BOOK_SPINE_PALETTE[0]);
    return `
      <span class="nb-cover nb-cover--year" style="--spine:${color}">
        ${cover
          ? `<img class="nb-cover-photo" src="${cover}" alt="" /><span class="nb-cover-plate">${year}</span>`
          : `<span class="nb-year-plate"><b>${year}</b><i></i><span>MONTHLY NOTES</span></span>`}
        <span class="nb-cover-spine"></span>
        <span class="nb-cover-shine"></span>
      </span>
    `;
  }

  function refreshYearCoverPreview() {
    const box = document.getElementById("mYearCoverPrev");
    if (!box) return;
    const numEl = document.getElementById("mYearNum");
    const year = Number(numEl && numEl.value) || Number(TODAY_STR.slice(0, 4)) + 1;
    box.innerHTML = yearCoverPreviewHtml(year, draftYearSpine, draftYearCover);
  }

  function pickYearSpine(color) {
    draftYearSpine = normalizeSpineColor(color, BOOK_SPINE_PALETTE[0]);
    document.querySelectorAll("#mYearSpineWrap .spine-swatch").forEach(b => {
      b.classList.toggle("selected", b.dataset.color === draftYearSpine);
    });
    refreshYearCoverPreview();
  }

  async function handleYearCoverFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      draftYearCover = await compressImageFile(file, 900, 0.8);
      refreshYearCoverPreview();
    } catch (_) {
      alert("이미지를 불러오는 중 오류가 발생했습니다.");
    }
    event.target.value = "";
  }

  function clearYearCover() {
    draftYearCover = "";
    refreshYearCoverPreview();
  }

  function setYearBook(year, patch) {
    const y = Number(year);
    if (!y) return;
    const list = getYearBooks();
    const found = list.find(b => b.year === y);
    if (found) {
      Object.assign(found, patch);
    } else {
      list.push({
        year: y,
        spine: patch.spine || BOOK_SPINE_PALETTE[list.length % BOOK_SPINE_PALETTE.length],
        cover: patch.cover || ""
      });
      list.sort((a, b) => a.year - b.year);
    }
    refreshHolidays();
    saveState();
  }

  function openYearBookModal(editYear) {
    const editing = Number(editYear) || 0;
    const entry = editing ? getYearBook(editing) : null;
    if (editing && !entry) return;
    const list = getYearBooks();
    draftYearSpine = entry ? entry.spine : BOOK_SPINE_PALETTE[list.length % BOOK_SPINE_PALETTE.length];
    draftYearCover = entry ? entry.cover : "";
    const nextYear = list.reduce((m, b) => Math.max(m, b.year), Number(TODAY_STR.slice(0, 4))) + 1;
    const shownYear = editing || nextYear;
    openModal(editing ? `${editing}년 책 편집` : "연도 책 추가", `
      <div class="modal-field">
        <label>연도</label>
        <input type="number" id="mYearNum" min="1900" max="2100" value="${shownYear}" ${editing ? "disabled" : ""} oninput="refreshYearCoverPreview()" />
      </div>
      <div class="modal-field">
        <label>책등 색</label>
        <div class="spine-swatches" id="mYearSpineWrap">${spineSwatchHtml(draftYearSpine).replace(/pickBookSpine/g, "pickYearSpine")}</div>
      </div>
      <div class="modal-field">
        <label>표지 사진 (선택)</label>
        <input type="file" accept="image/*" onchange="handleYearCoverFile(event)" />
        <div class="book-cover-preview" style="margin-top:10px;">
          <span id="mYearCoverPrev">${yearCoverPreviewHtml(shownYear, draftYearSpine, draftYearCover)}</span>
        </div>
        <div class="settings-actions" style="margin-top:10px;">
          <button class="btn btn-sm" onclick="clearYearCover()">표지 사진 빼기</button>
        </div>
      </div>
      ${editing ? `<div class="modal-danger-row"><button class="btn btn-danger-outline" onclick="deleteYearBook(${editing})">연도 책 삭제</button></div>` : ""}
    `, () => {
      const numEl = document.getElementById("mYearNum");
      const year = editing || Number(numEl && numEl.value);
      if (!year || year < 1900 || year > 2100) {
        alert("연도를 확인해 주세요. (1900 ~ 2100)");
        return false;
      }
      if (!editing && getYearBook(year)) {
        alert("이미 있는 연도입니다.");
        return false;
      }
      setYearBook(year, { spine: draftYearSpine, cover: draftYearCover });
      yearShelfIndex = Math.max(0, getYearBooks().findIndex(b => b.year === year));
      return true;
    });
  }

  function deleteYearBook(year) {
    const y = Number(year);
    const entry = getYearBook(y);
    if (!entry) return;
    if (!confirm(`${y}년 책을 책장에서 지울까요?\n기록 자체는 남아 있고, 필요하면 다시 추가할 수 있습니다.`)) return;

    closeModal();
    saveState();
    render();
  }

  function openCardCover(kind, id) {
    const list = kind === "goal" ? state.goals : state.archives;
    const item = list.find(x => x.id === id);
    if (!item) return;
    const images = normalizeImages(item);
    if (images.length) {
      openLightbox(images, 0, item.title || "");
    } else if (kind === "goal") {
      openEditGoal(id);
    } else {
      openEditArchive(id);
    }
  }

  function openLightbox(images, index = 0, caption = "") {
    if (!Array.isArray(images) || images.length === 0) return;
    lightboxImages = [...images];
    lightboxIndex = Math.max(0, Math.min(index, images.length - 1));
    lightboxCaption = caption || "";
    updateLightbox();
    document.getElementById("lightbox").classList.add("open");
  }

  function updateLightbox() {
    const img = document.getElementById("lightboxImg");
    if (!img) return;
    img.src = lightboxImages[lightboxIndex] || "";
    img.alt = lightboxCaption || "사진";
    const caption = document.getElementById("lightboxCaption");
    if (caption) {
      caption.textContent = `${lightboxCaption}${lightboxImages.length > 1 ? ` (${lightboxIndex + 1}/${lightboxImages.length})` : ""}`;
    }
    const multi = lightboxImages.length > 1;
    document.querySelectorAll(".lightbox-nav").forEach(el => {
      el.style.display = multi ? "flex" : "none";
    });
  }

  function lightboxStep(delta) {
    if (!lightboxImages.length) return;
    lightboxIndex = (lightboxIndex + delta + lightboxImages.length) % lightboxImages.length;
    updateLightbox();
  }

  function closeLightbox() {
    document.getElementById("lightbox").classList.remove("open");
    const img = document.getElementById("lightboxImg");
    if (img) img.src = "";
    lightboxImages = [];
  }

  // ---------- 계정 · 동기화 (Firebase 준비) ----------
  // 아래 FIREBASE_CONFIG에 도현 님 Firebase 웹 앱 설정을 채우면 이메일/Google 로그인과
  // Firestore 동기화가 켜집니다. 비어 있으면 앱은 그대로 로컬 모드로 동작합니다.
  const FIREBASE_CONFIG = null;
  const FIREBASE_SDK_VERSION = "10.12.2";
  let authUser = null;
  let authBusy = false;
  let firebaseCtx = null;
  let cloudTimer = null;

  function isFirebaseConfigured() {
    return Boolean(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
  }

  async function getFirebase() {
    if (!isFirebaseConfigured()) return null;
    if (firebaseCtx) return firebaseCtx;
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
    const [appMod, authMod, dbMod] = await Promise.all([
      import(`${base}firebase-app.js`),
      import(`${base}firebase-auth.js`),
      import(`${base}firebase-firestore.js`)
    ]);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    const db = dbMod.getFirestore(app);
    firebaseCtx = { app, auth, db, authMod, dbMod };
    authMod.onAuthStateChanged(auth, user => {
      authUser = user ? { uid: user.uid, email: user.email || "", name: user.displayName || "" } : null;
      const screen = document.getElementById("authScreen");
      if (authUser && screen && screen.classList.contains("open")) closeAuthScreen();
      if (authUser) adoptCloudState();
      refreshSettingsIfOpen();
    });
    return firebaseCtx;
  }

  function renderAuthScreen() {
    const el = document.getElementById("authScreen");
    if (!el) return;
    const configured = isFirebaseConfigured();
    el.innerHTML = `
      <div class="auth-card" role="document">
        <div class="auth-mark">${ICONS.archive}아카이브 &amp; 플래너</div>
        <h2>기록을 이어서</h2>
        <p class="auth-sub">로그인하면 기기를 바꿔도 기록을 그대로 이어갈 수 있습니다.</p>
        <div class="auth-field">
          <label for="authEmail">이메일</label>
          <input id="authEmail" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" />
        </div>
        <div class="auth-field">
          <label for="authPassword">비밀번호</label>
          <input id="authPassword" type="password" autocomplete="current-password" placeholder="6자 이상" onkeydown="if (event.key === 'Enter') submitEmailLogin()" />
        </div>
        <div class="auth-error" id="authError"></div>
        <button class="auth-primary" onclick="submitEmailLogin()">로그인</button>
        <div class="auth-or"><span>또는</span></div>
        <button class="auth-google" onclick="submitGoogleLogin()"><span class="auth-g">G</span>Google로 계속하기</button>
        <button class="auth-local" onclick="closeAuthScreen()">로그인 없이 로컬 모드로 시작하기</button>
        <p class="auth-note">${configured ? "Firebase 계정과 자동으로 동기화됩니다." : "Firebase 미연결 · 기록은 이 브라우저에만 저장됩니다."}</p>
      </div>
    `;
  }

  function openAuthScreen() {
    renderAuthScreen();
    const el = document.getElementById("authScreen");
    if (!el) return;
    el.classList.add("open");
    el.setAttribute("aria-hidden", "false");
    setTimeout(() => {
      const email = document.getElementById("authEmail");
      if (email) { try { email.focus(); } catch (_) {} }
    }, 80);
  }

  function closeAuthScreen() {
    const el = document.getElementById("authScreen");
    if (!el) return;
    el.classList.remove("open");
    el.setAttribute("aria-hidden", "true");
  }

  function setAuthError(msg) {
    const el = document.getElementById("authError");
    if (el) el.textContent = msg || "";
  }

  function authErrorText(err) {
    const code = String((err && err.code) || "");
    if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) return "이메일 또는 비밀번호가 맞지 않습니다.";
    if (code.includes("too-many-requests")) return "시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.";
    if (code.includes("popup-closed-by-user") || code.includes("cancelled-popup")) return "로그인 창이 닫혔습니다.";
    if (code.includes("network-request-failed")) return "네트워크 연결을 확인해 주세요.";
    if (code.includes("operation-not-allowed")) return "이 로그인 방식이 Firebase 콘솔에서 아직 켜져 있지 않습니다.";
    return "로그인하지 못했습니다. 잠시 후 다시 시도해 주세요.";
  }

  async function submitEmailLogin() {
    if (authBusy) return;
    if (!isFirebaseConfigured()) {
      setAuthError("Firebase 설정이 아직 연결되지 않았습니다. 아래 ‘로컬 모드’로 앱을 그대로 사용할 수 있어요.");
      return;
    }
    const emailEl = document.getElementById("authEmail");
    const pwEl = document.getElementById("authPassword");
    const email = (emailEl && emailEl.value || "").trim();
    const password = (pwEl && pwEl.value) || "";
    if (!/.+@.+\..+/.test(email)) { setAuthError("이메일 주소를 확인해 주세요."); return; }
    if (password.length < 6) { setAuthError("비밀번호는 6자 이상이어야 합니다."); return; }
    authBusy = true;
    setAuthError("");
    try {
      const fb = await getFirebase();
      await fb.authMod.signInWithEmailAndPassword(fb.auth, email, password);
      closeAuthScreen();
    } catch (err) {
      setAuthError(authErrorText(err));
    } finally {
      authBusy = false;
    }
  }

  async function submitGoogleLogin() {
    if (authBusy) return;
    if (!isFirebaseConfigured()) {
      setAuthError("Firebase 설정이 아직 연결되지 않았습니다. 아래 ‘로컬 모드’로 앱을 그대로 사용할 수 있어요.");
      return;
    }
    authBusy = true;
    setAuthError("");
    try {
      const fb = await getFirebase();
      const provider = new fb.authMod.GoogleAuthProvider();
      await fb.authMod.signInWithPopup(fb.auth, provider);
      closeAuthScreen();
    } catch (err) {
      setAuthError(authErrorText(err));
    } finally {
      authBusy = false;
    }
  }

  async function signOutOfAccount() {
    try {
      if (firebaseCtx) await firebaseCtx.authMod.signOut(firebaseCtx.auth);
    } catch (_) {}
    authUser = null;
    refreshSettingsIfOpen();
    openAuthScreen();
  }

  // 로그인 상태에서만 조용히 Firestore로 기록을 올립니다 (설정 전에는 아무 동작도 하지 않음)
  function scheduleCloudPush() {
    if (!isFirebaseConfigured() || !authUser || !firebaseCtx) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(async () => {
      try {
        const { db, dbMod } = firebaseCtx;
        await dbMod.setDoc(dbMod.doc(db, "users", authUser.uid, "planner", "state"), { state, updatedAt: Date.now() });
      } catch (_) {}
    }, 1200);
  }

  async function pullCloudState() {
    if (!isFirebaseConfigured() || !authUser || !firebaseCtx) return null;
    try {
      const { db, dbMod } = firebaseCtx;
      const snap = await dbMod.getDoc(dbMod.doc(db, "users", authUser.uid, "planner", "state"));
      return snap.exists() ? snap.data().state : null;
    } catch (_) {
      return null;
    }
  }

  async function adoptCloudState() {
    const cloud = await pullCloudState();
    if (!cloud) { scheduleCloudPush(); return; }
    if (isUntouchedNewDefault(state)) {
      state = normalizeState(cloud);
      saveState();
      render();
    } else {
      scheduleCloudPush();
    }
  }

  function renderSettingsBody() {
    const body = document.getElementById("settingsBody");
    if (!body) return;
    const usage = getStorageUsage();
    const limit = 5 * 1024 * 1024;
    const pct = Math.min(100, Math.round((usage.bytes / limit) * 100));
    const photos = getPhotoCount();
    const totalItems = (state.logs ? Object.keys(state.logs).length : 0) + (state.goals ? state.goals.length : 0) +
      (state.buckets ? state.buckets.length : 0) + (state.archives ? state.archives.length : 0) +
      (state.todos ? state.todos.length : 0);
    const configured = isFirebaseConfigured();
    body.innerHTML = `
      <div class="settings-section">
        <h4>계정 · 동기화</h4>
        ${authUser ? `
          <div class="account-row">
            <span class="account-badge">${escapeHtml((authUser.email || authUser.name || "?").slice(0, 1).toUpperCase())}</span>
            <div class="account-text">
              <strong>${escapeHtml(authUser.email || authUser.name || "로그인됨")}</strong>
              <span>${configured ? "Firestore 동기화 사용 중" : "로컬 모드"}</span>
            </div>
            <button class="btn btn-sm" onclick="signOutOfAccount()">로그아웃</button>
          </div>
        ` : `
          <div class="account-row">
            <span class="account-badge">로</span>
            <div class="account-text">
              <strong>로컬 모드</strong>
              <span>${configured ? "로그인하면 기록이 계정에 동기화됩니다" : "기록은 이 브라우저에만 저장됩니다"}</span>
            </div>
            <button class="btn btn-sm" onclick="openAuthScreen()">로그인</button>
          </div>
        `}
      </div>
      <div class="settings-section">
        <h4>저장 공간</h4>
        <div class="storage-line"><strong>사용 중 약 ${formatBytes(usage.bytes)}</strong><span>/ 권장 한도 약 4~5MB</span></div>
        <div class="storage-track"><div class="storage-fill ${pct >= 80 ? "warn" : ""}" style="width:${pct}%;"></div></div>
        <p class="settings-hint">사진 ${photos}장 · 기록 ${totalItems}건. 모든 기록은 이 브라우저(localStorage)에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라지니 가끔 JSON으로 백업해 두세요.</p>
        ${lastSavedAt ? `<p class="settings-hint">마지막 저장: ${timeStr(lastSavedAt)}</p>` : ""}
        <p class="settings-hint">공간이 부족하면 저장이 되지 않을 수 있고, 그때는 사진을 줄이거나 백업 후 오래된 사진을 삭제해 주세요.</p>
      </div>
      <div class="settings-section">
        <h4>데이터 관리</h4>
        <div class="settings-actions">
          <button class="btn" onclick="exportBackup()">데이터 백업 (JSON)</button>
          <label class="btn" style="cursor:pointer;">백업 복원<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)" /></label>
          <button class="btn btn-danger-outline" onclick="clearSamples()">예시 지우기 · 전체 삭제</button>
        </div>
        <p class="settings-hint">‘예시 지우기’는 기본 예시뿐 아니라 모든 기록을 지웁니다. 되돌릴 수 없으니 먼저 백업을 권장합니다.</p>
      </div>
      <div class="settings-section">
        <h4>앱 정보</h4>
        <p class="settings-hint">아카이브 &amp; 플래너 v${APP_VERSION} · 저장 키 <code>${STORAGE_KEY}</code></p>
        ${state.migratedFrom ? `<p class="settings-hint">이전 버전(<code>${escapeHtml(state.migratedFrom)}</code>)의 기록을 안전하게 옮겨 왔습니다.</p>` : ""}
      </div>
    `;
  }

  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `archive_planner_backup_${TODAY_STR}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (_) {
      alert("백업 파일을 만드는 중 오류가 발생했습니다.");
    }
  }

  function importBackup(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(String(e.target.result));
        const isLegacy = !parsed.logs && !parsed.topics && looksLikeLegacyIndex(parsed);
        state = isLegacy ? (migrateLegacyIndex(parsed) || clone(defaultState)) : normalizeState(parsed);
        saveState();
        render();
        refreshSettingsIfOpen();
        alert("백업 데이터를 복원했습니다.");
      } catch (_) {
        alert("올바른 JSON 백업 파일이 아닙니다.");
      }
      input.value = "";
    };
    reader.onerror = () => {
      alert("파일을 읽는 중 오류가 발생했습니다.");
      input.value = "";
    };
    reader.readAsText(file);
  }

  // ---------- 공통 모달 ----------
  function openModal(title, bodyHtml, onSave) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalActions").innerHTML = `
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modalSaveBtn">저장</button>
    `;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    document.getElementById("modalSaveBtn").onclick = () => {
      const result = typeof onSave === "function" ? onSave() : true;
      if (result === false) return;
      closeModal();
      saveState();
      render();
      refreshCategoryManager();
      refreshSettingsIfOpen();
    };
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("open");
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  // onclick 등 인라인 JS 문자열 인자용 (따옴표 안전 처리)
  function jsArg(val) {
    return escapeAttr(JSON.stringify(String(val == null ? "" : val)));
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      if (document.getElementById("lightbox").classList.contains("open")) { closeLightbox(); return; }
      if (document.getElementById("editModal").classList.contains("open")) { closeModal(); return; }
      if (document.getElementById("catModal").classList.contains("open")) { closeCategoryManager(); return; }
      if (document.getElementById("settingsModal").classList.contains("open")) { closeSettings(); return; }
      if (searchOpen) { closeSearch(); return; }
      const authEl = document.getElementById("authScreen");
      if (authEl && authEl.classList.contains("open")) { closeAuthScreen(); return; }
    }
    if (document.getElementById("lightbox").classList.contains("open")) {
      if (event.key === "ArrowLeft") lightboxStep(-1);
      else if (event.key === "ArrowRight") lightboxStep(1);
    }

    // 노트북 · 연도 책 넘기기 (입력 중이거나 모달이 열려 있을 때는 결과)
    const tagName = (event.target && event.target.tagName) || "";
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tagName) || (event.target && event.target.isContentEditable);
    const modalOpen = ["editModal", "settingsModal", "catModal", "lightbox"].some(id => {
      const el = document.getElementById(id);
      return el && el.classList.contains("open");
    });
    if (!typing && !modalOpen) {
      if (state.activeTab === "year") {
        if (yearDayDate) {
          if (event.key === "ArrowLeft") { stepYearDay(-1); return; }
          if (event.key === "ArrowRight") { stepYearDay(1); return; }
        } else if (yearBookYear) {
          if (event.key === "ArrowLeft") { yearPageStep(-1); return; }
          if (event.key === "ArrowRight") { yearPageStep(1); return; }
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          yearShelfStep(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }
      } else if (state.activeTab === "archive") {
        if (notebookBookId) {
          if (event.key === "ArrowLeft") { notebookStep(-1); return; }
          if (event.key === "ArrowRight") { notebookStep(1); return; }
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          shelfStep(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }
      }
    }
  });

  const mobileMq = window.matchMedia ? window.matchMedia("(max-width: 860px)") : null;
  if (mobileMq) {
    const onMqChange = () => {
      const onShelf = (state.activeTab === "year" && !yearBookYear) || (state.activeTab === "archive" && !notebookBookId);
      if (state.yearViewMode === "auto" || onShelf) render();
    };
    if (mobileMq.addEventListener) mobileMq.addEventListener("change", onMqChange);
    else if (mobileMq.addListener) mobileMq.addListener(onMqChange);
  }

  // 테스트/디버깅용 (화면에는 영향 없음)
  window.__planner = {
    version: APP_VERSION,
    getState: () => state,
    getYearViewMode,
    getStorageUsage,
    getPhotoCount,
    render,
    setTab,
    selectDate,
    toggleGoalComposer,
    toggleBucketComposer,
    openSearch,
    closeSearch,
    openSettings,
    closeSettings,
    openAuthScreen,
    closeAuthScreen,
    isFirebaseConfigured,
    openCategoryManager,
    closeCategoryManager,
    openLightbox,
    closeLightbox,
    openNotebook,
    closeNotebookBook,
    notebookStep,
    selectShelfBook,
    shelfStep,
    openBookModal,
    openNewArchiveModal,
    openEditArchive,
    openEditGoal,
    openYearBook,
    openYearBookModal,
    setYearBook,
    getYearBooks,
    closeYearBook,
    openTodayYearBook,
    openYearPage,
    yearPageStep,
    openYearDay,
    closeYearDay,
    stepYearDay,
    setNotebookSide,
    flipNotebookPage,
    getNotebookState: () => ({
      bookId: notebookBookId,
      page: notebookPageIndex,
      yearBook: yearBookYear,
      yearPage: yearPageIndex,
      yearDay: yearDayDate,
      mobileSide: notebookMobileSide
    }),
    errors: () => window.__errors
  };

  mountNavIcons();
  render();
</script>
</body>
</html>
