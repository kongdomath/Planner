  // ---------- 목표 · 버킷 책자 (v2.9 통합 노트) ----------
  // 기존 목표 주제와 버킷 분류를 같은 이름 기준으로 한 페이지에 묶습니다.
  const GOAL_TOPIC_ALIASES = {
    "학업": "학업 · 전공", "전공": "학업 · 전공", "학업·전공": "학업 · 전공", "학업 · 전공": "학업 · 전공",
    "운동": "운동 · 건강", "건강": "운동 · 건강", "운동·건강": "운동 · 건강", "운동 · 건강": "운동 · 건강",
    "독서": "독서 · 문화", "문화": "독서 · 문화", "독서·문화": "독서 · 문화", "독서 · 문화": "독서 · 문화",
    "자산": "자산 · 경제", "경제": "자산 · 경제", "자산·경제": "자산 · 경제", "자산 · 경제": "자산 · 경제",
    "생활": "생활 · 루틴", "루틴": "생활 · 루틴", "생활·루틴": "생활 · 루틴", "생활 · 루틴": "생활 · 루틴",
    "경험": "경험 · 성취", "성취": "경험 · 성취", "경험·성취": "경험 · 성취", "경험 · 성취": "경험 · 성취"
  };

  const TOPIC_TAB_COLORS = ["#4f74a8", "#8b94a6", "#b4787f", "#6f9270", "#b98a4d", "#8074ad", "#4d8b91", "#a86f5d"];

  function canonicalTopicName(name) {
    const raw = String(name || "").trim();
    if (!raw) return "";
    if (GOAL_TOPIC_ALIASES[raw]) return GOAL_TOPIC_ALIASES[raw];
    const compact = raw.replace(/\s+/g, "");
    return GOAL_TOPIC_ALIASES[compact] || raw;
  }

  // 주제 목록: 목표 주제 + 버킷 분류를 합치고, 항목에만 남아 있는 주제도 포함
  function goalBookTopics() {
    const out = [];
    const index = new Map();
    const add = (rawName, iconHint) => {
      const name = canonicalTopicName(rawName);
      if (!name || index.has(name)) return index.get(name) || null;
      const entry = { name, icon: resolveIconKey(iconHint, "target"), bucketCats: [] };
      index.set(name, entry);
      out.push(entry);
      return entry;
    };
    (state.topics || []).forEach(t => add(t.name, t.icon));
    (state.bucketCategories || []).forEach(c => add(c.name, c.icon));
    (state.goals || []).forEach(g => add(g.topic, getTopicIconKey(g.topic)));
    (state.buckets || []).forEach(b => add(b.category, getBucketCatIconKey(b.category)));
    out.forEach(entry => {
      entry.bucketCats = [...new Set(state.buckets
        .filter(b => canonicalTopicName(b.category) === entry.name)
        .map(b => b.category))];
      if (entry.bucketCats.length === 0) {
        const own = (state.bucketCategories || []).find(c => canonicalTopicName(c.name) === entry.name);
        if (own) entry.bucketCats.push(own.name);
      }
    });
    return out;
  }

  function goalBookTopicIndex(topics) {
    const list = Array.isArray(topics) && topics.length ? topics : goalBookTopics();
    const saved = canonicalTopicName(state.goalBookTopic);
    let idx = list.findIndex(t => t.name === saved);
    if (idx < 0) {
      const filter = state.goalTopicFilter && state.goalTopicFilter !== "all" ? canonicalTopicName(state.goalTopicFilter) : "";
      idx = list.findIndex(t => t.name === filter);
    }
    return idx < 0 ? 0 : idx;
  }

  const goalBookOrder = list => list
    .map((item, i) => ({ item, i }))
    .sort((a, b) => (Number(a.item.done) - Number(b.item.done)) || (a.i - b.i))
    .map(entry => entry.item);

  function renderGoalBookRow(g) {
    return `
      <div class="gb-row ${g.done ? "done" : ""}">
        <input type="checkbox" class="chk" ${g.done ? "checked" : ""} onchange="toggleAchieve('goals', '${g.id}')" aria-label="달성 체크" />
        <div class="gb-row-main" onclick="openEditGoal('${g.id}')" title="눌러서 수정">
          <div class="gb-row-title">${escapeHtml(g.title)}</div>
          <div class="gb-row-meta">
            <span class="gb-tag">${normalizeYear(g.year)} · ${escapeHtml(normalizePeriod(g.period))}</span>
            ${g.done ? renderDoneDateControl("goals", g.id, g.doneDate) : ""}
          </div>
          ${g.note ? `<div class="gb-row-note">${escapeHtml(g.note)}</div>` : ""}
        </div>
        <button class="icon-btn danger" onclick="deleteItem('goals', '${g.id}')" title="삭제" aria-label="목표 삭제">${ICONS.trash}</button>
      </div>
    `;
  }

  function renderBucketBookRow(b) {
    return `
      <div class="gb-row ${b.done ? "done" : ""}">
        <input type="checkbox" class="chk" ${b.done ? "checked" : ""} onchange="toggleAchieve('buckets', '${b.id}')" aria-label="달성 체크" />
        <div class="gb-row-main" onclick="openEditBucket('${b.id}')" title="눌러서 수정">
          <div class="gb-row-title">${escapeHtml(b.title)}</div>
          <div class="gb-row-meta">
            <span class="gb-tag">${escapeHtml(b.category)}</span>
            ${b.done ? renderDoneDateControl("buckets", b.id, b.doneDate) : ""}
          </div>
          ${b.note ? `<div class="gb-row-note">${escapeHtml(b.note)}</div>` : ""}
        </div>
        <button class="icon-btn danger" onclick="deleteItem('buckets', '${b.id}')" title="삭제" aria-label="버킷리스트 삭제">${ICONS.trash}</button>
      </div>
    `;
  }

  function renderGoalBookView() {
    const topics = goalBookTopics();
    const idx = goalBookTopicIndex(topics);
    const topic = topics[idx];
    const goalsAll = state.goals.filter(g => canonicalTopicName(g.topic) === topic.name);
    const bucketsAll = state.buckets.filter(b => canonicalTopicName(b.category) === topic.name);
    const goals = goalBookOrder(goalsAll);
    const buckets = goalBookOrder(bucketsAll);
    const goalDone = goalsAll.filter(g => g.done).length;
    const bucketDone = bucketsAll.filter(b => b.done).length;
    // FAB·모달이 지금 페이지의 주제를 기본값으로 쓰도록 맞춰 둠
    state.goalTopicFilter = topic.name;
    state.bucketCatFilter = topic.bucketCats[0] || topic.name;

    const topicAddName = topic.name;
    const bucketAddCat = topic.bucketCats[0] || topic.name;

    const leftPage = `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner">
          <div class="gb-head">
            <span class="gb-icon">${renderPictogram(topic.icon, 22)}</span>
            <div class="gb-head-text">
              <div class="gb-kicker">GOALS</div>
              <h2 class="gb-title">${escapeHtml(topic.name)}</h2>
              <div class="gb-sub">목표 ${goalsAll.length}개 · 달성 ${goalDone}개</div>
            </div>
          </div>
          <div class="gb-section-head">
            <b>목표</b>
            <button class="gb-add" onclick="openGoalModal(${jsArg(topicAddName)})">${NB_ICONS.plus}<span>목표 추가</span></button>
          </div>
          ${goals.length
            ? `<div class="gb-list">${goals.map(renderGoalBookRow).join("")}</div>`
            : `<div class="gb-empty">아직 이 주제의 목표가 없습니다.<br />이 페이지에 첫 목표를 적어 보세요.</div>`}
          ${paperPageNo(idx * 2 + 1)}
        </div>
      </section>
    `;

    const rightPage = `
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner">
          <div class="gb-head gb-head--right">
            <span class="gb-icon">${ICONS.bucket}</span>
            <div class="gb-head-text">
              <div class="gb-kicker">BUCKET LIST</div>
              <h2 class="gb-title">${escapeHtml(topic.name)}</h2>
              <div class="gb-sub">버킷 ${bucketsAll.length}개 · 이룸 ${bucketDone}개</div>
            </div>
          </div>
          <div class="gb-section-head">
            <b>버킷리스트</b>
            <button class="gb-add" onclick="openBucketModal(${jsArg(bucketAddCat)})">${NB_ICONS.plus}<span>버킷 추가</span></button>
          </div>
          ${buckets.length
            ? `<div class="gb-list">${buckets.map(renderBucketBookRow).join("")}</div>`
            : `<div class="gb-empty">언젠가 꼭 해보고 싶은 일을 이 주제에 모아 보세요.</div>`}
          ${paperPageNo(idx * 2 + 2)}
        </div>
      </section>
    `;

    const tabButtons = topics.map((t, i) => {
      const short = String(t.name).split(/[·,\s]/).filter(Boolean)[0] || t.name;
      const color = TOPIC_TAB_COLORS[i % TOPIC_TAB_COLORS.length];
      return `
        <button class="idx-tab idx-tab--topic ${i === idx ? "is-active" : ""}" style="--tab-color:${color}" role="tab" aria-selected="${i === idx ? "true" : "false"}" onclick="jumpGoalTopic(${i})" title="${escapeAttr(t.name)}">
          <span>${escapeHtml(short)}</span>
        </button>
      `;
    }).join("");

    return `
      <div class="nb-stage nb-stage--goalbook">
        <div class="nb-reader-head">
          <span class="nb-reader-spacer" aria-hidden="true"></span>
          <div class="nb-reader-title">
            <b>목표 · 버킷 노트</b>
            <span>${topics.length}개 주제 · ${escapeHtml(topic.name)}</span>
          </div>
          <button class="nb-head-btn" onclick="openBookTopicManager()" title="주제 관리" aria-label="주제 관리">${ICONS.sliders}<span class="nb-head-btn-label">주제 관리</span></button>
        </div>

        <div class="nb-book nb-book--indexed">
          <button class="nb-nav prev" onclick="goalBookStep(-1)" ${idx <= 0 ? "disabled" : ""} aria-label="이전 주제">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="goalSpread" data-side="${goalBookSide}">
            <span class="nb-edge nb-edge--left"></span>
            <span class="nb-edge nb-edge--right"></span>
            ${leftPage}
            ${rightPage}
            <span class="nb-spine"></span>
            <span class="nb-rings"></span>
          </div>
          <button class="nb-nav next" onclick="goalBookStep(1)" ${idx >= topics.length - 1 ? "disabled" : ""} aria-label="다음 주제">${ICONS.chevRight}</button>
          <div class="idx-tabs idx-tabs--topic" role="tablist" aria-label="주제 인덱스">${tabButtons}</div>
        </div>

        <div class="nb-side-toggle">
          <button data-goal-side="left" class="${goalBookSide === "left" ? "active" : ""}" onclick="setGoalBookSide('left')">목표</button>
          <button data-goal-side="right" class="${goalBookSide === "right" ? "active" : ""}" onclick="setGoalBookSide('right')">버킷리스트</button>
        </div>

        <div class="nb-actions">
          <button class="nb-action" onclick="openGoalModal(${jsArg(topicAddName)})"><span class="nb-action-icon">${NB_ICONS.pen}</span>목표 추가</button>
          <button class="nb-action" onclick="openBucketModal(${jsArg(bucketAddCat)})"><span class="nb-action-icon">${NB_ICONS.plus}</span>버킷 추가</button>
          <button class="nb-action" onclick="openBookTopicManager()"><span class="nb-action-icon">${NB_ICONS.dots}</span>주제 관리</button>
        </div>
      </div>
      <div class="gb-fab ${goalBookFabOpen ? "is-open" : ""}">
        <div class="gb-fab-menu">
          <button class="gb-fab-item" onclick="closeGoalBookFab(); openGoalModal(${jsArg(topicAddName)})">목표 추가</button>
          <button class="gb-fab-item" onclick="closeGoalBookFab(); openBucketModal(${jsArg(bucketAddCat)})">버킷 추가</button>
        </div>
        <button class="fab" onclick="toggleGoalBookFab()" title="이 주제에 추가" aria-label="목표·버킷 추가">${NB_ICONS.plus}</button>
      </div>
    `;
  }

  function jumpGoalTopic(target) {
    const topics = goalBookTopics();
    const idx = goalBookTopicIndex(topics);
    const next = Math.max(0, Math.min(topics.length - 1, Number(target) || 0));
    if (next === idx) return;
    turnToPage(next > idx ? 1 : -1, () => {
      state.goalBookTopic = topics[next].name;
      goalBookSide = "left";
      saveState();
    });
  }

  function goalBookStep(delta) {
    const topics = goalBookTopics();
    const idx = goalBookTopicIndex(topics);
    const next = Math.max(0, Math.min(topics.length - 1, idx + delta));
    if (next === idx) return;
    turnToPage(delta, () => {
      state.goalBookTopic = topics[next].name;
      goalBookSide = "left";
      saveState();
    });
  }

  function setGoalBookSide(side) {
    goalBookSide = side === "right" ? "right" : "left";
    const spread = document.getElementById("goalSpread");
    if (spread) spread.dataset.side = goalBookSide;
    document.querySelectorAll(".nb-side-toggle button[data-goal-side]").forEach(b => {
      b.classList.toggle("active", b.dataset.goalSide === goalBookSide);
    });
  }

  function flipGoalBookPage(side, spreadEl) {
    const spread = spreadEl || document.getElementById("goalSpread");
    if (!spread) return;
    const next = side === "right" ? "right" : "left";
    if (spread.dataset.side === next) return;
    spread.classList.remove("flip-left", "flip-right");
    void spread.offsetWidth;
    spread.classList.add(next === "right" ? "flip-left" : "flip-right");
    setGoalBookSide(next);
    clearTimeout(spread._flipTimer);
    spread._flipTimer = setTimeout(() => spread.classList.remove("flip-left", "flip-right"), 320);
  }

  function toggleGoalBookFab() {
    goalBookFabOpen = !goalBookFabOpen;
    document.querySelectorAll(".gb-fab").forEach(el => el.classList.toggle("is-open", goalBookFabOpen));
  }

  function closeGoalBookFab() {
    goalBookFabOpen = false;
    document.querySelectorAll(".gb-fab").forEach(el => el.classList.remove("is-open"));
  }

  function openBookTopicManager() {
    openModal("주제 관리", `
      <p class="gb-manage-note">목표 주제와 버킷 분류를 각각 관리합니다. 같은 계열의 이름(예: 문화 ↔ 독서 · 문화, 경험·성취 ↔ 경험/성취)은 한 페이지로 묶여 보입니다.</p>
      <div class="gb-manage-list">
        <div class="gb-manage-row">
          <div><b>목표 주제</b><span>${state.topics.map(t => escapeHtml(t.name)).join(" · ") || "없음"}</span></div>
          <button class="btn btn-sm" onclick="closeModal(); openCategoryManager('goals')">편집</button>
        </div>
        <div class="gb-manage-row">
          <div><b>버킷 분류</b><span>${state.bucketCategories.map(c => escapeHtml(c.name)).join(" · ") || "없음"}</span></div>
          <button class="btn btn-sm" onclick="closeModal(); openCategoryManager('bucket')">편집</button>
        </div>
      </div>
    `, () => true);
  }

  // ---------- 아카이브 (주제별 책장 + 스프링 노트북 단일 뷰) ----------
  function renderArchiveView() {
    return renderArchiveNotebookView();
  }

  // ---------- 아카이브: 주제별 책장 + 스프링 노트북 ----------
  const NB_ICONS = {
    back: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
    edit: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
    plus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
    dots: `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
    book: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>`,
    calendar: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
    pen: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`
  };

  function getBooks() {
    return Array.isArray(state.books) ? state.books : [];
  }

  function getBookById(id) {
    const key = String(id || "");
    if (!key) return null;
    return getBooks().find(b => b.id === key) || null;
  }

  function bookArchives(bookId) {
    const list = [];
    (state.archives || []).forEach((a, i) => {
      if ((a.bookId || "") === bookId) list.push({ a, i });
    });
    list.sort((x, y) => {
      const d = String(x.a.date || "").localeCompare(String(y.a.date || ""));
      return d !== 0 ? d : x.i - y.i;
    });
    return list.map(x => x.a);
  }

  function clampShelfIndex() {
    const books = getBooks();
    if (!books.length) {
      notebookShelfIndex = 0;
      return;
    }
    if (state.shelfSelectedBookId) {
      const idx = books.findIndex(b => b.id === state.shelfSelectedBookId);
      if (idx >= 0) {
        notebookShelfIndex = idx;
        return;
      }
    }
    if (notebookShelfIndex > books.length - 1) notebookShelfIndex = books.length - 1;
    if (notebookShelfIndex < 0) notebookShelfIndex = 0;
    state.shelfSelectedBookId = books[notebookShelfIndex].id;
  }

  function renderArchiveNotebookView() {
    const book = notebookBookId ? getBookById(notebookBookId) : null;
    if (notebookBookId && !book) notebookBookId = "";
    return book ? renderNotebookReader(book) : renderNotebookShelf();
  }

  function renderShelfCover(book, isActive, offset) {
    const recs = bookArchives(book.id);
    const coverImg = book.cover || "";
    const spine = normalizeSpineColor(book.spine, BOOK_SPINE_PALETTE[0]);
    return `
      <button class="nb-cover-btn ${isActive ? "is-active" : ""}" data-book-id="${escapeAttr(book.id)}" data-offset="${Number(offset) || 0}" onclick="openNotebook('${book.id}')" aria-label="${escapeAttr(book.title)} 펼치기" title="${escapeAttr(book.title)} 펼치기">
        <span class="nb-cover" style="--spine:${spine}">
          ${coverImg
            ? `<img class="nb-cover-photo" src="${coverImg}" alt="" /><span class="nb-cover-plate">${escapeHtml(book.title)}</span>`
            : `<span class="nb-cover-label"><b>${escapeHtml(book.title)}</b>${(() => {
                const sub = book.subject && book.subject !== book.title ? book.subject
                  : (book.category && book.category !== book.title ? book.category : "");
                return sub ? `<span>${escapeHtml(sub)}</span>` : "";
              })()}</span>`}
          <span class="nb-cover-spine"></span>
          <span class="nb-cover-shine"></span>
          <span class="nb-cover-chip">${recs.length}p</span>
        </span>
      </button>
    `;
  }

  function renderShelfMeta(book) {
    const recs = bookArchives(book.id);
    const latest = recs.length ? recs[recs.length - 1] : null;
    const bits = [`${recs.length}페이지`];
    if (book.category && book.category !== book.title) bits.push(book.category);
    else if (book.subject && book.subject !== book.title) bits.push(book.subject);
    if (latest && latest.date) bits.push(`최근 ${latest.date}`);
    return `
      <div class="nb-book-meta">
        <h3>${escapeHtml(book.title)}</h3>
        <div class="nb-book-info">${bits.map(escapeHtml).join(" · ")}</div>
      </div>
    `;
  }

  function renderShelfActions(book) {
    return `
      <button class="nb-action primary" onclick="openNotebook('${book.id}')"><span class="nb-action-icon">${NB_ICONS.book}</span>이 책 펼치기</button>
      <button class="nb-action" onclick="openBookModal()"><span class="nb-action-icon">${NB_ICONS.plus}</span>책 추가</button>
      <button class="nb-action" onclick="openBookModal('${book.id}')"><span class="nb-action-icon">${NB_ICONS.edit}</span>편집</button>
    `;
  }

  function renderNotebookShelf() {
    const books = getBooks();
    const bar = "";
    if (!books.length) {
      return `
        <div class="nb-stage nb-stage--shelf">
          <div class="nb-shelf-empty">
            <h3>아직 책장이 비어 있습니다</h3>
            <p>주제별로 책을 만들고 기록을 페이지처럼 모아 보세요.<br />독서 기록, 여행 노트, 공부 노트 무엇이든 좋습니다.</p>
            <button class="btn btn-primary" onclick="openBookModal()">+ 첫 책 만들기</button>
          </div>
        </div>
      `;
    }
    clampShelfIndex();
    const active = books[notebookShelfIndex];
    return `
      <div class="nb-stage nb-stage--shelf">
        <div id="nbShelfMeta">${renderShelfMeta(active)}</div>
        <div class="nb-shelf">
          <div class="nb-shelf-track" id="nbShelfTrack">${shelfSlots(books.length, notebookShelfIndex, shelfRadius()).map(slot => slot ? renderShelfCover(books[slot.index], slot.offset === 0, slot.offset) : `<span class="nb-slot-empty" aria-hidden="true"></span>`).join("")}</div>
          <div class="nb-shelf-rail"></div>
        </div>
        <div class="nb-actions" id="nbShelfActions">${renderShelfActions(active)}</div>
      </div>
    `;
  }

  function selectShelfBook(id) {
    const books = getBooks();
    const idx = books.findIndex(b => b.id === id);
    if (idx < 0) return;
    notebookShelfIndex = idx;
    state.shelfSelectedBookId = id;
    saveState();
    render();
  }

  function shelfStep(delta) {
    const books = getBooks();
    if (!books.length) return;
    clampShelfIndex();
    const next = (notebookShelfIndex + delta + books.length) % books.length;
    shelfTurnTo(delta, () => {
      notebookShelfIndex = next;
      state.shelfSelectedBookId = books[next].id;
      saveState();
    });
  }

  function openNotebook(id) {
    const book = getBookById(id);
    if (!book) return;
    const idx = getBooks().findIndex(b => b.id === id);
    if (idx >= 0) notebookShelfIndex = idx;
    state.shelfSelectedBookId = id;
    notebookBookId = id;
    notebookPageIndex = 0;
    notebookMobileSide = "left";
    saveState();
    render();
  }

  function closeNotebookBook() {
    notebookBookId = "";
    notebookPageIndex = 0;
    notebookMobileSide = "left";
    render();
  }

  function notebookTotalPages(book) {
    return bookArchives(book.id).length + 1;
  }

  function notebookStep(delta) {
    const book = getBookById(notebookBookId);
    if (!book) return;
    const total = notebookTotalPages(book);
    const next = Math.min(total - 1, Math.max(0, notebookPageIndex + delta));
    if (next === notebookPageIndex) return;
    turnToPage(delta, () => {
      notebookPageIndex = next;
      notebookMobileSide = "left";
    });
  }

  function setNotebookSide(side) {
    notebookMobileSide = side === "right" ? "right" : "left";
    const spread = document.getElementById("nbSpread");
    if (spread) spread.dataset.side = notebookMobileSide;
    document.querySelectorAll(".nb-side-toggle button[data-side]").forEach(b => {
      b.classList.toggle("active", b.dataset.side === notebookMobileSide);
    });
  }

  function openNotebookPhoto(id, index) {
    const a = (state.archives || []).find(x => x.id === id);
    if (!a) return;
    openLightbox(normalizeImages(a), Number(index) || 0, a.title || "");
  }

  function renderNotebookLeftPage(a, book, pageNo) {
    const imgs = normalizeImages(a);
    const iconKey = getArchiveCatIconKey(a.category);
    const parts = String(a.date || "").split("-");
    const y = parts[0] || "";
    const m = parts[1] || "";
    const d = parts[2] || "";
    const dowNames = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = /^\d{4}-\d{2}-\d{2}$/.test(String(a.date || "")) ? dowNames[getDayOfWeek(a.date)] : "";

    const visual = imgs.length
      ? `
        <div class="nb-photo-frame">
          <span class="nb-photo-tape"></span>
          <img src="${imgs[0]}" alt="${escapeAttr(a.title)}" />
          <button class="nb-photo-zoom" onclick="event.stopPropagation(); openNotebookPhoto('${a.id}', 0)" title="사진 크게 보기" aria-label="사진 크게 보기">${ICONS.search}</button>
          ${imgs.length > 1 ? `<span class="nb-photo-count">사진 ${imgs.length}장 · 아래에서 골라 보기</span>` : ""}
        </div>
        ${imgs.length > 1 ? `
          <div class="nb-thumbs">
            ${imgs.map((src, i) => `<button class="nb-thumb" onclick="openNotebookPhoto('${a.id}', ${i})" aria-label="사진 ${i + 1} 크게 보기"><img src="${src}" alt="" /></button>`).join("")}
          </div>
        ` : ""}
      `
      : `
        <div class="nb-visual">
          <span class="nb-visual-icon">${renderPictogram(iconKey, 24)}</span>
          <div class="nb-visual-date">${Number(m) || ""}월 ${Number(d) || ""}일</div>
          <div class="nb-visual-sub">${dow ? `${dow}요일` : y}</div>
          <span class="nb-visual-rule"></span>
          ${(a.category && (!book || a.category !== book.title)) ? `<div class="nb-visual-cat">${escapeHtml(a.category)}</div>` : ""}
        </div>
      `;

    return `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner">
          ${visual}
          <div class="nb-stamps">
            <span class="nb-stamp"><b>${String(a.date || "").replace(/-/g, ".")}</b><span>${dow || "DATE"}</span></span>
            ${a.subtitle ? `<span class="nb-badge nb-badge--ghost">${escapeHtml(a.subtitle)}</span>` : ""}
          </div>
          ${paperPageNo(pageNo)}
        </div>
      </section>
    `;
  }

  function renderNotebookRightPage(a, pageNo) {
    return `
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner">
          <div class="nb-note">
            <h2 class="nb-note-title">${escapeHtml(a.title)}</h2>
            ${a.subtitle ? `<div class="nb-note-sub">${escapeHtml(a.subtitle)}</div>` : ""}
            <div class="nb-note-rule"></div>
            <div class="nb-note-body">${a.note ? escapeHtml(a.note) : `<span class="nb-note-empty">아직 글이 없습니다. 아래 ‘이 페이지 수정’으로 감상을 남겨 보세요.</span>`}</div>
          </div>
          ${paperPageNo(pageNo)}
        </div>
      </section>
    `;
  }

  function renderNotebookGuidePages(book, recs, pageNo) {
    const last = recs.length ? recs[recs.length - 1] : null;
    const firstLabel = recs.length ? "눌러서 새 기록 남기기" : "눌러서 첫 기록 남기기";
    return `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner nb-guide" onclick="openNewArchiveModal('${book.id}')" style="cursor:pointer;">
          <button class="nb-guide-plus" onclick="event.stopPropagation(); openNewArchiveModal('${book.id}')" aria-label="${firstLabel}">${NB_ICONS.plus}</button>
          <div class="nb-guide-title">${firstLabel}</div>
          <p class="nb-guide-sub">${recs.length ? "이 책의 마지막 페이지입니다. 오늘의 기록으로 책을 이어가 보세요." : "아직 페이지가 없습니다. 첫 기록을 남겨 이 책을 시작해 보세요."}</p>
          ${paperPageNo(pageNo)}
        </div>
      </section>
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner nb-guide-summary">
          <div class="nb-summary-title">${escapeHtml(book.title)}</div>
          <ul class="nb-summary-list">
            <li><span>기록</span><b>${recs.length}개</b></li>
            <li><span>최근 기록</span><b>${last ? escapeHtml(last.date || "") : "—"}</b></li>
            <li><span>연결</span><b>${escapeHtml(book.category || book.subject || "자유 주제")}</b></li>
          </ul>
          <button class="btn btn-primary" onclick="openNewArchiveModal('${book.id}')">+ 새 기록 추가</button>
          ${paperPageNo(pageNo + 1)}
        </div>
      </section>
    `;
  }

  function renderNotebookReader(book) {
    const recs = bookArchives(book.id);
    const total = recs.length + 1;
    if (notebookFocusId) {
      const fi = recs.findIndex(a => a.id === notebookFocusId);
      if (fi >= 0) notebookPageIndex = fi;
      notebookFocusId = "";
    }
    notebookPageIndex = Math.min(total - 1, Math.max(0, notebookPageIndex));
    const idx = notebookPageIndex;
    const onGuide = idx >= recs.length;
    const current = onGuide ? null : recs[idx];
    const subBits = [];
    if (book.category && book.category !== book.title) subBits.push(book.category);
    else if (book.subject && book.subject !== book.title) subBits.push(book.subject);
    subBits.push(`${recs.length}페이지`);

    const spreadBody = onGuide
      ? renderNotebookGuidePages(book, recs, idx * 2 + 1)
      : `${renderNotebookLeftPage(current, book, idx * 2 + 1)}${renderNotebookRightPage(current, idx * 2 + 2)}`;

    return `
      <div class="nb-stage">
        <div class="nb-reader-head">
          <button class="nb-back" onclick="closeNotebookBook()">${ICONS.chevLeft}책장</button>
          <div class="nb-reader-title">
            <b>${escapeHtml(book.title)}</b>
            <span>${subBits.map(escapeHtml).join(" · ")}</span>
          </div>
          <span class="nb-reader-spacer" aria-hidden="true"></span>
        </div>
        <div class="nb-book">
          <button class="nb-nav prev" onclick="notebookStep(-1)" ${idx <= 0 ? "disabled" : ""} aria-label="이전 페이지">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="nbSpread" data-side="${notebookMobileSide}">
            <span class="nb-edge nb-edge--left"></span>
            <span class="nb-edge nb-edge--right"></span>
            ${spreadBody}
            <span class="nb-spine"></span>
            <span class="nb-rings"></span>
          </div>
          <button class="nb-nav next" onclick="notebookStep(1)" ${idx >= total - 1 ? "disabled" : ""} aria-label="다음 페이지">${ICONS.chevRight}</button>
        </div>
        <div class="nb-side-toggle">
          <button data-side="left" class="${notebookMobileSide === "left" ? "active" : ""}" onclick="setNotebookSide('left')">사진 페이지</button>
          <button data-side="right" class="${notebookMobileSide === "right" ? "active" : ""}" onclick="setNotebookSide('right')">노트 페이지</button>
        </div>
        <div class="nb-actions">
          ${onGuide ? "" : `<button class="nb-action" onclick="openEditArchive('${current.id}')"><span class="nb-action-icon">${NB_ICONS.edit}</span>이 페이지 수정</button>`}
          <button class="nb-action primary" onclick="openNewArchiveModal('${book.id}')"><span class="nb-action-icon">${NB_ICONS.plus}</span>새 기록 추가</button>
          <button class="nb-action" onclick="openBookModal('${book.id}')"><span class="nb-action-icon">${NB_ICONS.dots}</span>책 설정</button>
        </div>
      </div>
    `;
  }

  function bindNotebookGestures() {
    document.querySelectorAll(".nb-action").forEach(b => {
      if (b.getAttribute("aria-label")) return;
      const label = (b.textContent || "").replace(/\s+/g, " ").trim();
      if (label) b.setAttribute("aria-label", label);
    });
    const spreads = [
      document.getElementById("nbSpread"),
      document.getElementById("nbYearSpread"),
      document.getElementById("goalSpread")
    ].filter(Boolean);
    spreads.forEach(spread => {
      const isYear = spread.id === "nbYearSpread";
      const isGoal = spread.id === "goalSpread";
      if (spread.dataset.gestureBound === "1") return;
      spread.dataset.gestureBound = "1";
      let sx = 0;
      let sy = 0;
      spread.addEventListener("touchstart", e => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        sx = t.clientX;
        sy = t.clientY;
      }, { passive: true });
      spread.addEventListener("touchend", e => {
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;
        if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          spread.dataset.swipedAt = String(Date.now());
          if (isYear) yearPageStep(dx < 0 ? 1 : -1);
          else if (isGoal) goalBookStep(dx < 0 ? 1 : -1);
          else notebookStep(dx < 0 ? 1 : -1);
        }
      }, { passive: true });
      // 모바일 1면 보기: 페이지를 탭하면 왼쪽 면 ↔ 오른쪽 면 뒤집기
      spread.addEventListener("click", e => {
        if (isYear || !isMobileViewport()) return;
        const last = Number(spread.dataset.swipedAt || 0);
        if (last && Date.now() - last < 420) return;
        if (e.target.closest("button, a, input, textarea, select, label, .nb-thumb, .nb-guide, .nb-photo-zoom, .nb-nav, .nb-side-toggle, .idx-tab, .gb-add")) return;
        const nextSide = spread.dataset.side === "right" ? "left" : "right";
        if (isGoal) flipGoalBookPage(nextSide, spread);
        else flipNotebookPage(nextSide, spread);
      });
    });

    // 책장: 좌우로 밀면 책이 손끝을 따라 미끄러졌다가, 놓으면 이어지듯 넘어감
    const shelfs = [
      { el: document.getElementById("nbYearShelfTrack"), step: yearShelfStep },
      { el: document.getElementById("nbShelfTrack"), step: shelfStep }
    ];
    shelfs.forEach(({ el, step }) => {
      if (!el || el.dataset.swipeBound === "1") return;
      el.dataset.swipeBound = "1";
      let sx = 0;
      let sy = 0;
      let dragging = false;

      const followTo = dx => {
        el.style.transition = "none";
        el.style.transform = `translateX(${dx * 0.34}px)`;
      };
      const snapBack = () => {
        el.style.transition = "transform .26s cubic-bezier(.22,.8,.3,1)";
        el.style.transform = "translateX(0px)";
        setTimeout(() => { el.style.transition = ""; el.style.transform = ""; }, 280);
      };
      const advance = (dir, origin) => {
        shelfTurnTo(dir, () => step(dir), origin);
      };

      el.addEventListener("touchstart", e => {
        const t = e.touches && e.touches[0];
        if (!t) return;
        sx = t.clientX;
        sy = t.clientY;
        dragging = true;
      }, { passive: true });
      el.addEventListener("touchmove", e => {
        if (!dragging) return;
        const t = e.touches && e.touches[0];
        if (!t) return;
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;
        if (Math.abs(dx) > Math.abs(dy) * 1.2) followTo(dx);
      }, { passive: true });
      el.addEventListener("touchend", e => {
        if (!dragging) return;
        dragging = false;
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;
        if (Math.abs(dx) < 8) return;
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.25) advance(dx < 0 ? 1 : -1, dx * 0.34);
        else snapBack();
      }, { passive: true });

      // 데스크톱: 마우스로 끌어 책 넘기기 (끌지 않고 누르면 일반 클릭 유지)
      let down = false;
      let startX = 0;
      let moved = 0;
      const endDrag = e => {
        if (!down) return;
        down = false;
        window.removeEventListener("pointerup", endDrag);
        window.removeEventListener("pointercancel", endDrag);
        const dx = (e && typeof e.clientX === "number" ? e.clientX : startX) - startX;
        if (moved > 40 && Math.abs(dx) > 20) {
          el.dataset.draggedAt = String(Date.now());
          advance(dx < 0 ? 1 : -1, dx * 0.34);
        } else if (moved > 6) {
          snapBack();
        }
      };
      el.addEventListener("pointerdown", e => {
        if (e.pointerType !== "mouse" || e.button !== 0) return;
        down = true;
        moved = 0;
        startX = e.clientX;
        window.addEventListener("pointerup", endDrag);
        window.addEventListener("pointercancel", endDrag);
      });
      el.addEventListener("pointermove", e => {
        if (!down) return;
        const dx = e.clientX - startX;
        moved = Math.max(moved, Math.abs(dx));
        if (moved > 6) followTo(dx);
      });
      el.addEventListener("click", e => {
        const at = Number(el.dataset.draggedAt || 0);
        if (at && Date.now() - at < 320) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
    });
  }

  // 모바일 노트 뒤집기 (사진 면 ↔ 노트 면) + 부드러운 전환
  function flipNotebookPage(side, spreadEl) {
    const spread = spreadEl || document.getElementById("nbSpread");
    if (!spread) return;
    const next = side === "right" ? "right" : "left";
    if (spread.dataset.side === next) return;
    spread.classList.remove("flip-left", "flip-right");
    void spread.offsetWidth;
    spread.classList.add(next === "right" ? "flip-left" : "flip-right");
    setNotebookSide(next);
    clearTimeout(spread._flipTimer);
    spread._flipTimer = setTimeout(() => spread.classList.remove("flip-left", "flip-right"), 320);
  }

    });

  function deleteBook(id) {
    const book = getBookById(id);
    if (!book) return;
    const n = state.archives.filter(a => a.bookId === id).length;
    const msg = n
      ? `‘${book.title}’ 책을 삭제할까요?\n\n이 책의 기록 ${n}개는 지워지지 않고 ‘미분류 기록’ 책으로 옮겨집니다.`
      : `‘${book.title}’ 책을 삭제할까요?`;
    if (!confirm(msg)) return;
    state.books = state.books.filter(b => b.id !== id);
    state.archives.forEach(a => { if (a.bookId === id) a.bookId = ""; });
    applyBookModel(state);
    if (notebookBookId === id) {
      notebookBookId = "";
      notebookPageIndex = 0;
    }
    if (state.shelfSelectedBookId === id) {
      state.shelfSelectedBookId = state.books[0] ? state.books[0].id : "";
      notebookShelfIndex = 0;
    }
    closeModal();
    saveState();
    render();
  }

  function setYearBook(year, patch) {
    const y = Number(year);
    if (!y) return;
    const list = getYearBooks();
    const found = list.find(b => b.year === y);
    if (found) {
      Object.assign(found, patch);
    } else {
      list.push({
        year: y,
        spine: patch.spine || BOOK_SPINE_PALETTE[list.length % BOOK_SPINE_PALETTE.length],
        cover: patch.cover || ""
      });
      list.sort((a, b) => a.year - b.year);
    }

    saveState();

    const editing = Number(editYear) || 0;
    const entry = editing ? getYearBook(editing) : null;

    const list = getYearBooks();
    draftYearSpine = entry ? entry.spine : BOOK_SPINE_PALETTE[list.length % BOOK_SPINE_PALETTE.length];
    draftYearCover = entry ? entry.cover : "";
    const nextYear = list.reduce((m, b) => Math.max(m, b.year), Number(TODAY_STR.slice(0, 4))) + 1;

    openModal(editing ? `${editing}년 책 편집` : "연도 책 추가", `

  let modalArchiveImages = [];
  async function handleModalArchiveImages(event) {
    try {
      modalArchiveImages = await processMultipleFiles(event.target.files, modalArchiveImages, 5);

    const caption = document.getElementById("lightboxCaption");

  function showToast(message, kind = "info", ms = 3800) {
    const stack = document.getElementById("toastStack");
    if (!stack) return;
    const el = document.createElement("div");
    el.className = "toast" + (kind === "warn" ? " warn" : kind === "ok" ? " ok" : "");
    const text = document.createElement("span");
    text.className = "toast-text";
    text.textContent = String(message == null ? "" : message);
    const close = document.createElement("button");
    close.type = "button";
    close.className = "toast-close";
    close.setAttribute("aria-label", "알림 닫기");
    close.textContent = "✕";
    close.onclick = () => el.remove();
    el.append(text, close);
    stack.appendChild(el);
    while (stack.children.length > 3) stack.firstChild.remove();
    if (ms > 0) setTimeout(() => { if (el.parentNode) el.remove(); }, ms);
  }

  async function getFirebase() {
    if (!isFirebaseConfigured()) return null;
    if (firebaseCtx) return firebaseCtx;
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
    const [appMod, authMod, dbMod] = await Promise.all([
      import(`${base}firebase-app.js`),
      import(`${base}firebase-auth.js`),
      import(`${base}firebase-firestore.js`)
    ]);
    const app = appMod.getApps && appMod.getApps().length ? appMod.getApps()[0] : appMod.initializeApp(FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    const db = dbMod.getFirestore(app);
    firebaseCtx = { app, auth, db, authMod, dbMod };

    // 모바일 Safari·PWA에서도 로그인이 유지되도록 (막힌 환경은 SDK 기본값 사용)
    try { await authMod.setPersistence(auth, authMod.browserLocalPersistence); } catch (_) {}

    authMod.onAuthStateChanged(auth, user => {
      const wasSignedIn = Boolean(authUser);
      authResolved = true;
      authConfigState = "ok";
      authUser = user ? { uid: user.uid, email: user.email || "", name: user.displayName || "" } : null;
      if (authUser) {
        rememberLocalMode(false);
        const screen = document.getElementById("authScreen");
        if (screen && screen.classList.contains("open")) closeAuthScreen();
        adoptCloudState();
      } else {
        authMode = "signin";
        if (wasSignedIn) lastPushedSerialized = "";
      }
      refreshSettingsIfOpen();
    }, err => {
      authResolved = true;
      if (err && String(err.code || "").includes("configuration")) authConfigState = "not-configured";
      refreshSettingsIfOpen();
    });

    // Google 로그인 리디렉트로 돌아온 경우
    authMod.getRedirectResult(auth).then(result => {
      if (result && result.user) showToast("Google 계정으로 로그인했습니다.", "ok");
    }).catch(err => {
      const code = String((err && err.code) || "");
      if (code && !code.includes("no-auth-event") && !code.includes("configuration-not-found")) showToast(authErrorText(err), "warn", 6000);
    });

    return firebaseCtx;
  }

    const code = String((err && err.code) || "");

    if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found") || code.includes("invalid-login-credentials")) return "이메일 또는 비밀번호가 맞지 않습니다. 처음이라면 ‘회원가입’으로 계정을 만들어 주세요.";

    if (code.includes("invalid-email")) return "이메일 주소를 확인해 주세요.";
    if (code.includes("too-many-requests")) return "시도가 너무 많습니다. 잠시 후 다시 시도해 주세요.";
    if (code.includes("popup-closed-by-user") || code.includes("cancelled-popup-request")) return "로그인 창이 닫혔습니다.";
    if (code.includes("popup-blocked")) return "브라우저가 로그인 창을 막았습니다. 다시 시도해 주세요.";
    if (code.includes("network-request-failed")) return "네트워크 연결을 확인해 주세요.";
    if (code.includes("operation-not-allowed")) return "이 로그인 방식이 Firebase 콘솔에서 아직 켜져 있지 않습니다. Authentication에서 이메일/비밀번호·Google 로그인을 켜 주세요.";
    if (code.includes("configuration-not-found")) return "Firebase Authentication이 아직 시작되지 않았습니다. Firebase 콘솔 → Authentication에서 ‘시작하기’를 눌러 주세요.";
    if (code.includes("unauthorized-domain")) return "이 사이트 주소가 Firebase 승인 도메인에 없습니다. Authentication → 설정 → 승인된 도메인에 kongdomath.github.io를 추가해 주세요.";

  async function submitEmailAuth() {
    if (authBusy) return;
    if (!isFirebaseConfigured()) {
      setAuthError("Firebase 설정이 아직 연결되지 않았습니다. 아래 ‘로컬 모드’로 앱을 그대로 사용할 수 있어요.");
      return;
    }
    const emailEl = document.getElementById("authEmail");
    const pwEl = document.getElementById("authPassword");
    const email = (emailEl && emailEl.value || "").trim();
    const password = (pwEl && pwEl.value) || "";
    if (!/.+@.+\..+/.test(email)) { setAuthError("이메일 주소를 확인해 주세요."); return; }
    if (password.length < 6) { setAuthError("비밀번호는 6자 이상이어야 합니다."); return; }
    const signup = authMode === "signup";
    authBusy = true;
    setAuthError("");
    setAuthButtonsBusy(true, signup ? "가입 중…" : "로그인 중…");
    try {
      const fb = await getFirebase();
      if (!fb) { setAuthError("Firebase 설정이 아직 연결되지 않았습니다."); return; }
      if (signup) {
        const cred = await fb.authMod.createUserWithEmailAndPassword(fb.auth, email, password);
        try { await fb.authMod.updateProfile(cred.user, { displayName: email.split("@")[0] }); } catch (_) {}
      } else {
        await fb.authMod.signInWithEmailAndPassword(fb.auth, email, password);
      }
      closeAuthScreen();
    } catch (err) {
      if (String((err && err.code) || "").includes("configuration-not-found")) {
        authConfigState = "not-configured";
        renderAuthScreen();
      }
      setAuthError(authErrorText(err));
    } finally {
      authBusy = false;
      setAuthButtonsBusy(false);
    }
  }

  async function submitGoogleLogin() {
    if (authBusy) return;
    if (!isFirebaseConfigured()) {
      setAuthError("Firebase 설정이 아직 연결되지 않았습니다. 아래 ‘로컬 모드’로 앱을 그대로 사용할 수 있어요.");
      return;
    }
    if (isInAppBrowser()) {
      setAuthError("지금 앱 안의 브라우저에서는 Google 로그인이 막힙니다. Safari나 Chrome에서 열어 주세요. 이메일 로그인은 여기서도 됩니다.");
      return;
    }
    authBusy = true;
    setAuthError("");
    setAuthButtonsBusy(true, authMode === "signup" ? "가입 중…" : "로그인 중…");
    try {
      const fb = await getFirebase();
      if (!fb) { setAuthError("Firebase 설정이 아직 연결되지 않았습니다."); return; }
      const provider = new fb.authMod.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: "select_account" });
      const googleBtn = document.getElementById("authGoogleBtn");
      if (prefersRedirectAuth()) {
        if (googleBtn) googleBtn.innerHTML = `<span class="auth-g">G</span>Google 화면으로 이동 중…`;
        await fb.authMod.signInWithRedirect(fb.auth, provider);
        return;
      }
      try {
        await fb.authMod.signInWithPopup(fb.auth, provider);
        closeAuthScreen();
      } catch (err) {
        const code = String((err && err.code) || "");
        const shouldRedirect = code === "auth/popup-blocked" || code === "auth/operation-not-supported-in-this-environment";
        if (!shouldRedirect) throw err;
        if (googleBtn) googleBtn.innerHTML = `<span class="auth-g">G</span>Google 화면으로 이동 중…`;
        await fb.authMod.signInWithRedirect(fb.auth, provider);
      }
    } catch (err) {
      if (String((err && err.code) || "").includes("configuration-not-found")) {
        authConfigState = "not-configured";
        renderAuthScreen();
      }
      setAuthError(authErrorText(err));
    } finally {
      authBusy = false;
      setAuthButtonsBusy(false);
    }
  }

  async function signOutOfAccount() {
    clearTimeout(cloudTimer);
    cloudTimer = null;
    try {
      if (firebaseCtx) await firebaseCtx.authMod.signOut(firebaseCtx.auth);
    } catch (_) {}
    authUser = null;
    authMode = "signin";
    lastPushedSerialized = "";
    refreshSettingsIfOpen();
    showToast("로그아웃했습니다. 기록은 이 기기에 그대로 남아 있습니다.", "info", 4000);
    openAuthScreen();
  }

  // ---------- Firestore 동기화 ----------
  // 기록 전체를 users/{uid}/planner/state 문서 하나에 담고,
  // 사진 때문에 650KB를 넘으면 같은 문서 아래 parts 하위 컬렉션에 나눠 저장합니다.
  // (Firestore 문서 하나의 한도는 약 1MB입니다.)
  function cloudStateRef(fb) {
    return fb.dbMod.doc(fb.db, "users", authUser.uid, "planner", "state");
  }
  function cloudPartsRef(fb) {
    return fb.dbMod.collection(fb.db, "users", authUser.uid, "planner", "state", "parts");
  }
  function jsonBytes(str) {
    try { return new TextEncoder().encode(str).length; } catch (_) { return String(str).length * 2; }
  }

  function readCloudBaseline(uid) {
    try {
      const raw = localStorage.getItem(CLOUD_BASELINE_KEY);
      if (!raw) return 0;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.uid !== uid) return 0;
      return Number(parsed.updatedAt) || 0;
    } catch (_) { return 0; }
  }
  function writeCloudBaseline(updatedAt) {
    if (!authUser) return;
    try { localStorage.setItem(CLOUD_BASELINE_KEY, JSON.stringify({ uid: authUser.uid, updatedAt: Number(updatedAt) || 0 })); } catch (_) {}
  }

  function cloudErrorText(err) {
    const code = String((err && err.code) || "");
    const raw = String((err && err.message) || err || "");
    if (code === "state-too-large") return "기록이 너무 커서(8MB 초과) 계정에 저장하지 못했습니다. 기록은 이 기기에 저장되어 있습니다. 설정에서 사진을 줄여 주세요.";
    if (code.includes("permission-denied")) return "Firestore 보안 규칙에 막혀 계정에 저장하지 못했습니다. Firebase 콘솔의 Firestore 규칙에서 로그인한 본인만 읽고 쓸 수 있게 허용해 주세요.";
    if (code.includes("failed-precondition") || /firestore.*(not|disabled|enable)|database.*(not|missing)/i.test(raw)) return "Firestore가 아직 준비되지 않았습니다. Firebase 콘솔에서 Firestore 데이터베이스를 만들어 주세요.";
    if (code.includes("unavailable") || code.includes("network") || /offline/i.test(raw)) return "동기화 서버에 연결하지 못했습니다. 네트워크를 확인해 주세요. 기록은 이 기기에 저장되어 있습니다.";
    if (code.includes("resource-exhausted") || /quota/i.test(raw)) return "Firebase 사용량 한도에 닿아 동기화하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    if (code.includes("unauthenticated")) return "로그인 세션이 만료되었습니다. 다시 로그인해 주세요.";
    if (code.includes("invalid-argument") || /maximum|too large/i.test(raw)) return "기록이 Firestore 문서 한도를 넘어 저장하지 못했습니다. 기록은 이 기기에 저장되어 있습니다.";
    return "계정에 저장하지 못했습니다. 기록은 이 기기에 저장되어 있습니다.";
  }

  function notifyCloudError(err) {
    const code = String((err && err.code) || (err && err.message) || "unknown");
    const now = Date.now();
    if (code === lastCloudErrorCode && now - lastCloudErrorAt < 60000) return;
    lastCloudErrorCode = code;
    lastCloudErrorAt = now;
    showToast(cloudErrorText(err), "warn", 7000);
    refreshSettingsIfOpen();
  }

  async function writeCloudState(fb, serialized) {
    const { dbMod } = fb;
    const bytes = jsonBytes(serialized);
    if (bytes > CLOUD_MAX_BYTES) {
      const err = new Error("state too large");
      err.code = "state-too-large";
      throw err;
    }
    const stateRef = cloudStateRef(fb);
    const partsRef = cloudPartsRef(fb);
    const stamp = Date.now();
    if (bytes <= CLOUD_SINGLE_DOC_BYTES) {
      await dbMod.setDoc(stateRef, { schema: 2, state: JSON.parse(serialized), bytes, updatedAt: stamp, appVersion: APP_VERSION });
      const old = await dbMod.getDocs(partsRef);
      if (!old.empty) await Promise.all(old.docs.map(d => dbMod.deleteDoc(d.ref)));
    } else {
      const parts = [];
      for (let i = 0; i < serialized.length; i += CLOUD_CHUNK_CHARS) parts.push(serialized.slice(i, i + CLOUD_CHUNK_CHARS));
      await Promise.all(parts.map((chunk, i) => dbMod.setDoc(dbMod.doc(partsRef, "p" + i), { i, data: chunk, updatedAt: stamp })));
      await dbMod.setDoc(stateRef, { schema: 2, parts: parts.length, bytes, updatedAt: stamp, appVersion: APP_VERSION });
      const old = await dbMod.getDocs(partsRef);
      const stale = old.docs.filter(d => {
        const n = Number(String(d.id).replace(/^p/, ""));
        return !(Number.isFinite(n) && n >= 0 && n < parts.length);
      });
      if (stale.length) await Promise.all(stale.map(d => dbMod.deleteDoc(d.ref)));
    }
    cloudBytes = bytes;
    lastCloudAt = new Date();
    writeCloudBaseline(stamp);
  }

  async function readCloudState(fb) {
    const { dbMod } = fb;
    const snap = await dbMod.getDoc(cloudStateRef(fb));
    if (!snap.exists()) return { state: null, updatedAt: 0, bytes: 0 };
    const data = snap.data() || {};
    if (data.state && typeof data.state === "object") {
      return { state: data.state, updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || 0 };
    }
    const partCount = Number(data.parts) || 0;
    if (partCount <= 0) return { state: null, updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || 0 };
    const shots = await dbMod.getDocs(cloudPartsRef(fb));
    const list = shots.docs.map(d => {
      const row = d.data() || {};
      const num = Number(row.i);
      return {
        i: Number.isFinite(num) ? num : Number(String(d.id).replace(/^p/, "")),
        data: String(row.data || "")
      };
    }).sort((a, b) => a.i - b.i);
    const json = list.map(x => x.data).join("");
    if (!json) return { state: null, updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || 0 };
    return { state: JSON.parse(json), updatedAt: Number(data.updatedAt) || 0, bytes: Number(data.bytes) || jsonBytes(json) };
  }

  // 저장은 1.5초 쉬었다가 한 번에 (글자를 칭 때마다 Firestore를 두드리지 않게)
  function scheduleCloudPush(delay = 1500) {
    if (!isFirebaseConfigured() || !authUser) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(() => { cloudTimer = null; pushCloudState(); }, delay);
  }

  async function pushCloudState() {
    if (!isFirebaseConfigured() || !authUser) return false;
    if (cloudSyncing) { cloudPending = true; return false; }
    clearTimeout(cloudTimer);
    cloudTimer = null;
    cloudSyncing = true;
    let ok = false;
    try {
      const fb = await getFirebase();
      if (!fb) return false;
      const serialized = JSON.stringify(state);
      if (serialized === lastPushedSerialized) {
        lastCloudAt = new Date();
        return true;
      }
      await writeCloudState(fb, serialized);
      lastPushedSerialized = serialized;
      lastCloudErrorCode = "";
      ok = true;
      refreshSettingsIfOpen();
    } catch (err) {
      notifyCloudError(err);
    } finally {
      cloudSyncing = false;
      if (cloudPending) { cloudPending = false; scheduleCloudPush(800); }
    }
    return ok;
  }

  // ---------- 기기 기록과 계정 기록 합치기 ----------
  function cleanUndefined(value) {
    if (Array.isArray(value)) return value.map(cleanUndefined);
    if (value && typeof value === "object") {
      const out = {};
      Object.keys(value).forEach(k => { if (value[k] !== undefined) out[k] = cleanUndefined(value[k]); });
      return out;
    }
    return value;
  }

  function isEmptyText(v) {
    return !String(v == null ? "" : v).trim();
  }

  function mergeImageLists(a, b) {
    const out = [];
    [...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])].forEach(src => {
      if (!src) return;
      const exists = out.some(x => (typeof src === "string" ? x === src : JSON.stringify(x) === JSON.stringify(src)));
      if (!exists) out.push(src);
    });
    return out;
  }

  function mergeLogEntry(localLog, cloudLog) {
    const l = (localLog && typeof localLog === "object") ? localLog : {};
    const c = (cloudLog && typeof cloudLog === "object") ? cloudLog : {};
    const out = { ...c, ...l };
    ["oneLine", "diary", "memo", "text"].forEach(k => {
      if (k in c && isEmptyText(l[k]) && !isEmptyText(c[k])) out[k] = c[k];
    });
    const images = mergeImageLists(normalizeImages(l), normalizeImages(c));
    if (images.length) out.images = images;
    return cleanUndefined(out);
  }

  // 같은 id는 이 기기 내용을 기준으로 하고, 계정 쪽에만 있는 항목은 더합니다.
  function mergeItemLists(localList, cloudList) {
    const out = [];
    const index = new Map();
    (Array.isArray(localList) ? localList : []).forEach(item => {
      if (!item || !item.id || index.has(item.id)) return;
      index.set(item.id, out.length);
      out.push({ ...item });
    });
    let added = 0;
    (Array.isArray(cloudList) ? cloudList : []).forEach(item => {
      if (!item || !item.id) return;
      const at = index.get(item.id);
      if (at === undefined) {
        index.set(item.id, out.length);
        out.push({ ...item });
        added += 1;
        return;
      }
      const local = out[at];
      const merged = { ...item, ...local };
      Object.keys(item).forEach(k => {
        if (k === "images") return;
        const cur = merged[k];
        const emptyCur = cur === undefined || cur === null || cur === "" || (Array.isArray(cur) && !cur.length);
        if (emptyCur && item[k] !== undefined && item[k] !== null && item[k] !== "") merged[k] = item[k];
      });
      const images = mergeImageLists(normalizeImages(local), normalizeImages(item));
      if (images.length) merged.images = images;
      out[at] = merged;
    });
    return { list: out, added };
  }

  function mergeCategoryList(localList, cloudList, fallbackIcon) {
    const out = normalizeCategoryList(localList, fallbackIcon);
    const names = new Set(out.map(c => c.name));
    normalizeCategoryList(cloudList, fallbackIcon).forEach(c => {
      if (!names.has(c.name)) { names.add(c.name); out.push(c); }
    });
    return out;
  }

  // 연도 책은 id가 아니라 year로 구분합니다.
  function mergeYearBookList(localList, cloudList) {
    const out = normalizeYearBooks(localList);
    const years = new Set(out.map(b => Number(b.year)));
    normalizeYearBooks(cloudList).forEach(b => {
      if (years.has(Number(b.year))) return;
      years.add(Number(b.year));
      out.push(b);
    });
    return out.sort((a, b) => a.year - b.year);
  }

  function mergeStates(localState, cloudState) {
    const local = normalizeState(localState);
    const cloud = normalizeState(cloudState);
    const stats = { logsAdded: 0, itemsAdded: 0 };
    const merged = { ...local };

    const localLogs = local.logs || {};
    const cloudLogs = cloud.logs || {};
    const logs = {};
    const dates = new Set([...Object.keys(cloudLogs), ...Object.keys(localLogs)]);
    dates.forEach(date => {
      const l = localLogs[date];
      const c = cloudLogs[date];
      if (!l) {
        logs[date] = c;
        if (!DEFAULT_LOG_DATES.has(date)) stats.logsAdded += 1;
        return;
      }
      logs[date] = c ? mergeLogEntry(l, c) : l;
    });
    merged.logs = logs;

    ["goals", "buckets", "archives", "todos", "books"].forEach(key => {
      const res = mergeItemLists(local[key], cloud[key]);
      merged[key] = res.list;
      stats.itemsAdded += res.added;
    });
    merged.yearBooks = mergeYearBookList(local.yearBooks, cloud.yearBooks);
    merged.topics = mergeCategoryList(local.topics, cloud.topics, "target");
    merged.archiveCategories = mergeCategoryList(local.archiveCategories, cloud.archiveCategories, "folder");
    merged.bucketCategories = mergeCategoryList(local.bucketCategories, cloud.bucketCategories, "star");
    merged.booksSeeded = Boolean(local.booksSeeded || cloud.booksSeeded);
    return { state: cleanUndefined(normalizeState(merged)), stats };
  }

  async function adoptCloudState(manual = false) {
    if (cloudAdopting) return;
    cloudAdopting = true;
    try {
      await adoptCloudStateInner(manual);
    } finally {
      cloudAdopting = false;
    }
  }

  async function adoptCloudStateInner(manual = false) {
    if (!isFirebaseConfigured() || !authUser) return;
    let cloud;
    try {
      const fb = await getFirebase();
      if (!fb) return;
      cloud = await readCloudState(fb);
    } catch (err) {
      notifyCloudError(err);
      return;
    }
    const localUntouched = isUntouchedNewDefault(state);

    // 계정이 비어 있으면 이 기기 기록을 그대로 올립니다.
    if (!cloud.state) {
      lastPushedSerialized = "";
      const ok = await pushCloudState();
      if (ok && !localUntouched) showToast("이 기기의 기록을 계정에 처음 올렸습니다.", "ok", 4000);
      return;
    }

    // 이 기기가 예시 그대로면 계정 기록을 그대로 불러옵니다.
    if (localUntouched) {
      state = normalizeState(cloud.state);
      saveState({ skipCloud: true });
      lastPushedSerialized = JSON.stringify(state);
      cloudBytes = cloud.bytes || jsonBytes(lastPushedSerialized);
      lastCloudAt = new Date();
      writeCloudBaseline(cloud.updatedAt);
      render();
      refreshSettingsIfOpen();
      if (manual) showToast("계정에 저장된 기록을 불러왔습니다.", "ok", 4000);
      return;
    }

    const localCanon = stableStringify(state);
    const cloudCanon = stableStringify(cloud.state);

    // 이 기기가 마지막으로 맞춘 뒤 계정 쪽이 변하지 않았다면, 이 기기 기록이 기준입니다.
    // (기기에서 지운 항목이 계정 때문에 되살아나지 않게)
    const baseline = readCloudBaseline(authUser.uid);
    const cloudChanged = Number(cloud.updatedAt) > baseline;

    if (localCanon === cloudCanon) {
      lastPushedSerialized = JSON.stringify(state);
      lastCloudAt = new Date();
      cloudBytes = cloud.bytes || jsonBytes(localCanon);
      writeCloudBaseline(cloud.updatedAt);
      refreshSettingsIfOpen();
      if (manual) showToast("계정과 이미 같은 기록입니다.", "info", 2800);
      return;
    }

    if (!cloudChanged) {
      const ok = await pushCloudState();
      if (manual && ok) showToast("이 기기의 기록을 계정에 올렸습니다.", "ok", 3500);
      return;
    }

    // 양쪽 모두에 기록이 있고 계정 쪽이 새로 바뀌었을 때만 안전하게 합칩니다.
    const result = mergeStates(state, cloud.state);
    state = result.state;
    saveState({ skipCloud: true });
    const mergedCanon = stableStringify(state);

    if (mergedCanon === cloudCanon) {
      lastPushedSerialized = JSON.stringify(state);
      cloudBytes = cloud.bytes || jsonBytes(mergedCanon);
      lastCloudAt = new Date();
      writeCloudBaseline(cloud.updatedAt);
      render();
      refreshSettingsIfOpen();
      if (manual) showToast("계정 기록과 같아졌습니다.", "ok", 3000);
      return;
    }

    lastPushedSerialized = "";
    render();
    const ok = await pushCloudState();
    const bits = [];
    if (result.stats.logsAdded) bits.push(`일기 ${result.stats.logsAdded}일`);
    if (result.stats.itemsAdded) bits.push(`항목 ${result.stats.itemsAdded}개`);
    if (ok) {
      showToast(bits.length
        ? `이 기기 기록과 계정 기록을 합쳤습니다 (${bits.join(" · ")} 추가).`
        : "이 기기 기록과 계정 기록을 합쳐 저장했습니다.", "ok", 5000);
    }
  }

  async function syncAccountNow() {
    if (!authUser) { openAuthScreen(); return; }
    await adoptCloudState(true);
  }

  // Firebase Authentication이 아직 시작되지 않은 프로젝트인지 미리 확인합니다.
  async function probeAuthConfig() {
    if (!isFirebaseConfigured()) return "unknown";
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => { try { ctrl.abort(); } catch (_) {} }, 5000);
      const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${encodeURIComponent(FIREBASE_CONFIG.apiKey)}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identifier: "probe@example.com", continueUri: location.origin + location.pathname }),
        signal: ctrl.signal
      });
      clearTimeout(timer);
      const data = await res.json().catch(() => null);
      const message = String((data && data.error && data.error.message) || "");
      if (message === "CONFIGURATION_NOT_FOUND") return "not-configured";
      return "ok";
    } catch (_) {
      return "unknown";
    }
  }

  async function bootstrapAuth() {
    if (!isFirebaseConfigured()) return;
    // Firebase Authentication이 준비되지 않은 프로젝트라면 SDK(수백 KB)를 내려받지 않고
    // 첫 화면에서 바로 안내합니다. 준비되어 있으면 그때 SDK를 불러와 로그인 상태를 확인합니다.
    authConfigState = await probeAuthConfig();
    if (authConfigState === "not-configured") {
      if (!hasChosenLocalMode() && !hasSkippedAuthPrompt()) {
        openAuthScreen();
        return;
      }
      if (!authStartupNoticeShown) {
        authStartupNoticeShown = true;
        showToast("Firebase 로그인 설정이 아직 완료되지 않았습니다. Firebase 콘솔 → Authentication에서 시작해 주세요.", "warn", 6500);
      }
      return;
    }
    let fb = null;
    try {
      fb = await getFirebase();
    } catch (err) {
      console.warn("[planner] Firebase 모듈을 불러오지 못했습니다", err);
      return;
    }
    if (!fb) return;
    try {
      if (fb.authMod.authStateReady) {
        await Promise.race([
          fb.authMod.authStateReady(fb.auth),
          new Promise(resolve => setTimeout(resolve, 5000))
        ]);
      }
    } catch (err) {
      if (err && String(err.code || "").includes("configuration")) authConfigState = "not-configured";
    }

    if (authUser) return;
    if (authConfigState === "not-configured") {
      if (!hasChosenLocalMode() && !hasSkippedAuthPrompt()) {
        openAuthScreen();
        return;
      }
      if (!authStartupNoticeShown) {
        authStartupNoticeShown = true;
        showToast("Firebase 로그인 설정이 아직 완료되지 않았습니다. Firebase 콘솔 → Authentication에서 시작해 주세요.", "warn", 6500);
      }
      return;
    }
    if (!hasChosenLocalMode() && !hasSkippedAuthPrompt()) openAuthScreen();
  }

  function renderSettingsBody() {
    const body = document.getElementById("settingsBody");
    if (!body) return;
    const usage = getStorageUsage();
    const limit = 5 * 1024 * 1024;
    const pct = Math.min(100, Math.round((usage.bytes / limit) * 100));
    const photos = getPhotoCount();
    const totalItems = (state.logs ? Object.keys(state.logs).length : 0) + (state.goals ? state.goals.length : 0) +
      (state.buckets ? state.buckets.length : 0) + (state.archives ? state.archives.length : 0) +
      (state.todos ? state.todos.length : 0);
    const configured = isFirebaseConfigured();
    body.innerHTML = `
      <div class="settings-section">
        <h4>계정 · 동기화</h4>
        ${authUser ? `
          <div class="account-row">
            <span class="account-badge">${escapeHtml((authUser.email || authUser.name || "?").slice(0, 1).toUpperCase())}</span>
            <div class="account-text">
              <strong>${escapeHtml(authUser.email || authUser.name || "로그인됨")}</strong>
              <span>${configured ? (lastCloudAt ? `Firestore 동기화 · ${timeStr(lastCloudAt)}` : "Firestore 동기화 사용 중") : "로컬 모드"}</span>
            </div>
            <button class="btn btn-sm" onclick="signOutOfAccount()">로그아웃</button>
          </div>
          <div class="settings-actions" style="margin-top:8px;">
            <button class="btn btn-sm" onclick="syncAccountNow()">지금 동기화</button>
            ${cloudBytes ? `<span class="settings-hint" style="margin:0;align-self:center;">계정 기록 약 ${formatBytes(cloudBytes)}</span>` : ""}
          </div>
        ` : `
          <div class="account-row">
            <span class="account-badge">로</span>
            <div class="account-text">
              <strong>로컬 모드</strong>
              <span>${configured ? "로그인하면 기록이 계정에 동기화됩니다" : "기록은 이 브라우저에만 저장됩니다"}</span>
            </div>
            <button class="btn btn-sm" onclick="openAuthScreen()">로그인</button>
          </div>
        `}
      </div>
      <div class="settings-section">
        <h4>저장 공간</h4>
        <div class="storage-line"><strong>사용 중 약 ${formatBytes(usage.bytes)}</strong><span>/ 권장 한도 약 4~5MB</span></div>
        <div class="storage-track"><div class="storage-fill ${pct >= 80 ? "warn" : ""}" style="width:${pct}%;"></div></div>
        <p class="settings-hint">사진 ${photos}장 · 기록 ${totalItems}건. ${authUser ? "기록은 이 브라우저와 계정(Firestore)에 함께 저장됩니다. 둘 다 지우지 않도록 가끔 JSON으로 백업해 두세요." : "모든 기록은 이 브라우저(localStorage)에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라지니 가끔 JSON으로 백업해 두세요."}</p>
        ${lastSavedAt ? `<p class="settings-hint">마지막 저장: ${timeStr(lastSavedAt)}</p>` : ""}
        <p class="settings-hint">공간이 부족하면 저장이 되지 않을 수 있고, 그때는 사진을 줄이거나 백업 후 오래된 사진을 삭제해 주세요.</p>
      </div>
      <div class="settings-section">
        <h4>데이터 관리</h4>
        <div class="settings-actions">
          <button class="btn" onclick="exportBackup()">데이터 백업 (JSON)</button>
          <label class="btn" style="cursor:pointer;">백업 복원<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(event)" /></label>
          <button class="btn btn-danger-outline" onclick="clearSamples()">예시 지우기 · 전체 삭제</button>
        </div>
        <p class="settings-hint">‘예시 지우기’는 기본 예시뿐 아니라 모든 기록을 지웁니다. 되돌릴 수 없으니 먼저 백업을 권장합니다.</p>
      </div>
      <div class="settings-section">
        <h4>앱 정보</h4>
        <p class="settings-hint">아카이브 &amp; 플래너 v${APP_VERSION} · 저장 키 <code>${STORAGE_KEY}</code></p>
        ${state.migratedFrom ? `<p class="settings-hint">이전 버전(<code>${escapeHtml(state.migratedFrom)}</code>)의 기록을 안전하게 옮겨 왔습니다.</p>` : ""}
      </div>
    `;
  }

  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `archive_planner_backup_${TODAY_STR}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (_) {
      alert("백업 파일을 만드는 중 오류가 발생했습니다.");
    }
  }

  function importBackup(event) {
    const input = event.target;
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const parsed = JSON.parse(String(e.target.result));
        const isLegacy = !parsed.logs && !parsed.topics && looksLikeLegacyIndex(parsed);
        state = isLegacy ? (migrateLegacyIndex(parsed) || clone(defaultState)) : normalizeState(parsed);
        saveState();
        render();
        refreshSettingsIfOpen();
        alert("백업 데이터를 복원했습니다.");
      } catch (_) {
        alert("올바른 JSON 백업 파일이 아닙니다.");
      }
      input.value = "";
    };
    reader.onerror = () => {
      alert("파일을 읽는 중 오류가 발생했습니다.");
      input.value = "";
    };
    reader.readAsText(file);
  }

  // ---------- 공통 모달 ----------
  function openModal(title, bodyHtml, onSave) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHtml;
    document.getElementById("modalActions").innerHTML = `
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn btn-primary" id="modalSaveBtn">저장</button>
    `;
    const modal = document.getElementById("editModal");
    modal.classList.add("open");
    document.getElementById("modalSaveBtn").onclick = () => {
      const result = typeof onSave === "function" ? onSave() : true;
      if (result === false) return;
      closeModal();
      saveState();
      render();
      refreshCategoryManager();
      refreshSettingsIfOpen();
    };
  }

  function closeModal() {
    document.getElementById("editModal").classList.remove("open");
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, "&#39;");
  }

  // onclick 등 인라인 JS 문자열 인자용 (따옴표 안전 처리)
  function jsArg(val) {
    return escapeAttr(JSON.stringify(String(val == null ? "" : val)));
  }

  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.addEventListener("click", () => setTab(btn.dataset.tab));
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      if (document.getElementById("lightbox").classList.contains("open")) { closeLightbox(); return; }
      if (document.getElementById("editModal").classList.contains("open")) { closeModal(); return; }
      if (document.getElementById("catModal").classList.contains("open")) { closeCategoryManager(); return; }
      if (document.getElementById("settingsModal").classList.contains("open")) { closeSettings(); return; }
      if (searchOpen) { closeSearch(); return; }
      const authEl = document.getElementById("authScreen");
      if (authEl && authEl.classList.contains("open")) { closeAuthScreen(); return; }
    }
    if (document.getElementById("lightbox").classList.contains("open")) {
      if (event.key === "ArrowLeft") lightboxStep(-1);
      else if (event.key === "ArrowRight") lightboxStep(1);
    }

    // 노트북 · 연도 책 넘기기 (입력 중이거나 모달이 열려 있을 때는 결과)
    const tagName = (event.target && event.target.tagName) || "";
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tagName) || (event.target && event.target.isContentEditable);
    const modalOpen = ["editModal", "settingsModal", "catModal", "lightbox"].some(id => {
      const el = document.getElementById(id);
      return el && el.classList.contains("open");
    });
    if (!typing && !modalOpen) {
      if (state.activeTab === "year") {
        if (yearDayDate) {
          if (event.key === "ArrowLeft") { stepYearDay(-1); return; }
          if (event.key === "ArrowRight") { stepYearDay(1); return; }
        } else if (yearBookYear) {
          if (event.key === "ArrowLeft") { yearPageStep(-1); return; }
          if (event.key === "ArrowRight") { yearPageStep(1); return; }
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          yearShelfStep(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }
      } else if (state.activeTab === "archive") {
        if (notebookBookId) {
          if (event.key === "ArrowLeft") { notebookStep(-1); return; }
          if (event.key === "ArrowRight") { notebookStep(1); return; }
        } else if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
          shelfStep(event.key === "ArrowLeft" ? -1 : 1);
          return;
        }
      }
    }
  });

  const mobileMq = window.matchMedia ? window.matchMedia("(max-width: 860px)") : null;
  if (mobileMq) {
    const onMqChange = () => {
      const onShelf = (state.activeTab === "year" && !yearBookYear) || (state.activeTab === "archive" && !notebookBookId);
      if (state.yearViewMode === "auto" || onShelf) render();
    };
    if (mobileMq.addEventListener) mobileMq.addEventListener("change", onMqChange);
    else if (mobileMq.addListener) mobileMq.addListener(onMqChange);
  }

  // 테스트/디버깅용 (화면에는 영향 없음)
  window.__planner = {
    version: APP_VERSION,
    getState: () => state,
    getYearViewMode,
    getStorageUsage,
    getPhotoCount,
    render,
    setTab,
    selectDate,
    toggleGoalFilters,
    toggleBucketFilters,
    openGoalModal,
    openBucketModal,
    renderGoalBookView,
    jumpGoalTopic,
    goalBookStep,
    setGoalBookSide,
    yearQuarterJump,
    goalBookTopics,
    openSearch,
    closeSearch,
    openSettings,
    closeSettings,
    openAuthScreen,
    closeAuthScreen,
    isFirebaseConfigured,
    showToast,
    pushCloudState,
    syncAccountNow,
    mergeStates,
    getCloudInfo: () => ({
      configured: isFirebaseConfigured(),
      uid: authUser ? authUser.uid : null,
      email: authUser ? authUser.email : "",
      authConfigState,
      lastCloudAt: lastCloudAt ? lastCloudAt.toISOString() : null,
      cloudBytes,
      syncing: cloudSyncing,
      baseline: authUser ? readCloudBaseline(authUser.uid) : 0
    }),
    openCategoryManager,
    closeCategoryManager,
    openLightbox,
    closeLightbox,
    openNotebook,
    closeNotebookBook,
    notebookStep,
    selectShelfBook,
    shelfStep,
    openBookModal,
    openNewArchiveModal,
    openEditArchive,
    openEditGoal,
    openYearBook,
    openYearBookModal,
    setYearBook,
    getYearBooks,
    closeYearBook,
    openTodayYearBook,
    openYearPage,
    yearPageStep,
    openYearDay,
    closeYearDay,
    stepYearDay,
    setNotebookSide,
    flipNotebookPage,
    getNotebookState: () => ({
      bookId: notebookBookId,
      page: notebookPageIndex,
      yearBook: yearBookYear,
      yearPage: yearPageIndex,
      yearDay: yearDayDate,
      goalTopic: state.goalBookTopic,
      mobileSide: notebookMobileSide
    }),
    errors: () => window.__errors
  };

  // 화면을 닫거나 앱이 백그라운드로 가기 전에 남은 동기화를 밀어 보냅니다 (모바일 Safari 대비)
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden" && cloudTimer) {
      clearTimeout(cloudTimer);
      cloudTimer = null;
      pushCloudState();
    }
  });
  window.addEventListener("pagehide", () => {
    if (cloudTimer) {
      clearTimeout(cloudTimer);
      cloudTimer = null;
      pushCloudState();
    }
  });

  mountNavIcons();
  render();
  bootstrapAuth();
</script>
</body>
</html>
