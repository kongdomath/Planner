  // ---------- 이전 버전(archive_planner_index_v2_3) 데이터 이전 ----------
  function guessIconByName(name) {
    const n = String(name || "");
    const rules = [
      [/학업|공부|전공|시험|임용|교육|수학/, "book"],
      [/운동|건강|헬스|근력/, "dumbbell"],
      [/독서|책|문화|전시|예술|그림/, "palette"],
      [/자산|경제|재테크|투자|돈/, "chart"],
      [/생활|루틴|습관|일상/, "leaf"],
      [/여행|탐험|해외/, "compass"],
      [/음악|공연|LP/, "music"],
      [/차|미식|커피|음료/, "coffee"]
    ];
    for (const [re, key] of rules) {
      if (re.test(n)) return key;
    }
    return null;
  }

  function looksLikeLegacyIndex(obj) {
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) return false;
    if (obj.logs || obj.topics) return false;
    return (
      Array.isArray(obj.archives) ||
      (obj.diaries && typeof obj.diaries === "object") ||
      Array.isArray(obj.goalCategories) ||
      "selectedArchiveCat" in obj ||
      "calMode" in obj ||
      "calYear" in obj
    );
  }

  function isUntouchedLegacySample(obj) {
    const archives = Array.isArray(obj.archives) ? obj.archives : [];
    const goals = Array.isArray(obj.goals) ? obj.goals : [];
    const buckets = Array.isArray(obj.buckets) ? obj.buckets : [];
    const diaryDates = (obj.diaries && typeof obj.diaries === "object" && !Array.isArray(obj.diaries)) ? Object.keys(obj.diaries) : [];
    return (
      archives.every(a => LEGACY_SAMPLE.archives.includes(a && a.title)) &&
      goals.every(g => LEGACY_SAMPLE.goals.includes(g && g.title)) &&
      buckets.every(b => LEGACY_SAMPLE.buckets.includes(b && b.title)) &&
      diaryDates.every(d => LEGACY_SAMPLE.diaryDates.includes(d))
    );
  }

  function migrateLegacyIndex(parsed) {
    if (!looksLikeLegacyIndex(parsed)) return null;
    if (isUntouchedLegacySample(parsed)) return null;

    const base = clone(defaultState);
    const topics = [];
    (Array.isArray(parsed.goalCategories) ? parsed.goalCategories : []).forEach(raw => {
      const name = String(raw && raw.name ? raw.name : raw || "").trim();
      if (name && !topics.some(t => t.name === name)) {
        topics.push({ name, icon: resolveIconKey(raw && raw.icon, guessIconByName(name) || "target") });
      }
    });

    const archiveCategories = [];
    (Array.isArray(parsed.archiveCategories) ? parsed.archiveCategories : []).forEach(raw => {
      const name = String(raw && raw.name ? raw.name : raw || "").trim();
      if (name && !archiveCategories.some(c => c.name === name)) {
        archiveCategories.push({ name, icon: resolveIconKey(raw && raw.icon, guessIconByName(name) || "folder") });
      }
    });

    const logs = {};
    if (parsed.diaries && typeof parsed.diaries === "object" && !Array.isArray(parsed.diaries)) {
      Object.entries(parsed.diaries).forEach(([dateStr, value]) => {
        if (!value || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
        const oneLine = String(value.summary || value.oneLine || "").trim();
        const diary = String(value.body || value.diary || "").trim();
        if (oneLine || diary) logs[dateStr] = { oneLine, diary };
      });
    }

    const goals = (Array.isArray(parsed.goals) ? parsed.goals : []).map(g => {
      const title = String(g && g.title || "").trim();
      if (!title) return null;
      let topic = String(g.category || g.topic || "").trim();
      if (!topic) topic = topics[0] ? topics[0].name : "기타";
      if (!topics.some(t => t.name === topic)) {
        topics.push({ name: topic, icon: guessIconByName(topic) || "target" });
      }
      return {
        id: g.id || uid(),
        topic,
        year: normalizeYear(g.year),
        period: normalizePeriod(g.period),
        title,
        note: String(g.note || g.detail || "").trim(),
        images: [],
        done: Boolean(g.done),
        doneDate: String(g.doneDate || "").trim()
      };
    }).filter(Boolean);

    const bucketCategories = [];
    const buckets = (Array.isArray(parsed.buckets) ? parsed.buckets : []).map(b => {
      const title = String(b && b.title || "").trim();
      if (!title) return null;
      let category = String(b.category || "").trim() || "경험";
      if (!bucketCategories.some(c => c.name === category)) {
        bucketCategories.push({ name: category, icon: guessIconByName(category) || "star" });
      }
      return {
        id: b.id || uid(),
        category,
        title,
        note: String(b.note || b.detail || "").trim(),
        done: Boolean(b.done),
        doneDate: String(b.doneDate || "").trim()
      };
    }).filter(Boolean);

    const archives = (Array.isArray(parsed.archives) ? parsed.archives : []).map(a => {
      const title = String(a && a.title || "").trim();
      if (!title) return null;
      const category = String(a.category || "").trim() || (archiveCategories[0] ? archiveCategories[0].name : "기타");
      if (!archiveCategories.some(c => c.name === category)) {
        archiveCategories.push({ name: category, icon: guessIconByName(category) || "folder" });
      }
      return {
        id: a.id || uid(),
        category,
        date: String(a.date || TODAY_STR).trim(),
        title,
        subtitle: String(a.subtitle || "").trim(),
        note: String(a.note || "").trim(),
        images: a.coverUrl ? [a.coverUrl] : []
      };
    }).filter(Boolean);

    const calYear = Number(parsed.calYear);
    const yearFilter = YEARS.includes(calYear) ? String(calYear) : base.yearFilter;
    const selectedDate = /^\d{4}-\d{2}-\d{2}$/.test(String(parsed.diaryDate || "")) ? parsed.diaryDate : base.selectedDate;

    return {
      ...base,
      activeTab: normalizeTab(parsed.activeTab),
      yearFilter,
      selectedDate,
      logs,
      topics: topics.length ? topics : base.topics,
      archiveCategories: archiveCategories.length ? archiveCategories : base.archiveCategories,
      bucketCategories: bucketCategories.length ? bucketCategories : base.bucketCategories,
      goals,
      buckets,
      archives,
      todos: [],
      migratedFrom: LEGACY_INDEX_KEY
    };
  }

  function loadState() {
    let untouchedNewState = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          const normalized = normalizeState(parsed);
          // 예시 그대로인 새 상태는 이전 버전 데이터가 있으면 그쪽을 살린다
          if (!isUntouchedNewDefault(normalized)) return normalized;
          untouchedNewState = normalized;
        }
      }
    } catch (_) { /* 손상된 v8 데이터는 아래 후보에서 복구 */ }

    for (const key of LEGACY_PERSONAL_KEYS) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) continue;
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return normalizeState(parsed);
      } catch (_) { /* 다음 후보 */ }
    }

    try {
      const rawLegacy = localStorage.getItem(LEGACY_INDEX_KEY);
      if (rawLegacy) {
        const parsed = JSON.parse(rawLegacy);
        const migrated = migrateLegacyIndex(parsed);
        if (migrated) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated)); } catch (_) {}
          return migrated;
        }
      }
    } catch (_) { /* 이전 데이터가 깨졌으면 새 기본값으로 */ }

    return untouchedNewState || clone(defaultState);
  }

  function stableStringify(value) {
    if (Array.isArray(value)) return "[" + value.map(stableStringify).join(",") + "]";
    if (value && typeof value === "object") {
      return "{" + Object.keys(value).sort().map(k => JSON.stringify(k) + ":" + stableStringify(value[k])).join(",") + "}";
    }
    return JSON.stringify(value === undefined ? null : value);
  }

  function isUntouchedNewDefault(s) {
    const keys = ["logs", "goals", "buckets", "archives", "todos", "topics", "bucketCategories", "archiveCategories"];
    return keys.every(k => stableStringify(s[k]) === stableStringify(defaultState[k]));
  }

  function saveState() {

      const msg = `${(e && e.name) || ""} ${(e && e.message) || ""}`;

      if (isQuota) {

        }
      } else {
        console.error(e);
      }
      return false;
    }
  }

  function getStorageUsage() {
    let bytes = 0;
    let keys = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key === null) continue;
        const value = localStorage.getItem(key) || "";
        bytes += (key.length + value.length) * 2; // UTF-16 기준 추정
        keys += 1;
      }
    } catch (_) {}
    return { bytes, keys };
  }

  function formatBytes(bytes) {
    if (!bytes || bytes < 1024) return `${bytes || 0} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
  }

  function getDayOfWeek(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d).getDay();
  }

  function isHoliday(dateStr) {
    return Boolean(HOLIDAYS[dateStr]);

  function getDateColor(dateStr) {
    if (isHoliday(dateStr)) return "var(--sun)";
    const dow = getDayOfWeek(dateStr);
    if (dow === 0) return "var(--sun)";
    if (dow === 6) return "var(--sat)";
    return "var(--text)";
  }

  function shiftDate(dateStr, deltaDays) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d + deltaDays);
    const ny = dt.getFullYear();
    const nm = String(dt.getMonth() + 1).padStart(2, "0");
    const nd = String(dt.getDate()).padStart(2, "0");
    return `${ny}-${nm}-${nd}`;
  }

  function formatDateKo(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = new Date(y, m - 1, d).getDay();
    const hName = HOLIDAYS[dateStr] ? ` · ${HOLIDAYS[dateStr]}` : "";
    return `${y}년 ${m}월 ${d}일 (${days[dow]})${hName}`;
  }

  function compressImageFile(file, maxWidth = 720, quality = 0.76) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function processMultipleFiles(fileList, existingArray, maxCount = 5) {
    const files = Array.from(fileList || []);
    const result = [...existingArray];
    for (const file of files) {
      if (result.length >= maxCount) {
        alert(`사진은 항목당 최대 ${maxCount}장까지 첨부할 수 있습니다.`);
        break;
      }
      const dataUrl = await compressImageFile(file);
      result.push(dataUrl);
    }
    return result;
  }

  function yearSelectHtml(currentVal, onChangeFn, allLabel = `전체 연도 (${YEARS[0]}~${YEARS[YEARS.length - 1]})`) {
    const normCur = currentVal === "all" ? "all" : normalizeYear(currentVal);
    const opts = getYearOptions().map(y => `<option value="${y}" ${normCur === String(y) ? "selected" : ""}>${y}년</option>`).join("");
    return `
      <select class="year-select" onchange="${onChangeFn}(this.value)" aria-label="연도 선택">
        <option value="all" ${normCur === "all" ? "selected" : ""}>${allLabel}</option>
        ${opts}
      </select>
    `;
  }

  function changeYearFilter(val) {
    state.yearFilter = val;
    saveState();
    render();
  }

  function isMobileViewport() {
    try {
      return window.matchMedia("(max-width: 860px)").matches;
    } catch (_) {
      return window.innerWidth <= 860;
    }
  }

  function getYearViewMode() {
    if (state.yearViewMode === "matrix" || state.yearViewMode === "months") return state.yearViewMode;
    return isMobileViewport() ? "months" : "matrix";
  }

  function setYearViewMode(mode) {
    state.yearViewMode = mode;
    saveState();
    render();
  }

  function jumpToMonthCard(year, month) {
    const el = document.getElementById(`month-card-${year}-${month}`);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function setTab(tab) {
    flushDiaryDraft();
    const next = normalizeTab(tab);
    state.activeTab = next;
    yearDayDate = "";
    if (next === "archive") notebookBookId = "";
    saveState();
    render();
  }

  function selectDate(dateStr, openDay = false) {
    if (openDay) {
      openYearDay(dateStr);
      return;
    }
    flushDiaryDraft();
    state.selectedDate = dateStr;
    saveState();
    render();
  }

  // ---------- 공통 검색 ----------
  function openSearch() {
    searchOpen = true;
    render();
    try { if (typeof window.scrollTo === "function") window.scrollTo({ top: 0, behavior: "smooth" }); } catch (_) {}
    const inp = document.getElementById("globalSearchInput");
    if (inp) {
      inp.focus();
      const len = inp.value.length;
      try { inp.setSelectionRange(len, len); } catch (_) {}
    }
  }

  function closeSearch() {
    searchOpen = false;
    searchQuery = "";
    render();
  }

  function updateSearchQuery(val) {
    searchQuery = val;
    const host = document.getElementById("searchResultsHost");
    if (host) host.innerHTML = renderSearchResults();
  }

  function findSearchResults(q) {
    const term = String(q || "").trim().toLowerCase();
    if (!term) return [];
    const results = [];
    const hits = text => String(text || "").toLowerCase().includes(term);

    Object.entries(state.logs || {}).forEach(([dateStr, log]) => {
      const one = String(log && log.oneLine || "");
      const diary = String(log && log.diary || "");
      if (hits(one) || hits(diary)) {
        const snippet = hits(one) ? one : diary.replace(/\s+/g, " ").slice(0, 90);
        results.push({
          type: "기록 · 일기",
          title: one || `${dateStr} 일기`,
          sub: `${dateStr} · ${snippet}`,
          action: () => selectDate(dateStr, true)
        });
      }
    });

    (state.goals || []).forEach(g => {
      if (hits(g.title) || hits(g.topic) || hits(g.note)) {
        results.push({
          type: "목표",
          title: String(g.title || ""),
          sub: `${g.topic || ""} · ${normalizeYear(g.year)}년 ${normalizePeriod(g.period)}`,
          action: () => {
            state.goalTopicFilter = "all";
            state.goalYearFilter = "all";
            state.goalPeriodFilter = "all";
            setTab("goals");
          }
        });
      }
    });

    (state.buckets || []).forEach(b => {
      if (hits(b.title) || hits(b.note) || hits(b.category)) {
        results.push({
          type: "버킷리스트",
          title: String(b.title || ""),
          sub: `${b.category || ""}${b.note ? ` · ${b.note}` : ""}`,
          action: () => {
            state.bucketCatFilter = "all";
            setTab("bucket");
          }
        });
      }
    });

    (state.archives || []).forEach(a => {
      if (hits(a.title) || hits(a.subtitle) || hits(a.note) || hits(a.category)) {
        results.push({
          type: `아카이브 · ${a.category || ""}`,
          title: String(a.title || ""),
          sub: `${a.date || ""}${a.subtitle ? ` · ${a.subtitle}` : ""}`,
          action: () => {
            state.activeTab = "archive";
            yearDayDate = "";
            if (a.bookId) {
              notebookBookId = a.bookId;
              state.shelfSelectedBookId = a.bookId;
              const recs = bookArchives(a.bookId);
              notebookPageIndex = Math.max(0, recs.findIndex(r => r.id === a.id));
              notebookMobileSide = "left";
            } else {
              notebookBookId = "";
            }
            saveState();
            render();
          }
        });
      }
    });

    (state.todos || []).forEach(t => {
      if (hits(t.title)) {
        results.push({
          type: "할일",
          title: String(t.title || ""),
          sub: t.date || "",
          action: () => selectDate(t.date, true)
        });
      }
    });

    return results;
  }

  function renderSearchResults() {
    const term = searchQuery.trim();
    if (!term) {
      return `<p class="search-empty">기록 · 일기 · 목표 · 버킷 · 아카이브를 한번에 찾습니다. 검색어를 입력해 주세요.</p>`;
    }
    const list = findSearchResults(term);
    currentSearchList = list;
    if (!list.length) {
      return `<p class="search-empty">“${escapeHtml(term)}”와 일치하는 기록이 없습니다.</p>`;
    }
    return `
      <div class="search-count"><span>“${escapeHtml(term)}” 검색 결과</span><span>${list.length}건</span></div>
      <div class="search-result-list">
        ${list.map((item, i) => `
          <div class="search-result-item" onclick="runSearchAction(${i})">
            <div style="min-width:0;">
              <span class="pill">${escapeHtml(item.type)}</span>
              <strong style="font-size:13px; margin-left:4px;">${escapeHtml(item.title)}</strong>
              <div class="item-meta">${escapeHtml(item.sub)}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderSearchArea() {
    if (!searchOpen) return "";
    return `
      <div class="search-drawer" role="search">
        <div class="search-drawer-bar">
          <span class="sd-icon">${ICONS.search}</span>
          <input type="text" id="globalSearchInput" class="sd-input" placeholder="기록 · 일기 · 목표 · 버킷 · 아카이브 검색" value="${escapeAttr(searchQuery)}" oninput="updateSearchQuery(this.value)" aria-label="전체 검색" />
          <button class="sd-close" onclick="closeSearch()" title="검색 닫기" aria-label="검색 닫기">${ICONS.close}</button>
        </div>
        <div id="searchResultsHost">${renderSearchResults()}</div>
      </div>
    `;
  }

  function runSearchAction(idx) {
    const item = currentSearchList[idx];
    if (!item || typeof item.action !== "function") return;
    searchOpen = false;
    searchQuery = "";
    item.action();
  }

  // 탭별 공통 헤더 정보
  const TAB_META = {
    year: { label: "연력 · 일기", icon: "year", accent: "#93a6cb" },
    goals: { label: "목표", icon: "goals", accent: "#9cc6ab" },
    bucket: { label: "버킷리스트", icon: "bucket", accent: "#e2b78c" },
    archive: { label: "아카이브", icon: "archive", accent: "#b4a6d6" }
  };

  function renderAppHeader() {
    const tab = normalizeTab(state.activeTab);
    const meta = TAB_META[tab] || TAB_META.year;
    return `
      <div class="ah-inner" style="--ah-accent:${meta.accent}">
        <div class="ah-left">
          <span class="ah-brand">아카이브 &amp; 플래너</span>
          <span class="ah-sep"></span>
          <span class="ah-tab">${ICONS[meta.icon]}${meta.label}</span>
        </div>
        <div class="ah-right">
          <button class="ah-btn ${searchOpen ? "on" : ""}" onclick="openSearch()" title="전체 검색" aria-label="전체 검색">${ICONS.search}</button>
          <button class="ah-btn" onclick="openSettings()" title="설정 · 데이터 관리" aria-label="설정">${ICONS.settings}</button>
        </div>
      </div>
    `;
  }

  function updateNavUI() {
    document.querySelectorAll("[data-tab]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tab === state.activeTab);
    });
    const label = document.getElementById("sidebarDateLabel");
    if (label) label.textContent = `오늘 ${TODAY_STR}`;
  }

  function render() {
    if (diaryPending) flushDiaryDraft();
    state.activeTab = normalizeTab(state.activeTab);
    updateNavUI();
    const hdr = document.getElementById("appHeader");
    if (hdr) hdr.innerHTML = renderAppHeader();
    const sHost = document.getElementById("searchPanelHost");
    if (sHost) sHost.innerHTML = renderSearchArea();
    const main = document.getElementById("mainView");
    let bodyHtml = "";
    if (state.activeTab === "year") bodyHtml = renderYearView();
    else if (state.activeTab === "goals") bodyHtml = renderGoalsView();
    else if (state.activeTab === "bucket") bodyHtml = renderBucketView();
    else if (state.activeTab === "archive") bodyHtml = renderArchiveView();
    else bodyHtml = renderYearView();

    main.innerHTML = bodyHtml;
    bindNotebookGestures();
  }

  function getDayMeta(dateStr) {
    const log = state.logs[dateStr] || {};
    const hasDiary = Boolean(log.diary && log.diary.trim());
    const hasAchieved =
      state.goals.some(g => g.done && g.doneDate === dateStr) ||
      state.buckets.some(b => b.done && b.doneDate === dateStr);
    const hasArchive = state.archives.some(a => a.date === dateStr);
    const hasTodo = state.todos.some(t => t.date === dateStr);
    const hasAny = Boolean(log.oneLine || hasDiary || hasAchieved || hasArchive || hasTodo);
    return { log, hasDiary, hasAchieved, hasArchive, hasTodo, hasAny };
  }

  // 1년 연력 뷰 (달별 모아보기는 '기록 있는 날만' 고정)
  // ---------- 1년 연력: 연도별 책장 + 12개월 스프링 노트 ----------
  let yearShelfIndex = 0;
  let yearBookYear = 0;   // 0이면 책장 화면
  let yearPageIndex = 0;  // 0 ~ 11 (1월 ~ 12월)
  let yearDayDate = "";   // 값이 있으면 그 날짜의 하루 페이지
  let yearMobileSide = "left";

  // 선택된 책이 항상 가운데, 양옆에 이전/다음 책이 대칭으로 보이는 창(window)
  function shelfSlots(n, active, radius) {
    if (!n) return [];
    const out = [];
    for (let k = -radius; k <= radius; k++) {
      const i = active + k;
      out.push(i >= 0 && i < n ? { index: i, offset: k } : null);
    }
    return out;
  }

  function shelfRadius() {
    return isMobileViewport() ? 1 : 2;
  }

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function normalizeYearBooks(list) {
    const seen = new Set();
    const out = [];
    (Array.isArray(list) ? list : []).forEach((b, i) => {
      const y = Number(b && b.year);
      if (!y || y < 1900 || y > 2100 || seen.has(y)) return;
      seen.add(y);
      out.push({
        year: y,
        spine: normalizeSpineColor(b.spine, BOOK_SPINE_PALETTE[i % BOOK_SPINE_PALETTE.length]),
        cover: String((b && b.cover) || "")
      });
    });
    return out.sort((a, b) => a.year - b.year);
  }

  function getYearBooks() {
    if (!Array.isArray(state.yearBooks) || !state.yearBooks.length) {
      state.yearBooks = normalizeYearBooks(YEARS.map((y, i) => ({ year: y, spine: BOOK_SPINE_PALETTE[i % BOOK_SPINE_PALETTE.length], cover: "" })));
    }
    return state.yearBooks;
  }

  function getYearOptions() {
    const set = new Set(YEARS.map(Number));
    getYearBooks().forEach(b => set.add(Number(b.year)));
    return Array.from(set).sort((a, b) => a - b);
  }

  function refreshHolidays() {
    try {
      HOLIDAYS = buildHolidayMap(getYearOptions());
    } catch (_) {}
  }

  function getYearBook(year) {
    const y = Number(year);
    return getYearBooks().find(b => b.year === y) || null;
  }

  function ensureYearBook(year) {
    const y = Number(year);
    if (!y || y < 1900 || y > 2100) return null;
    const found = getYearBook(y);
    if (found) return found;
    const list = getYearBooks();
    const entry = { year: y, spine: BOOK_SPINE_PALETTE[list.length % BOOK_SPINE_PALETTE.length], cover: "" };
    list.push(entry);
    list.sort((a, b) => a.year - b.year);
    refreshHolidays();
    return entry;
  }

  function yearSpineColor(year) {
    const found = getYearBook(year);
    if (found && found.spine) return found.spine;
    const idx = Math.max(0, getYearOptions().indexOf(Number(year)));
    return BOOK_SPINE_PALETTE[idx % BOOK_SPINE_PALETTE.length];
  }

  function countYearDays(year) {
    let days = 0;
    for (let m = 1; m <= 12; m++) {
      const maxDay = new Date(year, m, 0).getDate();
      for (let d = 1; d <= maxDay; d++) {
        if (getDayMeta(`${year}-${pad2(m)}-${pad2(d)}`).hasAny) days += 1;
      }
    }
    return days;
  }

  function daySummaryText(dateStr, meta) {
    const one = (meta && meta.log && meta.log.oneLine) ? String(meta.log.oneLine).trim() : "";
    if (one) return one;
    const arch = (state.archives || []).find(a => a.date === dateStr);
    if (arch && arch.title) return arch.title;
    if (meta && meta.hasAchieved) return "목표 · 버킷 달성";
    if (meta && meta.hasDiary) return "일기 기록";
    if (meta && meta.hasTodo) return "할일 기록";
    return "기록";
  }

  function dayDotsHtml(meta) {
    return [
      meta.hasDiary ? "var(--c-diary)" : "",
      meta.hasAchieved ? "var(--c-goal)" : "",
      meta.hasArchive ? "var(--c-archive)" : "",
      meta.hasTodo ? "var(--c-todo)" : ""
    ].filter(Boolean).map(c => `<i style="background:${c}"></i>`).join("");
  }

  function renderYearLegend() {
    return `
      <div class="nb-legend">
        <span><i style="background:var(--c-diary)"></i>일기</span>
        <span><i style="background:var(--c-goal)"></i>목표·버킷 달성</span>
        <span><i style="background:var(--c-archive)"></i>아카이브</span>
        <span><i style="background:var(--c-todo)"></i>할일</span>
      </div>
    `;
  }

  function renderYearCover(year, isActive, offset) {
    const y = Number(year);
    const days = countYearDays(y);
    const isThisYear = String(y) === TODAY_STR.slice(0, 4);
    return `
      <button class="nb-cover-btn ${isActive ? "is-active" : ""}" data-year="${y}" data-offset="${Number(offset) || 0}" onclick="openYearBook(${y})" aria-label="${y}년 노트 펼치기" title="${y}년 노트 펼치기">
        <span class="nb-cover nb-cover--year" style="--spine:${yearSpineColor(y)}">
          ${isThisYear ? `<span class="nb-year-now">올해</span>` : ""}
          ${(getYearBook(y) && getYearBook(y).cover)
            ? `<img class="nb-cover-photo" src="${getYearBook(y).cover}" alt="" /><span class="nb-cover-plate">${y}</span>`
            : `<span class="nb-year-plate"><b>${y}</b><i></i><span>MONTHLY NOTES</span></span>`}
          <span class="nb-cover-spine"></span>
          <span class="nb-cover-shine"></span>
          <span class="nb-cover-chip">${days}일</span>
        </span>
      </button>
    `;
  }

  function renderYearShelfMeta(year) {
    const y = Number(year);
    const days = countYearDays(y);
    const monthNow = String(y) === TODAY_STR.slice(0, 4) ? Number(TODAY_STR.slice(5, 7)) : 0;
    return `
      <div class="nb-book-meta">
        <h3>${y}년</h3>
        <div class="nb-book-info">기록 있는 날 ${days}일 · 12개월 노트${monthNow ? ` · 이번 달 ${monthNow}월` : ""}</div>
      </div>
    `;
  }

  function renderYearShelfActions(year) {
    const y = Number(year);
    return `
      <button class="nb-action primary" onclick="openYearBook(${y})"><span class="nb-action-icon">${NB_ICONS.book}</span>이 책 펼치기</button>
      <button class="nb-action" onclick="openYearBookModal()"><span class="nb-action-icon">${NB_ICONS.plus}</span>책 추가</button>
      <button class="nb-action" onclick="openYearBookModal(${y})"><span class="nb-action-icon">${NB_ICONS.edit}</span>편집</button>
    `;
  }

  function renderYearShelf() {
    const yearBooks = getYearBooks();
    yearShelfIndex = Math.min(Math.max(yearShelfIndex, 0), yearBooks.length - 1);
    const activeYear = yearBooks[yearShelfIndex] ? yearBooks[yearShelfIndex].year : YEARS[0];
    return `
      <div class="nb-stage nb-stage--shelf">
        <div id="nbYearShelfMeta">${renderYearShelfMeta(activeYear)}</div>
        <div class="nb-shelf">
          <div class="nb-shelf-track" id="nbYearShelfTrack">${shelfSlots(yearBooks.length, yearShelfIndex, shelfRadius()).map(slot => slot ? renderYearCover(yearBooks[slot.index].year, slot.offset === 0, slot.offset) : `<span class="nb-slot-empty" aria-hidden="true"></span>`).join("")}</div>
          <div class="nb-shelf-rail"></div>
        </div>
        <div class="nb-actions" id="nbYearShelfActions">${renderYearShelfActions(activeYear)}</div>
        ${renderYearLegend()}
      </div>
    `;
  }

  function selectYearShelf(year) {
    const yearBooks = getYearBooks();
    const idx = yearBooks.findIndex(b => b.year === Number(year));
    if (idx < 0) return;
    yearShelfIndex = idx;
    render();
  }

  function yearShelfStep(delta) {
    const yearBooks = getYearBooks();
    if (!yearBooks.length) return;
    selectYearShelf(yearBooks[(yearShelfIndex + delta + yearBooks.length) % yearBooks.length].year);
  }

  function openYearBook(year, monthIndex) {
    const y = Number(year);
    if (!y) return;
    if (!getYearBook(y)) ensureYearBook(y);
    yearShelfIndex = Math.max(0, getYearBooks().findIndex(b => b.year === y));
    yearBookYear = y;
    const isThisYear = String(y) === TODAY_STR.slice(0, 4);
    const fallbackMonth = isThisYear ? Number(TODAY_STR.slice(5, 7)) - 1 : 0;
    yearPageIndex = Number.isInteger(monthIndex) ? Math.min(11, Math.max(0, monthIndex)) : fallbackMonth;
    yearDayDate = "";
    yearMobileSide = "left";
    render();
  }

  // 그 연도 노트 안에서 하루 페이지 열기
  function openYearDay(dateStr) {
    const ds = String(dateStr || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) return;
    flushDiaryDraft();
    state.selectedDate = ds;
    state.activeTab = "year";
    ensureYearBook(Number(ds.slice(0, 4)));
    yearBookYear = Number(ds.slice(0, 4));
    yearPageIndex = Number(ds.slice(5, 7)) - 1;
    yearDayDate = ds;
    yearMobileSide = "left";
    saveState();
    render();
  }

  function closeYearDay() {
    yearDayDate = "";
    render();
  }

  function stepYearDay(delta) {
    if (!yearDayDate) return;
    openYearDay(shiftDate(yearDayDate, delta));
  }

  function openTodayYearBook() {
    openYearDay(TODAY_STR);
  }

  function closeYearBook() {
    yearBookYear = 0;
    yearPageIndex = 0;
    yearDayDate = "";
    render();
  }

  function openYearPage(idx, side) {
    yearPageIndex = Math.min(11, Math.max(0, Number(idx) || 0));
    yearDayDate = "";
    if (side === "right" || side === "left") yearMobileSide = side;
    render();
  }

  function yearPageStep(delta) {
    yearPageIndex = Math.min(11, Math.max(0, yearPageIndex + delta));
    yearMobileSide = "left";
    render();
  }

  function setYearMobileSide(side) {
    yearMobileSide = side === "right" ? "right" : "left";
    const spread = document.getElementById("nbYearSpread");
    if (spread) spread.dataset.side = yearMobileSide;
    document.querySelectorAll("#nbYearSpread ~ .nb-side-toggle button, .nb-side-toggle button[data-year-side]").forEach(b => {
      b.classList.toggle("active", b.dataset.yearSide === yearMobileSide);
    });
  }

  function collectMonthDays(year, month) {
    const maxDay = new Date(year, month, 0).getDate();
    const out = [];
    for (let d = 1; d <= maxDay; d++) {
      const ds = `${year}-${pad2(month)}-${pad2(d)}`;
      const meta = getDayMeta(ds);
      if (!meta.hasAny) continue;
      out.push({ dateStr: ds, day: d, dow: getDayOfWeek(ds), meta });
    }
    return out;
  }

  function renderMonthCalendar(year, month) {
    const firstDow = new Date(year, month - 1, 1).getDay();
    const maxDay = new Date(year, month, 0).getDate();
    const heads = ["일", "월", "화", "수", "목", "금", "토"];
    let cells = "";
    for (let i = 0; i < firstDow; i++) cells += `<span class="nb-day nb-day--empty" aria-hidden="true"></span>`;
    for (let d = 1; d <= maxDay; d++) {
      const ds = `${year}-${pad2(month)}-${pad2(d)}`;
      const dow = getDayOfWeek(ds);
      const hol = isHoliday(ds);
      const meta = getDayMeta(ds);
      const cls = [
        "nb-day",
        dow === 0 ? "is-sun" : dow === 6 ? "is-sat" : "",
        hol ? "is-holiday" : "",
        ds === TODAY_STR ? "is-today" : "",
        meta.hasAny ? "has-rec" : ""
      ].filter(Boolean).join(" ");
      cells += `
        <button class="${cls}" onclick="openYearDay('${ds}')" title="${escapeAttr(formatDateKo(ds))}" aria-label="${escapeAttr(formatDateKo(ds))}">
          <span class="nb-day-num">${d}</span>
          <span class="nb-day-dots">${dayDotsHtml(meta)}</span>
        </button>
      `;
    }
    return `
      <div class="nb-cal">
        <div class="nb-cal-head">
          ${heads.map((h, i) => `<span class="${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${h}</span>`).join("")}
        </div>
        <div class="nb-cal-grid">${cells}</div>
      </div>
    `;
  }

  function renderMonthRow(item) {
    const dowNames = ["일", "월", "화", "수", "목", "금", "토"];
    return `
      <button class="nb-month-row" onclick="openYearDay('${item.dateStr}')" title="이 날의 하루 기록 열기">
        <b>${item.day}일(${dowNames[item.dow]})</b>
        <span class="txt">${escapeHtml(daySummaryText(item.dateStr, item.meta))}</span>
        <span class="dots">${dayDotsHtml(item.meta)}</span>
      </button>
    `;
  }

  function renderYearReader(year) {
    const month = Math.min(11, Math.max(0, yearPageIndex)) + 1;
    const monthRecords = collectMonthDays(year, month);
    const monthIdx = month - 1;
    const monthHeads = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

    const leftPage = `
      <section class="nb-page nb-page--left">
        <div class="nb-page-inner">
          <div class="nb-month-head">
            <div>
              <div class="nb-month-name">${month}월</div>
              <div class="nb-month-year">${year} · ${monthHeads[monthIdx]}</div>
            </div>
            <span class="nb-month-badge">기록 ${monthRecords.length}일</span>
          </div>
          ${renderMonthCalendar(year, month)}
        </div>
        <span class="nb-page-no">${month} / 12</span>
      </section>
    `;

    const rightPage = `
      <section class="nb-page nb-page--right">
        <div class="nb-page-inner">
          <div class="nb-month-list-head">
            <b>${month}월의 기록</b>
            <span>${monthRecords.length}일</span>
          </div>
          ${monthRecords.length ? `
            <div class="nb-month-list">${monthRecords.map(renderMonthRow).join("")}</div>
          ` : `
            <div class="nb-month-empty">
              <p>이 달에는 아직 기록이 없습니다.</p>
              <button class="btn btn-sm" onclick="openYearDay('${year}-${pad2(month)}-01')">이 달 기록 시작하기</button>
            </div>
          `}
        </div>
        <span class="nb-page-no">${year} · ${month}월</span>
      </section>
    `;

    return `
      <div class="nb-stage">
        <div class="nb-reader-head">
          <button class="nb-back" onclick="closeYearBook()">${ICONS.chevLeft}책장</button>
          <div class="nb-reader-title">
            <b>${year}년 노트</b>
            <span>${month}월 · 기록 ${monthRecords.length}일</span>
          </div>
          <span class="nb-stage-count">${month} / 12</span>
        </div>
        <div class="nb-book">
          <button class="nb-nav prev" onclick="yearPageStep(-1)" ${yearPageIndex <= 0 ? "disabled" : ""} aria-label="이전 달">${ICONS.chevLeft}</button>
          <div class="nb-spread" id="nbYearSpread" data-side="${yearMobileSide}">
            <span class="nb-edge nb-edge--left"></span>
            <span class="nb-edge nb-edge--right"></span>
            ${leftPage}
            ${rightPage}
            <span class="nb-spine"></span>
            <span class="nb-rings"></span>
          </div>
          <button class="nb-nav next" onclick="yearPageStep(1)" ${yearPageIndex >= 11 ? "disabled" : ""} aria-label="다음 달">${ICONS.chevRight}</button>
        </div>
        <div class="nb-side-toggle">
          <button data-year-side="left" class="${yearMobileSide === "left" ? "active" : ""}" onclick="setYearMobileSide('left')">달력</button>
          <button data-year-side="right" class="${yearMobileSide === "right" ? "active" : ""}" onclick="setYearMobileSide('right')">기록 목록</button>
        </div>
        <div class="nb-actions">
          <button class="nb-action primary" onclick="openYearDay('${TODAY_STR}')"><span class="nb-action-icon">${NB_ICONS.pen}</span>오늘 기록</button>
        </div>
        ${renderYearLegend()}
      </div>
    `;
  }

  function renderYearView() {
    const year = Number(yearBookYear);
    if (yearDayDate) return renderYearDay(yearDayDate);
    if (year >= 1900) return renderYearReader(year);
    return renderYearShelf();
  }

  // 연력 · 일기: 노트 안에서 열리는 하루 페이지 (한 줄 요약 + 긴 일기 + 할일 + 달성)
  function renderYearDay(dateStr) {
    const d = dateStr;
    const dowNames = ["일", "월", "화", "수", "목", "금", "토"];
    const dow = getDayOfWeek(d);
    const y = d.slice(0, 4);
    const m = Number(d.slice(5, 7));
    const day = Number(d.slice(8, 10));
    const maxDay = new Date(Number(y), m, 0).getDate();
    const log = state.logs[d] || { oneLine: "", diary: "" };
    const isToday = d === TODAY_STR;

    const dayTodos = state.todos.filter(t => t.date === d);
    const doneGoals = state.goals.filter(g => g.done && g.doneDate === d);
    const doneBuckets = state.buckets.filter(b => b.done && b.doneDate === d);
    const dayArchives = state.archives.filter(a => a.date === d);
    const doneCount = doneGoals.length + doneBuckets.length + dayArchives.length;

    return `
      <div class="nb-stage">
        <div class="nb-reader-head">
          <button class="nb-back" onclick="closeYearDay()">${ICONS.chevLeft}${m}월 달력</button>
          <div class="nb-reader-title">
            <b>${m}월 ${day}일 <em>(${dowNames[dow]})</em></b>
            <span>${y}년${isToday ? " · 오늘" : ""} · 연력 한 줄 · 일기 · 할일</span>
          </div>
          <span class="nb-stage-count">${day} / ${maxDay}</span>
        </div>

        <div class="day-controls">
          <button class="stage-nav prev" onclick="stepYearDay(-1)" aria-label="이전 날">${ICONS.chevLeft}<span class="label">이전 날</span></button>
          <button class="stage-chip ${isToday ? "is-today" : ""}" onclick="openYearDay('${TODAY_STR}')">오늘</button>
          <button class="stage-nav next" onclick="stepYearDay(1)" aria-label="다음 날"><span class="label">다음 날</span>${ICONS.chevRight}</button>
        </div>

        <div class="day-stack">
          <section class="paper diary-note paper--dot">
            <div class="paper-label">${ICONS.diary}연력 한 줄 요약</div>
            <input type="text" id="oneLineInput" class="paper-input-line" placeholder="연력 칸에 표시될 한 줄..." value="${escapeAttr(log.oneLine || "")}" oninput="onDiaryInput()" aria-label="연력 한 줄 요약" />
            <div class="paper-rule"></div>
            <div class="paper-label">${ICONS.diary}${m}월 ${day}일의 긴 기록 · 일기</div>
            <textarea class="diary-area" id="diaryInput" placeholder="오늘 있었던 일, 생각, 감정을 자유롭게 길게 기록하세요..." oninput="onDiaryInput()" aria-label="긴 기록 일기">${escapeHtml(log.diary || "")}</textarea>
            <div class="diary-save-line">
              <span id="saveStatus" class="save-status">입력하면 자동으로 저장됩니다</span>
            </div>
          </section>

          <div class="day-side-grid">
            <section class="paper">
              <div class="paper-label">${ICONS.year}이 날의 할일</div>
              <div class="form-row" style="margin-bottom:8px;">
                <input type="text" id="dayTodoInput" style="flex:1; min-width:0;" placeholder="이 날짜에 할일 추가..." onkeydown="if (event.key === 'Enter') addDayTodo()" aria-label="할일 추가" />
                <button class="btn" onclick="addDayTodo()">추가</button>
              </div>
              <div class="item-list">
                ${dayTodos.length ? dayTodos.map(t => `
                  <div class="list-item ${t.done ? "done" : ""}">
                    <div class="item-left">
                      <input type="checkbox" class="chk" ${t.done ? "checked" : ""} onchange="toggleTodo('${t.id}')" aria-label="할일 완료" />
                      <div class="item-title tap-edit-target" onclick="openEditTodo('${t.id}')" title="탭하여 수정">${escapeHtml(t.title)}</div>
                    </div>
                    <button class="icon-btn danger" onclick="deleteItem('todos', '${t.id}')" title="삭제" aria-label="할일 삭제">${ICONS.trash}</button>
                  </div>
                `).join("") : `<p class="paper-empty">등록된 할일이 없습니다.</p>`}
              </div>
            </section>

            <section class="paper">
              <div class="paper-label">${ICONS.goals}이 날의 달성 · 아카이브</div>
              ${doneCount ? `
                <div class="item-list">
                  ${doneGoals.map(g => `<div class="list-item tap-edit-target" onclick="openEditGoal('${g.id}')" title="탭하여 수정"><div class="diary-figure"><span class="pill">${renderPictogram(getTopicIconKey(g.topic), 12)} 목표 · ${escapeHtml(g.topic)}</span><span class="item-title">${escapeHtml(g.title)}</span></div></div>`).join("")}
                  ${doneBuckets.map(b => `<div class="list-item tap-edit-target" onclick="openEditBucket('${b.id}')" title="탭하여 수정"><div class="diary-figure"><span class="pill">${renderPictogram(getBucketCatIconKey(b.category), 12)} 버킷 · ${escapeHtml(b.category)}</span><span class="item-title">${escapeHtml(b.title)}</span></div></div>`).join("")}
                  ${dayArchives.map(a => `<div class="list-item tap-edit-target" onclick="openEditArchive('${a.id}')" title="탭하여 수정"><div class="diary-figure"><span class="pill">${renderPictogram(getArchiveCatIconKey(a.category), 12)} 아카이브 · ${escapeHtml(a.category)}</span><span class="item-title">${escapeHtml(a.title)}</span></div></div>`).join("")}
                </div>
              ` : `<p class="paper-empty">이 날 달성한 목표·버킷이나 남긴 아카이브가 아직 없습니다.</p>`}
            </section>
          </div>
        </div>
      </div>
    `;
  }

  function onDiaryInput() {
    diaryPending = true;
    const st = document.getElementById("saveStatus");
    if (st) {
      st.textContent = "저장 중…";
      st.classList.add("saving");
    }
    clearTimeout(diaryTimer);
    diaryTimer = setTimeout(() => {
      diaryPending = false;
      saveDiaryDraft();
    }, 450);
  }

  function flushDiaryDraft() {
    if (!diaryPending) return;
    clearTimeout(diaryTimer);
    diaryPending = false;
    saveDiaryDraft();
  }

  function saveDiaryDraft() {
    const oneEl = document.getElementById("oneLineInput");
    const diaryEl = document.getElementById("diaryInput");
    if (!oneEl || !diaryEl) return;
    state.logs[state.selectedDate] = { oneLine: oneEl.value, diary: diaryEl.value };
    const ok = saveState();
    const st = document.getElementById("saveStatus");
    if (st) {
      st.classList.remove("saving");
      st.textContent = ok
        ? `자동 저장됨 · ${timeStr(lastSavedAt)}`
        : "저장 실패 · 설정에서 백업을 확인해 주세요";
    }
  }

  function addDayTodo() {
    const inp = document.getElementById("dayTodoInput");
    if (!inp) return;
    const title = inp.value.trim();
    if (!title) return;
    state.todos.unshift({ id: uid(), date: state.selectedDate, title, done: false });
    saveState();
    render();
  }

  // ---------- 카테고리 관리 ----------
  const CAT_KINDS = {
    goals: { label: "목표", filterKey: "goalTopicFilter", itemKey: "topic", iconFallback: "target", addIconDefault: "target" },
    bucket: { label: "버킷리스트", filterKey: "bucketCatFilter", itemKey: "category", iconFallback: "star", addIconDefault: "star" },
    archive: { label: "아카이브", filterKey: "archiveCatFilter", itemKey: "category", iconFallback: "folder", addIconDefault: "folder" }
  };

  function categoryListOf(kind) {
    if (kind === "goals") return state.topics;
    if (kind === "bucket") return state.bucketCategories;
    return state.archiveCategories;
  }

  function collectionOf(kind) {
    if (kind === "goals") return state.goals;
    if (kind === "bucket") return state.buckets;
    return state.archives;
  }

  function openCategoryManager(kind) {
    if (!CAT_KINDS[kind]) return;
    catManagerKind = kind;
    renderCategoryManager();
    document.getElementById("catModal").classList.add("open");
  }

  function closeCategoryManager() {
    catManagerKind = null;
    document.getElementById("catModal").classList.remove("open");
  }

  function refreshCategoryManager() {
    if (!catManagerKind) return;
    if (document.getElementById("catModal").classList.contains("open")) renderCategoryManager();
  }

  function renderCategoryManager() {
    const kind = catManagerKind;
    if (!kind) return;
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const items = collectionOf(kind);
    document.getElementById("catModalTitle").textContent = `${cfg.label} 카테고리 관리`;
    document.getElementById("catModalBody").innerHTML = `
      <p class="settings-hint" style="margin:0 0 10px;">이름이나 아이콘을 바꾸면 기존 항목에도 함께 반영됩니다.</p>
      <div class="cat-manage-list">
        ${list.length ? list.map((cat, idx) => {
          const count = items.filter(it => it[cfg.itemKey] === cat.name).length;
          return `
            <div class="cat-manage-row">
              <span class="cat-manage-name">${renderPictogram(cat.icon, 14)} ${escapeHtml(cat.name)} <span class="cat-manage-count">${count}</span></span>
              <span class="cat-manage-actions">
                <button class="btn btn-sm" onclick="openCategoryEdit('${kind}', ${idx})">수정</button>
                <button class="btn btn-sm btn-danger-outline" onclick="deleteCategory('${kind}', ${idx})">삭제</button>
              </span>
            </div>
          `;
        }).join("") : `<p class="settings-hint" style="margin:0;">아직 카테고리가 없습니다. 아래에서 추가하세요.</p>`}
      </div>
      <div class="cat-add-card">
        <h4>새 카테고리 추가</h4>
        ${renderIconPickerHtml("catAddIcon", cfg.addIconDefault)}
        <div class="cat-add-row">
          <input type="text" id="catAddName" placeholder="카테고리 이름" onkeydown="if (event.key === 'Enter') addCategoryFromManager()" />
          <button class="btn btn-primary" onclick="addCategoryFromManager()">추가</button>
        </div>
      </div>
    `;
  }

  function openCategoryEdit(kind, idx) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const target = list[idx];
    if (!target) return;
    openModal(`${cfg.label} 카테고리 수정`, `
      <div class="modal-field">
        <label>픽토그램 선택</label>
        ${renderIconPickerHtml("mCatIcon", target.icon)}
      </div>
      <div class="modal-field">
        <label>카테고리 이름 (기존 항목의 분류명도 함께 변경됩니다)</label>
        <input type="text" id="mCatName" value="${escapeAttr(target.name)}" />
      </div>
    `, () => {
      const newIcon = resolveIconKey(document.getElementById("mCatIcon").value, target.icon);
      const newName = document.getElementById("mCatName").value.trim();
      if (!newName) {
        alert("카테고리 이름을 입력해 주세요.");
        return false;
      }
      if (newName !== target.name && list.some(c => c.name === newName)) {
        alert("이미 같은 이름의 카테고리가 있습니다.");
        return false;
      }
      const oldName = target.name;
      list[idx] = { name: newName, icon: newIcon };
      if (state[cfg.filterKey] === oldName) state[cfg.filterKey] = newName;
      collectionOf(kind).forEach(item => {
        if (item[cfg.itemKey] === oldName) item[cfg.itemKey] = newName;
      });
      if (kind === "archive") {
        state.books.forEach(b => { if (b.category === oldName) b.category = newName; });
      }
      return true;
    });
  }

  function deleteCategory(kind, idx) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const target = list[idx];
    if (!target) return;
    const count = collectionOf(kind).filter(it => it[cfg.itemKey] === target.name).length;
    const msg = count > 0
      ? `‘${target.name}’ 카테고리를 삭제할까요? 이 카테고리에 속한 항목 ${count}개도 함께 삭제됩니다.`
      : `‘${target.name}’ 카테고리를 삭제할까요?`;
    if (!confirm(msg)) return;
    list.splice(idx, 1);
    if (state[cfg.filterKey] === target.name) state[cfg.filterKey] = "all";
    if (kind === "goals") state.goals = state.goals.filter(g => g.topic !== target.name);
    else if (kind === "bucket") state.buckets = state.buckets.filter(b => b.category !== target.name);
    else state.archives = state.archives.filter(a => a.category !== target.name);
    if (kind === "archive") {
      state.books.forEach(b => { if (b.category === target.name) b.category = ""; });
    }
    saveState();
    render();
    refreshCategoryManager();
  }

  function addCategoryFromManager() {
    const kind = catManagerKind;
    if (!kind) return;
    const cfg = CAT_KINDS[kind];
    const iconEl = document.getElementById("catAddIcon");
    const nameEl = document.getElementById("catAddName");
    const icon = resolveIconKey(iconEl ? iconEl.value : cfg.addIconDefault, cfg.iconFallback);
    const name = (nameEl ? nameEl.value : "").trim();
    if (!name) {
      if (nameEl) nameEl.focus();
      return;
    }
    const list = categoryListOf(kind);
    if (list.some(c => c.name === name)) {
      alert("이미 같은 이름의 카테고리가 있습니다.");
      return;
    }
    list.push({ name, icon });
    saveState();
    render();
    renderCategoryManager();
    const next = document.getElementById("catAddName");
    if (next) next.focus();
  }

  function ensureCategory(kind, name, icon) {
    const cfg = CAT_KINDS[kind];
    const list = categoryListOf(kind);
    const clean = String(name || "").trim() || "기타";
    const found = list.find(c => c.name === clean);
    if (!found) list.push({ name: clean, icon: resolveIconKey(icon || cfg.addIconDefault, cfg.iconFallback) });
    return clean;
  }

  function ensureTopicExists(name, icon = "target") {
    return ensureCategory("goals", name, icon);
  }

  // ---------- 목표 ----------
  function changeGoalTopicFilter(val) {
    state.goalTopicFilter = val;
    saveState();
    render();
  }

  function changeGoalYearFilter(val) {
    state.goalYearFilter = val === "all" ? "all" : normalizeYear(val);
    saveState();
    render();
  }

  function changeGoalPeriodFilter(val) {
    state.goalPeriodFilter = val;
    saveState();
    render();
  }

  function changeGoalSort(val) {
    state.goalSort = val;
    saveState();
    render();
  }

  function toggleGoalComposer() {
    showGoalComposer = !showGoalComposer;
    render();
  }

  function renderDoneDateControl(collection, id, doneDate) {
    return `
      <span class="done-date-inline" onclick="event.stopPropagation()">
        달성일:
        <input type="date" value="${escapeAttr(doneDate || TODAY_STR)}" onchange="updateDoneDate('${collection}', '${id}', this.value)" />
      </span>
    `;
  }

  function renderThumbList(images, removeFnName) {
    if (!images || images.length === 0) return `<span style="font-size:12px; color:var(--text-sub);">등록된 사진 없음</span>`;
    return images.map((src, i) => `
      <span class="thumb-wrap">
        <img src="${src}" alt="미리보기 ${i + 1}" />
        <button type="button" class="thumb-del-btn" onclick="${removeFnName}(${i})" title="삭제" aria-label="사진 삭제">&times;</button>
      </span>
    `).join("");
  }

  // 목표 뷰 (스테이지 + 종이 카드)
  function renderGoalsView() {
    let filtered = state.goals.filter(g => {
      const topicOk = state.goalTopicFilter === "all" || g.topic === state.goalTopicFilter;
      const yearOk = state.goalYearFilter === "all" || normalizeYear(g.year) === normalizeYear(state.goalYearFilter);
      const periodOk = state.goalPeriodFilter === "all" || normalizePeriod(g.period) === state.goalPeriodFilter;
      return topicOk && yearOk && periodOk;
    });

    if (state.goalSort === "undone") {
      filtered = [...filtered].sort((a, b) => Number(a.done) - Number(b.done));
    } else if (state.goalSort === "done") {
      filtered = [...filtered].sort((a, b) => Number(b.done) - Number(a.done));
    } else if (state.goalSort === "oldest") {
      filtered = [...filtered].reverse();
    }

    const totalCnt = filtered.length;
    const doneCnt = filtered.filter(g => g.done).length;
    const pct = totalCnt > 0 ? Math.round((doneCnt / totalCnt) * 100) : 0;

    const defaultAddTopic = state.goalTopicFilter === "all"
      ? (state.topics[0] ? state.topics[0].name : "")
      : state.goalTopicFilter;
    const defaultAddYear = state.goalYearFilter === "all" ? "2026" : normalizeYear(state.goalYearFilter);
    const defaultAddPeriod = state.goalPeriodFilter === "all" ? "연간" : state.goalPeriodFilter;

    return `
      <div class="nb-stage">
        <div class="stage-bar">
          <div class="stage-bar-lead">
            <div class="nb-stage-title">목표</div>
          </div>
          <span class="nb-stage-count">총 ${totalCnt}개</span>
        </div>

        <div class="stage-summary">
          <div class="summary-metrics">
            <span>현재 목표 <strong>${totalCnt}개</strong></span>
            <span>달성 완료 <strong>${doneCnt}개</strong></span>
            <span>달성률 <strong>${pct}%</strong></span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${pct}%;"></div>
          </div>
        </div>

        <div class="stage-chips">

  function addGoal() {

    const period = normalizePeriod(document.getElementById("goalPeriodSel").value);

    if (!title) {
      titleEl.focus();
      return;
    }
    state.goals.unshift({
      id: uid(),
      topic,
      year,
      period,
      title,
      note: document.getElementById("goalNoteInp").value.trim(),
      images: [],
      done: false,
      doneDate: ""
    });
    showGoalComposer = false;
    saveState();
    render();

  function changeBucketCatFilter(cat) {

    saveState();
    render();

  function toggleBucketComposer() {

    render();

  function renderBucketView() {
    let filtered = state.buckets.filter(b => state.bucketCatFilter === "all" || b.category === state.bucketCatFilter);
    if (state.bucketSort === "undone") {
      filtered = [...filtered].sort((a, b) => Number(a.done) - Number(b.done));

      filtered = [...filtered].reverse();

    const doneCnt = filtered.filter(b => b.done).length;

            const isAct = state.bucketCatFilter === cat.name;
            return `
              <button class="chip-btn ${isAct ? "active" : ""}" onclick="changeBucketCatFilter(${jsArg(cat.name)})">
                ${renderPictogram(cat.icon, 13)} ${escapeHtml(cat.name)} <span class="chip-count">${cnt}</span>

          <select class="year-select" onchange="changeBucketSort(this.value)" aria-label="정렬">
            <option value="newest" ${state.bucketSort === "newest" ? "selected" : ""}>최신순</option>
            <option value="oldest" ${state.bucketSort === "oldest" ? "selected" : ""}>오래된순</option>
            <option value="undone" ${state.bucketSort === "undone" ? "selected" : ""}>미달성 우선</option>
            <option value="done" ${state.bucketSort === "done" ? "selected" : ""}>달성 완료 우선</option>
          </select>
          <button class="btn btn-primary" onclick="toggleBucketComposer()">
            ${showBucketComposer ? "닫기" : "+ 새 버킷 추가"}
          </button>
        </div>

        ${showBucketComposer ? `
          <div class="card composer-card">
            <div class="composer-header">
              <h3 style="color:var(--c-bucket);">새 버킷리스트 등록</h3>
            </div>
            <div class="form-row">
              <select id="bucketCatSel" aria-label="버킷 카테고리">
                ${state.bucketCategories.map(c => `<option value="${escapeAttr(c.name)}" ${defaultCat === c.name ? "selected" : ""}>${escapeHtml(c.name)}</option>`).join("")}
              </select>
              <input type="text" id="bucketTitleInp" style="flex:1; min-width:190px;" placeholder="언젠가 꼭 해보고 싶은 버킷리스트..." onkeydown="if (event.key === 'Enter') addBucket()" />
              <input type="text" id="bucketNoteInp" style="flex:1; min-width:150px;" placeholder="세부 메모 (선택)" onkeydown="if (event.key === 'Enter') addBucket()" />
            </div>
            <div class="composer-footer">
              <div class="composer-actions">
                <button class="btn btn-primary" onclick="addBucket()">버킷 저장</button>
              </div>
            </div>

        ` : ""}

        ${filtered.length ? `
          <section class="paper bucket-sheet">
            ${filtered.map(b => `
              <div class="paper-row ${b.done ? "done" : ""}">
                <input type="checkbox" class="chk" ${b.done ? "checked" : ""} onchange="toggleAchieve('buckets', '${b.id}')" aria-label="달성 체크" />
                <div class="bucket-main tap-edit-target" onclick="openEditBucket('${b.id}')" title="탭하여 수정">
                  <div class="bucket-title">${escapeHtml(b.title)}</div>
                  <div class="bucket-meta">
                    <span class="pill">${renderPictogram(getBucketCatIconKey(b.category), 12)} ${escapeHtml(b.category)}</span>

                    ${b.done ? renderDoneDateControl("buckets", b.id, b.doneDate) : ""}
                  </div>
                </div>
                <button class="icon-btn danger" onclick="deleteItem('buckets', '${b.id}')" title="삭제" aria-label="버킷리스트 삭제">${ICONS.trash}</button>
              </div>

          </div>

    `;

  function addBucket() {
    const sel = document.getElementById("bucketCatSel");
    const category = sel && sel.value ? sel.value : ensureCategory("bucket", "경험", "star");
    const titleEl = document.getElementById("bucketTitleInp");

    if (!title) {
      titleEl.focus();
      return;
    }
    state.buckets.unshift({
      id: uid(),

      title,
      note: document.getElementById("bucketNoteInp").value.trim(),

      doneDate: ""
